# The eval corpus.
#
# Every document here is a REAL document, written by a person, under a licence that
# permits redistribution and modification. Each entry records where it came from, so
# a reader can check any of it, and so the licence obligation stays attached to the
# file it belongs to.
#
# WHY REAL DOCUMENTS
#
# The eval asks whether the skill makes a document easier to read. That question
# needs a document. An earlier version of this eval asked a model to WRITE a runbook
# in each arm, and then compared the three. That measured nothing: each arm invented
# different content, so content and form moved together and neither could be
# isolated. It also left `faithfulness.py` with no source to compare a rewrite
# against, which is the one check that guards rule PSTE-A1.
#
# Now every arm rewrites the SAME committed document, so only the form changes.
#
# RULES FOR ADDING A DOCUMENT
#
# 1. The licence MUST permit redistribution and modification. Allowed: CC0, public
#    domain, MIT, Apache-2.0, BSD, CC-BY-4.0. Nothing else. A document under a
#    no-derivatives or non-commercial licence cannot be rewritten here at all.
# 2. Record the URL, the author or project, the licence, and the date of retrieval.
# 3. Record the sha256 of the file as committed. `fetch.py --check` verifies it, so
#    an edit to a source document cannot pass unnoticed.
# 4. A rewrite is a MODIFICATION. For CC-BY, the eval output must say so, and
#    `report.py` prints the notice beside the text.
# 5. Keep the document whole where possible. An excerpt must say what it cut.
#
# DO NOT add a document that this project could not lawfully republish. The standard
# in `spec/` keeps no copy of restricted text, and the corpus holds to the same line.

# Each entry has this shape. Nothing is optional.
#
# - id: runbook-postgres-failover      # the file is <id>.md
#   type: runbook                      # matches the skill's artifact types
#   title: "Postgres failover procedure"
#   url: https://example.org/docs/failover.md
#   author: "Example Project contributors"
#   licence: Apache-2.0
#   retrieved: 2026-08-03
#   sha256: <64 hex characters>
#   words: 812
#   excerpt: false                     # true means the file is not the whole document
#   note: "what was cut, when excerpt is true"

