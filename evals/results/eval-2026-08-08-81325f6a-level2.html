se you can keep working, and bad, because you won't be able to debug the issue ", "line": 21, "column": 159, "excerpt_offset": 57, "severity": "MUST", "arbitrated": false, "offset": 1564, "token": "won't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "If you don't want to do that, there may be an editor command you can use to restart only  ", "line": 23, "column": 106, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 1720, "token": "don't"}, {"rule": "PSTE-N1", "message": "instruction is 25 words, limit 20", "excerpt": "Note that some       configurations keep the server alive for a while after the editor exi", "line": 23, "column": 197, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1811, "token": "Note"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Note that some       configurations keep the server alive for a while after the editor exi", "line": 23, "column": 289, "excerpt_offset": 92, "severity": "MUST", "arbitrated": false, "offset": 1903, "token": ";"}, {"rule": "PSTE-N2", "message": "description is 42 words, limit 25", "excerpt": "If you're confident the problem is with  CODE  , you can go straight to [#gopls]( URL     ", "line": 27, "column": 255, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2235, "token": "If"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're confident the problem is with  CODE  , you can go straight to [#gopls]( URL     ", "line": 27, "column": 258, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 2238, "token": "you're"}, {"rule": "PSTE-G7", "message": "nominalization 'description of'; use a verb", "excerpt": "If you're confident the problem is with  CODE  , you can go straight to [#gopls]( URL     ", "line": 27, "column": 486, "excerpt_offset": 231, "severity": "MUST", "arbitrated": true, "offset": 2466, "token": "description"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "We can't diagnose a problem from just a description.", "line": 31, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 2581, "token": "can't"}, {"rule": "PSTE-G4", "message": "perfect tense 'have configured'; use simple past", "excerpt": "Your editor and any settings you have configured (for example, your VSCode  CODE          ", "line": 33, "column": 37, "excerpt_offset": 33, "severity": "MUST", "arbitrated": false, "offset": 2755, "token": "have"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "It should have a  CODE                           log line near the beginning.", "line": 36, "column": 74, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 3007, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'It's'", "excerpt": "It's also helpful to tell us the timestamp the problem occurred, so we can find it the log", "line": 36, "column": 149, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3082, "token": "It's"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If you are uncomfortable sharing the package names of your code, you can share the  CODE  ", "line": 50, "column": 517, "excerpt_offset": 111, "severity": "MUST", "arbitrated": false, "offset": 4601, "token": "it's"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf you suspect that `gopls` <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is crashing&#x27;\">is</mark> crashing or not working correctly, please follow the troubleshooting steps below.\n\nIf `gopls` <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is using&#x27;\">is</mark> using too much memory, please follow the steps under [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md), which has more a more specific version of these instructions.\n\n1. Verify that your project is in good shape by working with it outside of your editor. Running a command like `go build ./...` in the workspace directory will compile everything. For modules, `go mod tidy` is another good check, though it may modify your `go.mod`.\n1. Check that your editor <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> showing any diagnostics that indicate a problem with your workspace. They may appear as diagnostics on a Go file&#x27;s package declaration, diagnostics in a go.mod file, or as a status or progress message. Problems in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date by following the [installation instructions](index.md#installation), then [restarting gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` has no persistent state, so restarting it will fix transient problems. This is good and bad: good, because you can keep working, and bad, because you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> be able to debug the issue until it recurs.\n\nIn most cases, closing all your open editors will guarantee that `gopls` is killed and restarted. If you <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to do that, there may be an editor command you can use to restart only `gopls`. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N1: instruction is 25 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> you may need to explicitly kill `gopls` if you use `vim`.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) that can help debug further. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 42 words, limit 25\">If</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident the problem is with `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come prepared with a short <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to be available to answer questions for a while afterward.\n\n## File an issue\n\nWe <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> diagnose a problem from just a description. When filing an issue, please include as much as possible of the following information:\n\n1. Your editor and any settings you <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G4: perfect tense &#x27;have configured&#x27;; use simple past\">have</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> also helpful to tell us the timestamp the problem occurred, so we can find it the log. See the [instructions](#capture-logs) for information on how to capture gopls logs.\n\nYour editor may have a command that fills out some of the necessary information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that will allow you to see profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You will then be able to view debug information by navigating to `localhost:6060`.\n\nIf you are unsure of how to pass a flag to `gopls` through your editor, please see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` automatically writes out memory debug information when your usage exceeds 1GB. This information can be found in your temporary directory with names like `gopls.1234-5GiB-withnames.zip`. On Windows, your temporary directory will be located at `%TMP%`, and on Unixes, it will be `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) with this memory debug information attached. If you are uncomfortable sharing the package names of your code, you can share the `-nonames` zip instead, but <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanti lag to  CODE   from your editor, see the [documentation ", "line": 46, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 3499, "token": "you're"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "On Windows the temporary directory is  CODE  ; on Unixes it's  CODE    , usually  CODE .", "line": 50, "column": 218, "excerpt_offset": 45, "severity": "MUST", "arbitrated": false, "offset": 3863, "token": ";"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "On Windows the temporary directory is  CODE  ; on Unixes it's  CODE    , usually  CODE .", "line": 50, "column": 230, "excerpt_offset": 57, "severity": "MUST", "arbitrated": false, "offset": 3875, "token": "it's"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If you'd rather not share your code's package names, you can send the  CODE      zip inste", "line": 50, "column": 444, "excerpt_offset": 101, "severity": "MUST", "arbitrated": false, "offset": 4089, "token": "it's"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf you think `gopls` <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is crashing&#x27;\">is</mark> crashing or misbehaving, work through the steps below.\n\nIf `gopls` <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is using&#x27;\">is</mark> using too much memory, jump to [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md), which gives a more specific version of these instructions.\n\n1. Check that your project is healthy outside your editor. Run `go build ./...` in the workspace directory to compile everything. For modules, `go mod tidy` is another good check, but note it may modify your `go.mod`.\n1. Look for editor diagnostics that point to a workspace problem. They can show up on a Go file&#x27;s package declaration, in a go.mod file, or as a status or progress message. A misconfigured workspace causes many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Update `gopls` using the [installation instructions](index.md#installation), then [restart gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. If nothing works, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` keeps no persistent state, so a restart clears up transient problems. That cuts both ways: you can get back to work, but you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> debug the issue until it happens again.\n\nClosing all open editors will kill and restart `gopls` in most cases. If you&#x27;d rather not do that, your editor may have a command to restart only `gopls`. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N1: instruction is 24 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits, so with `vim` you may need to kill `gopls` explicitly.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) \u2014 that can help you debug further. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 35 words, limit 25\">If</mark> <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> sure the problem is with `gopls`, go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Bring a short <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to stay available to answer questions afterward.\n\n## File an issue\n\nA description alone <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> enough for us to diagnose a problem. When filing an issue, include as much of the following as you can:\n\n1. Your editor and any settings <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue happened. It <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. Telling us the timestamp of the problem also helps, so we can find it in the log. See the [instructions](#capture-logs) for how to capture gopls logs.\n\nYour editor may have a command that fills in some of this information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may need to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nFor more detailed logs, start `gopls` with the `-rpc.trace` flag. To start <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N5: multi-word noun &#x27;debug server showing profiles&#x27; over 3 words\">a</mark> debug server showing profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`, then view the debug information at `localhost:6060`.\n\nIf <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not sure how to pass a flag to `gopls` from your editor, see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\nWhen usage goes over 1GB, `gopls` writes out memory debug information automatically. Look in your temporary directory for files named like `gopls.1234-5GiB-withnames.zip`. On Windows the temporary directory is `%TMP%`<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> on Unixes <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> `$TMPDIR`, usually `/tmp`. Please [file an issue](#file-an-issue) and attach this memory debug information. If you&#x27;d rather not share your code&#x27;s package names, you can send the `-nonames` zip instead, though <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful.", "factLoss": false, "fidelity": {"source_words": 759, "rewrite_words": 675, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 14 conditions, the rewrite 13. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "try to stay available to answer questions afterward", "problem": "The rewrite drops the duration qualifier \"for a while\" that the original attaches to staying available, silently narrowing the commitment being described.", "fix": "Restore the qualifier: \"try to stay available to answer questions for a while afterward.\"", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "lin e": null, "column": null, "offset": null}, {"rule": "PSTE-V6", "quote": "so a restart clears up transient problems", "problem": "\"restart\" is a listed term verb (Appendix B \u00a7B.2), and here it is used as a noun (\"a restart\"), which PSTE-V6 forbids.", "fix": "Rephrase with the verb form, e.g. \"so restarting it clears up transient problems.\"", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 21, "column": 36, "offset": 1238}], "semanticConfirmed": 0}, "pste": {"missing": false, "pass": false, "words": 627, "findings": [{"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "VS Code users should follow [their troubleshooting guide]( URL                            ", "line": 11, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 251, "token": "should"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "These can appear as diagnostics on the package declaration of a Go file, as diagnostics in", "line": 14, "column": 93, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 774, "token": "These"}, {"rule": "PSTE-G7", "message": "nominalization 'declaration of'; use a verb", "excerpt": "These can appear as diagnostics on the package declaration of a Go file, as diagnostics in", "line": 14, "column": 140, "excerpt_offset": 47, "severity": "MUST", "arbitrated": true, "offset": 821, "token": "declaration"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "If you are confident the problem is with  CODE  , you can go straight to [#gopls]( URL    ", "line": 27, "column": 271, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2161, "token": "If"}, {"rule": "PSTE-G7", "message": "nominalization 'description of'; use a verb", "excerpt": "If you are confident the problem is with  CODE  , you can go straight to [#gopls]( URL    ", "line": 27, "column": 494, "excerpt_offset": 223, "severity": "MUST", "arbitrated": true, "offset": 2384, "token": "description"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "It should have a  CODE                           log line near the beginning.", "line": 36, "column": 74, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 2914, "token": "should"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "If you do not want to share the package names of your code, you can share the  CODE      z", "line": 50, "column": 371, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4291, "token": "If"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf you think `gopls` crashes or works incorrectly, follow the troubleshooting steps below.\n\nIf `gopls` uses too much memory, follow the steps under [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md). That guide gives a more specific version of these instructions.\n\n1. Check that your project is in good shape. Work with it outside your editor. Run a command like `go build ./...` in the workspace directory to compile everything. For modules, `go mod tidy` is another good check, but it can change your `go.mod`.\n1. Check that your editor shows no diagnostics that indicate a problem with your workspace. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 27 words, limit 25\">These</mark> can appear as diagnostics on the package <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;declaration of&#x27;; use a verb\">declaration</mark> of a Go file, as diagnostics in a go.mod file, or as a status or progress message. A problem in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date. Follow the [installation instructions](index.md#installation), then [restart gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` keeps no persistent state, so a restart fixes a transient problem. This is good and bad. It is good because you can keep working. It is bad because you cannot debug the issue until it happens again.\n\nIn most cases, you close all your open editors and this stops and restarts `gopls`. If you do not want to do that, your editor may have a command that restarts only `gopls`. Some `vim` configurations keep the server alive for a while after the editor exits. If you use `vim`, you may need to stop `gopls` yourself.\n\n## Ask for help\n\nGophers Slack has active channels for each editor, like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS). These channels can help you debug further. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 30 words, limit 25\">If</mark> you are confident the problem is with `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come with a short <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue. Try to stay available to answer questions for a while afterward.\n\n## File an issue\n\nWe cannot diagnose a problem from a description alone. When you file an issue, include as much of the following information as possible:\n\n1. Your editor and any settings you configured. For example, your VSCode `settings.json` file.\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue happened. It <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. It also helps to tell us the timestamp when the problem happened, so we can find it in the log. See the [instructions](#capture-logs) for how to capture gopls logs.\n\nYour editor may have a command that fills out some of this information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor configuration to pass a `-logfile` flag to gopls.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that shows you profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You can then see debug information at `localhost:6060`.\n\nIf you are unsure how to pass a flag to `gopls` through your editor, see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` writes out memory debug information when your usage goes above 1GB. You can find this information in your temporary directory, with names like `gopls.1234-5GiB-withnames.zip`. On Windows, your temporary directory is at `%TMP%`. On Unixes, it is `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) and attach this memory debug information. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> you do not want to share the package names of your code, you can sh s tired, in a hurry, or not a native English speaker who skims a pasted Slack excerpt.\n\nPSTE restricts the vocabulary and the grammar. It sets one word per meaning, simple tenses only, short sentences, the active voice, named actors, and the result stated first. It targets README files, pull request descriptions, commit messages, runbooks, incident reports, and the chat output of an agent.\n\nThe standard follows the model of ASD-STE100, which is Simplified Technical English, used in maintenance manuals for aerospace. The authors wrote PSTE from scratch for software vocabulary such as `refactor`, `deploy`, `merge`, and `rollback`. They did not copy the aerospace dictionary of ASD, because that dictionary is trademarked and restricted.\n\n## Who it is for\n\nPSTE is for teams and individuals who want plain, unambiguous technical prose from an agent or from their own documents. Examples are release notes, runbooks, error messages, and any output that people paste around and read out of context.\n\nThe repository ships three parts:\n\n1. A spec at `spec/PSTE-1.md`, written in the style of an RFC with MUST, SHOULD, and MAY.\n2. A Claude Code skill at `skill/SKILL.md`, which makes an agent write in this style through a whole session.\n3. A linter at `lib/pste_lint.py`, which has zero dependencies and can run as a hook before a commit to check conformance.\n\n## What it does not claim\n\nThe repository is unusually insistent about its limits.\n\nPSTE does not make output more correct, more thoughtful, or smarter. It changes only the form, so that the text is easier to read. A document can pass every PSTE check and still be wrong or empty. The spec calls that result a defect, not an edge case.\n\nThe repository also does not claim proof of its own effect. The only evidence for human comprehension is a study from 1996 in the aviation industry. That study covered maintenance manuals written by humans, not software text and not text written by an AI.\n\nThe evaluation tooli  title=\"PSTE-G4: perfect tense &#x27;has been measured&#x27;; use simple past\">has</mark> been measured, what has not, and which measures the project rejected. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 29 words, limit 25\">I</mark> read through the project (<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a controlled-English writing standard called PSTE, modeled loosely on ASD-STE100) and traced every place it makes or examines the &quot;helps a reader&quot; claim. Here&#x27;s the honest picture, which is actually laid out with unusual candor in the repo itself.\n\n## What&#x27;s actually been measured\n\n**One real study backs the core claim, and <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> not about this project.** Chervak, Drury and Ouellette (1996) tested 175 aircraft technicians reading Simplified English aircraft workcards. Comprehension went from 76% to 86% overall, and from 69% to 87% for non-native English readers. That&#x27;s a genuine human-subjects result, and <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> the reason the project exists <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> but <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> scoped to aerospace maintenance text, written by humans, read by humans. Nothing about software documentation, nothing about machine-generated text.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 35 words, limit 25\">*</mark>*One weak pilot touches the actual use case (AI-generated controlled English).** A blog post experiment (woosal1337, linked in README.md and SOURCES.md) found a style rubric cut &quot;AI slop&quot; markers by half or more. The project&#x27;s own writeup is unusually blunt about the problems: <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 35 words, limit 25\">six</mark> prompts, one run each, a metric that counts the same markers the prompt tells the model to avoid, and on one of two models tested, a simpler rubric did just as well or better. The repo calls this &quot;a pilot, not proof&quot; <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> twice, in two different files.\n\n**Two homegrown proxy measures exist and run offline**, in `evals/`:\n- `readability.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010) \u2014 real research tying vocabulary coverage to comprehension scores, with 95%/98% coverage thresholds for supported <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V8: Latin abbreviation &#x27;vs.&#x27;; use &#x27;against&#x27;\">vs</mark>. independent reading.\n- `<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 31 words, limit 25\">faithfulness</mark>.py` checks whether a rewrite dropped or altered numbers, units, identifiers, negations, or obligations \u2014 guarding against the specific failure mode where a rewrite reads more smoothly but quietly loses a fact.\n\nBoth are explicitly labeled as proxies, not comprehension tests. And when I checked whether either has actually been run and recorded: `evals/results/` (the designated home for a committed run, per its own README) contains nothing but its own README<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 no `eval-&lt;date&gt;-&lt;commit&gt;.json` file exists. The project&#x27;s top-level README says so directly: &quot;No eval run<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G4: perfect tense &#x27;has happened&#x27;; use simple past\"> </mark>has happened... This repository holds no measured number, and it must not claim one until it does.&quot;\n\nOne wrinkle worth flagging: `evals/snapshots/` does contain a populated `results.json` and an HTML report, with real-looking model output across three arms.<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 38 words, limit 25\"> </mark>But one of those arms is called `baseline`, and the current `evals/README.md` explicitly says there is no baseline arm anymore (&quot;An arm with no instruction measured the difference between asking and not asking, which is not the question&quot;).<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 38 words, limit 25\"> </mark>That file looks like a leftover from an earlier version of the harness rather than a current, authoritative result<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 it<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\"> </mark>doesn&#x27;t match what the project says it measures today, so I<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;wouldn&#x27;t&#x27;\"> </mark>wouldn&#x27;t treat it as evidence of anything.\n\n## What has not been measured\n\n<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 28 words, limit 25\">The</mark> project is explicit that the one thing that would actually validate the claim <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a reader comprehending PSTE-written software text better than a control \u2014 has never been tested. `evals/FUTURE-WORK.md` designs this as<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N5: multi-word noun &#x27;future blind reading trial&#x27; over 3 words\"> </mark>a future blind reading trial: readers get one version of a document (control or PSTE) without knowing which, answer questions about it, and results get reported regardless of outcome. That trial<mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;hasn&#x27;t&#x27;\"> </mark>hasn&#x27;t run. Both `README.md` and `evals/README.md` state the same conclusion in almost identical words:<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N5: multi-word noun &#x27;honest claim right now&#x27; over 3 words\"> </mark>the honest claim right now is that PSTE text &quot;passes several independent automated checks,&quot; not that<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\"> </mark>it&#x27;s easier to read.\n\n## What was measured and rejected\n\n`evals/FUTURE-WORK.md` is a survey of readability-measurement approaches, with reasons for rejecting most of them:\n\n- <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N2: description is 31 words, limit 25\">*</mark>*Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write) \u2014 rejected as circular, since <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> just functions of word and sentence length, which the standard already regulates directly. Also cited: <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 26 words, limit 25\">Tanprasert</mark> &amp; Kauchak (2021) showing these scores can be gamed by mechanical sentence-cutting with no reader benefit, and a 2025 eye-tracking study finding they predict actual reading ease poorly.\n- <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Dale-Chall** \u2014 the &quot;least bad&quot; of that family (half its score comes from a word-familiarity list), but rejected because its 1948 word list flags ordinary software vocabulary as difficult. Noted as worth revisiting later with the project&#x27;s own word list substituted in.\n- <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N2: description is 42 words, limit 25\">*</mark>*LM surprisal/perplexity** \u2014 genuinely independent of the length-based rules, but rejected because it penalizes precise technical terms (rare words = high surprisal, even when a trained reader finds them clearest), and because Oh &amp; Schuler (2023) found lower-perplexity models actually fit human reading time worse.\n- **Automated cloze testing** \u2014 rejected because Jacobs, Grobol &amp; Tsang (2024) found model-generated completions diverge from real human response patterns.\n- **Reference-based metrics** (SARI, BLEU, LENS) \u2014 blocked for lack of gold-standard rewrites, and BLEU specifically is flagged as penalizing valid sentence-splitting, which the standard requires.\n- **LLM-as-judge** \u2014 held off for now, citing Liu <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V8: Latin abbreviation &#x27;et al.&#x27;; use &#x27;and others&#x27;\">et</mark> al. <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N2: description is 31 words, limit 25\">(</mark>2025) finding model judges agree more with each other than with humans and are least reliable specifically on simplicity judgments, plus a bias toward longer answers that cuts against a concision standard.\n\n<mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 37 words, limit 25\">Three</mark> more (an entailment-model layer on fact-checking, vocabulary coverage against a real frequency corpus via `wordfreq`, and a Dale-Chall variant using the project&#x27;s own word list) are marked as unblocked and worth building, but not yet built.\n\n## Bottom line\n\nThe evidence chain is: <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: desc ct exists. But its scope is aerospace maintenance text, written by humans and read by humans. It says nothing about software documentation and nothing about machine-generated text.\n\n**One weak pilot touches the actual use case: <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">AI-generated</mark> controlled English.** A blog post experiment (woosal1337, linked in README.md and SOURCES.md) found that a style rubric cut &quot;AI slop&quot; markers by half or more. The project&#x27;s own writeup is blunt about the problems: <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 36 words, limit 25\">six</mark> prompts, one run each, a metric that counts the same markers the prompt tells the model to avoid, and, on one of the two models tested, a simpler rubric did just as well or better. The repo calls this &quot;a pilot, not proof&quot; <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> twice, in two different files.\n\n**Two homegrown proxy measures exist and run offline**, in `evals/`:\n\n- `readability.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010). That is real research tying vocabulary coverage to comprehension scores, with 95%/98% coverage thresholds for supported <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V8: Latin abbreviation &#x27;vs.&#x27;; use &#x27;against&#x27;\">vs</mark>. independent reading.\n- `faithfulness.py` checks whether a rewrite dropped or altered numbers, units, identifiers, negations, or obligations. It guards against the specific failure mode where a rewrite reads more smoothly but quietly loses a fact.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Both</mark> are explicitly labeled proxies, not comprehension tests. And neither <mark id=\"f9\" class=\"hit\" data-i=\"9\" title ontrol or PSTE, without knowing whic<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X1: semicolon; write two sentences\">h</mark>; they answer questions about it; results get reported regardless of outcome. That trial has not run. Both `README.md` and `evals/README.md` state the same conclusion in almost identical words:<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N5: multi-word noun &#x27;honest claim right now&#x27; over 3 words\"> </mark>the honest claim right now is that PSTE text &quot;passes several independent automated checks,&quot; not that it is easier to read.\n\n## What was considered and rejected\n\n`evals/FUTURE-WORK.md` surveys readability-measurement approaches and gives reasons for rejecting most of them:\n\n- <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 32 words, limit 25\">*</mark>*Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write) \u2014 rejected as circular, since they are just functions of word and sentence length, which the standard already regulates directly. Also cited: <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 26 words, limit 25\">Tanprasert</mark> &amp; Kauchak (2021), showing these scores can be gamed by mechanical sentence-cutting with no reader benefit, and a 2025 eye-tracking study finding they predict actual reading ease poorly.\n- **Dale-Chall** \u2014 the &quot;least bad&quot; of that family, since half its score comes from a word-familiarity list. Rejected because its 1948 word list flags ordinary software vocabulary as difficult. Noted as worth revisiting later with the project&#x27;s own word list substituted in.\n- <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N2: description is 44 words, limit 25\">*</mark>*LM surprisal/perplexity** \u2014 genuinely independent of the length-based rules, but rejected because it penalizes precise technical terms (rare words score high limit 6\">---</mark>\nmodel: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-08-03\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\nquestion: |\n  Read the repository at /repo and explain what evidence supports the claim that its controlled English helps a reader. Cover what <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G4: perfect tense &#x27;has been measured&#x27;; use simple past\">has</mark> been measured, what has not, and which measures the project rejected. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 27 words, limit 25\">I</mark> read the project <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a controlled-English writing standard called PSTE, modeled loosely on ASD-STE100 \u2014 and traced every place it makes or examines the &quot;helps a reader&quot; claim. The repo lays this out with unusual candor.\n\n## What has been measured\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 26 words, limit 25\">*</mark>*One real study backs the core claim, and it is not about this project.** Chervak, Drury and Ouellette (1996) tested 175 aircraft technicians reading Simplified English aircraft workcards. Comprehension rose from 76% to 86% overall, and from 69% to 87% for non-native English readers. That is a genuine human-subjects result, and it is why the project exists. But it covers aerospace maintenance text, written by humans and read by humans. It says nothing about software documentation or machine-generated text.\n\n**One weak pilot touches the actual use case: <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 28 words, limit 25\">AI-generated</mark> controlled English.** A blog post experiment (woosal1337, linked in README.md and SOURCES.md) found that a style rubric cut &quot;AI slop&quot; markers by half or more. The project&#x27;s own writeup is blunt about the problems: six prompts, one run each, and a metric that counts the same markers the prompt tells the model to avoid. On one of the two models tested, a simpler rubric did just as well or better. The repo calls this &quot;a pilot, not proof&quot; <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> twice, in two different files.\n\n**Two homegrown proxy measures exist and run offline**, in `evals/`:\n\n- `readability.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010). That is real research tying vocabulary coverage to comprehension scores, with 95%/98% coverage thresholds for supported <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> independent reading.\n- `faithfulness.py` checks whether a rewrite dropped or altered numbers, units, identifiers, negations, or obligations. It guards against the failure mode where a rewrite reads more smoothly but quietly loses a fact.\n\nBoth are labeled as proxies, not comprehension tests. Neither <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G4: perfect tense &#x27;has been run&#x27;; use simple past\">has</mark> been run and recorded. `evals/results/` is the designated home for a committed run, per its own README, and it contains nothing but that README<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 no `eval-&lt;date&gt;-&lt;commit&gt;.json` file exists. The top-level README says so directly: &quot;No eval run<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G4: perfect tense &#x27;has happened&#x27;; use simple past\"> </mark>has happened... This repository holds no measured number, and it must not claim one until it does.&quot;\n\nOne wrinkle is worth flagging. `evals/snapshots/` does contain a populated `results.json` and an HTML report, with real-looking model output across three arms. One of those arms is called `baseline`, but the current `evals/README.md` says there is no baseline arm anymore:<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 35 words, limit 25\"> </mark>&quot;An arm with no instruction measured the difference between asking and not asking, which is not the question.&quot; That file looks like a leftover from an earlier version of the harness, not a current result. It does not match what the project says it measures today, so I would not treat it as evidence of anything.\n\n## What has not been measured\n\nThe project is explicit that the one thing that would validate the claim has never been tested: a reader comprehending PSTE-written software text better than a control. `evals/FUTURE-WORK.md` designs this as<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N5: multi-word noun &#x27;future blind reading trial&#x27; over 3 words\"> </mark>a future blind reading trial. Readers get one version of a document, control or PSTE, without knowing which. They answer questions about it, and the results get reported whatever the outcome. That trial has not run.\n\nBoth `README.md` and `evals/README.md` state the same conclusion in almost identical words. The honest claim right now is that PSTE text &quot;passes several independent automated checks,&quot; not that it is easier to read.\n\n## What was measured and rejected\n\n`evals/FUTURE-WORK.md` surveys readability-measurement approaches and gives reasons for rejecting most of them:\n\n- **Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write) \u2014 rejected as circular. They are functions of word and sentence length, which the standard already regulates directly. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 30 words, limit 25\">The</mark> file also cites Tanprasert &amp; Kauchak (2021), showing these scores can be gamed by mechanical sentence-cutting with no reader benefit, and a 2025 eye-tracking study finding they predict actual reading ease poorly.\n- **Dale-Chall** \u2014 the least bad of that family, since half its score comes from a word-familiarity list. Rejected because its 1948 word list flags ordinary software vocabulary as difficult. Noted as worth revisiting later with the project&#x27;s own word list substituted in.\n- **LM surprisal/perplexity** \u2014 genuinely independent of the length-based rules, but rejected because it penalizes precise technical terms. Rare words score high on surprisal even when a trained reader finds them clearest. Also rejected because Oh &amp; Schuler (2023) found that lower-perplexity models fit human reading time worse.\n- **Automated cloze testing** \u2014 rejected because Jacobs, Grobol &amp; Tsang (2024) found that model-generated completions diverge from real human response patterns.\n- **Reference-based metrics** (SARI, BLEU, LENS) \u2014 blocked for lack of gold-standard rewrites. BLEU specifically is flagged as penalizing valid sentence-splitting, which the standard requires.\n- **LLM-as-judge** \u2014 held off for now. The file cites Liu <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V8: Latin abbreviation &#x27;et al.&#x27;; use &#x27;and others&#x27;\">et</mark> al. (2025), who found that model judges agree more with each other than with humans and are least reliable specifically on simplicity judgments. It also notes a bias toward longer answers, which cuts against a concision standard.\n\nThree more are marked as unblocked and worth building, but not yet built: an entailment-model layer on fact-checking, vocabulary coverage against a real frequency corpus via `wordfreq`, and a Dale-Chall variant using the project&#x27;s own word list.\n\n## Bottom line\n\nThe evidence chain runs like this. One solid but off-domain human study <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> aerospace, human-written, human-read \u2014 motivates the project. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-L1: stacked hedging: might, suggests\">One</mark> thin, self-critiqued pilot suggests the idea might transfer to LLM output. Two offline proxy metrics exist to check vocabulary difficulty and fact preservation, but have never been run and recorded on this project&#x27;s own corpus. The actual test that would settle the question <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> human readers, blind, answering comprehension questions \u2014 is designed on paper and unrun. The project says this about itself more plainly than most similar projects do.", "factLoss": false, "fidelity": {"source_words": 999, "rewrite_words": 987, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 3 conditions, the rewrite 2. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-N4", "quote": "Rejected because its 1948 word list flags ordinary software", "problem": "The sentence omits its subject (who or what rejected Dale-Chall), leaving a fragment a tired or non-native reader must reconstruct.", "fix": "Write \"The project rejected Dale-Chall because its 1948 word list flags ordinary software vocabulary as difficult.\"", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 42, "column": 107, "offset": 4893}, {"rule": "PSTE-A1", "quote": "not a current result rk id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.). It can run as a CLI over files (table or JSON output), or be dropped into a pre-commit hook <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it exits 1 whenever there are findings.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 57 words, limit 25\">Coverage</mark> includes sentence/paragraph length limits, contractions, semicolons/em-dashes, passive voice, perfect tense, stacked auxiliaries, `-ing` main verbs, nominalizations, phrasal verbs, Latin abbreviations, marketing adjectives, modal ambiguity (`should`), multi-word noun clusters, stacked hedging, and <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> when the doc uses BCP 14 keywords \u2014 a set of checks (`PSTE-K1`\u2013`K3`) that catches non-standard negation forms, actor-less passive requirements, and the ambiguous `MAY NOT`.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 34 words, limit 25\">It</mark> reads its vocabulary (approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, term verbs) from `spec/wordlist.yaml` and `spec/terms.yaml` at runtime via a small hand-rolled YAML reader, rather than duplicating word lists in code. `tools/build_binary.py` can also bake that vocabulary into `EMBEDDED_VOCAB` so<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;packaged single-file build needs&#x27; over 3 words\"> </mark>a packaged single-file build needs no `spec/` directory alongside it.\n\n`<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 52 words, limit 25\">--self-test</mark>` runs an internal conformance suite <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clau question: |\n  Read the repository at /repo and write the release notes for version 0.1.0. Cover what a user gets, how to install it, the known limits, and what is not ready yet. Return the release notes as your reply. Do not create a file. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\nI have what I need. Here are the release notes for PSTE 0.1.0:\n\n---\n\n# PSTE 0.1.0\n\nPSTE (Programming Simplified Technical English) is a controlled-English writing standard for software prose, plus a Claude Code skill and a standalone linter that enforce it. This is the first tagged release: the standard, the checker, the skill, and the persistence hooks are all in place and working.\n\n## What you get\n\n- <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 35 words, limit 25\">*</mark>*A written standard** (`spec/PSTE-1.md`) \u2014 an RFC-style document with numbered MUST/SHOULD/MAY rules covering sentence length, active voice, tense, banned constructs (contractions, semicolons, filler, marketing adjectives), and a required approved-vocabulary list at the strictest level.\n- **A vocabulary list** \u2014 about 270 word-list entries covering roughly 1,160 words and their synonyms, generated into `spec/appendix-*.md` from the source YAML files.\n- **A standalone linter** (`lib/pste_lint.py`) that checks any Markdown file against the rules and prints PASS/FAIL with line-level findings. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> dependency-free, needs only Python 3.8+, and can also build into a single-file binary via `tools/build_binary.py`.\n- <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 46 words, limit 25\">*</mark>*A Claude Code skill** (`skill/SKILL.md`) with three enforcement levels (`lite`, `pste`, `strict`), commands (`/pste`, `/pste-lint`), and hooks that r e claim about readability is thin.** This project leans on one study with human subjects (Chervak and others, 1996). That study covers manuals for aerospace maintenance, not software documents, and human writers, not the output of a model. The one study about LLMs that the project cites is a pilot with six prompts from a third party. It is a pointer, not proof.\n\n## What is not ready yet\n\n- **No trial of comprehension <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;has run&#x27;; use simple past\">has</mark> run.** The project states its own honest claim in its documents: PSTE text passes some automated checks. The project does not claim that a person reads it more easily. `evals/FUTURE-WORK.md` holds the design for a real blind trial of reading, but nobody<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G4: perfect tense &#x27;has run&#x27;; use simple past\"> </mark>has run it.\n- **The eval harness that uses a model <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has produced&#x27;; use simple past\">has</mark> produced no committed run.** `evals/run.py` exists and works. `evals/results/` holds no output from a run yet, so you cannot point to a comparison between PSTE and a plain prompt.\n- **Only one model was tested.** Every informal measurement reflects that one model alone. The project notes say that results vary by model, and nobody <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;has checked&#x27;; use simple past\">has</mark> checked that here yet.\n- The release deliberately leaves out several proxy measures for judging readability: entailment checking, scoring of vocabulary against a corpus of frequency, and a model as judge. `evals/FUTURE-WORK.md` scopes them as future work. They do not ship.", "factLoss": true, "fidelity": {"source_words": 826, "rewrite_words": 845, "findings": [{"kind": "number", "severity": "critical", "message": "'0.1.0' is missing. The rewrite has '1'."}, {"kind": "number", "severity": "critical", "message": "'1' is missing. The rewrite has '0.1.0'."}, {"kind": "identifier", "severity": "critical", "message": "`LLM` is missing from the rewrite."}], "critical": 3, "warnings": 0, "faithful": false}, "semantic": [{"rule": "PSTE-D4", "quote": "They ban contractions, semicolons, filler, and marketing adjectives", "problem": "Four parallel banned constructs (and, in the prior sentence, three parallel rule categories: sentence length, active voice, tense) are packed into a prose sentence instead of a bulleted list, even though PSTE-D4 requires a bulleted list for three or more parallel items.", "fix": "Turn the banned constructs and the rule categories into short bulleted lists instead of comma-separated prose.", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 7, "column": 166, "offset": 512}, {"rule": "PSTE-V4", "quote": "The linter checks conformance, not quality", "problem": "The same tool (`lib/pste_lint.py`) is called both \"the linter\" and \"the checker\" throughout the document, so a reader cannot tell whether these are one tool or two different tools.", "fix": "Pick one name, such as \"the linter,\" and use it every time this tool is mentioned.", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 2, "of": 3, "agreement": 0.67, "located": true, "line": 52, "column": 5, "offset": 3194}], "semanticConfirmed": 0}}, "passes": {"control": {"findings": [12, 11, 11], "passed": 0, "of": 3, "rate": 0, "mean": 11.3}, "pste": {"findings": [7, 7, 8], "passed": 0, "of": 3, "rate": 0, "mean": 7.3}}}}};
const pick = document.getElementById("pick");
const grid = document.getElementById("grid");
const meta = document.getElementById("meta");
const prov = document.getElementById("prov");
const ask = document.getElementById("ask");
const overviewPane = document.getElementById("overview");
const docpick = document.getElementById("docpick");
const tabOverview = document.getElementById("tab-overview");
const tabDocuments = document.getElementById("tab-documents");
const ids = Object.keys(DATA.results);

prov.textContent = DATA.git && DATA.git.short
  ? DATA.source + "  \u2014  commit " + DATA.git.short
      + " on " + (DATA.git.branch || "?")
  : DATA.source + "  \u2014  no provenance recorded";

for (const id of ids) {
  const o = document.createElement("option");
  o.value = id;
  o.textContent = id + "  (" + DATA.results[id].category + ")";
  pick.append(o);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

const STATUS_LABEL = {
  confirmed: "confirmed", "low-agreement": "low agreement", rejected: "rejected",
};

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also
// need reasons").
function semanticSectionHtml(a) {
  const rows = a.semantic || [];
  if (!rows.length) return "";
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span></span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed").length;
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>
      <p class="hint">A model read this text for what a regular expression cannot
      check. ${confirmedN} of ${rows.length} row(s) are CONFIRMED (agreement at or
      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.</p>
      <ol>${items}</ol>
    </div>`;
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    const verdict = a.pass
      ? '<span class="verdict pass">PASS</span>'
      : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

// ---- Overview -------------------------------------------------------------

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);
  bits.push("<b>passes</b>" + r.passes);
  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);
  bits.push("<b>level</b>" + DATA.level);
  if (r.sourceModels && r.sourceModels.length)
    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
  if (r.failures) bits.push('<b>failures</b><span class="cell-fail">'
      + r.failures + "</span>");

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      // Every pass, and the share of them that conform. One draw cannot separate a
      // real change from ordinary variance, so the runs are shown beside the count.
      let sub = c.rules + " rule" + (c.rules === 1 ? "" : "s");
      if (c.of > 1) {
        sub += ' <span class="rate">' + c.passed + "/" + c.of + " pass "
             + c.rate + "%</span>"
             + '<div class="runs">' + c.runs.join(" \u00b7 ") + "</div>";
      }
      // Fact loss reads apart from the conformance count: a clean-but-lossy
      // cell (0 findings, factLoss true) must not look like a plain PASS, and
      // a lossy-and-non-conforming cell must show both, not just one number.
      const factTag = c.factLoss
        ? ' <span class="verdict factloss" title="faithfulness.py: a fact from '
          + 'the source is missing. Detects dropped tokens, not changed '
          + 'meaning.">FACT LOSS</span>'
        : "";
      // A CONFIRMED judge finding (semantic_lint.py) fails the verdict the same
      // way fact loss does. Low-agreement and rejected rows never do — they are
      // audit material, visible only on the document view.
      const semTag = c.semanticConfirmed
        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      const semSub = c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";
      body += '<td class="' + (c.pass ? "cell-pass" : "cell-fail") + win + '">'
            + (c.pass ? "PASS" : c.findings) + factTag + semTag
            + '<div class="cell-sub">' + sub + "</div>" + semSub
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  // Real documents and synthetic ones are totalled separately, and both stay
  // visible. Real is the headline: it is what generalises to writing this
  // project did not itself produce. Synthetic is secondary, not hidden.
  function totalRow(label, totals) {
    let row = '<tr><td class="doc">' + esc(label) + "</td>";
    for (const a of arms) {
      const t = totals[a] || {pass:0,total:0,findings:0,runPass:0,runTotal:0,factLoss:0,semanticConfirmed:0};
      if (!t.total) { row += "<td>-</td>"; continue; }
      let f = t.pass + "/" + t.total + " docs";
      if (t.runTotal > t.total) {
        f += '<div class="rate">' + t.runPass + "/" + t.runTotal + " runs "
           + Math.round(t.runPass * 100 / t.runTotal) + "%</div>";
      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      row += "<td>" + t.findings + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth);

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. FACT LOSS marks a cell where faithfulness.py found a number, unit, "
    + "identifier, negation, or obligation missing against the source (PSTE-A1) "
    + "— that check catches dropped tokens, not changed meaning, so its "
    + "absence is not proof the rewrite is faithful. The green outline marks the "
    + "arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
</body>
</html>
