xcerpt": "Do a full cluster repair by running the  CODE                 command on each node in each", "line": 63, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2129, "token": "Do"}, {"rule": "PSTE-G1", "message": "passive voice 'are repaired'; name the actor", "excerpt": "Do a full cluster repair by running the  CODE                 command on each node in each", "line": 63, "column": 158, "excerpt_offset": 157, "severity": "MUST", "arbitrated": false, "offset": 2286, "token": "are"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "The specific frequency of repair that's right for your cluster, of\ncourse, depends on seve", "line": 65, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2302, "token": "The"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "However, if you're just starting out", "line": 66, "column": 49, "excerpt_offset": 12, "severity": "MUST", "arbitrated": false, "offset": 2417, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "you don't want to run incremental repairs, a full repair every 5 days is", "line": 69, "column": 5, "excerpt_offset": 4, "severity": "MUST", "arbitrated": false, "offset": 2589, "token": "don't"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "At a minimum, repair should be run often enough that the gc grace period\nnever expires on ", "line": 72, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2682, "token": "At"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "At a minimum, repair should be run often enough that the gc grace period", "line": 72, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "offset": 2703, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With a default gc grace period of 10 days, repairing every", "line": 74, "column": 16, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "offset": 2834, "token": "a"}, {"rule": "PSTE-D2", "message": "paragraph has 22 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 80, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3025, "token": "-pr"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "data, but doesn't do any streaming.", "line": 93, "column": 13, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 3716, "token": "doesn't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "a full repair should be run.", "line": 95, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 3849, "token": "should"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full repairs, and incremental repairs.\nFull repairs operate over all of the data in the token range being\nrepaired. Incremental repairs only repair data that&#x27;s been written since\nthe previous incremental repair.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">Incremental</mark> repairs are the default repair type, and if run regularly,\ncan significantly reduce the time and io cost of performing a repair.\nHowever, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> important to understand that once an incremental repair\nmarks data as repaired, it <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> try to repair it again. This is fine\nfor syncing up missed writes, but it <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> protect against things like\ndisk corruption, data loss by operator error, or bugs in Cassandra. For\nthis reason, full repairs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> still be run occasionally.\n\n== Automated Repair Scheduling\n\nSince repair can result in a lot of disk and network io, it has\ntraditionally not been run automatically by Cassandra.\n\nIn the latest version of Cassandra, a new feature called\nxref:managing/operating/auto_repair.adoc[auto repair] was introduced to\nallow Cassandra to submit and manage repairs automatically on a schedule.\n\nThe <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G7: nominalization &#x27;introduction of&#x27;; use a verb\">introduction</mark> of this feature does not interfere with existing repair\nfunctionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nRepairs can also be run by the operator via nodetool.\n\nIncremental repair is the default and is run with the following command:\n\n[source,none]\n----\nnodetool repair\n----\n\nA full repair can be run with the following command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nAdditionally, repair can be run on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr even on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node being repaired<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it does not repair the whole cluster.\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">By</mark> default, repair operates on all token ranges replicated by the node on which repair is run, causing duplicate work when running it on every node. Avoid duplicate work by using the `-pr` flag to repair only the &quot;primary&quot; ranges on a node. \n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N1: instruction is 28 words, limit 20\">Do</mark> a full cluster repair by running the `nodetool repair -pr` command on each node in each datacenter in the cluster, until all of the nodes and datacenters <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;are repaired&#x27;; name the actor\">are</mark> repaired. \n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> specific frequency of repair that&#x27;s right for your cluster, of\ncourse, depends on several factors. However, if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out\nand looking for somewhere to start, running an incremental repair every\n1-3 days, and a full repair every 1-3 weeks is probably reasonable. If\nyou <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to run incremental repairs, a full repair every 5 days is\na good place to start.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">At</mark> a minimum, repair <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run often enough that the gc grace period\nnever expires on unrepaired data. Otherwise, deleted data could\nreappear. With <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">a</mark> default gc grace period of 10 days, repairing every\nnode in your cluster at least once every 7 days will prevent this, while\nproviding enough slack to allow for delays.\n\n== Other Options\n\n`<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 22 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being\n  repaired. A primary range is just a token range for which a node is\n  the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that would occur for the given\n  repair command. This builds the merkle trees, and prints the expected\n  streaming activity, but does not actually do any streaming. By\n  default, incremental repairs are estimated, add the `--full` flag to\n  estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Similar\n  to `--preview`, this builds and compares merkle trees of repaired\n  data, but <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> do any streaming. This is useful for\n  troubleshooting. If this shows that the repaired data is out of sync,\n  a full repair <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 500, "findings": [{"rule": "PSTE-N3", "message": "contraction 'won't'", "excerpt": "once an incremental repair marks data as repaired, it won't try to repair it again.", "line": 10, "column": 82, "excerpt_offset": 54, "severity": "MUST", "arbitrated": false, "offset": 432, "token": "won't"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "That's fine for syncing up missed writes, but it doesn't protect against disk corruption, ", "line": 10, "column": 161, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 511, "token": "doesn't"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "The repair command repairs token ranges only on the node being repaired; it does not repai", "line": 55, "column": 72, "excerpt_offset": 71, "severity": "MUST", "arbitrated": false, "offset": 1568, "token": ";"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "Or, if you don't want incremental repairs at all, a full repair every 5 days.", "line": 66, "column": 14, "excerpt_offset": 11, "severity": "MUST", "arbitrated": false, "offset": 2165, "token": "don't"}, {"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "At a minimum, repair often enough that the gc grace period never expires on unrepaired dat", "line": 68, "column": 40, "excerpt_offset": 39, "severity": "MUST", "arbitrated": true, "offset": 2272, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With the default gc grace period of 10 days, repairing every node at least once every 7 da", "line": 68, "column": 139, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "offset": 2371, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 21 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 72, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2529, "token": "-pr"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "are estimated by default; add the  CODE    flag to estimate a full", "line": 80, "column": 27, "excerpt_offset": 24, "severity": "MUST", "arbitrated": false, "offset": 2981, "token": ";"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full and incremental.\n\n* *Full repairs* cover all data in the token range being repaired.\n* *Incremental repairs* cover only data written since the previous incremental repair.\n\nIncremental repair is the default. Run regularly, it significantly reduces the time and io cost of a repair.\n\nBe aware of the trade-off: once an incremental repair marks data as repaired, it <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> try to repair it again. That&#x27;s fine for syncing up missed writes, but it <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> protect against disk corruption, data loss by operator error, or bugs in Cassandra. Run full repairs occasionally for that reason.\n\n== Automated Repair Scheduling\n\nRepair can cause a lot of disk and network io, so Cassandra has traditionally not run it automatically.\n\nThe latest version of Cassandra adds\nxref:managing/operating/auto_repair.adoc[auto repair], which lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with existing repair functionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nOperators can also run repairs via nodetool.\n\nIncremental repair (the default):\n\n[source,none]\n----\nnodetool repair\n----\n\nFull repair:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nA single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nSpecific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n=== Scope: one node, not the cluster\n\nThe repair command repairs token ranges only on the node being repaired<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it does not repair the whole cluster.\n\nBy default, repair operates on all token ranges replicated by the node it runs on, which duplicates work when you run it on every node. Use the `-pr` flag to repair only the &quot;primary&quot; ranges on a node and avoid that duplicate work.\n\nTo do a full cluster repair, run `nodetool repair -pr` on each node in each datacenter, until all nodes and datacenters are repaired.\n\n=== How often to repair\n\nThe right frequency depends on several factors. Reasonable starting points:\n\n* Incremental repair every 1-3 days, plus a full repair every 1-3 weeks.\n* Or, if you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want incremental repairs at all, a full repair every 5 days.\n\nAt a minimum, repair often enough that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. Otherwise, deleted data could reappear. With <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">the</mark> default gc grace period of 10 days, repairing every node at least once every 7 days prevents this and leaves enough slack for delays.\n\n== Other Options\n\n`<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-D2: paragraph has 21 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being\n  repaired. A primary range is just a token range for which a node is\n  the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that would occur for the given\n  repair command. It builds the merkle trees and prints the expected\n  streaming activity, but does no actual streaming. Incremental repairs\n  are estimated by default<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> add the `--full` flag to estimate a full\n  repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Like\n  `--preview`, it builds and compares merkle trees of repaired data\n  without streaming. Useful for troubleshooting. If it shows the\n  repaired data is out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": true, "fidelity": {"source_words": 628, "rewrite_words": 520, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 9 conditions, the rewrite 6. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 15 -> 14, some/most 2 -> 3)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "doesn't protect against disk corruption, data loss by operator error", "problem": "The rewrite drops the original's 'things like' before this list, turning a non-exhaustive set of examples into what reads as the complete list of gaps incremental repair leaves.", "fix": "Restore the qualifier: 'it doesn't protect against things like disk corruption, data loss by operator error, or bugs in Cassandra.'", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 10, "column": 161, "offset": 511}, {"rule": "PSTE-N4", "quote": "Specific tables:", "problem": "The command-intro sentences throughout this section were shortened into bare fragments ('Full repair:', 'A single keyspace:', 'Specific tables:'), omitting the subject and verb the original full sentences had.", "fix": "Write full sentences, e.g. 'Repair specific tables with the following command:'.", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 46, "column": 1, "offset": 1356}, {"rule": "PSTE-D5", "quote": "disk corruption, data loss by operator error, or bugs in Cassandra", "problem": "Three parallel items (a set of things repair does not protect against) are hidden inside one prose sentence instead of a bulleted list a tired reader can scan.", "fix": "Pull the three items into a bulleted list: disk corruption, data loss by operator error, and bugs in Cassandra.", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 2, "of": 3, "agreement": 0.67, "located": true, "line": 10, "column": 185, "offset": 535}, {"rule": "PSTE-L4", "quote": "Incremental repair (the default):", "problem": "The fact that incremental repair is the default is already stated in the opening paragraph, and this is not a warning, so PSTE-L4's repeat exception does not apply.", "fix": "Drop the parenthetical here and rely on the earlier statement, e.g. just 'Incremental repair:'.", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 25, "column": 1, "offset": 1131}, {"rule": "PSTE-N6", "quote": "on a node and avoid that duplicate work", "problem": "Coordinating 'Use the -pr flag...' with 'and avoid that duplicate work' reads as two imperative instructions joined in one sentence rather than one instruction with its purpose.", "fix": "Split into two sentences or subordinate the result: 'Use the -pr flag to repair only the primary ranges on a node. This avoids duplicate work.'", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 57, "column": 192, "offset": 1800}], "semanticConfirmed": 0}, "pste": {"missing": false, "pass": false, "words": 568, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "At a minimum, run repair often enough that the gc grace period never expires on unrepaired", "line": 57, "column": 44, "excerpt_offset": 43, "severity": "MUST", "arbitrated": true, "offset": 2474, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 14 sentences, limit 6", "excerpt": "CODE                     ::\n  Limits repair to the 'primary' token ranges of the node that", "line": 61, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2760, "token": "-pr"}], "html": "== Incremental and Full Repairs\n\nCassandra has 2 types of repair: full repair and incremental repair. A full repair covers all the data in the token range that you repair. An incremental repair covers only the data written since the previous incremental repair.\n\nIncremental repair is the default type. Run it regularly, and it can reduce the time and io cost of a repair by a lot.\n\nBut once an incremental repair marks data as repaired, it does not repair that data again. This is fine to sync missed writes. It does not protect against disk corruption, data loss by operator error, or bugs in Cassandra. So you must still run a full repair sometimes.\n\n== Automated Repair Scheduling\n\nRepair can cause a lot of disk io and network io. For this reason, Cassandra has not run repair automatically in the past.\n\nThe latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.adoc[auto repair]. This feature lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with the existing repair functionality that you start with nodetool.\n\n== Submitting Repairs Using Nodetool\n\nThe operator can also run repairs with nodetool.\n\nIncremental repair is the default. Run it with this command:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with this command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nYou can also run repair on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nYou can run repair on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs token ranges on the node that you repair. It does not repair the whole cluster.\n\nBy default, repair covers all token ranges that the node replicates. This causes duplicate work when you run it on every node. Use the `-pr` flag to repair only the &quot;primary&quot; ranges on a node, and you avoid the duplicate work.\n\nTo repair the full cluster, run the `nodetool repair -pr` command on each node in each datacenter. Continue until you repair all the nodes and all the datacenters.\n\nThe right frequency of repair for your cluster depends on several factors. If you start out and need a first choice, an incremental repair every 1-3 days and a full repair every 1-3 weeks is likely reasonable. If you do not want to run incremental repairs, a full repair every 5 days is a good first choice.\n\nAt a minimum, run repair often enough that <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. If it expires, deleted data can reappear. The default gc grace period is 10 days. Repair every node in your cluster at least once every 7 days to prevent this. The 7 day period gives you enough slack for delays.\n\n== Other Options\n\n`<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 14 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Limits repair to the &#x27;primary&#x27; token ranges of the node that you repair. A primary range is a token range for which a node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming for the given repair command. This builds the merkle trees and shows the expected streaming activity. It does no streaming. It estimates incremental repairs by default. Add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Checks that the repaired data is the same across all nodes. Like `--preview`, this builds and compares merkle trees of repaired data, but does no streaming. This helps you troubleshoot. If it shows that the repaired data is out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": true, "fideli uthor": "The Kubernetes Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 766, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'is taking'", "excerpt": "The first step in debugging a Pod is taking a look at it.", "line": 3, "column": 35, "excerpt_offset": 34, "severity": "MUST", "arbitrated": false, "offset": 54, "token": "is"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "There should be messages from the scheduler about why it can not schedule your pod.", "line": 20, "column": 7, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 656, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "**You don't have enough resources**:", "line": 23, "column": 9, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 760, "token": "don't"}, {"rule": "PSTE-G4", "message": "perfect tense 'have exhausted'; use simple past", "excerpt": "You may have exhausted the supply of CPU", "line": 23, "column": 48, "excerpt_offset": 8, "severity": "MUST", "arbitrated": false, "offset": 799, "token": "have"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "**You are using  CODE     **:", "line": 28, "column": 9, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 1086, "token": "are"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "If a Pod is stuck in the  CODE     state, then it has been scheduled to a worker node,", "line": 36, "column": 51, "excerpt_offset": 50, "severity": "MUST", "arbitrated": false, "offset": 1501, "token": "has"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "but it can't run on that machine.", "line": 37, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 1546, "token": "can't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "should be informative.", "line": 38, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1624, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "Make sure you are using the latest version.", "line": 62, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 2726, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "In other words, you should allow Pods with existing violations", "line": 70, "column": 39, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 3166, "token": "should"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "Once your pod has been scheduled, the methods described in", "line": 76, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 3396, "token": "has"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If your pod is not behaving as you expected, it may be that there was an error in your\npod", "line": 82, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3607, "token": "If"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "pod description (e.g.", "line": 83, "column": 18, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "offset": 3711, "token": "e"}, {"rule": "PSTE-N5", "message": "multi-word noun 'command line you intended it' over 3 words", "excerpt": "will not use the command line you intended it to use.", "line": 87, "column": 14, "excerpt_offset": 13, "severity": "MUST", "arbitrated": true, "offset": 4049, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "The next thing to check is whether the pod on the apiserver\nmatches the pod you meant to c", "line": 101, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4625, "token": "The"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "matches the pod you meant to create (e.g.", "line": 102, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 4722, "token": "e"}], "html": "### Debugging Pods\n\nThe first step in debugging a Pod <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is taking&#x27;\">is</mark> taking a look at it. Check the current\nstate of the Pod and recent events with the following command:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`?\nHave there been recent restarts?\n\nContinue debugging depending on the state of the pods.\n\n#### My pod stays pending\n\nIf a Pod is stuck in `Pending` it means that it can not be scheduled onto a node.\nGenerally this is because there are insufficient resources of one type or another\nthat prevent scheduling. Look at the output of the `kubectl describe ...` command above.\nThere <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be messages from the scheduler about why it can not schedule your pod.\nReasons include:\n\n* **You <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have enough resources**: You may <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;have exhausted&#x27;; use simple past\">have</mark> exhausted the supply of CPU\n  or Memory in your cluster, in this case you need to delete Pods, adjust resource\n  requests, or add new nodes to your cluster. See [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/)\n  for more information.\n\n* **You <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: When you bind a Pod to a `hostPort` there are a\n  limited number of places that pod can be scheduled. In most cases, `hostPort`\n  is unnecessary, try using a Service object to expose your Pod.  If you do require\n  `hostPort` then you can only schedule as many Pods as there are nodes in your Kubernetes cluster.\n\n\n#### My pod stays waiting\n\nIf a Pod is stuck in the `Waiting` state, then it <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node, \nbut it <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run on that machine. Again, the information from `kubectl describe ...`\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be informative. The most common cause of `Waiting` pods is a failure to pull the image.\nThere are three things to check:\n\n* Make sure that you have the name of the image correct.\n* Have you pushed the image to the registry?\n* Try to manually pull the image to see if the image can be pulled. For example,\n  if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n\n#### My pod stays terminating\n\nIf a Pod is stuck in the `Terminating` state, it means that a deletion has been\nissued for the Pod, but the control plane is unable to delete the Pod object.\n\nThis typically happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/)\nand there is an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/)\ninstalled in the cluster that prevents the control plane from removing the\nfinalizer.\n\nTo identify this scenario, check if your cluster has any\nValidatingWebhookConfiguration or MutatingWebhookConfiguration that target\n`UPDATE` operations for `pods` resources.\n\nIf the webhook is provided by a third-party:\n- Make sure you <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the corresponding provider.\n\nIf you are the author of the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on\n  `UPDATE` operations. For example, changes to containers are usually not allowed.\n- For a validating webhook, make sure that your validation policies only apply\n  to new changes. In other words, you <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> allow Pods with existing violations\n  to pass validation. This allows Pods that were created before the validating\n  webhook was installed to continue running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled, the methods described in\n[Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/)\nare available for debugging.\n\n#### My pod is running but not doing what I told it to do\n\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> your pod is not behaving as you expected, it may be that there was an error in your\npod description (<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `mypod.yaml` file on your local machine), and that the error\nwas silently ignored when you created the pod.  Often a section of the pod description\nis nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.\nFor example, if you misspelled `command` as `commnd` then the pod will be created but\nwill not use <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended it&#x27; over 3 words\">the</mark> command line you intended it to use.\n\nThe first thing to do is to delete your pod and try creating it again with the `--validate` option.\nFor example, run `kubectl apply --validate -f mypod.yaml`.\nIf you misspelled `command` as `commnd` then will give an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&gt;\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">The</mark> next thing to check is whether the pod on the apiserver\nmatches the pod you meant to create (<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. in a yaml file on your local machine).\nFor example, run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml` and then\nmanually compare the original pod description, `mypod.yaml` with the one you got\nback from apiserver, `mypod-on-apiserver.yaml`. There will typically be some\nlines on the &quot;apiserver&quot; version that are not on the original version. This is\nexpected. However, if there are lines on the original that are not on the apiserver\nversion, then this may indicate a problem with your pod spec.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 560, "findings": [{"rule": "PSTE-N3", "mess \" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> enough resources of some kind. Check the output of the `kubectl describe ...` command above <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the scheduler <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> say why it <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> schedule your pod. Common reasons:\n\n* **Not enough resources**: Your cluster may be out of CPU or Memory. Delete Pods, adjust resource requests, or add nodes. See the [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/) for more.\n\n* **You <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: Binding a Pod to a `hostPort` limits where it can be scheduled. `hostPort` is usually unnecessary \u2014 try a Service object to expose your Pod instead. If you do need `hostPort`, you can only schedule as many Pods as there are nodes in your cluster.\n\n#### My pod stays waiting\n\nA Pod stuck in `Waiting` <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node but <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run there. Again, `kubectl describe ...` <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> tell you why. The most common cause is a failure to pull the image. Check three things:\n\n* Is the image name correct?\n* Have you pushed the image to the registry?\n* Can you pull the image manually? For example, with Docker on your s/configuration/manage-resources-containers/) for more information.\n\n* **You use `hostPort`**: When you bind a Pod to a `hostPort`, the scheduler has few places to put that Pod. In most cases you do not need `hostPort`. Use a Service object instead to expose your Pod. If you do need `hostPort`, then you can schedule only as many Pods as there are nodes in your Kubernetes cluster.\n\n#### My pod stays waiting\n\nA Pod that stays in `Waiting` is scheduled to a worker node, but it cannot run on that machine. Again, the output of `kubectl describe ...` tells you more. The most common cause is a failure to pull the image.\n\nCheck three things:\n\n1. Make sure the name of the image is correct.\n2. Check that you pushed the image to the registry.\n3. Pull the image by hand to see whether the pull works. For example, if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nA Pod that stays in `Terminating` has a deletion request, but the control plane cannot delete the Pod object.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 33 words, limit 25\">This</mark> normally happens when the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) in the cluster stops the control plane from removing that finalizer.\n\nTo find this case, check whether your cluster has a ValidatingWebhookConfiguration or a MutatingWebhookConfiguration that targets `UPDATE` operations for `pods` resources.\n\nIf a third party gives you the webhook:\n\n1. Make sure you use the latest version.\n2. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G8: phrasal verb &#x27;turn off&#x27;; use &#x27;disable&#x27;\">Turn</mark> off the webhook for `UPDATE` operations.\n3. Report an issue to the provider.\n\nIf you wrote the webhook yourself:\n\n* For a mutating webhook, make sure it never changes immutable fields on `UPDATE` operations. For example, the API usually does not allow changes to containers.\n* For a validating webhook, make sure your validation policies apply only to new changes. That is, you must let a Pod with <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;existing violation pass validation&#x27; over 3 words\">an</mark> existing violation pass validation. This lets Pods that you created before you installed the validating webhook continue to run.\n\n#### My pod is crashing or otherwise unhealthy\n\nAfter the scheduler places your Pod, you can use the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/).\n\n#### My pod is running but not doing what I told it to do\n\nIf your Pod does not behave as you expected, your Pod description may hold an error. For example, the error may be in the `mypod.yaml` file on your local machine. Kubernetes can ignore such an error without a message when you create the Pod. Often a section of the Pod description is nested wrongly, or a key name is typed wrongly, so the key is ignored. For example, if you spell `command` as `commnd`, then Kubernetes creates the Pod, but the Pod does not use the command line that you intended.\n\nFirst, delete your Pod and create it again with the `--validate` option. For example, run `kubectl apply --validate -f mypod.yaml`. If you spelled `command` as `commnd`, this gives an error like this one:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&gt;\n\nNext, check whether the Pod on the apiserver matches the Pod you meant to create. For example, the Pod you meant to create is in a YAML file on your local machine. Run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver ntly"}, {"rule": "PSTE-G1", "message": "passive voice 'are queued'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 107, "excerpt_offset": 40, "severity": "MUST", "arbitrated": false, "offset": 1625, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'is elected'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 152, "excerpt_offset": 85, "severity": "MUST", "arbitrated": false, "offset": 1670, "token": "is"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "A network partition divides the etcd cluster into two parts; one with a member majority an", "line": 35, "column": 141, "excerpt_offset": 59, "severity": "MUST", "arbitrated": false, "offset": 2941, "token": ";"}, {"rule": "PSTE-N5", "message": "multi-word noun 'minority side automatically recognizes' over 3 words", "excerpt": "Once the network partition clears, the minority side automatically recognizes the leader f", "line": 39, "column": 36, "excerpt_offset": 35, "severity": "MUST", "arbitrated": true, "offset": 3562, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'failed bootstrapped cluster like recovering' over 3 words", "excerpt": "Of course, it is possible to recover a failed bootstrapped cluster like recovering a runni", "line": 45, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": true, "offset": 3984, "token": "a"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A machine fails when its hardware or software malfunctions. Multiple machines fail together when there are power failures or network issues. Multiple kinds of failures can also happen at once<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it is almost impossible to enumerate all possible failure cases.\n\nIn this section, we catalog kinds of failures and discuss how etcd is designed to tolerate these failures. Most users, if not all, can map a particular failure into one kind of failure. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, the etcd cluster can still accept requests and make progress without any major disruption. For example, two follower failures will not affect <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster\u2019s operation. However, clients will lose connectivity to the failed members. Client libraries <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users for read requests by automatically reconnecting to other members. Operators <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to increase due to the reconnections.\n\n## Leader failure\n\nWhen a leader fails, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster automatically elects&#x27; over 3 words\">the</mark> etcd cluster automatically elects a new leader. The election does not happen <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark> once the leader fails. It takes about an election timeout to elect a new leader since the failure detection model is timeout based.\n\nDuring the leader election the cluster cannot process any writes. Write requests sent during the election <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued for processing until a new leader <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\nWrites already sent to the old leader but not yet committed may be lost. The new leader has the power to rewrite any uncommitted entries from the previous leader. From the user perspective, some write requests might time out after a new leader election. However, no committed writes are ever lost.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before the granted TTL even if it was granted by the old leader.\n\n## Majority failure\n\nWhen the majority members of the cluster fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can only recover from a majority failure once the majority of members become available. If a majority of members cannot come back online, then the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires due to server side unavailability.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one with a member majority and the other with a member minority. The majority side becomes the available cluster and the minority side is unavailable. There is no \u201csplit-brain\u201d in etcd because cluster members are explicitly added/removed with each such change is approved by the current majority of members.\n\nIf the leader is on the majority side, then from the majority point of view the failure is a minority follower failure. If the leader is on the minority side, then it is a leader failure. The leader on the minority side steps down and the majority side elects a new leader.\n\nOnce the network partition clears, <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;minority side automatically recognizes&#x27; over 3 words\">the</mark> minority side automatically recognizes the leader from the majority side and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap is only successful if all required members successfully start. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nOf course, it is possible to recover <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N5: multi-word noun &#x27;failed bootstrapped cluster like recovering&#x27; over 3 words\">a</mark> failed bootstrapped cluster like recovering a running cluster. However, it almost always takes more time and resources to recover that cluster than bootstrapping a new one, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 651, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd's tolerance ", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "---"}, {"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "Failures happen often in a large deployment of machines.", "line": 7, "column": 34, "excerpt_offset": 33, "severity": "MUST", "arbitrated": true, "offset": 137, "token": "deployment"}, {"rule": "PSTE-N5", "message": "multi-word noun 'particular failure onto one' over 3 words", "excerpt": "Most users, if not all, can map a particular failure onto one of these kinds.", "line": 9, "column": 129, "excerpt_offset": 32, "severity": "MUST", "arbitrated": true, "offset": 554, "token": "a"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster still accepts' over 3 words", "excerpt": "When fewer than half of the followers fail, the etcd cluster still accepts requests and ma", "line": 13, "column": 45, "excerpt_offset": 44, "severity": "MUST", "arbitrated": true, "offset": 780, "token": "the"}, {"rule": "PSTE-G7", "message": "nominalization 'operation of'; use a verb", "excerpt": "For example, two follower failures will not affect the operation of a five member etcd clu", "line": 13, "column": 185, "excerpt_offset": 55, "severity": "MUST", "arbitrated": true, "offset": 920, "token": "operation"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "For read requests, client libraries should hide these interruptions from users by automati", "line": 13, "column": 322, "excerpt_offset": 36, "severity": "MUST", "arbitrated": false, "offset": 1057, "token": "should"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Operators should expect the system load on the other members to rise because of those reco", "line": 13, "column": 423, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 1158, "token": "should"}, {"rule": "PSTE-V9", "message": "marketing adjective 'instant'", "excerpt": "The election does not happen the instant the leader fails.", "line": 17, "column": 107, "excerpt_offset": 33, "severity": "MUST", "arbitrated": false, "offset": 1375, "token": "instant"}, {"rule": "PSTE-G1", "message": "passive voice 'are queued'; name the actor", "excerpt": "Write requests sent during the election are queued until a new leader is elected.", "line": 19, "column": 107, "excerpt_offset": 40, "severity": "MUST", "arbitrated": false, "offset": 1622, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'is elected'; name the actor", "excerpt": "Write requests sent during the election are queued until a new leader is elected.", "line": 19, "column": 137, "excerpt_offset": 70, "severity": "MUST", "arbitrated": false, "offset": 1652, "token": "is"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Writes already sent to the old leader but not yet committed may be lost, because the new l", "line": 21, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1665, "token": "Writes"}, {"rule": "PSTE-N5", "message": "multi-word noun 'old leader granted it' over 3 words", "excerpt": "This mechanism ensures a lease will not expire before its granted TTL, even if the old lea", "line": 23, "column": 145, "excerpt_offset": 79, "severity": "MUST", "arbitrated": true, "offset": 2120, "token": "the"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "If any failure happens during bootstrapping, remove the data directories on all members an", "line": 43, "column": 79, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3731, "token": "If"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures happen often in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A single machine fails when its hardware or software malfunctions. Several machines fail at once when there are power failures or network issues. Different kinds of failures can also happen at the same time, so it is almost impossible to list every possible case.\n\nThis section catalogs the kinds of failures and explains how etcd is designed to tolerate them. Most users, if not all, can map <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;particular failure onto one&#x27; over 3 words\">a</mark> particular failure onto one of these kinds. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without major disruption. For example, two follower failures will not affect the <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;operation of&#x27;; use a verb\">operation</mark> of a five member etcd cluster. Clients do lose connectivity to the failed members, though. For read requests, client libraries <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users by automatically reconnecting to other members. Operators <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to rise because of those reconnections.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not happen the <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> the leader fails. Because the failure detection model is based on timeouts, electing a new leader takes about one election timeout.\n\nThe cluster cannot process any writes during the leader election. Write requests sent during the election <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued until a new leader <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 30 words, limit 25\">Writes</mark> already sent to the old leader but not yet committed may be lost, because the new leader has the power to rewrite any uncommitted entries from the previous leader. From the user&#x27;s point of view, some write requests might time out after a new leader election. No committed writes are ever lost, however.\n\nThe new leader extends the timeouts of all leases automatically. This mechanism ensures a lease will not expire before its granted TTL, even if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;old leader granted it&#x27; over 3 words\">the</mark> old leader granted it.\n\n## Majority failure\n\nWhen the majority of the cluster&#x27;s members fail, the etcd cluster fails and cannot accept any more writes.\n\nThe etcd cluster can only recover from a majority failure once a majority of members become available again. If a majority of members cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends the timeouts of all leases automatically. This mechanism ensures no lease expires because of server side unavailability.\n\n## Network partition\n\nA network partition resembles either a minor followers failure or a leader failure. A partition splits the etcd cluster into two parts: one with a majority of members and one with a minority. The majority side becomes the available cluster, and the minority side is unavailable. etcd has no &quot;split-brain&quot; problem, because members are added and removed explicitly and the current majority of members approves each such change.\n\nIf the leader is on the majority side, the majority sees the failure as a minority follower failure. If the leader is on the minority side, it is a leader failure: the leader on the minority side steps down, and the majority side elects a new leader.\n\nOnce the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap only succeeds if all required members start successfully. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or a new discovery token.\n\nIt is of course possible to recover a failed bootstrapped cluster the same way a running cluster is recovered. But because there is no data to recover, that almost always costs more time and resources than bootstrapping a new cluster.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/", "factLoss": false, "fidelity": {"source_words": 664, "rewrite_words": 656, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 20 conditions, the rewrite 19. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "the etcd cluster still accepts requests and makes progress without major disruption", "problem": "The rewrite drops the scope qualifier 'any' from the original's 'without any major disruption', narrowi e-member etcd cluster'.", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 13, "column": 198, "offset": 933}, {"rule": "PSTE-L4", "quote": "The new leader extends the timeouts of all leases automatically.", "problem": "This exact sentence appears twice, once under Leader failure and once under Majority failure, stating the same fact twice.", "fix": "State the lease-extension behavior once and refer back to it the second time instead of repeating the sentence.", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 2, "agreement": 0.5, "located": true, "line": 23, "column": 1, "offset": 1976}], "semanticConfirmed": 0}, "pste": {"missing": false, "pass": false, "words": 646, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd's tolerance ", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "---"}, {"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "Failures are common in a large deployment of machines.", "line": 7, "column": 32, "excerpt_offset": 31, "severity": "MUST", "arbitrated": true, "offset": 135, "token": "deployment"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster still accepts' over 3 words", "excerpt": "When fewer than half of the followers fail, the etcd cluster still accepts requests and ma", "line": 13, "column": 45, "excerpt_offset": 44, "severity": "MUST", "arbitrated": true, "offset": 698, "token": "the"}, {"rule": "PSTE-G7", "message": "nominalization 'operation of'; use a verb", "excerpt": "For example, two failed followers do not affect the operation of a cluster with five membe", "line": 13, "column": 182, "excerpt_offset": 52, "severity": "MUST", "arbitrated": true, "offset": 835, "token": "operation"}, {"rule": "PSTE-N5", "message": "multi-word noun 'old leader granted it' over 3 words", "excerpt": "A lease therefore does not expire before its granted TTL, even when the old leader granted", "line": 25, "column": 135, "excerpt_offset": 68, "severity": "MUST", "arbitrated": true, "offset": 2008, "token": "the"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A machine fails when its hardware or software malfunctions. Machines fail together when the power fails or the network breaks. Several kinds of failure can also happen at once. Nobody can list every possible case.\n\nThis section catalogs the kinds of failure. It explains how etcd tolerates them. Most users can map a particular failure to one of these kinds. Always [back up][backup] the etcd cluster to prepare for a rare or [unrecoverable failure][unrecoverable].\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without major disruption. For example, two failed followers do not affect the <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G7: nominalization &#x27;operation of&#x27;; use a verb\">operation</mark> of a cluster with five members.\n\nClients do lose the connection to the failed members. A client library must hide these interruptions from the user for a read request. It does so by reconnecting to another member automatically. Operators must expect the reconnections to raise the load on the other members.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not happen at once. It takes about one election timeout, because the model that detects the failure uses a timeout.\n\nThe cluster cannot process a write during the leader election. The cluster queues a write request that arrives during the election. It processes the request after it elects a new leader.\n\nThe cluster can lose a write that reached the old leader but that the cluster did not commit. The new leader can rewrite any entry that the previous leader did not commit. From the view of the user, some write requests can time out after a new leader election. The cluster never loses a committed write.\n\nThe new leader extends the timeouts for all leases automatically. A lease therefore does not expire before its granted TTL, even when <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;old leader granted it&#x27; over 3 words\">the</mark> old leader granted it.\n\n## Majority failure\n\nWhen the majority of the members fail, the etcd cluster fails and accepts no more writes.\n\nThe etcd cluster recovers from a majority failure only after the majority of the members become available again. If the majority of the members cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce the majority of the members work, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends the timeouts for all leases automatically. No lease therefore expires because the server was unavailable.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or to a leader failure. A network partition divides the etcd cluster into two parts. One part holds a majority of the members, and the other holds a minority. The majority side becomes the available cluster. The minority side is unavailable.\n\netcd has no &quot;split-brain&quot;. An operator adds and removes a cluster member explicitly, and the current majority of the members approves each such change.\n\nIf the leader is on the majority side, the majority side sees a minority follower failure. If the leader is on the minority side, the failure is a leader failure. The leader on the minority side steps down, and the majority side elects a new leader.\n\nOnce the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap succeeds only if all required members start. If any failure happens during the bootstrap, remove the data directories on all members. Then bootstrap the cluster again with a new cluster token or a new discovery token.\n\nYou can recover a failed bootstrapped cluster in the same way that you recover a running cluster. But this almost always takes more time and more resources than a new bootstrap, because there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/", "factLoss": true, "fidelity": {"source_words": 664, "rewrite_words": 647, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 20 conditions, the rewrite 19. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 13 -> 10, some/most 2 -> 3)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "Nobody can list every possible case.", "problem": "The original hedges with 'it is almost impossible to enumerate all possible failure cases'; the rewrite drops the hedge and asserts flat impossibility.", "fix": "Keep the qualifier, e.g. 'It is almost impossible to list every possible case.'", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 7, "column": 233 iption is 35 words, limit 25", "excerpt": "If any single member is still v3.4, however, the cluster and its operations remains \"v3.4\"", "line": 29, "column": 143, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2243, "token": "If"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an existing etcd deployment to 3.5, the running cluster must be 3.4 or greater. If <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> before 3.4, please [upgrade to 3.4](../upgrade_3_3/) before upgrading to 3.5.\n\nAlso, to ensure a smooth rolling upgrade, the running cluster must be healthy. Check the health of the cluster by using the `etcdctl endpoint health` command before proceeding.\n\n#### Preparation\n\nBefore upgrading etcd, always test the services relying on etcd in a staging environment before deploying the upgrade to the production environment.\n\nBefore beginning, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). Should something go wrong with the upgrade, it is possible to use this backup to [downgrade](#downgrade) back to existing etcd version. Please note that the `snapshot` command only backs up the v3 data. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nWhile upgrading, an etcd cluster supports mixed versions of etcd members, and operates with the protocol of the lowest common version. The cluster is only considered upgraded once all of its members are upgraded to version 3.5. Internally, etcd members negotiate with each other to determine the overall cluster version, which controls the reported version and the supported features.\n\n#### Limitations\n\nNote: If the cluster only has v3 data and no v2 data, it is not subject to this limitation.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 29 words, limit 25\">If</mark> the cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is serving&#x27;\">is</mark> serving a v2 data set larger than 50MB, each newly upgraded member may take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. In other words, it is safest to wait for 2 minutes between upgrading each member.\n\nFor <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more , this one-time process might take even more time. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 30 words, limit 25\">Administrators</mark> of very large etcd clusters of this magnitude can feel free to contact the [etcd team][etcd-contact] before upgrading, and <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;we&#x27;ll&#x27;\">we&#x27;ll</mark> be happy to provide advice on the procedure.\n\n#### Downgrade\n\nIf all members <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;have been upgraded&#x27;; use simple past\">have</mark> been upgraded to v3.5, the cluster will be upgraded to v3.5, and downgrade from this completed state is **not possible**. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 35 words, limit 25\">If</mark> any single member is still v3.4, however, the cluster and its operations remains &quot;v3.4&quot;, and it is possible from this mixed cluster state to return to using a v3.4 etcd binary on all members.\n\nPlease [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) to make downgrading the cluster possible even after it has been completely upgraded.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 357, "findings": [{"rule": "PSTE-N ction.\n\nBefore you begin, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). If the upgrade goes wrong, you can use this backup to [downgrade](#downgrade) to the existing etcd version. Note that the `snapshot` command backs up v3 data only. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nDuring an upgrade, an etcd cluster supports members running mixed versions, and it operates with the protocol of the lowest common version. The cluster counts as upgraded only once every member is on version 3.5. Internally, members negotiate with each other to determine the overall cluster version, which controls the reported version and the supported features.\n\n#### Limitations\n\nNote: a cluster with only v3 data and no v2 data is not subject to this limitation.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 28 words, limit 25\">If</mark> the cluster serves a v2 data set larger than 50MB, each newly upgraded member may take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. So it is safest to wait 2 minutes between upgrading each member.\n\nFor <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more, this one-time process might take even longer. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 31 words, limit 25\">If</mark> you administer <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;very large etcd cluster&#x27; over 3 words\">a</mark> very large etcd cluster of this size, feel free to contact the [etcd team][etcd-contact] before upgrading, and we will be happy to advise on the procedure.\n\n#### Downgrade\n\nOnce all members are upgraded to v3.5, the cluster is upgraded to v3.5, and downgr 2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nDuring an upgrade, an etcd cluster supports members that run different versions. The cluster operates with the protocol of the lowest common version. The cluster counts as upgraded only after every member runs version 3.5. The members negotiate with each other to determine the cluster version. That version controls the reported version and the supported features.\n\n#### Limitations\n\nThis limitation does not apply to a cluster that holds only v3 data and no v2 data.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> the cluster serves a v2 data set larger than 50MB, each upgraded member can take up to two minutes to catch up with the cluster. Check the size of a recent snapshot to estimate the total data size. It is safest to wait two minutes between the upgrade of each member.\n\nFor a total data size of 100MB or more, this one-time process can take longer. If you administer a cluster of this size, you may contact the [etcd team][etcd-contact] before you upgrade. The team will advise you on the procedure.\n\n#### Downgrade\n\nAfter all members run v3.5, the cluster is upgraded to v3.5. From this state, a downgrade is **not possible**. If one member still runs v3.4, the cluster and its operations remain &quot;v3.4&quot;. From this mixed state, you can return every member to a v3.4 etcd binary.\n\n[Download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) to make a downgrade possible even after the cluster is fully upgraded.", "factLoss": true, "fidelity": {"source_words": 430, "rewrite_words": 387, "findings": [{"kind": "number", "severity": "critical", "message": "'3.5' is missing. The rewrite has '3.4'."}, {"kind": "condition", "severity": "warning", "message": "the source states 15 conditions, the rewrite 12. Check that no condition was dropped."}], "critical": 1, "warnings":
