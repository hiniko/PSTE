", "message": "phrasal verb 'go ahead'; use 'start'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 25, "excerpt_offset": 24, "severity": "MUST", "arbitrated": false, "offset": 4997, "token": "go"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If you are using caching provided by Django, you should consider clearing your\ncache after", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5081, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 5088, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward, you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. You must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django, you <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not guaranteed to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly via the :func:`~django.views.decorators.cache.cache_page`\ndecorator.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 606, "findings": [{"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Use the latest patch release of each feature release \u2014 for 2.1, use", "line": 40, "column": 60, "excerpt_offset": 53, "severity": "SHOULD", "arbitrated": false, "offset": 1463, "token": "\u2014"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "the Django version is new, or if a dependency isn't well-maintained, it may not", "line": 49, "column": 47, "excerpt_offset": 46, "severity": "MUST", "arbitrated": false, "offset": 1697, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't", "line": 68, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 2306, "token": "don't"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't", "line": 68, "column": 67, "excerpt_offset": 66, "severity": "MUST", "arbitrated": false, "offset": 2365, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "Django versions at once, so warnings from installed packages aren't necessarily", "line": 80, "column": 62, "excerpt_offset": 61, "severity": "MUST", "arbitrated": false, "offset": 2776, "token": "aren't"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "If a package doesn't support the latest Django version, consider", "line": 81, "column": 25, "excerpt_offset": 13, "severity": "MUST", "arbitrated": false, "offset": 2819, "token": "doesn't"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "With the new environment set up, :doc:`run your application's full test suite", "line": 102, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": false, "offset": 3351, "token": "set"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "in the test output \u2014 you can also use the flag when testing manually with", "line": 104, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 3502, "token": "\u2014"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Once you're confident your app works on the new version of Django, :doc:`deploy", "line": 122, "column": 6, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "offset": 3978, "token": "you're"}, {"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "If you use Django's caching, consider clearing your cache after upgrading.\nPickled objects", "line": 125, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4104, "token": "If"}], "html": "How to upgrade Django to a newer version\n========================================\n\nUpgrading to the latest Django gives you:\n\n* New features and improvements.\n* Bug fixes.\n* Continued security updates \u2014 older versions eventually stop receiving them\n  (see :ref:`supported-versions-policy`).\n* An up-to-date code base, which makes future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. Automated upgrade helpers are listed on the\n    `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nThe rest of this guide covers what to consider so your upgrade goes smoothly.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nNext, learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for every &#x27;final&#x27; release\n  from the one after your current version up to and including your target\n  version.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nPay close attention to backwards incompatible changes, so you know what the\nupgrade will require.\n\nUpgrading across more than one feature version (for example 2.0 to 2.2)? Go one\nfeature release at a time (2.0 to 2.1 to 2.2) instead of making every change at\nonce. Use the latest patch release of each feature release <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for 2.1, use\n2.1.15.\n\nUpgrade one step at a time from one LTS to the next, too.\n\nDependencies\n============\n\nYou will usually need to upgrade your Django-related dependencies as well. If\nthe Django version is new, or if a dependency <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> well-maintained, it may not\nsupport the new Django version yet. In that case, wait for a new release of\nthat dependency.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, fix any deprecation warnings your project raises on your\ncurrent version of Django. Doing this first tells you which parts of your code\nneed changing.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\ncommand line option or the :envvar:`PYTHONWARNINGS` environment variable. To\nshow warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use the Django test runner, make sure console output <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark>\ncaptured, since that hides the warnings. With `pytest\n&lt;https://docs.pytest.org/&gt;`__, for example:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve all deprecation warnings on your current version of Django before\ncontinuing.\n\nThird party packages may use deprecated APIs deliberately, to support several\nDjango versions at once, so warnings from installed packages <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> necessarily\na problem. If a package <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest Django version, consider\nraising an issue or sending a pull request.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. If you use a\n:mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, consider setting\nup a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run your application&#x27;s full test suite\n&lt;/topics/testing/overview&gt;`. Turn deprecation warnings on again so they appear\nin the test output <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can also use the flag when testing manually with\n``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any test failures. While the release notes are fresh in your mind, this is\nalso a good time to adopt new Django features and refactor away any deprecation\nwarnings.\n\nUpgrading to an alpha, beta, or release candidate? See our guide on\n:ref:`testing-pre-releases` for tips on catching regressions and reporting\nbugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works on the new version of Django, :doc:`deploy\n&lt;/howto/deployment/index&gt;` your upgraded project.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">If</mark> you use Django&#x27;s caching, consider clearing your cache after upgrading.\nPickled objects are not guaranteed to be pickle-compatible across Django\nversions, so cached ones can cause problems. One past example: cached pickled\n:class:`~django.http.HttpResponse` objects, either directly or via the\n:func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 679, "findings": [{"kind": "identifier", "severity": "critical", "message": "`deploy </howto/deployment/index>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`guide\non the different release processes </internals/release-process>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`install the new Django version\n</topics/install>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`pytest <https://d ersions-policy`).\n* An upgrade with each new release keeps your code base current. It also makes\n  the next upgrade easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a large ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page shows automated upgrade helpers.\n\nRead the sections below before you start. They help the upgrade go smoothly.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nNext, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release. Start\n  with the release after your current version. Finish with the version you plan\n  to upgrade to.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nGive close attention to the changes that break backwards compatibility. They\nshow you what the upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade through each feature release one step at a time: 2.0 to 2.1, then 2.1\nto 2.2. This is easier than all the changes at once. For each feature release,\nuse the latest patch release. For 2.1, use 2.1.15.\n\nUse the same step-by-step method when you upgrade from one LTS to the next.\n\nDependencies\n============\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to their\nlatest version. Some dependencies may not yet support the new Django version.\nThis happens when Django released the version recently, or when a maintainer\ndoes not keep the dependency current. In these cases you must wait for the new\nversions of your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises\non your current version of Django. Fixing them first shows you which parts of\nthe code you must change.\n\nPython hides deprecation warnings by default. Turn them on with the ``-Wa``\nPython command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while you run tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, also make sure that nothing captures\nthe console output, because that hides the deprecation warnings. For example,\nwith `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue.\n\nA third party application may use deprecated APIs to support several versions\nof Django. A deprecation warning in a package you installed does not always\nmean a problem. If a package does not support the latest version of Django,\nconsider that you raise an issue or send a pull request for it.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. If you use a\n:mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, you may want to\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings\nagain so the test output shows them. You can also use the flag when you test\nyour app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix every failure after you run the tests. The release notes are fresh in your\nmind, so this is also a good time to use the new features in Django. Refactor\nyour code to remove any deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more tips about how you catch regressions\nand report bugs.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you use the caching that Django gives, consider that you clear your cache\nafter the upgrade. If you do not, you may hit problems. For example, pickled\nobjects in the cache are not guaranteed to stay pickle-compatible across Django\nversions. One past example of this incompatibility was the cache of pickled\n:class:`~django.http.HttpResponse` objects, either directly or through the\n:func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 776, "findings": [{"kind": "identifier", "severity": "critical", "message": "`guide\non the different release processes </internals/release-process>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`install the new Django version\n</topics/install>` is missing from the rewrite."}, {"kind": "condition", "severity": "warning", "message": "the source \u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5460, "token": "When"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. Additionally, block production slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 739, "findings": [{"rule": "PSTE-N2", "message": "description is 33 words, limit 25", "excerpt": "A farmer eligible to create the next block has about 28 seconds to build an unfinished blo", "line": 5, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 56, "token": "A"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Farmers pull transactions from the mempool, ordered by fee per cost, and add them to the u", "line": 7, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 247, "token": "Farmers"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Farmers pull transactions from the mempool, ordered by fee per cost, and add them to the u", "line": 7, "column": 107, "excerpt_offset": 106, "severity": "SHOULD", "arbitrated": false, "offset": 353, "token": "\u2014"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'were preventing'", "excerpt": "several bugs in the mempool's fast forward spend logic were preventing eligible farmers fr", "line": 9, "column": 221, "excerpt_offset": 55, "severity": "MUST", "arbitrated": false, "offset": 646, "token": "were"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Fast forwa e": 59, "column": 126, "excerpt_offset": 120, "severity": "MUST", "arbitrated": false, "offset": 4806, "token": "had"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, every fast-forward-eligible spend is valida", "line": 60, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4864, "token": "When"}], "html": "# Mempool Bugs Slowed Block Creation\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 33 words, limit 25\">A</mark> farmer eligible to create the next block has about 28 seconds to build an unfinished block and propagate it across the network to a timelord, who infuses it to produce the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 30 words, limit 25\">Farmers</mark> pull transactions from the mempool, ordered by fee per cost, and add them to the unfinished block <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> this is how the farmer earns the fees attached to those transactions.\n\nCNI observed that the mempool was completely full, yet transactions were not making it into blocks. Block production also slowed below the expected rate. The cause: several bugs in the mempool&#x27;s fast forward spend logic <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;were preventing&#x27;\">were</mark> preventing eligible farmers from building unfinished blocks in time.\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis is what allows offer files to refer to singletons by coin ID, even though the coin ID changes with every state update.\n\nFast forward spends are also used by vaults. The vault singleton authorizes every coin belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward lets multiple spends of the vault singleton sit in the mempool at once<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> farmers deduplicate and rebase them sequentially as they build blocks.\n\nCNI identified three root causes of the slowdown:\n\n* 1. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 43 words, limit 25\">*</mark>*A spent coin does not invalidate a fast forward spend.** Such a spend can simply be fast-forwarded to the latest version of the singleton, so eviction depends on other parts of the spend bundle (for example, that coin being spent by a block). We did not consider the case where a bundle&#x27;s only spend was a fast-forward spend \u2014 it would never be evicted after the singleton was melted.\n* 2. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 33 words, limit 25\">*</mark>*FF-spends enter the mempool even when their coin is already spent.** At block formation they get fast-forwarded onto the latest version of the singleton, but we never validated that the singleton still existed. So we accepted singleton spends for singletons that <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer existed.\n* 3. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 38 words, limit 25\">*</mark>*Rebasing during block formation mutated the mempool.** FF spends were updated in place to spend the singleton&#x27;s most recent coin, which changed the mempool and propagated the fast-forwarded versions of the item to the rest of the network. The mempool item therefore doubled in number every time a farmer tried to form a block.\n\nTogether, these three bugs meant that anyone submitting a fast-forward-eligible singleton spend, unbundled with any other spend, would see the following:\n\n* The spend was considered valid, entered the mempool, and propagated across the network.\n* Every time a farmer made a block, the spend multiplied, propagating the new transactions across the network (bug 3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but did not evict the spends from the mempool (bug 2). In our scenario, the mempool was full of these spends when this happened. All of them failed during block creation, so farmers timed out before finding any valid transactions.\n* <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 26 words, limit 25\">Farmers</mark> building a block from the affected mempool items hit performance problems and missed the cutoff time for their block to be included in the blockchain.\n\n## Timeline\n\nAll times PST, 02/13/2025 \u2013 02/19/2025. All times are approximations.\n\n**02-13-2025 11:00 pm** \u2014 Mempool spendbundle count began slowly increasing.\n\n**02-14-2025 11:30 am** \u2014 Mempool cost hit max cost.\n\n**02-14-2025 1:10 pm** \u2014 Mempool spendbundle count plateaued at ~6200.\n\n**02-14-2025 4:45 pm** <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Chia blockchain netspace began decreasing<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> timelord infused blocks per minute dropped markedly.\n\n**02-14-2025 11:00 pm** <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> CNI diagnosed the cause and prepared a hotfix release of the Chia blockchain software.\n\n**02-15-2025 1:30 am** \u2014 Hotfix release build process started.\n\n**02-15-2025 3:00 am** \u2014 Hotfix deployment completed as version 2.5.1.\n\n**02-19-2025 3:15 pm** <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Version 2.5.2 released, including the fixes for the Fast Forward issues described above.\n\n## Resolution and Recovery\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 26 words, limit 25\">Because</mark> the Chia blockchain is decentralized, with many nodes running different configurations and versions, most of the blockchain netspace was unaffected by the Fast Forward issues.\n\nVersion 2.5.1 added a workaround that caps unfinished block creation time, ensuring the unfinished block reaches a timelord promptly. Netspace began recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 included fixes that invalidated the mempoolItems created by the Fast Forward issues<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the mempool cleared of these items as users adopted v2.5.2. The fixes were:\n\n* 1. SpendBundles submitted to the mempool that contain only fast-forward spends are rejected.\n* 2. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> a spend is &quot;rebased&quot; onto the latest version of the singleton, we no longer update the item in the mempool \u2014 which <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G4: perfect tense &#x27;had risked&#x27;; use simple past\">had</mark> risked distributing the new copy to the network.\n* 3. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 27 words, limit 25\">When</mark> ingesting spend bundles into the mempool, every fast-forward-eligible spend is validated to confirm the latest version of its singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 836, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 11 conditions, the rewrite 8. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [ not include any transactions. Block production also slowed below the expected rate. CNI determined the cause: farmers eligible to create blocks did not create unfinished blocks in time. Several bugs in the mempool logic for fast forward spends caused this delay.\n\nA fast forward spend lets a spend of a singleton apply to future versions of that singleton.\n\nFast forward spends let offer files refer to singletons by coin ID, even though the coin ID changes at every state update.\n\nVaults also use fast forward spends. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">The</mark> vault singleton authorizes all coins that belong to it, so a limit of one vault spend in flight at a time would be too restrictive. Fast forward lets several spends of the vault singleton sit in the mempool at the same time. Farmers deduplicate these spends and rebase them in order as they create blocks.\n\nCNI found three bugs that together caused the slow down in block creation:\n\n1. A fast forward spend does not become invalid when its coin is spent. The spend can be fast forwarded to the latest version of the singleton. A fast forward spend relies on other parts of its spend bundle for eviction. For example, a block spends one of those coins. We did not consider the case where the only spend in a bundle is a fast forward spend. Such a bundle was not evicted after the singleton was melted.\n2. A fast forward spend enters the mempool even when its coin is already spent. At block creation, the spend is fast forwarded on top of the latest version of the singleton. But we did not check that the singleton still existed. We accepted singleton spends into the mempool for singletons that were melted and no longer exist.\n3. At block creation, a fast forward spend was updated to spend the most recent coin of the singleton. This update happened in place. The mempool therefore changed, and it propagated the fast forwarded versions of the mempool item to the rest of the network. The mempool item doubled in number every time a farmer tried to form a block.\n\nWith these three bugs, a person could submit a singleton spend that is eligible for fast forward and bundle it with no other spend. The result:\n\n- The spend is valid. It enters the mempool and propagates through the network.\n- Every time a farmer makes a block, bug 3 multiplies the spend and propagates the new transactions through the network.\n- Melting the singleton stops the transactions from going through, but bug 2 leaves the spends in the mempool. In our case, the mempool was full of these spends when the melt happened. All of these spends failed during block creation. Farmers timed out before they found any valid transaction.\n- A farmer that tried to create a block from the affected mempool items hit performance problems. The farmer then missed the cutoff time for the block to enter the blockchain.\n\n## Timeline\n\nAll times are PST, from 02/13/2025 to 02/19/2025. All times are approximate.\n\n| Date and time | Event |\n|---|---|\n| 02-13-2025 11:00 pm | The count of spend bundles in the mempool started to increase slowly. |\n| 02-14-2025 11:30 am | The mempool cost reached the maximum cost. |\n| 02-14-2025 1:10 pm | The count of spend bundles in the mempool reached a plateau at about 6200. |\n| 02-14-2025 4:45 pm | The netspace of the Chia blockchain started to decrease. Blocks infused per minute by timelords dropped sharply. |\n| 02-14-2025 11:00 pm | CNI diagnosed the cause of the problems and prepared a hotfix release of the Chia blockchain software. |\n| 02-15-2025 1:30 am | The build process for the hotfix release started. |\n| 02-15-2025 3:00 am | The deployment of the hotfix release finished as version 2.5.1. |\n| 02-19-2025 3:15 pm | Version 2.5.2 was released. It included the fixes for the fast forward bugs described in the issue summary. |\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized, and many nodes run different configurations and versions. The fast forward bugs therefore did not affect most of the blockchain netspace.\n\nVersion 2.5.1 contains a workaround that caps the time to create an unfinished block. The cap makes sure the unfinished block reaches a timelord in time. The blockchain netspace started to recover towards previous levels after the release of v2.5.1.\n\nVersion 2.5.2 included three fixes. These fixes made the mempool items from the fast forward bugs invalid. The mempool cleared these items as the user base took up v2.5.2.\n\n1. The mempool rejects a spend bundle that contains only fast forward spends.\n2. When a spend is rebased on top of the latest version of the singleton, we do not update the item in the mempool. This removes the risk of distributing the new copy to the network.\n3. When the mempool ingests a spend bundle, it checks every spend that is eligible for fast forward. The check makes sure the latest version of the singleton still exists, with the given puzzle hash.", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 949, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 11 conditions, the rewrite 8. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A3", "quote": "a limit of one vault spend in flight at a time", "problem": "The sentence exceeds the 25-word description limit (flagged mechanically), but it splits cleanly into two sentences without losing any fact, so the limit should not have been exceeded.", "fix": "Split into two sentences: 'The vault singleton authorizes all coins that belong to it. A limit of one vault spend in flight at a time would be too restrictive.'", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 15, "column": 101, "offset": 1132}, {"rule": "PSTE-V6", "quote": "the mempool was full of these spends when the melt happe  for these excessive CLVM cost mempool items and found that they", "line": 37, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2309, "token": "Chia"}], "html": "# unbound CLVM cost restriction on mempool\n\n## Issue Summary\n\nTransactions that are included in a block are aggregated from one or more spendbundles. Inside spendbundles coins are spent, with the reveal of the puzzle and their solution of the coins. The puzzles and solutions consist of CLVM code that is assigned a cost, based on bytes of the code, and usage of operands and conditions. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">Each</mark> node on the network runs the CLVM code with limitations on how much resources the execution can use up via restrictions on the CLVM cost.\n\nThe Chia default mempool code uses a CLVM cost <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction that consensus uses (what is allowed in a block). The consensus constant is &quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000\n\n\nVersion 1.7.1 of the mempool <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn\u2019t&#x27;\">doesn\u2019t</mark> include verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`\nThis code was present in previous versions.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> verification code was removed because it was assumed that running the MempoolItem as a block generator would perform this check already, making the code redundant.\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 33 words, limit 25\">The</mark> chia_rs function called run_block_generator() contained a bug where if the byte cost exceeded the limit (5.5 billion in this case), the u64 wraps around and effectively removes the cost limit.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 32 words, limit 25\">The</mark> removal of the verification in the mempool code and the chia_rs bug combined allowed for a MempoolItem to have an unbound CLVM cost when the byte cost exceeded the limit.\n\n## Timeline (all times PST)   04/23/2023 - 05/03/2023. All times approximations\n\n04/23/2023 - Mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5` were reported by a community member in keybase.\n\n05/03/2023 - Version 1.8.0 of the Chia blockchain was released with fixes for the mempool code and chia_rs.\n\n\n## Resolution and recovery\n\nThis issue was addressed in 1.8.0 by: \n\nReinstating the mempool verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n\nFixing the cost calculation in chia_rs when the byte cost exceeds the limit.\n\n\nThe issue was present in mainnet and manifested itself by transactions being added to the mempool that exceeded the CLVM cost threshold. These transactions were not added to blocks as consensus checks on CLVM cost disallowed that.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 42 words, limit 25\">Chia</mark> monitored the mempool for these excessive CLVM cost mempool items and found that they were limited in scope and barely exceeded the threshold limit, causing very limited impact on nodes on the network during the time that the mempool allowed them.\n\n\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 361, "findings": [{"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "Puzzles and solutions are CLVM code, and each is assigned a cost based on the size of the ", "line": 5, "column": 158, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 225, "token": "Puzzles"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Every node on the network runs this CLVM code under limits on how many resources the execu", "line": 5, "column": 302, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 369, "token": "Every"}, {"rule": "PSTE-G7", "message": "nominalization 'restriction of'; use a verb", "excerpt": "The Chia default mempool code uses a CLVM cost restriction of 0.5 times the restriction th", "line": 7, "column": 48, "excerpt_offset": 47, "severity": "MUST", "arbitrated": true, "offset": 568, "token": "restriction"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "**Result.** Together, the removed mempool verification and the chia_rs bug allowed a Mempo", "line": 13, "column": 4, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1342, "token": "*"}, {"rule": "PSTE-N5", "message": "multi-word noun 'mempool verification code requiring' over 3 words", "excerpt": "Reinstating the mempool verification code requiring a MempoolItem's CLVM cost to be  CODE ", "line": 26, "column": 15, "excerpt_offset": 12, "severity": "MUST", "arbitrated": true, "offset": 1915, "token": "the"}], "html": "# Unbounded CLVM Cost Restriction on the Mempool\n\n## Issue Summary\n\nBlocks contain transactions aggregated from one or more spendbundles. Inside a spendbundle, coins are spent by revealing the coin&#x27;s puzzle and its solution. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 28 words, limit 25\">Puzzles</mark> and solutions are CLVM code, and each is assigned a cost based on the size of the code in bytes and its use of operands and conditions. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 26 words, limit 25\">Every</mark> node on the network runs this CLVM code under limits on how many resources the execution may consume, enforced as restrictions on the CLVM cost.\n\nThe Chia default mempool code uses a CLVM cost <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction that consensus uses (what is allowed in a block). The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nThree things combined to cause the issue:\n\n1. **Missing mempool check.** Version 1.7.1 of the mempool does not include the verification code requiring a MempoolItem&#x27;s CLVM cost to be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. This code was present in previous versions. It was removed on the assumption that running the MempoolItem as a block generator would already perform the check, making it redundant.\n2. **chia_rs bug.** The chia_rs function `run_block_generator()` contained a bug: when the byte cost exceeded the limit (5.5 billion in this case), the u64 wrapped around, effectively removing the cost limit.\n3. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Result.** Together, the removed mempool verification and the chia_rs bug allowed a MempoolItem to have an unbounded CLVM cost whenever the byte cost exceeded the limit.\n\n## Timeline\n\nAll times PST and approximate. 04/23/2023 \u2013 05/03/2023.\n\n- **04/23/2023** \u2014 A community member reported, on keybase, mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- **05/03/2023** \u2014 Version 1.8.0 of the Chia blockchain was released with fixes for the mempool code and chia_rs.\n\n## Resolution and Recovery\n\nVersion 1.8.0 addressed the issue by:\n\n- Reinstating <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool verification code requiring&#x27; over 3 words\">the</mark> mempool verification code requiring a MempoolItem&#x27;s CLVM cost to be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- Fixing the cost calculation in chia_rs for when the byte cost exceeds the limit.\n\nThe issue was present on mainnet. It showed up as transactions being added to the mempool that exceeded the CLVM cost threshold. Those transactions were never added to blocks, because consensus checks on CLVM cost disallowed it.\n\nChia monitored the mempool for these excessive-cost items and found they were limited in scope and barely exceeded the threshold limit. Impact on nodes on the network was very limited during the time the mempool allowed them.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 411, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "Chia monitored the mempool for these excessive-cost items", "problem": "The rewrite drops 'CLVM' from the original's 'excessive CLVM cost mempool items', so the sentence no longer names which cost was excessive.", "fix": "Write 'these excessive-CLVM-cost items' or 'these items with excessive CLVM cost'.", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 31, "column": 1, "offset": 2343}, {"rule": "PSTE-G9", "quote": "Impact on nodes on the network was very limited", "problem": "The sentence opens with the bare abstract noun \"Impact\" referring to this specific incident's impact, but English grammar permits and calls for a definite article here.", "fix": "Write \"The impact on nodes on the network was very limited.\"", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 2, "of": 3, "agreement": 0.67, "located": true, "line": 31, "column": 137, "offset": 2479}, {"rule": "PSTE-L4", "quote": "the verification code requiring a MempoolItem's CLVM cost", "problem": "The same rule, in the same words, is stated once for the missing check and again for the reinstated check, and this is not a warning that PSTE-L4 exempts.", "fix": "State the threshold rule in full once, then refer back to it briefly on the second mention, for example 'Reinstating that verification code'.", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 11, "column": 77, "offset": 843}, {"rule": "PSTE-N4", "quote": "All times PST and approximate.", "problem": "The sentence omits the verb 'are', leaving a fragment instead of 'All times are PST and are approximate'.", "fix": "Write 'All times are PST and are approximate.'", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 17, "column": 1, "offset": 1527}, {"rule": "PSTE-S4", "quote": "a MempoolItem's CLVM cost to be", "problem": "The identifier 'MempoolItem' is inflected with a possessive 's, which PSTE-S4 forbids; the original used 'the CLVM cost of a MempoolItem' instead.", "fix": "Write 'the CLVM cost of a MempoolItem' in both places instead of \"a MempoolItem's CLVM cost\".", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 11, "column": 109, "offset": 875}], "semanticConfirmed": 0}, "pste": {"missing": false, "pass": true, "words": 368, "findings": [{"rule": "PSTE-G7", "message": "nominalization 'restriction of'; use a verb", "excerpt": "The default mempool code of Chia uses a CLVM cost restriction of 0.5 times the restriction", "line": 11, "column": 51, "excerpt_offset": 50, "severity": "MUST", "arbitrated": true, "offset": 706, "token": "restriction"}, {"rule": "PSTE-G7", "message": "nominalization 'restriction of'; use a verb", "excerpt": "The default mempool code of Chia uses a CLVM cost restriction of 0.5 times the restriction", "line": 11, "column": 80, "excerpt_offset": 79, "severity": "MUST", "arbitrated": true, "offset": 735, "token": "restriction"}], "html": "# Unbound CLVM cost restriction in the mempool\n\n## Issue summary\n\nVersion 1.7.1 of the mempool let a MempoolItem hold an unbound CLVM cost. Two faults combined to cause this. The mempool lost a check, and `chia_rs` had a bug.\n\nA block aggregates one or more spendbundles. A spendbundle spends coins. Each spend reveals the puzzle of the coin and the solution of the coin. Puzzles and solutions consist of CLVM code.\n\nEach piece of CLVM code carries a cost. The cost comes from the bytes of the code, the operands, and the conditions. Every node on the network runs the CLVM code. The CLVM cost restriction limits the resources that the execution can use.\n\nThe default mempool code of Chia uses a CLVM cost <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of consensus. The consensus restriction is what a block allows. The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nVersion 1.7.1 of the mempool does not include the code that checks that the CLVM cost of a MempoolItem is &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`. Earlier versions included this code. A developer removed it because running the MempoolItem as a block generator was assumed to make this check already, so the code looked redundant.\n\nThe `chia_rs` function `run_block_generator()` contained a bug. When the byte cost exceeded the limit of 5.5 billion, the u64 wrapped around. The wrap effectively removed the cost limit.\n\n## Timeline\n\nAll times are PST, from 04/23/2023 to 05/03/2023. All times are approximations.\n\n1. 04/23/2023 \u2014 A community member reported in keybase that mempool items exceeded a cost of `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. 05/03/2023 \u2014 Chia released version 1.8.0 of the blockchain with fixes for the mempool code and for `chia_rs`.\n\n## Resolution and recovery\n\nVersion 1.8.0 addressed the issue in two ways:\n\n1. It reinstated the mempool code that checks that the CLVM cost of a MempoolItem is &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. It fixed the cost calculation in `chia_rs` for the case where the byte cost exceeds the limit.\n\nThe issue was present in mainnet. It showed itself as transactions that entered the mempool with a CLVM cost above the threshold. These transactions did not enter blocks, because the consensus checks on CLVM cost disallowed that.\n\nChia monitored the mempool for these mempool items with excessive CLVM cost. The items were limited in scope and barely exceeded the threshold limit. They caused very limited impact on the nodes of the network during the time that the mempool allowed them.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 423, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 3 conditions, the rewrite 1. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "let a MempoolItem hold an unbound CLVM cost", "problem": "The opening sentence states that the mempool let a MempoolItem hold an unbound CLVM cost without the original's governing condition that this happened only when the byte cost exceeded the limit, making the defect sound unconditional.", "fix": "Add the condition to the summary sentence, e.g. \"Version 1.7.1 of the mempool let a MempoolItem hold an unbound CLVM cost when the byte cost exceeded the limit.\"", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 5, "column": 30, "offset": 95}, {"rule": "PSTE-D4", "quote": "the bytes of the code, the operands, and the conditions", "problem": "Three parallel items that determine CLVM cost are listed inside one prose sentence rather than as a bulleted list.", "fix": "Present the three cost factors as a bulleted list: bytes of the code, operands, conditions.", "reason": "", "confidence": "medium", "status": "low-agreement" ng an etcd cluster\n\nIf any API servers are running in your cluster, you <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not attempt to\nrestore instances of etcd. Instead, follow these steps to restore etcd:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`,\n`kube-controller-manager`, `kubelet`) to ensure that they <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on some\nstale data. In practice the restore takes a bit of time.  During the\nrestoration, critical components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.minor](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be present. It can\neither be a snapshot file from a previous backup operation, or from a remaining\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** since etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to utilize [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured accordingly. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> the majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan be scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance, please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 410, "findings": [{"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "The Kubernetes project also recommends restarting the Kubernetes components ( CODE        ", "line": 9, "column": 142, "excerpt_offset": 141, "severity": "MUST", "arbitrated": false, "offset": 390, "token": "don't"}], "html": "## Restoring an etcd cluster\n\nDo not restore etcd instances while any API servers are running in your cluster. Instead, follow these steps:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting the Kubernetes components (`kube-scheduler`, `kube-controller-manager`, `kubelet`) so they <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on stale data. In practice, the restore takes some time. During it, critical components lose their leader lock and restart themselves.\n\netcd supports restoring from snapshots taken by an etcd process of the same [major.minor](https://semver.org/) version. Restoring from a different patch version is also supported. Use a restore operation to recover the data of a failed cluster.\n\nBefore you start, you need a snapshot file. It can come from a previous backup operation, or from a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use the `--data-dir` option to say which folder to restore into:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   Here, `&lt;data-dir-location&gt;` is a directory that the restore process creates.\n\n\n   Using `etcdctl` to restore is **deprecated** as of etcd v3.5.x and is scheduled for removal in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   This example shows the `etcdctl` restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster.\n   Otherwise, change the etcd configuration and restart the etcd process after the restore so it uses the new data directory. First, in `/etc/kubernetes/manifests/etcd.yaml`, set `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`. Then run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the access URLs of the restored cluster differ from those of the previous cluster, reconfigure the Kubernetes API server to match. Restart the Kubernetes API servers with the flag `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you might need to update the load balancer instead.\n\nIf the majority of etcd members fail permanently, the etcd cluster counts as failed. Kubernetes then cannot make any changes to its current state. Scheduled pods might keep running, but no new pods can be scheduled. To fix this, recover the etcd cluster and, if needed, reconfigure the Kubernetes API servers.\n\n\n## Upgrading etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details on etcd upgrades, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.", "factLoss": false, "fidelity": {"source_words": 595, "rewrite_words": 535, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-D3", "quote": "stop *all* API server instances", "problem": "The three steps (stop API servers, restore etcd, restart API servers) are an order-dependent sequence but are formatted as a bulleted list rather than a numbered list.", "fix": "Present the three steps as a numbered list to signal that order matters.", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 5, "column": 3, "offset": 143}, {"rule": "PSTE-W1", "quote": "delete it and stop the etcd process before restoring", "problem": "The step tells the reader to delete the existing data directory with no warning label or statement of loss, even though deleting it destroys data and cannot be reversed if the subsequent restore fails.", "fix": "Add a warning before the step stating that it permanently deletes the existing contents of the data directory.", "reason": "", "confidence": "high", "status": "low-agreement", "seenIn": 3, "of": 3, "agreement": 1.0, "locate eader-lock behavior each get their own paragraph.", "reason": "", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 9, "column": 168, "offset": 416}], "semanticConfirmed": 0}, "pste": {"missing": false, "pass": false, "words": 425, "findings": [{"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "If you use a different folder, change the etcd configuration and restart the etcd process ", "line": 36, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1751, "token": "If"}], "html": "## Restore an etcd cluster\n\nDo not restore etcd instances while any API server runs in your cluster. Follow these steps instead:\n\n1. Stop *all* API server instances.\n2. Restore the state in all etcd instances.\n3. Restart all API server instances.\n\nThe Kubernetes project also recommends that you restart `kube-scheduler`, `kube-controller-manager`, and `kubelet`. This makes sure that they do not use stale data.\n\nThe restore takes some time. During the restore, critical components lose the leader lock and restart themselves.\n\netcd can restore from a snapshot that an etcd process of the same [major.minor](https://semver.org/) version took. etcd can also restore from a snapshot that a different patch version took. A restore recovers the data of a failed cluster.\n\nYou need a snapshot file before you start the restore. The file comes from a previous backup, or from a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\nWhen you restore the cluster with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use the `--data-dir` option to name the folder for the restore:\n\n```shell\netcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nHere `&lt;data-dir-location&gt;` is a directory that the restore creates.\n\n`etcdctl` restore is **deprecated** since etcd v3.5.x. etcd v3.6 will remove it. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\nThis example shows the restore with the `etcdctl` tool:\n\n```shell\nexport ETCDCTL_API=3\netcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nIf `&lt;data-dir-location&gt;` is the same folder as before, delete the folder and stop the etcd process before you restore the cluster.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> you use a different folder, change the etcd configuration and restart the etcd process after the restore, so that etcd uses the new data directory:\n\n1. In `/etc/kubernetes/manifests/etcd.yaml`, change `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`.\n2. Run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service`, or both.\n\nFor more information and examples about a restore from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the access URLs of the restored cluster differ from the URLs of the previous cluster, you must reconfigure the Kubernetes API server. In this case, restart the Kubernetes API servers with the flag `--etcd-servers=$NEW_ETCD_CLUSTER` in place of the flag `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you may need to update the load balancer instead.\n\nIf most etcd members fail permanently, the etcd cluster counts as failed. Kubernetes then cannot change its current state. The scheduled pods can continue to run, but the scheduler cannot schedule new pods. In this case, recover the etcd cluster, and reconfigure the Kubernetes API servers if you need to.\n\n## Upgrade etcd clusters\n\nBack up your etcd cluster before you start an upgrade.
