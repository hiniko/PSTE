in Grafana panels, in alerting rules, and in recording rules.\n\nThis page covers the core ideas. It covers what a query returns, how it selects and filters series, and a few syntax points that cause errors.\n\n## Instant queries and range queries\n\nPromQL runs an expression in two ways.\n\nA point-in-time query runs at one point in time. It gives one value per matching series. This is the &quot;Table&quot; view in the Prometheus UI.\n\nA range query runs the same expression at fixed steps. It runs between a start time and an end time. It gives a series of points you can plot. This is the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is a point-in-time query, run many times at different timestamps. Tools outside the UI <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;fetch&#x27; is not approved; use &#x27;get&#x27;\">fetch</mark> these results through the Prometheus HTTP API. These tools include dashboards, scripts, and custom code.\n\n## What a query returns\n\nEvery expression returns one of four types.\n\n| Type | Content |\n|---|---|\n| Instant vector | A set of series. Each series has one sample, at one shared timestamp. |\n| Range vector | A set of series. Each series has a window of samples over time. |\n| Scalar | One number, with no labels. |\n| String | A string value. This type is rare in practice today. |\n\nNot every context takes every type. A point-in-time query can return any of the four types. A range query can return only a scalar or an <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vector. You cannot graph a range vector or a string.\n\nA sample is one of two kinds. A float sample is a plain number. A native histogram sample holds a full histogram: count, sum, and bucket data, all in one sample. One vector can mix both kinds.\n\nA native histogram knows if it is a counter or a <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>. So Prometheus can warn you when you apply the wrong function to it. One example <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is calling&#x27;\">is</mark> calling `rate()` on a <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram. A float sample carries no such flag.\n\nPrometheus cannot stop you from calling `rate()` on a float <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, even though the result means nothing. This is why counter metric names end in `_total`. This naming convention helps a human avoid the mistake. PromQL does not <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> it.\n\nOne more term to note. A &quot;classic histogram&quot; is the `_bucket`, `_count`, and `_sum` trio of plain metrics. It is <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There is no &quot;classic histogram sample&quot;. Only a native histogram produces a histogram-typed sample.\n\n## Selecting time series\n\n### Instant vector selectors\n\nA bare metric name is the <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> of query:\n\n```\nhttp_requests_total\n```\n\nThis returns one sample per series with that name. Each sample is the most <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> one at or before the query&#x27;s evaluation time, subject to the staleness rules below.\n\nTo narrow the result, add label matchers in curly braces after the metric name. A query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary` returns only series that match both.\n\nPromQL has four matcher operators.\n\n| Operator | Meaning |\n|---|---|\n| `=` | The label equals this string. |\n| `!=` | The label does not equal this string. |\n| `=~` | The label matches this regex. |\n| `!~` | The label does not match this regex. |\n\nA regex match in PromQL is always fully anchored. A `=~` match against `foo` works as `^foo$`, not as a substring search. The regex flavor is RE2.\n\nOne subtlety: a matcher against an empty string on a label matches two kinds of series. It matches series where the label is set to empty, and series where the label is missing.\n\nYou can also repeat a matcher on the same label name. All of them must pass for the series to match. For example, you can exclude one value while also regex-matching a broader pattern on the same label.\n\nA selector built only from regex matchers could match every series in the database. So Prometheus requires a selector to contain a metric name, or at least one matcher that cannot match an empty value. A selector with only a wildcard-style regex on one label is rejected. Requiring one non-empty character in that regex makes it <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\nUnder the hood, the metric name is a label named `__name__`. Writing the metric name bare is the same as matching `__name__` directly. You can use the other operators against it too. This lets you match every metric name that starts with a given prefix.\n\nOne side effect: a few words are reserved as operator keywords. These are `bool`, `on`, `ignoring`, `group_left`, and `group_right`. You cannot use them bare as a metric name. Matching them through `__name__` is the workaround.\n\n### Range vector selectors\n\nAdd a <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of one point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a range vector. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each matching series, you get every sample from the last 5 minutes, not <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest one. The window excludes the start boundary and includes the end boundary. A sample exactly on the start time is left out. A sample exactly on the end time is kept.\n\nFunctions such as `rate()`, `increase()`, and `avg_over_time()` mostly <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;consume&#x27; is not approved; use &#x27;take&#x27;\">consume</mark> range vectors. You rarely <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;display&#x27; is not approved; use &#x27;show&#x27;\">display</mark> one directly.\n\n## Durations\n\nA <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is a number followed by a unit.\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h; ignores daylight saving time) |\n| `w` | weeks (7d) |\n| `y` | years (365d; ignores leap days) |\n\nYou can chain units if they go from largest to smallest, and each appears once: `1h30m`, `12h34m56s`.\n\nUnder the hood, a <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is a float literal in seconds. `1s` is `1`. `1ms` is `0.001`. But the suffix must follow a decimal integer, so `1.<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">5h</mark>` is not valid, and neither is a hex number with a unit suffix.\n\n<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">You</mark> can also build a <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic, anywhere a <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected. This works inside range vector brackets, or after `offset`. Multiplying `5m` by `2` gives a 10-minute window. Dividing `1h` by `2` gives a 30-minute offset. The operators `+ - * / % ^` all work, at normal precedence. Note: after `offset`, wrap the expression in parentheses, or only the first term is used.\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">A</mark> few helper functions work inside <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> expressions too. `step()` gives the range-query step width. It gives `0s` for a point-in-time query. `range()` gives the end time minus the start time of a range query. It also gives `0s` for a point-in-time query. `min_of()` and `max_of()` clamp a value. For example, `max_of(step(), 5s)` never lets t<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">he</mark> duration drop below 5 seconds. You cannot use<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>a duration expression inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n`offset` shifts where a selector looks, relative to the query&#x27;s evaluation time. Adding `offset 5m` to a selector returns the value from 5 minutes ago.\n\nIt works on range vectors too, and combines with functions. For example, you can ask for this week&#x27;s 5-minute rate as it looked a week ago. You do this by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back. This is occasionally useful when you compare against &quot;the future&quot; relative to some earlier evaluation point.\n\n`@` pins a selector to an absolute Unix timestamp instead of a relative offset. One example is `http_requests_total @ 1609746000`. Two special values help here: `start()` and `end()`. In a range query, they resolve to the query&#x27;s start and end time, and stay fixed across every step. In a point-in-time query, both resolve to the evaluation time.\n\nRemember one rule for both modifiers: each one binds to the selector directly to its left, not to the whole enclosing expression. Wrapping the bare selector, with its `offset` or `@` attached, inside an aggregation such as `sum(...)` is correct. Putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\nYou can <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;combine&#x27; is not approved; use &#x27;join&#x27;\">combine</mark> `offset` and `@` on the same selector. The order does not matter. The offset always applies relative to the `@` time.\n\n## Subqueries\n\n<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">A</mark> subquery runs what is, <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;in effect&#x27; is not approved; use &#x27;active&#x27;\">in</mark> effect, a point-in-time expression repeatedly over a range. This turns the result into a range vector. <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N1: instruction is 24 words, limit 20\">Use</mark> this when you want to apply a range-vector function on top of an expression that is already a rate or another computed value. `max_over_time` is one such function. For example, wrap `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes, at 1-minute resolution. The resolution part is optional. If you<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;omit&#x27; is not approved; use &#x27;skip&#x27;\"> </mark>omit it, PromQL uses the global evaluation<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\"> </mark>interval.\n\n## Other parts of the language\n\nOperators (`+`, `and`, `on`, `group_left`, and others) and functions (`rate`, `sum`, `histogram_quantile`, and dozens more) hold most of PromQL&#x27;s power. Read about them once you know selectors well.\n\nComments start with `#` and run to the end of the line.\n\nA string literal uses single quotes, double quotes, or backticks. A single- or double-quoted string follows Go&#x27;s escaping rules: backslash escapes, plus octal and hex escapes. A backtick string is raw. It applies no escape processing, and it keeps any newline inside it as-is.\n\nA numeric literal can be an integer, a decimal, scientific notation, a hex number, `Inf`, or `NaN`. You can use underscores as digit separators for readability, for example `1_000_000`.\n\n## Two things to know before you start\n\n**Staleness.** A query samples at fixed timestamps that do not always match when data was <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> scraped. So Prometheus must pick a value to report at each timestamp. It uses the newest sample that is younger than the lookback period. The default lookback period is 5 minutes. You can tune it with the `--query.lookback-delta` flag, or with a per-query `lookback_delta` parameter.\n\nIf a target stops being scraped, or disappears, its series is marked stale. Once a query&#x27;s evaluation timestamp passes that staleness point, the series stops appearing in results. This is why a graph line ends, instead of running flat forever.\n\n**Performance.** A bare metric name can expand into thousands of series if the metric has high cardinality. An aggregation over that many series costs real work on the server. <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 34 words, limit 25\">This</mark> is true even when the <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> output is one number, in the same way that summing a large column in a SQL database is not free <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because the result is one row.\n\nWhen you explore a metric you do not know, check it in the table view first. Narrow it with label matchers or aggregation until the result set is a reasonable size. Only then switch to graphing it. If a query stays expensive even after you narrow it, use a recording rule: it computes the result once, so you query the cheap result each time after that.", "factLoss": true, "fidelity": {"source_words": 1880, "rewrite_words": 1793, "findings": [{"kind": "identifier", "severity": "critical", "message": "`.md` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`DST` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`{...}` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`{job=\"...\"}` is missing from the rewrite."}], "critical": 4, "warnings": 0, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "A single floating-point number, no labels attached", "problem": "The rewrite states the scalar type as \"One numb ash joining clauses; write two sentences\">\u2014</mark> a button gets clicked, a body enters an area, a timer runs out \u2014 and any number of other nodes can listen for that signal and react. The emitter <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know or care who, if anyone, <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is listening&#x27;\">is</mark> listening.\n\nIf <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> used event systems or the observer pattern in other frameworks, this will feel familiar. The main payoff is **decoupling**: your health bar UI <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need a reference to the player, and the player <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know a health bar exists. The player <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> announces &quot;my health changed,&quot; and whatever cares about that can hook in.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 29 words, limit 25\">Since</mark> Godot 4.0, signals are <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type), so you can pass them around, store them in variables, and connect to them directly instead of juggling string names.\n\n## The basic idea\n\n1. An object **emits** a signal \u2014 think of it as broadcasting an event.\n2. Any number of other objects can **connect** a callback (a method) to that signal beforehand.\n3. When the signal fires, Godot calls every connected callback, passing along whatever arguments the signal carries.\n\nA connection is a one-directional link: `A.some_signal \u2192 B.some_method`. Node A never references node B directly to make this happen<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 the connection lives on the signal itself.\n\n## Connecting through the editor\n\nFor nodes already in your scene tree, the quickest way to wire things up is the **Node dock \u2192 Signals tab**. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N1: instruction is 26 words, limit 20\">Select</mark> a node, and <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> see every signal it can <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> (built-in ones like `pressed` on a `Button`, plus any custom signals defined in its script).\n\nDouble-click a signal and Godot opens a connection dialog. Point it at the target node, and:\n\n- If the target has a script attached, Godot can auto-<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback method for you.\n- By convention, generated callbacks are named `_on_&lt;node_name&gt;_&lt;signal_name&gt;` (GDScript) or `On&lt;NodeName&gt;&lt;SignalName&gt;` (C#) \u2014 <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `_on_button_pressed`.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 36 words, limit 25\">There&#x27;s</mark> also an &quot;Advanced&quot; mode in that dialog that lets you connect to *any* method on *any* node (not <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> ones with attached scripts), pass extra bound arguments, and set connection flags like one-shot or deferred.\n\n<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N2: description is 34 words, limit 25\">The</mark> editor-made connection is stored in the scene file, and a little icon appears in the script&#x27;s gutter next to the callback so you can click it later to <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove the connection.\n\nOne caveat: <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 29 words, limit 25\">if</mark> you write your scripts in an external editor, Godot&#x27;s auto-stub-generation on connect <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> kick in <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> need to write the method yourself, or connect <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> code instead.\n\n## Connecting from code\n\nEditor connections only work for nodes that already exist in a saved scene. Anything you spawn or instantiate at runtime <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dynamically created enemies, procedurally added UI, <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>. \u2014 has to be connected in code.\n\nThe pattern is: get a reference to the signal-emitting object, then call `.connect()` on the signal, passing the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\n<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 28 words, limit 25\">In</mark> GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> no strings involved, so your IDE can autocomplete both the signal name and the callback. In C#, signals map onto C# events, so you hook them up with `+=` (and detach with `-=`).\n\n`_ready()` is the natural place to <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up these connections, <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> it runs once the node and its children are fully in the tree.\n\n### Disconnecting and one-shot connections\n\nYou can <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-G8: phrasal verb &#x27;tear down&#x27;; use &#x27;stop&#x27;\">tear</mark> down a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\n...though this is <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-L2: &#x27;fairly&#x27; carries no information; delete it\">fairly</mark> rare <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> most connections <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> live for the lifetime of both nodes. If you only want a callback to <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> once, pass the `CONNECT_ONE_SHOT` flag instead of manually disconnecting after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nGDScript lets you suspend a function until a signal fires, using `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nThis is handy for sequencing \u2014 <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. waiting for an animation or a delay without setting up a separate callback method.\n\n## Defining your own signals\n\nSignals <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> for built-in nodes <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you declare custom ones in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nA couple of naming notes: <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N2: description is 31 words, limit 25\">custom</mark> signals show up in the Signals dock exactly like built-in ones, and by convention <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> named as past-tense events (`health_depleted`, not `deplete_health`) <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> a signal represents something that *already happened*.\n\nTo <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> one, call `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Passing data with a signal\n\nSignals can carry arguments, declared in the signal definition itself:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese declared parameter names are mostly for documentation and editor tooling <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> they let the Signals dock <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a matching callback signature for you. Godot <mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> them at <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> time, so <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> on you to pass the <mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> values and the <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback <mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you&#x27;ll run into signals\n\n<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-N3: contraction &#x27;They&#x27;re&#x27;\">They&#x27;re</mark> everywhere in Godot&#x27;s built-in nodes, not <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> UI:\n\n- `Area2D.body_entered` \u2014 something physical entered a detection zone (great for pickups, triggers, hazards).\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, and similar UI signals for value changes, focus, resizing, <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events as nodes enter or leave the scene tree.\n\n<mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-N2: description is 35 words, limit 25\">Whenever</mark> you catch yourself wanting object A to directly call a method on object B <mark id=\"f64\" class=\"hit\" data-i=\" ction 'doesn't'", "excerpt": "Godot doesn't check them when the signal is actually emitted, so it's up to you to pass th", "line": 146, "column": 143, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 5797, "token": "doesn't"}, {"rule": "PSTE-L2", "message": "'actually' carries no information; delete it", "excerpt": "Godot doesn't check them when the signal is actually emitted, so it's up to you to pass th", "line": 146, "column": 181, "excerpt_offset": 44, "severity": "MUST", "arbitrated": false, "offset": 5835, "token": "actually"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "Godot doesn't check them when the signal is actually emitted, so it's up to you to pass th", "line": 146, "column": 202, "excerpt_offset": 65, "severity": "MUST", "arbitrated": false, "offset": 5856, "token": "it's"}, {"rule": "PSTE-L2", "message": "'just' carries no information; delete it", "excerpt": "A connected callback just needs matching parameters:", "line": 164, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "offset": 6248, "token": "just"}, {"rule": "PSTE-V3", "message": "'throughout' is not approved; use 'across'", "excerpt": "Signals show up throughout Godot's built-in nodes, not only in UI code:", "line": 173, "column": 17, "excerpt_offset": 16, "severity": "MUST", "arbitrated": false, "offset": 6430, "token": "throughout"}, {"rule": "PSTE-N2", "message": "description is 34 words, limit 25", "excerpt": "if you find yourself wanting object A to call a method on object B directly just because s", "line": 180, "column": 16, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 6835, "token": "if"}, {"rule": "PSTE-L2", "message": "'just' carries no information; delete it", "excerpt": "if you find yourself wanting object A to call a method on object B directly just because s", "line": 180, "column": 92, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 6911, "token": "just"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;task&#x27; is not approved; use &#x27;process&#x27;\">Task</mark> is content rewrite, not code. Doing it directly, plain style, no caveman (that governs my chat, not the doc content).\n\n# Signals: How Godot Objects Talk to Each Other\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 27 words, limit 25\">Godot&#x27;s</mark> signal system lets one object announce that something happened, and lets other objects react to it <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> without either side needing a direct reference to the other. A button gets clicked, a timer runs out, a body enters an area: the object involved **emits a signal**, and anything listening can respond. The emitter never needs to know who&#x27;s listening, or whether anyone is.\n\nIf you know the observer pattern or event systems from other frameworks, this is that idea. The benefit is **decoupling**: a health bar <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to hold a reference to the player, and the player <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know a health bar exists. The player <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> broadcasts &quot;health changed,&quot; and whatever cares about it can pick that up.\n\nAs of Godot 4.0, signals are <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type). You can store them in variables, pass them around, and connect to them directly <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than relying on string names.\n\n## How it works, in short\n\n1. An object **emits** a signal \u2014 it broadcasts an event.\n2. Other objects **connect** a method (a callback) to that signal <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;ahead of&#x27; is not approved; use &#x27;before&#x27;\">ahead</mark> of time.\n3. When the signal fires, Godot runs every connected callback, passing along any arguments the signal carries.\n\nA connection only goes one way: `A.some_signal \u2192 B.some_method`. Object A never holds a reference to object B<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 the link is owned by the signal, not by either node.\n\n## Connecting in the editor\n\nFor nodes already in your scene, use the **Node dock \u2192 Signals tab**. Selecting a node lists every signal it can <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> built-in ones (like a `Button`&#x27;s `pressed`) and any custom ones from its script.\n\nDouble-clicking a signal opens a connection dialog. Choose a target node, and:\n\n- If that node has a script, Godot can <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> an empty callback method for you automatically.\n- Generated callback names follow a convention: `_on_&lt;node_name&gt;_&lt;signal_name&gt;` in GDScript, `On&lt;NodeName&gt;&lt;SignalName&gt;` in C# \u2014<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\"> </mark>e.g. `_on_button_pressed`.\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 33 words, limit 25\">The</mark> dialog also has an &quot;Advanced&quot; mode, which lets you connect to any method on any node (script or not), pass extra fixed arguments, and set flags such as one-shot or deferred execution.\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Connections</mark> made this way are saved into the scene file, and a small icon appears next to the callback in the script&#x27;s gutter <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> click it to <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove the connection later.\n\nCaveat: if you edit scripts outside Godot&#x27;s own editor, the auto-generated stub <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> be created for you on connect. <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;You&#x27;ll&#x27;\">You&#x27;ll</mark> need to write the callback method yourself, or connect <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> code instead.\n\n## Connecting in code\n\nEditor connections only work for nodes already sitting in a saved scene. Anything created at runtime <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> spawned enemies, dynamically added UI, <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>. \u2014 must be connected through code instead.\n\nThe general pattern: get a reference to the object that emits the signal, then call `.connect()` on the signal itself, passing your callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\n<mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N2: description is 27 words, limit 25\">In</mark> GDScript, `timer.timeout.connect(callable)` treats the signal itself as an object with a `connect()` method <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> no strings needed, so both signal name and callback autocomplete in your IDE. In C#, signals become C# events, so you wire them up with `+=` and remove them with `-=`.\n\n`_ready()` is the usual place to set these connections up, <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> by then the node and its children are fully part of the tree.\n\n### Disconnecting, and one-shot connections\n\n`disconnect()` removes a connection:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;uncommon&#x27; is not approved; use &#x27;rare&#x27;\">uncommon</mark> in practice <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> most connections <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V3: &#x27;persist&#x27; is not approved; use &#x27;save&#x27;\">persist</mark> for as long as both nodes exist. If you only want a callback to run once, pass the `CONNECT_ONE_SHOT` flag when connecting, instead of disconnecting manually afterward:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Waiting on a signal\n\nGDScript&#x27;s `await` can pause a function until a signal fires:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nUseful for sequencing things <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> like waiting on an animation or a delay \u2014 without writing a separate callback method.\n\n## Creating your own signals\n\n<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-N3: contraction &#x27;You&#x27;re&#x27;\">You&#x27;re</mark> not limited to built-in signals <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> declare custom ones in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nTwo conventions worth knowing: <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 29 words, limit 25\">custom</mark> signals appear in the Signals dock <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> like built-in ones, and <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;typically&#x27; is not approved; use &#x27;usually&#x27;\">typically</mark> named as past-tense events (`health_depleted`, not `deplete_health`), <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> a signal represents something that already occurred.\n\n<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">Emit</mark> one with `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Sending data along with a signal\n\nSignals can carry arguments <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> declare these as part of the signal itself:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese parameter names mainly serve documentation and editor tooling <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> they let the Signals dock <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a matching callback signature. Godot <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> check them when the signal is <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> emitted, so <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> up to you to pass the correct values, in the correct number:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nA connected callback <mark offset": 31, "severity": "MUST", "arbitrated": false, "offset": 5481, "token": "emit"}, {"rule": "PSTE-P1", "message": "'You must' is not the imperative form; write the instruction as a command", "excerpt": "You must pass the correct values, in the correct count, yourself:", "line": 144, "column": 178, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5492, "token": "You"}, {"rule": "PSTE-V3", "message": "'trigger' is not approved; use 'call'", "excerpt": "This suits a pickup, a trigger, or a hazard.", "line": 173, "column": 92, "excerpt_offset": 23, "severity": "MUST", "arbitrated": false, "offset": 6200, "token": "trigger"}, {"rule": "PSTE-V3", "message": "'hazard' is not approved; use 'risk'", "excerpt": "This suits a pickup, a trigger, or a hazard.", "line": 173, "column": 106, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 6214, "token": "hazard"}], "html": "# Signals: Godot&#x27;s Event System\n\nA signal lets one Godot object <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;notify&#x27; is not approved; use &#x27;tell&#x27;\">notify</mark> others without a direct reference. A node emits a signal when something notable happens to it <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a button click, a body enters an area, a timer ends. Any number of other nodes can listen and react. The emitter does not need to know if a listener exists.\n\nThis resembles the observer pattern in other frameworks. The main benefit is **decoupling**. The health bar UI does not need a reference to the player. The player does not need to know a health bar exists. The player announces &quot;my health changed,&quot; and any interested object connects to that.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">Since</mark> Godot 4.0, a signal is a <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> value (the `Signal` type). You can pass it, store it in a variable, and connect to it directly, without a string name.\n\n## The basic idea\n\n1. An object **emits** a signal. This broadcasts an event.\n2. Other objects **connect** a callback (a method) to that signal beforehand.\n3. When the signal fires, Godot calls every connected callback and passes the signal&#x27;s arguments.\n\nA connection is a one-way link: `A.some_signal \u2192 B.some_method`. Node A never references node B to make this work. The connection lives on the signal.\n\n## Connecting through the editor\n\nFor nodes already in the scene tree, use the **Node dock \u2192 Signals tab**. Select a node to see every signal it can <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark>. This list includes built-in signals, such as `pressed` on a `Button`, and any custom signal from its script.\n\nDouble-click a signal to open a connection dialog. Point it at the target node.\n\n- If the target has a script, Godot can <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback method.\n- Godot names a generated callback `_on_&lt;node_name&gt;_&lt;signal_name&gt;` in GDScript, or `On&lt;NodeName&gt;&lt;SignalName&gt;` in C#. Example: `_on_button_pressed`.\n\nThe dialog also has an &quot;Advanced&quot; mode. In this mode you can connect to any method on any node, not only nodes with a script. You can also pass extra bound arguments and set connection flags, such as one-shot or deferred.\n\nGodot stores an editor connection in the scene file. It also adds an icon in the script&#x27;s gutter, next to the callback, so you can <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove the connection later.\n\nOne warning: auto-stub generation needs Godot&#x27;s own editor. If you write scripts in an external editor<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">,</mark> you must write the callback method yourself, or connect through code instead.\n\n## Connecting from code\n\nAn editor connection only works for a node that already exists in a saved scene. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must connect any node you spawn at runtime through code. This includes a dynamically created enemy or a UI element you add at runtime.\n\nThe pattern: get a reference to the signal-emitting object, then call `.connect()` on the signal, and pass it the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\nIn GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method. This uses no strings, so your IDE can autocomplete the signal name and the callback. In C#, a signal maps to a C# event. You connect it with `+=` and disconnect it with `-=`.\n\n`_ready()` is a good place for these connections. It runs once the node and its children are in the tree.\n\n### Disconnecting and one-shot connections\n\nUse `disconnect()` to remove a connection:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is rare. Most connections last for the life of both nodes. If a callback must <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> only once, pass the `CONNECT_ONE_SHOT` flag instead. This removes the need to disconnect it by hand after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nGDScript can pause a function until a signal fires. Use `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nUse this to <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;sequence&#x27; is not approved; use &#x27;order&#x27;\">sequence</mark> actions, such as a wait for an animation or a delay, without a separate callback method.\n\n## Defining your own signals\n\nYou can also declare a custom signal in any script, with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nTwo naming notes apply. First, a custom signal appears in the Signals dock the same way a built-in signal does. Second, by convention, name a signal as a past-tense event, such as `health_depleted`, not `deplete_health`. A signal represents something that already happened.\n\nCall `emit()` to <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> a signal:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Passing data with a signal\n\nA signal can carry arguments. You declare these in the signal definition:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese parameter names mainly serve documentation and editor tooling. They let the Signals dock <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a matching callback signature. Godot does not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> them at <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> time. <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must pass the correct values, in the correct count, yourself:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nA connected callback needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you will find signals\n\nGodot&#x27;s built-in nodes use signals in many places, not only in UI:\n\n- `Area2D.body_entered` \u2014 a physical body entered a detection zone. This suits a pickup, a <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;trigger&#x27; is not approved; use &#x27;call&#x27;\">trigger</mark>, or a <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;hazard&#x27; is not approved; use &#x27;risk&#x27;\">hazard</mark>.\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, and similar UI signals for a value change, focus, or resize.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events for y, without a string name.\n\n## The basic idea\n\n1. An object **emits** a signal. This broadcasts an event.\n2. Other objects **connect** a callback (a method) to that signal beforehand.\n3. When the signal fires, Godot calls every connected callback and passes the signal&#x27;s arguments.\n\nA connection is a one-way link: `A.some_signal \u2192 B.some_method`. Node A never references node B to make this work. The connection lives on the signal.\n\n## Connecting through the editor\n\nFor nodes already in the scene tree, use the **Node dock \u2192 Signals tab**. Select a node to see every signal it can <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark>. This list includes built-in signals, such as `pressed` on a `Button`, and any custom signal from its script.\n\nDouble-click a signal to open a connection dialog. Point it at the target node.\n\n- If the target has a script, Godot can <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback method.\n- Godot names a generated callback `_on_&lt;node_name&gt;_&lt;signal_name&gt;` in GDScript, or `On&lt;NodeName&gt;&lt;SignalName&gt;` in C#. Example: `_on_button_pressed`.\n\nThe dialog also has an &quot;Advanced&quot; mode. In this mode you can connect to any method on any node, not only nodes with a script. You can also pass extra bound arguments and set connection flags, such as one-shot or deferred.\n\nGodot stores an editor connection in the scene file. It also adds an icon in the script&#x27;s gutter, next to the callback, so you can <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove the connection later.\n\nOne warning: auto-stub generation needs Godot&#x27;s own editor. If you write scripts in an external editor, write the callback method yourself, or connect through code instead.\n\n## Connecting from code\n\nAn editor connection only works for a node that already exists in a saved scene. Connect any node you spawn at runtime through code instead. This includes a dynamically created enemy or a UI element you add at runtime.\n\nThe pattern: get a reference to the signal-emitting object, then call `.connect()` on the signal, and pass it the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\nIn GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method. This uses no strings, so your IDE can autocomplete the signal name and the callback. In C#, a signal maps to a C# event. You connect it with `+=` and disconnect it with `-=`.\n\n`_ready()` is a good place for these connections. It runs once the node and its children are in the tree.\n\n### Disconnecting and one-shot connections\n\nUse `disconnect()` to remove a connection:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is rare. Most connections last for the life of both nodes. If a callback must <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> only once, pass the `CONNECT_ONE_SHOT` flag instead. This removes the need to disconnect it by hand after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nGDScript can pause a function until a signal fires. Use `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nUse this to <mark id=\"f7\" class=\"hit\" data-i=\"7 const pick = document.getElementById("pick");
const grid = document.getElementById("grid");
const meta = document.getElementById("meta");
const prov = document.getElementById("prov");
const ask = document.getElementById("ask");

const docpick = document.getElementById("docpick");

prov.textContent = DATA.git && DATA.git.short

for (const id of ids) {

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

const STATUS_LABEL = {
  confirmed: "confirmed", "low-agreement": "low agreement", rejected: "rejected",
};

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also
// need reasons").
function semanticSectionHtml(a) {
  if (a.unjudged) {
    return `<div class="offenders semantic unjudged"><h3>Judge findings (semantic_lint.py)</h3>
        <p class="hint unjudged-note">UNJUDGED. The judge call for this cell failed and
        returned no result — an API limit is the usual cause. This is not "no
        findings": 52 of the standard's 77 rules need a judge, and none of them
        were checked here. Re-run the judge for this cell before treating it as
        clean.</p>
      </div>`;
  }
  const rows = a.semantic || [];
  if (!rows.length) return "";
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span></span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed").length;
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>
      <p class="hint">A model read this text for what a regular expression cannot
      check. ${confirmedN} of ${rows.length} row(s) are CONFIRMED (agreement at or
      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.</p>
      <ol>${items}</ol>
    </div>`;
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    // UNJUDGED is its own verdict, not a FAIL among others: the judging call
    // for this cell failed outright (an API limit, most often), so 52 of the
    // standard's 77 rules were never checked. It must never look like PASS
    // (a document the judge read and found clean) or an ordinary FAIL (one
    // the judge did check and objected to).
    const verdict = a.unjudged
      ? '<span class="verdict unjudged" title="the judge call for this cell '
        + 'failed and never returned a result. Mechanical and fact-loss checks '
        + 'still ran, but 52 of the standard’s 77 rules need a judge and '
        + 'were never checked. This is not a pass.">UNJUDGED</span>'
      : a.pass
        ? '<span class="verdict pass">PASS</span>'
        : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);

  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);

    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
