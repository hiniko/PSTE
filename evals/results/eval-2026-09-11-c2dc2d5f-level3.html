      + r.failures + "</span>");
  // PER-STAGE METERING (run.py PART 1): which half of the run burned the
  // budget. Absent on a result written before this existed.
  if (r.stages && r.stages.generation) bits.push("<b>generation</b>"
      + r.stages.generation.calls + " calls, " + r.stages.generation.seconds + "s");
  if (r.stages && r.stages.judging) bits.push("<b>judging</b>"
      + r.stages.judging.calls + " calls, " + r.stages.judging.seconds + "s");
  // JUDGE SAMPLING (run.py PART 2): which documents were judged this run.
  // Absent on a result written before sampling existed, or `judge_all`.
  const js = DATA.judgeSample || {};
  if (js.judge_all) {
    bits.push("<b>judged</b>all documents (--judge-all)");
  } else if (js.anchor_docs && js.anchor_docs.length) {
    bits.push("<b>anchors</b>" + esc(js.anchor_docs.join(", ")));
    bits.push("<b>rotating</b>" + esc((js.rotating_docs || []).join(", "))
      + " (offset " + js.rotation_offset + ")");
  }

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    // ANCHOR/ROTATING (run.py PART 2): which documents the judge looked at
    // this run, and why. An anchor is judged every run, for loop-over-loop
    // comparability; a rotating document is this run's coverage slice. A row
    // with neither badge was sampled out — its cells below say so.
    const sampleBadge = row.anchor
      ? ' <span class="verdict anchor" title="judged every run, for '
        + 'loop-over-loop comparability">ANCHOR</span>'
      : row.rotating
      ? ' <span class="verdict rotating" title="this run’s rotating '
        + 'coverage slice">ROTATING</span>'
      : "";
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + sampleBadge + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      // Every pass, and the share of them that conform. One draw cannot separate a
      // real change from ordinary variance, so the runs are shown beside the count.
      let sub = c.rules + " rule" + (c.rules === 1 ? "" : "s");
      if (c.of > 1) {
        sub += ' <span class="rate">' + c.passed + "/" + c.of + " pass "
             + c.rate + "%</span>"
             + '<div class="runs">' + c.runs.join(" \u00b7 ") + "</div>";
      }
      // Fact loss reads apart from the conformance count: a clean-but-lossy
      // cell (0 findings, factLoss true) must not look like a plain PASS, and
      // a lossy-and-non-conforming cell must show both, not just one number.
      const factTag = c.factLoss
        ? ' <span class="verdict factloss" title="faithfulness.py: a fact from '
          + 'the source is missing. Detects dropped tokens, not changed '
          + 'meaning.">FACT LOSS</span>'
        : "";
      // A CONFIRMED judge finding (semantic_lint.py) fails the verdict the same
      // way fact loss does. Low-agreement and rejected rows never do — they are
      // audit material, visible only on the document view.
      const semTag = c.semanticConfirmed
        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      // SAMPLED_OUT vs UNJUDGED: not selected by design reads differently
      // from a judge call that was made and failed. Both still force
      // pass=False (build_entry) — neither has actually been checked — but
      // conflating "we chose not to ask" with "we asked and got nothing" is
      // exactly the confusion this cell must not create.
      const semSub = c.sampledOut
        ? '<div class="cell-sub sampled-out-note">not judged this run — sampled out</div>'
        : c.unjudged
        ? '<div class="cell-sub unjudged-note">judge call failed — not checked</div>'
        : c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";
      // UNJUDGED gets its own cell class and label: it must never look like a
      // FAIL (the judge ran and objected) or a PASS (the judge ran and found
      // nothing). `c.pass` is already False for these (build_entry forces it),
      // this only controls how the cell reads visually. SAMPLED_OUT reuses
      // the same class (it is still not a pass and not a fail) but its own
      // label and tooltip, so "excluded by design" reads apart from
      // "the judge tried and failed" at a glance.
      const cellClass = c.unjudged ? "cell-unjudged" : (c.pass ? "cell-pass" : "cell-fail");
      const cellLabel = c.sampledOut ? "NOT JUDGED"
        : c.unjudged ? "UNJUDGED" : (c.pass ? "PASS" : c.findings);
      const cellTitle = c.sampledOut
        ? "not selected for judging this run (rotate-and-anchor sampling). "
          + "Not a failure — a deliberate coverage decision. Not a pass either: "
          + "this text was never checked against the semantic rules."
        : c.unjudged
        ? "the judge call for this cell failed and returned no result. Not a "
          + "pass — it was never checked."
        : "";
      body += '<td class="' + cellClass + win + '" title="' + cellTitle + '">'
            + cellLabel + factTag + semTag
            + '<div class="cell-sub">' + sub + "</div>" + semSub
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  // Real documents and synthetic ones are totalled separately, and both stay
  // visible. Real is the headline: it is what generalises to writing this
  // project did not itself produce. Synthetic is secondary, not hidden.
  function totalRow(label, totals) {
    let row = '<tr><td class="doc">' + esc(label) + "</td>";
    for (const a of arms) {
      const t = totals[a] || {pass:0,total:0,findings:0,runPass:0,runTotal:0,factLoss:0,semanticConfirmed:0,unjudged:0,sampledOut:0};
      if (!t.total) { row += "<td>-</td>"; continue; }
      let f = t.pass + "/" + t.total + " docs";
      if (t.runTotal > t.total) {
        f += '<div class="rate">' + t.runPass + "/" + t.runTotal + " runs "
           + Math.round(t.runPass * 100 / t.runTotal) + "%</div>";
      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      if (t.sampledOut) {
        f += '<div class="verdict sampled-out" title="not selected for '
           + 'judging this run (rotate-and-anchor sampling). A deliberate '
           + 'coverage decision, not a failure — and not a pass either.">'
           + t.sampledOut + " not judged</div>";
      }
      // A cell whose judge call actually failed, separate from one sampled
      // out by design: this count excludes the sampled-out cells above.
      const failedJudge = t.unjudged - t.sampledOut;
      if (failedJudge > 0) {
        f += '<div class="verdict unjudged" title="the judge call failed for '
           + 'these cells and never returned a result. Not passes — they were '
           + 'never checked.">' + failedJudge + " unjudged</div>";
      }
      row += "<td>" + t.findings + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth)
             // ANCHOR/ROTATING (run.py PART 2), independent of real/synthetic
             // — see overview()'s docstring. This is the row that shows
             // overfitting directly: if the anchor total's judge-confirmed
             // count improves run over run while the rotating total does not,
             // the skill is being tuned to the two documents graded every
             // time and not to the standard in general.
             + (Object.keys(o.totalsAnchor).length
                 ? totalRow("TOTAL (judged: anchor)", o.totalsAnchor) : "")
             + (Object.keys(o.totalsRotating).length
                 ? totalRow("TOTAL (judged: rotating)", o.totalsRotating) : "");

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. FACT LOSS marks a cell where faithfulness.py found a number, unit, "
    + "identifier, negation, or obligation missing against the source (PSTE-A1) "
    + "— that check catches dropped tokens, not changed meaning, so its "
    + "absence is not proof the rewrite is faithful. The green outline marks the "
    + "arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
</body>
</html>
