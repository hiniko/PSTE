 "arbitrated": false, "offset": 691, "token": "minor"}, {"rule": "PSTE-V3", "message": "'present' is not approved; use 'current'", "excerpt": "Before starting the restore operation, a snapshot file must be present.", "line": 20, "column": 64, "excerpt_offset": 63, "severity": "MUST", "arbitrated": false, "offset": 943, "token": "present"}, {"rule": "PSTE-V3", "message": "'remaining' is not approved; use 'other'", "excerpt": "either be a snapshot file from a previous backup operation, or from a remaining", "line": 21, "column": 71, "excerpt_offset": 70, "severity": "MUST", "arbitrated": false, "offset": 1029, "token": "remaining"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 71, "excerpt_offset": 67, "severity": "MUST", "arbitrated": false, "offset": 1303, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'be restored'; name the actor", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 78, "excerpt_offset": 74, "severity": "MUST", "arbitrated": false, "offset": 1310, "token": "be"}, {"rule": "PSTE-V3", "message": "'since' is not approved; use 'because'", "excerpt": "The usage of  CODE     for restoring has been **deprecated** since etcd v3.5.x and is slat", "line": 33, "column": 65, "excerpt_offset": 61, "severity": "MUST", "arbitrated": false, "offset": 1575, "token": "since"}, {"rule": "PSTE-V3", "message": "'utilize' is not approved; use 'use'", "excerpt": "It is recommended to utilize [ CODE    ]( URL                                             ", "line": 34, "column": 25, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "offset": 1659, "token": "utilize"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If the access URLs of the restored cluster are changed from the previous\ncluster, the Kube", "line": 52, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2651, "token": "If"}, {"rule": "PSTE-V3", "message": "'accordingly' is not approved; use 'so'", "excerpt": "cluster, the Kubernetes API server must be reconfigured accordingly.", "line": 53, "column": 57, "excerpt_offset": 56, "severity": "MUST", "arbitrated": false, "offset": 2780, "token": "accordingly"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If the majority of etcd members have permanently failed, the etcd cluster is\nconsidered fa", "line": 61, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3138, "token": "If"}, {"rule": "PSTE-V3", "message": "'the majority of' is not approved; use 'most'", "excerpt": "If the majority of etcd members have permanently failed, the etcd cluster is", "line": 61, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 3141, "token": "the"}, {"rule": "PSTE-P1", "message": "'please' is not the imperative form; write the instruction as a command", "excerpt": "For more details on etcd maintenance, please refer to the [etcd maintenance]( URL         ", "line": 76, "column": 37, "excerpt_offset": 36, "severity": "MUST", "arbitrated": false, "offset": 3771, "token": ","}], "html": "## Restoring an etcd cluster\n\nIf any API servers are running in your cluster<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;attempt&#x27; is not approved; use &#x27;try&#x27;\">attempt</mark> to\nrestore instances of etcd. Instead, follow these steps to restore etcd:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`,\n`kube-controller-manager`, `kubelet`) to <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> that they <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on some\nstale data. In practice the restore takes a bit of time.  During the\nrestoration, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;critical&#x27; is not approved; use &#x27;important&#x27;\">critical</mark> components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;minor&#x27; is not approved; use &#x27;small&#x27;\">minor</mark>](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;present&#x27; is not approved; use &#x27;current&#x27;\">present</mark>. It can\neither be a snapshot file from a previous backup operation, or from a <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;remaining&#x27; is not approved; use &#x27;other&#x27;\">remaining</mark>\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;utilize&#x27; is not approved; use &#x27;use&#x27;\">utilize</mark> [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;accordingly&#x27; is not approved; use &#x27;so&#x27;\">accordingly</mark>. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;the majority of&#x27; is not approved; use &#x27;most&#x27;\">the</mark> majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan be scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 305, "finding base. You use it everywhere: in the expression browser, in Grafana panels, in alerting rules, and in recording rules. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 34 words, limit 25\">This</mark> page covers the core concepts you need before writing your own queries <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> what a query returns, how time series are selected and filtered, and a handful of syntax details that trip people up.\n\n## Instant queries vs. range queries\n\nEvery PromQL expression can be evaluated in two ways:\n\n- **<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at a single point in time, producing one value per matching series. This is what powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start and end time, producing a series of points you can plot. This powers the &quot;Graph&quot; view.\n\nThe language itself <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> change between the two modes <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a range query is <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> an <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run over and over at different timestamps. Anything other than the built-in UI (dashboards, scripts, custom tooling) <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;typically&#x27; is not approved; use &#x27;usually&#x27;\">typically</mark> fetches these results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any sub-expression) always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, no labels attached |\n| **String** | A string value (rarely used in practice today) |\n\nNot every context accepts every type. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 34 words, limit 25\">Instant</mark> queries will accept any of the four as a <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> result<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> range queries only accept scalars and instant vectors as the top-level result <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> graph a range vector or a string directly.\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Samples</mark> themselves come in two flavors: ordinary **float** samples (a plain number) and **native histogram** samples (a full histogram with count, sum, and bucket data bundled into one sample). A single vector can contain a mix of both kinds. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 32 words, limit 25\">Native</mark> histograms know whether <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> a counter or a <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, so Prometheus can warn you if you apply the wrong <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> of function to them (<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., `rate()` on a <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram). <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 26 words, limit 25\">Ordinary</mark> float samples <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> carry that flavor information <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Prometheus <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> stop you from calling `rate()` on a float <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, even though the result will be meaningless. This is why counter metrics conventionally end in `_total`: <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a naming convention to help humans (and dashboards) avoid that mistake, not something PromQL enforces.\n\nOne more terminology note: a &quot;classic histogram&quot; <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There&#x27;s no such thing as a &quot;classic histogram sample&quot;<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> only native histograms <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;produce&#x27; is not approved; use &#x27;create&#x27;\">produce</mark> histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> possible query is <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a metric name:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> returns one sample per series carrying that metric name <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> specifically, the most <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> sample at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` scoped to a `job` label of `prometheus` and a `group` label of `canary` returns only series matching both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA subtlety worth knowing: <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series that have that label explicitly set to empty *and* series that <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have the label at all. <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-N2: description is 38 words, limit 25\">You</mark> can also repeat a matcher on the same label name <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> all of them have to pass for the series to be selected (<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., excluding one <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N2: description is 37 words, limit 25\">Because</mark> a selector made up of only regex matchers could otherwise match every series in the database, Prometheus requires that a selector contain a metric name or at least one matcher that <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> match an empty value. <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> selector with nothing but a wildcard-style regex on a single label is rejected<mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character in that regex makes it <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-N2: description is 47 words, limit 25\">Under</mark> the hood, the metric name is <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\">really</mark> <mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a label called `__name__`, so writing the metric name bare is <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-V3: &#x27;equivalent&#x27; is not approved; use &#x27;same&#x27;\">equivalent</mark> to matching `__name__` directly <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> and you can use non-`=` operators against it too, which lets you match every metric whose name starts with a given prefix. One quirk from this: <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-N2: description is 30 words, limit 25\">a</mark> few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> use them bare as a metric name<mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> matching them <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `__name__` explicitly is the workaround.\n\n### Range vector selectors\n\n<mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-V3: &#x27;append&#x27; is not approved; use &#x27;add&#x27;\">Append</mark> a <mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest one. The window is left-open, <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right-closed</mark> <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a sample sitting exactly on the start boundary is excluded, one sitting exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than displayed directly.\n\n## Durations\n\nTime durations are written as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nUnits can be chained as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.<mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-N2: description is 34 words, limit 25\"> </mark>Under the hood a<mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration is<mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\"> </mark>really<mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just a float literal in seconds<mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but you can only suffix a *decimal integer*, so `1.5h` and hex numbers with unit suffixes<mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\"> </mark>aren&#x27;t<mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\"> </mark>valid.\n\n<mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">You</mark> can also build a <mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic, anywhere a <mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected (range vector brackets, `offset`): multiplying `5m` by `2` gives a 10-minute window<mark id=\"f74\" class=\"hit\" data-i=\"74\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term gets used. There are also a few helper functions usable inside <mark id=\"f75\" class=\"hit\" data-i=\"75\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> expressions: <mark id=\"f76\" class=\"hit\" data-i=\"76\" title=\"PSTE-N2: description is 26 words, limit 25\">`</mark>step()` (the range-query step width, `0s` for<mark id=\"f77\" class=\"hit\" data-i=\"77\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clamping<mark id=\"f78\" class=\"hit\" data-i=\"78\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014<mark id=\"f79\" class=\"hit\" data-i=\"79\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\"> </mark>e.g. `max_of(step(), 5s)` never lets th<mark id=\"f80\" class=\"hit\" data-i=\"80\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">e</mark> duration drop below 5 seconds<mark id=\"f81\" class=\"hit\" data-i=\"81\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">.</mark> Duration expression<mark id=\"f82\" class=\"hit\" data-i=\"82\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">s</mark> aren&#x27;t allowed inside the `@` modifier, though.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago. <mark id=\"f83\" class=\"hit\" data-i=\"83\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines <mark id=\"f84\" class=\"hit\" data-i=\"84\" title=\"PSTE-L2: &#x27;naturally&#x27; carries no information; delete it\">naturally</mark> with functions <mark id=\"f85\" class=\"hit\" data-i=\"85\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, <mark id=\"f86\" class=\"hit\" data-i=\"86\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `http_requests_total @ 1609746000`.<mark id=\"f87\" class=\"hit\" data-i=\"87\" title=\"PSTE-N2: description is 36 words, limit 25\"> </mark>`start()` and `end()` are handy special values her<mark id=\"f88\" class=\"hit\" data-i=\"88\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">e</mark> \u2014 fo<mark id=\"f89\" class=\"hit\" data-i=\"89\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">r</mark> a range query they resolve to the query&#x27;s start/end and stay fixed across every st<mark id=\"f90\" class=\"hit\" data-i=\"90\" title=\"PSTE-X1: semicolon; write two sentences\">ep</mark>; for a<mark id=\"f91\" class=\"hit\" data-i=\"91\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">n</mark> instant query bot<mark id=\"f92\" class=\"hit\" data-i=\"92\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">h</mark> just resolve to the evaluation time.\n\nThe one rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. <mark id=\"f93\" class=\"hit\" data-i=\"93\" title=\"PSTE-N2: description is 29 words, limit 25\">Wrapping</mark> the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct<mark id=\"f94\" class=\"hit\" data-i=\"94\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order <mark id=\"f95\" class=\"hit\" data-i=\"95\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> matter <mark id=\"f96\" class=\"hit\" data-i=\"96\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\n<mark id=\"f97\" class=\"hit\" data-i=\"97\" title=\"PSTE-N2: description is 46 words, limit 25\">A</mark> subquery lets you run what is effectively an <mark id=\"f98\" class=\"hit\" data-i=\"98\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector <mark id=\"f99\" class=\"hit\" data-i=\"99\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> useful when you want to apply a range-vector function (like `max_over_time`) on top of something that&#x27;s already a rate or other computed expression, <mark id=\"f100\" class=\"hit\" data-i=\"100\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. wrapping `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional and defaults to the global evaluation <mark id=\"f101\" class=\"hit\" data-i=\"101\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\">interval</mark> if <mark id=\"f102\" class=\"hit\" data-i=\"102\" title=\"PSTE-V3: &#x27;omitted&#x27; is not approved; use &#x27;missing&#x27;\">omitted</mark>.\n\n## Everything else, briefly\n\n- <mark id=\"f103\" class=\"hit\" data-i=\"103\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Operators** (`+`, `and`, `on`, `group_left`, <mark id=\"f104\" class=\"hit\" data-i=\"104\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) are where most of PromQL&#x27;s actual power lives \u2014 worth a <mark id=\"f106\" class=\"hit\" data-i=\"106\" title=\"PSTE-V3: &#x27;dedicated&#x27; is not approved; use &#x27;own&#x27;\">dedicated</mark> read once <mark id=\"f107\" class=\"hit\" data-i=\"107\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. <mark id=\"f108\" class=\"hit\" data-i=\" ked stale, and once a query&#x27;s evaluation timestamp is past that staleness point, the series <mark id=\"f118\" class=\"hit\" data-i=\"118\" title=\"PSTE-L2: &#x27;simply&#x27; carries no information; delete it\">simply</mark> stops appearing in results <mark id=\"f119\" class=\"hit\" data-i=\"119\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> which is why a graph line will visibly end <mark id=\"f120\" class=\"hit\" data-i=\"120\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than flatline forever.\n\n<mark id=\"f121\" class=\"hit\" data-i=\"121\" title=\"PSTE-N2: description is 59 words, limit 25\">*</mark>*Performance.** A bare metric name selector can silently expand into thousands of series if the metric is high-cardinality, and any aggregation over that many series costs real work on the server even if the <mark id=\"f122\" class=\"hit\" data-i=\"122\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> output is a single number <mark id=\"f123\" class=\"hit\" data-i=\"123\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> much like summing a huge column in a SQL database <mark id=\"f124\" class=\"hit\" data-i=\"124\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> free <mark id=\"f125\" class=\"hit\" data-i=\"125\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because the result is one row. <mark id=\"f126\" class=\"hit\" data-i=\"126\" title=\"PSTE-N2: description is 35 words, limit 25\">When</mark> <mark id=\"f127\" class=\"hit\" data-i=\"127\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> exploring an unfamiliar metric, check it in the tabular view first, narrow it down with label matchers or aggregation until the result set is reasonably sized, and only then switch to graphing it. If a query is inherently expensive even after narr  id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 30 words, limit 25\">This</mark> page covers what you need before writing your own queries <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> what a query returns, how series get selected and filtered, and a few syntax details that trip people up.\n\n## Instant queries vs. range queries\n\nEvery PromQL expression can run two ways:\n\n- **<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at one point in time, one value per matching series. Powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start and end time, producing points you can plot. Powers the &quot;Graph&quot; view.\n\nThe language <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> change between modes <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a range query is <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> an <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run repeatedly at different timestamps. Anything besides the built-in UI (dashboards, scripts, custom tooling) <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;typically&#x27; is not approved; use &#x27;usually&#x27;\">typically</mark> pulls results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression, or any sub-expression, always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, no labels |\n| **String** | A string value (rarely used today) |\n\nNot every context takes every type. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> queries accept any of the four as a <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> result. Range queries only accept scalars and <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vectors at the top level <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> graph a range vector or a string directly.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">Samples</mark> come in two flavors: ordinary **float** samples (plain numbers) and **native histogram** samples (a full histogram <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> count, sum, buckets \u2014 bundled into one sample). A single vector can mix both kinds. Native histograms know whether <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> a counter or a <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, so Prometheus can warn you if you apply the wrong function to them (<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `rate()` on a<mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\"> </mark>gauge histogram). Ordinary float samples carry no such flavor<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 Prometheus<mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\"> </mark>can&#x27;t stop you calling `rate()` on a float<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\"> </mark>gauge, even though the result is meaningless. That&#x27;s why counter metrics conventionally end in `_total`: a naming convention to help humans and dashboards avoid the mistake, not something PromQL enforces.\n\nTerminology note: a &quot;classic histogram&quot; <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There&#x27;s no &quot;classic histogram sample&quot;<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> only native histograms <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;produce&#x27; is not approved; use &#x27;create&#x27;\">produce</mark> histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a bare metric name:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N2: description is 27 words, limit 25\">This</mark> returns one sample per series with that metric name <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> specifically the most <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> sample at or before the query&#x27;s evaluation time (subject to staleness rules, below).\n\nNarrow it down with label matchers in curly braces after the metric name. A query for `http_requests_total` scoped to `job=&quot;prometheus&quot;` and `group=&quot;canary&quot;` returns only series matching both.\n\nFour matcher operators:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches are always fully anchored <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> `=~` against `foo` behaves like `^foo$`, not a substring search. Regex flavor is RE2.\n\nSubtlety: <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series where that label is explicitly set to empty *and* series that <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have the label at all. You can also repeat a matcher on the same label name <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> all of them must pass (<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. excluding one value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N2: description is 36 words, limit 25\">Because</mark> a selector made only of regex matchers could otherwise match every series in the database, Prometheus requires a selector to contain a metric name or at least one matcher that <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> match an empty value. A selector with nothing but a wildcard-style regex on one label gets rejected<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character in that regex makes it <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-N2: description is 44 words, limit 25\">Under</mark> the hood, the metric name is <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\">really</mark> a label called `__name__` <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> writing the metric name bare is <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-V3: &#x27;equivalent&#x27; is not approved; use &#x27;same&#x27;\">equivalent</mark> to matching `__name__` directly, and you can use non-`=` operators against it too, letting you match every metric whose name starts with a given prefix. One quirk: <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N2: description is 30 words, limit 25\">a</mark> few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> use them bare as a metric name <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> matching them <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `__name__` explicitly is the workaround.\n\n### Range vector selectors\n\n<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-V3: &#x27;append&#x27; is not approved; use &#x27;add&#x27;\">Append</mark> a <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all samples from the last 5 minutes, not <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest. The window is left-open, <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right-closed</mark> <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a sample exactly on the start boundary is excluded, one exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` <mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than displayed directly.\n\n## Durations\n\nDurations are a number plus a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nChain units largest to smallest, each once: `1h30m`, `12h34m56s`.<mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-N2: description is 35 words, limit 25\"> </mark>Under the hood a<mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration is<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just a float literal in seconds<mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but only a *decimal integer* can take a unit suffix, so `1.5h` and hex numbers with unit suffixes are<mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\"> </mark>invalid.\n\n<mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">You</mark> can also build a <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic anywhere a <mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected (range vector brackets, `offset`): `5m * 2` gives a 10-minute windo<mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-X1: semicolon; write two sentences\">w</mark>; `1h / 2` gives a 30-minute offset. Usual `+ - * / % ^` operators, normal precedence. Note: `offset` needs the expression wrapped in parentheses, or only the first term gets used. Helper functions insid<mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">e</mark> duration expressions: `step()` (range-query step width, `0s` f<mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">or</mark> instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clampi<mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">ng</mark><mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\"> </mark>\u2014 e.g. `max_of(step(), 5s)` never lets <mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">the</mark> duration drop below 5 secon<mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">ds</mark>. Duration expressi<mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">ons</mark> aren&#x27;t allowed inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. `offset 5m` returns the value from 5 minutes ago.<mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-N2: description is 26 words, limit 25\"> </mark>Works on range vectors too, and combines with functions<mark id=\"f74\" class=\"hit\" data-i=\"74\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 ask for this week&#x27;s 5-minute rate as it looked a week ago by combining `[5m]` with `offset 1w`. A negative offset looks forward instead of back<mark id=\"f75\" class=\"hit\" data-i=\"75\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 occasionally useful for comparing against &quot;the future&quot; relative to an earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, <mark id=\"f76\" class=\"hit\" data-i=\"76\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `http_requests_total @ 1609746000`.<mark id=\"f77\" class=\"hit\" data-i=\"77\" title=\"PSTE-N2: description is 35 words, limit 25\"> </mark>`start()` and `end()` are handy special values her<mark id=\"f78\" class=\"hit\" data-i=\"78\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">e</mark> \u2014 fo<mark id=\"f79\" class=\"hit\" data-i=\"79\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">r</mark> a range query they resolve to the query&#x27;s start/end and stay fixed across every st<mark id=\"f80\" class=\"hit\" data-i=\"80\" title=\"PSTE-X1: semicolon; write two sentences\">ep</mark>; for a<mark id=\"f81\" class=\"hit\" data-i=\"81\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">n</mark> instant query both resolve to the evaluation time.\n\nOne rule for both modifiers: they bind to the selector immediately to their left, not the whole enclosing expression. Wrapping the bare selector (with its `offset` or `@` attached) inside `sum(...)` is correct<mark id=\"f82\" class=\"hit\" data-i=\"82\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> putting the modifier after `sum(...)`&#x27;s closing parenthesis is a syntax error.\n\n`offset` and `@` can <mark id=\"f83\" class=\"hit\" data-i=\"83\" title=\"PSTE-V3: &#x27;combine&#x27; is not approved; use &#x27;join&#x27;\">combine</mark> on the same selector, in either order <mark id=\"f84\" class=\"hit\" data-i=\"84\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset always applies relative to the `@` time.\n\n## Subqueries\n\nA subquery runs what&#x27;s effectively an <mark id=\"f85\" class=\"hit\" data-i=\"85\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector. Useful for applying a range-vector function (like `max_over_time`) on top of something that&#x27;s already a rate or other computed expression <mark id=\"f86\" class=\"hit\" data-i=\"86\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f87\" class=\"hit\" data-i=\"87\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. wrap `rate(metric[5m])` in `[30m:1m]` to get the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional<mark id=\"f88\" class=\"hit\" data-i=\"88\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> defaults to the global evaluation <mark id=\"f89\" class=\"hit\" data-i=\"89\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\">interval</mark> if <mark id=\"f90\" class=\"hit\" data-i=\"90\" title=\"PSTE-V3: &#x27;omitted&#x27; is not approved; use &#x27;missing&#x27;\">omitted</mark>.\n\n## Everything else, briefly\n\n- **Operators** (`+`, `and`, `on`, `group_left`, <mark id=\"f91\" class=\"hit\" data-i=\"91\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) and **functions** (`rate`, `sum`, `histogram_quantile`, dozens more) hold most of PromQL&#x27;s real power \u2014 worth a <mark id=\"f93\" class=\"hit\" data-i=\"93\" title=\"PSTE-V3: &#x27;dedicated&#x27; is not approved; use &#x27;own&#x27;\">dedicated</mark> read once selectors feel comfortable.\n- **Comments** start with `#`, run to end of line.\n- **String literals** use single quotes, double quotes, or backticks. Single/double-quoted strings follow Go&#x27;s escaping rules (backslash escapes plus octal/hex escapes)<mark id=\"f94\" class=\"hit\" data-i=\"94\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> backtick strings are raw \u2014 no escape processing, newlines preserved as-is.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators (<mark id=\"f95\" class=\"hit\" data-i=\"95\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `1_000_000`).\n\n## Two gotchas worth knowing up front\n\n<mark id=\"f96\" class=\"hit\" data-i=\"96\" title=\"PSTE-N2: description is 30 words, limit 25\">*</mark>*Stalenes excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 9794, "token": "*"}, {"rule": "PSTE-N2", "message": "description is 43 words, limit 25", "excerpt": "An aggregation over that many series costs real work on the server, even when the final ou", "line": 131, "column": 109, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 9902, "token": "An"}, {"rule": "PSTE-V3", "message": "'final' is not approved; use 'last'", "excerpt": "An aggregation over that many series costs real work on the server, even when the final ou", "line": 131, "column": 191, "excerpt_offset": 82, "severity": "MUST", "arbitrated": false, "offset": 9984, "token": "final"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "An aggregation over that many series costs real work on the server, even when the final ou", "line": 131, "column": 218, "excerpt_offset": 109, "severity": "SHOULD", "arbitrated": false, "offset": 10011, "token": "\u2014"}, {"rule": "PSTE-L2", "message": "'just' carries no information; delete it", "excerpt": "An aggregation over that many series costs real work on the server, even when the final ou", "line": 131, "column": 294, "excerpt_offset": 185, "severity": "MUST", "arbitrated": false, "offset": 10087, "token": "just"}], "html": "PromQL Basics\n\n## What PromQL does\n\nPromQL reads data from the Prometheus time series database. You use it in the expression browser, in Grafana panels, in alerting rules, and in recording rules.\n\nThis page covers the core ideas. It covers what a query returns, how it selects and filters series, and a few syntax points that cause errors.\n\n## Instant queries and range queries\n\nPromQL runs an expression in two ways.\n\nAn <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query runs at one point in time. It gives one value per matching series. This is the &quot;Table&quot; view in the Prometheus UI.\n\nA range query runs <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;same expression many times&#x27; over 3 words\">the</mark> same expression many times, at fixed steps, between a start time and an end time. It gives a series of points you can plot. This is the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is an <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query, run many times at different timestamps. Tools outside the UI <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dashboards, scripts, custom code \u2014 <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;fetch&#x27; is not approved; use &#x27;get&#x27;\">fetch</mark> these results through the Prometheus HTTP API.\n\n## What a query returns\n\nEvery expression returns one of four types.\n\n| Type | Content |\n|---|---|\n| Instant vector | A set of series. Each series has one sample, at one shared timestamp. |\n| Range vector | A set of series. Each series has a window of samples over time. |\n| Scalar | One number, with no labels. |\n| String | A string value. This type is rare in practice today. |\n\nNot every context takes every type. An <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query can return any of the four. A range query can return only a scalar or an <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vector <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you cannot graph a range vector or a string.\n\nA sample is one of two kinds. A float sample is a plain number. A native histogram sample holds a full histogram: count, sum, and bucket data, all in one sample. One vector can mix both kinds.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">A</mark> native histogram knows if it is a counter or a <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>. So Prometheus can warn you when you apply the wrong function to it <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, `rate()` on a <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram. A float sample carries no such flag. Prometheus cannot stop you from calling `rate()` on a float <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, even though the result means nothing. This is why counter metric names end in `_total`: a naming convention that helps a human avoid the mistake. PromQL does not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> it.\n\nOne more term to note. A &quot;classic histogram&quot; <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`, `_count`, and `_sum` trio of plain metrics \u2014 is <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There is no &quot;classic histogram sample&quot;. Only a native histogram produces a histogram-typed sample.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a bare metric name:\n\n```\nhttp_requests_total\n```\n\nThis returns one sample per series with that name. Each sample is the most <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> one at or before the query&#x27;s evaluation time, subject to the staleness rules below.\n\nTo narrow the result, add label matchers in curly braces after the metric name. A query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary` returns only series that match both.\n\nPromQL has four matcher operators.\n\n| Operator | Meaning |\n|---|---|\n| `=` | The label equals this string. |\n| `!=` | The label does not equal this string. |\n| `=~` | The label matches this regex. |\n| `!~` | The label does not match this regex. |\n\nA regex match in PromQL is always fully anchored. A `=~` match against `foo` works as `^foo$`, not as a substring search. The regex flavor is RE2.\n\nOne subtlety: <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 29 words, limit 25\">a</mark> matcher against an empty string on a label matches two kinds of series <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> series where the label is set to empty, and series where the label is missing. You can also repeat a matcher on the same label name. All of them must pass for the series to match. For example, you can exclude one value while also regex-matching a broader pattern on the same label.\n\nA selector built only from regex matchers could match every series in the database. So Prometheus requires a selector to contain a metric name, or at least one matcher that cannot match an empty value. A selector with only a wildcard-style regex on one label is rejected. Requiring one non-empty character in that regex makes it <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Under</mark> the hood, the metric name is a label named `__name__`. Writing the metric name bare is the same as matching `__name__` directly, and you can use the other operators against it too. This lets you match every metric name that starts with a given prefix. One side effect: a few words <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> `bool`, `on`, `ignoring`, `group_left`, `group_right` \u2014 are reserved as operator keywords. You cannot use them bare as a metric name. Matching them through `__name__` is the workaround.\n\n### Range vector selectors\n\nAdd a <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of one point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a range vector. <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each matching series, you get every sample from the last 5 minutes, not <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest one. The window excludes the start boundary and includes the end boundary. A sample exactly on the start time is left out. A sample exactly on the end time is kept.\n\nFunctions such as `rate()`, `increase()`, and `avg_over_time()` mostly <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;consume&#x27; is not approved; use &#x27;take&#x27;\">consume</mark> range vectors. You rarely <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;display&#x27; is not approved; use &#x27;show&#x27;\">display</mark> one directly.\n\n## Durations\n\nA <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is a number followed by a unit.\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h; ignores daylight saving time) |\n| `w` | weeks (7d) |\n| `y` | years (365d; ignores leap days) |\n\nYou can chain units if they go from largest to smallest, and each appears once: `1h30m`, `12h34m56s`.\n\nUnder the hood, a <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is a float literal in seconds. `1s` is `1`. `1ms` is `0.001`. But the suffix must follow a decimal integer, so `1.<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">5h</mark>` is not valid, and neither is a hex number with a unit suffix.\n\nYou can also build a <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic, anywhere a <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> inside range vector brackets, or after `offset`. Multiplying `5m` by `2` gives a 10-minute window. Dividing `1h` by `2` gives a 30-minute offset. The operators `+ - * / % ^` all work, at normal precedence. Note: after `offset`, wrap the expression in parentheses, or only the first term is used.\n\nA few helper functions work inside <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> expressions too: <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: description is 43 words, limit 25\">`</mark>step()` gives the range-query step width (`0s` for an<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant query<mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X1: semicolon; write two sentences\">)</mark>; `range()` gives the end time minus the start time of a range query (`0s` for an instant query); `min_of()` and `max_of()` clamp a value<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 for example, `max_of(step(), 5s)` never lets the<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration drop below 5 seconds. You cannot use a<mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration expression inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n`offset` shifts where a selector looks, relative to the query&#x27;s evaluation time. Adding `offset 5m` to a selector returns the value from 5 minutes ago. <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-N2: description is 33 words, limit 25\">It</mark> works on range vectors too, and combines with functions <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, you can ask for this week&#x27;s 5-minute rate as it looked a week ago, by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back. This is occasionally useful when you compare against &quot;the future&quot; relative to some earlier evaluation point.\n\n`@` pins a selector to an absolute Unix timestamp instead of a relative offset <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, `http_requests_total @ 1609746000`. Two special values help here: `start()` and `end()`. In a range query, they resolve to the query&#x27;s start and end time, and stay fixed across every step. In an<mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant query, both resolve to the evaluation time.\n\nRemember one rule for both modifiers: each one binds to the selector directly to its left, not to the whole enclosing expression. Wrapping the bare selector, with its `offset` or `@` attached, inside an aggregation such as `sum(...)` is correct. Putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\nYou can <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-V3: &#x27;combine&#x27; is not approved; use &#x27;join&#x27;\">combine</mark> `offset` and `@` on the same selector. The order does not matter <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset always applies relative to the `@` time.\n\n## Subqueries\n\nA subquery runs what is, <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-V3: &#x27;in effect&#x27; is not approved; use &#x27;active&#x27;\">in</mark> effect, an <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range. This turns the result into a range vector. <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-N1: instruction is 27 words, limit 20\">Use</mark> this when you want to apply a range-vector function, such as `max_over_time`, on top of an expression that is already a rate or another computed value. For example, wrap `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes, at 1-minute resolution. The resolution part is optional. If you <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;omit&#x27; is not approved; use &#x27;skip&#x27;\">omit</mark> it, PromQL uses the global evaluation <mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\">interval</mark>.\n\n## Other parts of the language\n\nOperators (`+`, `and`, `on`, `group_left`, and others) and functions (`rate`, `sum`, `histogram_quantile`, and dozens more) hold most of PromQL&#x27;s power. Read about them once you know selectors well.\n\nComments start with `#` and run to the end of the line.\n\nA string literal uses single quotes, double quotes, or backticks. A single- or double-quoted string follows Go&#x27;s escaping rules: backslash escapes, plus octal and hex escapes. A backtick string is raw. It applies no escape processing, and it keeps any newline inside it as-is.\n\nA numeric literal can be an integer, a decimal, scientific notation, a hex number, `Inf`, or `NaN`. You can use underscores as digit separators for readability, for example `1_000_000`.\n\n## Two things to know before you start\n\n<mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">*</mark>*Staleness.** A query samples at fixed timestamps that do not always <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with when data was <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> scraped. So Prometheus must pick a value to report at each timestamp. It uses the newest sample that is younger than the lookback period. The default lookback period is 5 minutes. You can tune it with the `--query.lookback-delta` flag, or with a per-query `lookback_delta` parameter. If a target stops being scraped, or disappears, its series is marked stale. Once a query&#x27;s evaluation timestamp passes that staleness point, the series stops appearing in results. This is why a graph line ends, instead of running flat forever.\n\n<mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">*</mark>*Performance.** A bare metric name can expand into thousands of series if the metric has high cardinality. <mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-N2: description is 43 words, limit 25\">An</mark> aggregation over that many series costs real work on the server, even when the <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> output is one number <mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> in the same way that summing a large column in a SQL database is not free <mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because the result is one row. When you explore a metric you do not know, check it in the table view first. Narrow it with label matchers or aggregation until the result set is a reasonable size. Only then switch to graphing it. If a query stays expensive even after you narrow it, use a recording rule: it computes the result once, so you query the cheap result each time after that.", "factLoss": true, "fidelity": {"source_words": 1880, "rewrite_words": 1752, "findings": [{"kind": "identifier", "severity": "critical", "message": "`.md` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`DST` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`{...}` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`{job=\"...\"}` is missing from the rewrite."}], "critical": 4, "warnings": 0, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "Every expression returns one of four types.", "problem": "The rewrite drops the scope qualifier \"(or any sub-expression)\" that the original at
