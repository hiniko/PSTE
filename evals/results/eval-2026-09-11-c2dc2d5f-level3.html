 highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;required&#x27; is not approved; use &#x27;necessary&#x27;\">Required</mark> Reading\n================\n\nIf <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each &#x27;<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final&#x27;</mark> release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than to make all the changes <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each feature\nrelease at once. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each feature release, use the latest patch release (<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;as well&#x27; is not approved; use &#x27;too&#x27;\">as</mark> well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nIf <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V3: &#x27;in order to&#x27; is not approved; use &#x27;to&#x27;\">in</mark> order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nAfter you <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark> in your mind, it may also be a good time to take <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;advantage&#x27; is not approved; use &#x27;benefit&#x27;\">advantage</mark> of new\nfeatures in Django by refactoring your code to <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V3: &#x27;eliminate&#x27; is not approved; use &#x27;remove&#x27;\">eliminate</mark> any deprecation\nwarnings.\n\nIf you <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate<mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please see our\nguide on :ref:`testing-pre-releases` for more <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-V3: &#x27;guaranteed&#x27; is not approved; use &#x27;certain&#x27;\">guaranteed</mark> to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the :func:`~django.views.decorators.cache.cache_page`\ndecorator.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 565, "findings": [{"rule": "PSTE-V3", "message": "'task' is not approved; use 'process'", "excerpt": "Plain doc rewrite task, no code/skill needed.", "line": 1, "column": 19, "excerpt_offset": 18, "severity": "MUST", "arbitrated": false, "offset": 18, "token": "task"}, {"rule": "PSTE-V3", "message": "'bug' is  48, "excerpt_offset": 23, "severity": "MUST", "arbitrated": false, "offset": 4171, "token": "aren't"}, {"rule": "PSTE-V3", "message": "'guaranteed' is not approved; use 'certain'", "excerpt": "cached pickled objects aren't guaranteed", "line": 127, "column": 55, "excerpt_offset": 30, "severity": "MUST", "arbitrated": false, "offset": 4178, "token": "guaranteed"}, {"rule": "PSTE-G4", "message": "perfect tense 'has happened'; use simple past", "excerpt": "This has happened before with", "line": 128, "column": 48, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "offset": 4236, "token": "has"}, {"rule": "PSTE-V3", "message": "'via' is not approved; use 'through'", "excerpt": "directly or via the :func:", "line": 130, "column": 13, "excerpt_offset": 12, "severity": "MUST", "arbitrated": false, "offset": 4347, "token": "via"}], "html": "Plain doc rewrite <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;task&#x27; is not approved; use &#x27;process&#x27;\">task</mark>, no code/skill needed.\n\n========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django gives you:\n\n* New features and improvements.\n* <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">Bug</mark> fixes.\n* Continued security updates \u2014 old Django versions eventually stop getting them\n  (see :ref:`supported-versions-policy`).\n* Easier future upgrades, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> staying current keeps your code base from\n  falling behind.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem, including <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;automated&#x27; is not approved; use &#x27;automatic&#x27;\">automated</mark> upgrade helpers listed\n    on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nBelow are things that help make the upgrade go smoothly.\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;required&#x27; is not approved; use &#x27;necessary&#x27;\">Required</mark> Reading\n================\n\nFirst upgrade? Read the :doc:`guide on the different release processes\n&lt;/internals/release-process&gt;` first.\n\nThen learn what changed in the new version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for every &#x27;<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final&#x27;</mark> release\n  from <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> after your current version through the version <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading\n  to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nFocus on backwards-incompatible changes <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> that&#x27;s what tells you what the\nupgrade <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> requires.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">Upgrading</mark> across more than one feature version (<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2)? Go one\nfeature release at a time (2.0 \u2192 2.1 \u2192 2.2) <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than making all the changes\nin one jump. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each feature release, use its latest patch release (<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. for\n2.1, use 2.1.15).\n\nSame <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> for LTS-to-LTS upgrades: go one at a time.\n\nDependencies\n============\n\nUsually <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> also need to upgrade your Django-related dependencies. If\nDjango&#x27;s new version <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> came out, or a dependency <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> well maintained,\nsome dependencies may not support it yet <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you may have to wait for updated\nreleases.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, clear any deprecation warnings your project raises on your\ncurrent Django version. Fixing these first tells you exactly what code needs\nchanging.\n\nPython hides deprecation warnings by default. Turn them on with the ``-Wa``\ncommand-line option or the :envvar:`PYTHONWARNINGS` environment variable. To\nshow warnings while testing:\n\n.. console::\n\n    $ python -Wa <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nUsing something other than the Django test runner? Make sure console output\n<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> captured, or <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;it&#x27;ll&#x27;\">it&#x27;ll</mark> hide the warnings. Example with `pytest\n&lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current Django version before\ncontinuing.\n\nNote: third-party packages may use deprecated APIs on purpose, to support\nmultiple Django versions <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> so warnings from installed packages <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark>\nnecessarily a <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest Django,\nconsider filing an issue or a pull request for it.\n\nInstallation\n============\n\n<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Ready</mark>? :doc:`Install the new Django version &lt;/topics/install&gt;`. For a major\nupgrade using a :mod:`virtual environment &lt;venv&gt;`, consider setting up a <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark>\nenvironment with all dependencies first.\n\nIf you installed Django <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> pip_, upgrade with ``--upgrade`` or ``-U``:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run your full test suite\n&lt;/topics/testing/overview&gt;`. Keep deprecation warnings on so they show in test\noutput (same flag works with ``manage.py runserver`` for manual testing):\n\n.. console::\n\n    $ python -Wa <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nFix any test failures. With the release notes <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark> in mind, this is also a\ngood time to refactor toward new features and <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;eliminate&#x27; is not approved; use &#x27;remove&#x27;\">eliminate</mark> deprecation warnings.\n\nUpgrading to an alpha, beta, or release candidate? See :ref:`testing-pre-releases`\nfor tips on catching regressions and reporting bugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works on the new Django version,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded project.\n\n<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you use Django&#x27;s caching, clear your cache after upgrading. Otherwise you\nmay hit problems \u2014 <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. cached pickled objects <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-V3: &#x27;guaranteed&#x27; is not approved; use &#x27;certain&#x27;\">guaranteed</mark>\npickle-compatible across Django versions. This <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-G4: perfect tense &#x27;has happened&#x27;; use simple past\">has</mark> happened before with\ncached pickled :class:`~django.http.HttpResponse` objects, whether cached\ndirectly or <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the :func:`~django.views.decorators.cache.cache_page`\ndecorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 647, "findings": [{"kind": "identifier", "severity": "critical", "message": "`install the new Django version\n</topics/install>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`pytest <https://docs.pytest.org/>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`run the full test suite\n</topics/testing/overview>` is missing from the rewrite."}, {"kind": "negation", "severity": "critical", "message": "the source negates 6 times, the rewrite 3. A lost negation reverses the meaning."}, {"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 11. Check that no condition was dropped."}], "critical": 4, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "Usually you'll also need to upgrade your Django-related dependencies.", "problem": "The original says to upgrade dependencies \"to the latest version\", and the rewrite drops that scope qualifier.", "fix": "Write \"In most cases you also need to upgrade your Django-related dependencies to their latest versions.\"", "reason": "PSTE-A1 forbids removing a scope qualifier, and \"upgrade your dependencies\" permits any newer version, not the latest one.", "confidence": "high", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 52, "column": 1, "o n": "set"}, {"rule": "PSTE-V3", "message": "'set up' is not approved; use 'install'", "excerpt": "After you set up the new environment, :doc:`run the full test suite", "line": 106, "column": 11, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 3699, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'turn on'; use 'enable'", "excerpt": "Turn on deprecation", "line": 107, "column": 51, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3807, "token": "Turn"}, {"rule": "PSTE-V3", "message": "'turn on' is not approved; use 'enable'", "excerpt": "Turn on deprecation", "line": 107, "column": 51, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3807, "token": "Turn"}, {"rule": "PSTE-V3", "message": "'manage' is not approved; use 'handle'", "excerpt": "$ python -Wa manage.py test", "line": 113, "column": 18, "excerpt_offset": 13, "severity": "MUST", "arbitrated": false, "offset": 3994, "token": "manage"}, {"rule": "PSTE-V3", "message": "'fresh' is not approved; use 'new'", "excerpt": "fresh, this is also a good time to use new Django features.", "line": 116, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4083, "token": "fresh"}, {"rule": "PSTE-V3", "message": "'specific' is not approved; use 'exact'", "excerpt": "It gives more specific tips on catching", "line": 120, "column": 44, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 4311, "token": "specific"}, {"rule": "PSTE-D2", "message": "paragraph has 10 sentences, limit 6", "excerpt": "If you use caching from Django, clear your cache after the upgrade. Otherwise\nyou may hit ", "line": 129, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4531, "token": "If"}, {"rule": "PSTE-V3", "message": "'guaranteed' is not approved; use 'certain'", "excerpt": "For example, pickled objects are not guaranteed to stay", "line": 130, "column": 60, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 4668, "token": "guaranteed"}, {"rule": "PSTE-L2", "message": "'problem' carries no information; delete it", "excerpt": "A past case of this problem was", "line": 131, "column": 63, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 4749, "token": "problem"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django gives <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">several</mark> benefits:\n\n* New features and improvements become available.\n* Bugs get fixes.\n* Old Django versions stop getting security updates over time\n  (see :ref:`supported-versions-policy`).\n* An upgrade with each new release keeps your code base current. This makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page lists <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;automated&#x27; is not approved; use &#x27;automatic&#x27;\">automated</mark> upgrade helpers.\n\nHere are some things that make your upgrade process smoother.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;required&#x27; is not approved; use &#x27;necessary&#x27;\">Required</mark> Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nAfter that, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> release. Start\n  with the release after your current Django version. End with the version you\n  plan to upgrade to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay attention to backwards incompatible changes. These tell you what the\nupgrade needs.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> you upgrade through more than one feature version (for example, 2.0 to\n2.2), upgrade through each feature release one at a time (2.0 to 2.1, then 2.1\nto 2.2). This is usually easier than making all the changes at once. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each\nfeature release, use the latest patch release (for example, for 2.1, use\n2.1.15).\n\nUse the same step-by-step <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> when you upgrade from one LTS version to\nthe next.\n\nDependencies\n============\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">In</mark> most cases<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">,</mark> you must also upgrade your Django-related dependencies to\ntheir latest versions. Some dependencies may not yet support the new Django\nversion. This happens when the Django version is <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark>, or when a dependency\nis not well maintained. In these cases, you may need to wait for new versions\nof your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, fix any deprecation warnings that your project raises\nunder your current Django version. This tells you which parts of the code\nneed changes before you upgrade.\n\nPython silences deprecation warnings by default. Turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while you run tests:\n\n.. console::\n\n    $ python -Wa <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nIf you do not use the Django test runner, also check that console output is\nnot captured, because captured output hides deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nFix any deprecation warnings under your current Django version before you\ncontinue the upgrade.\n\nThird-party applications may use deprecated APIs to support multiple Django\nversions. So a deprecation warning in an installed package does not always\nmean a <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package does not support the latest Django version,\nconsider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\nIf you use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade,\nconsider setting up a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation\nwarnings again so the test output shows them. You can also use this flag when\nyou test your app manually with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nAfter the tests run, fix any failures. While the release notes are still\n<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark>, this is also a good time to use new Django features. Refactor your\ncode to remove deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> tips on catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are confident your app works with the new Django version,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-D2: paragraph has 10 sentences, limit 6\">If</mark> you use caching from Django, clear your cache after the upgrade. Otherwise\nyou may hit problems. For example, pickled objects are not <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;guaranteed&#x27; is not approved; use &#x27;certain&#x27;\">guaranteed</mark> to stay\npickle-compatible across Django versions. A past case of this <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark> was\ncaching pickled :class:`~django.http.HttpResponse` objects, either directly or\nthrough the :func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 743, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 26. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "Otherwise you may hit problems. For example, pickled objects are not guaranteed", "problem": "The rewrite drops the condition \"if you are caching pickled objects\", so the reader loses the scope that limits when the problem occurs.", "fix": "Write \"Otherwise you may hit problems. For example, if you cache pickled objects, those objects are not guaranteed to stay pickle-compatible across Django versions.\"", "reason": "PSTE-A1 forbids removing a condition or scope qualifier that the source states, and the original restricted the risk to projects that cache pickled objects.", "confidence": "high", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-G9", "quote": "also check that console output is not captured", "problem": "The noun \"console output\" carries no article or demonstrative, and the original determiner \"any\" is gone.", "fix": "Write \"also check that the console output is not captured\".", "reason": "PSTE-G9 requires an article or a demonstrative before a noun where English grammar permits one.", "confidence": "medium", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 72, "column": 43, "offset": 2637}, {"rule": "PSTE-L4", "quote": "Fix any deprecation warnings under your current Django version before you continue", "problem": "This repeats the fact already stated at the start of the same section (\"Before you upgrade, fix any deprecation warnings that your project raises under your current Django version : 3189, "token": "problem"}, {"rule": "PSTE-V3", "message": "'manage' is not approved; use 'handle'", "excerpt": "$ python -Wa manage.py test", "line": 118, "column": 18, "excerpt_offset": 13, "severity": "MUST", "arbitrated": false, "offset": 4047, "token": "manage"}, {"rule": "PSTE-V3", "message": "'fresh' is not approved; use 'new'", "excerpt": "fresh, this is also a good time to use new Django features.", "line": 121, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4136, "token": "fresh"}, {"rule": "PSTE-V3", "message": "'specific' is not approved; use 'exact'", "excerpt": "It gives more specific tips on catching", "line": 125, "column": 44, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 4364, "token": "specific"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "For example, pickled objects are not guaranteed to stay\npickle-compatible across Django ve", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4685, "token": "For"}, {"rule": "PSTE-V3", "message": "'guaranteed' is not approved; use 'certain'", "excerpt": "For example, pickled objects are not guaranteed to stay", "line": 137, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 4722, "token": "guaranteed"}, {"rule": "PSTE-L2", "message": "'problem' carries no information; delete it", "excerpt": "A past case of this problem was", "line": 138, "column": 63, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 4803, "token": "problem"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "All 6 faults handled \u2014 imperative fix, both phrasal-verb swaps, and 3 paragraph splits (7\u2192", "line": 144, "column": 42, "excerpt_offset": 21, "severity": "SHOULD", "arbitrated": false, "offset": 5014, "token": "\u2014"}, {"rule": "PSTE-V3", "message": "'condition' is not approved; use 'state'", "excerpt": "All 6 faults handled \u2014 imperative fix, both phrasal-verb swaps, and 3 paragraph splits (7\u2192", "line": 144, "column": 211, "excerpt_offset": 190, "severity": "MUST", "arbitrated": false, "offset": 5183, "token": "condition"}], "html": "Fix scope: only the 6 listed faults. No rewrite elsewhere.\n\n========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django gives <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">several</mark> benefits:\n\n* New features and improvements become available.\n* Bugs get fixes.\n* Old Django versions stop getting security updates over time\n  (see :ref:`supported-versions-policy`).\n* An upgrade with each new release keeps your code base current. This makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page lists <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;automated&#x27; is not approved; use &#x27;automatic&#x27;\">automated</mark> upgrade helpers.\n\nHere are some things that make your upgrade process smoother.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;required&#x27; is not approved; use &#x27;necessary&#x27;\">Required</mark> Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nAfter that, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> release. Start\n  with the release after your current Django version. End with the version you\n  plan to upgrade to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay attention to backwards incompatible changes. These tell you what the\nupgrade needs.\n\nIf you upgrade through more than one feature version (for example, 2.0 to\n2.2), upgrade through each feature release one at a time (2.0 to 2.1, then 2.1\nto 2.2). This is usually easier than making all the changes at once.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each feature release, use the latest patch release (for example, for 2.1, use\n2.1.15).\n\nUse the same step-by-step <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> when you upgrade from one LTS version to\nthe next.\n\nDependencies\n============\n\nIn most cases, also upgrade your Django-related dependencies to\ntheir latest versions. Some dependencies may not yet support the new Django\nversion. This happens when the Django version is <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark>, or when a dependency\nis not well maintained.\n\nIn these cases, you may need to wait for new versions\nof your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, fix any deprecation warnings that your project raises\nunder your current Django version. This tells you which parts of the code\nneed changes before you upgrade.\n\nPython silences deprecation warnings by default. Turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while you run tests:\n\n.. console::\n\n    $ python -Wa <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nIf you do not use the Django test runner, also check that console output is\nnot captured, because captured output hides deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nFix any deprecation warnings under your current Django version before you\ncontinue the upgrade.\n\nThird-party applications may use deprecated APIs to support multiple Django\nversions. So a deprecation warning in an installed package does not always\nmean a <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package does not support the latest Django version,\nconsider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\nIf you use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade,\nconsider setting up a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you install the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Enable deprecation\nwarnings again so the test output shows them. You can also use this flag when\nyou test your app manually with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nAfter the tests run, fix any failures. While the release notes are still\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark>, this is also a good time to use new Django features. Refactor your\ncode to remove deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> tips on catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are confident your app works with the new Django version,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\nIf you use caching from Django, clear your cache after the upgrade. Otherwise\nyou may hit problems.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">For</mark> example, pickled objects are not <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;guaranteed&#x27; is not approved; use &#x27;certain&#x27;\">guaranteed</mark> to stay\npickle-compatible across Django versions. A past case of this <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark> was\ncaching pickled :class:`~django.http.HttpResponse` objects, either directly or\nthrough the :func:`~django.views.decorators.cache.cache_page` decorator.\n\n---\n\nLeft unfixed: none. All 6 faults handled <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> imperative fix, both phrasal-verb swaps, and 3 paragraph splits (7\u21926/1, 8\u21926/2, 10\u21926/4), splits placed at natural sentence joints without dropping any fact, number, or <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;condition&#x27; is not approved; use &#x27;state&#x27;\">condition</mark>.", "factLoss": false, "fidelity": {"source_  attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;additionally&#x27; is not approved; use &#x27;also&#x27;\">Additionally</mark>, block production slowed down <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">several</mark> bugs in <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;in addition&#x27; is not approved; use &#x27;too&#x27;\">In</mark> addition, fast forward spends are used for vaults. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;following&#x27; is not approved; use &#x27;next&#x27;\">following</mark> issues were the <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;root cause&#x27; is not approved; use &#x27;reason&#x27;\">root</mark> cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\">invalid</mark> <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on other parts of the spend bundle for being evicted  (<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;however&#x27; is not approved; use &#x27;but&#x27;\">However</mark>, we failed to validate that the singleton still existed. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> coin of a singleton. <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;duplicate&#x27; is not approved; use &#x27;copy&#x27;\">duplicate</mark> (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> and enter the mempool and propagate <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V3: &#x27;throughout&#x27; is not approved; use &#x27;across&#x27;\">throughout</mark> the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;throughout&#x27; is not approved; use &#x27;across&#x27;\">throughout</mark> the network (3)\n* Trying to stop the <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark> by melting the singleton makes the transactions not <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> transactions.\n* <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;prepared&#x27; is not approved; use &#x27;ready&#x27;\">prepared</mark>.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;the majority of&#x27; is not approved; use &#x27;most&#x27;\">the</mark> majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> the unfinished block reaches a timelord in a timely <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;manner&#x27; is not approved; use &#x27;way&#x27;\">manner</mark>. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N2: description is 29 words, limit 25\">W ain text rewrite, no code/commit content <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> writing normally per boundaries. Not a coding <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;task&#x27; is not approved; use &#x27;process&#x27;\">task</mark>, skipping skill machinery.\n\n# Block Creation Impacted by Mempool Issues\n\n## Issue Summary\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 28 words, limit 25\">Farmers</mark> eligible to create the next block have about 28 seconds to build an unfinished block and propagate it to a timelord, which infuses it into a finished block.\n\nFarmers pull transactions from the mempool in order of fee-per-cost and add them to the unfinished block, earning the attached fees.\n\nCNI found that while the mempool was full, transactions <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;weren&#x27;t&#x27;\">weren&#x27;t</mark> being included in blocks, and block production <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G4: perfect tense &#x27;had slowed&#x27;; use simple past\">had</mark> slowed below the expected rate. The cause: farmers <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;were failing&#x27;\">were</mark> failing to build unfinished blocks in time, due to <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">several</mark> bugs in the mempool&#x27;s handling of fast-forward spends.\n\nFast-forward spends let a singleton transaction apply to future versions of the singleton. This lets offer files reference singletons by coin ID, even though that ID changes with every state update.\n\nFast-forward spends are also used for vaults. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">Since</mark> pend the singleton&#x27;s most <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> coin. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 28 words, limit 25\">This</mark> mutated the mempool and propagated the fast-forwarded version to the rest of the network \u2014 duplicating the mempool item every time a farmer tried to form a block.\n\nCombined effect: someone could submit a fast-forward-eligible singleton spend, unbundled from any other spend, and:\n\n- It would be accepted into the mempool and propagate across the network as <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n- Each time a farmer built a block, the spend would multiply and the new versions would propagate further (<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 3).\n- Melting the singleton to stop the <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark> would make the transactions fail, but <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;wouldn&#x27;t&#x27;\">wouldn&#x27;t</mark> evict them from the mempool (<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 2). <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 28 words, limit 25\">In</mark> this <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;incident&#x27; is not approved; use &#x27;error&#x27;\">incident</mark>, the mempool was full of such spends when this happened \u2014 all failed during block creation, causing farmers to time out before finding any <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> transactions.\n- Farmers building blocks against the affected mempool items suffered performance issues severe enough to miss their block&#x27;s cutoff time for inclusion in the chain.\n\n## Timeline (PST, 02/13/2025\u201302/19/2025, all times approximate)\n\n- **02-13-2025 11:00 pm** \u2014 Mempool spendbundle count begins slowly increasing.\n- **02-14-2025 11:30 am** \u2014 Mempool cost hits max cost.\n- **02-14-2025 1:10 pm** \u2014 Mempool spendbundle count plateaus at ~6,200.\n- **02-14-2025 4:45 pm** \u2014 Chia blockchain netspace starts decreasing<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> timelord-infused blocks per minute drop noticeably.\n- **02-14-2025 11:00 pm** \u2014 CNI diagnoses the cause<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> a hotfix release is <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;prepared&#x27; is not approved; use &#x27;ready&#x27;\">prepared</mark>.\n- **02-15-2025 1:30 am** \u2014 Hotfix build process begins.\n- **02-15-2025 3:00 am** \u2014 Hotfix deployment completes as version 2.5.1.\n- **02-19-2025 3:15 pm** \u2014 Version 2.5.2 released, containing the fixes for the fast-forward bugs described above.\n\n## Resolution and Recovery\n\nBecause the Chia blockchain is decentralized, with many nodes running different configurations and versions, most of the netspace was unaffected by the fast-forward issues.\n\nVersion 2.5.1 introduced <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N5: multi-word noun &#x27;workaround capping unfinished-block creation time&#x27; over 3 words\">a</mark> workaround capping unfinished-block creation time, ensuring blocks reach a timelord promptly. Netspace began recovering toward previous levels after this release.\n\nVersion 2.5.2 included fixes that invalidated the fast-forward-related mempool items<mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the mempool cleared of these items as the userbase adopted v2.5.2:\n\n1. Spend bundles containing only fast-forward spends are now rejected on submission to the mempool.\n2. <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is rebased onto the latest singleton version, the mempool item is no longer updated in place \u2014 removing the risk of distributing the new copy to the network.\n3. When ingesting spend bundles, any fast-forward-eligible spend is now validated to <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;confirm&#x27; is not approved; use &#x27;check&#x27;\">confirm</mark> the latest version of that singleton (with the given puzzle hash) still exists.", "factLoss": true, "fidelity": {"source_words": 966, "rewrite_words": 807, "findings": [{"kind": "negation", "severity": "critical", "message": "the source negates 8 times, the rewrite 5. A lost negation reverses the meaning."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 803, "findings": [{"rule": "PSTE-V3", "message": "'task' is not approved; use 'process'", "excerpt": "Task fits caveman-vs-PSTE-vs-verbatim question.", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "Task"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'vs'; use 'compared with'", "excerpt": "Task fits caveman-vs-PSTE-vs-verbatim question.", "line": 1, "column": 19, "excerpt_offset": 18, "severity": "MUST", "arbitrated": false, "offset": 18, "token": "vs-PSTE-vs-verbatim"}, {"rule": "PSTE-V3", "message": "'task' is not approved; use 'process'", "excerpt": "This is a doc rewrite task with explicit rules (PSTE), not code \u2014 just do it directly a-i=\"6\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">Several</mark> bugs in the mempool logic for fast-forward spends caused this.\n\nA fast-forward spend lets a singleton transaction apply to future versions of the singleton.\n\nFast-forward spends let offer files refer to singletons by coin ID, even though the coin ID changes at every state update.\n\nFast-forward spends also serve vaults. The vault singleton must authorize every coin that belongs to it. Without fast-forward, only one vault spend could be &quot;in flight&quot; at a time, and that would limit the vault too much. Fast-forward lets multiple spends of the vault singleton sit in the mempool at the same time. Farmers deduplicate these spends and rebase them in <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;sequence&#x27; is not approved; use &#x27;order&#x27;\">sequence</mark> when they build a block.\n\n## Root cause\n\nCNI found three bugs:\n\n1. A fast-forward spend does not become <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\">invalid</mark> when its coin is spent. The system can fast-forward it to the latest version of the singleton. Fast-forward spends <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on other parts of the spend bundle to <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;trigger&#x27; is not approved; use &#x27;call&#x27;\">trigger</mark> eviction, for example when a block spends the coin. The system did not handle the case where a bundle held only a fast-forward spend. In that case, the system did not evict the spend after the singleton melted.\n2. A fast-forward spend could enter the mempool even after its coin was already spent. When the system builds a block, it fast-forwards the spend onto the latest version of the singleton. But the system did not check that the singleton still existed. So <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;mempool accepted singleton spends&#x27; over 3 words\">the</mark> mempool accepted singleton spends for singletons that had already melted and no longer existed.\n3. When the system built a block, it updated fast-forward spends in place to spend the most <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> coin of the singleton. This in-place update changed the mempool item and sent the updated version to the rest of the network. Each time a farmer built a block, this doubled the count of that mempool item.\n\nThese three bugs combined caused this chain of events, when someone submitted <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;fast-forward-eligible singleton spend alone&#x27; over 3 words\">a</mark> fast-forward-eligible singleton spend alone, without bundling it with any other spend:\n\n- The mempool accepted the spend as <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> and sent it across the network.\n- Each time a farmer built a block, the spend multiplied, and the network <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark> the new copies further (<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 3).\n- Melting the singleton, to try to stop the <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark>, made the transactions fail. But the mempool did not evict the failed spends (<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 2). In this case, the mempool was already full of these spends. All of these spends failed during block creation. This caused farmers to time out before they found any <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> transactions.\n- Farmers that tried to build a block with these mempool items ran into performance problems. This made them miss the time limit for their block to enter the blockchain.\n\n## Timeline (all times PST, 02-13-2025 to 02-19-2025, all approximate)\n\n- 02-13-2025 11:00 pm \u2014 Mempool spend bundle count starts to slowly rise.\n- 02-14-2025 11:30 am \u2014 Mempool cost reaches the maximum.\n- 02-14-2025 1:10 pm \u2014 Mempool spend bundle count plateaus at about 6200.\n- 02-14-2025 4:45 pm \u2014 Chia blockchain netspace starts to drop. Timelord-infused blocks per minute drop sharply.\n- 02-14-2025 11:00 pm \u2014 CNI diagnoses the cause and prepares a hotfix release of the Chia blockchain software.\n- 02-15-2025 1:30 am \u2014 The hotfix build process starts.\n- 02-15-2025 3:00 am \u2014 The hotfix deployment finishes as version 2.5.1.\n- 02-19-2025 3:15 pm \u2014 Version 2.5.2 releases. It includes the <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> fixes for the fast-forward issues in the <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;root cause&#x27; is not approved; use &#x27;reason&#x27;\">Root</mark> Cause section.\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized, and nodes run different configurations and versions. So most of the blockchain netspace was not affected by the fast-forward issues.\n\nVersion 2.5.1 adds a workaround: it caps the time allowed to create an unfinished block. This makes sure the unfinished block reaches a timelord in time. After the v2.5.1 release, netspace started to recover toward its earlier level.\n\nVersion 2.5.2 includes fixes that invalidate the mempool items from the fast-forward issues. As users adopted v2.5.2, the mempool cleared these items. The fixes:\n\n1. The mempool rejects a spend bundle that contains only fast-forward spends.\n2. When the system rebases a spend onto the latest version of the singleton, it does not update the item in the mempool. This avoids the risk of sending this new copy to the network.\n3. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 28 words, limit 25\">When</mark> the mempool takes in spend bundles, it checks any fast-forward-eligible spend to <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;confirm&#x27; is not approved; use &#x27;check&#x27;\">confirm</mark> that the latest version of the singleton, with the given puzzle hash, still exists.", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 921, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste_fixed": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 803, "findings": [{"rule": "PSTE-V3", "message": "'task' is not approved; use 'process'", "excerpt": "Task fits caveman-vs-PSTE-vs-verbatim question.", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "Task"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'vs'; use 'compared with'", "excerpt": "Task fits caveman-vs-PSTE-vs-verbatim question.", "line": 1, "column": 19, "excerpt_offset": 18, "severity": "MUST", "arbitrated": false, "offset": 18, "token": "vs-PSTE-vs-verbatim"}, {"rule": "PSTE-V3", "message": "'task' is not approved; use 'process'", "excerpt": "This is a doc rewrite task with explicit rules (PSTE), not code \u2014 just do it directly, no ", "line": 1, "column": 71, "excerpt_offset": 22, "severity": "MUST", "arbitrated": false, "offset": 70, "token": "task"}, {"rule": "PSTE- d spends caused this.\n\nA fast-forward spend lets a singleton transaction apply to future versions of the singleton.\n\nFast-forward spends let offer files refer to singletons by coin ID, even though the coin ID changes at every state update.\n\nFast-forward spends also serve vaults. The vault singleton must authorize every coin that belongs to it. Without fast-forward, only one vault spend could be &quot;in flight&quot; at a time, and that would limit the vault too much. Fast-forward lets multiple spends of the vault singleton sit in the mempool at the same time. Farmers deduplicate these spends and rebase them in <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;sequence&#x27; is not approved; use &#x27;order&#x27;\">sequence</mark> when they build a block.\n\n## Root cause\n\nCNI found three bugs:\n\n1. A fast-forward spend does not become <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\">invalid</mark> when its coin is spent. The system can fast-forward it to the latest version of the singleton. Fast-forward spends <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on other parts of the spend bundle to <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;trigger&#x27; is not approved; use &#x27;call&#x27;\">trigger</mark> eviction, for example when a block spends the coin. The system did not handle the case where a bundle held only a fast-forward spend. In that case, the system did not evict the spend after the singleton melted.\n2. A fast-forward spend could enter the mempool even after its coin was already spent. When the system builds a block, it fast-forwards the spend onto the latest version of the singleton. But the system did not check that the singleton still existed. So <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;mempool accepted singleton spends&#x27; over 3 words\">the</mark> mempool accepted singleton spends for singletons that had already melted and no longer existed.\n3. When the system built a block, it updated fast-forward spends in place to spend the most <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> coin of the singleton. This in-place update changed the mempool item and sent the updated version to the rest of the network. Each time a farmer built a block, this doubled the count of that mempool item.\n\nThese three bugs combined caused this chain of events, when someone submitted <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;fast-forward-eligible singleton spend alone&#x27; over 3 words\">a</mark> fast-forward-eligible singleton spend alone, without bundling it with any other spend:\n\n- The mempool accepted the spend as <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> and sent it across the network.\n- Each time a farmer built a block, the spend multiplied, and the network <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark> the new copies further (<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 3).\n- Melting the singleton, to try to stop the <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark>, made the transactions fail. But the mempool did not evict the failed spends (<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 2). In this case, the mempool was already full of these spends. All of these spends failed during block creation. This caused farmers to time out before they found any <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> transactions.\n- Farmers that tried to build a block with these mempool items ran into performance problems. This made them miss the time limit for their block to enter the blockchain.\n\n## Timeline (all times PST, 02-13-2025 to 02-19-2025, all approximate)\n\n- 02-13-2025 11:00 pm \u2014 Mempool spend bundle count starts to slowly rise.\n- 02-14-2025 11:30 am \u2014 Mempool cost reaches the maximum.\n- 02-14-2025 1:10 pm \u2014 Mempool spend bundle count plateaus at about 6200.\n- 02-14-2025 4:45 pm \u2014 Chia blockchain netspace starts to drop. Timelord-infused blocks per minute drop sharply.\n- 02-14-2025 11:00 pm \u2014 CNI diagnoses the cause and prepares a hotfix release of the Chia blockchain software.\n- 02-15-2025 1:30 am \u2014 The hotfix build process starts.\n- 02-15-2025 3:00 am \u2014 The hotfix deployment finishes as version 2.5.1.\n- 02-19-2025 3:15 pm \u2014 Version 2.5.2 releases. It includes the <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> fixes for the fast-forward issues in the <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;root cause&#x27; is not approved; use &#x27;reason&#x27;\">Root</mark> Cause section.\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized, and nodes run different configurations and versions. So most of the blockchain netspace was not affected by the fast-forward issues.\n\nVersion 2.5.1 adds a workaround: it caps the time allowed to create an unfinished block. This makes sure the unfinished block reaches a timelord in time. After the v2.5.1 release, netspace started to recover toward its earlier level.\n\nVersion 2.5.2 includes fixes that invalidate the mempool items from the fast-forward issues. As users adopted v2.5.2, the mempool cleared these items. The fixes:\n\n1. The mempool rejects a spend bundle that contains only fast-forward spends.\n2. When the system rebases a spend onto the latest version of the singleton, it does not update the item in the mempool. This avoids the risk of sending this new copy to the network.\n3. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 28 words, limit 25\">When</mark> the mempool takes in spend bundles, it checks any fast-forward-eligible spend to <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;confirm&#x27; is not approved; use &#x27;check&#x27;\">confirm</mark> that the latest version of the singleton, with the given puzzle hash, still exists.", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 921, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}}, "passes": {}}, "runbook-etcd-restore": {"category": "runbook", "title": "Restoring, upgrading, and maintaining an etcd cluster", "prompt": "", "attribution": "Rewritten from \"Restoring, upgrading, and maintaining an etcd cluster\" by The Kubernetes Authors, used under CC-BY-4.0. Source: https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md", "author": "The Kubernetes Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 470, "findings": [{"rule": "PSTE-P1", "message": "'you should' is not the imperative form; write the instruction as a command", "excerpt": "If any API servers are running in your cluster, you should not attempt to", "line": 3, "column": 47, "excerpt_off
