"column": 165, "excerpt_offset": 164, "severity": "SHOULD", "arbitrated": false, "weight": 0.1, "offset": 13302, "token": "\u2014"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "Verifying it works currently means reaching for Wireshark and checking that the ServerName", "line": 139, "column": 199, "excerpt_offset": 198, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 13336, "token": "it's"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "Verifying it works currently means reaching for Wireshark and checking that the ServerName", "line": 139, "column": 276, "excerpt_offset": 275, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 13413, "token": "aren't"}, {"rule": "PSTE-V9", "message": "marketing adjective 'modern'", "excerpt": "Verifying it works currently means reaching for Wireshark and checking that the ServerName", "line": 139, "column": 306, "excerpt_offset": 305, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 13443, "token": "modern"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "Verifying it works currently means reaching for Wireshark and checking that the ServerName", "line": 139, "column": 384, "excerpt_offset": 383, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 13521, "token": "don't"}], "html": "---\nmodel: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-09-11\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\ngrounding_url: https://raw.githubusercontent.com/caddyserver/website/master/src/docs/markdown/automatic-https.md\ngrounding_licence: Apache-2.0\nquestion: |\n  Write a documentation page for automatic HTTPS in the Caddy web server. A copy of an upstream page for this topic is mounted at /grounding/synth-caddy-automatic-https.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n# Automatic HTTPS in Caddy\n\nOne of Caddy&#x27;s defining features is that it handles TLS for you. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 39 words, limit 25\">Point</mark> it at a domain name and it will get a certificate, keep that certificate renewed, and redirect plain HTTP traffic over to HTTPS <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> all without extra flags, cron jobs, or a separate ACME client bolted on the side. This page explains how that machinery works and what to expect from it.\n\n## When it kicks in\n\nCaddy <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need a special &quot;enable HTTPS&quot; switch. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 48 words, limit 25\">It</mark> turns on automatic HTTPS the moment it sees a domain name or IP address somewhere in your configuration <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a site address in the Caddyfile, a host matcher in a JSON route, a `--domain`/`--from` flag on the command line, or an entry in the `automate` certificate loader. If Caddy knows what host <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> serving, it assumes you want that host served securely.\n\nThere are a handful of ways to <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G8: phrasal verb &#x27;opt out&#x27;; use &#x27;reject&#x27;\">opt</mark> out, in whole or in part:\n\n- Turn it off explicitly (`auto_https off` in the Caddyfile, or the equivalent JSON option)\n- Leave hostnames/IPs out of the config entirely\n- Bind only to the HTTP port\n- Prefix a Caddyfile address with `http://`\n- Load certificates manually yourself (Caddy <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> manage certs it <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;didn&#x27;t&#x27;\">didn&#x27;t</mark> provision, unless you tell it to via `ignore_loaded_certificates`)\n\nOne notable special case: <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 26 words, limit 25\">hostnames</mark> ending in `.ts.net` are handled by Tailscale, not Caddy&#x27;s own ACME logic <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Caddy fetches those certs from the local `tailscaled` instance at handshake time instead.\n\n## What actually happens\n\nOnce automatic HTTPS is live for a site, Caddy will:\n\n1. Obtain a certificate for every qualifying hostname\n2. Keep renewing it in the background for as long as the site is configured\n3. Add a redirect from HTTP (port 80) to HTTPS (port 443)\n\nThis is additive, not destructive <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> automatic HTTPS never overrides something you configured explicitly. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 38 words, limit 25\">If</mark> you already have your own listener on port 80, Caddy slots its redirect routes in after your host-matched routes but ahead of any catch-all route <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> defined, so your own HTTP handling still wins where <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> more specific.\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 28 words, limit 25\">You</mark> can tune or disable individual pieces of this (skip the redirect, exclude specific domains, <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) through the `automatic_https` JSON options, or via global options in the Caddyfile.\n\n## Which hostnames qualify\n\n<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">Caddy</mark> will manage a certificate for any hostname that&#x27;s non-empty, made up only of letters, digits, hyphens, dots, and an optional wildcard, and <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> start or end with a dot.\n\n<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 52 words, limit 25\">For</mark> a *publicly trusted* certificate (one signed by a real CA that browsers recognize), the hostname additionally <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> be `localhost` or end in `.local`, `.internal`, or `.home.arpa`, <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> be a bare IP address, and can only use a wildcard as the very first label <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> `*.example.com` is fine, `*.sub.example.com` or `foo.*.example.com` are not.\n\nAnything that <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> clear that second bar <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> `localhost`, `127.0.0.1`, a private hostname \u2014 still gets HTTPS, just not from a public <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>.\n\n## HTTPS for things the public internet can&#x27;t verify\n\nFor internal names and IP addresses, there&#x27;s no ACME authority willing to vouch for them, so Caddy runs its own miniature certificate authority instead. On first use it generates a root and an intermediate certificate (backed by Smallstep&#x27;s certificate libraries) and stores them in its data directory under `pki/authorities/local`. <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N2: description is 30 words, limit 25\">The</mark> intermediate signs the actual leaf certificates for your sites<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the root itself is only used to sign intermediates and is otherwise kept out of memory except when actively needed.\n\nFor clients to trust these certificates, the root has to land in the local trust store. <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 38 words, limit 25\">Caddy</mark> tries to install it there automatically the first time <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> used, which is why you may get a one-time password prompt <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> after that, it shows up as something like &quot;Caddy Local Authority&quot; in your system&#x27;s trust settings. You can skip this behavior (`skip_install_trust` / `install_trust: false`) or force it later with `caddy trust`, and remove it just as easily with `caddy untrust`. <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-N2: description is 31 words, limit 25\">In</mark> containers or under a locked-down service account, automatic installation may simply fail silently <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> at that point <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> on you to get the root cert into whatever trust store needs it.\n\nNone of this touches ACME or DNS validation<mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> purely local, and only useful to clients that trust that specific root.\n\n## Proving you own the domain: ACME challenges\n\nFor public certificates, the CA needs proof you control the domain before it will issue anything. <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-N2: description is 33 words, limit 25\">Caddy</mark> supports the three standard ACME challenge mechanisms, and if more than one is available it picks between them somewhat randomly at first, gradually favoring whichever has <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;been working&#x27;\">been</mark> working best for your setup.\n\n**HTTP challenge** <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Caddy serves a token over port 80 that the CA fetches directly. Needs port 80 reachable from the internet (or forwarded to Caddy&#x27;s HTTP port). On by default, zero config.\n\n**TLS-ALPN challenge** <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> similar idea, but the proof is embedded in a TLS handshake on port 443 using a special SNI/ALPN combination. Needs port 443 reachable. Also on by default, zero config.\n\n**DNS challenge** <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Caddy publishes a `TXT` record under `_acme-challenge` for the domain. <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N2: description is 35 words, limit 25\">This</mark> one needs no open ports at all and works even for servers with no public IP, but it does require credentials for your DNS provider so Caddy can create and remove the record itself. Enabling it turns the other two off by default. If your DNS host has no API of its own, you can delegate the `_acme-challenge` subdomain via CNAME to a zone that does. Provider support comes from community-maintained plugins.\n\nWildcard certificates are the one case where you <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> get a choice: <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt requires the DNS challenge for those, since there&#x27;s no HTTP or TLS endpoint that could prove ownership of an entire subdomain space.\n\n## Getting certificates for domains you didn&#x27;t list\n\nNormally Caddy needs every domain spelled out in the config so it can request certificates up front. **On-Demand TLS** flips that around: <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N2: description is 33 words, limit 25\">Caddy</mark> waits until a TLS handshake actually arrives for an unfamiliar SNI, holds that handshake open for a few seconds while it fetches a certificate, and completes it once the cert is ready. Every handshake after that is fast, since the certificate is cached and renewed quietly in the background.\n\n<mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> is the feature that makes sense when <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> fronting customer-supplied domains, SaaS tenants, or anything where the domain list changes faster than you&#x27;d want to reload config for. <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> a poor fit for a normal handful of sites you already know the names of.\n\nBecause anyone who can complete a TLS handshake to your server could otherwise trigger unlimited certificate requests, on-demand TLS *requires* a guardrail: <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-N2: description is 33 words, limit 25\">an</mark> &quot;ask&quot; endpoint that Caddy calls before requesting a cert, so you can check the domain against your own records (<mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., &quot;does this match a customer account?&quot;) and approve or deny it. There&#x27;s no way to enable on-demand TLS without also configuring this restriction.\n\n## Testing without burning rate limits\n\n<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt&#x27;s production rate limits are not generous, and hitting them can leave you unable to get real certificates for hours or days. While iterating on config, point the ACME issuer at the staging endpoint instead:\n\n```\nhttps://acme-staging-v02.api.letsencrypt.org/directory\n```\n\nStaging certs <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> trusted by browsers, but they let you validate that <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-N5: multi-word noun &#x27;whole issuance flow works&#x27; over 3 words\">the</mark> whole issuance flow works before switching back to production.\n\n## When something goes wrong\n\n<mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-N2: description is 32 words, limit 25\">Certificate</mark> management runs in the background by default, so a hiccup here <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> block startup or take a site down <mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it just means that site might not have a valid cert yet. Caddy&#x27;s retry sequence on failure looks roughly like:\n\n1. Retry once immediately, in case it was transient\n2. Try <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-N5: multi-word noun &#x27;next enabled challenge type&#x27; over 3 words\">the</mark> next enabled challenge type\n3. Once all challenge types are exhausted, <mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-G8: phrasal verb &#x27;fall back&#x27;; use &#x27;revert&#x27;\">fall</mark> back to the next configured CA\n4. Once all CAs are exhausted, back off exponentially, up to once a day, for up to 30 days\n\nBy default Caddy has two CAs configured <mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt and ZeroSSL \u2014 and will <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-G8: phrasal verb &#x27;fail over&#x27;; use &#x27;change&#x27;\">fail</mark> over between them automatically. During retries against <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt specifically, Caddy switches to their staging environment to avoid making <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-N5: multi-word noun &#x27;bad rate-limit situation worse&#x27; over 3 words\">a</mark> bad rate-limit situation worse.\n\n<mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-N2: description is 38 words, limit 25\">There&#x27;s</mark> also an internal cap (currently 10 attempts per ACME account per 10 seconds) so that pointing Caddy at a config with thousands of domains <mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> hammer the CA <mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-N3: contraction &#x27;it&#x27;ll&#x27;\">it&#x27;ll</mark> work through the list steadily rather than all at once. One side effect worth knowing: <mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-N2: description is 26 words, limit 25\">changing</mark> the config aborts any in-flight ACME transactions, so if <mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> bootstrapping a lot of certificates at once, batch your config changes rather than reloading repeatedly.\n\n## Where certificates and keys live\n\nEverything <mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> certificates, private keys, ACME account info \u2014 goes into Caddy&#x27;s configured storage backend, which defaults to the filesystem under `$HOME`. <mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-N2: description is 31 words, limit 25\">That</mark> directory needs to be writable and, importantly, *persistent*<mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> if it gets wiped on every restart, Caddy will look like <mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> re-provisioning certificates constantly (and may hit rate limits doing so). Before attempting any ACME work, Caddy sanity-checks that storage is writable and has room.\n\nIf multiple Caddy instances point at the same storage backend, they automatically coordinate as a cluster rather than racing each other for the same certificate.\n\n## Wildcard certificates\n\n<mark id=\"f74\" class=\"hit\" data-i=\"74\" title=\"PSTE-N2: description is 36 words, limit 25\">A</mark> wildcard cert covers `*.example.com`-style names, but only when the wildcard is the leftmost label <mark id=\"f75\" class=\"hit\" data-i=\"75\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> `sub.*.example.com` or `*.*.example.com` <mark id=\"f76\" class=\"hit\" data-i=\"76\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> qualify, since that&#x27;s a constraint of the public CA system, not something Caddy can work around.\n\nIn the Caddyfile, site names are taken literally: <mark id=\"f77\" class=\"hit\" data-i=\"77\" title=\"PSTE-N2: description is 29 words, limit 25\">a</mark> site block for `*.example.com` gets a wildcard cert, one for `sub.example.com` gets a cert just for that name <mark id=\"f78\" class=\"hit\" data-i=\"78\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f79\" class=\"hit\" data-i=\"79\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> two different requests, not <mark id=\"f80\" class=\"hit\" data-i=\"80\" title=\"PSTE-N5: multi-word noun &#x27;same wildcard cert reused&#x27; over 3 words\">the</mark> same wildcard cert reused. <mark id=\"f81\" class=\"hit\" data-i=\"81\" title=\"PSTE-N2: description is 28 words, limit 25\">Since</mark> Caddy 2.10, if you do have a wildcard cert covering a subdomain, Caddy will reuse it for that subdomain rather than separately requesting an individual certificate for it.\n\nWildcards are convenient at scale but come with a tradeoff worth knowing: <mark id=\"f82\" class=\"hit\" data-i=\"82\" title=\"PSTE-N2: description is 41 words, limit 25\">a</mark> single wildcard key covers every subdomain under it, so a leaked key exposes everything at once, and by themselves wildcards <mark id=\"f84\" class=\"hit\" data-i=\"84\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> hide *which* subdomains exist <mark id=\"f85\" class=\"hit\" data-i=\"85\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f86\" class=\"hit\" data-i=\"86\" title=\"PSTE-N5: multi-word noun &#x27;actual hostname still appears&#x27; over 3 words\">the</mark> actual hostname still appears in the TLS handshake unless <mark id=\"f87\" class=\"hit\" data-i=\"87\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> also using Encrypted ClientHello.\n\n## Hiding the hostname itself: Encrypted ClientHello (ECH)\n\n<mark id=\"f88\" class=\"hit\" data-i=\"88\" title=\"PSTE-N2: description is 39 words, limit 25\">Normally</mark> the domain name <mark id=\"f89\" class=\"hit\" data-i=\"89\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> connecting to (the SNI) is sent in plaintext during the TLS handshake, which is enough for a network observer to see what site <mark id=\"f90\" class=\"hit\" data-i=\"90\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> visiting even though the rest of the traffic is encrypted. <mark id=\"f91\" class=\"hit\" data-i=\"91\" title=\"PSTE-N2: description is 26 words, limit 25\">ECH</mark> closes that gap by wrapping the real (&quot;inner&quot;) ClientHello inside a decoy (&quot;outer&quot;) one that uses a public, shared name instead of your real domain.\n\n<mark id=\"f92\" class=\"hit\" data-i=\"92\" title=\"PSTE-N2: description is 35 words, limit 25\">Caddy</mark> can generate, publish, and rotate ECH configurations on its own <mark id=\"f93\" class=\"hit\" data-i=\"93\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it publishes the necessary parameters as an HTTPS-type DNS record, which requires a `caddy-dns` provider plugin so Caddy can write that record for you. A minimal Caddyfile setup looks like:\n\n```caddy\n{\n\tdns &lt;provider config...&gt;\n\tech example.com\n}\n```\n\n<mark id=\"f94\" class=\"hit\" data-i=\"94\" title=\"PSTE-N2: description is 45 words, limit 25\">Here</mark> `example.com` is the *public name* <mark id=\"f95\" class=\"hit\" data-i=\"95\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> an &quot;outer&quot; identity that your server must also hold a real certificate for, since <mark id=\"f96\" class=\"hit\" data-i=\"96\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> used as a fallback SNI when a client <mark id=\"f97\" class=\"hit\" data-i=\"97\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> yet decrypt the real one (say, because it <mark id=\"f98\" class=\"hit\" data-i=\"98\" title=\"PSTE-N3: contraction &#x27;hasn&#x27;t&#x27;\">hasn&#x27;t</mark> picked up a rotated key yet). Getting real privacy benefit out of ECH <mark id=\"f99\" class=\"hit\" data-i=\"99\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> just a config flag, though <mark id=\"f100\" class=\"hit\" data-i=\"100\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a few things matter in practice:\n\n- <mark id=\"f101\" class=\"hit\" data-i=\"101\" title=\"PSTE-N2: description is 31 words, limit 25\">Your</mark> DNS records need to already exist for a domain before Caddy will publish an HTTPS/ECH record for it, and it <mark id=\"f102\" class=\"hit\" data-i=\"102\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> publish one if the domain has a CNAME.\n- Clients only get the benefit if they resolve DNS securely (DoH/DoT) \u2014 plaintext DNS lookups leak the same information ECH <mark id=\"f103\" class=\"hit\" data-i=\"103\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is trying&#x27;\">is</mark> trying to protect.\n- Privacy scales with your *anonymity set*: the more sites sharing the same public name, the harder it is for an observer to distinguish between them. Using a different public name per domain defeats the purpose.\n- <mark id=\"f104\" class=\"hit\" data-i=\"104\" title=\"PSTE-N2: description is 34 words, limit 25\">If</mark> you also care about hiding which subdomains exist (not just the base domain), pair ECH with a wildcard certificate and be mindful that DNSSEC zone walking can leak subdomains through NSEC records regardless.\n\n<mark id=\"f105\" class=\"hit\" data-i=\"105\" title=\"PSTE-N2: description is 65 words, limit 25\">Verifying</mark> it works currently means reaching for Wireshark and checking that the ServerName field in the ClientHello shows your public name rather than the real one <mark id=\"f106\" class=\"hit\" data-i=\"106\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> tooling here is still thin, and <mark id=\"f107\" class=\"hit\" data-i=\"107\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> normal to see an `encrypted_client_hello` extension on connections that <mark id=\"f108\" class=\"hit\" data-i=\"108\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> really using ECH (most <mark id=\"f109\" class=\"hit\" data-i=\"109\" title=\"PSTE-V9: marketing adjective &#x27;modern&#x27;\">modern</mark> browsers send a decoy one, &quot;GREASE,&quot; even when talking to servers that <mark id=\"f110\" class=\"hit\" data-i=\"110\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> support it at all).\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 1828, "weighted": 7.4, "sentences": 151, "cleanSentences": {"clean": 135, "of": 151, "rate": 89.4}, "findings": [{"rule": "PSTE-G8", "message": "phrasal verb 'opt out'; use "line": 125, "column": 303, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 8883, "token": "are"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "It is used as a fallback SNI when a client cannot yet decrypt the real one (for example, b", "line": 154, "column": 118, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 11391, "token": "It"}, {"rule": "PSTE-V9", "message": "marketing adjective 'modern'", "excerpt": "Most modern browsers send a decoy one (\"GREASE\") even to servers that do not support ECH a", "line": 163, "column": 286, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 12596, "token": "modern"}], "html": "---\nmodel: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-09-11\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\ngrounding_url: https://raw.githubusercontent.com/caddyserver/website/master/src/docs/markdown/automatic-https.md\ngrounding_licence: Apache-2.0\nquestion: |\n  Write a documentation page for automatic HTTPS in the Caddy web server. A copy of an upstream page for this topic is mounted at /grounding/synth-caddy-automatic-https.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n# Automatic HTTPS in Caddy\n\nCaddy handles TLS for you. Give it a domain name and it will get a certificate, renew it, and redirect plain HTTP to HTTPS. You do not need extra flags, cron jobs, or a separate ACME client. This page explains how that works and what to expect.\n\n## When it turns on\n\nThere is no &quot;enable HTTPS&quot; switch. Automatic HTTPS turns on as soon as Caddy sees a domain name or IP address in your config. That can be:\n\n- a site address in the Caddyfile\n- a host matcher in a JSON route\n- a `--domain` or `--from` flag on the command line\n- an entry in the `automate` certificate loader\n\nIf Caddy knows which host it serves, it assumes you want that host served securely.\n\nYou can <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G8: phrasal verb &#x27;opt out&#x27;; use &#x27;reject&#x27;\">opt</mark> out, fully or partly, in these ways:\n\n- Turn it off explicitly (`auto_https off` in the Caddyfile, or the matching JSON option)\n- Leave hostnames and IPs out of the config\n- Bind only to the HTTP port\n- Prefix a Caddyfile address with `http://`\n- Load certificates manually. Caddy does not manage certs it did not provision, unless you tell it to with `ignore_loaded_certificates`\n\nOne special case: hostnames ending in `.ts.net` are handled by Tailscale, not by Caddy&#x27;s own ACME logic. Caddy fetches those certs from the local `tailscaled` instance at handshake time.\n\n## What it does\n\nWhen automatic HTTPS is on for a site, Caddy will:\n\n1. Get a certificate for every qualifying hostname\n2. Keep renewing it in the background for as long as the site is configured\n3. Add a redirect from HTTP (port 80) to HTTPS (port 443)\n\nThis only adds to your config. It never overrides something you set explicitly. If you already have your own listener on port 80, Caddy places its redirect routes after your host-matched routes but before any catch-all route you defined. Your own HTTP handling still wins where it is more specific.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 28 words, limit 25\">You</mark> can change or disable each piece (skip the redirect, exclude specific domains, and so on) with the `automatic_https` JSON options, or with global options in the Caddyfile.\n\n## Which hostnames qualify\n\nCaddy manages a certificate for any hostname that:\n\n- is not empty\n- contains only letters, digits, hyphens, dots, and an optional wildcard\n- does not start or end with a dot\n\nFor a *publicly trusted* certificate (signed by a real CA that browsers recognize), the hostname must also:\n\n- not be `localhost`\n- not end in `.local`, `.internal`, or `.home.arpa`\n- not be a bare IP address\n- only use a wildcard as the very first label. `*.example.com` is fine. `*.sub.example.com` and `foo.*.example.com` are not.\n\nNames that fail the second list (`localhost`, `127.0.0.1`, a private hostname) still get HTTPS, just not from a public <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>.\n\n## HTTPS for internal names and IP addresses\n\nNo ACME authority will vouch for internal names or IP addresses. So Caddy runs its own small certificate authority for them. On first use it generates a root certificate and an intermediate certificate (using Smallstep&#x27;s certificate libraries) and stores them in its data directory under `pki/authorities/local`. The intermediate signs the leaf certificates for your sites. The root only signs intermediates and stays out of memory except when needed.\n\nFor clients to trust these certificates, the root must be in the local trust store. Caddy tries to install it there automatically the first time it is used. This is why you may see a one-time password prompt. After that, it appears as something like &quot;Caddy Local Authority&quot; in your system&#x27;s trust settings.\n\n- Skip the install with `skip_install_trust` / `install_trust: false`\n- Force it later with `caddy trust`\n- Remove it with `caddy untrust`\n\nIn containers, or under a locked-down service account, the automatic install may fail silently. Then it is up to you to put the root cert into whatever trust store needs it.\n\nNone of this involves ACME or DNS validation. It is purely local, and only useful to clients that trust that specific root.\n\n## Proving you own the domain: ACME challenges\n\nFor public certificates, the CA needs proof that you control the domain before it issues anything. Caddy supports the three standard ACME challenge types. If more than one is available, Caddy picks between them somewhat randomly at first, then gradually favors whichever <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;has worked&#x27;; use simple past\">has</mark> worked best for your setup.\n\n**HTTP challenge.** Caddy serves a token over port 80 and the CA fetches it directly. Port 80 must be reachable from the internet (or forwarded to Caddy&#x27;s HTTP port). On by default, no config needed.\n\n**TLS-ALPN challenge.** Same idea, but the proof is embedded in a TLS handshake on port 443 using a special SNI/ALPN combination. Port 443 must be reachable. On by default, no config needed.\n\n**DNS challenge.** Caddy publishes a `TXT` record under `_acme-challenge` for the domain. It needs no open ports and works even for servers with no public IP. But it needs credentials for your DNS provider so Caddy can create and remove the record. Enabling it turns the other two off by default. If your DNS host has no API, you can delegate the `_acme-challenge` subdomain via CNAME to a zone that does. Provider support comes from community-maintained plugins.\n\nWildcard certificates give you no choice. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt requires the DNS challenge for them, because no HTTP or TLS endpoint can prove ownership of an entire subdomain space.\n\n## Certificates for domains you did not list\n\nNormally Caddy needs every domain listed in the config so it can request certificates up front. **On-Demand TLS** reverses this. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 32 words, limit 25\">Caddy</mark> waits until a TLS handshake arrives for an unfamiliar SNI, holds that handshake open for a few seconds while it fetches a certificate, and completes it once the cert is ready. Every later handshake is fast, because the certificate is cached and renewed quietly in the background.\n\nThis fits customer-supplied domains, SaaS tenants, or any case where the domain list changes faster than you want to reload config. It is a poor fit for a normal handful of sites whose names you already know.\n\nWithout limits, anyone who can complete a TLS handshake to your server could trigger unlimited certificate requests. So on-demand TLS *requires* a guardrail: an &quot;ask&quot; endpoint that Caddy calls before requesting a cert. You use it to check the domain against your own records (for example, &quot;does this match a customer account?&quot;) and approve or deny it. You cannot enable on-demand TLS without also configuring this restriction.\n\n## Testing without burning rate limits\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt&#x27;s production rate limits are strict. Hitting them can leave you unable to get real certificates for hours or days. While you work on config, point the ACME issuer at the staging endpoint instead:\n\n```\nhttps://acme-staging-v02.api.letsencrypt.org/directory\n```\n\nBrowsers do not trust staging certs, but they let you confirm <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;whole issuance flow works&#x27; over 3 words\">the</mark> whole issuance flow works before you switch back to production.\n\n## When something goes wrong\n\nCertificate management runs in the background by default. A failure does not block startup or take a site down. It just means that site may not have a valid cert yet. On failure, Caddy retries roughly like this:\n\n1. Retry once immediately, in case the failure was transient\n2. Try <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N5: multi-word noun &#x27;next enabled challenge type&#x27; over 3 words\">the</mark> next enabled challenge type\n3. When all challenge types are used up, <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G8: phrasal verb &#x27;fall back&#x27;; use &#x27;revert&#x27;\">fall</mark> back to the next configured CA\n4. When all CAs are used up, back off exponentially, up to once a day, for up to 30 days\n\nBy default Caddy has two CAs configured, <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt and ZeroSSL, and fails over between them automatically. During retries against <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt, Caddy switches to their staging environment so it does not make a rate-limit problem worse.\n\nThere is also an internal cap (currently 10 attempts per ACME account per 10 seconds). This stops a config with thousands of domains from hammering the <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>. Caddy works through the list steadily instead of all at once. One side effect: changing the config aborts any in-flight ACME transactions. If you <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are bootstrapping&#x27;\">are</mark> bootstrapping many certificates at once, batch your config changes instead of reloading repeatedly.\n\n## Where certificates and keys live\n\nCertificates, private keys, and ACME account info all go into Caddy&#x27;s configured storage backend. The default is the filesystem under `$HOME`. That directory must be writable and, importantly, *persistent*. If it is wiped on every restart, Caddy will appear to re-provision certificates constantly, and may hit rate limits doing so. Before any ACME work, Caddy checks that storage is writable and has room.\n\nIf several Caddy instances share the same storage backend, they coordinate as a cluster automatically instead of racing each other for the same certificate.\n\n## Wildcard certificates\n\nA wildcard cert covers `*.example.com`-style names, but only when the wildcard is the leftmost label. `sub.*.example.com` and `*.*.example.com` do not qualify. That is a rule of the public CA system, not something Caddy can work around.\n\nIn the Caddyfile, site names are taken literally. A site block for `*.example.com` gets a wildcard cert. A site block for `sub.example.com` gets a cert for just that name. These are two separate requests, not one wildcard cert reused. Since Caddy 2.10, if you already have a wildcard cert that covers a subdomain, Caddy reuses it for that subdomain instead of requesting a separate certificate.\n\nWildcards are convenient at scale but carry a tradeoff. One wildcard key covers every subdomain under it, so a leaked key exposes everything at once. Wildcards also do not hide *which* subdomains exist on their own. The real hostname still appears in the TLS handshake unless you also use Encrypted ClientHello.\n\n## Hiding the hostname: Encrypted ClientHello (ECH)\n\nNormally the domain you connect to (the SNI) is sent in plaintext during the TLS handshake. A network observer can see which site you visit even though the rest of the traffic is encrypted. ECH fixes this by wrapping the real (&quot;inner&quot;) ClientHello inside a decoy (&quot;outer&quot;) one that uses a public, shared name instead of your real domain.\n\nCaddy can generate, publish, and rotate ECH configurations by itself. It publishes the needed parameters as an HTTPS-type DNS record. This requires a `caddy-dns` provider plugin so Caddy can write that record for you. A minimal Caddyfile setup looks like:\n\n```caddy\n{\n\tdns &lt;provider config...&gt;\n\tech example.com\n}\n```\n\nHere `example.com` is the *public name*: an &quot;outer&quot; identity that your server must also hold a real certificate for. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> is used as a fallback SNI when a client cannot yet decrypt the real one (for example, because it has not picked up a rotated key yet).\n\nGetting real privacy from ECH takes more than a config flag. A few things matter in practice:\n\n- DNS records for a domain must already exist before Caddy will publish an HTTPS/ECH record for it. Caddy will not publish one if the domain has a CNAME.\n- Clients only benefit if they resolve DNS securely (DoH/DoT). Plaintext DNS lookups leak the same information ECH tries to protect.\n- Privacy grows with your *anonymity set*. The more sites that share the same public name, the harder it is for an observer to tell them apart. A different public name per domain defeats the purpose.\n- If you also want to hide which subdomains exist (not just the base domain), pair ECH with a wildcard certificate. Be aware that DNSSEC zone walking can still leak subdomains through NSEC records.\n\nTo verify it works, you currently need Wireshark. Check that the ServerName field in the ClientHello shows your public name, not the real one. Tooling is still thin here. It is also normal to see an `encrypted_client_hello` extension on connections that are not really using ECH. Most <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V9: marketing adjective &#x27;modern&#x27;\">modern</mark> browsers send a decoy one (&quot;GREASE&quot;) even to servers that do not support ECH at all.", "factLoss": true, "fidelity": {"source_words": 2117, "rewrite_words": 1971, "findings": [{"kind": "number", "severity": "critical", "message": "'1' is missing. The rewrite has '2'."}, {"kind": "condition", "severity": "warning", "message": "the source states 40 conditions, the rewrite 38. Check that no condition was dropped."}], "critical": 1, "warnings": 1, "f , organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n# Automatic HTTPS in Caddy\n\nCaddy manages TLS for you. Give it a domain name, and it gets a certificate, renews that certificate, and redirects HTTP traffic to HTTPS. You do not need extra flags, cron jobs, or a separate ACME client. This page explains how the mechanism works and what to expect from it.\n\n## When Caddy turns it on\n\nCaddy has no &quot;enable HTTPS&quot; switch. It turns on automatic HTTPS when it finds a domain name or an IP address in your configuration. Caddy looks in these places:\n\n- a site address in the Caddyfile\n- a host matcher in a JSON route\n- a `--domain` or `--from` flag on the command line\n- an entry in the `automate` certificate loader\n\nIf Caddy knows the host that it serves, it assumes that you want HTTPS for that host.\n\nYou can <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G8: phrasal verb &#x27;opt out&#x27;; use &#x27;reject&#x27;\">opt</mark> out, in whole or in part, in these ways:\n\n- Turn it off (`auto_https off` in the Caddyfile, or the equivalent JSON option).\n- Leave hostnames and IP addresses out of the config.\n- Bind only to the HTTP port.\n- Prefix a Caddyfile address with `http://`.\n- Load certificates yourself. Caddy does not manage certificates that it did not provision, unless you set `ignore_loaded_certificates`.\n\nSpecial case: Tailscale handles hostnames that end in `.ts.net`, not Caddy&#x27;s own ACME logic. Caddy fetches those certificates from the local `tailscaled` instance at handshake time.\n\n## What Caddy does\n\nWhen automatic HTTPS is on for a site, Caddy does three things:\n\n1. It obtains a certificate for every hostname that qualifies.\n2. It renews the certificate in the background for as long as the site is in the config.\n3. It adds a redirect from HTTP (port 80) to HTTPS (port 443).\n\nAutomatic HTTPS adds to your config. It never overrides a setting that you made yourself. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> you already have your own listener on port 80, Caddy places its redirect routes after your host-matched routes and before any catch-all route that you defined. So your own HTTP handling wins where it is more specific.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 27 words, limit 25\">You</mark> can change or disable each piece (skip the redirect, exclude specific domains, and others) with the `automatic_https` JSON options, or with global options in the Caddyfile.\n\n## Which hostnames qualify\n\nCaddy manages a certificate for a hostname that meets all of these rules:\n\n- It is not empty.\n- It contains only letters, digits, hyphens, dots, and an optional wildcard.\n- It does not start or end with a dot.\n\nFor a *publicly trusted* certificate (one that a real CA signs and browsers recognize), the hostname must also meet these rules:\n\n- It is not `localhost`.\n- It does not end in `.local`, `.internal`, or `.home.arpa`.\n- It is not a bare IP address.\n- It uses a wildcard only as the first label. `*.example.com` is fine. `*.sub.example.com` and `foo.*.example.com` are not.\n\nA hostname that fails the second set of rules, such as `localhost`, `127.0.0.1`, or a private hostname, still gets HTTPS. It does not get it from a public <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>.\n\n## HTTPS for hosts that the public internet cannot check\n\nNo ACME authority vouches for an internal name or an IP address. So Caddy runs its own small certificate authority for them. On first use, Caddy generates a root certificate and an intermediate certificate. Smallstep&#x27;s certificate libraries back this. Caddy stores them in its data directory under `pki/authorities/local`.\n\nThe intermediate signs the leaf certificates for your sites. The root only signs intermediates. Caddy keeps the root out of memory except when it needs it.\n\nFor clients to trust these certificates, the root must be in the local trust store. Caddy tries to install it there the first time it uses it. This is why you may see a one-time password prompt. After that, it appears as &quot;Caddy Local Authority&quot; or similar in your system&#x27;s trust settings.\n\nYou can skip this step (`skip_install_trust` or `install_trust: false`). You can force it later with `caddy trust`. You can remove it with `caddy untrust`. In a container or under a locked-down service account, automatic installation may fail silently. Then you must put the root certificate into the trust store that needs it.\n\nNone of this touches ACME or DNS validation. It is purely local. It is only useful to clients that trust that specific root.\n\n## Prove that you own the domain: ACME challenges\n\nFor a public certificate, the CA needs proof that you control the domain before it issues anything. Caddy supports the three standard ACME challenge types. If more than one is available, Caddy picks between them somewhat randomly at first. Over time it favors the one that works best for your setup.\n\n**HTTP challenge.** Caddy serves a token over port 80, and the CA fetches it directly. Port 80 must be reachable from the internet, or forwarded to Caddy&#x27;s HTTP port. It is on by default and needs no config.\n\n**TLS-ALPN challenge.** The idea is similar, but the proof sits inside a TLS handshake on port 443, with a special SNI and ALPN combination. Port 443 must be reachable. It is also on by default and needs no config.\n\n**DNS challenge.** Caddy publishes a `TXT` record under `_acme-challenge` for the domain. This challenge needs no open ports. It works even for a server with no public IP. But it needs credentials for your DNS provider, so that Caddy can create and remove the record itself. If you enable it, the other two challenges are off by default.\n\nIf your DNS host has no API, you can delegate the `_acme-challenge` subdomain with a CNAME to a zone that has one. Community-maintained plugins give the provider support.\n\nWildcard certificates give you no choice. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt requires the DNS challenge for them. No HTTP or TLS endpoint can prove ownership of a whole subdomain space.\n\n## Get certificates for domains that you did not list\n\nNormally Caddy needs every domain in the config, so that it can request certificates up front. **On-Demand TLS** reverses that. Caddy waits until a TLS handshake arrives for an unknown SNI. It holds that handshake open for a few seconds while it fetches a certificate. It completes the handshake when the certificate is ready. Every later handshake is fast, because Caddy caches the certificate and renews it in the background.\n\nThis feature fits customer-supplied domains, SaaS tenants, or any case where the domain list changes faster than you want to reload config. It is a poor fit for a normal set of sites whose names you already know.\n\nAnyone who can complete a TLS handshake to your server could otherwise trigger unlimited certificate requests. So On-Demand TLS *requires* a guardrail: an &quot;ask&quot; endpoint. Caddy calls this endpoint before it requests a certificate. You can check the domain against your own records (for example, &quot;does this match a customer account?&quot;) and approve or deny it. You cannot enable On-Demand TLS without this restriction.\n\n## Test without rate limits\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt&#x27;s production rate limits are not generous. If you hit them, you may not get real certificates for hours or days. While you work on config, point the ACME issuer at the staging A</mark>. Caddy works through the list steadily instead of all at once. One side effect: a config change aborts any in-flight ACME transaction. If you bootstrap many certificates at once, batch your config changes instead of repeated reloads.\n\n## Where certificates and keys live\n\nCaddy puts certificates, private keys, and ACME account info into its configured storage backend. The default is the filesystem under `$HOME`. That directory must be writable, and it must be *persistent*. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-L1: stacked hedging: appears, may\">If</mark> something wipes it on every restart, Caddy appears to re-provision certificates constantly, and may hit rate limits. Before any ACME work, Caddy checks that storage is writable and has room.\n\nIf several Caddy instances use the same storage backend, they coordinate as a cluster. They do not race each other for the same certificate.\n\n## Wildcard certificates\n\nA wildcard certificate covers names like `*.example.com`, but only when the wildcard is the leftmost label. `sub.*.example.com` and `*.*.example.com` do not qualify. This is a constraint of the public CA system, not something Caddy can work around.\n\nIn the Caddyfile, Caddy takes site names literally. A site block for `*.example.com` gets a wildcard certificate. A site block for `sub.example.com` gets a certificate for that name only. These are two different requests, not one wildcard certificate that both use. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 27 words, limit 25\">Since</mark> Caddy 2.10, if you have a wildcard certificate that covers a subdomain, Caddy reuses it for that subdomain instead of a separate request for an individual certificate.\n\nWildcards are convenient at scale, but they have a tradeoff. One wildcard key covers every subdomain under it, so a leaked key exposes all of them at once. Also, wildcards by themselves do not hide *which* subdomains exist. The real hostnam ecords regardless.\n\nTo check that ECH works, you currently need Wireshark. Check that the ServerName field in the ClientHello shows your public name, not the real one. Tooling here is still thin. It is normal to see an `encrypted_client_hello` extension on a connection that does not use ECH. Most <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V9: marketing adjective &#x27;modern&#x27;\">modern</mark> browsers send a decoy one (&quot;GREASE&quot;), even to servers that do not support ECH at all.", "factLoss": false, "fidelity": {"source_words": 2117, "rewrite_words": 2049, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste_fixed": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 1913, "weighted": 3.4, "sentences": 175, "cleanSentences": {"clean": 167, "of": 175, "rate": 95.4}, "findings": [{"rule": "PSTE-V8", "message": "Latin abbreviation 'ca.'; use 'about'", "excerpt": "It does not get it from a public CA.", "line": 68, "column": 156, "excerpt_offset": 33, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 3877, "token": "CA"}, {"rule": "PSTE-N3", "message": "contraction 'Let's'", "excerpt": "Let's Encrypt requires the DNS challenge for them.", "line": 94, "column": 49, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 6481, "token": "Let's"}, {"rule": "PSTE-N3", "message": "contraction 'Let's'", "excerpt": "Let's Encrypt's production rate limits are not generous.", "line": 106, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 7747, "token": "Let's"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'ca.'; use 'about'", "excerpt": "After all challenge types fail, use the next configured CA.", "line": 120, "column": 60, "excerpt_offset": 56, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 8586, "token": "CA"}, {"rule": "PSTE-N3", "message": pply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n# Automatic HTTPS in Caddy\n\nCaddy manages TLS for you. Give it a domain name, and it gets a certificate, renews that certificate, and redirects HTTP traffic to HTTPS. You do not need extra flags, cron jobs, or a separate ACME client. This page explains how the mechanism works and what to expect from it.\n\n## When Caddy turns it on\n\nCaddy has no &quot;enable HTTPS&quot; switch. It turns on automatic HTTPS when it finds a domain name or an IP address in your configuration. Caddy looks in these places:\n\n- a site address in the Caddyfile\n- a host matcher in a JSON route\n- a `--domain` or `--from` flag on the command line\n- a name in the `automate` certificate loader\n\nIf Caddy knows the host that it serves, it assumes that you want HTTPS for that host.\n\nYou can turn it off, in whole or in part, in these ways:\n\n- Turn it off (`auto_https off` in the Caddyfile, or the same option in JSON).\n- Leave hostnames and IP addresses out of the config.\n- Bind only to the HTTP port.\n- Prefix a Caddyfile address with `http://`.\n- Load certificates yourself. Caddy does not handle certificates that it did not provision, unless you set `ignore_loaded_certificates`.\n\nSpecial case: Tailscale handles hostnames that end in `.ts.net`, not Caddy&#x27;s own ACME logic. Caddy fetches those certificates from the local `tailscaled` instance at handshake time.\n\n## What Caddy does\n\nWhen automatic HTTPS is on for a site, Caddy does three things:\n\n1. It obtains a certificate for every hostname that qualifies.\n2. It renews the certificate in the background for as long as the site is in the config.\n3. It adds a redirect from HTTP (port 80) to HTTPS (port 443).\n\nAutomatic HTTPS adds to your config. It never overrides a setting that you made yourself. If you already have your own listener on port 80, Caddy places its redirect routes after your host-matched routes. It places them before any catch-all route that you defined. So your own HTTP handling wins where it is more exact.\n\nYou can change or disable each piece (skip the redirect, exclude some domains, and others). Use the `automatic_https` JSON options, or global options in the Caddyfile.\n\n## Which hostnames qualify\n\nCaddy manages a certificate for a hostname that meets all of these rules:\n\n- It is not empty.\n- It contains only letters, digits, hyphens, dots, and an optional wildcard.\n- It does not start or end with a dot.\n\nFor a *publicly trusted* certificate (one that a real CA signs and browsers recognize), the hostname must also meet these rules:\n\n- It is not `localhost`.\n- It does not end in `.local`, `.internal`, or `.home.arpa`.\n- It is not a bare IP address.\n- It uses a wildcard only as the first label. `*.example.com` is fine. `*.sub.example.com` and `foo.*.example.com` are not.\n\nA hostname that fails the second set of rules, such as `localhost`, `127.0.0.1`, or a private hostname, still gets HTTPS. It does not get it from a public <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>.\n\n## HTTPS for hosts that the public internet cannot check\n\nNo ACME authority vouches for an internal name or an IP address. So Caddy runs its own small certificate authority for them. On first use, Caddy generates a root certificate and an intermediate certificate. Smallstep&#x27;s certificate libraries back this. Caddy stores them in its data directory under `pki/authorities/local`.\n\nThe intermediate signs the leaf certificates for your sites. The root only signs intermediates. Caddy keeps the root out of memory except when it needs it.\n\nFor clients to trust these certificates, the root must be in the local trust store. Caddy tries to install it there the first time it uses it. This is why you may see a one-time password prompt. After that, it appears as &quot;Caddy Local Authority&quot; or similar in your system&#x27;s trust settings.\n\nYou can skip this step (`skip_install_trust` or `install_trust: false`). You can force it later with `caddy trust`. You can remove it with `caddy untrust`. In a container or under a locked-down service account, automatic installation may fail silently. Then you must put the root certificate into the trust store that needs it.\n\nNone of this touches ACME or DNS validation. It is purely local. It is only useful to clients that trust that exact root.\n\n## Prove that you own the domain: ACME challenges\n\nFor a public certificate, the CA needs proof that you control the domain before it issues anything. Caddy supports all three ACME challenge types. If more than one is available, Caddy picks between them randomly at first. Over time it favors the one that works best for your setup.\n\n**HTTP challenge.** Caddy serves a token over port 80, and the CA fetches it directly. Port 80 must be reachable from the internet, or forwarded to Caddy&#x27;s HTTP port. It is on by default and needs no config.\n\n**TLS-ALPN challenge.** The idea is similar, but the proof sits inside a TLS handshake on port 443, with a special SNI and ALPN combination. Port 443 must be reachable. It is also on by default and needs no config.\n\n**DNS challenge.** Caddy publishes a `TXT` record under `_acme-challenge` for the domain. This challenge needs no open ports. It works even for a server with no public IP. But it needs credentials for your DNS provider, so that Caddy can create and remove the record itself. If you enable it, the other two challenges are off by default.\n\nIf your DNS host has no API, you can delegate the `_acme-challenge` subdomain with a CNAME to a zone that has one. Community-maintained plugins give the provider support.\n\nWildcard certificates give you only one option. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt requires the DNS challenge for them. No HTTP or TLS endpoint can prove ownership of a whole subdomain space.\n\n## Get certificates for domains that you did not list\n\nNormally Caddy needs every domain in the config, so that it can request certificates up front. **On-Demand TLS** reverses that. Caddy waits until a TLS handshake arrives for an unknown SNI. It holds that handshake open for a few seconds while it fetches a certificate. It completes the handshake when the certificate is ready. Every later handshake is fast, because Caddy caches the certificate and renews it in the background.\n\nThis feature fits customer-supplied domains, SaaS tenants, or any case where the domain list changes faster than you want to reload config. It is a bad fit for a normal set of sites whose names you already know.\n\nAnyone who can complete a TLS handshake to your server could otherwise cause unlimited certificate requests. So On-Demand TLS *requires* a guardrail: an &quot;ask&quot; endpoint. Caddy calls this endpoint before it requests a certificate. You can check the domain against your own records (for example, &quot;does this match a customer account?&quot;) and accept or reject it. You cannot enable On-Demand TLS without this restriction.\n\n## Test without rate limits\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt&#x27;s production rate limits are not generous. If you hit them, you may not get real certificates for hours or days. While you work on config, point the ACME issuer at the staging endpoint:\n\n```\nhttps://acme-staging-v02.api.letsencrypt.org/directory\n```\n\nBrowsers do not trust staging certificates. But they let you check that the whole flow of issuance works before you switch back to production.\n\n## When something goes wrong\n\nCertificate management runs in the background by default. So a failure does not block startup or take a site down. It only means that the site may not have a valid certificate yet. On failure, Caddy retries in roughly this order:\n\n1. Retry once immediately, in case the failure was transient.\n2. Try the next challenge type that is enabled.\n3. After all challenge types fail, use the next configured <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>.\n4. After all CAs fail, back off exponentially, up to once a day, for up to 30 days.\n\nBy default Caddy has two CAs: <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt and ZeroSSL. It fails over between them automatically. During retries against <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;Let&#x27;s&#x27;\">Let&#x27;s</mark> Encrypt, Caddy switches to their staging environment. This avoids a worse rate-limit situation.\n\nCaddy also has an internal limit, now 10 attempts per ACME account per 10 seconds. So a config with thousands of domains does not hammer the <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V8: Latin abbreviation &#x27;ca.&#x27;; use &#x27;about&#x27;\">CA</mark>. Caddy works through the list steadily instead of all at once. One side effect: a config change aborts any in-flight ACME transaction. If you request many certificates at once, batch your config changes instead of repeated reloads.\n\n## Where certificates and keys live\n\nCaddy puts certificates, private keys, and ACME account info into its configured storage backend. The default is the filesystem under `$HOME`. That directory must be writable, and it must be *persistent*. If something wipes it on every restart, Caddy re-provisions certificates on every restart. That can hit rate limits. Before any ACME work, Caddy checks that storage is writable and has space.\n\nIf more than one Caddy instance uses the same storage backend, they coordinate as a cluster. They do not race each other for the same certificate.\n\n## Wildcard certifica model: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-09-11\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\ngrounding_url: https://raw.githubusercontent.com/borgbackup/borg/master/docs/quickstart.rst\ngrounding_licence: BSD-3-Clause\nquestion: |\n  Write a documentation page for the backup and restore quickstart workflow in BorgBackup. A copy of an upstream page for this topic is mounted at /grounding/synth-borg-quickstart.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# BorgBackup: Backup and Restore Quickstart\n\nBorgBackup (`borg`) is a deduplicating backup tool. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 31 words, limit 25\">It</mark> splits the files you back up into chunks, stores each unique chunk exactly once in a repository, and can encrypt everything on the client before it ever leaves your machine. This guide walks through the core workflow: create a repository, make a backup, look at what <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> got, and restore files when you need them.\n\n## The two core concepts\n\n- **Repository** \u2014 a store of encrypted, deduplicated chunks, plus the metadata that lets Borg reassemble them into files. A repository can live on local disk (an external drive, a mounted volume) or on a remote host reachable over SSH.\n- **Archive** \u2014 a single backup run, created with `borg create`. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 33 words, limit 25\">Each</mark> archive is a full snapshot of the paths you backed up at that point in time, even though under the hood it only stores new chunks \u2014 unchanged data is simply referenced again. You end up with what feels like many complete backups while paying disk space for only the deltas.\n\n## 1. Create a repository\n\nBefore you can back anything up, initialize a repository:\n\n```bash\nborg repo-create --encryption=repokey-blake2-aes-ocb -r /path/to/repo\n```\n\nPick <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;encryption mode up front&#x27; over 3 words\">an</mark> encryption mode up front <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> be changed later without creating a new repository. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 40 words, limit 25\">`</mark>repokey` modes store the encryption key inside the repository itself (convenient, and the<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;easiest&#x27;\"> </mark>easiest to recover from), while `keyfile` modes keep the key in your home directory instead (useful if you<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\"> </mark>don&#x27;t want the key sitting alongside the encrypted data). If you<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\"> </mark>don&#x27;t need encryption at all, `--encryption=none` skips it, but almost everyone<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\"> </mark>should encrypt unless the storage is already trusted and access-controlled.\n\nTo avoid repeating `-r /path/to/repo` on every command, export it once:\n\n```bash\nexport BORG_REPO=/path/to/repo\n```\n\n## 2. Make a backup\n\n```bash\nborg create --stats --progress &#x27;{hostname}-{now}&#x27; ~/Documents ~/Projects\n```\n\n`<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 30 words, limit 25\">{</mark>hostname}` and `{now}` are placeholders Borg expands automatically, so repeated runs of this exact command produce a new, uniquely named archive each time without any extra bookkeeping on your part. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 32 words, limit 25\">`</mark>--stats` prints how much data was added<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\"> </mark>versus deduplicated away, and `--progress` gives you a live indicator during long runs<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 both are optional but useful the first few times you run this.\n\nCompression is worth setting explicitly rather than relying on defaults:\n\n```bash\nborg create --compression zstd,6 &#x27;{hostname}-{now}&#x27; ~/Documents\n```\n\n`lz4` <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 40 words, limit 25\">is</mark> the <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V9: marketing adjective &#x27;fastest&#x27;\">fastest</mark> option and is fine for already-compressed data (media files, archives)<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> `zstd` at a moderate level (3<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2013</mark>10) is a good general-purpose choice; `auto,zstd,N` probes each chunk cheaply with lz4 first and only pays zstd&#x27;s cost when it looks worthwhile. Compression matters more than it sounds like for remote backups, since it directly cuts how much has to <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G8: phrasal verb &#x27;go over&#x27;; use &#x27;check&#x27;\">go</mark> over the network.\n\n## 3. See what you&#x27;ve backed up\n\n```bash\nborg repo-list                  # list all archives in the repository\nborg list aid:d34db33f          # list files inside one archive\n```\n\nArchives are referenced by an archive ID (or a unique prefix of one, as shown above) or by name. `borg repo-list` is your starting point any time you need to restore something and<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\"> </mark>don&#x27;t already know exactly which archive to target.\n\n## 4. Restore files\n\nThere are two ways to get data back out, and which one you want depends on how sure you already are about what you need.\n\n**`borg mount`** <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> mounts a repository or archive as a FUSE filesystem, so you can browse it like any other directory. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 29 words, limit 25\">Reach</mark> for this when <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not sure which archive has the version of a file you want, or you just want to poke around before committing to a restore:\n\n```bash\nmkdir /mnt/borg\nborg mount -a aid:d34db33f /mnt/borg\n# browse /mnt/borg in another terminal, copy out what you need\nborg umount /mnt/borg\n```\n\n**`borg extract`** <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> pulls files directly out of a known archive into your current directory. <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N2: description is 26 words, limit 25\">Faster</mark>, and more faithful about restoring metadata (ACLs, special filesystem flags) than a FUSE mount can be <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> use this once you know exactly what you want:\n\n```bash\nmkdir restore &amp;&amp; cd restore\nborg extract aid:d34db33f path/to/file   # restore just one path (no leading /)\nborg extract aid:d34db33f                # or restore the whole archive\n```\n\n`borg extract` always writes into the current directory, and expects that directory to be empty <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> merge a restore into an existing tree.\n\nA restore generally goes smoothest on the same machine and under the same user account that made the backup: it avoids surprises with path layout and with usernames/groups not mapping to the IDs your files were saved with. <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 38 words, limit 25\">If</mark> <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> restoring an encrypted repository and the key lives in `keyfile` mode rather than `repokey` mode, make sure you have both the keyfile and its passphrase before you start <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> without them the data is unrecoverable by design.\n\n## Keeping backups working long-term\n\nA few things matter for backups you intend to actually rely on:\n\n- <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-N2: description is 28 words, limit 25\">*</mark>*Free disk space.** Borg needs headroom to operate, including to delete old archives \u2014 running a repository&#x27;s filesystem to zero can leave you unable to free space at all. Keep a comfortable margin, and check it as part of whatever process reviews your backup logs.\n- **Consistent user/permissions.** Always access a given repository as the same user. Back up as root if you need root-owned or multi-user files<mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> otherwise use your normal account. For remote repositories, the SSH login already fixes the effective user, so this is less of a concern there.\n- **File consistency during the backup.** Borg just reads files as it encounters them \u2014 it <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> snapshot anything for you. <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: description is 38 words, limit 25\">For</mark> a quiet home directory this is rarely an issue<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> for databases, VMs, or containers that are actively writing, stop the service, use its own consistent-dump/snapshot mechanism, or snapshot the underlying filesystem (LVM, ZFS) before backing up.\n- **Prune and compact regularly.** `borg create` alone only adds archives<mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it never removes them. <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N1: instruction is 23 words, limit 20\">Run</mark> `borg prune` on a schedule to drop old archives per a retention policy, and `borg compact` afterward to actually reclaim the space `prune` freed:\n\n  ```bash\n  borg prune &#x27;{hostname}&#x27; --keep-daily 7 --keep-weekly 4 --keep-monthly 6\n  borg compact\n  ```\n\n## Automating it\n\nFor unattended backups, set the passphrase via environment variable rather than typing it interactively:\n\n```bash\nexport BORG_PASSPHRASE=&#x27;a long and e}-{now}&#x27; ~/Documents\n```\n\nRestoring from a remote repository works exactly the same way, just with the `rest://` URL in place of a local path:\n\n```bash\nborg -r rest://user@hostname:port/path/to/repo mount /mnt/borg\nborg -r rest://user@hostname:port/path/to/repo extract aid:d34db33f\n```\n\nIf Borg <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> be installed on the remote side, mounting the remote filesystem locally (<mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-N2: description is 26 words, limit 25\">via</mark> `sshfs`) and pointing Borg at the mount point also works, though it depends on how well the remote filesystem holds up under sustained backup traffic. Borg also supports talking directly to sftp servers and to S3-compatible or rclone-backed object storage as repository backends, without needing anything Borg-specific installed remotely.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 1003, "weighted": 5.0, "sentences": 78, "cleanSentences": {"clean": 65, "of": 78, "rate": 83.3}, "findings": [{"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Under the hood it only stores new chunks; unchanged data is referenced again.", "line": 22, "column": 173, "excerpt_offset": 40, "severity": "MUST", "arbitrated": false, "weight": 0.1, "offset": 1763, "token": ";"}, {"rule": "PSTE-V9", "message": "marketing adjective 'easiest'", "excerpt": "Convenient, and easiest to recover from.", "line": 34, "column": 72, "excerpt_offset": 16, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 2219, "token": "easiest"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must
