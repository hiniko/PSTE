ster/GUIDE.md\ngrounding_licence: MIT\nquestion: |\n  Write a documentation page for everyday command line usage and pattern matching in ripgrep. A copy of an upstream page for this topic is mounted at /grounding/synth-ripgrep-usage.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# ripgrep for everyday use\n\nripgrep (`rg`) is a line-oriented search tool: point it at a pattern and it walks through your files, printing every line that matches. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 39 words, limit 25\">What</mark> makes it pleasant for daily use is less the raw speed and more the defaults <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it already knows to skip your `.git` directory, your `node_modules`, your build output, and anything else your `.gitignore` already tells it to ignore. This page walks through the parts of ripgrep <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> actually reach for day to day: running a search, writing patterns, controlling what gets searched, and shaping the output.\n\n## Your first search\n\nThe <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> invocation is a pattern and a file:\n\n```\n$ rg TODO app.py\n42:# TODO: handle the empty-cart case\n118:# TODO: this retries forever, add a max\n```\n\nEach matching line is printed with its line number. If nothing matches, `rg` prints nothing and exits with a non-zero status <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> handy in scripts.\n\nDrop the filename and `rg` searches the current directory tree instead:\n\n```\n$ rg TODO\napp.py\n42:# TODO: handle the empty-cart case\n118:# TODO: this retries forever, add a max\n\ntests/test_cart.py\n9:# TODO: this test is flaky, investigate\n```\n\n`rg pattern` is really shorthand for `rg pattern .` <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> recursive search is the default mode, not a special flag you have to remember.\n\n## Patterns: literal by default, regex when you want it\n\nWhatever you type after `rg` is treated as <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;regular expression unless you tell it otherwise&#x27; over 3 words\">a</mark> regular expression unless you tell it otherwise. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 32 words, limit 25\">A</mark> plain word like `TODO` happens to also be a valid regex that matches itself, which is why the example above &quot;just worked.&quot; Things get more interesting once you use regex metacharacters:\n\n```\n$ rg &#x27;retr\\w+&#x27; app.py\n118:# TODO: this retries forever, add a max\n```\n\n`\\w` <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 38 words, limit 25\">matches</mark> a &quot;word&quot; character (letters, digits, underscore), and `+` means &quot;one or more of the previous thing.&quot; So `retr\\w+` matches `retr` followed by at least one more word character <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;it&#x27;ll&#x27;\">it&#x27;ll</mark> match `retries` and `retry` but not a bare `retr`. Swap `+` for `*` (zero or more) and a bare `retr` would match too, and `rg` would highlight only the `retr` prefix on lines where nothing follows it.\n\nA few things worth knowing up front:\n\n- Parentheses, brackets, dots, question marks, and other regex punctuation are special. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 29 words, limit 25\">If</mark> your pattern contains literal punctuation \u2014 say <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> searching for `array[0]` \u2014 either escape it (`array\\[0\\]`) or tell ripgrep not to interpret the pattern as regex at all with `-F`/`--fixed-strings`.\n- ripgrep&#x27;s regex engine is Unicode-aware by default: `\\w` matches Unicode word characters, and `.` matches any Unicode codepoint, not just any byte. That&#x27;s usually what you want for source code and prose alike.\n- Full regex syntax is out of scope here, but everything ripgrep supports is documented at https://docs.rs/regex/*/regex/#syntax.\n\nA handful of pattern-matching flags come up constantly:\n\n- `-i`/`--ignore-case` \u2014 case-insensitive matching.\n- `-S`/`--smart-case` \u2014 case-insensitive *unless* your pattern has an uppercase letter in it, in which case it becomes case-sensitive. This is the one people put in a shell alias and forget about, because it does the right thing almost all the time.\n- `-w`/`--word-regexp` \u2014 only match whole words, so `rg -w cat` <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> match inside `concatenate`.\n- `-v`/`--invert-match` \u2014 print lines that *<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>* match.\n- `-F`/`--fixed-strings` \u2014 treat the pattern as literal text, not regex.\n\n## Scoping a search to a directory or a few files\n\nPass a path (or several) after the pattern to limit where `rg` looks:\n\n```\n$ rg &#x27;def handle_&#x27; src/\n$ rg &#x27;def handle_&#x27; src/ tests/\n```\n\nThis is often simpler than piping through `grep -r` with a bunch of `find` gymnastics, since recursion and filtering are already built in.\n\n## What ripgrep leaves out, by default\n\nThis is the part that surprises people coming from `grep -r`: ripgrep <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> search everything under a directory. Four things are excluded automatically:\n\n1. Anything matched by a `.gitignore` file \u2014 including your global gitignore, per-repo excludes in `.git/info/exclude`, and `.gitignore` files in parent directories of the same repo. `.ignore` files (tool-agnostic) and `.rgignore` files (ripgrep-specific) work the same way and take increasingly higher precedence when rules conflict.\n2. Hidden files and directories (anything starting with `.`).\n3. Binary files \u2014 anything containing a NUL byte.\n4. Symlink targets \u2014 symlinks <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> followed.\n\nEach of these can be switched off individually:\n\n| Want to search... | Flag |\n|---|---|\n| Files listed in `.gitignore`/`.ignore` | `--no-ignore` |\n| Hidden files and dotfiles | `--hidden` (`-.`) |\n| Binary files as plain text | `--text` (`-a`) |\n| Through symlinks | `--follow` (`-L`) |\n\nIf you just want to cast a wider net without remembering which flag does what, stack `-u`: one `-u` turns off gitignore filtering, `-uu` also picks up hidden files, and `-uuu` (equivalently `--unrestricted` three times) turns off binary detection too. <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> a good first move when a search comes back suspiciously empty.\n\nIf a search behaves unexpectedly <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> no results when <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> sure there <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be some \u2014 `rg --debug` will tell you which ignore rule or filter is responsible.\n\n<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 27 words, limit 25\">Sometimes</mark> you want to *un-ignore* one specific thing without turning off ignore handling globally <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> say your `.gitignore` excludes `vendor/`, but you occasionally want to grep through it. Create a `.rgignore` (or `.ignore`) file next to the `.gitignore` with:\n\n```\n!vendor/\n```\n\nSince `.rgignore` and `.ignore` outrank `.gitignore`, the negation wins and `vendor/` becomes searchable again <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> without touching source control&#x27;s own ignore rules.\n\n## Filtering by glob\n\nBeyond the automatic ignore-file handling, you can filter manually with `-g`/`--glob`:\n\n```\n$ rg import -g &#x27;*.py&#x27;\n```\n\nrestricts the search to Python files. Quote the glob so your shell <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> expand the `*` itself. Prefix a glob with `!` to exclude instead of include:\n\n```\n$ rg import -g &#x27;!*_test.py&#x27;\n```\n\nYou can combine several `-g` flags, and like `.gitignore` rules, later globs take precedence over earlier ones when they conflict. One gotcha: <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N2: description is 42 words, limit 25\">as</mark> soon as you supply *any* non-negated glob, ripgrep requires a match against at least one glob <mark id=\" own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# ripgrep for everyday use\n\nripgrep (`rg`) searches files line by line. Give it a pattern, and it prints every line that matches. Its speed is nice, but its defaults are what make it pleasant to use every day. It already skips your `.git` directory, your `node_modules`, your build output, and anything else your `.gitignore` tells it to ignore.\n\nThis page covers the parts of ripgrep you will use most: running a search, writing patterns, choosing which files get searched, and shaping the output.\n\n## Your first search\n\nThe <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> command is a pattern and a file:\n\n```\n$ rg TODO app.py\n42:# TODO: handle the empty-cart case\n118:# TODO: this retries forever, add a max\n```\n\nEach matching line is printed with its line number. If nothing matches, `rg` prints nothing and exits with a non-zero status. That is useful in scripts.\n\nLeave out the filename, and `rg` searches <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;current directory tree instead&#x27; over 3 words\">the</mark> current directory tree instead:\n\n```\n$ rg TODO\napp.py\n42:# TODO: handle the empty-cart case\n118:# TODO: this retries forever, add a max\n\ntests/test_cart.py\n9:# TODO: this test is flaky, investigate\n```\n\n`rg pattern` is shorthand for `rg pattern .`. Recursive search is the default. There is no special flag to remember.\n\n## Patterns: regex by default\n\nAnything you type after `rg` is treated as <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;regular expression unless you say otherwise&#x27; over 3 words\">a</mark> regular expression unless you say otherwise. A plain word like `TODO` is also a valid regex that matches itself. That is why the example above worked. Regex metacharacters make things more interesting:\n\n```\n$ rg &#x27;retr\\w+&#x27; app.py\n118:# TODO: this retries forever, add a max\n```\n\n`\\w` matches a &quot;word&quot; character (letters, digits, underscore). `+` means &quot;one or more of the previous thing.&quot; So `retr\\w+` matches `retr` followed by at least one more word character. It matches `retries` and `retry`, but not a bare `retr`. Change `+` to `*` (zero or more) and a bare `retr` matches too. On lines where nothing follows, `rg` highlights only the `retr` prefix.\n\nSome things to know up front:\n\n- Parentheses, brackets, dots, question marks, and other regex punctuation are special. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">If</mark> your pattern contains literal punctuation, such as `array[0]`, either escape it (`array\\[0\\]`) or use `-F`/`--fixed-strings` to tell ripgrep not to treat the pattern as regex at all.\n- ripgrep&#x27;s regex engine is Unicode-aware by default. `\\w` matches Unicode word characters, and `.` matches any Unicode codepoint, not just any byte. That is usually what you want for both source code and prose.\n- Full regex syntax is out of scope here. Everything ripgrep supports is documented at https://docs.rs/regex/*/regex/#syntax.\n\nA few pattern flags come up all the time:\n\n- `-i`/`--ignore-case` \u2014 case-insensitive matching.\n- `-S`/`--smart-case` \u2014 case-insensitive, *unless* your pattern contains an uppercase letter. Then it becomes case-sensitive. People put this in a shell alias and forget about it, because it does the right thing almost every time.\n- `-w`/`--word-regexp` \u2014 match whole words only. `rg -w cat` will not match inside `concatenate`.\n- `-v`/`--invert-match` \u2014 print lines that do *not* match.\n- `-F`/`--fixed-strings` \u2014 treat the pattern as literal text, not regex.\n\n## Searching a directory or a few files\n\nPut a path (or several) after the pattern to limit where `rg` looks:\n\n```\n$ rg &#x27;def handle_&#x27; src/\n$ rg &#x27;def handle_&#x27; src/ tests/\n```\n\nThis is often simpler than `grep -r` with a lot of `find` tricks, because recursion and filtering are already built in.\n\n## What ripgrep skips by default\n\nThis surprises people coming from `grep -r`: ripgrep does not search everything under a directory. Four things are skipped automatically:\n\n1. Anything matched by a `.gitignore` file. This includes your global gitignore, per-repo excludes in `.git/info/exclude`, and `.gitignore` files in parent directories of the same repo. `.ignore` files (tool-agnostic) and `.rgignore` files (ripgrep-specific) work the same way. When rules conflict, `.ignore` beats `.gitignore`, and `.rgignore` beats both.\n2. Hidden files and directories (anything starting with `.`).\n3. Binary files (anything containing a NUL byte).\n4. Symlink targets. Symlinks are not followed.\n\nYou can <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;turn off&#x27;; use &#x27;disable&#x27;\">turn</mark> off each one on its own:\n\n| Want to search... | Flag |\n|---|---|\n| Files listed in `.gitignore`/`.ignore` | `--no-ignore` |\n| Hidden files and dotfiles | `--hidden` (`-.`) |\n| Binary files as plain text | `--text` (`-a`) |\n| Through symlinks | `--follow` (`-L`) |\n\nIf you want a wider search and do not want to remember which flag does what, stack `-u`. One `-u` turns off gitignore filtering. `-uu` also includes hidden files. `-uuu` (the same as `--unrestricted` three times) also turns off binary detection. This is a good first move when a search comes back suspiciously empty.\n\nIf a search gives no results when you are sure there <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be some, run `rg --debug`. It tells you which ignore rule or filter is responsible.\n\nSometimes you want to *un-ignore* one thing without turning off ignore handling everywhere. Say your `.gitignore` excludes `vendor/`, but now and then you want to grep through it. Create a `.rgignore` (or `.ignore`) file next to the `.gitignore` containing:\n\n```\n!vendor/\n```\n\n`.rgignore` and `.ignore` outrank `.gitignore`, so the negation wins and `vendor/` becomes searchable again. Source control&#x27;s own ignore rules stay untouched.\n\n## Filtering by glob\n\nOn top of the automatic ignore-file handling, you can filter by hand with `-g`/`--glob`:\n\n```\n$ rg import -g &#x27;*.py&#x27;\n```\n\nThis limits the search to Python files. Quote the glob so your shell does not expand the `*` itself. Put `!` in front of a glob to exclude instead of include:\n\n```\n$ rg import -g &#x27;!*_test.py&#x27;\n```\n\nYou can combine several `-g` flags. As with `.gitignore` rules, later globs win over earlier ones when they conflict. One gotcha: once you supply *any* non-negated glob, ripgrep requires a file to match at least one glob. So `-g &#x27;!*.md&#x27; -g &#x27;*.md&#x27;` searches only Markdown files (the positive glob at the end wins). But `-g &#x27;*.md&#x27; -g &#x27;!*.md&#x27;` matches nothing at all (the exclusion, being last, wins outright).\n\n## Filtering by file type\n\nIf you keep typing the same glob, use `--type` (`-t`) instead:\n\n```\n$ rg TODO --type py\n$ rg TODO -tpy\n```\n\n`-t` includes a type. `-T`/`--type-not` excludes one. Run `rg --type-list` to see the built-in types and which extensions each one covers. There are presets for most common languages and formats.\n\nYou can also define your own types with `--type-add`:\n\n```\n$ rg --type-add &#x27;web:*.{html,css,js}&#x27; -tweb title\n```\n\nThis only applies to the current command. It is not saved anywhere. To keep a custom type, put it in a shell alias:\n\n```\nalias rg=&quot;rg --type-add &#x27;web:*.{html,css,js}&#x27;&quot;\n```\n\nor in ripgrep&#x27;s config file (see below).\n\nOne more special case: `--type all` matches any file recognized by *any* n\ntests/test_cart.py\n9:# TODO: this test is flaky, investigate\n```\n\n`rg pattern` is shorthand for `rg pattern .`. Recursive search is the default mode, not a special flag that you have to remember.\n\n## Patterns: literal by default, regex when you want it\n\nUnless you tell it otherwise, ripgrep treats everything that you type after `rg` as a regex. A plain word like `TODO` is also a correct regex that matches itself. That is why the example above worked. You can do more when you use regex metacharacters:\n\n```\n$ rg &#x27;retr\\w+&#x27; app.py\n118:# TODO: this retries forever, add a max\n```\n\n`\\w` matches a &quot;word&quot; character: a letter, a digit, or an underscore. `+` means &quot;one or more of the previous item&quot;. So `retr\\w+` matches `retr` followed by at least one more word character. It matches `retries` and `retry`, but it does not match a bare `retr`.\n\nIf you swap `+` for `*` (zero or more), a bare `retr` also matches. On lines where nothing follows `retr`, `rg` then highlights only the `retr` prefix.\n\nSome things to know before you start:\n\n- Parentheses, brackets, dots, question marks, and other regex punctuation are special. If your pattern contains literal punctuation, for example `array[0]`, you have two choices. Escape it (`array\\[0\\]`), or use `-F`/`--fixed-strings` to tell ripgrep to not interpret the pattern as regex.\n- The regex engine of ripgrep is Unicode-aware by default. `\\w` matches Unicode word characters, and `.` matches any Unicode codepoint, not only any byte. This is usually what you want for source code and for prose.\n- Full regex syntax is out of scope here. The documentation at https://docs.rs/regex/*/regex/#syntax covers everything that ripgrep supports.\n\nSome flags for pattern matching come up constantly:\n\n- `-i`/`--ignore-case` \u2014 case-insensitive matching.\n- `-S`/`--smart-case` \u2014 case-insensitive matching, unless your pattern contains an uppercase letter. Then the match becomes case-sensitive. People put this flag in a shell alias and forget about it, because it does the correct thing almost all the time.\n- `-w`/`--word-regexp` \u2014 match whole words only. `rg -w cat` does not match inside `concatenate`.\n- `-v`/`--invert-match` \u2014 print the lines that do *not* match.\n- `-F`/`--fixed-strings` \u2014 treat the pattern as literal text, not as regex.\n\n## Scope a search to a directory or a few files\n\nPass one or more paths after the pattern to limit where `rg` looks:\n\n```\n$ rg &#x27;def handle_&#x27; src/\n$ rg &#x27;def handle_&#x27; src/ tests/\n```\n\nThis is often simpler than a pipe through `grep -r` with many `find` tricks, because recursion and filtering are already built in.\n\n## What ripgrep leaves out by default\n\nThis part surprises people who come from `grep -r`: ripgrep does not search everything under a directory. It excludes four things automatically:\n\n1. Anything that a `.gitignore` file matches. This includes your global gitignore, the per-repo excludes in `.git/info/exclude`, and the `.gitignore` files in parent directories of the same repo. `.ignore` files (tool-agnostic) and `.rgignore` files (ripgrep only) work the same way. When rules conflict, `.ignore` takes precedence over `.gitignore`, and `.rgignore` takes precedence over `.ignore`.\n2. Hidden files and directories (anything that starts with `.`).\n3. Binary files (anything that contains a NUL byte).\n4. Symlink targets. ripgrep does not follow symlinks.\n\nYou can disable each of these separately:\n\n| Want to search... | Flag |\n|---|---|\n| Files listed in `.gitignore`/`.ignore` | `--no-ignore` |\n| Hidden files and dotfiles | `--hidden` (`-.`) |\n| Binary files as plain text | `--text` (`-a`) |\n| Through symlinks | `--follow` (`-L`) |\n\nIf you want a wider net and do not want to remember which flag does what, stack `-u`. One `-u` turns off gitignore filtering. `-uu` also picks up hidden files. `-uuu` (the same as `--unrestricted` three times) also turns off binary detection. This is a good first move when a search comes back suspiciously empty.\n\nIf a search behaves unexpectedly, for example no results when you are sure there are some, run `rg --debug`. It tells you which ignore rule or filter is responsible.\n\nSometimes you want to un-ignore one thing without turning off ignore handling globally. For example, your `.gitignore` excludes `vendor/`, but you sometimes want to search it. Create a `.rgignore` (or `.ignore`) file next to the `.gitignore` with:\n\n```\n!vendor/\n```\n\n`.rgignore` and `.ignore` outrank `.gitignore`, so the negation wins and `vendor/` becomes searchable again. The ignore rules of source control stay unchanged.\n\n## Filter by glob\n\nBeyond the automatic handling of ignore files, you can filter by hand with `-g`/`--glob`:\n\n```\n$ rg import -g &#x27;*.py&#x27;\n```\n\nThis restricts the search to Python files. Quote the glob so that your shell does not expand the `*` itself. Prefix a glob with `!` to exclude instead of include:\n\n```\n$ rg import -g &#x27;!*_test.py&#x27;\n```\n\nYou can use more than one `-g` flag. As with `.gitignore` rules, when globs conflict, a later glob takes precedence over an earlier one. One trap: as soon as you supply *any* non-negated glob, ripgrep requires a match against at least one glob. So `-g &#x27;!*.md&#x27; -g &#x27;*.md&#x27;` searches only Markdown files, because the positive glob at the end wins. `-g &#x27;*.md&#x27; -g &#x27;!*.md&#x27;` matches nothing at all, because the exclusion is last and wins outright.\n\n## Filter by file type\n\nIf you type the same glob again and again, use `--type` (`-t`) instead:\n\n```\n$ rg TODO --type py\n$ rg TODO -tpy\n```\n\n`-t` includes a type. `-T`/`--type-not` excludes a type. Run `rg --type-list` to see the built-in types and the extensions that each name covers. Presets exist for most common languages and formats.\n\nYou are not limited to the built-in types. Define your own with `--type-add`:\n\n```\n$ rg --type-add &#x27;web:*.{html,css,js}&#x27; -tweb title\n```\n\nThis applies only to the current command. ripgrep does not save it anywhere. To keep a custom type, put it in a shell alias:\n\n```\nalias rg=&quot;rg --type-add &#x27;web:*.{html,css,js}&#x27;&quot;\n```\n\nor in the config file of ripgrep (see below).\n\nOne more useful special case: `--type all` matches any file that *any* known type recognizes, built-in or custom. `--type all` skips a file with no extension that matches no type&#x27;s glob, for example an extensionless shell script. `--type-not all` *does* include that file.\n\n## Shape the output\n\nSome flags change what ripgrep prints, not what it searches:\n\n- `-c`/`--count` \u2014 print the count of matching lines per file instead of the lines themselves.\n- `-l`/`--files-with-matches` \u2014 print only the filenames that contain a match, not the matching lines.\n- `-o`/`--only-matching` \u2014 print only the matched text, not the whole line.\n- `-C`/`--context N` \u2014 show `N` lines of context around each match. `-A` shows lines after only, and `-B` shows lines before only.\n- `-m`/`--max-count N` \u2014 stop after `N` matches per file.\n- `--files` \u2014 do not search at all. List the files that ripgrep *would* search. This is a good way to check your glob and type filters before you run the real search.\n\n## Replace matched text (in output only)\n\n`-r`/`--replace` swaps the matched part of the text for something else in the output of ripgrep:\n\n```\n$ rg fetchUser -r loadUser src/\n```\n\nThis changes only what ripgrep prints to your terminal. ripgrep never edits files on disk, and no flag makes it do so. By default ripgrep swaps only the matched substring. If you want to replace the whole line, write a pattern that matches the whole line (`^.*fetchUser.*$`), or use `-o` with `-r` for the same effect.\n\nA replacement can refer to a capture group from the pattern:\n\n```\n$ rg &#x27;const (\\w+) = require&#x27; -r &#x27;import $1 from&#x27; src/\n```\n\n`$1` refers to the first parenthesized group. Group `0` is always the whole match. Named groups also work, and they are easier to read in longer patterns:\n\n```\n$ rg &#x27;const (?P&lt;name&gt;\\w+) = require&#x27; -r &#x27;import $name from&#x27; src/\n```\n\n## Save your preferences\n\nIf you keep typing the same flags, put them in a config file instead of an alias. Point ripgrep at the file with the `RIPGREP_CONFIG_PATH` environment variable. Then list one flag per line:\n\n```\n# ~/.ripgreprc\n--smart-case\n--hidden\n--glob=!.git/*\n```\n\nA line that starts with `#` is a comment. Empty lines are fine. There is no shell quoting or escaping inside this file. Each line becomes one literal argument. So a flag with a value needs either `=` (`--max-columns=150`) or its own line for the value, never a space on the same line.\n\nripgrep treats the flags from the config file as if they came before your command-line flags. So anything that you type on the command line overrides the config. Use `--no-config` if you need to skip the config file entirely. Use `--debug` if you are not sure which config file (if any) ripgrep reads.\n\n## Quick reference\n\n| Flag | Meaning |\n|---|---|\n| `-i`, `--ignore-case` | case-insensitive search |\n| `-S`, `--smart-case` | case-insensitive unless the pattern has uppercase |\n| `-F`, `--fixed-strings` | treat the pattern as literal text |\n| `-w`, `--word-regexp` | match whole words only |\n| `-v`, `--invert-match` | print the lines that do not match |\n| `-g`, `--glob` | include or exclude files by glob (`!` to exclude) |\n| `-t`, `-T` | include or exclude files by type |\n| `--type-list` | list the known file types and their globs |\n| `-c`, `--count` | count matches per file |\n| `-l`, `--files-with-matches` | list the files with at least one match |\n| `-o`, `--only-matching` | print only the matched text |\n| `-r`, `--replace` | substitute the matched text in the output |\n| `-C`, `-A`, `-B` | show the c > node fires off a signal when something noteworthy happens to it <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a button gets clicked, a body enters an area, a timer runs out \u2014 and any number of other nodes can listen for that signal and react. The emitter <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know or care who, if anyone, <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is listening&#x27;\">is</mark> listening.\n\nIf <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> used event systems or the observer pattern in other frameworks, this will feel familiar. The main payoff is **decoupling**: your health bar UI <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need a reference to the player, and the player <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know a health bar exists. The player just announces &quot;my health changed,&quot; and whatever cares about that can hook in.\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 29 words, limit 25\">Since</mark> Godot 4.0, signals are <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type), so you can pass them around, store them in variables, and connect to them directly instead of juggling string names.\n\n## The basic idea\n\n1. An object **emits** a signal \u2014 think of it as broadcasting an event.\n2. Any number of other objects can **connect** a callback (a method) to that signal beforehand.\n3. When the signal fires, Godot calls every connected callback, passing along whatever arguments the signal carries.\n\nA connection is a one-directional link: `A.some_signal \u2192 B.some_method`. Node A never references node B directly to make this happen<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 the connection lives on the signal itself.\n\n## Connecting through the editor\n\nFor nodes already in your scene tree, the quickest way to wire things up is the **Node dock \u2192 Signals tab**. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N1: instruction is 26 words, limit 20\">Select</mark> a node, and <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> see every signal it can emit (built-in ones like `pressed` on a `Button`, plus any custom signals defined in its script).\n\nDouble-click a signal and Godot opens a connection dialog. Point it at the target node, and:\n\n- If the target has a script attached, Godot can auto-generate a stub callback method for you.\n- By convention, generated callbacks are named `_on_&lt;node_name&gt;_&lt;signal_name&gt;` (GDScript) or `On&lt;NodeName&gt;&lt;SignalName&gt;` (C#) \u2014 <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `_on_button_pressed`.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 36 words, limit 25\">There&#x27;s</mark> also an &quot;Advanced&quot; mode in that dialog that lets you connect to *any* method on *any* node (not just ones with attached scripts), pass extra bound arguments, and set connection flags like one-shot or deferred.\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 34 words, limit 25\">The</mark> editor-made connection is stored in the scene file, and a little icon appears in the script&#x27;s gutter next to the callback so you can click it later to inspect or remove the connection.\n\nOne caveat: <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 29 words, limit 25\">if</mark> you write your scripts in an external editor, Godot&#x27;s auto-stub-generation on connect <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> kick in <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> just need to write the method yourself, or connect via code instead.\n\n## Connecting from code\n\nEditor connections only work for nodes that already exist in a saved scene. Anything you spawn or instantiate at runtime <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dynamically created enemies, procedurally added UI, <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>. \u2014 has to be connected in code.\n\nThe pattern is: get a reference to the signal-emitting object, then call `.connect()` on the signal, passing the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\n<mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 28 words, limit 25\">In</mark> GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> no strings involved, so your IDE can autocomplete both the signal name and the callback. In C#, signals map onto C# events, so you hook them up with `+=` (and detach with `-=`).\n\n`_ready()` is the natural place to <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up these connections, since it runs once the node and its children are fully in the tree.\n\n### Disconnecting and one-shot connections\n\nYou can <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G8: phrasal verb &#x27;tear down&#x27;; use &#x27;stop&#x27;\">tear</mark> down a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\n...though this is fairly rare <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> most connections just live for the lifetime of both nodes. If you only want a callback to fire once, pass the `CONNECT_ONE_SHOT` flag instead of manually disconnecting after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nGDScript lets you suspend a function until a signal fires, using `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nThis is handy for sequencing \u2014 <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. waiting for an animation or a delay without setting up a separate callback method.\n\n## Defining your own signals\n\nSignals <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> just for built-in nodes <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you declare custom ones in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nA couple of naming notes: <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 31 words, limit 25\">custom</mark> signals show up in the Signals dock exactly like built-in ones, and by convention <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> named as past-tense events (`health_depleted`, not `deplete_health`) since a signal represents something that *already happened*.\n\nTo fire one, call `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Passing data with a signal\n\nSignals can carry arguments, declared in the signal definition itself:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese declared parameter names are mostly for documentation and editor tooling <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> they let the Signals dock generate a matching callback signature for you. Godot <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> actually enforce them at emit time, so <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> on you to pass the right values and the right count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback just needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you&#x27;ll run into signals\n\n<mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N3: contraction &#x27;They&#x27;re&#x27;\">They&#x27;re</mark> everywhere in Godot&#x27;s built-in nodes, not just UI:\n\n- `Area2D.body_entered` \u2014 something physical entered a detection zone (great for pickups, triggers, hazards).\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, and similar UI signals for value changes, focus, resizing, <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events as nodes enter or leave the scene tree.\n\n<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 35 words, limit 25\">Whenever</mark> you catch yourself wanting object A to directly call a method on object B just because something happened in A, <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually worth asking whether a signal would keep them more loosely coupled instead.\n\n---\n\n<mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-N2: description is 31 words, limit 25\">Let</mark> me know if you&#x27;d like this saved to a specific file once a write-capable path is available, or if you want a version aimed at a different audience (<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. more editor-workflow-focused for beginners, or  title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is listening&#x27;\">is</mark> listening at all.\n\nIf you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G4: perfect tense &#x27;have used&#x27;; use simple past\">have</mark> used event systems or the observer pattern in other frameworks, this will feel familiar. The main benefit is **decoupling**. Your health bar UI does not need a reference to the player. The player does not need to know a health bar exists. The player only announces &quot;my health changed&quot;. Anything that cares can hook in.\n\nSince Godot 4.0, signals are <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type). You can pass them around, store them in variables, and connect to them directly. You do not need to use string names.\n\n## The basic idea\n\n1. An object **emits** a signal. Think of this as broadcasting an event.\n2. Before that, any number of other objects can **connect** a callback (a method) to the signal.\n3. When the signal fires, Godot calls every connected callback. It passes along any arguments the signal carries.\n\nA connection is a one-way link: `A.some_signal \u2192 B.some_method`. Node A never references node B directly. The connection lives on the signal itself.\n\n## Connecting through the editor\n\nFor nodes already in your scene tree, the <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V9: marketing adjective &#x27;fastest&#x27;\">fastest</mark> way to connect them is the **Node dock \u2192 Signals tab**. Select a node. You will see every signal it can emit. This includes built-in signals like `pressed` on a `Button`, plus any custom signals defined in its script.\n\nDouble-click a signal. Godot opens a connection dialog. Pick the target node. Then:\n\n- If the target has a script attached, Godot can generate a stub callback method for you.\n- By convention, generated callbacks are named `_on_&lt;node_name&gt;_&lt;signal_name&gt;` (GDScript) or `On&lt;NodeName&gt;&lt;SignalName&gt;` (C#). Example: `_on_button_pressed`.\n\nThe dialog also has an &quot;Advanced&quot; mode. It lets you connect to *any* method on *any* node (not only nodes with scripts). It also lets you pass extra bound arguments and set connection flags such as one-shot or deferred.\n\nConnections made in the editor are saved in the scene file. A small icon appears in the script&#x27;s gutter next to the callback. Click it later to inspect or remove the connection.\n\nOne caveat: if you write your scripts in an external editor, Godot will not generate the stub method when you connect. You will need to write the method yourself, or connect in code instead.\n\n## Connecting from code\n\nEditor connections only work for nodes that already exist in a saved scene. Anything you create at runtime has to be connected in code. Examples: enemies spawned during play, UI added procedurally.\n\nThe pattern is simple. Get a reference to the object that emits the signal. Then call `.connect()` on the signal and pass the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\nIn GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method. No strings are involved, so your IDE can autocomplete both the signal name and the callback. In C#, signals map to C# events. You attach with `+=` and detach with `-=`.\n\n`_ready()` is the natural place to <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up connections. It runs once the node and its children are fully in the tree.\n\n### Disconnecting and one-shot connections\n\nYou can remove a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is fairly rare. Most connections last as long as both nodes exist. If you only want a callback to run once, pass the `CONNECT_ONE_SHOT` flag. Then you do not need to disconnect by hand after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nIn GDScript, `await` pauses a function until a signal fires:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nThis is useful for sequencing. For example, you can wait for an animation or a delay without writing a separate callback method.\n\n## Defining your own signals\n\nSignals are not only for built-in nodes. You can declare your own in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nTwo notes on naming. Custom signals appear in the Signals dock just like built-in ones. By convention, they are named as past-tense events (`health_depleted`, not `deplete_health`). A signal describes something that *already happened*.\n\nTo fire a signal, call `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Passing data with a signal\n\nSignals can carry arguments. You declare them in the signal definition:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese parameter names are mostly for documentation and editor tooling. They let the Signals dock generate a matching callback signature for you. Godot does not enforce them when you emit. It is up to you to pass the right values and the right number of them:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback only needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you&#x27;ll run into signals\n\nSignals are everywhere in Godot&#x27;s built-in nodes, not only in UI:\n\n- `Area2D.body_entered` \u2014 a physical body entered a detection zone. Good for pickups, triggers, and hazards.\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, plus similar UI signals for value changes, focus, resizing, and more.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events when nodes enter or leave the scene tree.\n\nIf you find yourself wanting object A to call a method on object B directly, just because something happened in A, stop and ask: would a signal keep them more loosely coupled?\n\n---\n\nLet me know if you want this saved to a specific file once a write-capable path is available. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 27 words, limit 25\">I</mark> can also write a version for a different audience, for example one focused on the editor workflow for beginners, or a code-only version for experienced developers.", "factLoss": true, "fidelity": {"source_words": 1101, "rewrite_words": 1089, "findings": [{"kind": "unit", "severity": "critical", "message": "'1' became '1 second'. The unit changed."}, {"kind": "unit", "severity": "critical", " le)` treats the signal as an object with a `connect()` method. This uses no strings, so your IDE can autocomplete both the signal name and the callback. In C#, signals map onto C# events. You connect them with `+=` and detach them with `-=`.\n\n`_ready()` is the natural place to create these connections. It runs once the node and its children are fully in the tree.\n\n### Disconnect and one-shot connections\n\nYou can remove a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is rare. Most connections live for the lifetime of both nodes. If you want a callback to run only once, pass the `CONNECT_ONE_SHOT` flag. This replaces a manual disconnect after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Await a signal\n\nGDScript can suspend a function until a signal fires. Use `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nThis is useful for sequences. For example, you can wait for an animation or a delay without a separate callback method.\n\n## Define your own signals\n\nSignals are not only for built-in nodes. You declare custom signals in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nTwo notes. Custom signals appear in the Signals dock exactly like built-in signals. By convention, a signal name is a past-tense event: `health_depleted`, not `deplete_health`. A signal represents something that *already happened*.\n\nTo raise a signal, call `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Pass data with a signal\n\nSignals can carry arguments. You declare them in the signal definition:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThe declared parameter names are mostly for documentation and editor tools. They let the Signals dock create a callback signature that matches. Godot does not check them when you call `emit()`. Pass the correct values and the correct count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback needs parameters that match:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you find signals\n\nSignals are everywhere in the built-in nodes of Godot, not only in UI:\n\n- `Area2D.body_entered` \u2014 a physical body entered a detection zone. Useful for pickups, triggers, and hazards.\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, and similar UI signals for value changes, focus, resize, and others.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events when a node enters or leaves the scene tree.\n\nSometimes you want object A to call a method on object B directly because something happened in A. When that happens, ask whether a signal would keep the two objects more loosely coupled.\n\n---\n\nI can save this to the file that you choose after a write-capable path is available. I can also write a version for a different audience. For example, a version for beginners that focuses on the editor workflow, or a code-only version for experienced developers.", "factLoss": true, "fidelity": {"source_words": 1101, "rewrite_words": 1104, "findings": [{"kind": "number", "severity": "critical", "message": "'1' is missing. The rewrite has '4.0'."}, {"kind": "unit", "severity": "critical", "message": "'1 second' became '1'. The unit changed."}], "critical": 2, "warnings": 0, "faithful": false}, "semantic": [], "semanticConfirmed": 0}}, "passes": {"control": {"findings": [7, 10, 11], "passed": 0, "of": 3, "rate": 0, "mean": 9.3}, "pste": {"findings": [4, 4, 6], "passed": 0, "of": 3, "rate": 0, "mean": 4.7}}}}};

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

const STATUS_LABEL = {
  confirmed: "confirmed", "low-agreement": "low agreement", rejected: "rejected",
  // OVERLAP: two or more independent judges both confirmed this rule — a
  // stronger claim than one judge confirming it on repeat passes.
  overlap: "overlap",
};

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also
// need reasons").
function semanticSectionHtml(a) {
  if (a.unjudged) {
    return `<div class="offenders semantic unjudged"><h3>Judge findings (semantic_lint.py)</h3>
        <p class="hint unjudged-note">UNJUDGED. The judge call for this cell failed and
        returned no result — an API limit is the usual cause. This is not "no
        findings": 52 of the standard's 77 rules need a judge, and none of them
        were checked here. Re-run the judge for this cell before treating it as
        clean.</p>
      </div>`;
  }
  const rows = a.semantic || [];
  if (!rows.length) return "";
  // MULTI-JUDGE: a row from report.py's judge_overlap carries `judge` (which
  // model produced it) and, for a confirmed/overlap row, `judges` (every
  // judge that confirmed this rule). Single-judge rows carry neither, and
  // render exactly as they always have.
  const multiJudge = rows.some(s => s.judge);
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    const judgeTag = multiJudge
      ? `<span class="judge-tag">${esc(
          s.status === "overlap" ? (s.judges || []).join(" + ") : (s.judge || "")
        )}</span>` : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span> ${judgeTag}</span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed" || s.status === "overlap").length;
  const overlapN = rows.filter(s => s.status === "overlap").length;
  const multiHint = multiJudge
    ? ` ${overlapN} of those are OVERLAP: every judge that ran on this text
      confirmed it independently — the trustworthy set. The rest of the
      confirmed rows came from only one judge.`
    : "";
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>
      <p class="hint">A model read this text for what a regular expression cannot
      check. ${confirmedN} of ${rows.length} row(s) are CONFIRMED (agreement at or
      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.${multiHint}</p>
      <ol>${items}</ol>
    </div>`;
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    // UNJUDGED is its own verdict, not a FAIL among others: the judging call
    // for this cell failed outright (an API limit, most often), so 52 of the
    // standard's 77 rules were never checked. It must never look like PASS
    // (a document the judge read and found clean) or an ordinary FAIL (one
    // the judge did check and objected to).
    const verdict = a.unjudged
      ? '<span class="verdict unjudged" title="the judge call for this cell '
        + 'failed and never returned a result. Mechanical and fact-loss checks '
        + 'still ran, but 52 of the standard’s 77 rules need a judge and '
        + 'were never checked. This is not a pass.">UNJUDGED</span>'
      : a.pass
        ? '<span class="verdict pass">PASS</span>'
        : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)} <span class="wt" title="weight `
             + `${f.weight} of 1.0 (spec/PSTE-1.md §15) — how much this `
             + `one rule's break counts, not how bad the prose is">`
             + `${f.weight}</span></span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words &nbsp; ${a.cleanSentences.of}
          sentence${a.cleanSentences.of === 1 ? "" : "s"}, ${a.cleanSentences.rate}%
          clean${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders
          ${a.findings.length ? `<span class="wt-total" title="sum of every `
            + `finding's weight below — spec/PSTE-1.md §15. Not a quality `
            + `score: it is still a count of rule-breaking, only weighted by `
            + `how much the standard says each broken rule costs.">`
            + `${a.findings.length} findings, weighted ${a.weighted}</span>` : ""}
          </h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);
  bits.push("<b>passes</b>" + r.passes);
  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);
  bits.push("<b>level</b>" + DATA.level);
  if (r.sourceModels && r.sourceModels.length)
    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
  if (r.failures) bits.push('<b>failures</b><span class="cell-fail">'
      + r.failures + "</span>");
  // PER-STAGE METERING (run.py PART 1): which half of the run burned the
  // budget. Absent on a result written before this existed.
  if (r.stages && r.stages.generation) bits.push("<b>generation</b>"
      + r.stages.generation.calls + " calls, " + r.stages.generation.seconds + "s");
  if (r.stages && r.stages.judging) bits.push("<b>judging</b>"
      + r.stages.judging.calls + " calls, " + r.stages.judging.seconds + "s");
  // JUDGE SAMPLING (run.py PART 2): which documents were judged this run.
  // Absent on a result written before sampling existed, or `judge_all`.
  const js = DATA.judgeSample || {};
  if (js.judge_all) {
    bits.push("<b>judged</b>all documents (--judge-all)");
  } else if (js.anchor_docs && js.anchor_docs.length) {
    bits.push("<b>anchors</b>" + esc(js.anchor_docs.join(", ")));
    bits.push("<b>rotating</b>" + esc((js.rotating_docs || []).join(", "))
      + " (offset " + js.rotation_offset + ")");
  }

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    // ANCHOR/ROTATING (run.py PART 2): which documents the judge looked at
    // this run, and why. An anchor is judged every run, for loop-over-loop
    // comparability; a rotating document is this run's coverage slice. A row
    // with neither badge was sampled out — its cells below say so.
    const sampleBadge = row.anchor
      ? ' <span class="verdict anchor" title="judged every run, for '
        + 'loop-over-loop comparability">ANCHOR</span>'
      : row.rotating
      ? ' <span class="verdict rotating" title="this run’s rotating '
        + 'coverage slice">ROTATING</span>'
      : "";
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + sampleBadge + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      // Every pass, and the share of them that conform. One draw cannot separate a
      // real change from ordinary variance, so the runs are shown beside the count.
      // The weighted total (spec/PSTE-1.md §15) sits right beside the raw rule
      // count: "many trivial findings" and "few serious ones" read the same in
      // a bare count, and do not in this one.
      let sub = c.rules + " rule" + (c.rules === 1 ? "" : "s")
        + (c.findings ? ' <span class="wt" title="weighted total, spec/PSTE-1.md '
          + '§15 — not a quality score, a conformance count weighted by '
          + 'consequence">wt ' + c.weighted + '</span>' : "");
      if (c.cleanSentences.of) {
        sub += ' <span class="rate" title="clean sentences: the share with no '
          + 'finding at all. PSTE counts by the sentence (N1/N2, D2), and a '
          + 'reader meets the text one sentence at a time.">'
          + c.cleanSentences.clean + "/" + c.cleanSentences.of + " sent "
          + c.cleanSentences.rate + "%</span>";
      }
      if (c.of > 1) {
        sub += ' <span class="rate">' + c.passed + "/" + c.of + " pass "
             + c.rate + "%</span>"
             + '<div class="runs">' + c.runs.join(" \u00b7 ") + "</div>";
      }
      // Fact loss reads apart from the conformance count: a clean-but-lossy
      // cell (0 findings, factLoss true) must not look like a plain PASS, and
      // a lossy-and-non-conforming cell must show both, not just one number.
      const factTag = c.factLoss
        ? ' <span class="verdict factloss" title="faithfulness.py: a fact from '
          + 'the source is missing. Detects dropped tokens, not changed '
          + 'meaning.">FACT LOSS</span>'
        : "";
      // A CONFIRMED judge finding (semantic_lint.py) fails the verdict the same
      // way fact loss does. Low-agreement and rejected rows never do — they are
      // audit material, visible only on the document view.
      const semTag = c.semanticConfirmed
        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      // SAMPLED_OUT vs UNJUDGED: not selected by design reads differently
      // from a judge call that was made and failed. Both still force
      // pass=False (build_entry) — neither has actually been checked — but
      // conflating "we chose not to ask" with "we asked and got nothing" is
      // exactly the confusion this cell must not create.
      const semSub = c.sampledOut
        ? '<div class="cell-sub sampled-out-note">not judged this run — sampled out</div>'
        : c.unjudged
        ? '<div class="cell-sub unjudged-note">judge call failed — not checked</div>'
        : c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";
      // UNJUDGED gets its own cell class and label: it must never look like a
      // FAIL (the judge ran and objected) or a PASS (the judge ran and found
      // nothing). `c.pass` is already False for these (build_entry forces it),
      // this only controls how the cell reads visually. SAMPLED_OUT reuses
      // the same class (it is still not a pass and not a fail) but its own
      // label and tooltip, so "excluded by design" reads apart from
      // "the judge tried and failed" at a glance.
      const cellClass = c.unjudged ? "cell-unjudged" : (c.pass ? "cell-pass" : "cell-fail");
      const cellLabel = c.sampledOut ? "NOT JUDGED"
        : c.unjudged ? "UNJUDGED" : (c.pass ? "PASS" : c.findings);
      const cellTitle = c.sampledOut
        ? "not selected for judging this run (rotate-and-anchor sampling). "
          + "Not a failure — a deliberate coverage decision. Not a pass either: "
          + "this text was never checked against the semantic rules."
        : c.unjudged
        ? "the judge call for this cell failed and returned no result. Not a "
          + "pass — it was never checked."
        : "";
      body += '<td class="' + cellClass + win + '" title="' + cellTitle + '">'
            + cellLabel + factTag + semTag
            + '<div class="cell-sub">' + sub + "</div>" + semSub
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  // Real documents and synthetic ones are totalled separately, and both stay
  // visible. Real is the headline: it is what generalises to writing this
  // project did not itself produce. Synthetic is secondary, not hidden.
  function totalRow(label, totals) {
    let row = '<tr><td class="doc">' + esc(label) + "</td>";
    for (const a of arms) {
      const t = totals[a] || {pass:0,total:0,findings:0,weighted:0,words:0,runPass:0,runTotal:0,factLoss:0,semanticConfirmed:0,unjudged:0,sampledOut:0,sentClean:0,sentTotal:0};
      if (!t.total) { row += "<td>-</td>"; continue; }
      let f = t.pass + "/" + t.total + " docs";
      if (t.sentTotal) {
        const sentRate = Math.round(t.sentClean * 100 / t.sentTotal * 10) / 10;
        f += '<div class="rate" title="clean sentences across every document in '
           + 'this total — see the per-cell note for why sentences, not words, '
           + 'words or percent.">' + t.sentClean + "/" + t.sentTotal
           + " sent " + sentRate + "%</div>";
      }
      if (t.runTotal > t.total) {
        f += '<div class="rate">' + t.runPass + "/" + t.runTotal + " runs "
           + Math.round(t.runPass * 100 / t.runTotal) + "%</div>";
      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      if (t.sampledOut) {
        f += '<div class="verdict sampled-out" title="not selected for '
           + 'judging this run (rotate-and-anchor sampling). A deliberate '
           + 'coverage decision, not a failure — and not a pass either.">'
           + t.sampledOut + " not judged</div>";
      }
      // A cell whose judge call actually failed, separate from one sampled
      // out by design: this count excludes the sampled-out cells above.
      const failedJudge = t.unjudged - t.sampledOut;
      if (failedJudge > 0) {
        f += '<div class="verdict unjudged" title="the judge call failed for '
           + 'these cells and never returned a result. Not passes — they were '
           + 'never checked.">' + failedJudge + " unjudged</div>";
      }
      const wt = t.findings
        ? ' <span class="wt" title="weighted total, spec/PSTE-1.md §15 — a '
          + 'conformance count weighted by consequence, not a quality '
          + 'score">wt ' + (Math.round(t.weighted * 10) / 10) + '</span>' : "";
      row += "<td>" + t.findings + wt + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth)
             // ANCHOR/ROTATING (run.py PART 2), independent of real/synthetic
             // — see overview()'s docstring. This is the row that shows
             // overfitting directly: if the anchor total's judge-confirmed
             // count improves run over run while the rotating total does not,
             // the skill is being tuned to the two documents graded every
             // time and not to the standard in general.
             + (Object.keys(o.totalsAnchor).length
                 ? totalRow("TOTAL (judged: anchor)", o.totalsAnchor) : "")
             + (Object.keys(o.totalsRotating).length
                 ? totalRow("TOTAL (judged: rotating)", o.totalsRotating) : "");

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. “wt” is the weighted total (spec/PSTE-1.md §15): every "
    + "finding already carries a weight from 0 to 1, a dropped fact (1.0) counts "
    + "for more than a missing hyphen (0.1), and this sums what each rule "
    + "actually costs instead of counting every rule the same. It is still a "
    + "conformance number, not a quality score: it says how much rule-breaking, "
    + "weighted by what the standard says matters, and nothing about whether the "
    + "prose reads well. “sent” is the share of sentences with no "
    + "finding at all — the unit PSTE itself counts by (N1/N2's word "
    + "limits, D2's six-sentence cap) and the one a reader meets one at a time; "
    + "a per-100-words rate would be just as easy to compute and have no such "
    + "basis in the standard. FACT LOSS marks a cell where faithfulness.py found "
    + "a number, unit, identifier, negation, or obligation missing against the "
    + "source (PSTE-A1) — that check catches dropped tokens, not changed "
    + "meaning, so its absence is not proof the rewrite is faithful. The green "
    + "outline marks the arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
</body>
</html>
