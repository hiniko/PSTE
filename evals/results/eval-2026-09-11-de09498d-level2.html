entences, limit 6", "excerpt": "At a minimum, repair should be run often enough that the gc grace period\nnever expires on ", "line": 72, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2682, "token": "At"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "At a minimum, repair should be run often enough that the gc grace period", "line": 72, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2703, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With a default gc grace period of 10 days, repairing every", "line": 74, "column": 16, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 2834, "token": "a"}, {"rule": "PSTE-D2", "message": "paragraph has 22 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 80, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3025, "token": "-pr"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "data, but doesn't do any streaming.", "line": 93, "column": 13, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3716, "token": "doesn't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "a full repair should be run.", "line": 95, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3849, "token": "should"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full repairs, and incremental repairs.\nFull repairs operate over all of the data in the token range being\nrepaired. Incremental repairs only repair data that&#x27;s been written since\nthe previous incremental repair.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">Incremental</mark> repairs are the default repair type, and if run regularly,\ncan significantly reduce the time and io cost of performing a repair.\nHowever, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> important to understand that once an incremental repair\nmarks data as repaired, it <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> try to repair it again. This is fine\nfor syncing up missed writes, but it <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> protect against things like\ndisk corruption, data loss by operator error, or bugs in Cassandra. For\nthis reason, full repairs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> still be run occasionally.\n\n== Automated Repair Scheduling\n\nSince repair can result in a lot of disk and network io, it has\ntraditionally not been run automatically by Cassandra.\n\nIn the latest version of Cassandra, a new feature called\nxref:managing/operating/auto_repair.adoc[auto repair] was introduced to\nallow Cassandra to submit and manage repairs automatically on a schedule.\n\nThe <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G7: nominalization &#x27;introduction of&#x27;; use a verb\">introduction</mark> of this feature does not interfere with existing repair\nfunctionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nRepairs can also be run by the operator via nodetool.\n\nIncremental repair is the default and is run with the following command:\n\n[source,none]\n----\nnodetool repair\n----\n\nA full repair can be run with the following command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nAdditionally, repair can be run on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr even on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node being repaired<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it does not repair the whole cluster.\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">By</mark> default, repair operates on all token ranges replicated by the node on which repair is run, causing duplicate work when running it on every node. Avoid duplicate work by using the `-pr` flag to repair only the &quot;primary&quot; ranges on a node. \n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N1: instruction is 28 words, limit 20\">Do</mark> a full cluster repair by running the `nodetool repair -pr` command on each node in each datacenter in the cluster, until all of the nodes and datacenters <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;are repaired&#x27;; name the actor\">are</mark> repaired. \n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> specific frequency of repair that&#x27;s right for your cluster, of\ncourse, depends on several factors. However, if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out\nand looking for somewhere to start, running an incremental repair every\n1-3 days, and a full repair every 1-3 weeks is probably reasonable. If\nyou <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to run incremental repairs, a full repair every 5 days is\na good place to start.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">At</mark> a minimum, repair <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run often enough that the gc grace period\nnever expires on unrepaired data. Otherwise, deleted data could\nreappear. With <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">a</mark> default gc grace period of 10 days, repairing every\nnode in your cluster at least once every 7 days will prevent this, while\nproviding enough slack to allow for delays.\n\n== Other Options\n\n`<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 22 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being\n  repaired. A primary range is just a token range for which a node is\n  the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that would occur for the given\n  repair command. This builds the merkle trees, and prints the expected\n  streaming activity, but does not actually do any streaming. By\n  default, incremental repairs are estimated, add the `--full` flag to\n  estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Similar\n  to `--preview`, this builds and compares merkle trees of repaired\n  data, but <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> do any streaming. This is useful for\n  troubleshooting. If this shows that the repaired data is out of sync,\n  a full repair <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`\n", "factLoss": false, "fidelity": null, "semanti umn": 143, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 2529, "token": "a"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 69, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2709, "token": "-pr"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "By default it estimates an incremental repair; add the  CODE    flag to estimate a full re", "line": 72, "column": 225, "excerpt_offset": 45, "severity": "MUST", "arbitrated": false, "weight": 0.1, "offset": 3142, "token": ";"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full repairs and incremental repairs.\n\n* A full repair covers all of the data in the token range being repaired.\n* An incremental repair covers only data written since the previous incremental repair.\n\nIncremental repairs are the default repair type. If run regularly, they can significantly reduce the time and io cost of a repair.\n\nHowever, once an incremental repair marks data as repaired, it will not try to repair that data again. This is fine for syncing up missed writes, but it does not protect against disk corruption, data loss by operator error, or bugs in Cassandra. For this reason, full repairs <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> still be run occasionally.\n\n== Automated Repair Scheduling\n\nRepair can cause a lot of disk and network io, so Cassandra has traditionally not run it automatically.\n\nThe latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.adoc[auto repair]. It lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with existing repair functionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nThe operator can also run repairs via nodetool.\n\nIncremental repair is the default. Run it with:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nRepair a single keyspace with:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nRepair specific tables with:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs token ranges only on the node being repaired. It does not repair the whole cluster.\n\nBy default, repair operates on all token ranges replicated by the node it runs on. Running it on every node therefore causes duplicate work. To avoid this, use the `-pr` flag to repair only the &quot;primary&quot; ranges on a node.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 26 words, limit 25\">To</mark> do a full cluster repair, run `nodetool repair -pr` on each node in each datacenter in the cluster, until all of the nodes and datacenters are repaired.\n\nThe right repair frequency for your cluster depends on several factors. If you are just starting out, a reasonable starting point is:\n\n* an incremental repair every 1-3 days, and\n* a full repair every 1-3 weeks.\n\nIf you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to run incremental repairs, a full repair every 5 days is a good place to start.\n\nAt a minimum, run repair often enough that <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. Otherwise, deleted data could reappear. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 28 words, limit 25\">With</mark> <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">a</mark> default gc grace period of 10 days, repairing every node in your cluster at least once every 7 days will prevent this, while leaving enough slack for delays.\n\n== Other Options\n\n`<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being repaired. A primary range is a token range for which a node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates how much streaming the given repair command would cause. It builds the merkle trees and prints the expected streaming activity, but does not actually stream anything. By default it estimates an incremental repair<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Like `--preview`, it builds and compares merkle trees of repaired data but does not stream anything. This is useful for troubleshooting. If it shows that the repaired data is out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": false, "fidelity": {"source_words": 628, "rewrite_words": 563, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 9 conditions, the rewrite 8. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 569, "weighted": 1.0, "sentences": 82, "cleanSentences": {"clean": 80, "of": 82, "rate": 97.6}, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "At a minimum, run repair often enough that the gc grace period never expires on unrepaired", "line": 54, "column": 44, "excerpt_offset": 43, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 2467, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 23 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node t", "line": 58, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2761, "token": "-pr"}], "html": "== Incremental and Full Repairs\n\nCassandra has 2 types of repair: full repair and incremental repair. A full repair covers all of the data in the token range that it repairs. An incremental repair covers only the data that Cassandra wrote after the previous incremental repair.\n\nIncremental repair is the default type. If you run incremental repairs regularly, they greatly reduce the time and the io cost of a repair. But after an incremental repair marks data as repaired, it does not repair that data again. This is fine for missed writes. It does not protect against disk corruption, data loss from operator error, or bugs in Cassandra. So you still need to run a full repair occasionally.\n\n== Automated Repair Scheduling\n\nRepair can cause a lot of disk io and network io. So Cassandra traditionally did not run repair automatically.\n\nThe latest version of Cassandra adds a new feature, xref:managing/operating/auto_repair.adoc[auto repair]. It lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with the existing repair functions that you run through nodetool.\n\n== Submitting Repairs Using Nodetool\n\nThe operator can also run repairs through nodetool.\n\nIncremental repair is the default. Run it with this command:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with this command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nYou can also run repair on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nYou can also run repair on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node where you run it. It does not repair the whole cluster. By default, repair covers all token ranges that the node replicates. If you run it on every node, this causes duplicate work.\n\nTo avoid duplicate work, use the `-pr` flag. This flag repairs only the &quot;primary&quot; ranges on a node. To repair the full cluster, run `nodetool repair -pr` on each node in each datacenter. Continue until you repair every node and every datacenter.\n\nThe right repair frequency for your cluster depends on several factors. If you are new to repair and need a starting point, run an incremental repair every 1-3 days. Also run a full repair every 1-3 weeks. If you do not want to run incremental repairs, start with a full repair every 5 days.\n\nAt a minimum, run repair often enough that <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. If it expires, deleted data can reappear. The default gc grace period is 10 days. If you repair every node in your cluster at least once every 7 days, you prevent this. That schedule also leaves enough slack for delays.\n\n== Other Options\n\n`<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 23 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node that you\n  repair. A primary range is a token range for which the node is the\n  first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming for the given repair command. This\n  builds the merkle trees and prints the expected streaming activity.\n  It does not stream any data. By default, this estimates an\n  incremental repair. To estimate a full repair, add the `--full` flag.\n`-vd, --validate`::\n  Checks that the repaired data is the same across all nodes. Like\n  `--preview`, this builds and compares merkle trees of the repaired\n  data. It does not stream any data. This is useful for\n  troubleshooting. If this shows that the repaired data is out of sync,\n  run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": false, "fidelity": {"source_words": 628, "rewrite_words": 584, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste_fixed": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 601, "weighted": 1.0, "sentences": 86, "cleanSentences": {"clean": 84, "of": 86, "rate": 97.7}, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "CODE            ::\n  Estimates the amount of streaming for the given repair command. This\n", "line": 63, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2986, "token": "-prv"}, {"rule": "PSTE-D2", "message": "paragraph has 10 sentences, limit 6", "excerpt": "CODE            ::\n  Checks that the repaired data is the same across all nodes. Like\n   C", "line": 69, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3281, "token": "-vd"}], "html": "== Incremental and Full Repairs\n\nCassandra has 2 types of repair: full repair and incremental repair. A full repair covers all of the data in the token range that it repairs. An incremental repair covers only the data that Cassandra wrote after the previous incremental repair.\n\nIncremental repair is the default type. If you run incremental repairs often, they greatly reduce the time and the io cost of a repair. But after an incremental repair marks data as repaired, it does not repair that data again. This is fine for missed writes. It does not protect against disk corruption, data loss from operator error, or bugs in Cassandra. So you still need to run a full repair occasionally.\n\n== Automatic Repair Scheduling\n\nRepair can cause a lot of disk io and network io. So Cassandra traditionally did not run repair automatically.\n\nThe latest version of Cassandra adds a new feature, xref:managing/operating/auto_repair.adoc[auto repair]. It lets Cassandra submit and handle repairs automatically on a schedule.\n\nThis feature does not interfere with the current repair functions that you run through nodetool.\n\n== Submitting Repairs Using Nodetool\n\nThe operator can also run repairs through nodetool.\n\nIncremental repair is the default. Run it with this command:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with this command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nYou can also run repair on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nYou can also run repair on the tables that you name:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node where you run it. It does not repair the whole cluster. By default, repair covers all token ranges that the node replicates. If you run it on every node, this repairs the same ranges more than once.\n\nTo repair each range only once, use the `-pr` flag. This flag repairs only the &quot;primary&quot; ranges on a node. To repair the full cluster, run `nodetool repair -pr` on each node in each datacenter. Continue until you repair every node and every datacenter.\n\nThe correct repair rate for your cluster depends on some factors. If you are new to repair and need a starting point, run an incremental repair every 1-3 days. Also run a full repair every 1-3 weeks. If you do not want to run incremental repairs, start with a full repair every 5 days.\n\nAt a minimum, run repair often enough that no unrepaired data reaches the end of its gc grace period. If it expires, deleted data can reappear. The default gc grace period is 10 days. If you repair every node in your cluster at least once every 7 days, you prevent this. That schedule also leaves enough slack for delays.\n\n== Other Options\n\n`-pr, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node that you\n  repair. A primary range is a token range for which the node is the\n  first replica in the ring.\n\n`<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">-prv</mark>, --preview`::\n  Estimates the amount of streaming for the given repair command. This\n  builds the merkle trees and prints the expected streaming activity.\n  It does not stream any data. By default, this estimates an\n  incremental repair. To estimate a full repair, add the `--full` flag.\n\n`<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 10 sentences, limit 6\">-vd</mark>, --validate`::\n  Checks that the repaired data is the same across all nodes. Like\n  `--preview`, this builds and compares merkle trees of the repaired\n  data. It does not stream any data. This is useful for\n  troubleshooting. If this shows that the repaired data is not the same\n  on all nodes, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`\n\nLeft 3 faults: &quot;primary&quot; (3 places). &quot;Primary range&quot; is the Cassandra term for the `-pr` flag. &quot;Main range&quot; would rename it.", "factLoss": false, "fidelity": {"source_words": 628, "rewrite_words": 619, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}}, "passes": {"control": {"findings": [8, 7, 9], "passed": 0, "of": 3, "rate": 0, "mean": 8.0}, "pste": {"findings": [2, 7, 6], "passed": 0, "of": 3, "rate": 0, "mean": 5.0}}}, "howto-k8s-debug-po rpt": "**You are using  CODE     **:", "line": 28, "column": 9, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1086, "token": "are"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "If a Pod is stuck in the  CODE     state, then it has been scheduled to a worker node,", "line": 36, "column": 51, "excerpt_offset": 50, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1501, "token": "has"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "but it can't run on that machine.", "line": 37, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1546, "token": "can't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "should be informative.", "line": 38, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1624, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "Make sure you are using the latest version.", "line": 62, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2726, "token": "are"}, {"rule": "PSTE-P1", "message": "'you should' is not the imperative form; write the instruction as a command", "excerpt": "In other words, you should allow Pods with existing violations", "line": 70, "column": 33, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3160, "token": ","}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "In other words, you should allow Pods with existing violations", "line": 70, "column": 39, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3166, "token": "should"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "Once your pod has been scheduled, the methods described in", "line": 76, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3396, "token": "has"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If your pod is not behaving as you expected, it may be that there was an error in your\npod", "line": 82, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3607, "token": "If"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "pod description (e.g.", "line": 83, "column": 18, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 3711, "token": "e"}, {"rule": "PSTE-N5", "message": "multi-word noun 'command line you intended it' over 3 words", "excerpt": "will not use the command line you intended it to use.", "line": 87, "column": 14, "excerpt_offset": 13, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 4049, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "The next thing to check is whether the pod on the apiserver\nmatches the pod you meant to c", "line": 101, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4625, "token": "The"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "matches the pod you meant to create (e.g.", "line": 102, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 4722, "token": "e"}], "html": "### Debugging Pods\n\nThe first step in debugging a Pod <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is taking&#x27;\">is</mark> taking a look at it. Check the current\nstate of the Pod and recent events with the following command:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`?\nHave there been recent restarts?\n\nContinue debugging depending on the state of the pods.\n\n#### My pod stays pending\n\nIf a Pod is stuck in `Pending` it means that it can not be scheduled onto a node.\nGenerally this is because there are insufficient resources of one type or another\nthat prevent scheduling. Look at the output of the `kubectl describe ...` command above.\nThere <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be messages from the scheduler about why it can not schedule your pod.\nReasons include:\n\n* **You <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have enough resources**: You may <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;have exhausted&#x27;; use simple past\">have</mark> exhausted the supply of CPU\n  or Memory in your cluster, in this case you need to delete Pods, adjust resource\n  requests, or add new nodes to your cluster. See [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/)\n  for more information.\n\n* **You <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: When you bind a Pod to a `hostPort` there are a\n  limited number of places that pod can be scheduled. In most cases, `hostPort`\n  is unnecessary, try using a Service object to expose your Pod.  If you do require\n  `hostPort` then you can only schedule as many Pods as there are nodes in your Kubernetes cluster.\n\n\n#### My pod stays waiting\n\nIf a Pod is stuck in the `Waiting` state, then it <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node, \nbut it <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run on that machine. Again, the information from `kubectl describe ...`\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be informative. The most common cause of `Waiting` pods is a failure to pull the image.\nThere are three things to check:\n\n* Make sure that you have the name of the image correct.\n* Have you pushed the image to the registry?\n* Try to manually pull the image to see if the image can be pulled. For example,\n  if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n\n#### My pod stays terminating\n\nIf a Pod is stuck in the `Terminating` state, it means that a deletion has been\nissued for the Pod, but the control plane is unable to delete the Pod object.\n\nThis typically happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/)\nand there is an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/)\ninstalled in the cluster that prevents the control plane from removing the\nfinalizer.\n\nTo identify this scenario, check if your cluster has any\nValidatingWebhookConfiguration or MutatingWebhookConfiguration that target\n`UPDATE` operations for `pods` resources.\n\nIf the webhook is provided by a third-party:\n- Make sure you <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the corresponding provider.\n\nIf you are the author of the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on\n  `UPDATE` operations. For example, changes to containers are usually not allowed.\n- For a validating webhook, make sure that your validation policies only apply\n  to new changes. In other words<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> allow Pods with existing violations\n  to pass validation. This allows Pods that were created before the validating\n  webhook was installed to continue running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled, the methods described in\n[Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/)\nare available for debugging.\n\n#### My pod is running but not doing what I told it to do\n\n<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> your pod is not behaving as you expected, it may be that there was an error in your\npod description (<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `mypod.yaml` file on your local machine), and that the error\nwas silently ignored when you created the pod.  Often a section of the pod description\nis nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.\nFor example, if you misspelled `command` as `commnd` then the pod will be created but\nwill not use <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended it&#x27; over 3 words\">the</mark> command line you intended it to use.\n\nThe first thing to do is to delete your pod and try creating it again with the `--validate` option.\nFor example, run `kubectl apply --validate -f mypod.yaml`.\nIf you misspelled `command` as `commnd` then will give an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 sch lti-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster\u2019s operation. However, clients will lose connectivity to the failed members. Client libraries <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users for read requests by automatically reconnecting to other members. Operators <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to increase due to the reconnections.\n\n## Leader failure\n\nWhen a leader fails, <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster automatically elects&#x27; over 3 words\">the</mark> etcd cluster automatically elects a new leader. The election does not happen <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark> once the leader fails. It takes about an election timeout to elect a new leader since the failure detection model is timeout based.\n\nDuring the leader election the cluster cannot process any writes. Write requests sent during the election <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued for processing until a new leader <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\nWrites already sent to the old leader but not yet committed may be lost. The new leader has the power to rewrite any uncommitted entries from the previous leader. From the user perspective, some write requests might time out after a new leader election. However, no committed writes are ever lost.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before the granted TTL even if it was granted by the old leader.\n\n## Majority failure\n\nWhen the majority members of the cluster fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can only recover from a majority failure once the majority of members become available. If a majority of members cannot come back online, then the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires due to server side unavailability.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one with a member majority and the other with a member minority. The majority side becomes the available cluster and the minority side is unavailable. There is no \u201csplit-brain\u201d in etcd because cluster members are explicitly added/removed with each such change is approved by the current majority of members.\n\nIf the leader is on the majority side, then from the majority point of view the failure is a minority follower failure. If the leader is on the minority side, then it is a leader failure. The leader on the minority side steps down and the majority side elects a new leader.\n\nOnce the network partition clears, <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N5: multi-word noun &#x27;minority side automatically recognizes&#x27; over 3 words\">the</mark> minority side automatically recognizes the leader from the majority side and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap is only successful if all required members successfully start. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nOf course, it is possible to recover <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;failed bootstrapped cluster like recovering&#x27; over 3 words\">a</mark> failed bootstrapped cluster like recovering a running cluster. However, it almost always takes more time and resources to recover that cluster than bootstrapping a new one, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 635, "weighted": 4.6, "sentences": 46, "cleanSentences": {"clean": 37, "of": 46, "rate": 80.4}, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'five member etcd cluster operates' over 3 words", "excerpt": "For example, two follower failures do not affect how a five member etcd cluster operates.", "line": 13, "column": 184, "excerpt_offset": 53, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 898, "token": "a"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Client libraries should hide these interruptions from users for read requests by reconnect", "line": 13, "column": 312, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1026, "token": "should"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Operators should expect higher system load on the remaining members because of these recon", "line": 13, "column": 431, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1145, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'are queued'; name the actor", rs and boo", "line": 43, "column": 81, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3682, "token": "If"}], "html": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common when you run many machines. A machine fails when its hardware or software breaks. Several machines can fail at the same time because of a power failure or a network problem. Different kinds of failures can also happen together, so it is almost impossible to list every possible failure case.\n\nThis section lists kinds of failures and explains how etcd is built to survive them. Most users, if not all, can match a specific failure to one of these kinds. To be ready for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nIf fewer than half of the followers fail, the etcd cluster keeps accepting requests and making progress without major disruption. For example, two follower failures do not affect how <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster operates&#x27; over 3 words\">a</mark> five member etcd cluster operates. Clients connected to the failed members do lose their connection, though. Client libraries <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users for read requests by reconnecting to other members automatically. Operators <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect higher system load on the remaining members because of these reconnections.\n\n## Leader failure\n\nWhen the leader fails, the etcd cluster elects a new leader automatically. The election does not start the instant the leader fails. Because failure detection is based on timeouts, electing a new leader takes about one election timeout.\n\nWhile the election is running, the cluster cannot process writes. Write requests sent during the election <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued and processed once a new leader <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\nWrites that were sent to the old leader but not yet committed may be lost. The new leader can rewrite any uncommitted entries from the previous leader. From the user&#x27;s point of view, some write requests might time out after a new leader is elected. No committed write is ever lost, though.\n\nThe new leader automatically extends the timeouts of all leases. This makes sure a lease does not expire before its granted TTL, even if <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;old leader granted it&#x27; over 3 words\">the</mark> old leader granted it.\n\n## Majority failure\n\nWhen a majority of the cluster&#x27;s members fail, the etcd cluster fails and cannot accept any more writes.\n\nThe cluster can only recover from a majority failure once a majority of members is available again. If a majority of members cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is working&#x27;\">is</mark> working, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader automatically extends the timeouts of all leases. This makes sure no lease expires because the servers were unavailable.\n\n## Network partition\n\nA network partition behaves like a minor followers failure or a leader failure. It splits the etcd cluster into two parts: one holding re or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nIf fewer than half of the followers fail, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without any major disruption. For example, the failure of two followers does not affect the <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;operation of&#x27;; use a verb\">operation</mark> of a five-member etcd cluster. But clients lose their connections to the failed members. A client library must reconnect to other members automatically. This hides these interruptions from users for read requests. Operators can expect the system load on the other members to increase because of the reconnections.\n\n## Leader failure\n\nIf a leader fails, the etcd cluster elects a new leader automatically. The election does not happen at the instant the leader fails. The cluster takes about one election timeout to elect a new leader, because the cluster detects failures with timeouts.\n\nDuring the election, the cluster cannot process any writes. The cluster queues the write requests that arrive during the election until it elects a new leader.\n\nThe cluster can lose writes that clients sent to the old leader but that the old leader did not commit. The new leader can rewrite any uncommitted entries from the old leader. From the user perspective, some write requests can time out after a new leader election. But the cluster never loses a committed write.\n\nThe new leader extends the timeouts of all leases automatically. This makes sure that a lease does not expire before its granted TTL, even if the old leader granted the lease.\n\n## Majority failure\n\nIf the majority of the members of the cluster fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can recover from eight": 0.5, "offset": 2439, "token": "Please"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an existing etcd deployment to 3.5, the running cluster must be 3.4 or greater. If <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> before 3.4<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please [upgrade to 3.4](../upgrade_3_3/) before upgrading to 3.5.\n\nAlso, to ensure a smooth rolling upgrade, the running cluster must be healthy. Check the health of the cluster by using the `etcdctl endpoint health` command before proceeding.\n\n#### Preparation\n\nBefore upgrading etcd, always test the services relying on etcd in a staging environment before deploying the upgrade to the production environment.\n\nBefore beginning, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). Should something go wrong with the upgrade, it is possible to use this backup to [downgrade](#downgrade) back to existing etcd version. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-P1: &#x27;Please&#x27; is not the imperative form; write the instruction as a command\">Please</mark> note that the `snapshot` command only backs up the v3 data. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nWhile upgrading, an etcd cluster supports mixed versions of etcd members, and operates with the protocol of the lowest common version. The cluster is only considered upgraded once all of its members are upgraded to version 3.5. Internally, etcd members negotiate with each other to determine the overall cluster version, which controls the reported version and the supported features.\n\n#### Limitations\n\nNote: If the cluster only has v3 data and no v2 data, it is not subject to this limitation.\n\n<mark id=\"f3\" c  make sure that the rolling upgrade is smooth, the running cluster must be healthy. Before you continue, check the health of the cluster with the `etcdctl endpoint health` command.\n\n#### Preparation\n\nBefore you upgrade etcd, always test the services that rely on etcd in a staging environment. Do this before you deploy the upgrade to the production environment.\n\nBefore you begin, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). If the upgrade goes wrong, you can use this backup to [downgrade](#downgrade) to the existing etcd version. The `snapshot` command backs up only the v3 data. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nDuring an upgrade, an etcd cluster supports members with mixed versions of etcd. The cluster operates with the protocol of the lowest common version. The cluster counts as upgraded only after all of its members are at version 3.5. Internally, the etcd members negotiate with each other to find the overall cluster version. This cluster version controls the reported version and the supported features.\n\n#### Limitations\n\nNote: If the cluster has only v3 data and no v2 data, this limitation does not apply to it.\n\nIf the cluster serves a v2 data set larger than 50MB, this limitation applies. Each newly upgraded member can take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. So it is safest to wait 2 minutes between the upgrade of each member.\n\nFor <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more, this one-time process can take even more time. Administrators of etcd clusters of this size can contact the [etcd team][etcd-contact] before they upgrade. We will give advice on the procedure.\n\n#### Downgrade\n\nIf all members are upgraded to v3.5, the cluster is upgraded to v3.5. A downgrade from this completed state is **not possible**. But if any single member is still v3.4, the cluster and its operations remain &quot;v3.4&quot;. From this mixed state of the cluster, you can run a v3.4 etcd binary on all members again.\n\n[Download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) so that you can downgrade the cluster even after the upgrade is complete.", "factLoss": false, "fidelity": {"source_words": 430, "rewrite_words": 427, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-G2", "quote": "the cluster is upgraded to v3.5", "problem": "Passive voice hides the actor (the administrator who performs the upgrade) even though that actor is named as \"you\" elsewhere in the same document.", "fix": "Write \"you upgrade all members to v3.5\" or \"the cluster reaches v3.5\" so the actor is not hidden by a passive construction where the actor is known.", "reason": "PSTE-G2 permits the passive only when the actor is genuinely unknown, but this document already addresses the reader directly as \"you\" for the same upgrade actions.", "confidence": "high", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 29, "column": 38, "offset": 2112}, {"rule": "PSTE-L4", "quote": "cluster counts as upgraded only after all of its members", "problem": "The fact that the cluster only counts as upgraded once every member reaches v3.5 is stated in Mixed Versions and then restated in different words in Downgrade ('the cluster is upgraded to v3.5').", "fix": "In the Downgrade section, refer back to the earlier definition instead of restating it, e.g. 'Once every member reaches v3.5 (see above), downgrade from that state is not possible.'", "reason": "PSTE-L4 forbids stating the same fact twice in a document even in different words, and this is not a warning repeated for a reader who skipped a section, so the exception does not e unsure of how to pass a flag to  CODE   through your editor, please see the [do", "line": 46, "column": 71, "excerpt_offset": 70, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3993, "token": ","}, {"rule": "PSTE-P1", "message": "'Please' is not the imperative form; write the instruction as a command", "excerpt": "Please [file an issue](#file-an-issue) with this memory debug information attached.", "line": 50, "column": 322, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4406, "token": "Please"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If you are uncomfortable sharing the package names of your code, you can share the  CODE  ", "line": 50, "column": 517, "excerpt_offset": 111, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4601, "token": "it's"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf you suspect that `gopls` <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is crashing&#x27;\">is</mark> crashing or not working correctly<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please follow the troubleshooting steps below.\n\nIf `gopls` <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is using&#x27;\">is</mark> using too much memory<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please follow the steps under [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md), which has more a more specific version of these instructions.\n\n1. Verify that your project is in good shape by working with it outside of your editor. Running a command like `go build ./...` in the workspace directory will compile everything. For modules, `go mod tidy` is another good check, though it may modify your `go.mod`.\n1. Check that your editor <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> showing any diagnostics that indicate a problem with your workspace. They may appear as diagnostics on a Go file&#x27;s package declaration, diagnostics in a go.mod file, or as a status or progress message. Problems in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date by following the [installation instructions](index.md#installation), then [restarting gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` has no persistent state, so restarting it will fix transient problems. This is good and bad: good, because you can keep working, and bad, because you <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> be able to debug the issue until it recurs.\n\nIn most cases, closing all your open editors will guarantee that `gopls` is killed and restarted. If you <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to do that, there may be an editor command you can use to restart only `gopls`. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N1: instruction is 25 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> you may need to explicitly kill `gopls` if you use `vim`.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) that can help debug further. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 42 words, limit 25\">If</mark> <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident the problem is with `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come prepared with a short <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to be available to answer questions for a while afterward.\n\n## File an issue\n\nWe <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> diagnose a problem from just a description. When filing an issue<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please include as much as possible of the following information:\n\n1. Your editor and any settings you <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G4: perfect tense &#x27;have configured&#x27;; use simple past\">have</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> also helpful to tell us the timestamp the problem occurred, so we can find it the log. See the [instructions](#capture-logs) for information on how to capture gopls logs.\n\nYour editor may have a command that fills out some of the necessary information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that will allow you to see profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You will then be able to view debug information by navigating to `localhost:6060`.\n\nIf you are unsure of how to pass a flag to `gopls` through your editor<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` automatically writes out memory debug information when your usage exceeds 1GB. This information can be found in your temporary directory with names like `gopls.1234-5GiB-withnames.zip`. On Windows, your temporary directory will be located at `%TMP%`, and on Unixes, it will be `$TMPDIR`, which is usually `/tmp`. <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-P1: &#x27;Please&#x27; is not the imperative form; write the instruction as a command\">Please</mark> [file an issue](#file-an-issue) with this memory debug information attached. If you are uncomfortable sharing the package names of your code, you can share the `-nonames` zip instead, but <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 566, "weighted": 8.6, "sentences": 43, "cleanSentences": {"clean": 29, "of": 43, "rate": 67.4}, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'is crashing'", "excerpt": "If you think  CODE   is crashing or misbehaving, follow the steps below.", "line": 5, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 62, "token": "is"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'is using'", "excerpt": "If  CODE   is using too much memory, skip to [Memory usage](#debug-memory-usage).", "line": 7, "column": 12, "excerpt_offset": 11, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 126, "token": "is"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "VS Code users should follow [their troubleshooting guide]( URL                            ", "line": 11, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 222, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "Check that your editor isn't showing diagnostics that point to a workspace problem.", "line": 14, "column": 27, "excerpt_offset": 23, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 642, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "you can keep working, but you can't debug the issue until it happens again.", "line": 21, "column": 130, "excerpt_offset": 30, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1367, "token": "can't"}, {"rule": "PSTE-N1", "message": "instruction is 23 words, limit 20
