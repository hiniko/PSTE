r release candidate, please see our", "line": 126, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4697, "token": "are"}, {"rule": "PSTE-P1", "message": "'please' is not the imperative form; write the instruction as a command", "excerpt": "If you are upgrading to an alpha, beta, or release candidate, please see our", "line": 126, "column": 61, "excerpt_offset": 60, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4750, "token": ","}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 9, "excerpt_offset": 8, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4981, "token": "you're"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go ahead'; use 'start'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 25, "excerpt_offset": 24, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4997, "token": "go"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If you are using caching provided by Django, you should consider clearing your\ncache after", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5081, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5088, "token": "are"}, {"rule": "PSTE-P1", "message": "'you should' is not the imperative form; write the instruction as a command", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 44, "excerpt_offset": 43, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5124, "token": ","}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f21\" class=\"hit\" rpt_offset": 7, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3820, "token": "turn"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are upgrading'", "excerpt": "If you are upgrading to an alpha, beta, or release candidate, see our guide", "line": 118, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4212, "token": "are"}, {"rule": "PSTE-D2", "message": "paragraph has 10 sentences, limit 6", "excerpt": "If you use Django's caching, consider clearing your cache after upgrading.\nOtherwise you m", "line": 128, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4540, "token": "If"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version has several benefits:\n\n* You get new features and improvements.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release keeps your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. Automated upgrade helpers are listed on\n    the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nThe steps below will help make your upgrade as smooth as possible.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nNext, learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release,\n  starting from the one after your current Django version, up to and\n  including the version you plan to upgrade to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nPay close attention to backwards incompatible changes. They show what work\nthe upgrade will need.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading across more than one feature version (<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\nit is usually easier to upgrade one feature release at a time (2.0 to 2.1 to\n2.2) rather than making all the changes at once. For each feature release,\nuse the latest patch release (<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. for 2.1, use 2.1.15).\n\nUse the same incremental approach when upgrading from one LTS to the next.\n\nDependencies\n============\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases you will also need to upgrade your Django-related dependencies\nto their latest versions. If the Django version was released recently, or if\nsome of your dependencies are not well-maintained, some dependencies may not\nyet support the new Django version. In that case you may have to wait until\nnew versions of those dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, fix any deprecation warnings your project raises on your\ncurrent version of Django. This tells you which parts of your code need\nchanging.\n\nPython silences deprecation warnings by default. Turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you are not using the Django test runner, you may also need to make sure\nconsole output is not captured, since that would hide deprecation warnings.\nFor example, with `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nFix all deprecation warnings on your current version of Django before\ncontinuing.\n\nThird party applications may use deprecated APIs to support multiple Django\nversions, so deprecation warnings from packages <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily mean there is a problem. If a package <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest\nversion of Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nWhen <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\nIf you use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade,\nyou might want to <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nOnce the new environment is <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">turn</mark> on deprecation\nwarnings so they appear in the test output (you can also use the flag when\ntesting your app manually with ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any test failures. While the release notes are fresh in your mind, this\nis also a good time to use new Django features by refactoring your code to\nremove any deprecation warnings.\n\nIf you <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, see our guide\non :ref:`testing-pre-releases` for specific tips on catching regressions and\nreporting bugs.\n\nDeployment\n==========\n\nOnce you are confident your app works with the new version of Django, you can\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded project.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 10 sentences, limit 6\">If</mark> you use Django&#x27;s caching, consider clearing your cache after upgrading.\nOtherwise you may run into problems. For example, if you cache pickled\nobjects, those objects are not guaranteed to be pickle-compatible across\nDjango versions. One past incompatibility involved caching pickled\n:class:`~django.http.HttpResponse` objects, either directly or indirectly via\nthe :func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 756, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 24. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 738, "weighted": 3.0, "sentences": 143, " An upgrade to the latest Django version gives you several benefits:\n\n* You get new features and improvements.\n* You get bug fixes.\n* Django stops security updates for older versions at some point\n  (see :ref:`supported-versions-policy`).\n* An upgrade at each new release keeps your code base current. It also makes\n  future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has an active ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page lists automated upgrade helpers.\n\nThe sections below list things to consider so that your upgrade goes smoothly.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`. It is useful.\n\nAfter that, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release.\n  Start with the release after your current Django version. Stop at the\n  version that you plan to upgrade to, and include that version.\n* Read the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards-incompatible changes. They show you what\na successful upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 10 sentences, limit 6\">Sometimes</mark> you upgrade through more than one feature version, for example from\n2.0 to 2.2. In that case, upgrade one feature release at a time: 2.0 to 2.1,\nthen 2.1 to 2.2. This is usually easier than to make all the changes for every\nfeature release at once. For each feature release, use the latest patch\nrelease. For example, for 2.1, use 2.1.15.\n\nUse the same incremental approach when you upgrade from one LTS to the next.\n\nDependencies\n============\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to their\nlatest versions. Some of your dependencies may not support the new Django\nversion yet. This happens if the Django release is recent, or if a dependency\nis not well maintained. In these cases you may have to wait for new versions\nof those dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises\non your current version of Django. When you fix these warnings first, you learn\nwhich areas of the code need changes.\n\nPython silences deprecation warnings by default. Turn them on with the Python\ncommand-line option ``-Wa`` or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, this command shows warnings while the tests run:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, also make sure that nothing captures\nthe console output. Captured output hides deprecation warnings. For example,\nif you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue the upgrade.\n\nThird-party applications may use deprecated APIs so that they support several\nversions of Django. So a deprecation warning in an installed package does not\nalways show a problem. If a package does not support the latest version of\nDjango, consider whether to open an issue or send a pull request for it.\n\nInstallation\n============\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">When</mark> you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\nIf you use a :mod:`virtual environment &lt;venv&gt;` and the upgrade is major,\nconsider a new environment. Create it with all the dependencies before you\ninstall.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings\nagain so that the test output shows them. You can also use the flag when you\ntest your app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter the tests run, fix any failures. While the release notes are fresh in\nyour mind, this is also a good time to use new Django features. Refactor your\ncode to remove every deprecation warning.\n\nIf you upgrade to an alpha, beta, or release candidate, read our guide on\n:ref:`testing-pre-releases`. It gives specific tips on how to catch regressions\nand report bugs.\n\nDeployment\n==========\n\nWhen you are confident enough that your app works with the new version of\nDjango, :doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">If</mark> you use the caching that Django provides, consider whether to clear your\ncache after the upgrade. If you do not, you can have problems. For example,\nDjango does not guarantee that pickled objects stay pickle-compatible across\nDjango versions, so a cache of pickled objects can break. One past case of\nincompatibility was a cache of pickled :class:`~django.http.HttpResponse`\nobjects, either directly or indirectly through the\n:func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 810, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 27. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 13 -> 11, some/most 6 -> 7)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "also make sure that nothing captures the console output", "problem": "The original hedges this step as possibly necessary (\"you may need to also ensure\"), but the rewrite states it as an unconditional command, dropping the necessity qualifier.", "fix": "Write \"If you do not use the Django test runner, you may also need to make sure that nothing captures the console output.\"", "reason": "PSTE-A1 requires keeping every scope qualifier the text states, and \"may need to\" is a qualifier on whether this step is required at all.", "confidence": "medium", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 71, "column": 43, "offset": 2791}, {"rule": "PSTE-P1", "quote": "you must also upgrade your Django-related dependencies to their latest versions", "problem": "The instruction is phrased with \"you must\" instead of the imperative form.", "fix": "Write \"In most cases, also upgrade your Django-related dependencies to their latest versions.\"", "reason": "PSTE-P1 requires instructions in the imperative and its own example rules out exactly this pattern (\"you should run the tests\").", "confidence": "high", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 50, "column": 15, "offset": 1902}, {"rule": "PSTE-D4", "quote": "If you upgrade to an alpha, beta, or release candidate", "problem": "", "fix": "", "reason": "Three single-word items inside one conditional clause are not the substantive parallel items D4 targets, and forcing them into a bulle  "pste_fixed": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 732, "weighted": 1.0, "sentences": 142, "cleanSentences": {"clean": 140, "of": 142, "rate": 98.6}, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "Sometimes you upgrade through more than one feature version, for example from\n2.0 to 2.2. ", "line": 39, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1430, "token": "Sometimes"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "For example, Django does not make sure that pickled objects stay\npickle-compatible across ", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4854, "token": "For"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nAn upgrade to the latest Django version gives you some benefits:\n\n* You get new features and improvements.\n* You get defect fixes.\n* Django stops security updates for older versions at some point\n  (see :ref:`supported-versions-policy`).\n* An upgrade at each new release keeps your code base current. It also makes\n  future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has an active ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page lists automatic upgrade helpers.\n\nThe sections below list things to consider so that your upgrade goes smoothly.\n\nNecessary Reading\n=================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`. It is useful.\n\nAfter that, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` per &#x27;final&#x27; release.\n  Start with the release after your current Django version. Stop at the\n  version that you plan to upgrade to, and include that version.\n* Read the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards-incompatible changes. They show you what\na successful upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Sometimes</mark> you upgrade through more than one feature version, for example from\n2.0 to 2.2. In that case, upgrade one feature release at a time: 2.0 to 2.1,\nthen 2.1 to 2.2. This is usually easier than to make all the changes for every\nfeature release at once.\n\nPer feature release, use the latest patch release. For example, for 2.1, use\n2.1.15.\n\nUse the same incremental way when you upgrade from one LTS to the next.\n\nDependencies\n============\n\nIn most cases you must also upgrade your Django-related dependencies to their\nlatest versions.\n\nSome of your dependencies may not support the new Django version yet. This\nhappens if the Django release is new, or if a dependency is not well\nmaintained. In these cases you may have to wait for new versions of those\ndependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises\non your current version of Django. When you fix these warnings first, you learn\nwhich areas of the code need changes.\n\nPython silences deprecation warnings by default. Turn them on with the Python\ncommand-line option ``-Wa`` or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, this command shows warnings while the tests run:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, also make sure that nothing captures\nthe console output. Captured output hides deprecation warnings. For example,\nif you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue the upgrade.\n\nThird-party applications may use deprecated APIs so that they support some\nversions of Django. So a deprecation warning in an installed package does not\nalways need a fix. If a package does not support the latest version of\nDjango, consider whether to open an issue or send a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\n\nIf you use a :mod:`virtual environment &lt;venv&gt;` and the upgrade is major,\nconsider a new environment. Create it with all the dependencies before you\ninstall.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you create the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Enable deprecation warnings\nagain so that the test output shows them. You can also use the flag when you\ntest your app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter the tests run, fix any failures. While you still remember the release\nnotes, this is also a good time to use new Django features. Refactor your\ncode to remove every deprecation warning.\n\nIf you upgrade to an alpha, beta, or release candidate, read our guide on\n:ref:`testing-pre-releases`. It gives tips on how to catch regressions\nand report bugs.\n\nDeployment\n==========\n\nWhen you are confident enough that your app works with the new version of\nDjango, :doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\nIf you use the caching that Django provides, consider whether to clear your\ncache after the upgrade. If you do not, you can have problems.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">For</mark> example, Django does not make sure that pickled objects stay\npickle-compatible across Django versions, so a cache of pickled objects can\nbreak. One past case of incompatibility was a cache of pickled\n:class:`~django.http.HttpResponse` objects, either directly or indirectly\nthrough the :func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 804, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 27. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 13 -> 9, some/most 6 -> 7)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "so that they support some versions of Django", "problem": "The rewrite changes the original's quantifier 'multiple versions' to 'some versions', which is a weaker and less specific claim.", "fix": "Write \"so that they support multiple versions of Django\" to preserve the original scope qualifier.", "reason": "PSTE-A1 forbids changing a scope qualifier; 'multiple' (definitely more than one) and 'some' (an unspecified, possibly singular amount) are not the same fact.", "confidence": "high", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 86, "column": 50, "offset": 3173}, {"rule": "PSTE-G9", "quote": "Captured output hides deprecation warnings.", "problem": "This sentence refers back to the specific captured console output just mentioned in the prior sentence, but starts with a bare noun phrase instead of a definite article.", "fix": "Write \"The captured output hides deprecation warnings.\"", "reason": "PSTE-G9 requires an article before a noun where grammar permits one, and grammar permits (and favo nsider the case where the only spend in a bundle was a fast-forward spend, ", "line": 20, "column": 265, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1870, "token": "We"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'i.e.'; use 'that is'", "excerpt": "I.e.", "line": 21, "column": 234, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.3, "offset": 2250, "token": "I"}, {"rule": "PSTE-G4", "message": "perfect tense 'have been melted'; use simple past", "excerpt": "we would accept singleton spends into the mempool for singletons which have been melted an", "line": 21, "column": 310, "excerpt_offset": 71, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2326, "token": "have"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "This update was done in place, causing the mempool to change and propagate the fast-forwar", "line": 22, "column": 103, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2466, "token": "This"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go through'; use 'read'", "excerpt": "Trying to stop the spread by melting the singleton makes the transactions not go through, ", "line": 27, "column": 81, "excerpt_offset": 78, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3157, "token": "go"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "Farmers trying to create a block with the affected mempool items would experience performa", "line": 28, "column": 3, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3412, "token": "Farmers"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "Due to the decentralized nature of the Chia blockchain with different configurations and v", "line": 54, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4519, "token": "Due"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Version 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block ", "line": 56, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4732, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Version 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast F", "line": 58, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 4999, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5290, "token": "When"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5460, "token": "When"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. Additionally, block production slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 782, "weighted": 3.6, "sentences": 50, "cleanSentences": {"clean": 44, "of": 50, "rate": 88.0}, "finding rebased on top of the latest version of the singleton, the mempool item is", "line": 58, "column": 135, "excerpt_offset": 131, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5008, "token": "have"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "When spend bundles are ingested into the mempool, every spend eligible for fast forward is", "line": 59, "column": 4, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 5057, "token": "When"}], "html": "# Block creation impacted due to mempool issues\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> a farmer is eligible to create the next block, it has a limited time <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> about 28 seconds \u2014 to build an unfinished block and get it, via the network, to a timelord. The timelord then infuses the unfinished block to produce the finished block.\n\nTo earn transaction fees, farmers pull transactions from the mempool (ordered by fee per cost) and add them to the unfinished block. The fees go to the farmer that makes the block.\n\nCNI noticed that the mempool was completely full, yet transactions were not being included in blocks. Block production also slowed below the expected rate. The cause: farmers eligible to make blocks were not producing unfinished blocks in time, because of several bugs in the mempool logic for fast forward spends.\n\n### What fast forward spends are\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis lets offer files refer to a singleton by coin ID, even though the coin ID changes with every state update.\n\nFast forward spends are also used for vaults. The vault singleton authorizes every coin that belongs to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward lets many spends of the vault singleton sit in the mempool at once. Farmers deduplicate them and rebase them one after another as they create blocks.\n\n### Root causes\n\nCNI found three bugs behind the block creation slowdown:\n\n1. **Fast forward spends are not invalidated when their coin is spent.** They can simply be fast-forwarded to the latest version of the singleton. Instead, they rely on other parts of the spend bundle to get evicted (for example, another coin in the bundle being spent by a block). We missed the case where the only spend in a bundle is a fast forward spend. Such a bundle was not evicted after the singleton was melted.\n\n2. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 30 words, limit 25\">*</mark>*Fast forward spends enter the mempool even if their coin is already spent.** When a block is formed they are fast-forwarded on top of the latest version of the singleton. But we never checked that the singleton still existed. So we accepted spends for singletons that <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer existed.\n\n3. **Fast-forwarding during block creation changed the mempool in place.** When forming a block, fast forward spends were updated to spend the singleton&#x27;s most recent coin. Because this update was done in place, the mempool changed and the fast-forwarded versions were propagated to the rest of the network. Every time a farmer tried to form a block, the mempool item doubled in number.\n\n### How the bugs combined\n\nIf someone submitted a singleton spend eligible for fast forward, on its own with no other spend in the bundle:\n\n* It was treated as valid, entered the mempool, and spread across the network.\n* Every time a farmer made a block, the spend multiplied and the new transactions spread across the network (bug 3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but the spends stayed in the mempool (bug 2). In our case, the mempool was full of these spends when this happened. All of them failed during block creation, so farmers timed out before finding any valid transactions.\n* <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 26 words, limit 25\">Farmers</mark> trying to build a block from the affected mempool hit performance problems and missed the cutoff for their block to be included in the blockchain.\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n* **02-13-2025 11:00 pm** \u2014 Mempool spendbundle count started slowly increasing.\n* **02-14-2025 11:30 am** \u2014 Mempool cost hit max cost.\n* **02-14-2025 1:10 pm** \u2014 Mempool spendbundle count plateaued at ~6200.\n* **02-14-2025 4:45 pm** \u2014 Chia blockchain netspace started decreasing, and timelord-infused blocks per minute dropped noticeably.\n* **02-14-2025 11:00 pm** \u2014 CNI diagnosed the cause and prepared a hotfix release of the Chia blockchain software.\n* **02-15-2025 1:30 am** \u2014 Hotfix build process started.\n* **02-15-2025 3:00 am** \u2014 Hotfix deployment completed as version 2.5.1.\n* **02-19-2025 3:15 pm** \u2014 Version 2.5.2 released, containing the bug fixes for the fast forward issues described above.\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized, with many nodes running different configurations and versions. Because of this, most of the netspace was not affected by the fast forward issues.\n\n**Version 2.5.1** added a workaround: it caps the time spent creating an unfinished block, so the block reaches a timelord in time. Netspace began recovering toward earlier levels after the 2.5.1 release.\n\n**Version 2.5.2** added the real fixes. These invalidated the mempool items created by the fast forward issues, and the mempool cleared of them as users upgraded to 2.5.2:\n\n1. Spend bundles submitted to the mempool that contain only fast forward spends are rejected.\n2. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 33 words, limit 25\">When</mark> a spend is rebased on top of the latest version of the singleton, the mempool item is no longer updated in place, which could <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;have distributed&#x27;; use simple past\">have</mark> distributed the new copy to the network.\n3. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> spend bundles are ingested into the mempool, every spend eligible for fast forward is checked to confirm the latest version of the singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 893, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 875, "weighted": 1.0, "sentences": 71, "cleanSentences": {"clean": 69, "of": 71, "rate": 97.2}, "findings": [{"rule": "PSTE-G8", "message": "phrasal verb 'go through'; use 'read'", "excerpt": "After that, the transactions did not go through, but the mempool did not evict the spends ", "line": 27, "column": 104, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 3058, "token": "go"}, {"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "02-15-2025 3:00 am - The deployment of the hotfix release completed as version 2.5.1.", "line": 46, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 4194, "token": "deployment"}], "html": "# Block creation slowed because of mempool bugs\n\n## Issue summary\n\nA farmer that is eligible to create the next block has a limited time, about 28 seconds. In that time, the farmer ;; use &#x27;read&#x27;\">go</mark> through, but the mempool did not evict the spends (bug 2). In our case, the mempool was full of these spends when this happened. All of these spends failed during block creation. So farmers timed out before they found any valid transaction.\n* A farmer that tried to create a block with the affected mempool items had performance problems. So the farmer missed the cutoff time, and the blockchain did not include the block.\n\n## Timeline\n\nAll times are PST and approximate. The period is 02/13/2025 to 02/19/2025.\n\n02-13-2025 11:00 pm - The count of spend bundles in the mempool started to increase slowly.\n\n02-14-2025 11:30 am - The mempool cost reached the maximum cost.\n\n02-14-2025 1:10 pm - The count of spend bundles in the mempool plateaued at about 6200.\n\n02-14-2025 4:45 pm - The netspace of the Chia blockchain started to decrease. The number of blocks per minute that timelords infused dropped sharply.\n\n02-14-2025 11:00 pm - CNI diagnosed the cause of the issues and prepared a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am - The build process for the hotfix release started.\n\n02-15-2025 3:00 am - The <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of the hotfix release completed as version 2.5.1.\n\n02-19-2025 3:15 pm - CNI released version 2.5.2. It included the bug fixes for the fast-forward issues in the Issue Summary.\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized. Many nodes run different configurations and versions. So the fast-forward issues did not affect most of the netspace.\n\nVersion 2.5.1 of the Chia blockchain contains a workaround. The workaround caps the time to create an unfinished block. This makes sure that the unfinished block reaches a timelord in time. After the release of version 2.5.1, the netspace started to recover toward its previous level.\n\nVersion 2.5.2 included fixes that invalidated the mempool items from the fast-forward issues. As users adopted version 2.5.2, the mempool cleared these items. The fixes:\n\n1. The mempool rejects a spend bundle that contains only fast-forward spends.\n2. When we rebase a spend on top of the latest version of the singleton, we do not update the item in the mempool. An update would risk that the node distributes the new copy to the network.\n3. When the mempool ingests a spend bundle, it checks every spend that is eligible for fast forward. The check makes sure that the latest version of the singleton still exists, with the given puzzle hash.", "factLoss": true, "fidelity": {"source_words": 966, "rewrite_words": 978, "findings": [{"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 9 -> 8, some/most 3 -> 5)."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [], "semanticConfirmed": 0}}, "passes": {"control": {"findings": [8, 10, 8], "passed": 0, "of": 3, "rate": 0, "mean": 8.7}, "pste": {"findings": [2, 1, 2], "passed": 0, "of": 3, "rate": 0, "mean": 1.7}}}, "postmortem-chia-clvm-cost": {"category": "incident report", "title": "Unbound CLVM cost restriction on mempool", "prompt": "", "attribution": "Rewritten from \"Unbound CLVM cost restriction on mempool\" by Chia Network Inc., used under Apache-2.0. Source: https://raw.githubusercontent.com/Chia-Network/post-mortem/main/2023-07/2023-07-21-unbound-CLVM-cost-restriction-on-mempool.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/Chia-Network/post-mortem/main/2023-07/2023-07-21-unbound-CLVM-cost-restriction-on-mempool.md", "author": "Chia Network Inc.", "licence": "Apache-2.0", "licenceUrl": "https://www.apache.org/licenses/LICENSE-2.0", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 376, "weighted": 3.5, "sentences": 20, "cleanSenten te cost exceeded the limit (5.5 billion in this case), the u64 wraps around and effectively removes the cost limit.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 32 words, limit 25\">The</mark> removal of the verification in the mempool code and the chia_rs bug combined allowed for a MempoolItem to have an unbound CLVM cost when the byte cost exceeded the limit.\n\n## Timeline (all times PST)   04/23/2023 - 05/03/2023. All times approximations\n\n04/23/2023 - Mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5` were reported by a community member in keybase.\n\n05/03/2023 - Version 1.8.0 of the Chia blockchain was released with fixes for the mempool code and chia_rs.\n\n\n## Resolution and recovery\n\nThis issue was addressed in 1.8.0 by: \n\nReinstating the mempool verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n\nFixing the cost calculation in chia_rs when the byte cost exceeds the limit.\n\n\nThe issue was present in mainnet and manifested itself by transactions being added to the mempool that exceeded the CLVM cost threshold. These transactions were not added to blocks as consensus checks on CLVM cost disallowed that.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 42 words, limit 25\">Chia</mark> monitored the mempool for these excessive CLVM cost mempool items and found that they were limited in scope and barely exceeded the threshold limit, causing very limited impact on nodes on the network during the time that the mempool allowed them.\n\n\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 342, "weighted": 0.5, "sentences": 27, "cleanSentences": {"clean": 26, "of": 27, "rate": 96.3}, "findings": [{"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "They were limited in scope and only barely exceeded the threshold, so the impact on networ", "line": 33, "column": 55, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2249, "token": "They"}], "html": "# Unbound CLVM cost restriction on mempool\n\n## Issue summary\n\n**Background.** A block&#x27;s transactions are built from one or more spendbundles. A spendbundle spends coins by revealing each coin&#x27;s puzzle and solution. Puzzles and solutions are CLVM code. That code is given a cost based on its size in bytes and its use of operands and conditions. Every node on the network runs this CLVM code, and limits how much resource it can use by enforcing a CLVM cost limit.\n\nConsensus sets the limit for a block with the constant `MAX_BLOCK_COST_CLVM` = 11000000000. Chia&#x27;s default mempool code uses a stricter limit: 0.5 times the consensus limit.\n\n**What went wrong.** Two problems combined:\n\n1. **Missing mempool check.** Earlier versions of the mempool verified that the CLVM cost of a MempoolItem was `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. Version 1.7.1 did not include this check. It was removed because running the MempoolItem as a block generator was assumed to perform the same check, making it redundant.\n\n2. **Bug in chia_rs.** The chia_rs function `run_block_generator()` had a bug: when the byte cost exceeded the limit (5.5 billion in this case), the u64 wrapped around, which effectively removed the cost limit.\n\nTogether, the missing check and the chia_rs bug allowed a MempoolItem to have an unbound CLVM cost whenever its byte cost exceeded the limit.\n\n## Timeline\n\nAll times PST, 04/23/2023 \u2013 05/03/2023. All times are approximate.\n\n- **04/23/2023** \u2014 A community member reported in Keybase that mempool items had costs exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- **05/03/2023** \u2014 Chia blockchain version 1.8.0 was released with fixes to the mempool code and chia_rs.\n\n## Resolution and recovery\n\nVersion 1.8.0 fixed the issue in two ways:\n\n1. Reinstated the mempool check that a MempoolItem&#x27;s CLVM cost must be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. Fixed the chia_rs cost calculation for the case where byte cost exceeds the limit.\n\n**Impact.** The issue was present on mainnet. It showed up as transactions entering the mempool with a CLVM cost above the threshold. These transactions were never added to blocks, because consensus checks on CLVM cost rejected them.\n\nChia monitored the mempool for these high-cost items. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 27 words, limit 25\">They</mark> were limited in scope and only barely exceeded the threshold, so the impact on network nodes was very limited during the period the mempool accepted them.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 393, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 3 conditions, the rewrite 2. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 387, "weighted": 1.0, "sentences": 38, "cleanSentences": {"clean": 36, "of": 38, "rate": 94.7}, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'block generator already performs' over 3 words", "excerpt": "The assumption was that a run of the MempoolItem as a block generator already performs thi", "line": 13, "column": 102, "excerpt_offset": 52, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 1022, "token": "a"}, {"rule": "PSTE-G8", "message": "phrasal verb 'check in'; use 'ask'", "excerpt": "The removal of the check in the mempool code and the chia_rs bug combined.", "line": 17, "column": 20, "excerpt_offset": 19, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1317, "token": "check"}], "html": "# Unbound CLVM cost restriction on the mempool\n\n## Issue summary\n\nA block aggregates its transactions from one or more spendbundles. A spendbundle spends coins. For each coin, the spendbundle reveals the puzzle and the solution of that coin.\n\nThe puzzles and the solutions are CLVM code, and this code has a cost. The cost depends on the bytes of the code and on the use of operands and conditions. Each node on the network runs the CLVM code. A restriction on the CLVM cost limits the resources that the execution can use.\n\nThe default mempool code of Chia restricts the CLVM cost to 0.5 times the consensus restriction. The consensus restriction is the cost that a block allows. The consensus constant is &quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000.\n\nVersion 1.7.1 of the mempool does not include the check that the CLVM cost of a MempoolItem is &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`. Previous versions included this check.\n\nThis check was removed because of an assumption. The assumption was that a run of the MempoolItem as <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;block generator already performs&#x27; over 3 words\">a</mark> block generator already performs this check. That made the check look redundant.\n\nThe chia_rs function `run_block_generator()` contained a bug. If the byte cost exceeded the limit (5.5 billion in this case), the u64 wrapped around. This effectively removed the cost limit.\n\nThe removal of the <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G8: phrasal verb &#x27;check in&#x27;; use &#x27;ask&#x27;\">check</mark> in the mempool code and the chia_rs bug combined. Together they allowed a MempoolItem to have an unbound CLVM cost when the byte cost exceeded the limit.\n\n## Timeline\n\nAll times are PST. The period is 04/23/2023 to 05/03/2023. All times are approximations.\n\n- 04/23/2023: A community member reported in keybase mempool items with a cost that exceeded `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- 05/03/2023: Chia released version 1.8.0 of the Chia blockchain. This version fixes the mempool code and chia_rs.\n\n## Resolution and recovery\n\nVersion 1.8.0 fixed this issue in two ways:\n\n1. It reinstated the mempool check that the CLVM cost of a MempoolItem is &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. It fixed the cost calculation in chia_rs when the byte cost exceeds the limit.\n\nThe issue was present on mainnet. The mempool accepted transactions that exceeded the CLVM cost threshold. The consensus checks on the CLVM cost stopped these transactions from entering blocks.\n\nChia monitored the mempool for these items with an excessive CLVM cost. Chia found that these items were limited in scope and that they barely exceeded the threshold limit. The impact on the nodes on the network was very limited during the time that the mempool allowed these items.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 430, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste_fixed": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 384, "weighted": 0, "sentences": 38, "cleanSentences": {"clean": 38, "of": 38, "rate": 100.0}, "findings": [], "html": "# Unbound CLVM cost restriction on the mempool\n\n## Issue summary\n\nA block aggregates its transactions from one or more spendbundles. A spendbundle spends coins. Per coin, the spendbundle reveals the puzzle and the solution of that coin.\n\nThe puzzles and the solutions are CLVM code, and this code has a cost. The cost depends on the bytes of the code and on the use of operands and conditions. Each node on the network runs the CLVM code. A restriction on the CLVM cost limits the resources that the execution can use.\n\nThe default mempool code of Chia restricts the CLVM cost to 0.5 times the consensus restriction. The consensus restriction is the cost that a block allows. The consensus constant is &quot;MAX_BLOCK_COST_C =\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not attempt to\nrestore instances of etcd. Instead, follow these steps to restore etcd:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`,\n`kube-controller-manager`, `kubelet`) to ensure that they <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on some\nstale data. In practice the restore takes a bit of time.  During the\nrestoration, critical components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.minor](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be present. It can\neither be a snapshot file from a previous backup operation, or from a remaining\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** since etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to utilize [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured accordingly. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> the majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan be scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 442, "weighted": 1.0, "sentences": 34, "cleanSentences": {"clean": 32, "of": 34, "rate": 94.1}, "findings": [{"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "When restoring the cluster with [ CODE    ]( URL                                          ", "line": 17, "column": 169, "excerpt_offset": 168, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 1254, "token": "should"}, {"rule": "PSTE-P1", "message": "'you must' is not the imperative form; write the instruction as a command", "excerpt": "If the access URLs of the restored cluster differ from the previous cluster, you must reco", "line": 49, "column": 76, "excerpt_offset": 75, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 2683, "token": ","}], "html": "## Restoring an etcd cluster\n\nDo not restore etcd instances while any API servers are running in your cluster. Instead, restore etcd in this order:\n\n1. Stop *all* API server instances.\n2. Restore state in all etcd instances.\n3. Restart all API server instances.\n\nThe Kubernetes project also recommends restarting the Kubernetes components (`kube-scheduler`, `kube-controller-manager`, `kubelet`) so they do not rely on stale data. In practice, the restore takes a bit of time. During the restoration, critical components will lose their leader lock and restart themselves.\n\netcd supports restoring from snapshots taken by an etcd process of the same [major.minor](https://semver.org/) version. Restoring from a different patch version of etcd is also supported. A restore operation is used to recover the data of a failed cluster.\n\nBefore you start the restore, you need a snapshot file. This can be either a snapshot file from a previous backup operation, or a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n### Restoring with `etcdutl`\n\nWhen restoring the cluster with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use the `--data-dir` option to specify the folder the cluster <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be restored into:\n\n```shell\netcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nHere, `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n### Restoring with `etcdctl` (deprecated)\n\nUsing `etcdctl` for restores has been **deprecated** since etcd v3.5.x and is slated for removal in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\nFor reference, this is how `etcdctl` is used for a restore:\n\n```shell\nexport ETCDCTL_API=3\netcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\n### Choosing the data directory\n\nIf `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster.\n\nOtherwise, change the etcd configuration and restart the etcd process after the restore so it uses the new data directory:\n\n1. In `/etc/kubernetes/manifests/etcd.yaml`, change `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`.\n2. Run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\nFor more information and examples on restoring a cluster from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n### Updating API server addresses\n\nIf the access URLs of the restored cluster differ from the previous cluster<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">,</mark> you must reconfigure the Kubernetes API server to match. In this case, restart the Kubernetes API servers with the flag `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you might need to update the load balancer instead.\n\n### When the cluster is considered failed\n\nIf the majority of etcd members have permanently failed, the etcd cluster is considered failed. In this scenario, Kubernetes cannot make any changes to its current state. Already-scheduled pods might continue to run, but no new pods can be scheduled. To fix this, recover the etcd cluster and, if needed, reconfigure the Kubernetes API servers.\n\n## Upgrading etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details on upgrading etcd, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.", "factLoss": false, "fidelity": {"source_words": 595, "rewrite_words": 593, "findin
