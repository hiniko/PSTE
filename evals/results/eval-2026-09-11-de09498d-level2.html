 https://raw.githubusercontent.com/borgbackup/borg/master/docs/quickstart.rst\ngrounding_licence: BSD-3-Clause\nquestion: |\n  Write a documentation page for the backup and restore quickstart workflow in BorgBackup. A copy of an upstream page for this topic is mounted at /grounding/synth-borg-quickstart.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# BorgBackup: Backup and Restore Quickstart\n\nBorgBackup (`borg`) is a deduplicating backup tool. It splits your files into chunks, stores each unique chunk only once in a repository, and can encrypt everything on your machine before it leaves. This guide covers the core workflow: create a repository, make a backup, see what you have, and restore files when needed.\n\n## The two core concepts\n\n- **Repository** \u2014 a store of encrypted, deduplicated chunks, plus the metadata Borg needs to rebuild them into files. A repository can be on local disk (an external drive, a mounted volume) or on a remote host over SSH.\n- **Archive** \u2014 one backup run, made with `borg create`. Each archive is a full snapshot of the paths you backed up at that moment. Under the hood it only stores new chunks<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> unchanged data is referenced again. So you get what looks like many complete backups, but only pay disk space for the changes.\n\n## 1. Create a repository\n\nBefore you back anything up, create a repository:\n\n```bash\nborg repo-create --encryption=repokey-blake2-aes-ocb -r /path/to/repo\n```\n\nChoose an encryption mode now. You cannot change it later without creating a new repository.\n\n- `repokey` modes store the key inside the repository. Convenient, and <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;easiest&#x27;\">easiest</mark> to recover from.\n- `keyfile` modes keep the key in your home directory. Useful if you do not want the key stored next to the encrypted data.\n- `--encryption=none` skips encryption. Almost everyone <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> encrypt, unless the storage is already trusted and access-controlled.\n\nTo avoid typing `-r /path/to/repo` on every command, set it once:\n\n```bash\nexport BORG_REPO=/path/to/repo\n```\n\n## 2. Make a backup\n\n```bash\nborg create --stats --progress &#x27;{hostname}-{now}&#x27; ~/Documents ~/Projects\n```\n\n`{hostname}` and `{now}` are placeholders that Borg fills in for you. Running this same command again creates a new archive with a unique name each time, with no extra work on your part.\n\n- `--stats` shows how much data was added and how much was deduplicated.\n- `--progress` shows a live indicator during long runs.\n\nBoth are optional, but useful the first few times.\n\nSet compression explicitly rather than relying on defaults:\n\n```bash\nborg create --compression zstd,6 &#x27;{hostname}-{now}&#x27; ~/Documents\n```\n\n- `lz4` is the <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;fastest&#x27;\">fastest</mark>. Fine for data that is already compressed (media files, archives).\n- `zstd` at a moderate level (3\u201310) is a good general-purpose choice.\n- `auto,zstd,N` tests each chunk cheaply with lz4 first, and only uses zstd when it looks worthwhile.\n\nCompression matters more than you might expect for remote backups. It directly reduces how much data goes over the network.\n\n## 3. See what you&#x27;ve backed up\n\n```bash\nborg repo-list                  # list all archives in the repository\nborg list aid:d34db33f          # list files inside one archive\n```\n\nYou refer to an archive by its archive ID (or a unique prefix of it, as above) or by its name. When you need to restore something and do not know which archive to use, start with `borg repo-list`.\n\n## 4. Restore files\n\nThere are two ways to get data back. Which one to use depends on how sure you are about what you need.\n\n**`borg mount`** <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> mounts a repository or archive as a FUSE filesystem, so you can browse it like a normal directory. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N1: instruction is 24 words, limit 20\">Use</mark> this when you are not sure which archive has <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;file version you want&#x27; over 3 words\">the</mark> file version you want, or when you want to look around before restoring:\n\n```bash\nmkdir /mnt/borg\nborg mount -a aid:d34db33f /mnt/borg\n# browse /mnt/borg in another terminal, copy out what you need\nborg umount /mnt/borg\n```\n\n**`borg extract`** <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> pulls files straight out of a known archive into your current directory. It is faster, and restores metadata (ACLs, special filesystem flags) more faithfully than a FUSE mount can. Use this once you know exactly what you want:\n\n```bash\nmkdir restore &amp;&amp; cd restore\nborg extract aid:d34db33f path/to/file   # restore just one path (no leading /)\nborg extract aid:d34db33f                # or restore the whole archive\n```\n\n`borg extract` always writes into the current directory, and expects that directory to be empty. It will not merge a restore into an existing tree.\n\nRestores go most smoothly on the same machine and under the same user account that made the backup. This avoids surprises with path layout, and with usernames or groups that do not match the IDs your files were saved with. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 29 words, limit 25\">If</mark> the repository is encrypted and the key is in `keyfile` mode rather than `repokey` mode, make sure you have both the keyfile and its passphrase before you start. Without them, the data cannot be recovered. That is by design.\n\n## Keeping backups working long-term\n\nIf you plan to rely on your backups, a few things matter:\n\n- **Free disk space.** Borg needs spare space to work, including to delete old archives. If the repository&#x27;s filesystem fills to zero, you may not be able to free space at all. Keep a comfortable margin, and check it whenever you review your backup logs.\n- **Consistent user/permissions.** Always access a given repository as the same user. Back up as root if you need root-owned or multi-user files<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> otherwise use your normal account. For remote repositories, the SSH login already fixes the effective user, so this matters less there.\n- **File consistency during the backup.** Borg reads files as it finds them. It does not take snapshots for you. For a quiet home directory this is rarely a problem. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 30 words, limit 25\">For</mark> databases, VMs, or containers that are actively writing, stop the service, use its own consistent dump or snapshot feature, or snapshot the underlying filesystem (LVM, ZFS) before backing up.\n- **Prune and compact regularly.** `borg create` only adds archives. It never removes them. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N1: instruction is 24 words, limit 20\">Run</mark> `borg prune` on a schedule to drop old archives according to a retention policy, then run `borg compact` to actually reclaim the space `prune` freed:\n\n  ```bash\n  borg prune &#x27;{hostname}&#x27; --keep-daily 7 --keep-weekly 4 --keep-monthly 6\n  borg compact\n  ```\n\n## Automating it\n\nFor unattended backups, set the passphrase with an environment variable instead of typing it:\n\n```bash\nexport BORG_PASSPHRASE=&#x27;a long and secure passphrase&#x27;\n# or, better for scripts checked into anywhere: delegate to a password manager\nexport BORG_PASSCOMMAND=&#x27;pass show backup&#x27;\n```\n\nAlways `export` the variable so subprocesses, including Borg, inherit it. Use single quotes so your shell does not interpret special characters. Note that `sudo` does not pass your environment through by default. A script run with `sudo` will not see a `BORG_PASSPHRASE` you exported earlier unless `env_keep` is configured for it in `sudoers`.\n\nA minimal cron-friendly script puts this together: run `borg create`, then `borg prune`, then `borg compact`. Check the exit code after each step so any failure <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G1: passive voice &#x27;is reported&#x27;; name the actor\">is</mark> reported instead of silently ignored.\n\n## Remote repositories\n\nIf Borg is installed on the remote host, use a `rest://` URL. Borg connects over SSH and runs `borg serve --rest` on the other end:\n\n```bash\nborg -r rest://user@hostname:port/path/to/repo repo-create --encryption=repokey-blake2-aes-ocb\nborg -r rest://user@hostname:port/path/to/repo create &#x27;{hostname}-{now}&#x27; ~/Documents\n```\n\nRestoring from a remote repository works the same way. Just use the `rest://` URL instead of a local path:\n\n```bash\nborg -r rest://user@hostname:port/path/to/repo mount /mnt/borg\nborg -r rest://user@hostname:port/path/to/repo extract aid:d34db33f\n```\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 27 words, limit 25\">If</mark> you cannot install Borg on the remote side, you can mount the remote filesystem locally (for example with `sshfs`) and point Borg at the mount point. This wor ve is one backup run. You create it with `borg create`. Each archive is a full snapshot of the paths that you backed up at that point in time. Under the hood, Borg stores only the new chunks. It references the unchanged data again. The result feels like many complete backups, but you pay disk space only for the deltas.\n\n## 1. Create a repository\n\nBefore you back up anything, create a repository:\n\n```bash\nborg repo-create --encryption=repokey-blake2-aes-ocb -r /path/to/repo\n```\n\nChoose an encryption mode now. You cannot change it later without a new repository. The `repokey` modes store the encryption key inside the repository. This is convenient, and it is the <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V9: marketing adjective &#x27;easiest&#x27;\">easiest</mark> mode to recover from. The `keyfile` modes keep the key in your home directory instead. Use them if you do not want the key next to the encrypted data.\n\nIf you do not need encryption, `--encryption=none` skips it. But almost everyone needs encryption. Skip it only when the storage is already trusted and access-controlled.\n\nTo avoid `-r /path/to/repo` on every command, export it once:\n\n```bash\nexport BORG_REPO=/path/to/repo\n```\n\n## 2. Make a backup\n\n```bash\nborg create --stats --progress &#x27;{hostname}-{now}&#x27; ~/Documents ~/Projects\n```\n\nBorg expands the placeholders `{hostname}` and `{now}`. So each run of this exact command makes a new archive with a unique name. You do not need extra bookkeeping. `--stats` prints how much data Borg added and how much it deduplicated. `--progress` shows a live indicator during a long run. Both flags are optional, but they help the first few times you run this.\n\nSet the compression explicitly. Do not rely on the defaults:\n\n```bash\nborg create --compression zstd,6 &#x27;{hostname}-{now}&#x27; ~/Documents\n```\n\n`lz4` is the <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;fastest&#x27;\">fastest</mark> option. It is fine for data that is already compressed (media files, archives). `zstd` at a moderate level (<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">3</mark>\u201310) is a good general choice. `auto,zstd,N` probes each chunk cheaply with lz4 first. It pays the cost of zstd only when that looks worthwhile. Compression matters more than it sounds for remote backups, because it directly cuts how much data goes over the network.\n\n## 3. See what you backed up\n\n```bash\nborg repo-list                  # list all archives in the repository\nborg list aid:d34db33f          # list files inside one archive\n```\n\nYou refer to an archive by its archive ID, by a unique prefix of the ID (as shown above), or by its name. Start with `borg repo-list` any time you need to restore something and do not yet know which archive to target.\n\n## 4. Restore files\n\nThere are two ways to get data back out. Which one you want depends on how sure you are about what you need.\n\n**`borg mount`** mounts a repository or an archive as a FUSE filesystem. You can then browse it like any other directory. Use this when you are not sure which archive holds the version of a file that you want. Also use it when you want to look around before you commit to a restore:\n\n```bash\nmkdir /mnt/borg\nborg mount -a aid:d34db33f /mnt/borg\n# browse /mnt/borg in another terminal, copy out what you need\nborg umount /mnt/borg\n```\n\n**`borg extract`** pulls files directly out of a known archive into your current directory. It is faster than a FUSE mount. It also restores metadata (ACLs, special filesystem flags) more faithfully than a FUSE mount can. Use this once you know exactly what you want:\n\n```bash\nmkdir restore &amp;&amp; cd restore\nborg extract aid:d34db33f path/to/file   # restore just one path (no leading /)\nborg extract aid:d34db33f                # or restore the whole archive\n```\n\n`borg extract` always writes into the current directory. It expects that directory to be empty. It does not merge a restore into an existing tree.\n\nA restore goes most smoothly on the same machine and under the same user account that made the backup. This avoids surprises with the path layout. It also avoids surprises when usernames and groups do not map to the IDs that your files were saved with. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 30 words, limit 25\">If</mark> you restore an encrypted repository and the key is in `keyfile` mode rather than `repokey` mode, make sure you have both the keyfile and its passphrase before you start. Without them, the data is unrecoverable by design.\n\n## Keep backups working long-term\n\nA few things matter for backups that you intend to rely on:\n\n- **Free disk space.** Borg needs headroom to operate. It also needs headroom to delete old archives. If the filesystem of a repository runs to zero, you can lose the ability to free space at all. Keep a comfortable margin. Check it as part of whatever process reviews your backup logs.\n- **Consistent user and permissions.** Always access a given repository as the same user. If you need root-owned or multi-user files, back up as root. Otherwise, use your normal account. For a remote repository, the SSH login already fixes the effective user, so this matters less there.\n- **File consistency during the backup.** Borg reads files as it meets them. It does not snapshot anything for you. For a quiet home directory, this is rarely a problem. For a database, a VM, or a container that writes actively, do one of these before you back up: stop the service, use its own consistent dump or snapshot mechanism, or snapshot the underlying filesystem (LVM, ZFS).\n- **Prune and compact regularly.** `borg create` alone only adds archives. It never removes them. Run `borg prune` on a schedule to drop old archives per a retention policy. Then run `borg compact` to reclaim the space that `prune` freed:\n\n  ```bash\n  borg prune &#x27;{hostname}&#x27; --keep-daily 7 --keep-weekly 4 --keep-monthly 6\n  borg compact\n  ```\n\n## Automate it\n\nFor unattended backups, set the passphrase in an environment variable. Do not type it interactively:\n\n```bash\nexport BORG_PASSPHRASE=&#x27;a long and secure passphrase&#x27;\n# or, better for scripts checked into anywhere: delegate to a password manager\nexport BORG_PASSCOMMAND=&#x27;pass show backup&#x27;\n```\n\nAlways `export` the variable, so that subprocesses, including Borg, inherit it. Put single quotes around the value, so that your shell does not interpret special characters. `sudo` does not pass your environment through by default. A script that runs via `sudo` does not see a `BORG_PASSPHRASE` that you exported before, unless `env_keep` in `sudoers` is configured for it.\n\nA minimal script that suits cron ties this together:\n\n1. Run `borg create`.\n2. Run `borg prune`.\n3. Run `borg compact`.\n\nCheck the exit code after each step, so that the script reports a failure anywhere instead of silently ignoring it.\n\n## Remote repositories\n\nIf Borg is installed on the remote host, use a `rest://` URL. Borg connects over SSH and runs `borg serve --rest` on the other end:\n\n```bash\nborg -r rest://user@hostname:port/path/to/repo repo-create --encryption=repokey-blake2-aes-ocb\nborg -r rest://user@hostname:port/path/to/repo create &#x27;{hostname}-{now}&#x27; ~/Documents\n```\n\nA restore from a remote repository works the same way. Use the `rest://` URL in place of a local path:\n\n```bash\nborg -r rest://user@hostname:port/path/to/repo mount /mnt/borg\nborg -r rest://user@hostname:port/path/to/repo extract aid:d34db33f\n```\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 27 words, limit 25\">If</mark> you cannot install Borg on the remote side, you can mount the remote filesystem locally (for example, with `sshfs`) and point Borg at the mount point. This depends on how well the back out of its time series database. You use it everywhere: in the expression browser, in Grafana panels, in alerting rules, and in recording rules. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 34 words, limit 25\">This</mark> page covers the core concepts you need before writing your own queries <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> what a query returns, how time series are selected and filtered, and a handful of syntax details that trip people up.\n\n## Instant queries vs. range queries\n\nEvery PromQL expression can be evaluated in two ways:\n\n- **Instant query** \u2014 evaluated at a single point in time, producing one value per matching series. This is what powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start and end time, producing a series of points you can plot. This powers the &quot;Graph&quot; view.\n\nThe language itself <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> change between the two modes <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a range query is just an instant query run over and over at different timestamps. Anything other than the built-in UI (dashboards, scripts, custom tooling) typically fetches these results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any sub-expression) always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, no labels attached |\n| **String** | A string value (rarely used in practice today) |\n\nNot every context accepts every type. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 34 words, limit 25\">Instant</mark> queries will accept any of the four as a final result<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> range queries only accept scalars and instant vectors as the top-level result <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> graph a range vector or a string directly.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Samples</mark> themselves come in two flavors: ordinary **float** samples (a plain number) and **native histogram** samples (a full histogram with count, sum, and bucket data bundled into one sample). A single vector can contain a mix of both kinds. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 32 words, limit 25\">Native</mark> histograms know whether <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> a counter or a gauge, so Prometheus can warn you if you apply the wrong kind of function to them (<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., `rate()` on a gauge histogram). <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 26 words, limit 25\">Ordinary</mark> float samples <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> carry that flavor information <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Prometheus <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> stop you from calling `rate()` on a float gauge, even though the result will be meaningless. This is why counter metrics conventionally end in `_total`: <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a naming convention to help humans (and dashboards) avoid that mistake, not something PromQL enforces.\n\nOne more terminology note: a &quot;classic histogram&quot; <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is just three ordinary float series to PromQL. There&#x27;s no such thing as a &quot;classic histogram sample&quot;<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> only native histograms produce histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> possible query is just a metric name:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> returns one sample per series carrying that metric name <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> specifically, the most recent sample at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` scoped to a `job` label of `prometheus` and a `group` label of `canary` returns only series matching both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA subtlety worth knowing: <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series that have that label explicitly set to empty *and* series that <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have the label at all. <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N2: description is 38 words, limit 25\">You</mark> can also repeat a matcher on the same label name <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> all of them have to pass for the series to be selected (<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., excluding one specific value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 37 words, limit 25\">Because</mark> a selector made up of only regex matchers could otherwise match every series in the database, Prometheus requires that a selector contain a metric name or at least one matcher that <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> match an empty value. <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> selector with nothing but a wildcard-style regex on a single label is rejected<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character in that regex makes it valid.\n\n<mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N2: description is 47 words, limit 25\">Under</mark> the hood, the metric name is really just a label called `__name__`, so writing the metric name bare is equivalent to matching `__name__` directly <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> and you can use non-`=` operators against it too, which lets you match every metric whose name starts with a given prefix. One quirk from this: <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: description is 30 words, limit 25\">a</mark> few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> use them bare as a metric name<mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> matching them via `__name__` explicitly is the workaround.\n\n### Range vector selectors\n\nAppend a duration in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not just the latest one. The window is left-open, right-closed <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a sample sitting exactly on the start boundary is excluded, one sitting exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` rather than displayed directly.\n\n## Durations\n\nTime durations are written as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nUnits can be chained as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N2: description is 34 words, limit 25\"> </mark>Under the hood a duration is really just a float literal in seconds<mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but you can only suffix a *decimal integer*, so `1.5h` and hex numbers with unit suffixes<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\"> </mark>aren&#x27;t valid.\n\n<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">You</mark> can also build a duration with arithmetic, anywhere a duration is expected (range vector brackets, `offset`): multiplying `5m` by `2` gives a 10-minute window<mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term gets used. There are also a few helper functions usable inside duration expressions: <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N2: description is 26 words, limit 25\">`</mark>step()` (the range-query step width, `0s` for instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clamping<mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014<mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\"> </mark>e.g. `max_of(step(), 5s)` never lets the duration drop below 5 seconds. Duration expression<mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">s</mark> aren&#x27;t allowed inside the `@` modifier, though.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago. <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines naturally with functions <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `http_requests_total @ 1609746000`.<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-N2: description is 36 words, limit 25\"> </mark>`start()` and `end()` are handy special values her<mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">e</mark> \u2014 fo<mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">r</mark> a range query they resolve to the query&#x27;s start/end and stay fixed across every st<mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-X1: semicolon; write two sentences\">ep</mark>; for an instant query both just resolve to the evaluation time.\n\nThe one rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N2: description is 29 words, limit 25\">Wrapping</mark> the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct<mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> matter <mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\n<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-N2: description is 46 words, limit 25\">A</mark> subquery lets you run what is effectively an instant-query expression repeatedly over a range, turning it into a range vector <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> useful when you want to apply a range-vector function (like `max_over_time`) on top of something that&#x27;s already a rate or other computed expression, <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. wrapping `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional and defaults to the global evaluation interval if omitted.\n\n## Everything else, briefly\n\n- <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Operators** (`+`, `and`, `on`, `group_left`, <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) are where most of PromQL&#x27;s actual power lives \u2014 worth a dedicated read once <mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. <mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-N2: description is 27 words, limit 25\">Single</mark>/double-quoted strings follow Go&#x27;s escaping rules (backslash escapes plus octal/hex escapes)<mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> backtick strings are raw \u2014 no escape processing, and newlines inside them are preserved as-is.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators for readability (<mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `1_000_000`).\n\n## Two gotchas worth knowing up front\n\n<mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-N2: description is 55 words, limit 25\">*</mark>*Staleness.** Because a query samples at fixed timestamps that <mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> necessarily <mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</m "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 11133, "token": "*"}, {"rule": "PSTE-N2", "message": "description is 37 words, limit 25", "excerpt": "The policy also specifically flags  CODE  -style curly-brace label matchers as suspicious ", "line": 149, "column": 183, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 12007, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "If you want this as an actual       file, you can copy the text above, or let me know if t", "line": 149, "column": 421, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "weight": 0.5, "offset": 12245, "token": "If"}], "html": "---\nmodel: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-09-11\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\ngrounding_url: https://raw.githubusercontent.com/prometheus/prometheus/main/docs/querying/basics.md\ngrounding_licence: Apache-2.0\nquestion: |\n  Write a documentation page for the basics of its query language, PromQL in Prometheus. A copy of an upstream page for this topic is mounted at /grounding/synth-prometheus-query-basics.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# PromQL Basics\n\nPromQL (Prometheus Query Language) is how Prometheus reads data back out of its time series database. You use it in the expression browser, in Grafana panels, in alerting rules, and in recording rules. This page covers the core ideas you need before writing your own queries: what a query returns, how to select and filter time series, and a few syntax details that often trip people up.\n\n## Instant queries vs. range queries\n\nYou can evaluate any PromQL expression in two ways:\n\n- **Instant query** \u2014 evaluated at one point in time. Gives one value per matching series. This powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated again&#x27; over 3 words\">the</mark> same expression evaluated again and again at fixed steps between a start time and an end time. Gives a series of points you can plot. This powers the &quot;Graph&quot; view.\n\nThe language is the same in both modes. A range query is just an instant query run repeatedly at different timestamps. Anything other than the built-in UI (dashboards, scripts, custom tools) usually fetches results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any part of one) always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, with no labels |\n| **String** | A string value (rarely used in practice today) |\n\nNot every context accepts every type. An instant query accepts any of the four as its final result. A range query only accepts scalars and instant vectors as the top-level result. You cannot graph a range vector or a string directly.\n\nSamples come in two kinds:\n\n- **Float** samples \u2014 a plain number.\n- **Native histogram** samples \u2014 a full histogram with count, sum, and bucket data bundled into one sample.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">A</mark> single vector can contain both kinds. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 33 words, limit 25\">Native</mark> histograms know whether they are a counter or a gauge, so Prometheus can warn you if you apply the wrong kind of function to them (for example, `rate()` on a gauge histogram). Float samples do not carry that information. Prometheus cannot stop you from calling `rate()` on a float gauge, even though the result is meaningless. This is why counter metrics usually end in `_total`. It is a naming convention to help humans (and dashboards) avoid the mistake. PromQL does not enforce it.\n\nOne more term to know: a &quot;classic histogram&quot; is the `_bucket`/`_count`/`_sum` trio of plain metrics. To PromQL, that is just three ordinary float series. There is no such thing as a &quot;classic histogram sample&quot;. Only native histograms produce histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a metric name on its own:\n\n```\nhttp_requests_total\n```\n\nThis returns one sample per series with that metric name. The sample is the most recent one at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow the result, add label matchers in curly braces after the metric name. For example, a query for `http_requests_total` limited to a `job` label of `prometheus` and a `group` label of `canary` returns only series that match both.\n\nThere are four matcher operators:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored. A `=~` match against `foo` behaves like `^foo$`, not a substring search. The regex flavor is RE2.\n\nTwo subtleties:\n\n- <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> matcher against an empty string matches series where that label is explicitly set to empty *and* series that do not have the label at all.\n- You can repeat a matcher on the same label name. All of them must pass for the series to be selected. For example, you can exclude one specific value while regex-matching a broader pattern on the same label.\n\nA selector made only of regex matchers could match every series in the database. To prevent this, Prometheus requires a selector to contain a metric name or at least one matcher that cannot match an empty value. A selector with nothing but a wildcard-style regex on a single label is rejected. Requiring at least one non-empty character in that regex makes it valid.\n\nUnder the hood, the metric name is really a label called `__name__`. Writing the metric name bare is the same as matching `__name__` directly. You can use non-`=` operators against `__name__` too, which lets you match every metric whose name starts with a given prefix. One quirk: a few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you cannot use them bare as a metric name. The workaround is to match them via `__name__` explicitly.\n\n### Range vector selectors\n\nAdd a duration in square brackets to get a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**. For every matching series you get all samples from the last 5 minutes, not just the latest one. The window is left-open, right-closed: a sample sitting exactly on the start boundary is excluded, and one sitting exactly on the end boundary is included. Range vectors are mostly fed into functions like `rate()`, `increase()`, and `avg_over_time()` rather than displayed directly.\n\n## Durations\n\nA duration is a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nYou can chain units as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`. Under the hood, a duration is just a float literal in seconds. `1s` is `1` and `1ms` is `0.001`. But you can only put a unit suffix on a *decimal integer*, so `1.5h` and hex numbers with unit suffixes are not valid.\n\nYou can also build a duration with arithmetic anywhere a duration is expected (range vector brackets, `offset`). Multiplying `5m` by `2` gives a 10-minute window. Dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;is used&#x27;; name the actor\">is</mark> used.\n\nA few helper functions work inside duration expressions:\n\n- `step()` \u2014 the range-query step width (`0s` for instant queries)\n- `range()` \u2014 end minus start of a range query (`0s` for instant queries)\n- `min_of()` / `max_of()` \u2014 for clamping. For example, `max_of(step(), 5s)` never lets the duration drop below 5 seconds.\n\nDuration expressions are not allowed inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Adding `offset 5m` to a selector returns what the value was 5 minutes ago. It works on range vectors too, and combines with functions. For example, combining a `[5m]` range with `offset 1w` gives you the 5-minute rate as it looked a week ago. A negative offset looks forward instead of back. This is sometimes useful for comparing against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, for example `http_requests_total @ 1609746000`. `start()` and `end()` are handy special values here. For<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\"> </mark>a range query they resolve to the query&#x27;s start and end and stay fixed across every step. For an instant query both resolve to the evaluation time.\n\nThe one rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. Putting the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct. Putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\nYou can combine `offset` and `@` on the same selector. Order does not matter. The offset is always applied relative to the `@` time.\n\n## Subqueries\n\nA subquery runs what is effectively an instant-query expression repeatedly over a range, turning it into a range vector. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> is useful when you want to apply a range-vector function (like `max_over_time`) on top of something that is already a rate or another computed expression. For example, wrapping `rate(metric[5m])` in a further `[30m:1m]` window gets the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional. If you leave it out, it defaults to the global evaluation interval.\n\n## Everything else, briefly\n\n- **Operators** (`+`, `and`, `on`, `group_left`, <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) are where most of PromQL&#x27;s real power lives. They are worth a dedicated read once you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. Single- and double-quoted strings follow Go&#x27;s escaping rules (backslash escapes plus octal/hex escapes). Backtick strings are raw: no escape processing, and newlines inside them are kept as-is.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators for readability (for example `1_000_000`).\n\n## Two gotchas worth knowing up front\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">*</mark>*Staleness.** A query samples at fixed timestamps that do not always <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with when data was actually scraped. So Prometheus has to decide what value to report at each timestamp. It uses the newest sample that is less than the *lookback period* old. The lookback period is 5 minutes by default. You can tune it with the `--query.lookback-delta` flag or a per-query `lookback_delta` parameter. If a target stops being scraped or disappears, its series is marked stale. Once a query&#x27;s evaluation timestamp is past that staleness point, the series simply stops appearing in results. This is why <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N5: multi-word noun &#x27;graph line visibly ends&#x27; over 3 words\">a</mark> graph line visibly ends instead of flatlining forever.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">*</mark>*Performance.** A bare metric name selector can silently expand into thousands of series if the metric is high-cardinality. Any aggregation over that many series costs real work on the server, even if the final output is a single number. It is much like summing a huge column in a SQL database: not free just bec  queries. It explains what a query returns, how you select and filter time series, and some syntax details that confuse people.\n\n## Instant queries and range queries\n\nPrometheus can evaluate every PromQL expression in two ways:\n\n- **Instant query** \u2014 Prometheus evaluates the expression at one point in time. The result holds one value per matching series. This query type powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 Prometheus evaluates <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;same expression many times&#x27; over 3 words\">the</mark> same expression many times, at fixed steps between a start time and an end time. The result is a series of points that you can plot. This query type powers the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is an instant query that Prometheus runs many times at different timestamps. Tools other than the built-in UI, such as dashboards, scripts, and custom tools, usually fetch these results over the HTTP API of Prometheus.\n\n## What a query evaluates to\n\nAn expression, or any sub-expression, always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series. Each series has exactly one sample. All samples share the same timestamp. |\n| **Range vector** | A set of series. Each series has a window of samples over time. |\n| **Scalar** | One floating-point number with no labels. |\n| **String** | A string value. Queries rarely use this type today. |\n\nNot every context accepts every type. An instant query accepts any of the four types as its final result. A range query accepts only a scalar or an instant vector as its top-level result. You cannot graph a range vector or a string directly.\n\nSamples come in two kinds. A **float** sample is a plain number. A **native histogram** sample is a full histogram. It bundles the count, the sum, and the bucket data into one sample. One vector can hold a mix of both kinds.\n\nA native histogram knows whether it is a counter or a gauge. So Prometheus can warn you when you apply the wrong kind of function to it, for example `rate()` on a gauge histogram. A float sample does not carry that information. Prometheus cannot stop you when you call `rate()` on a float gauge, and the result is meaningless.\n\nFor this reason, the name of a counter metric ends in `_total` by convention. The convention helps humans and dashboards avoid that mistake. PromQL does not enforce it.\n\nA &quot;classic histogram&quot; is the set of three plain metrics `_bucket`, `_count`, and `_sum`. To PromQL, it is three ordinary float series. There is no &quot;classic histogram sample&quot;. Only a native histogram produces a sample of histogram type.\n\n## How to select time series\n\n### Instant vector selectors\n\nThe <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a metric name:\n\n```\nhttp_requests_total\n```\n\nThis query returns one sample for each series that carries that metric name. The sample is the most recent one at or before the evaluation time of the query. The staleness rules below also apply.\n\nTo narrow the result, add label matchers in curly braces after the metric name. For example, take a query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary`. It returns only the series that match both labels.\n\nPromQL has four matcher operators:\n\n| Operator | Meaning |\n|---|---|\n| `=` | The label equals this string. |\n| `!=` | The label does not equal this string. |\n| `=~` | The label matches this regex. |\n| `!~` | The label does not match this regex. |\n\nPromQL always anchors a regex match fully. A `=~` match against `foo` behaves as `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA matcher for an empty string on a label matches two sets of series: the series that set that label to an empty value, and the series that do not have the label at all. You can also repeat a matcher on the same label name. The selector returns a series only when every matcher on it passes. For example, you can exclude one specific value and also match a broader regex pattern on the same label.\n\nA selector that holds only regex matchers could match every series in the database. So Prometheus needs a selector to contain a metric name or at least one matcher that cannot match an empty value. Prometheus rejects a selector that has nothing but a wildcard regex on a single label. If that regex needs at least one non-empty character, the selector is valid.\n\nInternally, the metric name is a label called `__name__`. A bare metric name is the same as a direct match on `__name__`. You can also use the other operators on `__name__`, not only `=`. This lets you match every metric whose name starts with a given prefix.\n\nA few words are reserved as operator keywords: `bool`, `on`, `ignoring`, `group_left`, and `group_right`. You cannot use these words bare as a metric name. The workaround is an explicit match on `__name__`.\n\n### Range vector selectors\n\nTo get a window of history instead of a single point, append a duration in square brackets:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**. For every matching series, you get all the samples from the last 5 minutes, not only the latest one. The window is left-open and right-closed. The window excludes a sample that sits exactly on the start boundary, and it includes a sample that sits exactly on the end boundary. Functions such as `rate()`, `increase()`, and `avg_over_time()` consume most range vectors. You rarely show a range vector directly.\n\n## Durations\n\nYou write a time duration as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">You</mark> can chain units if they go from largest to smallest and each unit appears once. Examples: `1h30m`, `12h34m56s`. Internally, a duration is a float literal in seconds. `1s` is `1`, and `1ms` is `0.001`. But you can only add a unit suffix to a *decimal integer*. So `1.5h` is not valid, and a hex number with a unit suffix is not valid.\n\nYou can also build a duration with arithmetic anywhere that PromQL expects a duration, such as the brackets of a range vector and `offset`. For example, `5m` multiplied by `2` gives a 10-minute window. `1h` divided by `2` gives a 30-minute offset. The operators `+ - * / % ^` all work with normal precedence. With `of<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">fset</mark>`, you must wrap the expression in parentheses. Otherwise PromQL uses only the first term.\n\nA few helper functions work inside a duration expression:\n\n- `step()` gives the step width of a range query. It gives `0s` for an instant query.\n- `range()` gives the end minus the start of a range query. It gives `0s` for an instant query.\n- `min_of()` and `max_of()` clamp a value. For example, `max_of(step(), 5s)` never lets the duration drop below 5 seconds.\n\nPromQL does not allow a duration expression inside the `@` modifier.\n\n## Time shifts: `offset` and `@`\n\n**`offset`** shifts the point where a selector looks, relative to the evaluation time of the query. If you append `offset 5m` to a selector, it returns the value from 5 minutes ago. `offset` also works on a range vector, and it combines with functions. For example, combine a `[5m]` range with `offset 1w` to get the 5-minute rate as it looked one week ago. A negative offset looks forward instead of back. This is sometimes useful when you compare against &quot;the future&quot; relative to an earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset. For example: `http_requests_total @ 1609746000`. `start()` and `end()` are useful special values here. For a range query, they resolve to the start and the end of the query, and they stay fixed across every step. For an instant query, both resolve to the evaluation time.\n\nBoth modifiers bind to the selector directly to their left, not to the whole enclosing expression. It is correct to wrap the bare selector, with its `offset` or `@` attached, inside an aggregation such as `sum(...)`. It is a syntax error to put the modifier after the closing parenthesis of `sum(...)`.\n\nYou can combine `offset` and `@` on the same selector. The order does not matter. PromQL always applies the offset relative to the `@` time.\n\n## Subqueries\n\nA subquery runs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;instant-query expression many times&#x27; over 3 words\">an</mark> instant-query expression many times over a range. This turns the expression into a range vector. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 27 words, limit 25\">A</mark> subquery is useful when you want to apply a range-vector function, such as `max_over_time`, to an expression that is already a rate or another computed value. For example, wrap `rate(metric[5m])` in a further `[30m:1m]` window. This gives the maximum of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional, and if you omit it, PromQL uses the global evaluation interval.\n\n## Other topics, in brief\n\n- **Operators** (`+`, `and`, `on`, `group_left`, and others) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) hold most of the power of PromQL. Read about them in a dedicated page after you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. Single-quoted and double-quoted strings follow the escape rules of Go: backslash escapes plus octal and hex escapes. Backtick strings are raw. PromQL does not process escapes in them, and it preserves newlines inside them as they are.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`, `NaN`, and underscores as digit separators for readability, for example `1_000_000`.\n\n## Two things to know up front\n\n**Staleness.** A query samples at fixed timestamps. These timestamps do not always <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with the times when Prometheus scraped the data. So Prometheus must decide what value to report at each timestamp. It uses the newest sample that is less than the *lookback period* old. The lookback period is 5 minutes by default. You can change it with the `--query.lookback-delta` flag or with a per-query `lookback_delta` parameter.\n\nIf Prometheus stops scraping a target, or the target disappears, Prometheus marks its series stale. Once the evaluation timestamp of a query is past that staleness point, the series no longer appears in results. This is why a graph line ends visibly instead of a flat line that goes on forever.\n\n**Performance.** If a metric has high cardinality, a selector with a bare metric name can expand silently into thousands of series. An aggregation over that many series costs real work on the server, even when the final output is a single number. Compare this with a SQL database: a sum over a huge column is not free only because the result is one row.\n\nWhen you explore an unfamiliar metric, follow these steps:\n\n1. Check the metric in the tabular view first.\n2. Narrow it with label matchers or aggregation until the result set has a reasonable size.\n3. Only then, switch to the graph view.\n\nIf a query is still expensive after you narrow it, use a recording rule. A recording rule computes the result once. Then you query <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;cheap result many times&#x27; over 3 words\">the</mark> cheap result many times.\n\n---\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Two</mark> notes on the process. I could not save this page as a file in this session. The file-write tool was not enabled, and <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;sandbox policy blocked shell redirection&#x27; over 3 words\">the</mark> sandbox policy blocked shell redirection to a file. The sandbox policy also flags label matchers in curly braces, such as `{...}`, as suspicious shell syntax. For this reason, I described a few code examples above in prose instead of literal `{job=&quot;...&quot;}` snippets. If you want this page as an `.md` file, copy the text above. Or tell me a different way to save it, and I will try that.", "factLoss": false, "fidelity": {"source_words": 1880, "rewrite_words": 1985, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A3", "quote": "A subquery is useful when you want to apply a range-vector function", "problem": "This 27-word description exceeds the PSTE-N2 limit even though every fact in it survives an easy split into two sentences, so PSTE-A3 required a split rather than an overrun.", "fix": "Split it: \"A subquery is useful when you apply a range-vector function, such as max_over_time, to an expression. That expression is already a rate or another computed value.\"", "reason": "PSTE-A3 permits exceeding a limit only when no split keeps every item, and here a split loses nothing.", "confidence": "medium", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 130, "column": 117, "offset": 9656}, {"rule": " to a", "line": 157, "column": 122, "excerpt_offset": 41, "severity": "MUST", "arbitrated": true, "weight": 0.5, "offset": 12516, "token": "the"}], "html": "---\nmodel: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-09-11\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\ngrounding_url: https://raw.githubusercontent.com/prometheus/prometheus/main/docs/querying/basics.md\ngrounding_licence: Apache-2.0\nquestion: |\n  Write a documentation page for the basics of its query language, PromQL in Prometheus. A copy of an upstream page for this topic is mounted at /grounding/synth-prometheus-query-basics.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# PromQL Basics\n\nPromQL (Prometheus Query Language) is the language that Prometheus uses to read data out of its database of time series. You use it in the expression browser, in Grafana panels, in alerting rules, and in recording rules. This page covers the core concepts that you need before you write your own queries. It explains what a query returns, how you select and filter time series, and some syntax details that confuse people.\n\n## Instant queries and range queries\n\nPrometheus can evaluate every PromQL expression in two ways:\n\n- **Instant query** \u2014 Prometheus evaluates the expression at one point in time. The result holds one value per matching series. This query type powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 Prometheus evaluates <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;same expression many times&#x27; over 3 words\">the</mark> same expression many times, at fixed steps between a start time and an end time. The result is a series of points that you can plot. This query type powers the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is an instant query that Prometheus runs many times at different timestamps. Tools other than the built-in UI, such as dashboards, scripts, and custom tools, usually fetch these results over the HTTP API of Prometheus.\n\n## What a query evaluates to\n\nAn expression, or any sub-expression, always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series. Each series has exactly one sample. All samples share the same timestamp. |\n| **Range vector** | A set of series. Each series has a window of samples over time. |\n| **Scalar** | One floating-point number with no labels. |\n| **String** | A string value. Queries rarely use this type today. |\n\nNot every context accepts every type. An instant query accepts any of the four types as its final result. A range query accepts only a scalar or an instant vector as its top-level result. You cannot graph a range vector or a string directly.\n\nSamples come in two kinds. A **float** sample is a plain number. A **native histogram** sample is a full histogram. It bundles the count, the sum, and the bucket data into one sample. One vector can hold a mix of both kinds.\n\nA native histogram knows whether it is a counter or a gauge. So Prometheus can warn you when you apply the wrong kind of function to it, for example `rate()` on a gauge histogram. A float sample does not carry that information. Prometheus cannot stop you when you call `rate()` on a float gauge, and the result is meaningless.\n\nFor this reason, the name of a counter metric ends in `_total` by convention. The convention helps humans and dashboards avoid that mistake. PromQL does not enforce it.\n\nA &quot;classic histogram&quot; is the set of three plain metrics `_bucket`, `_count`, and `_sum`. To PromQL, it is three ordinary float series. There is no &quot;classic histogram sample&quot;. Only a native histogram produces a sample of histogram type.\n\n## How to select time series\n\n### Instant vector selectors\n\nThe <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a metric name:\n\n```\nhttp_requests_total\n```\n\nThis query returns one sample for each series that carries that metric name. The sample is the most recent one at or before the evaluation time of the query. The staleness rules below also apply.\n\nTo narrow the result, add label matchers in curly braces after the metric name. For example, take a query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary`. It returns only the series that match both labels.\n\nPromQL has four matcher operators:\n\n| Operator | Meaning |\n|---|---|\n| `=` | The label equals this string. |\n| `!=` | The label does not equal this string. |\n| `=~` | The label matches this regex. |\n| `!~` | The label does not match this regex. |\n\nPromQL always anchors a regex match fully. A `=~` match against `foo` behaves as `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA matcher for an empty string on a label matches two sets of series: the series that set that label to an empty value, and the series that do not have the label at all. You can also repeat a matcher on the same label name. The selector returns a series only when every matcher on it passes. For example, you can exclude one specific value and also match a broader regex pattern on the same label.\n\nA selector that holds only regex matchers could match every series in the database. So Prometheus needs a selector to contain a metric name or at least one matcher that cannot match an empty value. Prometheus rejects a selector that has nothing but a wildcard regex on a single label. If that regex needs at least one non-empty character, the selector is valid.\n\nInternally, the metric name is a label called `__name__`. A bare metric name is the same as a direct match on `__name__`. You can also use the other operators on `__name__`, not only `=`. This lets you match every metric whose name starts with a given prefix.\n\nA few words are reserved as operator keywords: `bool`, `on`, `ignoring`, `group_left`, and `group_right`. You cannot use these words bare as a metric name. The workaround is an explicit match on `__name__`.\n\n### Range vector selectors\n\nTo get a window of history instead of a single point, append a duration in square brackets:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**. For every matching series, you get all the samples from the last 5 minutes, not only the latest one. The window is left-open and right-closed. The window excludes a sample that sits exactly on the start boundary, and it includes a sample that sits exactly on the end boundary. Functions such as `rate()`, `increase()`, and `avg_over_time()` consume most range vectors. You rarely show a range vector directly.\n\n## Durations\n\nYou write a time duration as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">You</mark> can chain units if they go from largest to smallest and each unit appears once. Examples: `1h30m`, `12h34m56s`. Internally, a duration is a float literal in seconds. `1s` is `1`, and `1ms` is `0.001`. But you can only add a unit suffix to a *decimal integer*. So `1.5h` is not valid, and a hex number with a unit suffix is not valid.\n\nYou can also build a duration with arithmetic anywhere that PromQL expects a duration, such as the brackets of a range vector and `offset`. For example, `5m` multiplied by `2` gives a 10-minute window. `1h` divided by `2` gives a 30-minute offset. The operators `+ - * / % ^` all work with normal precedence. With `of<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">fset</mark>`, you must wrap the expression in parentheses. Otherwise PromQL uses only the first term.\n\nA few helper functions work inside a duration expression:\n\n- `step()` gives the step width of a range query. It gives `0s` for an instant query.\n- `range()` gives the end minus the start of a range query. It gives `0s` for an instant query.\n- `min_of()` and `max_of()` clamp a value. For example, `max_of(step(), 5s)` never lets the duration drop below 5 seconds.\n\nPromQL does not allow a duration expression inside the `@` modifier.\n\n## Time shifts: `offset` and `@`\n\n**`offset`** shifts the point where a selector looks, relative to the evaluation time of the query. If you append `offset 5m` to a selector, it returns the value from 5 minutes ago. `offset` also works on a range vector, and it combines with functions. For example, combine a `[5m]` range with `offset 1w` to get the 5-minute rate as it looked one week ago. A negative offset looks forward instead of back. This is sometimes useful when you compare against &quot;the future&quot; relative to an earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset. For example: `http_requests_total @ 1609746000`. `start()` and `end()` are useful special values here. For a range query, they resolve to the start and the end of the query, and they stay fixed across every step. For an instant query, both resolve to the evaluation time.\n\nBoth modifiers bind to the selector directly to their left, not to the whole enclosing expression. It is correct to wrap the bare selector, with its `offset` or `@` attached, inside an aggregation such as `sum(...)`. It is a syntax error to put the modifier after the closing parenthesis of `sum(...)`.\n\nYou can combine `offset` and `@` on the same selector. The order does not matter. PromQL always applies the offset relative to the `@` time.\n\n## Subqueries\n\nA subquery runs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;instant-query expression many times&#x27; over 3 words\">an</mark> instant-query expression many times over a range. This turns the expression into a range vector. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 27 words, limit 25\">A</mark> subquery is useful when you want to apply a range-vector function, such as `max_over_time`, to an expression that is already a rate or another computed value. For example, wrap `rate(metric[5m])` in a further `[30m:1m]` window. This gives the maximum of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional, and if you omit it, PromQL uses the global evaluation interval.\n\n## Other topics, in brief\n\n- **Operators** (`+`, `and`, `on`, `group_left`, and others) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) hold most of the power of PromQL. Read about them in a dedicated page after you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. Single-quoted and double-quoted strings follow the escape rules of Go: backslash escapes plus octal and hex escapes. Backtick strings are raw. PromQL does not process escapes in them, and it preserves newlines inside them as they are.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`, `NaN`, and underscores as digit separators for readability, for example `1_000_000`.\n\n## Two things to know up front\n\n**Staleness.** A query samples at fixed timestamps. These timestamps do not always <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with the times when Prometheus scraped the data. So Prometheus must decide what value to report at each timestamp. It uses the newest sample that is less than the *lookback period* old. The lookback period is 5 minutes by default. You can change it with the `--query.lookback-delta` flag or with a per-query `lookback_delta` parameter.\n\nIf Prometheus stops scraping a target, or the target disappears, Prometheus marks its series stale. Once the evaluation timestamp of a query is past that staleness point, the series no longer appears in results. This is why a graph line ends visibly instead of a flat line that goes on forever.\n\n**Performance.** If a metric has high cardinality, a selector with a bare metric name can expand silently into thousands of series. An aggregation over that many series costs real work on the server, even when the final output is a single number. Compare this with a SQL database: a sum over a huge column is not free only because the result is one row.\n\nWhen you explore an unfamiliar metric, follow these steps:\n\n1. Check the metric in the tabular view first.\n2. Narrow it with label matchers or aggregation until the result set has a reasonable size.\n3. Only then, switch to the graph view.\n\nIf a query is still expensive after you narrow it, use a recording rule. A recording rule computes the result once. Then you query <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;cheap result many times&#x27; over 3 words\">the</mark> cheap result many times.\n\n---\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Two</mark> notes on the process. I could not save this page as a file in this session. The file-write tool was not e
