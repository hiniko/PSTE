rd noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start and end time, producing a series of points you can plot. This powers the &quot;Graph&quot; view.\n\nThe language itself <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> change between the two modes <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a range query is <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> an <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run over and over at different timestamps. Anything other than the built-in UI (dashboards, scripts, custom tooling) <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;typically&#x27; is not approved; use &#x27;usually&#x27;\">typically</mark> fetches these results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any sub-expression) always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, no labels attached |\n| **String** | A string value (rarely used in practice today) |\n\nNot every context accepts every type. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 34 words, limit 25\">Instant</mark> queries will accept any of the four as a <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> result<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> range queries only accept scalars and instant vectors as the top-level result <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> graph a range vector or a string directly.\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Samples</mark> themselves come in two flavors: ordinary **float** samples (a plain number) and **native histogram** samples (a full histogram with count, sum, and bucket data bundled into one sample). A single vector can contain a mix of both kinds. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 32 words, limit 25\">Native</mark> histograms know whether <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> a counter or a <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, so Prometheus can warn you if you apply the wrong <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> of function to them (<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., `rate()` on a <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram). <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 26 words, limit 25\">Ordinary</mark> float samples <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> carry that flavor information <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Prometheus <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> stop you from calling `rate()` on a float <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, even though the result will be meaningless. This is why counter metrics conventionally end in `_total`: <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a naming convention to help humans (and dashboards) avoid that mistake, not something PromQL enforces.\n\nOne more terminology note: a &quot;classic histogram&quot; <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There&#x27;s no such thing as a &quot;classic histogram sample&quot;<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> only native histograms <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;produce&#x27; is not approved; use &#x27;create&#x27;\">produce</mark> histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> possible query is <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a metric name:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> returns one sample per series carrying that metric name <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> specifically, the most <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> sample at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` scoped to a `job` label of `prometheus` and a `group` label of `canary` returns only series matching both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA subtlety worth knowing: <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series that have that label explicitly set to empty *and* series that <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have the label at all. <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-N2: description is 38 words, limit 25\">You</mark> can also repeat a matcher on the same label name <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> all of them have to pass for the series to be selected (<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., excluding one <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N2: description is 37 words, limit 25\">Because</mark> a selector made up of only regex matchers could otherwise match every series in the database, Prometheus requires that a selector contain a metric name or at least one matcher that <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> match an empty value. <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> selector with nothing but a wildcard-style regex on a single label is rejected<mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character in that regex makes it <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-N2: description is 47 words, limit 25\">Under</mark> the hood, the metric name is <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\">really</mark> <mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a label called `__name__`, so writing the metric name bare is <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-V3: &#x27;equivalent&#x27; is not approved; use &#x27;same&#x27;\">equivalent</mark> to matching `__name__` directly <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> and you can use non-`=` operators against it too, which lets you match every metric whose name starts with a given prefix. One quirk from this: <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-N2: description is 30 words, limit 25\">a</mark> few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> use them bare as a metric name<mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> matching them <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `__name__` explicitly is the workaround.\n\n### Range vector selectors\n\n<mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-V3: &#x27;append&#x27; is not approved; use &#x27;add&#x27;\">Append</mark> a <mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest one. The window is left-open, <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right-closed</mark> <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a sample sitting exactly on the start boundary is excluded, one sitting exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than displayed directly.\n\n## Durations\n\nTime durations are written as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nUnits can be chained as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.<mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-N2: description is 34 words, limit 25\"> </mark>Under the hood a<mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration is<mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\"> </mark>really<mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just a float literal in seconds<mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but you can only suffix a *decimal integer*, so `1.5h` and hex numbers with unit suffixes<mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\"> </mark>aren&#x27;t<mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\"> </mark>valid.\n\n<mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">You</mark> can also build a <mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic, anywhere a <mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected (range vector brackets, `offset`): multiplying `5m` by `2` gives a 10-minute window<mark id=\"f74\" class=\"hit\" data-i=\"74\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term gets used. There are also a few helper functions usable inside <mark id=\"f75\" class=\"hit\" data-i=\"75\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> expressions: <mark id=\"f76\" class=\"hit\" data-i=\"76\" title=\"PSTE-N2: description is 26 words, limit 25\">`</mark>step()` (the range-query step width, `0s` for<mark id=\"f77\" class=\"hit\" data-i=\"77\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clamping<mark id=\"f78\" class=\"hit\" data-i=\"78\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014<mark id=\"f79\" class=\"hit\" data-i=\"79\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\"> </mark>e.g. `max_of(step(), 5s)` never lets th<mark id=\"f80\" class=\"hit\" data-i=\"80\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">e</mark> duration drop below 5 seconds<mark id=\"f81\" class=\"hit\" data-i=\"81\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">.</mark> Duration expression<mark id=\"f82\" class=\"hit\" data-i=\"82\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">s</mark> aren&#x27;t allowed inside the `@` modifier, though.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago. <mark id=\"f83\" class=\"hit\" data-i=\"83\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines <mark id=\"f84\" class=\"hit\" data-i=\"84\" title=\"PSTE-L2: &#x27;naturally&#x27; carries no information; delete it\">naturally</mark> with functions <mark id=\"f85\" class=\"hit\" data-i=\"85\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, <mark id=\"f86\" class=\"hit\" data-i=\"86\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `http_requests_total @ 1609746000`.<mark id=\"f87\" class=\"hit\" data-i=\"87\" title=\"PSTE-N2: description is 36 words, limit 25\"> </mark>`start()` and `end()` are handy special values her<mark id=\"f88\" class=\"hit\" data-i=\"88\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">e</mark> \u2014 fo<mark id=\"f89\" class=\"hit\" data-i=\"89\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">r</mark> a range query they resolve to the query&#x27;s start/end and stay fixed across every st<mark id=\"f90\" class=\"hit\" data-i=\"90\" title=\"PSTE-X1: semicolon; write two sentences\">ep</mark>; for a<mark id=\"f91\" class=\"hit\" data-i=\"91\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">n</mark> instant query bot<mark id=\"f92\" class=\"hit\" data-i=\"92\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">h</mark> just resolve to the evaluation time.\n\nThe one rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. <mark id=\"f93\" class=\"hit\" data-i=\"93\" title=\"PSTE-N2: description is 29 words, limit 25\">Wrapping</mark> the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct<mark id=\"f94\" class=\"hit\" data-i=\"94\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order <mark id=\"f95\" class=\"hit\" data-i=\"95\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> matter <mark id=\"f96\" class=\"hit\" data-i=\"96\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\n<mark id=\"f97\" class=\"hit\" data-i=\"97\" title=\"PSTE-N2: description is 46 words, limit 25\">A</mark> subquery lets you run what is effectively an <mark id=\"f98\" class=\"hit\" data-i=\"98\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector <mark id=\"f99\" class=\"hit\" data-i=\"99\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> useful when you want to apply a range-vector function (like `max_over_time`) on top of something that&#x27;s already a rate or other computed expression, <mark id=\"f100\" class=\"hit\" data-i=\"100\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. wrapping `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional and defaults to the global evaluation <mark id=\"f101\" class=\"hit\" data-i=\"101\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\">interval</mark> if <mark id=\"f102\" class=\"hit\" data-i=\"102\" title=\"PSTE-V3: &#x27;omitted&#x27; is not approved; use "**Staleness.** Queries sample at fixed timestamps that may not align with actual scrape ti", "line": 113, "column": 64, "excerpt_offset": 63, "severity": "MUST", "arbitrated": false, "offset": 8007, "token": "align"}, {"rule": "PSTE-V3", "message": "'via' is not approved; use 'through'", "excerpt": "Prometheus reports the newest sample within the *lookback period* (5 minutes by default, c", "line": 113, "column": 198, "excerpt_offset": 102, "severity": "MUST", "arbitrated": false, "offset": 8141, "token": "via"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Once the query timestamp passes staleness, the series vanishes from results\u2014graph lines en", "line": 113, "column": 409, "excerpt_offset": 75, "severity": "SHOULD", "arbitrated": false, "offset": 8352, "token": "\u2014"}, {"rule": "PSTE-L2", "message": "'rather' carries no information; delete it", "excerpt": "Once the query timestamp passes staleness, the series vanishes from results\u2014graph lines en", "line": 113, "column": 426, "excerpt_offset": 92, "severity": "MUST", "arbitrated": false, "offset": 8369, "token": "rather"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "Any aggregation over that many series costs work even if the output is one number\u2014like sum", "line": 115, "column": 92, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 8491, "token": "Any"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Any aggregation over that many series costs work even if the output is one number\u2014like sum", "line": 115, "column": 173, "excerpt_offset": 81, "severity": "SHOULD", "arbitrated": false, "offset": 8572, "token": "\u2014"}, {"rule": "PSTE-N5", "message": "multi-word noun 'huge database column isn' over 3 words", "excerpt": "Any aggregation over that many series costs work even if the output is one number\u2014like sum", "line": 115, "column": 187, "excerpt_offset": 95, "severity": "MUST", "arbitrated": true, "offset": 8586, "token": "a"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "Any aggregation over that many series costs work even if the output is one number\u2014like sum", "line": 115, "column": 210, "excerpt_offset": 118, "severity": "MUST", "arbitrated": false, "offset": 8609, "token": "isn't"}], "html": "# PromQL Basics\n\nPromQL (Prometheus Query Language) lets you <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;retrieve&#x27; is not approved; use &#x27;get&#x27;\">retrieve</mark> data from Prometheus&#x27;s time series database. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;You&#x27;ll&#x27;\">You&#x27;ll</mark> use it in the expression browser, Grafana panels, alerting rules, and recording rules. This page explains the core concepts: how queries work, how to select and filter time series, and syntax details that commonly cause confusion.\n\n## Instant queries vs. range queries\n\nPromQL expressions evaluate two ways:\n\n- **<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at one point in time, returning one value per matching series. The Prometheus UI&#x27;s &quot;Table&quot; view uses this.\n- **Range query** \u2014 same expression evaluated repeatedly at fixed intervals between a start and end time, producing plottable points. The &quot;Graph&quot; view uses this.\n\nThe language stays the same in both modes. A range query is <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;instant query executed repeatedly&#x27; over 3 words\">an</mark> <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query executed repeatedly at different timestamps. Most tools outside the UI (dashboards, scripts, custom software) <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;fetch&#x27; is not approved; use &#x27;get&#x27;\">fetch</mark> results through Prometheus&#x27;s HTTP API.\n\n## Query result types\n\nAn expression always produces one of four types:\n\n| Type | Description |\n|---|---|\n| **Instant vector** | A set of series, each with one sample at the same timestamp |\n| **Range vector** | A set of series, each with multiple samples across a time window |\n| **Scalar** | A single number with no labels |\n| **String** | A text value (rarely used now) |\n\nNot all contexts accept all types. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> queries accept any of the four as a <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> result. Range queries only accept scalars and <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vectors at the top level<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>you cannot graph a range vector or string directly.\n\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Samples</mark> come in two kinds: **float** samples (plain numbers) and **native histogram** samples (histograms with count, sum, and bucket data). A single vector can mix both kinds. Native histograms know whether they track counters or gauges, so Prometheus warns if you use the wrong function (for example, `rate()` on a <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram). Float samples lack this information<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>Prometheus cannot prevent `rate()` on a float <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, though the result is <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;incorrect&#x27; is not approved; use &#x27;wrong&#x27;\">incorrect</mark>. This is why counter metrics end in `_total`: a naming convention to help humans and dashboards avoid the mistake, not enforced by PromQL.\n\nA &quot;classic histogram&quot;<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>the `_bucket`, `_count`, `_sum` trio of plain metrics\u2014appears to PromQL as three ordinary float series. No &quot;classic histogram sample&quot; exists<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> only native histograms <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;produce&#x27; is not approved; use &#x27;create&#x27;\">produce</mark> histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query names a metric:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 27 words, limit 25\">This</mark> returns one sample per series with that metric name<mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>specifically, the most <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> sample at or before the query&#x27;s evaluation time (subject to staleness rules below).\n\nNarrow results by adding label matchers in curly braces after the metric name. A query for `http_requests_total` with `job=&quot;prometheus&quot;` and `group=&quot;canary&quot;` returns only series matching both conditions.\n\nFour matcher operators exist:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches are fully anchored<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>a `=~` match against `foo` acts like `^foo$`, not a substring search. The regex flavor is RE2.\n\nA matcher against an empty string matches series with that label explicitly set to empty and series without the label. <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N2: description is 28 words, limit 25\">You</mark> can repeat a matcher on the same label<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>all must pass for <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;selection&#x27; is not approved; use &#x27;option&#x27;\">selection</mark> (for example, excluding one value while matching a broader pattern on the same label).\n\n<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N2: description is 29 words, limit 25\">A</mark> selector with only regex matchers could match every series, so Prometheus requires a selector to include a metric name or at least one matcher that cannot match empty. A selector with only a wildcard regex on a single label is rejected<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character makes it <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 33 words, limit 25\">Internally</mark>, the metric name is a label called `__name__`, so bare metric names equal `__name__` matching<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>you can use other operators against it too, letting you match every metric starting with a prefix. One quirk: reserved words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) cannot be bare metric names<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> match them <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `__name__` explicitly.\n\n### Range vector selectors\n\nAdd a <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to get a time window instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each matching series you get all samples from the last 5 minutes, not <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest. The window is left-open, <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right-closed</mark><mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>a sample exactly at the start excludes<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> exactly at the end includes. Functions like `rate()`, `increase()`, and `avg_over_time()` <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;consume&#x27; is not approved; use &#x27;take&#x27;\">consume</mark> range vectors<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> they are rarely displayed directly.\n\n## Durations\n\nWrite durations as a number plus a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nChain units from largest to smallest, each used once: `1h30m`, `12h34m56s`.<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N2: description is 28 words, limit 25\"> </mark>Internally a<mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration is a float in second<mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">s</mark>\u2014`1s` is `1`, `1ms` is `0.001`\u2014but you can only suffix a decimal integer, so `1.5h` and hex numbers with suffixes are<mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\"> </mark>invalid.\n\n<mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">Build</mark> durations with arithmetic wherever <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> expected (range brackets, `offset`): multiply `5m` by `2` for 10 minutes<mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-V3: &#x27;divide&#x27; is not approved; use &#x27;split&#x27;\">divide</mark> `1h` by `2` for 30 minutes. <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;standard&#x27; is not approved; use &#x27;default&#x27;\">Standard</mark> operators (`+ - ful her<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">e</mark>\u2014in<mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\"> </mark>a range query they resolve to the query&#x27;s start and end, staying fixed across step<mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-X1: semicolon; write two sentences\">s</mark>; in an<mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant query both resolve to the evaluation time.\n\nOne rule: both modifiers bind to the selector immediately to their left, not the whole expression. Wrap the bare selector with its modifier inside an aggregation like `sum(...)`<mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> putting the modifier after the closing parenthesis is a syntax error.\n\n<mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-V3: &#x27;combine&#x27; is not approved; use &#x27;join&#x27;\">Combine</mark> `offset` and `@` on the same selector in any order<mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>the offset always applies relative to the `@` time.\n\n## Subqueries\n\nRun an <mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, converting it to a range vector. Useful when you need a range function (like `max_over_time`) on already-computed data (like a rate). For example, wrap `rate(metric[5m])` in `[30m:1m]` to get the maximum rate over 30 minutes at 1-minute resolution. The resolution part is optional and defaults to the global evaluation <mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\">interval</mark> if <mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-V3: &#x27;omitted&#x27; is not approved; use &#x27;missing&#x27;\">omitted</mark>.\n\n## Other language features\n\n- **Operators** (`+`, `and`, `on`, `group_left`, others) and **functions** (`rate`, `sum`, `histogram_quantile`, many more) hold most of PromQL&#x27;s power\u2014worth studying once selectors feel familiar.\n- **Comments** start with `#` and continue to line end.\n- **String literals** use single quotes, double quotes, or backticks. Single and double quotes follow Go&#x27;s escaping rules (backslash escapes, octal/hex)<mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> backticks are raw\u2014no escaping, newlines preserved.\n- **Numeric literals** support integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators (`1_000_000`).\n\n## Common pitfalls\n\n**Staleness.** Queries sample at fixed timestamps that may not <mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-V3: &#x27;align with&#x27; is not approved; use &#x27;match&#x27;\">align</mark> with actual scrape times. Prometheus reports the newest sample within the *lookback period* (5 minutes by default, configurable <mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `--query.lookback-delta` flag or per-query `lookback_delta` parameter). If a target stops or disappears, its series marks as stale. Once the query timestamp passes staleness, the series vanishes from results<mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>graph lines end <mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than flatline forever.\n\n**Performance.** A bare metric name can expand to thousands of series if high-cardinality. <mark id=\"f74\" class=\  is 41 words, limit 25", "excerpt": "Any aggregation over that many series costs real work on the server even if the final outp", "line": 115, "column": 126, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 10378, "token": "Any"}, {"rule": "PSTE-V3", "message": "'final' is not approved; use 'last'", "excerpt": "Any aggregation over that many series costs real work on the server even if the final outp", "line": 115, "column": 206, "excerpt_offset": 80, "severity": "MUST", "arbitrated": false, "offset": 10458, "token": "final"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Any aggregation over that many series costs real work on the server even if the final outp", "line": 115, "column": 238, "excerpt_offset": 112, "severity": "SHOULD", "arbitrated": false, "offset": 10490, "token": "\u2014"}, {"rule": "PSTE-L2", "message": "'just' carries no information; delete it", "excerpt": "Any aggregation over that many series costs real work on the server even if the final outp", "line": 115, "column": 302, "excerpt_offset": 176, "severity": "MUST", "arbitrated": false, "offset": 10554, "token": "just"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "If a query is inherently expensive even after narrowing, that is what recording rules are ", "line": 115, "column": 632, "excerpt_offset": 94, "severity": "SHOULD", "arbitrated": false, "offset": 10884, "token": "\u2014"}], "html": "# PromQL Basics\n\nPromQL (Prometheus Query Language) is the language Prometheus uses to read data from its time series database. You use it in the expression browser, in Grafana panels, in alerting rules, and in recording rules. This page covers the core concepts you need before you write your own queries: what a query returns, how to select and filter time series, and syntax details that often cause confusion.\n\n## Instant queries and range queries\n\nEvery PromQL expression can be evaluated in two ways:\n\n- **<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at a single point in time. The result is one value per matching series. The Prometheus UI &quot;Table&quot; view uses this.\n- **Range query** \u2014 <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start time and an end time. The result is a series of points you can plot. The Prometheus UI &quot;Graph&quot; view uses this.\n\nThe language does not change between the two modes. A range query is <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> an <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run repeatedly at different timestamps. Anything other than the built-in UI <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dashboards, scripts, custom tooling \u2014 fetches these results over the Prometheus HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any sub-expression) always produces one of four types:\n\n| Type | What it is |\n|---|---|\n| **Instant vector** | A set of series. Each series has exactly one sample. All samples have the same timestamp. |\n| **Range vector** | A set of series. Each series has a window of samples over time. |\n| **Scalar** | A single floating-point number. No labels are attached. |\n| **String** | A string value. This is rarely used in practice. |\n\nNot every context accepts every type. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> queries accept any of the four as a <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> result. Range queries accept only scalars and <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vectors as the top-level result. You cannot graph a range vector or a string directly.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">Samples</mark> come in two kinds: ordinary **float** samples (a plain number) and **native histogram** samples (a full histogram with count, sum, and bucket data bundled into one sample). A single vector can contain a mix of both kinds. Native histograms know whether they are a counter or a <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>. Prometheus can warn you if you apply the wrong <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> of function to them (for example, `rate()` on a <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram). Ordinary float samples do not carry that <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> information. Prometheus cannot stop you from calling `rate()` on a float <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, even though the result will be meaningless. This is why counter metrics conventionally end in `_total`: it is a naming convention to help humans and dashboards avoid that mistake, not something PromQL enforces.\n\nOne more terminology note: a &quot;classic histogram&quot; <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There is no such thing as a &quot;classic histogram sample&quot;. Only native histograms <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;produce&#x27; is not approved; use &#x27;create&#x27;\">produce</mark> histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> possible query is <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a metric name:\n\n```\nhttp_requests_total\n```\n\nThis returns one sample per series with that metric name. Specifically, it returns the most <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> sample at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary` returns only series that match both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored. A `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA subtlety: <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series that have that label set to empty and series that do not have the label at all. You can also repeat a matcher on the same label name. <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 28 words, limit 25\">All</mark> of them must pass for the series to be selected (for example, you can exclude one <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N2: description is 36 words, limit 25\">Because</mark> a selector made up of only regex matchers could match every series in the database, Prometheus requires that a selector contain a metric name or at least one matcher that cannot match an empty value. A selector with nothing but a wildcard-style regex on a single label is rejected. <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must include at least one non-empty character in that regex to make it <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> metric name is <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\">really</mark> <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a label called `__name__`. Writing the metric name bare is <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;equivalent&#x27; is not approved; use &#x27;same&#x27;\">equivalent</mark> to matching `__name__` directly. You can use non-`=` operators against it. This lets you match every metric whose name starts with a given prefix. One quirk: a few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords. You cannot use them bare as a metric name. Match them <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `__name__` explicitly as a workaround.\n\n### Range vector selectors\n\n<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;append&#x27; is not approved; use &#x27;add&#x27;\">Append</mark> a <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest one. The window is left-open, <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right-closed</mark>. A sample sitting exactly on the start boundary is excluded. A sample sitting exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than displayed directly.\n\n## Durations\n\nTime durations are written as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nUnits can be chained as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N2: description is 32 words, limit 25\"> </mark>A<mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration is<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\"> </mark>really<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just a float literal in seconds<mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but you can only suffix a decimal integer, so `1.5h` and hex numbers with unit suffixes are not<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\"> </mark>valid.\n\n<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">You</mark> can also build a <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic, anywhere a <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected (range vector brackets, `offset`): multiplying `5m` by `2` gives a 10-minute window<mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term gets used. A few helper functions work inside <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> expressions: <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N2: description is 34 words, limit 25\">`</mark>step()` (the range-query step width, `0s` for<mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clamping<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 for example, `max_of(step(), 5s)` never lets the<mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration drop below 5 seconds.<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>Duration expressions are not allowed inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago. <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-L2: &#x27;naturally&#x27; carries no information; delete it\">naturally</mark> with functions <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, for example `http_requests_total @ 1609746000`. <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N2: description is 39 words, limit 25\">`</mark>start()` and `end()` are handy special values here<mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 for<mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\"> </mark>a range query they resolve to the query&#x27;s start time and end time and stay fixed across every ste<mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-X1: semicolon; write two sentences\">p</mark>; for an<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant query both<mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just resolve to the evaluation time.\n\nOne rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. Wrapping the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct. Putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order does not matter <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\nA subquery lets you run what is effectively an <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector. <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-N2: description is 49 words, limit 25\">This</mark> is useful when you want to apply a range-vector function (like `max_over_time`) on top of something that is already a rate or other computed expression, for example wrapping `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional and defaults to the global evaluation <mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-V3: &#x27;interval&#x27; is not approved; use &#x27;range&#x27;\">interval</mark> if <mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-V3: &#x27;omitted&#x27; is not approved; use &#x27;missing&#x27;\">omitted</mark>.\n\n## Everything else, briefly\n\n- **Operators** (`+`, `and`, `on`, `group_left`, and others) and **functions** (`rate`, `sum`, `histogram_quantile`, and many more) are where most of PromQL&#x27;s actual power lives. Read <mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-N5: multi-word noun &#x27;dedicated section once you&#x27; over 3 words\">the</mark> <mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-V3: &#x27;dedicated&#x27; is not approved; use &#x27;own&#x27;\">dedicated</mark> section once you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. Single-quoted and double-quoted strings follow Go&#x27;s escaping rules (backslash escapes plus octal and hex escapes). Backtick strings are raw \u2014 no escape processing. Newlines inside them are preserved as-is.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators for readability (for example, `1_000_000`).\n\n## Two gotchas worth knowing\n\n**Staleness.** A query samples at fixed timestamps that do not necessarily <mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with when data was <mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> scraped. Prometheus must decide what value to report at each timestamp. <mark id=\"f70\" class=\"hit\" data-i=\"70\" title=\"PSTE-N2: description is 26 words, limit 25\">It</mark> uses the newest sample that is less than the lookback period old (5 minutes by default, tunable <mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the `--query.lookback-delta` flag or a per-query `lookback_delta` parameter). If a target stops being scraped or disappears, its series gets marked stale. Once a query&#x27;s evaluation timestamp is past that staleness point, the series <mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-L2: &#x27;simply&#x27; carries no information; delete it\">simply</mark> stops appearing in results. This is why a graph line will visibly end <mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than flatline forever.\n\n**Performance.** A bare metric name selector can silently expand into thousands of series if the metric is high-cardinality. <mark id=\"f74\" class=\"hit\" data-i=\"74\" title=\"PSTE-N2: description is 41 words, limit 25\">Any</mark> aggregation over that many series costs real work on the server even if the <mark id=\"f75\" class=\"hit\" data-i=\"75\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> output is a single number <mark id=\"f76\" class=\"hit\" data-i=\"76\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> much like summing a huge column in a SQL database is not free <mark id=\"f77\" class=\"hit\" data-i=\"77\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because the result is one row. When you explore an unfamiliar metric, check it in the tabular view first. Narrow it down with label matchers or aggregation until the result set is reasonably sized. Only then switch to graphing it. If a query is set": 5, "severity": "MUST", "arbitrated": true, "offset": 9026, "token": "the"}, {"rule": "PSTE-V3", "message": "'dedicated' is not approved; use 'own'", "excerpt": "Read the dedicated section once you are comfortable with selectors.", "line": 106, "column": 189, "excerpt_offset": 9, "severity": "MUST", "arbitrated": false, "offset": 9030, "token": "dedicated"}, {"rule": "PSTE-G8", "message": "phrasal verb 'line up'; use 'set'", "excerpt": "**Staleness.** A query samples at fixed timestamps that do not necessarily line up with wh", "line": 113, "column": 76, "excerpt_offset": 75, "severity": "MUST", "arbitrated": false, "offset": 9702, "token": "line"}, {"rule": "PSTE-L2", "message": "'actually' carries no information; delete it", "excerpt": "**Staleness.** A query samples at fixed timestamps that do not necessarily line up with wh", "line": 113, "column": 103, "excerpt_offset": 102, "severity": "MUST", "arbitrated": false, "offset": 9729, "token": "actually"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "It uses the newest sample that is less than the lookback period old (5 minutes by default,", "line": 113, "column": 184, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 9810, "token": "It"}, {"rule": "PSTE-V3", "message": "'via' is not approved; use 'through'", "excerpt": "It uses the newest sample that is less than the lookback period old (5 minutes by default,", "line": 113, "column": 283, "excerpt_offset": 99, "severity": "MUST", "arbitrated": false, "offset": 9909, "token": "via"}, {"rule": "PSTE-L2", "message": "'simply' carries no information; delete it", "excerpt": "Once a query's evaluation timestamp is past that staleness point, the series simply stops ", "line": 113, "column": 519, "excerpt_offset": 77, "severity": "MUST", "arbitrated": false, "offset": 10145, "token": "simply"}, {"rule": "PSTE-L2", "message": "'rather' carries no information; delete it", "excerpt": "This is why a graph line will ou write your own queries: what a query returns, how to select and filter time series, and syntax details that often cause confusion.\n\n## Instant queries and range queries\n\nEvery PromQL expression can be evaluated in two ways:\n\n- **<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at a single point in time. The result is one value per matching series. The Prometheus UI &quot;Table&quot; view uses this.\n- **Range query** \u2014 <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start time and an end time. The result is a series of points you can plot. The Prometheus UI &quot;Graph&quot; view uses this.\n\nThe language does not change between the two modes. A range query is <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> an <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run repeatedly at different timestamps. Anything other than the built-in UI <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dashboards, scripts, custom tooling \u2014 fetches these results over the Prometheus HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any sub-expression) always produces one of four types:\n\n| Type | What it is |\n|---|---|\n| **Instant vector** | A set of series. Each series has exactly one sample. All samples have the same timestamp. |\n| **Range vector** | A set of series. Each series has a window of samples over time. |\n| **Scalar** | A single floating-point number. No labels are attached. |\n| **String** | A string value. This is rarely used in practice. |\n\nNot every context accepts every type. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> queries accept any of the four as a <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> result. Range queries accept only scalars and <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vectors as the top-level result. You cannot graph a range vector or a string directly.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">Samples</mark> come in two kinds: ordinary **float** samples (a plain number) and **native histogram** samples (a full histogram with count, sum, and bucket data bundled into one sample). A single vector can contain a mix of both kinds. Native histograms know whether they are a counter or a <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>. Prometheus can warn you if you apply the wrong <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> of function to them (for example, `rate()` on a <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark> histogram). Ordinary float samples do not carry that <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;kind&#x27; is not approved; use &#x27;type&#x27;\">kind</mark> information. Prometheus cannot stop you from calling `rate()` on a float <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;gauge&#x27; is not approved; use &#x27;measure&#x27;\">gauge</mark>, even though the result will be meaningless. This is why counter metrics conventionally end in `_total`: it is a naming convention to help humans and dashboards avoid that mistake, not something PromQL enforces.\n\nOne more terminology note: a &quot;classic histogram&quot; <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> three ordinary float series to PromQL. There is no such thing as a &quot;classic histogram sample&quot;. Only native histograms <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;produce&#x27; is not approved; use &#x27;create&#x27;\">produce</mark> histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> possible query is <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a metric name:\n\n```\nhttp_requests_total\n```\n\nThis returns one sample per series with that metric name. Specifically, it returns the most <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> sample at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary` returns only series that match both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored. A `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA subtlety: <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series that have that label set to empty and series that do not have the label at all. You can also repeat a matcher on the same label name. <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 28 words, limit 25\">All</mark> of them must pass for the series to be selected (for example, you can exclude one <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N2: description is 36 words, limit 25\">Because</mark> a selector made up of only regex matchers could match every series in the database, Prometheus requires that a selector contain a metric name or at least one matcher that cannot match an empty value. A selector with nothing but a wildcard-style regex on a single label is rejected. <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must include at least one non-empty character in that regex to make it <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>.\n\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> metric name is <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\">really</mark> <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> a label called `__name__`. Writing the metric name bare is <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;equivalent&#x27; is not approved; use &#x27;same&#x27;\">equivalent</mark> to matching `__name__` directly. You can use non-`=` operators against it. This lets you match every metric whose name starts with a given prefix. One quirk: a few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords. You cannot use them bare as a metric name. Match them <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> `__name__` explicitly as a workaround.\n\n### Range vector selectors\n\n<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V3: &#x27;append&#x27; is not approved; use &#x27;add&#x27;\">Append</mark> a <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> the latest one. The window is left-open, <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right-closed</mark>. A sample sitting exactly on the start boundary is excluded. A sample sitting exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than displayed directly.\n\n## Durations\n\nTime durations are written as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nUnits can be chained as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N2: description is 32 words, limit 25\"> </mark>A<mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration is<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-L2: &#x27;really&#x27; carries no information; delete it\"> </mark>really<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just a float literal in seconds<mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but you can only suffix a decimal integer, so `1.5h` and hex numbers with unit suffixes are not<mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\"> </mark>valid.\n\n<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">You</mark> can also build a <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> with arithmetic, anywhere a <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> is expected (range vector brackets, `offset`): multiplying `5m` by `2` gives a 10-minute window<mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term gets used. A few helper functions work inside <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\">duration</mark> expressions: <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N2: description is 34 words, limit 25\">`</mark>step()` (the range-query step width, `0s` for<mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clamping<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 for example, `max_of(step(), 5s)` never lets the<mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>duration drop below 5 seconds.<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-V3: &#x27;duration&#x27; is not approved; use &#x27;time&#x27;\"> </mark>Duration expressions are not allowed inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago. <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-L2: &#x27;naturally&#x27; carries no information; delete it\">naturally</mark> with functions <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, for example `http_requests_total @ 1609746000`. <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N2: description is 39 words, limit 25\">`</mark>start()` and `end()` are handy special values here<mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 for<mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\"> </mark>a range query they resolve to the query&#x27;s start time and end time and stay fixed across every ste<mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-X1: semicolon; write two sentences\">p</mark>; for an<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant query both<mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\"> </mark>just resolve to the evaluation time.\n\nOne rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. Wrapping the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct. Putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order does not matter <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\nA subquery lets you run what is effectively an <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector. <mark id=\"f63\" class=\"hit\" data-i=\"63\" titl
