ely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-V3", "message": "'guaranteed' is not approved; use 'certain'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 54, "excerpt_offset": 53, "severity": "MUST", "arbitrated": false, "offset": 5293, "token": "guaranteed"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}, {"rule": "PSTE-V3", "message": "'via' is not approved; use 'through'", "excerpt": "or indirectly via the :func:", "line": 142, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 5481, "token": "via"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">several</mark> benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;automated&#x27; is not approved; use &#x27;automatic&#x27;\">automated</mark> upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;required&#x27; is not approved; use &#x27;necessary&#x27;\">Required</mark> Reading\n================\n\nIf <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each &#x27;<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final&#x27;</mark> release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than to make all the changes <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each feature\nrelease at once. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each feature release, use the latest patch release (<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;as well&#x27; is not approved; use &#x27;too&#x27;\">as</mark> well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nIf <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V3: &#x27;in order to&#x27; is not approved; use &#x27;to&#x27;\">in</mark> order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;manage&#x27; is not approved; use &#x27;handle&#x27;\">manage</mark>.py test\n\nAfter you <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark> in your mind, it may also be a good time to take <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;advantage&#x27; is not approved; use &#x27;benefit&#x27;\">advantage</mark> of new\nfeatures in Django by refactoring your code to <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V3: &#x27;eliminate&#x27; is not approved; use &#x27;remove&#x27;\">eliminate</mark> any deprecation\nwarnings.\n\nIf you <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate<mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please see our\nguide on :ref:`testing-pre-releases` for more <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-V3: &#x27;guaranteed&#x27; is not approved; use &#x27;certain&#x27;\">guaranteed</mark> to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the :func:`~django.views.decorators.cache.cache_page`\ndecorator.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 655, "findings": [{"rule": "PSTE-V3", "message": "'several' is not approved; use 'some'", "excerpt": "Upgrading Django offers several benefits:", "line": 3, "column"  not approved; use &#x27;rule&#x27;\">policy</mark>).\n* Upgrading with each new release helps keep your code base current and makes future upgrades smoother.\n\nDjango has a vibrant ecosystem with <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;automated&#x27; is not approved; use &#x27;automatic&#x27;\">automated</mark> upgrade helpers highlighted on the Community Ecosystem page.\n\nHere are things to consider to help make your upgrade process as smooth as possible.\n\n## Required Reading\n\nIf <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time upgrading, read the guide on the different release processes.\n\nAfterward, familiarize yourself with the changes in the new Django version(s):\n\n* <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N1: instruction is 28 words, limit 20\">Read</mark> the release notes <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> release from the one after your current Django version up to and including the version to which you plan to upgrade.\n* Look at the deprecation timeline for the relevant versions.\n\nPay particular attention to backwards incompatible changes to understand what will be needed for a successful upgrade.\n\nIf <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2), upgrade through each feature release incrementally (2.0 to 2.1 to 2.2) <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-L2: &#x27;rather&#x27; carries no information; delete it\">rather</mark> than making all the changes <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each feature release at once. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">For</mark> each feature release, use the latest patch release (<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. for 2.1, use 2.1.15).\n\nThe same incremental upgrade <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> is recommended when upgrading from one LTS to the next.\n\n## Dependencies\n\nIn most cases it will be necessary to upgrade to the latest version of your Django-related dependencies <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;as well&#x27; is not approved; use &#x27;too&#x27;\">as</mark> well. <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 27 words, limit 25\">If</mark> the Django version was recently released or some of your dependencies are not well-maintained, some of your dependencies may not yet support the new Django version. In these cases you may have to wait until new versions of your dependencies are released.\n\n## Resolving Deprecation Warnings\n\nBefore upgrading, resolve any deprecation warnings raised by your project while using your current version of Django. Fixing these warnings before upgrading ensures <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code that need altering.\n\nIn Python, deprecation warnings are silenced by default. Turn them on using the `-Wa` Python command line option or the `PYTHONWARNINGS` environment variable. To show warnings while running tests:\n\n```\n$ python -Wa manage.py test\n```\n\nIf <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> that any console output is not captured, which would hide deprecation warnings. For example, if you use pytest:\n\n```\n$ PYTHONWARNINGS=always pytest tests --capture=no\n```\n\nResolve any deprecation warnings with your current version of Django before continuing the upgrade process.\n\nThird party applications might use deprecated APIs to support multiple versions of Django, so deprecation warnings in packages <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> necessarily indicate a <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version of Django, consider raising an issue or sending a pull request for it.\n\n## Installation\n\nOnce <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, install the new Django version. If <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> using a virtual environment and <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a major upgrade, you might want to <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies first.\n\nIf you installed Django with pip, use the `--upgrade` or `-U` flag:\n\n```\n$ python -m pip install -U Django\n```\n\n## Testing\n\nWhen the new environment is <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, run the full test suite for your application. <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings so <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also use the flag if you test your app manually using `manage.py runserver`):\n\n```\n$ python -Wa manage.py test\n```\n\nAfter you <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 34 words, limit 25\">While</mark> you have the release notes <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark> in your mind, it may also be a good time to take <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-V3: &#x27;advantage&#x27; is not approved; use &#x27;benefit&#x27;\">advantage</mark> of new features in Django by refactoring your code to <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;eliminate&#x27; is not approved; use &#x27;remove&#x27;\">eliminate</mark> any deprecation warnings.\n\n<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 27 words, limit 25\">If</mark> you <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, see the guide on testing pre-releases for more <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> tips about catching regressions and reporting bugs.\n\n## Deployment\n\nWhen you are sufficiently confident your app works with the new version of Django, deploy your upgraded Django project.\n\nIf you <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django, clear your cache after upgrading. <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N2: description is 26 words, limit 25\">Otherwise</mark> you may run into problems, for example, if you <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-V3: &#x27;guaranteed&#x27; is not approved; use &#x27;certain&#x27;\">guaranteed</mark> to be pickle-compatible across Django versions. A past instance of incompatibility <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled HttpResponse objects, either directly or indirectly <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the cache_page decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 727, "findings": [{"kind": "identifier", "severity": "critical", "message": "`deploy </howto/deployment/index>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`deprecation timeline</internals/deprecation>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`guide\non the different release processes </internals/release-process>` is missing from the rewrite."}, pgrading to:\n\n* Read release notes <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> release from the one after your current version up to the version you want.\n* Read the deprecation timeline for those versions.\n* Pay close attention to backwards incompatible changes.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Incremental upgrades are easier.** If you upgrade through more than one feature version (for example, 2.0 to 2.2), upgrade through each feature release one at a time (2.0 to 2.1 to 2.2). Use the latest patch release <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each (for example, for 2.1 use 2.1.15). Use the same <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> when upgrading from one LTS to the next.\n\n### Check Dependencies\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must upgrade Django-related dependencies <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;as well&#x27; is not approved; use &#x27;too&#x27;\">as</mark> well. If Django was recently released or some dependencies are not well-maintained, they may not yet support the new version. Wait for them to be released.\n\nThird-party packages may use deprecated APIs to support multiple Django versions. Deprecation warnings in installed packages do not necessarily mean a <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package does not support the latest Django version, raise an issue or send a pull request.\n\n### Fix Deprecation Warnings\n\nBefore upgrading, fix any deprecation warnings your project raises with your current Django version.\n\nPython hides deprecation warnings by default. Turn them on with the `python -Wa` flag or the `PYTHONWARNINGS` environment variable. For example, to show warnings while running tests:\n\n```\n$ python -Wa manage.py test\n```\n\nIf you use pytest instead of the Django test runner, <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> console output is not captured:\n\n```\n$ PYTHONWARNINGS=always pytest tests --capture=no\n```\n\nFix all deprecation warnings before you continue.\n\n## Upgrade\n\n### Install the New Version\n\nWhen you are ready, install the new Django version. If you use a virtual environment and this is a major upgrade, <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all dependencies first.\n\nIf you installed Django with pip, use the `--upgrade` or `-U` flag:\n\n```\n$ python -m pip install -U Django\n```\n\n### Test Your Application\n\nRun your full test suite. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings so they show in the test output:\n\n```\n$ python -Wa manage.py test\n```\n\nFix any test failures. While release notes are <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark> in your mind, refactor your code to use new Django features and <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;eliminate&#x27; is not approved; use &#x27;remove&#x27;\">eliminate</mark> deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate version, see the guide on testing pre-releases for tips on catching regressions and reporting bugs.\n\n## Deploy\n\nWhen your application works with the new Django version, deploy it.\n\n### Clear Your Cache\n\nIf you use Django caching, clear your cache after upgrading. Pickled objects may not be pickle-compatible across Django versions. An example: pickled `HttpResponse` objects cached directly or <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the `cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 510, "findings": [{"kind": "identifier", "severity": "critical", "message": "`deploy </howto/deployment/index>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`deprecation timeline</internals/deprecation>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`guide\non the different release processes </internals/release-process>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`install the new Django version\n</topics/install>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`manage.py runserver` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`pytest <https://docs.pytest.org/>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`release notes </releases/index>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`run the full test suite\n</topics/testing/overview>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`supported-versions-policy` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`testing-pre-releases` is missing from the rewrite."}, {"kind": "identifier", "severity": ade with each new release.\n\nDjango has upgrade helper tools. Find them on the Community Ecosystem page.\n\n## Before You Start\n\n### Read the Documentation\n\nIf this is your first upgrade, read the guide on release processes.\n\nThen read the material for the version you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to:\n\n* Read release notes <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;final&#x27; is not approved; use &#x27;last&#x27;\">final</mark> release from the one after your current version up to the version you want.\n* Read the deprecation timeline for those versions.\n* Pay close attention to backwards incompatible changes.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Incremental upgrades are easier.** If you upgrade through more than one feature version (for example, 2.0 to 2.2), upgrade through each feature release one at a time (2.0 to 2.1 to 2.2). Use the latest patch release <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;for each&#x27; is not approved; use &#x27;per&#x27;\">for</mark> each (for example, for 2.1 use 2.1.15). Use the same <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;approach&#x27; is not approved; use &#x27;way&#x27;\">approach</mark> when upgrading from one LTS to the next.\n\n### Check Dependencies\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must upgrade Django-related dependencies <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;as well&#x27; is not approved; use &#x27;too&#x27;\">as</mark> well. If Django was recently released or some dependencies are not well-maintained, they may not yet support the new version. Wait for them to be released.\n\nThird-party packages may use deprecated APIs to support multiple Django versions. Deprecation warnings in installed packages do not necessarily mean a <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-L2: &#x27;problem&#x27; carries no information; delete it\">problem</mark>. If a package does not support the latest Django version, raise an issue or send a pull request.\n\n### Fix Deprecation Warnings\n\nBefore upgrading, fix any deprecation warnings your project raises with your current Django version.\n\nPython hides deprecation warnings by default. Turn them on with the `python -Wa` flag or the `PYTHONWARNINGS` environment variable. For example, to show warnings while running tests:\n\n```\n$ python -Wa manage.py test\n```\n\nIf you use pytest instead of the Django test runner, <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> console output is not captured:\n\n```\n$ PYTHONWARNINGS=always pytest tests --capture=no\n```\n\nFix all deprecation warnings before you continue.\n\n## Upgrade\n\n### Install the New Version\n\nWhen you are ready, install the new Django version. If you use a virtual environment and this is a major upgrade, <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all dependencies first.\n\nIf you installed Django with pip, use the `--upgrade` or `-U` flag:\n\n```\n$ python -m pip install -U Django\n```\n\n### Test Your Application\n\nRun your full test suite. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings so they show in the test output:\n\n```\n$ python -Wa manage.py test\n```\n\nFix any test failures. While release notes are <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;fresh&#x27; is not approved; use &#x27;new&#x27;\">fresh</mark> in your mind, refactor your code to use new Django features and <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;eliminate&#x27; is not approved; use &#x27;remove&#x27;\">eliminate</mark> deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate version, see the guide on testing pre-releases for tips on catching regressions and reporting bugs.\n\n## Deploy\n\nWhen your application works with the new Django version, deploy it.\n\n### Clear Your Cache\n\nIf you use Django caching, clear your cache after upgrading. Pickled objects may not be pickle-compatible across Django versions. An example: pickled `HttpResponse` objects cached directly or <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> the `cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 510, "findings": [{"kind": "identifier", "severity": "critical", "message": "`deploy </howto/deployment/index>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`deprecation timeline</internals/deprecation>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`guide\non the different release processes </internals/release-process>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`install the new Django version\n</topics/install>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`manage.py runserver` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`pytest <https://docs.pytest.org/>` is missing from the rewrite."}, {"kind": "identifier", "severity": "critical", "message": "`release notes </releases/index>` is missing from the rewrite."}, {"kind": " pend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5460, "token": "When"}, {"rule": "PSTE-V3", "message": "'ensure' is not approved; use 'make sure'", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 105, "excerpt_offset": 99, "severity": "MUST", "arbitrated": false, "offset": 5559, "token": "ensure"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> network propagation get this to a timelord that will infuse the unfinished block to <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;construct&#x27; is not approved; use &#x27;build&#x27;\">construct</mark> the finished block.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;additionally&#x27; is not approved; use &#x27;also&#x27;\">Additionally</mark>, block production slowed down <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;several&#x27; is not approved; use &#x27;some&#x27;\">several</mark> bugs in <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;in addition&#x27; is not approved; use &#x27;too&#x27;\">In</mark> addition, fast forward spends are used for vaults. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;following&#x27; is not approved; use &#x27;next&#x27;\">following</mark> issues were the <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;root cause&#x27; is not approved; use &#x27;reason&#x27;\">root</mark> cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\">invalid</mark> <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on other parts of the spend bundle for being evicted  (<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;however&#x27; is not approved; use &#x27;but&#x27;\">However</mark>, we failed to validate that the singleton still existed. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> coin of a singleton. <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;duplicate&#x27; is not approved; use &#x27;copy&#x27;\">duplicate</mark> (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> and enter the mempool and propagate <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V3: &#x27;throughout&#x27; is not approved; use &#x27;across&#x27;\">throughout</mark> the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V3: &#x27;throughout&#x27; is not approved; use &#x27;across&#x27;\">throughout</mark> the network (3)\n* Trying to stop the <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark> by melting the singleton makes the transactions not <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> transactions.\n* <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;prepared&#x27; is not approved; use &#x27;ready&#x27;\">prepared</mark>.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V3: &#x27;the majority of&#x27; is not approved; use &#x27;most&#x27;\">the</mark> majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 itrated": false, "offset": 4565, "token": "confirm"}, {"rule": "PSTE-N5", "message": "multi-word noun 'latest singleton version still' over 3 words", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 62, "column": 113, "excerpt_offset": 107, "severity": "MUST", "arbitrated": true, "offset": 4573, "token": "the"}], "html": "# Block Creation Impacted by Mempool Issues\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> eligible to create the next block have approximately 28 seconds to create an unfinished block and <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;transmit&#x27; is not approved; use &#x27;send&#x27;\">transmit</mark> it through the network to a timelord, who infuses it into a finished block.\n\nFarmers select transactions from the mempool ordered by fee per cost and add them to the unfinished block to collect transaction fees.\n\nCNI found that when the mempool was full, transactions were not being added to blocks, and block production slowed below expected rates. Farmers eligible to create blocks failed to <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> unfinished blocks in time due to bugs in mempool logic involving fast forward spends.\n\nFast forward spends allow a singleton transaction to apply to future versions of that singleton.\n\nFast forward spends let offer files reference singletons by coin ID, even though the coin ID changes with each state update.\n\nFast forward spends also support vaults. Because the vault singleton authorizes all coins in it, allowing only one vault spend &quot;in-flight&quot; at a time would be restrictive. Fast forward enables multiple vault singleton spends to exist in the mempool concurrently, with farmers deduplicating and rebasing them sequentially during block creation.\n\nCNI identified three root causes of the block creation slowdown:\n\n* 1. Fast forward spends <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> become <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\">invalid</mark> when their coin is spent\u2014they can fast-forward to the latest singleton version. Fast-forward spends <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on other bundle spends for eviction (such as when a coin is spent by a block). When a bundle contained only a fast-forward spend, it was not evicted after the singleton was melted.\n\n* 2. Fast-forward spends enter the mempool even if their coin is already spent. During block formation, they fast-forward to the latest singleton version. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;however&#x27; is not approved; use &#x27;but&#x27;\">However</mark>, validation did not <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;confirm&#x27; is not approved; use &#x27;check&#x27;\">confirm</mark> the singleton still existed. This accepted singleton spends into the mempool for melted singletons that no longer exist.\n\n* 3. During block formation, fast-forward spends updated to spend <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N5: multi-word noun &#x27;most recent singleton coin&#x27; over 3 words\">the</mark> most <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> singleton coin. This update occurred in place, changing the mempool and propagating the fast-forwarded versions to the network. Mempool items duplicated (doubled) each time a farmer formed a block.\n\nWith these three bugs, someone submitting a singleton spend eligible for fast forward without bundling it with other spends would:\n\n* Be accepted as <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark>, enter the mempool, and propagate across the network.\n* Multiply each time a farmer created a block, propagating new transactions across the network (<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 3).\n* Melt the singleton to stop the <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;spread&#x27; is not approved; use &#x27;range&#x27;\">spread</mark>, but the spends were not evicted from the mempool (<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> 2). In this scenario, the mempool <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;filled&#x27; is not approved; use &#x27;full&#x27;\">filled</mark> with these spends. All failed during block creation, causing farmers to timeout before finding <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;valid&#x27; is not approved; use &#x27;correct&#x27;\">valid</mark> transactions.\n* Experience performance issues when creating blocks with affected mempool items, causing farmers to miss the block inclusion deadline.\n\n## Timeline (all times PST) 02/13/2025\u201302/19/2025. Times are approximate.\n\n02-13-2025 11:00 pm \u2014 Mempool spendbundle count began increasing slowly.\n\n02-14-2025 11:30 am \u2014 Mempool cost reached maximum.\n\n02-14-2025 1:10 pm \u2014 Mempool spendbundle count plateaued at ~6200.\n\n02-14-2025 4:45 pm <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Chia blockchain netspace started decreasing and timelord infused blocks per minute dropped significantly.\n\n02-14-2025 11:00 pm <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> CNI diagnosed the cause and <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;prepared&#x27; is not approved; use &#x27;ready&#x27;\">prepared</mark> a hotfix release.\n\n02-15-2025 1:30 am \u2014 Hotfix release build process started.\n\n02-15-2025 3:00 am \u2014 Hotfix release deployment completed as version 2.5.1.\n\n02-19-2025 3:15 pm <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Version 2.5.2 released with <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;bug&#x27; is not approved; use &#x27;defect&#x27;\">bug</mark> fixes for the fast forward issues detailed in the Issue Summary.\n\n## Resolution and Recovery\n\nBecause the Chia blockchain is decentralized with varied node configurations and versions, <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;the majority of&#x27; is not approved; use &#x27;most&#x27;\">the</mark> majority of the blockchain netspace was unaffected by the fast forward issues.\n\nVersion 2.5.1 contains <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N5: multi-word noun &#x27;workaround capping unfinished block creation time&#x27; over 3 words\">a</mark> workaround capping unfinished block creation time to <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;ensure&#x27; is not approved; use &#x27;make sure&#x27;\">ensure</mark> timely timelord delivery. Blockchain netspace began recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 included fixes that invalidated mempool items from the fast forward issues. These items cleared from the mempool as users adopted v2.5.2.\n\n* 1. SpendBundles submitted to the mempool containing only fast-forward spends are rejected.\n\n* 2. When a spend is rebased on the latest singleton version, the mempool item is not updated, preventing <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G7: nominalization &#x27;distribution of&#x27;; use a verb\">distribution</mark> of the new copy to the network.\n\n* 3. <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N2: description is 27 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;confirm&#x27; is not approved; use &#x27;check&#x27;\">confirm</mark> <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N5: multi-word noun &#x27;latest singleton version still&#x27; over 3 words\">the</mark> latest singleton version still exists with the given puzzle hash.", "factLoss": true, "fidelity": {"source_words": 966, "rewrite_words": 744, "findings": [{"kind": "negation", "severity": "critical", "message": "the source negates 8 times, the rewrite 7. A lost negation reverses the meaning."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 669, "findings": [{"rule": "PSTE-V3", "message": "'root cause' is not approved; use 'reason'", "excerpt": "The root cause was bugs in mempool logic around fast-forward spends.", "line": 7, "column": 206, "excerpt_offset": 4, "severity": "MUST", "arbitrated": false, "offset": 517, "token": "root"}, {"rule": "PSTE-V3", "message": "'invalid' is not approved; use 'wrong'", "excerpt": "Fast-forward spends do not become invalid when their coin is spent.", "line": 13, "column": 38, "excerpt_offset": 34, "severity": "MUST", "arbitrated": false, "offset": 1083, "token": "invalid"}, {"rule": "PSTE-V3", "message": "'rely on' is not approved; use 'depend'", "excerpt": "Fast-forward spends rely on other parts of the bundle for eviction (for example, the spend", "line": 13, "column": 147, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 1192, "token": "rely"}, {"rule": "PSTE-V3", "message": "'recent' is not approved; use 'new'", "excerpt": "When the farmer built a block, fast-forward spends updated to spend the most recent coin o", "line": 17, "column": 81, "excerpt_offset": 77, "severity": "MUST", "arbitrated": false, "offset": 1828, "token": "recent"}, {"rule": "PSTE-V3", "message": "'trigger' is not approved; use 'call'", "excerpt": "With these three bugs, someone who submitted a singleton spend eligible for fast-forward w", "line": 19, "column": 137, "excerpt_offset": 136, "severity": "MUST", "arbitrated": false, "offset": 2211, "token": "trigger"}, {"rule": "PSTE-V3", "message": "'valid' is not approved; use 'correct'", "excerpt": "The spend was valid and entered the mempool.", "line": 21, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 2248, "token": "valid"}, {"rule": "PSTE-V3", "message": "'bug' is not approved; use 'defect'", "excerpt": "The new transactions propagated across the network (bug 3).", "line": 22, "column": 111, "excerpt_offset": 52, "severity": "MUST", "arbitrated": false, "offset": 2423, "token": "bug"}, {"rule": "PSTE-V3", "message": "'bug' is not approved; use 'defect'", "excerpt": "Melting the singleton stopped the spend from applying, but did not evict it from the mempo", "line": 23, "column": 97, "excerpt_offset": 94, "severity": "MUST", "arbitrated": false, "offset": 2527, "token": "bug"}, {"rule": "PSTE-V3", "message": "'valid' is not approved; use 'correct'", "excerpt": "Farmers timed out before finding any valid transactions.", "line": 23, "column": 222, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 2652, "token": "valid"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-13-2025 11:00 pm \u2014 Mempool spend bundle count started to increase slowly.", "line": 29, "column": 21, "excerpt_offset": 20, "severity": "SHOULD", "arbitrated": false, "offset": 2930, "token": "\u2014"}, {" files refer to singletons by coin ID, even though the coin ID changes with each state update. Vaults also use fast-forward spends. Because the vault singleton authorizes all coins in it, fast-forward lets multiple vault spends stay in the mempool at once. Farmers deduplicate and rebase them in order as they build blocks.\n\nCNI found three root causes:\n\n1. Fast-forward spends do not become <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;invalid&#x27; is not approved; use &#x27;wrong&#x27;\">invalid</mark> when their coin is spent. They can fast-forward to the latest singleton version. Fast-forward spends <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;rely on&#x27; is not approved; use &#x27;depend&#x27;\">rely</mark> on other parts of the bundle for eviction (for example, the spend bundle that spends that coin). We did not handle the case where a bundle held only a fast-forward spend. After the singleton was melted, the spend was not evicted.\n\n2. Fast-forward spends enter the mempool even if their coin is already spent. When the farmer builds a block, the spend fast-forwards to the latest singleton version. We did not validate that the singleton still exists. We accepted singleton spends into the mempool for singletons that were melted and no longer exist.\n\n3. When the farmer built a block, fast-forward spends updated to spend the most <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;recent&#x27; is not approved; use &#x27;new&#x27;\">recent</mark> coin of the singleton. This update changed the mempool item in place. The mempool propagated the fast-forwarded versions to the rest of the network. The mempool item duplicated (doubled in count) each time a farmer tried to build a block.\n\nWith these three bugs, someone who submitted a singleton spend eligible for fast-forward without bundling it with any other spend would <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;trigger&#x27; is not ap ctice the restore takes a bit of time.  During the\nrestoration, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;critical&#x27; is not approved; use &#x27;important&#x27;\">critical</mark> components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;minor&#x27; is not approved; use &#x27;small&#x27;\">minor</mark>](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;present&#x27; is not approved; use &#x27;current&#x27;\">present</mark>. It can\neither be a snapshot file from a previous backup operation, or from a <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;remaining&#x27; is not approved; use &#x27;other&#x27;\">remaining</mark>\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;utilize&#x27; is not approved; use &#x27;use&#x27;\">utilize</mark> [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;accordingly&#x27; is not approved; use &#x27;so&#x27;\">accordingly</mark>. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;the majority of&#x27; is not approved; use &#x27;most&#x27;\">the</mark> majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan be scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 316, "findings": [{"rule": "PSTE-V3", "message": "'critical' is not approved; use 'important'", "excerpt": "Restoration takes time, and critical components will lose leader lock and restart during t", "line": 9, "column": 170, "excerpt_offset": 28, "severity": "MUST", "arbitrated": false, "offset": 368, "token": "critical"}, {"rule": "PSTE-V3", "message": "'minor' is not approved; use 'small'", "excerpt": "etcd supports restoring from snapshots taken from an etcd process of the same [major.minor", "line": 11, "column": 86, "excerpt_offset": 85, "severity": "MUST", "arbitrated": false, "offset": 528, "token": "minor"}, {"rule": "PSTE-V3", "message": "'remaining' is not approved; use 'other'", "excerpt": "This can be from a previous backup or from a remaining [data directory]( URL", "line": 13, "column": 90, "excerpt_offset": 45, "severity": "MUST", "arbitrated": false, "offset": 772, "token": "remaining"}, {"rule": "PSTE-V3", "message": "'since' is not approved; use 'because'", "excerpt": "Using  CODE     for restoring is **deprecated** since etcd v3.5.x and will be removed in e", "line": 23, "column": 49, "excerpt_offset": 48, "severity": "MUST", "arbitrated": false, "offset": 1212, "token": "since"}, {"rule": "PSTE-V3", "message": "'the majority of' is not approved; use 'most'", "excerpt": "If the majority of etcd members fail permanently, the cluster is considered failed and Kub", "line": 41, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 2383, "token": "the"}], "html": "## Restoring an etcd cluster\n\nIf any API servers are running, do not restore etcd. Instead:\n\n- Stop all API server instances\n- Restore state in all etcd instances\n- Restart all API server instances\n\nKubernetes also recommends restarting components (`kube-scheduler`, `kube-controller-manager`, `kubelet`) to prevent reliance on stale data. Restoration takes time, and <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V3: &#x27;critical&#x27; is not approved; use &#x27;important&#x27;\">critical</mark> components will lose leader lock and restart during this period.\n\netcd supports restoring from snapshots taken from an etcd process of the same [major.<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;minor&#x27; is not approved; use &#x27;small&#x27;\">minor</mark>](https://semver.org/) version. Restoring from a different patch version is also supported. A restore operation recovers data from a failed cluster.\n\nBefore restoring, you need a snapshot file. This can be from a previous backup or from a <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;remaining&#x27; is not approved; use &#x27;other&#x27;\">remaining</mark> [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\nWhen restoring with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use the `--data-dir` option to specify the restore folder:\n\n```shell\netcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\n`&lt;data-dir-location&gt;` is a directory created during restore.\n\nUsing `etcdctl` for restoring is **deprecated** <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> etcd v3.5.x and will be removed in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\nFor reference, here is the `etcdctl` restore syntax:\n\n```shell\nexport ETCDCTL_API=3\netcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nIf `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop etcd before restoring. Otherwise, update the etcd configuration and restart etcd after restoration:\n\n1. Change `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`\n2. Run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both)\n\nFor more information and examples, see [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the restored cluster&#x27;s access URLs changed, reconfigure the Kubernetes API server. Restart Kubernetes API servers with `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace these with the respective IP addresses. If using a load balancer in front of etcd, update it instead.\n\nIf <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;the majority of&#x27; is not approved; use &#x27;most&#
