nerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-09-11\nenvironment: container, evals/Dockerfile.clean\nisolation: |\n  No CLAUDE.md, no plugin, no hook, no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\ngrounding_url: https://raw.githubusercontent.com/godotengine/godot-docs/master/getting_started/step_by_step/signals.rst\ngrounding_licence: MIT\nquestion: |\n  Write a documentation page for signals, its event and callback mechanism in the Godot game engine. A copy of an upstream page for this topic is mounted at /grounding/synth-godot-signals.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# Signals: Godot&#x27;s Event System\n\nSignals are how Godot objects talk to each other without needing to know much about one another. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 38 words, limit 25\">A</mark> node fires off a signal when something noteworthy happens to it <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a button gets clicked, a body enters an area, a timer runs out \u2014 and any number of other nodes can listen for that signal and react. The emitter <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know or care who, if anyone, <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is listening&#x27;\">is</mark> listening.\n\nIf <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> used event systems or the observer pattern in other frameworks, this will feel familiar. The main payoff is **decoupling**: your health bar UI <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need a reference to the player, and the player <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know a health bar exists. The player <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> announces &quot;my health changed,&quot; and whatever cares about that can hook in.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 29 words, limit 25\">Since</mark> Godot 4.0, signals are <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type), so you can pass them around, store them in variables, and connect to them directly instead of juggling string names.\n\n## The basic idea\n\n1. An object **emits** a signal \u2014 think of it as broadcasting an event.\n2. Any number of other objects can **connect** a callback (a method) to that signal beforehand.\n3. When the signal fires, Godot calls every connected callback, passing along whatever arguments the signal carries.\n\nA connection is a one-directional link: `A.some_signal \u2192 B.some_method`. Node A never references node B directly to make this happen<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 the connection lives on the signal itself.\n\n## Connecting through the editor\n\nFor nodes already in your scene tree, the quickest way to wire things up is the **Node dock \u2192 Signals tab**. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N1: instruction is 26 words, limit 20\">Select</mark> a node, and <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> see every signal it can <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> (built-in ones like `pressed` on a `Button`, plus any custom signals defined in its script).\n\nDouble-click a signal and Godot opens a connection dialog. Point it at the target node, and:\n\n- If the target has a script attached, Godot can auto-<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback method for you.\n- By convention, generated callbacks are named `_on_&lt;node_name&gt;_&lt;signal_name&gt;` (GDScript) or `On&lt;NodeName&gt;&lt;SignalName&gt;` (C#) \u2014 <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `_on_button_pressed`.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 36 words, limit 25\">There&#x27;s</mark> also an &quot;Advanced&quot; mode in that dialog that lets you connect to *any* method on *any* node (not <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> ones with attached scripts), pass extra bound arguments, and set connection flags like one-shot or deferred.\n\n<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N2: description is 34 words, limit 25\">The</mark> editor-made connection is stored in the scene file, and a little icon appears in the script&#x27;s gutter next to the callback so you can click it later to <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove the connection.\n\nOne caveat: <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N2: description is 29 words, limit 25\">if</mark> you write your scripts in an external editor, Godot&#x27;s auto-stub-generation on connect <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> kick in <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> need to write the method yourself, or connect <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V3: &#x27;via&#x27; is not approved; use &#x27;through&#x27;\">via</mark> code instead.\n\n## Connecting from code\n\nEditor connections only work for nodes that already exist in a saved scene. Anything you spawn or instantiate at runtime <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dynamically created enemies, procedurally added UI, <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>. \u2014 has to be connected in code.\n\nThe pattern is: get a reference to the signal-emitting object, then call `.connect()` on the signal, passing the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\n<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 28 words, limit 25\">In</mark> GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> no strings involved, so your IDE can autocomplete both the signal name and the callback. In C#, signals map onto C# events, so you hook them up with `+=` (and detach with `-=`).\n\n`_ready()` is the natural place to <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up these connections, <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> it runs once the node and its children are fully in the tree.\n\n### Disconnecting and one-shot connections\n\nYou can <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-G8: phrasal verb &#x27;tear down&#x27;; use &#x27;stop&#x27;\">tear</mark> down a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\n...though this is <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-L2: &#x27;fairly&#x27; carries no information; delete it\">fairly</mark> rare <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> most connections <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> live for the lifetime of both nodes. If you only want a callback to <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> once, pass the `CONNECT_ONE_SHOT` flag instead of manually disconnecting after the first call:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nGDScript lets you suspend a function until a signal fires, using `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nThis is handy for sequencing \u2014 <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. waiting for an animation or a delay without setting up a separate callback method.\n\n## Defining your own signals\n\nSignals <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> for built-in nodes <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you declare custom ones in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nA couple of naming notes: <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-N2: description is 31 words, limit 25\">custom</mark> signals show up in the Signals dock exactly like built-in ones, and by convention <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> named as past-tense events (`health_depleted`, not `deplete_health`) <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> a signal represents something that *already happened*.\n\nTo <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> one, call `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Passing data with a signal\n\nSignals can carry arguments, declared in the signal definition itself:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese declared parameter names are mostly for documentation and editor tooling <mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> they let the Signals dock <mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a matching callback signature for you. Godot <mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-L2: &#x27;actually&#x27; carries no information; delete it\">actually</mark> <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> them at <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> time, so <mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> on you to pass the <mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> values and the <mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback <mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you&#x27;ll run into signals\n\n<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-N3: contraction &#x27;They&#x27;re&#x27;\">They&#x27;re</mark> everywhere in Godot&#x27;s built-in nodes, not <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> UI:\n\n- `Area2D.body_entered` \u2014 something physical entered a detection zone (great for pickups, triggers, hazards).\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, and similar UI signals for value changes, focus, resizing, <mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events as nodes enter or leave the scene tree.\n\n<mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-N2: description is 35 words, limit 25\">Whenever</mark> you catch yourself wanting object A to directly call a method on object B <mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> because something happened in A, <mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually worth asking whether a signal would keep them more loosely coupled instead.\n\n---\n\n<mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-N2: description is 31 words, limit 25\">Let</mark> me know if you&#x27;d like this saved to a <mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-V3: &#x27;specific&#x27; is not approved; use &#x27;exact&#x27;\">specific</mark> file once a write-capab ffset": 39, "severity": "MUST", "arbitrated": false, "offset": 4765, "token": ";"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Godot doesn't enforce them at emit time; you must pass the right values and count:", "line": 144, "column": 173, "excerpt_offset": 39, "severity": "MUST", "arbitrated": false, "offset": 4765, "token": ";"}, {"rule": "PSTE-V3", "message": "'right' is not approved; use 'correct'", "excerpt": "Godot doesn't enforce them at emit time; you must pass the right values and count:", "line": 144, "column": 193, "excerpt_offset": 59, "severity": "MUST", "arbitrated": false, "offset": 4785, "token": "right"}, {"rule": "PSTE-V3", "message": "'throughout' is not approved; use 'across'", "excerpt": "Signals are used throughout Godot's built-in nodes:", "line": 171, "column": 18, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "offset": 5294, "token": "throughout"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Whenever you want object A to call a method on object B because something happened in A, c", "line": 178, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5642, "token": "Whenever"}], "html": "# Signals: Godot&#x27;s Event System\n\nSignals are Godot&#x27;s way of letting objects communicate without tight coupling. When something happens to a node<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>a button press, a collision, a timer completion\u2014it emits a signal. Other nodes can connect callback methods to that signal and react when it fires. The emitter <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> know or care who&#x27;s listening.\n\nThis is the observer pattern. The payoff is **decoupling**: your health bar <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need a player reference, and the player <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> need to know the health bar exists. The player announces &quot;my health changed,&quot; and anything interested hooks in.\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">Since</mark> Godot 4.0, signals are <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type). You can pass them around, store them in variables, and connect directly instead of using string names.\n\n## How signals work\n\n1. An object **emits** a signal\u2014broadcasting an event.\n2. Other objects **connect** a callback method to that signal <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;ahead of&#x27; is not approved; use &#x27;before&#x27;\">ahead</mark> of time.\n3. When the signal fires, Godot calls every connected callback with the signal&#x27;s arguments.\n\nA connection is one-directional: `A.some_signal \u2192 B.some_method`. Node A never directly references node B.\n\n## Connecting in the editor\n\nFor nodes in your scene tree, use the **Node dock \u2192 Signals tab**. Select a node to see its signals (built-in ones like `pressed` on `Button`, plus any custom signals from its script).\n\nDouble-click a signal to open the connection dialog. Point it at a target node:\n\n- If the target has a script, Godot can <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback.\n- Generated callbacks follow the pattern `_on_&lt;node_name&gt;_&lt;signal_name&gt;` (GDScript) or `On&lt;NodeName&gt;&lt;SignalName&gt;` (C#)\u2014for example, `_on_button_pressed`.\n\nAn &quot;Advanced&quot; mode lets you connect to any method on any node, bind extra arguments, and set flags like one-shot or deferred.\n\nThe connection is stored in the scene file, and a gutter icon appears next to the callback method for inspection or removal later.\n\nNote: if you use an external editor, auto-stub generation <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> work<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>write the method yourself or connect in code.\n\n## Connecting from code\n\nRuntime-spawned nodes (dynamic enemies, procedural UI) must connect in code.\n\nGet a reference to the signal-emitting object, then call `.connect()` on the signal with the callback:\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\nIn GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>no strings, so your IDE autocompletes both signal and callback. In C#, signals become C# events<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> hook them with `+=` and detach with `-=`.\n\n`_ready()` is the natural place to <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up connections, <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> it runs once the node and children are in the tree.\n\n### Disconnecting and one-shot connections\n\nRemove a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is rare<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>most connections live as long as both nodes do. For a callback to <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> only once, pass the `CONNECT_ONE_SHOT` flag:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Awaiting a signal\n\nGDScript can suspend a function until a signal fires using `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nUseful for sequencing<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>waiting for an animation or delay without a separate callback method.\n\n## Defining custom signals\n\nDeclare custom signals in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nCustom signals appear in the Signals dock like built-in ones. By convention, name them as past-tense events (`health_depleted`, not `deplete_health`) <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">since</mark> a signal represents something that already happened.\n\n<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">Fire</mark> a signal with `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Signals with data\n\nSignals can carry arguments, declared in the signal definition:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nDeclared parameter names exist for documentation and editor tooling<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark>they let the Signals dock <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> matching callback signatures. Godot <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> them at <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> time<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">;</mark> you must pass the <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> values and count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nConnected callbacks need matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Common signals\n\nSignals are used <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-V3: &#x27;throughout&#x27; is not approved; use &#x27;across&#x27;\">throughout</mark> Godot&#x27;s built-in nodes:\n\n- `Area2D.body_entered`\u2014something physical entered a detection zone (pickups, triggers, hazards).\n- `Timer.timeout`\u2014a countdown finished.\n- `Button.pressed` and similar UI signals for value changes, focus, resizing.\n- `Node.tree_entered` / `tree_exited`\u2014lifecycle events as nodes enter or leave the scene tree.\n\n<mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 27 words, limit 25\">Whenever</mark> you want object A to call a method on object B because something happened in A, consider whether a signal would keep them more loosely coupled.", "factLoss": true, "fidelity": {"source_words": 1101, "rewrite_words": 814, "findings": [{"kind": "unit", "severity": "critical", "message": "'1' became '1 second'. The unit changed."}, {"kind": "unit", "severity": "critical", "message": "'1 second' became '1'. The unit changed."}, {"kind": "negation", "severity": "critical", "message": "the source negates 8 times, the rewrite 6. A lost negation reverses the meaning."}, {"kind": "condition", "severity": "warning", "message": "the source states 17 conditions, the rewrite 11. Check that no condition was dropped."}], "critical": 3, "warnings": 1, "faithful": false}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 607, "findings": [{"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "A node emits a signal when something happens \u2014 a button press, a collision, a timer comple", "line": 3, "column": 124, "excerpt_offset": 45, "severity": "SHOULD", "arbitrated": false, "offset": 156, "token": "\u2014"}, {"rule": "PSTE-V3", "message": "'since' is not approved; use 'because'", "excerpt": "Since Godot 4.0, signals a &#x27; is not approved; use &#x27;because&#x27;\">Since</mark> Godot 4.0, signals are <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (type `Signal`). You can store them in variables and connect to them directly instead of using string names.\n\n## How signals work\n\n1. An object **emits** a signal (broadcasts an event).\n2. Other objects **connect** a callback (a method) to that signal before it fires.\n3. When the signal fires, Godot calls every connected callback and passes the signal&#x27;s arguments.\n\nA connection is one-directional: `A.some_signal \u2192 B.some_method`. Node A never holds a reference to node B.\n\n## Connect in the editor\n\nFor nodes in your scene tree, use the **Node dock \u2192 Signals tab**. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N1: instruction is 23 words, limit 20\">Select</mark> a node and see every signal it can <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> (built-in ones like `pressed` on a `Button`, plus custom signals from its script).\n\nDouble-click a signal to open the connection dialog. Point it at the target node:\n\n- If the target has a script, Godot can auto-<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback.\n- Stub names follow a pattern: `_on_&lt;node_name&gt;_&lt;signal_name&gt;` in GDScript, or `On&lt;NodeName&gt;&lt;SignalName&gt;` in C# (example: `_on_button_pressed`).\n\nThe Advanced mode lets you connect to any method on any node, pass extra bound arguments, and set flags like one-shot or deferred.\n\nThe connection stores in the scene file. A gutter icon appears next to the callback in your script so you can <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove it later.\n\nCaveat: external editors do not <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;trigger&#x27; is not approved; use &#x27;call&#x27;\">trigger</mark> auto-stub generation. Write the method yourself or connect from code.\n\n## Connect from code\n\nEditor connections work for nodes in saved scenes. Anything spawned or instantiated at runtime <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dynamically created enemies, procedural UI \u2014 must connect in code.\n\nGet a reference to the emitter, then call `.connect()` on the signal with the callback:\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\nIn GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method. No strings, so your IDE autocompletes the signal name and callback. In C#, signals are C# events <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> use `+=` to connect and `-=` to disconnect.\n\n`_ready()` is the <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> place to <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up connections. It runs once the node and its children are fully in the tree.\n\n### Disconnect and one-shot connections\n\nRemove a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nThis is rare <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> most connections last as long as both nodes exist. To <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> a callback only once, use the `CONNECT_ONE_SHOT` flag instead of manually disconnecting:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Await a signal\n\nGDScript suspends a function until a signal fires with `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nUse this for sequencing <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> wait for an animation or delay without a separate callback method.\n\n## Define custom signals\n\nDeclare custom signals in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nCustom signals appear in the Signals dock like built-in ones. By convention, name them as past-tense events (`health_depleted`, not `deplete_health`) <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a signal marks something that already happened.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">Emit</mark> with `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Send data with a signal\n\nSignals can carry arguments, declared in the signal definition:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nParameter names exist for documentation and editor tools <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the Signals dock uses them to <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> matching callback signatures. Godot does not <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> them at <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> time. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must pass the <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> values and the <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Signals in built-in nodes\n\nSignals are everywhere in Godot&#x27;s nodes, not <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> UI:\n\n- `Area2D.body_entered` \u2014 something physical entered a detection zone (pickups, triggers, hazards).\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed` and similar UI signals for value changes, focus, resize.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events when nodes enter or leave the scene tree.\n\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N2: description is 28 words, limit 25\">When</mark> you want object A to call a method on object B because something happened in A, consider whether a signal would keep them more loosely coupled instead.", "factLoss": true, "fidelity": {"source_words": 1101, "rewrite_words": 826, "findings": [{"kind": "unit", "severity": "critical", "message": "'1' became '1 second'. The unit changed."}, {"kind": "unit", "severity": "critical", "message": "'1 second' became '1'. The unit changed."}, {"kind": "condition", "severity": "warning", "message": "the source states 17 conditions, the rewrite 11. Check that no condition was dropped."}], "critical": 2, "warnings": 1, "faithful": false}, "semantic": [], "semanticConfirmed": 0}, "pste_fixed": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 618, "findings": [{"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "A button press, a collision, a timer completion \u2014 any of these can trigger it.", "line": 3, "column": 173, "excerpt_offset": 48, "severity": "SHOULD", "arbitrated": false, "offset": 205, "token": "\u2014"}, {"rule": "PSTE-V3", "message": "'trigger' is not approved; use 'call'", "excerpt": "A button press, a collision, a timer completion \u2014 any of these can trigger it.", "line": 3, "column": 192, "excerpt_offset": 67, "severity": "MUST", "arbitrated": false, "offset": 224, "token": "trigger"}, {"rule": "PSTE-V3", "message": "'since' is not approved; use 'because'", "excerpt": "Since Godot 4.0, si ut direct knowledge of each other. A node emits a signal when something happens. A button press, a collision, a timer completion <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> any of these can <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V3: &#x27;trigger&#x27; is not approved; use &#x27;call&#x27;\">trigger</mark> it. Other nodes listen and respond. The emitter does not know or care who listens.\n\nThis is **decoupling**. Your health bar does not need a reference to the player. The player does not need to know the health bar exists. The player announces &quot;health changed,&quot; and anything that cares listens in.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V3: &#x27;since&#x27; is not approved; use &#x27;because&#x27;\">Since</mark> Godot 4.0, signals are values with type `Signal`. You can store them in variables and connect to them directly instead of using string names.\n\n## How signals work\n\n1. An object **emits** a signal (broadcasts an event).\n2. Other objects **connect** a callback (a method) to that signal before it fires.\n3. When the signal fires, Godot calls every connected callback and passes the signal&#x27;s arguments.\n\nA connection is one-directional: `A.some_signal \u2192 B.some_method`. Node A never holds a reference to node B.\n\n## Connect in the editor\n\nFor nodes in your scene tree, use the **Node dock \u2192 Signals tab**. Select a node. See every signal it can <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark>. Built-in ones like `pressed` on a `Button` and custom signals from its script both appear.\n\nDouble-click a signal to open the connection dialog. Point it at the target node:\n\n- If the target has a script, Godot can auto-<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> a stub callback.\n- Stub names follow a pattern: `_on_&lt;node_name&gt;_&lt;signal_name&gt;` in GDScript, or `On&lt;NodeName&gt;&lt;SignalName&gt;` in C# (example: `_on_button_pressed`).\n\nThe Advanced mode lets you connect to any method on any node, pass extra bound arguments, and set flags like one-shot or deferred.\n\nThe connection stores in the scene file. A gutter icon appears next to the callback in your script so you can <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V3: &#x27;inspect&#x27; is not approved; use &#x27;check&#x27;\">inspect</mark> or remove it later.\n\nCaveat: external editors do not <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V3: &#x27;trigger&#x27; is not approved; use &#x27;call&#x27;\">trigger</mark> auto-stub generation. Write the method yourself or connect from code.\n\n## Connect from code\n\nEditor connections work for nodes in saved scenes. Anything spawned or instantiated at runtime must connect in code. Dynamically created enemies and procedural UI are examples.\n\nGet a reference to the emitter, then call `.connect()` on the signal with the callback:\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_timeout():\n    visible = not visible\n```\n\n```csharp\npublic override void _Ready()\n{\n    var timer = GetNode&lt;Timer&gt;(&quot;Timer&quot;);\n    timer.Timeout += OnTimerTimeout;\n}\n\nprivate void OnTimerTimeout()\n{\n    Visible = !Visible;\n}\n```\n\nIn GDScript, `timer.timeout.connect(callable)` treats the signal as an object with a `connect()` method. No strings, so your IDE autocompletes the signal name and callback. In C#, signals are C# events. Use `+=` to connect and `-=` to disconnect.\n\n`_ready()` is the <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> place to install connections. It runs once the node and its children are fully in the tree.\n\n### Disconnect and one-shot connections\n\nRemove a connection with `disconnect()`:\n\n```gdscript\ntimer.timeout.disconnect(_on_timer_timeout)\n```\n\nMost connections last as long as both nodes exist. This is rare to remove them manually. To <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V3: &#x27;fire&#x27; is not approved; use &#x27;raise&#x27;\">fire</mark> a callback only once, use the `CONNECT_ONE_SHOT` flag instead of manually disconnecting:\n\n```gdscript\ntimer.timeout.connect(_on_timer_timeout, CONNECT_ONE_SHOT)\n```\n\n### Await a signal\n\nGDScript suspends a function until a signal fires with `await`:\n\n```gdscript\nawait timer.timeout\nprint(&quot;timer finished&quot;)\n```\n\nUse this for sequencing. Wait for an animation or delay without a separate callback method.\n\n## Define custom signals\n\nDeclare custom signals in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nCustom signals appear in the Signals dock like built-in ones. By convention, name them as past-tense events. Write `health_depleted`, not `deplete_health`. A signal marks something that already happened.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">Emit</mark> with `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Send data with a signal\n\nSignals can carry arguments, declared in the signal definition:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nParameter names exist for documentation and editor tools. The Signals dock uses them to <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V3: &#x27;generate&#x27; is not approved; use &#x27;create&#x27;\">generate</mark> matching callback signatures. Godot does not <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V3: &#x27;enforce&#x27; is not approved; use &#x27;apply&#x27;\">enforce</mark> them at <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V3: &#x27;emit&#x27; is not approved; use &#x27;raise&#x27;\">emit</mark> time. Pass the <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> values and the <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V3: &#x27;right&#x27; is not approved; use &#x27;correct&#x27;\">right</mark> count:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nAny connected callback needs matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Signals in built-in nodes\n\nSignals are everywhere in Godot&#x27;s nodes, not <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-L2: &#x27;just&#x27; carries no information; delete it\">just</mark> UI:\n\n- `Area2D.body_entered` \u2014 something physical entered a detection zone (pickups, triggers, hazards).\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed` and similar UI signals for value changes, focus, resize.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events when nodes enter or leave the scene tree.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 28 words, limit 25\">When</mark> you want object A to call a method on object B because something happened in A, check whether a signal would keep them more loosely coupled instead.", "factLoss": true, "fidelity": {"source_words": 1101, "rewrite_words": 836, "findings": [{"kind": "unit", "severity": "critical", "message": "'1' became '1 second'. The unit changed."}, {"kind": "unit", "severity": "critical", "message": "'1 second' became '1'. The unit changed."}, {"kind": "condition", "severity": "warning", "message": "the source states 17 conditions, the rewrite 11. Check that no condition was dropped."}], "critical": 2, "warnings": 1, "faithful": false}, "semantic": [], "semanticConfirmed": 0}}, "passes": {}}}};
const pick = document.getElementById("pick");
const grid = document.getElementById("grid");
const meta = document.getElementById("meta");
const prov = document.getElementById("prov");
const ask = document.getElementById("ask");
const overviewPane = document.getElementById("overview");
const docpick = document.getElementById("docpick");
const tabOverview = document.getElementById("tab-overview");
const tabDocuments = document.getElementById("tab-documents");
const ids = Object.keys(DATA.results);

prov.textContent = DATA.git && DATA.git.short
  ? DATA.source + "  \u2014  commit " + DATA.git.short
      + " on " + (DATA.git.branch || "?")
  : DATA.source + "  \u2014  no provenance recorded";

for (const id of ids) {
  const o = document.createElement("option");
  o.value = id;
  o.textContent = id + "  (" + DATA.results[id].category + ")";
  pick.append(o);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

const STATUS_LABEL = {
  confirmed: "confirmed", "low-agreement": "low agreement", rejected: "rejected",
};

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also
// need reasons").
function semanticSectionHtml(a) {
  if (a.unjudged) {
    return `<div class="offenders semantic unjudged"><h3>Judge findings (semantic_lint.py)</h3>
        <p class="hint unjudged-note">UNJUDGED. The judge call for this cell failed and
        returned no result — an API limit is the usual cause. This is not "no
        findings": 52 of the standard's 77 rules need a judge, and none of them
        were checked here. Re-run the judge for this cell before treating it as
        clean.</p>
      </div>`;
  }
  const rows = a.semantic || [];
  if (!rows.length) return "";
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span></span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed").length;
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>
      <p class="hint">A model read this text for what a regular expression cannot
      check. ${confirmedN} of ${rows.length} row(s) are CONFIRMED (agreement at or
      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.</p>
      <ol>${items}</ol>
    </div>`;
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    // UNJUDGED is its own verdict, not a FAIL among others: the judging call
    // for this cell failed outright (an API limit, most often), so 52 of the
    // standard's 77 rules were never checked. It must never look like PASS
    // (a document the judge read and found clean) or an ordinary FAIL (one
    // the judge did check and objected to).
    const verdict = a.unjudged
      ? '<span class="verdict unjudged" title="the judge call for this cell '
        + 'failed and never returned a result. Mechanical and fact-loss checks '
        + 'still ran, but 52 of the standard’s 77 rules need a judge and '
        + 'were never checked. This is not a pass.">UNJUDGED</span>'
      : a.pass
        ? '<span class="verdict pass">PASS</span>'
        : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

// ---- Overview -------------------------------------------------------------

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);
  bits.push("<b>passes</b>" + r.passes);
  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);
  bits.push("<b>level</b>" + DATA.level);
  if (r.sourceModels && r.sourceModels.length)
    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
  if (r.failures) bits.push('<b>failures</b><span class="cell-fail">'
      + r.failures + "</span>");
  // PER-STAGE METERING (run.py PART 1): which half of the run burned the
  // budget. Absent on a result written before this existed.
  if (r.stages && r.stages.generation) bits.push("<b>generation</b>"
      + r.stages.generation.calls + " calls, " + r.stages.generation.seconds + "s");
  if (r.stages && r.stages.judging) bits.push("<b>judging</b>"
      + r.stages.judging.calls + " calls, " + r.stages.judging.seconds + "s");
  // JUDGE SAMPLING (run.py PART 2): which documents were judged this run.
  // Absent on a result written before sampling existed, or `judge_all`.
  const js = DATA.judgeSample || {};
  if (js.judge_all) {
    bits.push("<b>judged</b>all documents (--judge-all)");
  } else if (js.anchor_docs && js.anchor_docs.length) {
    bits.push("<b>anchors</b>" + esc(js.anchor_docs.join(", ")));
    bits.push("<b>rotating</b>" + esc((js.rotating_docs || []).join(", "))
      + " (offset " + js.rotation_offset + ")");
  }

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    // ANCHOR/ROTATING (run.py PART 2): which documents the judge looked at
    // this run, and why. An anchor is judged every run, for loop-over-loop
    // comparability; a rotating document is this run's coverage slice. A row
    // with neither badge was sampled out — its cells below say so.
    const sampleBadge = row.anchor
      ? ' <span class="verdict anchor" title="judged every run, for '
        + 'loop-over-loop comparability">ANCHOR</span>'
      : row.rotating
      ? ' <span class="verdict rotating" title="this run’s rotating '
        + 'coverage slice">ROTATING</span>'
      : "";
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + sampleBadge + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      // Every pass, and the share of them that conform. One draw cannot separate a
      // real change from ordinary variance, so the runs are shown beside the count.
      let sub = c.rules + " rule" + (c.rules === 1 ? "" : "s");
      if (c.of > 1) {
        sub += ' <span class="rate">' + c.passed + "/" + c.of + " pass "
             + c.rate + "%</span>"
             + '<div class="runs">' + c.runs.join(" \u00b7 ") + "</div>";
      }
      // Fact loss reads apart from the conformance count: a clean-but-lossy
      // cell (0 findings, factLoss true) must not look like a plain PASS, and
      // a lossy-and-non-conforming cell must show both, not just one number.
      const factTag = c.factLoss
        ? ' <span class="verdict factloss" title="faithfulness.py: a fact from '
          + 'the source is missing. Detects dropped tokens, not changed '
          + 'meaning.">FACT LOSS</span>'
        : "";
      // A CONFIRMED judge finding (semantic_lint.py) fails the verdict the same
      // way fact loss does. Low-agreement and rejected rows never do — they are
      // audit material, visible only on the document view.
      const semTag = c.semanticConfirmed
        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      // SAMPLED_OUT vs UNJUDGED: not selected by design reads differently
      // from a judge call that was made and failed. Both still force
      // pass=False (build_entry) — neither has actually been checked — but
      // conflating "we chose not to ask" with "we asked and got nothing" is
      // exactly the confusion this cell must not create.
      const semSub = c.sampledOut
        ? '<div class="cell-sub sampled-out-note">not judged this run — sampled out</div>'
        : c.unjudged
        ? '<div class="cell-sub unjudged-note">judge call failed — not checked</div>'
        : c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";
      // UNJUDGED gets its own cell class and label: it must never look like a
      // FAIL (the judge ran and objected) or a PASS (the judge ran and found
      // nothing). `c.pass` is already False for these (build_entry forces it),
      // this only controls how the cell reads visually. SAMPLED_OUT reuses
      // the same class (it is still not a pass and not a fail) but its own
      // label and tooltip, so "excluded by design" reads apart from
      // "the judge tried and failed" at a glance.
      const cellClass = c.unjudged ? "cell-unjudged" : (c.pass ? "cell-pass" : "cell-fail");
      const cellLabel = c.sampledOut ? "NOT JUDGED"
        : c.unjudged ? "UNJUDGED" : (c.pass ? "PASS" : c.findings);
      const cellTitle = c.sampledOut
        ? "not selected for judging this run (rotate-and-anchor sampling). "
          + "Not a failure — a deliberate coverage decision. Not a pass either: "
          + "this text was never checked against the semantic rules."
        : c.unjudged
        ? "the judge call for this cell failed and returned no result. Not a "
          + "pass — it was never checked."
        : "";
      body += '<td class="' + cellClass + win + '" title="' + cellTitle + '">'
            + cellLabel + factTag + semTag
            + '<div class="cell-sub">' + sub + "</div>" + semSub
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  // Real documents and synthetic ones are totalled separately, and both stay
  // visible. Real is the headline: it is what generalises to writing this
  // project did not itself produce. Synthetic is secondary, not hidden.
  function totalRow(label, totals) {
    let row = '<tr><td class="doc">' + esc(label) + "</td>";
    for (const a of arms) {
      const t = totals[a] || {pass:0,total:0,findings:0,runPass:0,runTotal:0,factLoss:0,semanticConfirmed:0,unjudged:0,sampledOut:0};
      if (!t.total) { row += "<td>-</td>"; continue; }
      let f = t.pass + "/" + t.total + " docs";
      if (t.runTotal > t.total) {
        f += '<div class="rate">' + t.runPass + "/" + t.runTotal + " runs "
           + Math.round(t.runPass * 100 / t.runTotal) + "%</div>";
      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      if (t.sampledOut) {
        f += '<div class="verdict sampled-out" title="not selected for '
           + 'judging this run (rotate-and-anchor sampling). A deliberate '
           + 'coverage decision, not a failure — and not a pass either.">'
           + t.sampledOut + " not judged</div>";
      }
      // A cell whose judge call actually failed, separate from one sampled
      // out by design: this count excludes the sampled-out cells above.
      const failedJudge = t.unjudged - t.sampledOut;
      if (failedJudge > 0) {
        f += '<div class="verdict unjudged" title="the judge call failed for '
           + 'these cells and never returned a result. Not passes — they were '
           + 'never checked.">' + failedJudge + " unjudged</div>";
      }
      row += "<td>" + t.findings + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth)
             // ANCHOR/ROTATING (run.py PART 2), independent of real/synthetic
             // — see overview()'s docstring. This is the row that shows
             // overfitting directly: if the anchor total's judge-confirmed
             // count improves run over run while the rotating total does not,
             // the skill is being tuned to the two documents graded every
             // time and not to the standard in general.
             + (Object.keys(o.totalsAnchor).length
                 ? totalRow("TOTAL (judged: anchor)", o.totalsAnchor) : "")
             + (Object.keys(o.totalsRotating).length
                 ? totalRow("TOTAL (judged: rotating)", o.totalsRotating) : "");

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. FACT LOSS marks a cell where faithfulness.py found a number, unit, "
    + "identifier, negation, or obligation missing against the source (PSTE-A1) "
    + "— that check catches dropped tokens, not changed meaning, so its "
    + "absence is not proof the rewrite is faithful. The green outline marks the "
    + "arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
</body>
</html>
