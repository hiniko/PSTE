e snapshot.db\n```\n\nHere `&lt;data-dir-location&gt;` is a directory that the restore creates.\n\n`etcdctl` restore is **deprecated** since etcd v3.5.x. etcd v3.6 will remove it. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\nThis example shows the restore with the `etcdctl` tool:\n\n```shell\nexport ETCDCTL_API=3\netcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nIf `&lt;data-dir-location&gt;` is the same folder as before, delete the folder and stop the etcd process before you restore the cluster. Otherwise, change the etcd configuration and restart the etcd process after the restore, so that it uses the new data directory:\n\n1. Change `volumes.hostPath.path` for `name: etcd-data` in `/etc/kubernetes/manifests/etcd.yaml` to `&lt;data-dir-location&gt;`.\n2. Run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service`, or both.\n\nFor more information and examples about a restore from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the access URLs of the restored cluster differ from the previous cluster, you must reconfigure the Kubernetes API server. In this case, restart the Kubernetes API servers with the flag `--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you may need to update the load balancer instead.\n\nIf the majority of etcd members fail permanently, the etcd cluster counts as failed. Kubernetes then cannot change its current state. The scheduled pods can continue to run, but nothing can schedule a new pod. In this case, recover the etcd cluster and reconfigure the Kubernetes API servers if needed.\n\n## Upgrade an etcd cluster\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details about an etcd upgrade, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintain an etcd cluster\n\nFor more details about etcd maintenance, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.", "factLoss": false, "fidelity": {"source_words": 595, "rewrite_words": 547, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-W1", "quote": "delete the folder and stop the etcd process before you restore", "problem": "The text instructs the reader to delete a directory, an irreversible data-destroying action, with no warning stated beforehand.", "fix": "Add a warning sentence before the instruction, e.g. \"Warning: this permanently removes any data in `<data-dir-location>`.\"", "reason": "PSTE-W1 requires a warning before any operation that destroys data or cannot be reversed, and deleting a data directory is exactly that operation.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 34, "column": 56, "offset": 1679}, {"rule": "PSTE-P2", "quote": "when you restore with etcdutl", "problem": "The condition clause is placed after the instruction instead of before it, and is not separated from the command by a comma.", "fix": "State the condition first: \"When you restore with etcdutl, use the --data-dir option to name the folder that receives the restored cluster.\"", "reason": "The original placed this exact condition first (\"When restoring the cluster using etcdutl, use the --data-dir option...\"), matching the rule's own example pattern (\"If the build fails, read the log\"); the rewrite reversed that order.", "confidence": "high", "status": "confirmed", "seenIn": 4, "of": 5, "agreement": 0.8, "located": true, "line": 17, "column": 83, "offset": 1048}, {"rule": "PSTE-V6", "quote": "A restore recovers the data of a failed cluster.", "problem": "\"restore\" is a term ver nts as failed", "problem": "\"count\" is used to mean \"is regarded as,\" not its approved meaning.", "fix": "Write \"the etcd cluster is considered failed\" or another approved phrasing for that meaning.", "reason": "Appendix A defines the approved word \"count\" only as a verb meaning \"to find the total number of items in a set,\" not \"to be regarded as.\"", "confidence": "high", "status": "low-agreement", "seenIn": 1, "of": 5, "agreement": 0.2, "located": true, "line": 43, "column": 51, "offset": 2830}, {"rule": "PSTE-V2", "quote": "while any API server runs in your cluster", "problem": "", "fix": "", "reason": "The approved meaning of \"run\" (\"to cause a program or a process to operate\") still holds in substance, since an API server running is that program operating, despite the intransitive phrasing.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-V2", "quote": "the folder that receives the restored cluster", "problem": "", "fix": "", "reason": "This matches the approved meaning of \"receive\" (\"to get something that another thing sends\"), since the restore process sends the cluster's data into that folder.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-V6", "quote": "The restore takes some time.", "problem": "", "fix": "", "reason": "\"Restore\" used as a noun is standard idiomatic English in this domain (as in \"backup and restore\"), not a strained term-verb-to-noun conversion like the spec's \"did a deploy\" example.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-W2", "quote": "delete the folder and stop the etcd process before you restore", "problem": "The scope of what deleting the folder affects (the current contents of `<data-dir-location>`) is never stated before the delete command is given.", "fix": "State the scope first, e.g. \"This removes all current data in `<data-dir-location>`. Delete the folder and stop the etcd process...\"", "reason": "PSTE-W2 requires the scope of the effect to be stated before the command, matching the spec's own example of stating what a deletion affects before issuing it.", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 5, "agreement": 0.2, "located": true, "line": 34, "column": 56, "offset": 1679}], "semanticConfirmed": 3}}, "passes": {"control": {"findings": [2, 2, 2], "passed": 0, "of": 3, "rate": 0, "mean": 2.0}, "pste": {"findings": [0, 2, 0], "passed": 2, "of": 3, "rate": 67, "mean": 0.7}}}, "runbook-cassandra-repair": {"category": "runbook", "title": "Repair", "prompt": "", "attribution": "Rewritten from \"Repair\" by The Apache Cassandra project, used under Apache-2.0. Source: https://raw.githubusercontent.com/apache/cassandra/trunk/doc/modules/cassandra/pages/managing/operating/repair.adoc. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/apache/cassandra/trunk/doc/modules/cassandra/pages/managing/operating/repair.adoc", "author": "The Apache Cassandra project", "licence": "Apache-2.0", "licenceUrl": "https://www.apache.org/licenses/LICENSE-2.0", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 605, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "Incremental repairs are the default repair type, and if run regularly,\ncan significantly r", "line": 8, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 276, "token": "Incremental"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "However, it's important to understand that once an incremental repair", "line": 10, "column": 10, "excerpt_offset": 9, "severity": "MUST", "arbitrated": false, "offset": 426, "token": "it's"}, {"rule": "PSTE-N3", "message": "contraction 'won't'", "excerpt": "marks data as repaired, it won't try to repair it again.", "line": 11, "column": 28, "excerpt_offset": 27, "severity": "MUST", "arbitrated": false, "offset": 514, "token": "won't"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "for syncing up missed writes, but it doesn't protect against things like", "line": 12, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 594, "token": "doesn't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "this reason, full repairs should still be run occasionally.", "line": 14, "column": 27, "excerpt_offset": 26, "severity": "MUST", "arbitrated": false, "offset": 728, "token": "should"}, {"rule": "PSTE-G7", "message": "nominalization 'introduction of'; use a verb", "excerpt": "The introduction of this feature does not interfere with existing repair", "line": 25, "column": 5, "excerpt_offset": 4, "severity": "MUST", "arbitrated": true, "offset": 1123, "token": "introduction"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "The repair command repairs token ranges only on the node being repaired; it does not repai", "line": 61, "column": 72, "excerpt_offset": 71, "severity": "MUST", "arbitrated": false, "offset": 1847, "token": ";"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "By default, repair operates on all token ranges replicated by the node on which repair is ", "line": 62, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1887, "token": "By"}, {"rule": "PSTE-N1", "message": "instruction is 28 words, limit 20", "excerpt": "Do a full cluster repair by running the  CODE                 command on each node in each", "line": 63, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2129, "token": "Do"}, {"rule": "PSTE-G1", "message": "passive voice 'are repaired'; name the actor", "excerpt": "Do a full cluster repair by running the  CODE                 command on each node in each", "line": 63, "column": 158, "excerpt_offset": 157, "severity": "MUST", "arbitrated": false, "offset": 2286, "token": "are"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "The specific frequency of repair that's right for your cluster, of\ncourse, depends on seve", "line": 65, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2302, "token": "The"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "However, if you're just starting out", "line": 66, "column": 49, "excerpt_offset": 12, "severity": "MUST", "arbitrated": false, "offset": 2417, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "you don't want to run incremental repairs, a full repair every 5 days is", "line": 69, "column": 5, "excerpt_offset": 4, "severity": "MUST", "arbitrated": false, "offset": 2589, "token": "don't"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "At a minimum, repair should be run often enough that the gc grace period\nnever expires on ", "line": 72, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2682, "token": "At"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "At a minimum, repair should be run often enough that the gc grace period", "line": 72, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "offset": 2703, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With a default gc grace period of 10 days, repairing every", "line": 74, "column": 16, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "offset": 2834, "token": "a"}, {"rule": "PSTE-D2", "message": "paragraph has 22 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 80, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3025, "token": "-pr"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "data, but doesn't do any streaming.", "line": 93, "column": 13, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 3716, "token": "doesn't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "a full repair should be run.", "line": 95, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 3849, "token": "should"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full repairs, and incremental repairs.\nFull repairs operate over all of the data in the token range being\nrepaired. Incremental repairs only repair data that&#x27;s been written since\nthe previous incremental repair.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">Incremental</mark> repairs are the default repair type, and if run regularly,\ncan significantly reduce the time and io cost of performing a repair.\nHowever, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> important to understand that once an incremental repair\nmarks data as repaired, it <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> try to repair it again. This is fine\nfor syncing up missed writes, but it <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> protect against things like\ndisk corruption, data loss by operator error, or bugs in Cassandra. For\nthis reason, full repairs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> still be run occasionally.\n\n== Automated Repair Scheduling\n\nSince repair can result in a lot of disk and network io, it has\ntraditionally not been run automatically by Cassandra.\n\nIn the latest version of Cassandra, a new feature called\nxref:managing/operating/auto_repair.adoc[auto repair] was introduced to\nallow Cassandra to submit and manage repairs automatically on a schedule.\n\nThe <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G7: nominalization &#x27;introduction of&#x27;; use a verb\">introduction</mark> of this feature does not interfere with existing repair\nfunctionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nRepairs can also be run by the operator via nodetool.\n\nIncremental repair is the default and is run with the following command:\n\n[source,none]\n----\nnodetool repair\n----\n\nA full repair can be run with the following command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nAdditionally, repair can be run on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr even on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node being repaired<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it does not repair the whole cluster.\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">By</mark> default, repair operates on all token ranges replicated by the node on which repair is run, causing duplicate work when running it on every node. Avoid duplicate work by using the `-pr` flag to repair only the &quot;primary&quot; ranges on a node. \n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N1: instruction is 28 words, limit 20\">Do</mark> a full cluster repair by running the `nodetool repair -pr` command on each node in each datacenter in the cluster, until all of the nodes and datacenters <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;are repaired&#x27;; name the actor\">are</mark> repaired. \n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> specific frequency of repair that&#x27;s right for your cluster, of\ncourse, depends on several factors. However, if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out\nand looking for somewhere to start, running an incremental repair every\n1-3 days, and a full repair every 1-3 weeks is probably reasonable. If\nyou <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to run incremental repairs, a full repair every 5 days is\na good place to start.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">At</mark> a minimum, repair <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run often enough that the gc grace period\nnever expires on unrepaired data. Otherwise, deleted data could\nreappear. With <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">a</mark> default gc grace period of 10 days, repairing every\nnode in your cluster at least once every 7 days will prevent this, while\nproviding enough slack to allow for delays.\n\n== Other Options\n\n`<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 22 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being\n  repaired. A primary range is just a token range for which a node is\n  the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that would occur for the given\n  repair command. This builds the merkle trees, and prints the expected\n  streaming activity, but does not actually do any streaming. By\n  default, incremental repairs are estimated, add the `--full` flag to\n  estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Similar\n  to `--preview`, this builds and compares merkle trees of repaired\n  data, but <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> do any streaming. This is useful for\n  troubleshooting. If this shows that the repaired data is out of sync,\n  a full repair <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 463, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "Incremental repair is the default. Run regularly, it cuts the time and io cost of repair s", "line": 5, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 233, "token": "Incremental"}, {"rule": "PSTE-N3", "message": "contraction 'won't'", "excerpt": "It won't catch disk corruption, data loss from operator error, or Cassandra bugs.", "line": 5, "column": 251, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 483, "token": "won't"}, {"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "At a minimum, repair often enough that the gc grace period never expires on unrepaired dat", "line": 51, "column": 40, "excerpt_offset": 39, "severity": "MUST", "arbitrated": true, "offset": 2112, "token": "the"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "At a minimum, repair often enough that the gc grace period never expires on unrepaired dat", "line": 51, "column": 93, "excerpt_offset": 92, "severity": "SHOULD", "arbitrated": false, "offset": 2165, "token": "\u2014"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With the default gc grace period of 10 days, repairing every node at least once every 7 da", "line": 51, "column": 139, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "offset": 2211, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 55, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2362, "token": "-pr"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Incremental repairs are estimated by default; add  CODE    to estimate a full repair.", "line": 58, "column": 206, "excerpt_offset": 44, "severity": "MUST", "arbitrated": false, "offset": 2778, "token": ";"}], "html": "== Full and Incremental Repairs\n\nCassandra has 2 repair types: full and incremental. A full repair covers all data in the token range being repaired. An incremental repair covers only data written since the last incremental repair.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Incremental</mark> repair is the default. Run regularly, it cuts the time and io cost of repair significantly. But note the tradeoff: once an incremental repair marks data as repaired, it never revisits that data. That&#x27;s fine for catching missed writes. It <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> catch disk corruption, data loss from operator error, or Cassandra bugs. So still run full repairs occasionally.\n\n== Automated Repair Scheduling\n\nRepair drives a lot of disk and network io, so Cassandra has traditionally not run it automatically.\n\nThe latest version of Cassandra adds xref:managing/operating/auto_repair.adoc[auto repair], which lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with existing nodetool-driven repair.\n\n== Submitting Repairs Using Nodetool\n\nOperators can also run repairs via nodetool.\n\nIncremental repair is the default:\n\n[source,none]\n----\nnodetool repair\n----\n\nFull repair:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nA single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nSpecific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs token ranges only on the node being repaired, not the whole cluster. By default it operates on every token range replicated by that node, which duplicates work when you run it on every node. Use the `-pr` flag to repair only the node&#x27;s &quot;primary&quot; ranges and avoid that duplication. To repair the whole cluster, run `nodetool repair -pr` on each node in each datacenter until every node and datacenter is done.\n\nThe right repair frequency depends on several factors. As a starting point: an incremental repair every 1-3 days, plus a full repair every 1-3 weeks. If you&#x27;d rather skip incremental repairs, a full repair every 5 days is a good place to start.\n\nAt a minimum, repair often enough that <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> otherwise deleted data could reappear. With <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">the</mark> default gc grace period of 10 days, repairing every node at least once every 7 days prevents this and leaves slack for delays.\n\n== Other Options\n\n`<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being repaired. A primary range is a token range for which the node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates how much streaming the given repair command would cause. It builds the merkle trees and prints the expected streaming activity, but streams nothing. Incremental repairs are estimated by default<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> add `--full` to estimate a full repair.\n`-vd, --validate`::\n  Verifies that repaired data is the same across all nodes. Like `--preview`, it builds and compares merkle trees of repaired data without streaming. Useful for troubleshooting. If it shows repaired data out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": false, "fidelity": {"source_words": 628, "rewrite_words": 483, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 9 conditions, the rewrite 6. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "repairing every node at least once every 7 days", "problem": "The original scopes this to \"every node in your cluster\"; the rewrite drops \"in your cluster\", losing the qualifier that ties the 7-day interval to the reader's own cluster.", "fix": "Write \"repairing every node in your cluster at least once every 7 days\".", "reason": "PSTE-A us": "low-agreement", "seenIn": 1, "of": 5, "agreement": 0.2, "located": true, "line": 58, "column": 162, "offset": 2734}, {"rule": "PSTE-G3", "quote": "the node being repaired", "problem": "", "fix": "", "reason": "This present participle functions as an adjective in a reduced relative clause modifying 'node,' not as the main verb of any clause, so PSTE-G3's list of permitted main-verb forms does not govern it.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-G9", "quote": "Full repair:", "problem": "The singular noun 'repair' has no article, unlike the parallel label 'A single keyspace:' used two examples later.", "fix": "Write 'A full repair:'.", "reason": "PSTE-G9 requires an article before a noun where grammar permits one, and a parallel heading in the same list already uses one.", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 5, "agreement": 0.2, "located": true, "line": 26, "column": 1, "offset": 1138}, {"rule": "PSTE-L3", "quote": "So still run full repairs occasionally.", "problem": "", "fix": "", "reason": "This paragraph builds an explanation toward a closing recommendation, which is normal expository order for documentation rather than a direct answer to a question that PSTE-L3 targets.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-L4", "quote": "Incremental repair is the default", "problem": "", "fix": "", "reason": "Stating this once in the conceptual overview and again right before the nodetool command is deliberate signposting for a reader who jumps straight to the command-reference section, not a redundant restatement of the same point in nearby prose.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-N5", "quote": "default gc grace period", "problem": "", "fix": "", "reason": "\"gc grace period\" functions as a single fixed technical term and \"default\" is an ordinary preceding adjective distinguishing it from a configured value; splitting it would either lose that qualifier or produce an awkward relative clause, and PSTE-A2 protects the fact \"default\" carries.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-N6", "quote": "Use the -pr flag to repair only the node's 'primary' ranges and avoid that duplication.", "problem": "", "fix": "", "reason": "The most natural reading treats 'repair' and 'avoid' as two infinitives sharing the same 'to,' i.e. one instruction ('Use the -pr flag') with a compound purpose clause, not two separate instructions.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-V6", "quote": "streams nothing", "problem": "", "fix": "", "reason": "\"Stream\" is an ordinary English word usable as a verb by its plain meaning, not a specialized software term restricted to noun use, so using it as a verb does not break PSTE-V6.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-W1", "quote": "otherwise deleted data could reappear", "problem": "", "fix": "", "reason": "This explains a consequence of an insufficient repair schedule in general background text, not a warning that must precede a specific destructive command, so PSTE-W1's before-the-operation requirement does not apply.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}], "semanticConfirmed": 3}, "pste": {"missing": false, "pass": false, "words": 608, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 14 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts the repair to the 'primary' token ranges of the no", "line": 59, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2886, "token": "-pr"}], "html": "== Incremental repairs and full repairs\n\nCassandra has 2 types of repair: the full repair and the incremental repair. A full repair repairs all of the data in the token range. An incremental repair only repairs the data that Cassandra wrote since the previous incremental repair.\n\nThe incremental repair is the default type. If you run it regularly, it can reduce the time and the io cost of a repair by a large amount. But once an incremental repair marks data as repaired, it does not repair that data again. This is fine when you sync up missed writes. It does not protect against disk corruption, against data loss by operator error, or against bugs in Cassandra. For this reason, run a full repair occasionally.\n\n== Automated repair scheduling\n\nA repair can cause a lot of disk io and network io. For this reason, Cassandra has not run repairs automatically in the past.\n\nThe latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.adoc[auto repair]. This feature lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with the existing repair functionality that you start with nodetool.\n\n== How to submit repairs with nodetool\n\nYou can also start a repair with nodetool.\n\nThe incremental repair is the default. Run it with this command:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with this command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nYou can also run a repair on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nYou can run a repair on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs the token ranges on the node that you repair. It does not repair the whole cluster.\n\nBy default, the command repairs all token ranges that the node replicates. This causes duplicate work when you run the command on every node. To avoid the duplicate work, use the `-pr` flag. This flag repairs only the &quot;primary&quot; ranges on a node.\n\nTo repair the whole cluster, run the `nodetool repair -pr` command on each node in each datacenter. Continue until you repair all of the nodes and all of the datacenters.\n\nThe right frequency of repair for your cluster depends on several factors. But if you are just starting out, this is a reasonable place to start: run an incremental repair every 1-3 days, and a full repair every 1-3 weeks. If you do not want to run incremental repairs, a full repair every 5 days is a good place to start.\n\nAt a minimum, run a repair often enough that the gc grace period never expires on unrepaired data. Otherwise, deleted data can reappear. The default gc grace period is 10 days. Repair every node in your cluster at least once every 7 days to prevent this. This frequency also gives you enough slack to allow for delays.\n\n== Other options\n\n`<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 14 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts the repair to the &#x27;primary&#x27; token ranges of the node that you repair. A primary range is a token range for which the node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that the given repair command would cause. This option builds the merkle trees and prints the expected streaming activity. It does not stream any data. By default, this option estimates an incremental repair. Add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Checks that the repaired data is the same across all nodes. Like `--preview`, this option builds and compares merkle trees of the repaired data, but it does not stream any data. This option helps you troubleshoot. If it shows that the repaired data is out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": false, "fidelity": {"source_words": 628, "rewrite_words": 623, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "does not protect against disk corruption, against data loss by operator error", "problem": "The rewrite drops the original's \"things like\" qualifier, so a list of examples now reads as the complete, exhaustive list of what incremental repair fails to protect against.", "fix": "Restore the exemplary scope qualifier: \"does not protect against things like disk corruption, data loss by operator error, or bugs in Cassandra.\"", "reason": "PSTE-A1 requires every scope qualifier to survive, and the original's \"things like\" explicitly marked these three items as examples rather than the full set of gaps.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 5, "column": 279, "offset": 559}, {"rule": "PSTE-D4", "quote": "against disk corruption, against data loss by operator error, or against bugs", "problem": "Three parallel items (disk corruption, data loss by operator error, bugs in Cassandra) are buried inside one prose sentence instead of a bulleted list.", "fix": "Present the three items as a bulleted list introduced by \"It does not protect against:\".", "reason": "PSTE-D4 requires a bulleted list for three or more parallel items, and a tired reader can miss an item packed into a single prose clause.", "confidence": "medium", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 5, "column": 296, "offset": 576}, {"rule": "PSTE-L4", "quote": "The incremental repair is the default. Run it with this command:", "problem inary English vocabulary that functions naturally as both a noun and a verb, not a coined software term restricted to noun form, so V6's ban on using a term noun as a verb does not apply.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-W1", "quote": "A repair can cause a lot of disk io and network io.", "problem": "The document states that repair can heavily load disk and network IO, but this risk is mentioned only as background in an earlier section and is never framed as a warning before the `nodetool repair` and `nodetool repair --full` commands the reader is told to run.", "fix": "Add a warning immediately before the repair commands stating that running repair can heavily load disk and network IO on a shared or production cluster.", "reason": "PSTE-W1 requires a warning before an operation that affects a shared or production system, and heavy disk/network IO from repair on a live cluster fits that description, yet no warning precedes the commands.", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 5, "agreement": 0.2, "located": true, "line": 9, "column": 1, "offset": 750}, {"rule": "PSTE-W1", "quote": "can cause a lot of disk io and network io", "problem": "", "fix": "", "reason": "This is routine, recurring maintenance guidance whose resource cost is already disclosed in prose, not a one-time destructive or irreversible command, so a formal warning or caution label is not clearly required.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}], "semanticConfirmed": 3}}, "passes": {"control": {"findings": [7, 8, 12], "passed": 0, "of": 3, "rate": 0, "mean": 9.0}, "pste": {"findings": [1, 3, 1], "passed": 0, "of": 3, "rate": 0, "mean": 1.7}}}, "howto-k8s-debug-pods": {"category": "documentation", "title": "Debug Pods", "prompt": "", "attri stuck in the  CODE     state, then it has been scheduled to a worker node,", "line": 36, "column": 51, "excerpt_offset": 50, "severity": "MUST", "arbitrated": false, "offset": 1501, "token": "has"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "but it can't run on that machine.", "line": 37, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 1546, "token": "can't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "should be informative.", "line": 38, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1624, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "Make sure you are using the latest version.", "line": 62, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 2726, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "In other words, you should allow Pods with existing violations", "line": 70, "column": 39, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 3166, "token": "should"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "Once your pod has been scheduled, the methods described in", "line": 76, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 3396, "token": "has"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If your pod is not behaving as you expected, it may be that there was an error in your\npod", "line": 82, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3607, "token": "If"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "pod description (e.g.", "line": 83, "column": 18, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "offset": 3711, "token": "e"}, {"rule": "PSTE-N5", "message": "multi-word noun 'command line you intended it' over 3 words", "excerpt": "will not use the command line you intended it to use.", "line": 87, "column": 14, "excerpt_offset": 13, "severity": "MUST", "arbitrated": true, "offset": 4049, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "The next thing to check is whether the pod on the apiserver\nmatches the pod you meant to c", "line": 101, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4625, "token": "The"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "matches the pod you meant to create (e.g.", "line": 102, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 4722, "token": "e"}], "html": "### Debugging Pods\n\nThe first step in debugging a Pod <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is taking&#x27;\">is</mark> taking a look at it. Check the current\nstate of the Pod and recent events with the following command:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`?\nHave there been recent restarts?\n\nContinue debugging depending on the state of the pods.\n\n#### My pod stays pending\n\nIf a Pod is stuck in `Pending` it means that it can not be scheduled onto a node.\nGenerally this is because there are insufficient resources of one type or another\nthat prevent scheduling. Look at the output of the `kubectl describe ...` command above.\nThere <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be messages from the scheduler about why it can not schedule your pod.\nReasons include:\n\n* **You <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have enough resources**: You may <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;have exhausted&#x27;; use simple past\">have</mark> exhausted the supply of CPU\n  or Memory in your cluster, in this case you need to delete Pods, adjust resource\n  requests, or add new nodes to your cluster. See [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/)\n  for more information.\n\n* **You <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: When you bind a Pod to a `hostPort` there are a\n  limited number of places that pod can be scheduled. In most cases, `hostPort`\n  is unnecessary, try using a Service object to expose your Pod.  If you do require\n  `hostPort` then you can only schedule as many Pods as there are nodes in your Kubernetes cluster.\n\n\n#### My pod stays waiting\n\nIf a Pod is stuck in the `Waiting` state, then it <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node, \nbut it <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run on that machine. Again, the information from `kubectl describe ...`\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be informative. The most common cause of `Waiting` pods is a failure to pull the image.\nThere are three things to check:\n\n* Make sure that you have the name of the image correct.\n* Have you pushed the image to the registry?\n* Try to manually pull the image to see if the image can be pulled. For example,\n  if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n\n#### My pod stays terminating\n\nIf a Pod is stuck in the `Terminating` state, it means that a deletion has been\nissued for the Pod, but the control plane is unable to delete the Pod object.\n\nThis typically happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/)\nand there is an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/)\ninstalled in the cluster that prevents the control plane from removing the\nfinalizer.\n\nTo identify this scenario, check if your cluster has any\nValidatingWebhookConfiguration or MutatingWebhookConfiguration that target\n`UPDATE` operations for `pods` resources.\n\nIf the webhook is provided by a third-party:\n- Make sure you <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the corresponding provider.\n\nIf you are the author of the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on\n  `UPDATE` operations. For example, changes to containers are usually not allowed.\n- For a validating webhook, make sure that your validation policies only apply\n  to new changes. In other words, you <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> allow Pods with existing violations\n  to pass validation. This allows Pods that were created before the validating\n  webhook was installed to continue running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled, the methods described in\n[Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/)\nare available for debugging.\n\n#### My pod is running but not doing what I told it to do\n\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> your pod is not behaving as you expected, it may be that there was an error in your\npod description (<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `mypod.yaml` file on your local machine), and that the error\nwas silently ignored when you created the pod.  Often a section of the pod description\nis nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.\nFor example, if you misspelled `command` as `commnd` then the pod will be created but\nwill not use <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended it&#x27; over 3 words\">the</mark> command line you intended it to use.\n\nThe first thing to do is to delete your pod and try creating it again with the `--validate` option.\nFor example, run `kubectl apply --validate -f mypod.yaml`.\nIf you misspelled `command` as `commnd` then will give an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&gt;\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">The</mark> next thing to check is whether the pod on the apiserver\nmatches the pod you meant to create (<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. in a yaml file on your local machine).\nFor example, run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml` and then\nmanually compare the original pod description, `mypod.yaml` with the one you got\nback from apiserver, `mypod-on-apiserver.yaml`. There will typically be some\nlines on the &quot;apiserver&quot; version that are not on the original version. This is\nexpected. However, if there are lines on the original that are not on the apiserver\nversion, then this may indicate a problem with your pod spec.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 569, "findings": [{"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "A Pod stuck in  CODE     can't be scheduled onto a node.", "line": 15, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": false, "offset": 350, "token": "can't"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "Usually there aren't enough resources of some kind.", "line": 15, "column": 72, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 396, "token": "aren't"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Check the output of the  CODE                  command above \u2014 the scheduler should say wh", "line": 15, "column": 171, "excerpt_offset": 61, "severity": "SHOULD", "arbitrated": false, "offset": 495, "token": "\u2014"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Check the output of the  CODE                  command above \u2014 the scheduler should say wh", "line": 15, "column": 187, "excerpt_offset": 77, "severity": "MUST", "arbitrated": false, "offset": 511, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "Check the output of the  CODE                  command above \u2014 the scheduler should say wh", "line": 15, "column": 205, "excerpt_offset": 95, "severity": "MUST", "arbitrated": false, "offset": 529, "token": "can't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "**You don't have enough resources**:", "line": 17, "column": 9, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 579, "toke ty": "SHOULD", "arbitrated": false, "offset": 4053, "token": "\u2014"}], "html": "### Debugging Pods\n\nStart by looking at the Pod. Check its current state and recent events:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`? Have there been recent restarts?\n\nWhat you do next depends on the state of the pod.\n\n#### My pod stays pending\n\nA Pod stuck in `Pending` <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> be scheduled onto a node. Usually there <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> enough resources of some kind. Check the output of the `kubectl describe ...` command above <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the scheduler <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> say why it <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> schedule your pod. Common reasons:\n\n* **You <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have enough resources**: Your cluster may be out of CPU or Memory. Delete Pods, adjust resource requests, or add nodes. See the [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/) for more.\n\n* **You <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: Binding a Pod to a `hostPort` limits where it can be scheduled. Most of the time you <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> need `hostPort` \u2014 use a Service object to expose your Pod instead. If you do need it, you can only schedule as many Pods as you have nodes in your cluster.\n\n#### My pod stays waiting\n\nA Pod stuck in `Waiting` <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node but <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run there. Again, `kubectl describe ...` <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> tell you why. The most common cause is a failure to pull the image. Check three things:\n\n* Is the image name correct?\n* Have you pushed the image to the registry?\n* Can you pull the image by hand? For example, with Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nA Pod stuck in `Terminating` <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;has been marked&#x27;; use simple past\">has</mark> been marked for deletion, but the control plane <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> delete the Pod object.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 32 words, limit 25\">This</mark> usually happens when the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) in the cluster stops the control plane from removing it.\n\nTo spot this, check whether your cluster has any ValidatingWebhookConfiguration or MutatingWebhookConfiguration targeting `UPDATE` operations for `pods` resources.\n\nIf a third party provides the webhook:\n- Use the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the provider.\n\nIf you wrote the webhook:\n- For a mutating webhook, never change immutable fields on `UPDATE` operations. Changes to containers, for example, are usually not allowed.\n- For a validating webhook, apply your validation policies only to new changes. Let Pods with existing violations pass validation, so Pods created before the webhook was installed keep running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod is scheduled, use the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/).\n\n#### My pod is running but not doing what I told it to do\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 32 words, limit 25\">If</mark> your pod <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> behaving as expected, your pod description (for example, the `mypod.yaml` file on your local machine) may contain an error that was silently ignored when you created the pod. Often a section is nested wrongly, or a key name is misspelled and therefore ignored. For example, if you type `commnd` instead of `command`, the pod is created but <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> use <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended&#x27; over 3 words\">the</mark> command line you intended.\n\nFirst, delete your pod and create it again with the `--validate` option <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, `kubectl apply --validate -f mypod.yaml`. Misspelling `command` as `commnd` gives an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n`` , and the actor (the internal validation logic) is not one the reader can act on, which is exactly the case PSTE-G2 permits the passive voice for.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-N4", "quote": "Common reasons:", "problem": "The heading drops the verb 'include', leaving a bare noun phrase instead of a complete clause.", "fix": "Write 'Common reasons include:' or restore the original 'Reasons include:'.", "reason": "PSTE-N4 requires a writer to keep the subject and the verb rather than omit words to shorten a sentence, and this line keeps neither.", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 5, "agreement": 0.2, "located": true, "line": 15, "column": 230, "offset": 554}, {"rule": "PSTE-N4", "quote": "a key name is misspelled and therefore ignored", "problem": "", "fix": "", "reason": "This is ordinary shared-subject coordination (\"a key name is misspelled and is therefore ignored\"), not a harmful omission of the subject, verb, or an article.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-N4", "quote": "the command line you intended", "problem": "", "fix": "", "reason": "The rewrite keeps the subject, verb, and article, and 'the command line you intended' is complete, idiomatic English that loses no fact, so this is not an omission that breaks the rule.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-N5", "quote": "command line you intended", "problem": "", "fix": "", "reason": "This is the two-word noun 'command line' followed by a reduced relative clause 'you intended', not a single four-word compound noun, so PSTE-N5's three-word limit on multi-word nouns does not apply.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-N6", "quote": "delete your pod and create it again with the", "problem": "", "fix": "", "reason": "Delete-then-recreate is a single tightly coupled remedial action in troubleshooting prose, not two independently useful instructions, and the source phrases it the same way.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 5, "agreement": 0.2, "located": false, "line": null, "column": null, "offset": null}], "semanticConfirmed": 3}, "pste": {"missing": false, "pass": false, "words": 733, "findings": [{"rule": "PSTE-G4", "message": "perfect tense 'have used'; use simple past", "excerpt": "You may have used all the CPU or memory in your cluster.", "line": 17, "column": 49, "excerpt_offset": 8, "severity": "MUST", "arbitrated": false, "offset": 710, "token": "have"}, {"rule": "PSTE-N2", "message": "description is 34 words, limit 25", "excerpt": "This usually happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-obj", "line": 33, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1984, "token": "This"}, {"rule": "PSTE-G8", "message": "phrasal verb 'turn off'; use 'disable'", "excerpt": "Turn off the webhook for  CODE    operations.", "line": 39, "column": 3, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2513, "token": "Turn"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "Next, check whether the pod on the apiserver matches the pod that you meant to create. The", "line": 64, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4327, "token": "Next"}], "html": "### Debugging Pods\n\nThe first step to debug a Pod is to look at it. Check the current state of the Pod and the recent events with this command:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`? Are there recent restarts?\n\nContinue to debug based on the state of the pods.\n\n#### My pod stays pending\n\nIf a Pod is stuck in `Pending`, the scheduler cannot place it on a node. Usually there are not enough resources of one type or another. Look at the output of the `kubectl describe ...` command above. The scheduler writes messages about why it cannot schedule your pod. The reasons include:\n\n* **You do not have enough resources**: You may <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G4: perfect tense &#x27;have used&#x27;; use simple past\">have</mark> used all the CPU or memory in your cluster. In this case you need to delete Pods, change the resource requests, or add new nodes to your cluster. See the [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/) for more information.\n\n* **You use `hostPort`**: When you bind a Pod to a `hostPort`, the scheduler has a small number of places for that pod. In most cases you do not need `hostPort`. Use a Service object to expose your Pod instead. If you do need `hostPort`, then you can schedule only as many Pods as there are nodes in your Kubernetes cluster.\n\n#### My pod stays waiting\n\nIf a Pod is stuck in the `Waiting` state, the scheduler placed it on a worker node, but it cannot run on that machine. Again, the output of `kubectl describe ...` helps. The most common cause of a `Waiting` pod is a failure to pull the image. Check three things:\n\n* Make sure that the name of the image is correct.\n* Check that you pushed the image to the registry.\n* Pull the image by hand to see if the pull works. For example, if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nIf a Pod is stuck in the `Terminating` state, someone asked to delete the Pod, but the control plane cannot delete the Pod object.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 34 words, limit 25\">This</mark> usually happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and the cluster has an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) that stops the control plane from removing the finalizer.\n\nTo find this case, check if your cluster has any ValidatingWebhookConfiguration or MutatingWebhookConfiguration that target `UPDATE` operations for `pods` resources.\n\nIf a third party gives you the webhook:\n- Make sure you use the latest version.\n- <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;turn off&#x27;; use &#x27;disable&#x27;\">Turn</mark> off the webhook for `UPDATE` operations.\n- Report an issue to the provider.\n\nIf you are the author of the webhook:\n- For a mutating webhook, make sure it never changes an immutable field on an `UPDATE` operation. For example, the cluster usually does not allow changes to containers.\n- For a validating webhook, make sure that your validation policies apply only to new changes. In other words, you must allow a Pod with an existing violation to pass validation. This lets a Pod that was created before you installed the validating webhook continue to run.\n\n#### My pod is crashing or otherwise unhealthy\n\nAfter the scheduler places your pod, you can use the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/) to debug it.\n\n#### My pod is running but not doing what I told it to do\n\nIf your pod does not behave as you expected, your pod description may hold an error. For example, the error may be in the `mypod.yaml` file on your local machine. The error was ignored without a message when you created the pod. Often a section of the pod description is nested wrongly, or a key name is typed wrongly, so the key is ignored. For example, if you spelled `command` as `commnd`, then Kubernetes creates the pod, but the pod does not use the command line that you intended.\n\nFirst, delete your pod and create it again with the `--validate` option. For example, run `kubectl apply --validate -f mypod.yaml`. If you spelled `command` as `commnd`, this gives an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&gt;\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Next</mark>, check whether the pod on the apiserver matches the pod that you meant to create. The pod that you meant to create is in a yaml file on your local machine. For example, run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml`. Then compare the original pod description, `mypod.yaml`, with the file that you got back from the apiserver, `mypod-on-apiserver.yaml`. The apiserver version usually has some lines that the original version does not have. This is expected. But if the original has lines that the apiserver version does not have, this can show a problem in your pod spec.", "factLoss": true, "fidelity": {"source_words": 881, "rewrite_words": 845, "findings": [{"kind": "number", "severity": "critical", "message": "'1' is missing. The rewrite has '10'."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "The error was ignored without a message when you created the pod.", "problem": "The original frames the whole scenario as a hypothesis ('it may be that there was an error ... and that the error was silently ignored'), but the rewrite states the ignoring as a plain fact.", "fix": "Keep the hedge, e.g. \"The error may have been ignored without a message when you created the pod.\"", "reason": "PSTE-A1 protects conditions as well as facts, and the original's condition ('it may be "MUST", "arbitrated": true, "offset": 926, "token": "a"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Client libraries should hide these interruptions from users for read requests by automatic", "line": 13, "column": 307, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "offset": 1046, "token": "should"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Operators should expect the system load on the other members to increase due to the reconn", "line": 13, "column": 426, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 1165, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster automatically elects' over 3 words", "excerpt": "When a leader fails, the etcd cluster automatically elects a new leader.", "line": 17, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": true, "offset": 1295, "token": "the"}, {"rule": "PSTE-V9", "message": "marketing adjective 'instantly'", "excerpt": "The election does not happen instantly once the leader fails.", "line": 17, "column": 103, "excerpt_offset": 29, "severity": "MUST", "arbitrated": false, "offset": 1376, "token": "instantly"}, {"rule": "PSTE-G1", "message": "passive voice 'are queued'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 107, "excerpt_offset": 40, "severity": "MUST", "arbitrated": false, "offset": 1625, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'is elected'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 152, "excerpt_offset": 85, "severity": "MUST", "arbitrated": false, "offset": 1670, "token": "is"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "A network partition divides the etcd cluster into two parts; one with a member majority an", "line": 35, "column": 141, "excerpt_offset": 59, "severity": "MUST", "arbitrated": false, "offset": 2941, "token": ";"}, {"rule": "PSTE-N5", "message": "multi-word noun 'minority side automatically recognizes' over 3 words", "excerpt": "Once the network partition clears, the minority side automatically recognizes the leader f", "line": 39, "column": 36, "excerpt_offset": 35, "severity": "MUST", "arbitrated": true, "offset": 3562, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'failed bootstrapped cluster like recovering' over 3 words", "excerpt": "Of course, it is possible to recover a failed bootstrapped cluster like recovering a runni", "line": 45, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": true, "offset": 3984, "token": "a"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A machine fails when its hardware or software malfunctions. Multiple machines fail together when there are power failures or network issues. Multiple kinds of failures can also happen at once<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it is almost impossible to enumerate all possible failure cases.\n\nIn this section, we catalog kinds of failures and discuss how etcd is designed to tolerate these failures. Most users, if not all, can map a particular failure into one kind of failure. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, the etcd cluster can still accept requests and make progress without any major disruption. For example, two follower failures will not affect <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster\u2019s operation. However, clients will lose connectivity to the failed members. Client libraries <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users for read requests by automatically reconnecting to other members. Operators <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to increase due to the reconnections.\n\n## Leader failure\n\nWhen a leader fails, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster automatically elects&#x27; over 3 words\">the</mark> etcd cluster automatically elects a new leader. The election does not happen <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark> once the leader fails. It takes about an election timeout to elect a new leader since the failure detection model is timeout based.\n\nDuring the leader election the cluster cannot process any writes. Write requests sent during the election <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued for processing until a new leader <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\nWrites already sent to the old leader but not yet committed may be lost. The new leader has the power to rewrite any uncommitted entries from the previous leader. From the user perspective, some write requests might time out after a new leader election. However, no committed writes are ever lost.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before the granted TTL even if it was granted by the old leader.\n\n## Majority failure\n\nWhen the majority members of the cluster fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can only recover from a majority failure once the majority of members become available. If a majority of members cannot come back online, then the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires due to server side unavailability.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one with a member majority and the other with a member minority. The majority side becomes the available cluster and the minority side is unavailable. There is no \u201csplit-brain\u201d in etcd because cluster members are explicitly added/removed with each such change is approved by the current majority of members.\n\nIf the leader is on the majority side, then from the majority point of view the failure is a minority follower failure. If the leader is on the minority side, then it is a leader failure. The leader on the minority side steps down and the majority side elects a new leader.\n\nOnce the network partition clears, <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;minority side automatically recognizes&#x27; over 3 words\">the</mark> minority side automatically recognizes the leader from the majority side and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap is only successful if all required members successfully start. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nOf course, it is possible to recover <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N5: multi-word noun &#x27;failed bootstrapped cluster like recovering&#x27; over 3 words\">a</mark> failed bootstrapped cluster like recovering a running cluster. However, it almost always takes more time and resources to recover that cluster than bootstrapping a new one, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 626, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd's tolerance ", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "---"}, {"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "Failures are common in a large deployment of machines.", "line": 7, "column": 32, "excerpt_offset": 31, "severity": "MUST", "arbitrated": true, "offset": 135, "token": "deployment"}, {"rule": "PSTE-N5", "message": "multi-word noun 'particular failure onto one' over 3 words", "excerpt": "Most users, if not all, can map a particular failure onto one of these kinds.", "line": 9, "column": 125, "excerpt_offset": 32, "severity": "MUST", "arbitrated": true, "offset": 524, "token": "a"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster still accepts' over 3 words", "excerpt": "When fewer than half of the followers fail, the etcd clust
