ds, limit 25", "excerpt": "Writes already sent to the old leader but not yet committed may be lost, because the new l", "line": 21, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1612, "token": "Writes"}, {"rule": "PSTE-N5", "message": "multi-word noun 'old leader granted it' over 3 words", "excerpt": "This mechanism ensures a lease will not expire before its granted TTL, even if the old lea", "line": 23, "column": 142, "excerpt_offset": 79, "severity": "MUST", "arbitrated": true, "offset": 2064, "token": "the"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "The majority side becomes the available cluster; the minority side is unavailable.", "line": 35, "column": 240, "excerpt_offset": 47, "severity": "MUST", "arbitrated": false, "offset": 2969, "token": ";"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A machine fails when its hardware or software malfunctions. Multiple machines fail together during power failures or network issues. Several kinds of failures can also happen at once, so it is almost impossible to list every possible case.\n\nThis section catalogs kinds of failures and explains how etcd is designed to tolerate them. Most users, if not all, can map <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;particular failure onto one&#x27; over 3 words\">a</mark> particular failure onto one of these kinds. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without major disruption. For example, two follower failures will not affect <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster&#x27;s operation. Clients do lose connectivity to the failed members, though. For read requests, client libraries <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users by reconnecting to other members automatically. Operators <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the remaining members to rise because of those reconnections.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not happen <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark>. Because the failure detection model is timeout based, electing a new leader takes about one election timeout.\n\nDuring the leader election, the cluster cannot process any writes. Write requests sent during the election <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued until a new leader <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 30 words, limit 25\">Writes</mark> already sent to the old leader but not yet committed may be lost, because the new leader has the power to rewrite any uncommitted entries from the previous leader. From the user&#x27;s point of view, some write requests might time out after a new leader election. No committed writes are ever lost, however.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before its granted TTL, even if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;old leader granted it&#x27; over 3 words\">the</mark> old leader granted it.\n\n## Majority failure\n\nWhen the majority of the cluster&#x27;s members fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can only recover from a majority failure once a majority of members become available again. If a majority cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires because of server side unavailability.\n\n## Network partition\n\nA network partition resembles either a minor followers failure or a leader failure. A partition splits the etcd cluster into two parts: one with a majority of members and one with a minority. The majority side becomes the available cluster<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the minority side is unavailable. etcd has no &quot;split-brain,&quot; because cluster members are added and removed explicitly, and the current majority of members approves each such change.\n\nIf the leader is on the majority side, the majority sees the failure as a minority follower failure. If the leader is on the minority side, it is a leader failure: the leader on the minority side steps down, and the majority side elects a new leader.\n\nOnce the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap succeeds only if all required members start successfully. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nRecovering a failed bootstrapped cluster is of course possible, just as with a running cluster. But since there is no data to recover, it almost always takes more time and resources than bootstrapping a new one.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/", "factLoss": true, "fidelity": {"source_words": 664, "rewrite_words": 632, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 20 conditions, the rewrite 18. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 13 -> 12, some/most 2 -> 3)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-N5", "quote": "a five member etcd cluster's operation", "problem": "\"five member etcd cluster\" is a four-word compound noun modifying \"operation,\" over the three-word limit.", "fix": "Rephrase as \"a cluster of five etcd members\" or similar, to keep the noun phrase to three words or fewer.", "reason": "PSTE-N5 forbids a multi-word noun of more than three words, and \"five member etcd cluster\" is four words all modifying the same head noun.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 13, "column": 181, "offset": 886}, {"rule": "PSTE-N6", "quote": "remove the data directories on all members and re-bootstrap the cluster", "problem": "One sentence gives two sequential instructions (remove the directories, then re-bootstrap) joined by \"and\".", "fix": "Split into two sentences: \"Remove the data directories on all member yment of'; use a verb", "excerpt": "Failures are common in a large deployment of machines.", "line": 7, "column": 92, "excerpt_offset": 31, "severity": "MUST", "arbitrated": true, "offset": 195, "token": "deployment"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster still accepts' over 3 words", "excerpt": "When fewer than half of the followers fail, the etcd cluster still accepts requests and ma", "line": 13, "column": 45, "excerpt_offset": 44, "severity": "MUST", "arbitrated": true, "offset": 712, "token": "the"}, {"rule": "PSTE-G7", "message": "nominalization 'operation of'; use a verb", "excerpt": "For example, two failed followers do not affect the operation of a cluster of five members", "line": 13, "column": 186, "excerpt_offset": 52, "severity": "MUST", "arbitrated": true, "offset": 853, "token": "operation"}, {"rule": "PSTE-G7", "message": "nominalization 'election of'; use a verb", "excerpt": "The election of a new leader therefore takes about one election timeout.", "line": 19, "column": 187, "excerpt_offset": 4, "severity": "MUST", "arbitrated": true, "offset": 1355, "token": "election"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nA machine fails when its hardware or software malfunctions. Failures are common in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. Power failures or network problems make several machines fail together. Several kinds of failure can also happen at once. Nobody can list every possible case of failure.\n\nThis section lists kinds of failure. It explains how etcd tolerates them. Most users can map a particular failure to one kind. Always [back up][backup] the etcd cluster to prepare for a rare or [unrecoverable failure][unrecoverable].\n\n## Failure of a small number of followers\n\nWhen fewer than half of the followers fail, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress. No major disruption happens. For example, two failed followers do not affect the <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G7: nominalization &#x27;operation of&#x27;; use a verb\">operation</mark> of a cluster of five members.\n\nClients lose the connection to the failed members. For a read request, a client library reconnects to another member automatically. This hides the interruption from the user. Operators must expect the reconnections to raise the load on the other members.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not happen the moment the leader fails. The model that detects the failure uses a timeout. The <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;election of&#x27;; use a verb\">election</mark> of a new leader therefore takes about one election timeout.\n\nThe cluster cannot process a write during the election. The cluster queues the write requests that it receives during the election. It processes them after it elects a new leader.\n\nThe cluster can lose a write that reached the old leader but that the cluster did not commit. The new leader can rewrite any uncommitted entry from the previous leader. Some write requests can therefore time out after the election. But the cluster never loses a committed write.\n\nThe new leader extends the timeout of every lease automatically. This makes sure a lease does not expire before its granted TTL, even when the old leader granted the lease.\n\n## Failure of the majority\n\nWhen the majority of the members fail, the etcd cluster fails. It cannot accept more writes.\n\nThe etcd cluster can only recover after the majority of the members become available again. If the majority of the members cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nAfter the majority of the members work again, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends the timeout of every lease automatically. This makes sure the unavailability of the server does not cause a lease to expire.\n\n## Network partition\n\nA network partition is similar to the failure of a small number of followers, or to a leader failure. A network partition divides the etcd cluster into two parts. One part holds the majority of the members and the other holds the minority. The majority side becomes the available cluster. The minority side is unavailable.\n\netcd has no &quot;split-brain&quot;. An operator adds and removes a cluster member explicitly, and the current majority of the members approves each such change.\n\nIf the leader is on the majority side, the majority side sees the failure as the failure of a follower in the minority. If the leader is on the minority side, the failure is a leader failure. The leader on the minority side steps down, and the majority side elects a new leader.\n\nAfter the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during the bootstrap\n\nA cluster bootstrap only succeeds if every required member starts. If any failure happens during the bootstrap, remove the data directories on every member. Then bootstrap the cluster again with a new cluster token or a new discovery token.\n\nYou can recover a failed bootstrapped cluster in the same way as you recover a running cluster. But the recovery of that cluster almost always takes more time and more resources than a new bootstrap, because there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/", "factLoss": true, "fidelity": {"source_words": 664, "rewrite_words": 669, "findings": [{"kind": "negation", "severity": "critical", "message": "the source negates 13 times, the rewrite 12. A lost negation reverses the meaning."}, {"kind": "condition", "severity": "warning", "message": "the source states 20 conditions, the rewrite 17. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 13 -> 10, some/most 2 -> 4)."}], "critical": 2, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "Most users can map a particular failure to one kind.", "problem": "The rewrite drops the scope qualifier \"if not all\" from the original's \"Most users, if not all, can map a particular failure into one kind of failure.\"", "fix": "Write \"Most users, if not all, can map a particular failure to one kind.\"", "reason": "PSTE-A1 forbids removing a scope qualifier, and \"if not all\" scoped how many users the claim covers.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 9, "column": 75, "offset": 464}, {"rule": "PSTE-G7", "quote": "do not affect the operation of a cluster of five members", "problem": "\"the operation of\" nominalizes the verb \"operate\" instead of using it directly.", "fix": "Write \"do not stop a cluster of five members from operating.\"", "reason": "PSTE-G7 requires a verb to describe an action rather than a noun, and \"operation\" here stands in for \"operate.\"", "confidence": "medium", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 13, "column": 168, "offset": 835}, {"rule": "PSTE-W1", "quote": "remove the data directories on every member", "problem": "This instruction destroys the etcd data directories with no warning, no named risk level, and no statement of what the reader loses.", "fix": "Add a warning before the instru w.githubusercontent.com/etcd-io/website/main/content/en/docs/v3.5/upgrades/upgrade_3_5.md", "author": "The etcd Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 389, "findings": [{"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If it's before 3.4, please [upgrade to 3.4](../upgrade_3_3/) before upgrading to 3.5.", "line": 5, "column": 95, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 152, "token": "it's"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "If the cluster is serving a v2 data set larger than 50MB, each newly upgraded member may t", "line": 23, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1492, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'is serving'", "excerpt": "If the cluster is serving a v2 data set larger than 50MB, each newly upgraded member may t", "line": 23, "column": 16, "excerpt_offset": 15, "severity": "MUST", "arbitrated": false, "offset": 1507, "token": "is"}, {"rule": "PSTE-N5", "message": "multi-word noun 'much larger total data size' over 3 words", "excerpt": "For a much larger total data size, 100MB or more , this one-time process might take even m", "line": 25, "column": 5, "excerpt_offset": 4, "severity": "MUST", "arbitrated": true, "offset": 1799, "token": "a"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Administrators of very large etcd clusters of this magnitude can feel free to contact the ", "line": 25, "column": 101, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1895, "token": "Administrators"}, {"rule": "PSTE-N3", "message": "contraction 'we'll'", "excerpt": "Administrators of very large etcd clusters of this magnitude can feel free to contact the ", "line": 25, "column": 239, "excerpt_offset": 138, "severity": "MUST", "arbitrated": false, "offset": 2033, "token": "we'll"}, {"rule": "PSTE-G4", "message": "perfect tense 'have been upgraded'; use simple past", "excerpt": "If all members have been upgraded to v3.5, the cluster will be upgraded to v3.5, and downg", "line": 29, "column": 16, "excerpt_offset": 15, "severity": "MUST", "arbitrated": false, "offset": 2116, "token": "have"}, {"rule": "PSTE-N2", "message": "description is 35 words, limit 25", "excerpt": "If any single member is still v3.4, however, the cluster and its operations remains \"v3.4\"", "line": 29, "column": 143, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2243, "token": "If"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an existing etcd deployment to 3.5, the running cluster must be 3.4 or greater. If <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> before 3.4, please [upgrade to 3.4](../upgrade_3_3/) before upgrading to 3.5.\n\nAlso, to ensure a smooth rolling upgrade, the running cluster must be healthy. Check the health of the cluster by using the `etcdctl endpoint health` command before proceeding.\n\n#### Preparation\n\nBefore upgrading etcd, always test the services relying on etcd in a staging environment before deploying the upgrade to the production environment.\n\nBefore beginning, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). Should something go wrong with the upgrade, it is possible to use this backup to [downgrade](#downgrade) back to existing etcd version. Please note that the `snapshot` command only backs up the v3 data. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nWhile upgrading, an etcd cluster supports mixed versions of etcd members, and operates with the protocol of the lowest common version. The cluster is only considered upgraded once all of ", "line": 36, "column": 74, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 3007, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'It's'", "excerpt": "It's also helpful to tell us the timestamp the problem occurred, so we can find it the log", "line": 36, "column": 149, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3082, "token": "It's"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If you are uncomfortable sharing the package names of your code, you can share the  CODE  ", "line": 50, "column": 517, "excerpt_offset": 111, "severity": "MUST", "arbitrated": false, "offset": 4601, "token": "it's"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf you suspect that `gopls` <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is crashing&#x27;\">is</mark> crashing or not working correctly, please follow the troubleshooting steps below.\n\nIf `gopls` <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is using&#x27;\">is</mark> using too much memory, please follow the steps under [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md), which has more a more specific version of these instructions.\n\n1. Verify that your project is in good shape by working with it outside of your editor. Running a command like `go build ./...` in the workspace directory will compile everything. For modules, `go mod tidy` is another good check, though it may modify your `go.mod`.\n1. Check that your editor <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> showing any diagnostics that indicate a problem with your workspace. They may appear as diagnostics on a Go file&#x27;s package declaration, diagnostics in a go.mod file, or as a status or progress message. Problems in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date by following the [installation instructions](index.md#installation), then [restarting gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` has no persistent state, so restarting it will fix transient problems. This is good and bad: good, because you can keep working, and bad, because you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> be able to debug the issue until it recurs.\n\nIn most cases, closing all your open editors will guarantee that `gopls` is killed and restarted. If you <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to do that, there may be an editor command you can use to restart only `gopls`. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N1: instruction is 25 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> you may need to explicitly kill `gopls` if you use `vim`.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) that can help debug further. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 42 words, limit 25\">If</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident the problem is with `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come prepared with a short <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to be available to answer questions for a while afterward.\n\n## File an issue\n\nWe <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> diagnose a problem from just a description. When filing an issue, please include as much as possible of the following information:\n\n1. Your editor and any settings you <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G4: perfect tense &#x27;have configured&#x27;; use simple past\">have</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> also helpful to tell us the timestamp the problem occurred, so we can find it the log. See the [instructions](#capture-logs) for information on how to capture gopls logs.\n\nYour editor may have a command that fills out some of the necessary information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that will allow you to see profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You will then be able to view debug information by navigating to `localhost:6060`.\n\nIf you are unsure of how to pass a flag to `gopls` through your editor, please see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` automatically writes out memory debug information when your usage exceeds 1GB. This information can be found in your temporary directory with names like `gopls.1234-5GiB-withnames.zip`. On Windows, your temporary directory will be located at `%TMP%`, and on Unixes, it will be `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) with this memory debug information attached. If you are uncomfortable sharing the package names of your code, you can share the `-nonames` zip instead, but <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 553, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'is crashing'", "excerpt": "If you think  CODE   is crashing or misbehaving, work through the troubleshooting steps be", "line": 5, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "offset": 62, "token": "is"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'is using'", "excerpt": "If  CODE   is using too much memory, see [Memory usage](#debug-memory-usage).", "line": 7, "column": 12, "excerpt_offset": 11, "severity": "MUST", "arbitrated": false, "offset": 148, "token": "is"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "VS Code users should follow [their troubleshooting guide]( URL                            ", "line": 11, "column": 15, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 240, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "you can keep working, but you can't debug the issue until it happens again.", "line": 21, "column": 134, "excerpt_offset": 30, "severity": "MUST", "arbitrated": false, "offset": 1344, "token": "can't"}, {"rule": "PSTE-N1", "message": "instruction is 23 words, limit 20", "excerpt": "Note that some       configurations keep the server alive for a while after the editor exi", "line": 23, "column": 155, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1545, "token": "Note"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Note that some       configurations keep the server alive for a while after the editor exi", "line": 23, "column": 247, "excerpt_offset": 92, "severity": "MUST", "arbitrated": false, "offset": 1637, "token": ";"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Gophers Slack has active editor-specific channels \u2014 [#emacs]( URL                         ", "line": 27, "column": 51, "excerpt_offset": 50, "severity": "SHOULD", "arbitrated": false, "offset": 1759, "token": "\u2014"}, {"rule": "PSTE-N2", "message": "description is 35 words, limit 25", "excerpt": "If you're sure the problem is with  CODE  , go straight to [#gopls]( URL                  ", "line": 27, "column": 258, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1966, "token": "If"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're sure the problem is with  CODE  , go straight to [#gopls]( URL                  ", "line": 27, "column": 261, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 1969, "to problems. That cuts both ways: you can keep working, but you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> debug the issue until it happens again.\n\nClosing all your open editors will usually kill and restart `gopls`. If you&#x27;d rather not do that, your editor may have a command to restart only `gopls`. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N1: instruction is 23 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> with `vim` you may need to kill `gopls` explicitly.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) \u2014 that can help you debug further. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 35 words, limit 25\">If</mark> <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> sure the problem is with `gopls`, go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Bring a short <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to stay available to answer questions afterward.\n\n## File an issue\n\nA description alone <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> enough to diagnose a problem. When filing an issue, include as much of the following as you can:\n\n1. Your editor and any settings <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. Telling us the timestamp of the problem also helps, so we can find it in the log. See the [instructions](#capture-logs) for how to capture gopls logs.\n\nYour editor may have a command that fills in some of this information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may need to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nFor more detailed logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that shows profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`, then view the debug information at `localhost:6060`.\n\nIf <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not sure how to pass a flag to `gopls` through your editor, see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\nWhen usage exceeds 1GB, `gopls` automatically writes out memory debug information. Look for it in your temporary directory under names like `gopls.1234-5GiB-withnames.zip`. On Windows the temporary directory is `%TMP%`<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> on Unixes <mark id=\"f15\ "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4241, "token": "If"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf `gopls` crashes or works incorrectly, follow the steps below.\n\nIf `gopls` uses too much memory, follow the steps under [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md). That guide gives a more specific version of these instructions.\n\n1. Check that your project is in good shape outside your editor. Run `go build ./...` in the workspace directory to compile everything. For modules, `go mod tidy` is another good check, but it can change your `go.mod`.\n1. Check that your editor shows no diagnostics that report a problem with your workspace. A diagnostic can appear on the package <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;declaration of&#x27;; use a verb\">declaration</mark> of a Go file, in a `go.mod` file, or as a status or progress message. A problem in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date. Follow the [installation instructions](index.md#installation), then [restart gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` keeps no persistent state, so a restart fixes a transient problem. This is good and bad. It is good because you can keep working. It is bad because you cannot debug the issue until it happens again.\n\nIn most cases, closing all your open editors stops and restarts `gopls`. If you do not want to do that, your editor may have a command that restarts only `gopls`. Some `vim` configurations keep the server alive for a while after the editor exits. If you use `vim`, you may need to kill `gopls` yourself.\n\n## Ask for help\n\nGophers Slack has active channels for each editor, such as [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS). These channels can help you debug further. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 44 words, limit 25\">If</mark> you are confident that the problem is in `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come prepared with a short <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to stay available to answer questions for a while afterward.\n\n## File an issue\n\nWe cannot diagnose a problem from a description alone. When you file an issue, please include as much of this information as you can:\n\n1. Your editor and any settings you configured. For example, your VS Code `settings.json` file.\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete `gopls` log file from a session where the issue occurred. The file <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. Please also tell us the timestamp of the problem, so we can find it in the log. See the [instructions](#capture-logs) to learn how to capture `gopls` logs.\n\nYour editor may have a command that fills out some of this information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor configuration to pass a `-logfile` flag to `gopls`.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that shows profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You can then see the debug information at `localhost:6060`.\n\nIf you do not know how to pass a flag to `gopls` through your editor, please see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` writes memory debug information automatically when your usage passes 1GB. You can find this information in your temporary directory, under a name like `gopls.1234-5GiB-withnames.zip`. On Windows, the temporary directory is at `%TMP%`. On Unix systems, it is `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) and attach this memory debug information. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> you do not want to share the package names of your code, you can share the `-nonames` zip instead, but it is much less useful.", "factLoss": false, "fidelity": {"source_words": 759, "rewrite_words": 722, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-N6", "quote": "Follow the installation instructions, then restart gopls.", "problem": "The sentence gives two sequential instructions, 'follow' and 'restart', joined by 'then'.", "fix": "Write two sentences: \"Follow the installation instructions. Then restart gopls.\"", "reason": "PSTE-N6 permits two actions in one sentence only when they occur at the same time, and 'then' explicitly marks these as sequential, not simultaneous.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": false, "line": null, "column": null, "off mming a pasted Slack excerpt. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 40 words, limit 25\">PSTE</mark> is a restricted vocabulary and grammar <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> one word per meaning, simple tenses only, short sentences, active voice, named actors, results stated first \u2014 aimed specifically at things like READMEs, PR descriptions, commit messages, runbooks, incident reports, and agent chat output. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 35 words, limit 25\">It&#x27;s</mark> explicitly modeled after ASD-STE100 (Simplified Technical English, used in aerospace maintenance manuals), but reimplemented from scratch for software vocabulary (`refactor`, `deploy`, `merge`, `rollback`) rather than copying ASD&#x27;s aerospace dictionary, which is trademarked and restricted.\n\n<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 40 words, limit 25\">*</mark>*Who <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> for:** teams and individuals who want an agent (or their own team&#x27;s docs) to produce consistently plain, unambiguous technical prose <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> think release notes, runbooks, error messages, and any output that gets pasted around and read out of context. It ships as three things: <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 45 words, limit 25\">a</mark> spec (`spec/PSTE-1.md`, written RFC-style with MUST/SHOULD/MAY), a Claude Code skill (`skill/SKILL.md`) that gets an agent to write in this style continuously across a session, and a standalone linter (`lib/pste_lint.py`) with zero dependencies that can run as a pre-commit hook to check conformance.\n\n**What it ual use case (AI-generated controlled English).** A blog post experiment (woosal1337, linked in README.md and SOURCES.md) found a style rubric cut &quot;AI slop&quot; markers by half or more. The project&#x27;s own writeup is unusually blunt about the problems: <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 35 words, limit 25\">six</mark> prompts, one run each, a metric that counts the same markers the prompt tells the model to avoid, and on one of two models tested, a simpler rubric did just as well or better. The repo calls this &quot;a pilot, not proof&quot; <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> twice, in two different files.\n\n**Two homegrown proxy measures exist and run offline**, in `evals/`:\n- `readability.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010) \u2014 real research tying vocabulary coverage to comprehension scores, with 95%/98% coverage thresholds for supported <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V8: Latin abbreviation &#x27;vs.&#x27;; use &#x27;against&#x27;\">vs</mark>. independent reading.\n- `<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 31 words, limit 25\">faithfulness</mark>.py` checks whether a rewrite dropped or altered numbers, units, identifiers, negations, or obligations \u2014 guarding against the specific failure mode where a rewrite reads more smoothly but quietly loses a fact.\n\nBoth are explicitly labeled as proxies, not comprehension tests. And when I checked whether either has actually been run and recorded: `evals/results/` (the designated home for a committed run, per its own README) contains nothing but its own README<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 no `eval-&lt;date&gt;-&lt;commit&gt;.json` file exists. The p pendent automated checks,&quot; not that it is easier to read.\n\n## What was considered and rejected\n\n`evals/FUTURE-WORK.md` surveys readability-measurement approaches and gives reasons for rejecting most of them:\n\n- **Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write) \u2014 rejected as circular. They are just functions of word and sentence length, which the standard already regulates directly. Also cited: <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 26 words, limit 25\">Tanprasert</mark> &amp; Kauchak (2021), showing these scores can be gamed by mechanical sentence-cutting with no reader benefit, and a 2025 eye-tracking study finding they predict actual reading ease poorly.\n- **Dale-Chall** \u2014 the &quot;least bad&quot; of that family, since half its score comes from a word-familiarity list. Rejected because its 1948 word list flags ordinary software vocabulary as difficult. Noted as worth revisiting later with the project&#x27;s own word list substituted in.\n- <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 43 words, limit 25\">*</mark>*LM surprisal/perplexity** \u2014 genuinely independent of the length-based rules, but rejected because it penalizes precise technical terms (rare words score high surprisal even when a trained reader finds them clearest), and because Oh &amp; Schuler (2023) found lower-perplexity models actually fit human reading time worse.\n- **Automated cloze testing** \u2014 rejected because Jacobs, Grobol &amp; Tsang (2024) found model-generated completions diverge from real human response patterns.\n- **Reference-based metrics** (SARI, BLEU, LENS) \u2014 blocked for lack of gold-standard rewrites. BLEU specifically is flagged as penalizing valid sentence-splitting, which the standard requires.\n- **LLM-as-judge** \u2014 held off for now, citing Liu <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V8: L  no memory, and no configured skill.\n  The container holds none of them, so none can reach the model.\nconstrained: false\nquestion: |\n  Read the repository at /repo and explain what evidence supports the claim that its controlled English helps a reader. Cover what <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G4: perfect tense &#x27;has been measured&#x27;; use simple past\">has</mark> been measured, what has not, and which measures the project rejected. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\nThe project has not measured whether its controlled English helps a reader. It is a writing standard called PSTE, modeled loosely on ASD-STE100. I read the repository and traced every place it makes or examines the &quot;helps a reader&quot; claim. The repository states this gap with unusual candor about itself.\n\n## What the project has measured\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">One</mark> real study backs the core claim. That study is not about this project. Chervak, Drury and Ouellette (1996) tested 175 aircraft technicians who read Simplified English aircraft workcards. Comprehension rose from 76% to 86% overall. For readers whose first language is not English, it rose from 69% to 87%. This is a genuine result from human subjects, and it is the reason the project exists. But its scope is aerospace maintenance text, written by humans and read by humans. It covers no software documentation and no machine-generated text.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">One</mark> weak pilot touches the actual use case, which is controlled English generated by an AI. A blog post experiment by woosal1337, linked in `README.md` and `SOURCES.md`, found that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;style rubric cut markers&#x27; over 3 words\">a</mark> style rubric cut markers of &quot;AI slop&quot; by half or more. The project&#x27;s own writeup is blunt about the problems. The experiment used six prompts and one run each. The metric counts the same markers that the prompt tells the model to avoid. On one of the two models tested, a simpler rubric did as well or better. The repository calls this &quot;a pilot, not proof&quot; twice, in two different files.\n\nTwo homegrown proxy measures exist in `evals/`, and both run offline:\n\n1. `readability.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010). This research ties vocabulary coverage to comprehension scores. It sets a 95% coverage threshold for supported reading and a 98% threshold for independent reading.\n2. `faithfulness.py` checks whether a rewrite dropped or changed a number, a unit, an identifier, a negation, or an obligation. It guards against one failure mode: a rewrite reads more smoothly but quietly loses a fact.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> project labels both as proxies, not as comprehension tests. Neither <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;has been run&#x27;; use simple past\">has</mark> been run and recorded. `evals/results/` is the designated home for a committed run, according to its own README. It contains nothing but that README. No `eval-&lt;date&gt;-&lt;commit&gt;.json` file exists. The top-level README says so directly: &quot;No eval run<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G4: perfect tense &#x27;has happened&#x27;; use simple past\"> </mark>has happened... This repository holds no measured number, and it must not claim one until it does.&quot;\n\nOne wrinkle deserves a flag. `evals/snapshots/` does contain a populated `results.json` and an HTML report, with model output that looks real across three arms. One of those arms is called `baseline`. But the current `evals/README.md` says there is no baseline arm anymore:<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 35 words, limit 25\"> </mark>&quot;An arm with no instruction measured the difference between asking and not asking, which is not the question.&quot; That file looks like a leftover from an earlier version of the harness, not a current result. It does not match what the project says it measures today, so I do not treat it as evidence.\n\n## What the project has not measured\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">The</mark> project states clearly that the one test which would validate the claim has never run. That test is a reader who understands PSTE software text better than a control text. `evals/FUTURE-WORK.md` designs it as<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N5: multi-word noun &#x27;future blind reading trial&#x27; over 3 words\"> </mark>a future blind reading trial. Readers get one version of a document, either the control or the PSTE version, without knowing which. They then answer questions about it. The trial reports results whatever the outcome. This trial has not run.\n\nBoth `README.md` and `evals/README.md` state the same conclusion in almost the same words. The honest claim right now is that PSTE text &quot;passes several independent automated checks&quot;. The honest claim is not that PSTE text is easier to read.\n\n## What the project rejected\n\n`evals/FUTURE-WORK.md` surveys approaches to the <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G7: nominalization &#x27;measurement of&#x27;; use a verb\">measurement</mark> of readability. It gives reasons for the <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G7: nominalization &#x27;rejection of&#x27;; use a verb\">rejection</mark> of most of them.\n\n1. **Classical readability formulas** \u2014 Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, and Linsear Write. Rejected as circular, because they are functions of word length and sentence length, which the standard already controls directly. The file also cites Tanprasert &amp; Kauchak (2021), who showed that mechanical sentence-cutting can game these scores with no benefit to the reader. It cites a 2025 eye-tracking study which found that they predict real reading ease poorly.\n2. **Dale-Chall** \u2014 the least bad of that family, because half its score comes from a list of familiar words. Rejected because its 1948 word list marks ordinary software vocabulary as difficult. The file notes that this is worth another look later, with the project&#x27;s own word list put in place of the 1948 list.\n3. **LM surprisal and perplexity** \u2014 genuinely independent of the rules about length. Rejected for two reasons. It penalizes precise technical terms, because a rare word scores high on surprisal even when a trained reader finds it clearest. Also, Oh &amp; Schuler (2023) found that models with lower perplexity fit human reading time worse.\n4. **Automated cloze testing** \u2014 rejected because Jacobs, Grobol &amp; Tsang (2024) found that completions from a model diverge from the response patterns of real humans.\n5. **Reference-based metrics** \u2014 SARI, BLEU, and LENS. Blocked because no gold-standard rewrites exist. The file flags BLEU in particular, because it penalizes valid sentence-splitting, which the standard needs.\n6. **LLM-as-judge** \u2014 held off for now. The file cites Liu <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V8: Latin abbreviation &#x27;et al.&#x27;; use &#x27;and others&#x27;\">et</mark> al. (2025), who found that model judges agree more with each other than with humans, and are least reliable on judgments about simplicity. Model judges also favour longer answers, which cuts against a standard for concision.\n\nThree more approaches are marked as unblocked and worth building, but nobody <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G4: perfect tense &#x27;has built&#x27;; use simple past\">has</mark> built them yet:\n\n1. A layer that uses an entailment model to check facts.\n2. Vocabulary coverage against a real frequency corpus, through `wordfreq`.\n3. A Dale-Chall variant that uses the project&#x27;s own word list.\n\n## Bottom line\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> chain of evidence has four links. One solid study motivates the project, but it sits outside the domain: aerospace text, written by humans and read by humans. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-L1: stacked hedging: might, suggests\">One</mark> thin pilot, which the project criticizes itself, suggests the idea might transfer to output from a large language model. <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 29 words, limit 25\">Two</mark> offline proxy metrics exist to check the difficulty of the vocabulary and the <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G7: nominalization &#x27;preservation of&#x27;; use a verb\">preservation</mark> of facts, but nobody <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G4: perfect tense &#x27;has run&#x27;; use simple past\">has</mark> run and recorded them on this project&#x27;s own corpus. The test that would settle the question needs human readers who are blind to the version and who answer comprehension questions. That test is designed on paper, and it has not run. The project says all this about itself more plainly than most similar projects do.", "factLoss": true, "fidelity": {"source_words": 999, "rewrite_words": 1246, "findings": [{"kind": "modal", "severity": "critical", "message": "an obligation weakened into a suggestion (must/shall 3 -> 2, should/may 2 -> 3)."}, {"kind": "condition", "severity": "warning", "message": "the source states 3 condition quirements, and the ambiguous `MAY NOT`.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 34 words, limit 25\">It</mark> reads its vocabulary (approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, term verbs) from `spec/wordlist.yaml` and `spec/terms.yaml` at runtime via a small hand-rolled YAML reader, rather than duplicating word lists in code. `tools/build_binary.py` can also bake that vocabulary into `EMBEDDED_VOCAB` so<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;packaged single-file build needs&#x27; over 3 words\"> </mark>a packaged single-file build needs no `spec/` directory alongside it.\n\n`<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 52 words, limit 25\">--self-test</mark>` runs an internal conformance suite <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> one or more cases per rule \u2014 plus consistency checks that the vocabulary itself is well-formed (every &quot;use X instead&quot; route points at a word the spec actually defines, every example in `wordlist.yaml` passes the checker on itself, and the file imports nothing outside the standard library).\n\n### Design decisions worth calling out\n\n- **No PyYAML dependency.** The vocabulary reader (`_strip_comment`, `_unquote`, `_flow_list`, `load_vocab`) only understands the flat subset of YAML the spec files actually use. This was a deliberate trade against pulling in a dependency for a single-file tool that&#x27;s meant to be copied around and run standalone. If the schema grows real nesting, swap it for PyYAML \u2014 I left a note in the code pointing at that tradeoff.\n- <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Tolerant vocabulary parsing.** `load_vocab` skips anything it <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> recognize instead of raising, so an unrelated edit to the spec YAML <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> break the linter at commit time. This favors availability over strictness \u2014 worth a second look if silent skipping ever masks a real vocabulary bug.\n- <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 30 words, limit 25\">*</mark>*Position-preserving text stripping.** `strip_non_prose` blanks out code fences, inline code, URLs, blockquotes, and quoted counter-examples by replacing them with spaces of the same length (keeping newlines), rather than removing them. That&#x27;s what lets every finding carry an accurate line/column back into the original file. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> a bit fiddly \u2014 the `keep` marker logic in `_blank` exists so word counts and sentence splits still <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up after stripping.\n- <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 29 words, limit 25\">*</mark>*Counter-example detection is heuristic.** A quoted span right after &quot;not&quot;/&quot;never&quot;/&quot;instead of&quot; is treated as an intentional example of what *not* to write, and is exempted (`QUOTED_SPAN_RE` + `NEGATION_BEFORE_RE`). <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> lets <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N5: multi-word noun &#x27;spec itself demonstrate violations&#x27; over 3 words\">the</mark> spec itself demonstrate violations without tripping its own linter, but <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s 7: list has 14 items, limit 7\">-</mark> sentence and paragraph length limits\n- contractions\n- semicolons and em-dashes\n- passive voice\n- perfect tense\n- stacked auxiliaries\n- `-ing` main verbs\n- nominalizations\n- phrasal verbs\n- Latin abbreviations\n- marketing adjectives\n- modal ambiguity (`should`)\n- multi-word noun clusters\n- stacked hedging\n\nWhen the document uses BCP 14 keywords, a further set of checks (`PSTE-K1`<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2013</mark>`K3`) catches non-standard negation forms, actor-less passive requirements, and the ambiguous `MAY NOT`.\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 28 words, limit 25\">The</mark> linter reads its vocabulary <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, term verbs \u2014 from `spec/wordlist.yaml` and `spec/terms.yaml` at runtime, through a small hand-rolled YAML reader. That way the word lists are not duplicated in code. `tools/build_binary.py` can instead bake the vocabulary into `EMBEDDED_VOCAB`, so<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;packaged single-file build needs&#x27; over 3 words\"> </mark>a packaged single-file build needs no `spec/` directory next to it.\n\n`--self-test` runs an internal conformance suite with one or more cases per rule. It also runs consistency checks on the vocabulary itself: <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 33 words, limit 25\">every</mark> &quot;use X instead&quot; route must point at a word the spec defines, every example in `wordlist.yaml` must pass the checker on itself, and the file must import nothing outside the standard library.\n\n### Design decisions worth calling out\n\n- **No PyYAML dependency.** The vocabulary reader (`_strip_comment`, `_unquote`, `_flow_list`, `load_vocab`) understands only the flat subset of YAML that the spec files actually use. This was a deliberate trade against pulling in a dependency for a single-file tool meant to be copied around and run standalone. If the schema grows real nesting, swap in PyYAML \u2014 I left a note in the code pointing at that tradeoff.\n- <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 28 words, limit 25\">*</mark>*Tolerant vocabulary parsing.** `load_vocab` skips anything it does not recognize instead of raising, so an unrelated edit to the spec YAML cannot break the linter at commit time. This favors availability over strictness. Worth a second look if silent skipping ever hides a real vocabulary bug.\n- **Position-preserving text stripping.** `strip_non_prose` blanks out code fences, inline code, URLs, blockquotes, and quoted counter-examples. It replaces them with spaces of the same length and keeps newlines, rather than removing them. That is what lets every finding carry an accurate line and column back into the original file. It is a bit fiddly \u2014 the `keep` marker logic in `_blank` exists so that word counts and sentence splits still <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up after stripping.\n- <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 31 words, limit 25\">*</mark>*Counter-example detection is heuristic.** A quoted span right after &quot;not&quot;, &quot;never&quot;, or &quot;instead of&quot; is treated as an intentional example of what *not* to write, and is exempted (`QUOTED_SPAN_RE` plus `NEGATION_BEFORE_RE`). This lets the spec demonstrate violations without tripping its own linter. But it is pattern-matching on phrasing, not real parsing, so false negatives and false positives are possible on unusual sentence shapes.\n- <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 35 words, limit 25\">*</mark>*POS ambiguity resolved with stoplists, not a tagger.** Several checks \u2014 nominalization <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> ordinary noun, `-ing` adjective versus progressive verb, interior plural ending a noun run \u2014 use small hand-picked word lists instead of real part-of-speech tagging. Each carries a `ponytail:` comment marking it as a deliberate scope cut. These lists are the most likely source of missed or false-positive findings on real-world text.\n- **Verdict, not a score.** `format_table` reports PASS or FAIL rather than a numeric grade, and the JSON output carries a `disclaimer` field alongside the counts. This is intentional: <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 26 words, limit 25\">a</mark> conformance count invites being treated as a quality score, which it is not \u2014 it says nothing about whether the text is true, useful, or readable. The self-test explicitly asserts the disclaimer text, and asserts that no score-like token leaks into table output.\n- <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 36 words, limit 25\">*</mark>*Dependency-free by contract, and enforced.** The self-test parses this file&#x27;s own AST and asserts no imports outside the standard library, since the whole point is that a consumer can copy this one file and run it.\n\n### What a reviewer should look closely at\n\n1. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 33 words, limit 25\">*</mark>*The regex-based grammar checks** (`PASSIVE_RE`, `ING_MAIN_RE`, `NOMINALIZATION_RE`, `NOUN_RUN_BREAK`, and others) \u2014 these approximate grammatical structure without real parsing, so check the stoplists and breaklists for gaps against text you expect this to run on.\n2. **`strip_non_prose` and the counter-example negation logic** \u2014 this is the trickiest part of the file. An escape here means either that real violations get silently exempted, or that legitimate spec examples get flagged.\n3. **The BCP 14 keyword checks (`PSTE-K1`\u2013`K3`)** \u2014 relevant only if the target document uses MUST/SHOULD/MAY-style language. Verify that the `BAD_FORMS` and `GOOD_FORMS` self-test cases match how the spec itself is written.\n4. **`load_vocab`&#x27;s YAML subset** \u2014 if `wordlist.yaml` or `terms.yaml` ever add structure this parser does not expect, it fails silently by design rather than erroring. So it is worth confirming that the self-test&#x27;s &quot;every route points at a defined word&quot; check would actually catch that.\n5. <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N2: description is 28 words, limit 25\">*</mark>*CLI exit codes and `--no-disclaimer`** \u2014 since this runs as a pre-commit hook, double-check that the exit-status contract (1 on any finding, 2 on no files) matches what the hook expects.", "factLoss": false, "fidelity": {"source_words": 877, "rewrite_words": 896, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "since this runs as a pre-commit hook, double-check", "problem": "The rewrite states as fact that the tool runs as a pre-commit hook, dropping the original's qualifier that this is only an intended/possible use.", "fix": "Write \"since this is meant to run as a pre-commit hook, double-check...\" to preserve that pre-commit-hook use is intended, not the tool's only or definite mode.", "reason": "The original's 'is meant to run as a pre-commit hook' states an intended use consistent with the earlier 'or be dropped into a pre-commit hook'; the rewrite's 'runs as a pre-commit hook' asserts it as established fact, changing the scope qualifier PSTE-A1 protects.", "confidence": "medium", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "locat n abbreviations\n- marketing adjectives\n- modal ambiguity (`should`)\n- multi-word noun clusters\n- stacked hedging\n\nWhen the document uses BCP 14 keywords, three more checks run. `PSTE-K1` to `PSTE-K3` find non-standard negation forms, actor-less passive requirements, and the ambiguous `MAY NOT`.\n\nThe linter reads its vocabulary from `spec/wordlist.yaml` and `spec/terms.yaml` at run time. The vocabulary holds approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, and term verbs. A small hand-rolled YAML reader loads these files, so the code does not duplicate the word lists. `tools/build_binary.py` can also bake the vocabulary into `EMBEDDED_VOCAB`. A packaged single-file build then needs no `spec/` directory beside it.\n\n`--self-test` runs an internal conformance suite, with one or more cases per rule. It also runs consistency checks on the vocabulary itself. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">These</mark> checks make sure that every &quot;use X instead&quot; route points at a word the spec defines, that every example in `wordlist.yaml` passes the checker on itself, and that the file imports nothing outside the standard library.\n\n## Design decisions worth calling out\n\n**No PyYAML dependency.** The vocabulary reader (`_strip_comment`, `_unquote`, `_flow_list`, `load_vocab`) understands only the flat subset of YAML that the spec files use. This is a deliberate trade. The tool is a single file that people copy around and run standalone, so I did not want a dependency for it. If the schema grows real nesting, swap it for PyYAML. I left a note in the code that points at that tradeoff.\n\n**Tolerant vocabulary parsing.** `load_vocab` skips anything it does not recognize instead of raising an error. An unrelated edit to the spec YAML therefore cannot break the linter at commit time. This favours availability over strictness. Look at it again if silent skipping ever hides a real vocabulary bug.\n\n**Position-preserving text stripping.** `strip_non_prose` blanks out code fences, inline code, URLs, blockquotes, and quoted counter-examples. It replaces them with spaces of the same length and keeps the newlines. It does not remove them. Every finding can therefore carry an accurate line and column back into the original file. This part is fiddly. The `keep` marker logic in `_blank` exists so that word counts and sentence splits still <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up after the stripping.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 32 words, limit 25\">*</mark>*Counter-example detection is heuristic.** The linter treats a quoted span right after &quot;not&quot;, &quot;never&quot;, or &quot;instead of&quot; as an intentional example of what *not* to write, and exempts it (`QUOTED_SPAN_RE` plus `NEGATION_BEFORE_RE`). The spec can therefore demonstrate violations without tripping its own linter. But this matches patterns in the phrasing. It does not parse the text. False negatives and false positives are possible on unusual sentence shapes.\n\n**Stoplists resolve part-of-speech ambiguity, not a tagger.** Several checks use small hand-picked word lists instead of real part-of-speech tagging. These checks separate a nominalization from an ordinary noun, an `-ing` adjective from a progressive verb, and an interior plural that ends a noun run. Each one carries a `ponytail:` comment that marks it as a deliberate scope cut. These lists are the most likely source of missed findings and false findings on real text.\n\n**Verdict, not a score.** `format_table` reports PASS or FAIL rather than a numeric grade. The JSON output carries a `disclaimer` field beside the counts. This is intentional. A conformance count invites a reader to treat it as a quality score, which it is not. It says nothing about whether the text is true, useful, or readable. The self-test asserts the disclaimer text, and it asserts that no score-like token leaks into the table output.\n\n**Dependency-free by contract, and enforced.** The self-test parses this file&#x27;s own AST and asserts that no import comes from outside the standard library. The whole point is that a consumer can copy this one file and run it.\n\n## What a reviewer should look at closely\n\n1. **The regex-based grammar checks** (`PASSIVE_RE`, `ING_MAIN_RE`, `NOMINALIZATION_RE`, `NOUN_RUN_BREAK`, and others). These approximate grammatical structure without real parsing. Check the stoplists and breaklists for gaps against the text you expect this to run on.\n2. **`strip_non_prose` and the counter-example negation logic.** This is the trickiest part of the file. An escape here means that either real violations get silently exempted, or the linter flags legitimate spec examples.\n3. **The BCP 14 keyword checks (`PSTE-K1` to `PSTE-K3`).** These matter only if the target document uses MUST, SHOULD, or MAY language. Check that the `BAD_FORMS` and `GOOD_FORMS` self-test cases match how the spec itself <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;is written&#x27;; name the actor\">is</mark> written.\n4. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 29 words, limit 25\">*</mark>*The YAML subset that `load_vocab` accepts.** If `wordlist.yaml` or `terms.yaml` ever add structure that this parser does not expect, it fails silently by design rather than raising an error. Confirm that the self-test check &quot;every route points at a defined word&quot; would catch that.\n5. **The exit codes of the command-line tool, and `--no-disclaimer`.** This tool is meant to run as a pre-commit hook. Check that the exit-status contract matches what the hook expects: 1 on any finding, and 2 when it receives no files.", "factLoss": true, "fidelity": {"source_words": 877, "rewrite_words": 954, "findings": [{"kind": "id  hooks that reload the ruleset on session start and re-inject it on every prompt, so the rules <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> fade out over a long session or get lost to context compaction.\n- **A pre-commit hook** you can drop into any repo to lint markdown files automatically.\n- <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 30 words, limit 25\">*</mark>*Verification tooling** in `evals/` \u2014 vocabulary-coverage and fact-preservation scripts you can run for free, plus a paid model-based harness for A/B-testing the skill against a plain &quot;make this simpler&quot; prompt.\n\n## Installing it\n\nYou need Python 3.8+ for the checker and Node (any <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;modern&#x27;\">modern</mark> version) for the Claude Code hooks.\n\n**Just the linter, as a standalone binary:**\n```\npython3 tools/build_binary.py --out ~/.local/bin/pste-lint\npste-lint --self-test\n```\n\n**Just the linter, from source (picks up live edits to the word list):**\n```\npython3 lib/pste_lint.py README.md\n```\n\n**As a pre-commit hook**, in this repo run `pip install pre-commit &amp;&amp; pre-commit install`, or in another repo add:\n```yaml\nrepos:\n  - repo: https://github.com/shermanrose/pste\n    rev: v0.1.0\n    hooks:\n      - id: pste-lint\n        args: [&quot;--level&quot;, &quot;2&quot;]\n```\n\n**As a Claude Code plugin:**\n```\nln -s &quot;$PWD&quot; ~/.claude/plugins/pste\n```\n`.claude-plugin/plugin.json` wires up the skill, the two slash commands, and the two hooks automatically.\n\n**Without the plugin system:** paste `skill/SKILL.md` into a system prompt or `CLAUDE.md`. The rules work standalone<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> you just lose the auto-persistence the hooks give you.\n\nConfigure the default level via `PSTE_LEVEL`, per repo via `.pste.json`, or at runtime with `/pste lite|pste|strict|off`.\n\n## Known limits\n\n- <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 33 words, limit 25\">*</mark>*The vocabulary list is incomplete.** At the strictest level (3), a word the list <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> cover <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> automatically forbidden \u2014 the list only handles the synonym clusters that come up most in software writing today. `spec/METHOD.md` has the plan for filling in the rest.\n- <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 29 words, limit 25\">*</mark>*The linter checks conformance, not quality.** A clean report means the text avoided the things the rules forbid \u2014 it <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> mean the text is good, accurate, or even readable. Rule PSTE-A1 (accuracy beats every other rule) <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> something the checker can verify at all<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> on the writer.\n- **The checker actually rewards one specific failure mode**: a rewrite that quietly drops a fact has fewer words left to trip a rule with, so it scores better than one that keeps everything. Use `evals/faithfulness.py` alongside it to catch dropped facts.\n- **The evidence behind the readability claim is thin.** The one human-subject study this project leans on (Chervak <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbrevia
