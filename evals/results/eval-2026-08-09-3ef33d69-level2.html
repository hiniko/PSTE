ntraction 'you're'", "excerpt": "Once you're ready, it is time to :doc:`install the new Django version", "line": 95, "column": 6, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "offset": 3686, "token": "you're"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "is a major upgrade, you might want to set up a new environment with all the", "line": 97, "column": 39, "excerpt_offset": 38, "severity": "MUST", "arbitrated": false, "offset": 3869, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "When the new environment is set up, :doc:`run the full test suite", "line": 112, "column": 29, "excerpt_offset": 28, "severity": "MUST", "arbitrated": false, "offset": 4138, "token": "set"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "Again, it's useful to turn", "line": 113, "column": 58, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 4233, "token": "it's"}, {"rule": "PSTE-N3", "message": "contraction 'they're'", "excerpt": "on deprecation warnings on so they're shown in the test output (you can also", "line": 114, "column": 31, "excerpt_offset": 30, "severity": "MUST", "arbitrated": false, "offset": 4283, "token": "they're"}, {"rule": "PSTE-G4", "message": "perfect tense 'have run'; use simple past", "excerpt": "After you have run the tests, fix any failures.", "line": 121, "column": 11, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 4463, "token": "have"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are upgrading'", "excerpt": "If you are upgrading to an alpha, beta, or release candidate, please see our", "line": 126, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 4697, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 9, "excerpt_offset": 8, "severity": "MUST", "arbitrated": false, "offset": 4981, "token": "you're"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go ahead'; use 'start'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 25, "excerpt_offset": 24, "severity": "MUST", "arbitrated": false, "offset": 4997, "token": "go"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If you are using caching provided by Django, you should consider clearing your\ncache after", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5081, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 5088, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward, you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. You must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django, you <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not guaranteed to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly via the :func:`~django.views.decorators.cache.cache_page`\ndecorator.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 648, "findings": [{"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're upgrading across more than one feature version (for example, 2.0 to", "line": 40, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 1349, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "2.2), it's usually easier to go one feature release at a time (2.0 to 2.1 to", "line": 41, "column": 7, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 1430, "token": "it's"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't captured,", "line": 70, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 2512, "token": "don't"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't captured,", "line": 70, "column": 67, "excerpt_offset": 66, "severity": "MUST", "arbitrated": false, "offset": 2571, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "versions, so deprecation warnings from installed packages don't always mean", "line": 82, "column": 59, "excerpt_offset": 58, "severity": "MUST", "arbitrated": false, "offset": 2987, "token": "don't"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "If a package doesn't support the latest Django version,", "line": 83, "column": 34, "excerpt_offset": 13, "severity": "MUST", "arbitrated": false, "offset": 3038, "token": "doesn't"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "With the new environment set up, :doc:`run your application's full test suite", "line": 104, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": false, "offset": 3570, "token": "set"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are upgrading'", "excerpt": "If you are upgrading to an alpha, beta, or release candidate, see our guide on", "line": 117, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 4030, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Once you're confident your app works with the new version of Django, :doc:`deploy", "line": 123, "column": 6, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "offset": 4212, "token": "you're"}, {"rule": "PSTE-D2", "message": "paragraph has 10 sentences, limit 6", "excerpt": "If you use caching provided by Django, consider clearing your cache after\nupgrading. Other", "line": 126, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4340, "token": "If"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Otherwise you may hit problems \u2014 for example, if you cache pickled", "line": 127, "column": 43, "excerpt_offset": 31, "severity": "SHOULD", "arbitrated": false, "offset": 4456, "token": "\u2014"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version has several benefits:\n\n* You get new features and improvements.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release keeps your code base current and makes future\n  upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. Automated upgrade helpers are highlighted on\n    the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere is what to consider to make your upgrade go smoothly.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nThen learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for every &#x27;final&#x27; release from\n  the one after your current version up to and including the version you plan to\n  upgrade to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nPay close attention to backwards incompatible changes, so you know what the\nupgrade will require.\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading across more than one feature version (for example, 2.0 to\n2.2), <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to go one feature release at a time (2.0 to 2.1 to\n2.2) than to make all the changes at once. For each feature release, use its\nlatest patch release (for 2.1, use 2.1.15).\n\nUpgrade one step at a time when moving from one LTS to the next, too.\n\nDependencies\n============\n\nYou will usually need to upgrade your Django-related dependencies as well. If\nthe Django version was released recently, or some of your dependencies are not\nwell-maintained, they may not support the new Django version yet. In that case,\nwait until new versions of those dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, fix any deprecation warnings your project raises on your\ncurrent version of Django. Fixing them first tells you which parts of your code\nneed changing.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\ncommand line option or the :envvar:`PYTHONWARNINGS` environment variable. For\nexample, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use the Django test runner, make sure console output <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> captured,\nsince that hides deprecation warnings. For example, with `pytest\n&lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve all deprecation warnings on your current version of Django before you\ncontinue.\n\nThird party applications may use deprecated APIs to support multiple Django\nversions, so deprecation warnings from installed packages <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> always mean\nsomething is wrong. If a package <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest Django version,\nconsider raising an issue or sending a pull request.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. If you use a\n:mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, consider setting\nup a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run your application&#x27;s full test suite\n&lt;/topics/testing/overview&gt;`. Turn deprecation warnings on again so they appear in\nthe test output (you can also use the flag when testing manually with\n``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures. While the release notes are fresh in your mind, this is also a\ngood time to use new Django features and refactor your code to remove\ndeprecation warnings.\n\nIf you <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases` for tips on catching regressions and reporting bugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works with the new version of Django, :doc:`deploy\n&lt;/howto/deployment/index&gt;` your upgraded project.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-D2: paragraph has 10 sentences, limit 6\">If</mark> you use caching provided by Django, consider clearing your cache after\nupgrading. Otherwise you may hit problems <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, if you cache pickled\nobjects, since those objects are not guaranteed to be pickle-compatible across\nDjango versions. One past incompatibility involved caching pickl  the sections below before you start. They help the upgrade go smoothly.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nThen <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G8: phrasal verb &#x27;find out&#x27;; use &#x27;find&#x27;\">find</mark> out what changed in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release. Start\n  with the release after your current Django version. Stop at the version you\n  plan to upgrade to.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nRead the backwards incompatible changes with care. They show you what the\nupgrade needs.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade through each feature release one at a time. Go from 2.0 to 2.1, then\n2.1 to 2.2. This is usually easier than to make all the changes at once. For\neach feature release, use the latest patch release. For 2.1, use 2.1.15.\n\nUpgrade one step at a time when you go from one LTS to the next.\n\nDependencies\n============\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to their\nlatest versions. Some dependencies may not support the new Django version yet.\nThis happens when the Django version is new, or when a dependency is not\nwell-maintained. In these cases you must wait for new versions of your\ndependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, fix the deprecation warnings that your project raises on\nyour current version of Django. Fix these warnings first and you learn which\nparts of the code you must change.\n\nPython hides deprecation warnings by default. You must turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while you run tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, you may also need to stop the runner\nfrom capturing console output. Captured output hides deprecation warnings. For\nexample, with `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nFix all deprecation warnings on your current version of Django before you\ncontinue.\n\nThird party applications may use deprecated APIs to support several versions of\nDjango. A deprecation warning in a package you installed does not always mean a\nproblem. If a package does not support the latest version of Django, consider\nraising an issue or sending a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`. If\nyou use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, first\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Turn deprecation warnings on\nagain so the test output shows them. You can also use the flag when you test\nyour app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures after you run the tests. The release notes are fresh in your\nmind, so this is also a good time to use new features in Django. Refactor your\ncode to remove any deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more specific tips on how to catch\nregressions and report bugs.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 13 sentences, limit 6\">If</mark> you use caching provided by Django, consider clearing your cache after the\nupgrade. An old cache can cause problems. For example, pickled objects in the\ncache are not guaranteed to be pickle-compatible across Django versions. One\npast incompatibility was the cache of pickled\n:class:`~django.http.HttpResponse` objects. This happened directly, and also\nindirectly through the :func:`~django.views.decorators.cache.cache_page`\ndecorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 772, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 23. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "In these cases you must wait for new versions of your dependencies.", "problem": "The rewrite states waiting as a certain requirement, but the original states it only as a possibility.", "fix": "Write \"In these cases you may have to wait for new versions of your dependencies.\"", "reason": "The original says 'you may have to wait' (a conditional possibility), not a certain obligation; the rewrite changes the condition's certainty.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true uction slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 756, "findings": [{"rule": "PSTE-N2", "message": "description is 33 words, limit 25", "excerpt": "Farmers eligible to create the next block have only about 28 seconds to build an unfinishe", "line": 5, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 61, "token": "Farmers"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Farmers pull transactions from the mempool in order of fee per cost and add them to the un", "line": 7, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 259, "token": "Farmers"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'were making'", "excerpt": "CNI observed that the mempool was completely full yet no transactions were making it into ", "line": 9, "column": 71, "excerpt_offset": 70, "severity": "MUST", "arbitrated": false, "offset": 488, "token": "were"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'were failing'", "excerpt": "farmers eligible to create blocks were failing to build unfinished blocks in time, due to ", "line": 9, "column": 198, "excerpt_offset": 34, "severity": "MUST", "arbitrated": false, "offset": 615, "token": "were"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Fast forward lets multiple vault singleton spends sit in the mempool at once; farmers dedu", "line": 15, "column": 262, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 1206, "token": ";"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "Fast forward spends don't become invalid just because their coin is spent \u2014 they can be fa", "line": 19, "column": 26, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 1353, "token": "don't"}, {"rule": "PSTE-G4", "message": "perfect tense 'had been melted'; use simple past", "excerpt": "But we never checked that the singleton still existed, so we accepted singleton spends for", "line": 20, "column": 273, "excerpt_offset": 107, "severity": "MUST", "arbitrated": false, "offset": 1997, "token": "had"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "The Chia blockchain is decentralized, with many nodes running different configurations and", "line": 50, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4129, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "When a spend is \"rebased\" onto the latest version of the singleton, we no longer update th", "line": 57, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4793, "token": "When"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, every fast-forward-eligible spend is valida", "line": 58, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4966, "token": "When"}], "html": "# Block Creation Slowed by Mempool Issues\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 33 words, limit 25\">Farmers</mark> eligible to create the next block have only about 28 seconds to build an unfinished block and propagate it across the network to a timelord, which infuses it to produce the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 26 words, limit 25\">Farmers</mark> pull transactions from the mempool in order of fee per cost and add them to the unfinished block, collecting the fees attached to those transactions.\n\nCNI observed that the mempool was completely full yet no transactions <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;were making&#x27;\">were</mark> making it into blocks. Block production also slowed below the expected rate. The cause: farmers eligible to create blocks <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;were failing&#x27;\">were</mark> failing to build unfinished blocks in time, due to several bugs in the mempool&#x27;s fast forward spend logic.\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis is what allows offer files to refer to singletons by coin ID even though the coin ID changes on every state update.\n\nFast forward spends are also used by vaults. The vault singleton authorizes every coin belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too restrictive. Fast forward lets multiple vault singleton spends sit in the mempool at once<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> farmers deduplicate and rebase them sequentially while creating blocks.\n\nCNI traced the slowdown to three root causes:\n\n* 1. Fast forward spends <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> become invalid just because their coin is spent \u2014 they can be fast-forwarded to the latest version of the singleton. They rely on other parts of the spend bundle to trigger eviction (for example, that coin being spent by a block). We overlooked the case where a bundle&#x27;s only spend was a fast forward spend: it would never be evicted after the singleton was melted.\n* 2. FF-spends enter the mempool even when their coin is already spent, because at block formation they get fast-forwarded onto the latest version of the singleton. But we never checked that the singleton still existed, so we accepted singleton spends for singletons that <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer existed.\n* 3. At block formation, FF spends were updated to spend the singleton&#x27;s most recent coin. This update happened in place, mutating the mempool and propagating the fast-forwarded versions of the mempool item to the rest of the network. The mempool item therefore duplicated \u2014 doubling in number \u2014 every time a farmer tried to form a block.\n\nTogether, these three bugs meant that anyone submitting a fast-forward-eligible singleton spend, unbundled with any other spend, would see the following:\n\n* The spend was treated as valid, entered the mempool, and propagated across the network.\n* Every time a farmer made a block, the spend multiplied, propagating new transactions throughout the network (3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but did not evict the spends from the mempool (2). In our case, the mempool was already full of these spends when this happened. They all failed during block creation, so farmers timed out before finding any valid transactions.\n* Farmers attempting to build a block from the affected mempool items hit performance problems and missed the cutoff for getting their block into the blockchain.\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n## Resolution and recovery\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">The</mark> Chia blockchain is decentralized, with many nodes running different configurations and versions, so most of the blockchain netspace was unaffected by the Fast Forward issues.\n\nVersion 2.5.1 shipped a workaround that caps unfinished block creation time, ensuring the unfinished block reaches a timelord promptly. Netspace began recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 shipped the actual fixes, which invalidated the mempoolItems created by the Fast Forward issues. The mempool cleared of these items as users adopted v2.5.2.\n\n* 1. SpendBundles submitted to the mempool that contain only fast-forward spends are rejected.\n* 2. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is &quot;rebased&quot; onto the latest version of the singleton, we no longer update the item in the mempool, which risked distributing the new copy to the network.\n* 3. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">When</mark> ingesting spend bundles into the mempool, every fast-forward-eligible spend is validated to confirm the latest version of its singleton still exists (with the given puzzle hash).", "factLoss": true, "fidelity": {"source_words": 966, "rewrite_words": 860, "findings": [{"kind": "negation", "severity": "critical", "message": "the source negates 8 times, the rewrite 6. A lost negation reverses the meaning."}, {"kind": "condition", "severity": "warning", "message": "the source states 11 conditions, the rewrite 9. Check that no condition was dropped."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-X3", "quote": "was a fast forward spend", "problem": "\"fast forward\" modifies the noun \"spend\" as a single unit but is not hyphenated, even though the original hyphenated this identical phrase (\"fast-forward spend\") in the same position.", "fix": "Write \"was a fast-forward spend\".", "reason": "PSTE-X3 requires a hyphen connecting words that act as one unit before a noun, and the rewrite regressed a construction the source text already hyphenated correctly.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 19, "column": 314, "offset": 1641}, {"rule": "PSTE-G9", "quote": "Netspace began recovering toward previous levels", "problem": "\"Netspace\" appears with no article, immediately after the same paragraph referred to it as \"the blockchain netspace.\"", "fix": forward spends' over 3 words", "excerpt": "Several bugs in the mempool logic around fast-forward spends caused this delay.", "line": 9, "column": 275, "excerpt_offset": 16, "severity": "MUST", "arbitrated": true, "offset": 825, "token": "the"}, {"rule": "PSTE-G7", "message": "nominalization 'distribution of'; use a verb", "excerpt": "That update risks distribution of the new copy to the network.", "line": 52, "column": 137, "excerpt_offset": 18, "severity": "MUST", "arbitrated": true, "offset": 5328, "token": "distribution"}], "html": "# Block creation slowed by mempool problems\n\n## Issue summary\n\nA farmer that is eligible to create the next block has about 28 seconds to do the work. In that time the farmer must create an unfinished block. The network must then propagate the unfinished block to a timelord. The timelord infuses the unfinished block to construct the finished block.\n\nA farmer takes transactions from the mempool, ordered by fee per cost. The farmer adds them into the unfinished block. The fees attached to those transactions go to the farmer that makes the block.\n\nCNI found that transactions were not included in blocks while the mempool was completely full. Block production also slowed down against the expected rate. CNI determined the cause: farmers eligible to create blocks did not create unfinished blocks in time. Several bugs in <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast-forward spends&#x27; over 3 words\">the</mark> mempool logic around fast-forward spends caused this delay.\n\nA fast-forward spend lets a singleton transaction apply to future versions of the singleton. Fast-forward spends let offer files refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nVaults also use fast-forward spends. The vault singleton authorizes all coins that belong to it. One vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward allows several spends of the vault singleton in the mempool at the same time. Farmers deduplicate and rebase these spends in sequence as they create blocks.\n\nCNI determined that the following three issues caused the slow down in block creation:\n\n1. A fast-forward spend does not become invalid when its coin is spent. The spend can be fast-forwarded to the latest version of the singleton. A fast-forward spend relies on other parts of the spend bundle for eviction. For example, a block spends that coin. We did not consider the case where the only spend in a bundle was a fast-forward spend. That bundle was not evicted after the melt of the singleton.\n2. A fast-forward spend enters the mempool even when its coin is already spent. When we form the block, we fast-forward the spend on top of the latest version of the singleton. But we did not check that the singleton still existed. So we accepted singleton spends into the mempool for singletons that were melted and no longer exist.\n3. When we formed a block, we updated a fast-forward spend to spend the most recent coin of a singleton. We made this update in place. This change to the mempool propagated the fast-forwarded versions of the mempool item to the rest of the network. The mempool item then doubled in number every time a farmer tried to form a block.\n\nThese three bugs affect a person who submits a singleton spend that is eligible for fast forward, without any other spend in the bundle. Four results follow:\n\n1. The spend is considered valid. It enters the mempool and propagates throughout the network.\n2. Whenever a farmer makes a block, the spend multiplies. The new transactions propagate throughout the network. This is bug 3.\n3. A melt of the singleton stops the transactions from going through, but does not evict the spends from the mempool. This is bug 2. In our scenario, the mempool was full of these spends when the melt happened. All of these spends failed during block creation. Farmers timed out before they found any valid transaction.\n4. A farmer that tried to create a block with the affected mempool items met performance problems. The farmer then missed the cutoff time for the block to enter the blockchain.\n\n## Timeline\n\nAll times are PST, from 02/13/2025 to 02/19/2025. All times are approximations.\n\n| Date and time | Event |\n|---|---|\n| 02-13-2025 11:00 pm | The count of spend bundles in the mempool started to increase slowly. |\n| 02-14-2025 11:30 am | The mempool cost hit the maximum cost. |\n| 02-14-2025 1:10 pm | The count of spend bundles in the mempool plateaued at about 6200. |\n| 02-14-2025 4:45 pm | The netspace of the Chia blockchain started to decrease. The count of timelord-infused blocks per minute dropped sharply. |\n| 02-14-2025 11:00 pm | CNI diagnosed the cause of the problems. CNI prepared a hotfix release of the Chia blockchain software. |\n| 02-15-2025 1:30 am | The build process for the hotfix release started. |\n| 02-15-2025 3:00 am | The deployment of the hotfix release completed as version 2.5.1. |\n| 02-19-2025 3:15 pm | Version 2.5.2 was released. It included the bug fixes for the fast-forward issues described in the issue summary. |\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized, and many nodes run different configurations and versions. So the fast-forward issues did not affect the majority of the blockchain netspace.\n\nVersion 2.5.1 of the Chia blockchain contains a workaround. The workaround caps the time to create an unfinished block, to make sure the unfinished block reaches a timelord in time. The blockchain netspace started to recover towards previous levels after the release of v2.5.1.\n\nVersion 2.5.2 included fixes that invalidated the mempool items from the fast-forward issues. The mempool was cleared of these items as the userbase took up v2.5.2. The fixes are:\n\n1. The mempool rejects a spend bundle that contains only fast-forward spends.\n2. When a spend is &quot;rebased&quot; on top of the latest version of the singleton, we do not update the item in the mempool. That update risks <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;distribution of&#x27;; use a verb\">distribution</mark> of the new copy to the network.\n3. When we ingest a spend bundle into the mempool, we check every spend that is eligible for fast forward. The check makes sure the latest version of this singleton still exists, with the given puzzle hash.", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 977, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-G7", "quote": "we do not update the item in the mempool. That update risks distribution of the new copy", "problem": "The action 'distribute' is turned into the noun 'distribution of' instead of being expressed as a verb.", "fix": "Write \"That update risks distributing the new copy to the network\" or \"That update might distribute the new copy to the network.\"", "reason": "PSTE-G7 requires a verb to describe an action, not a noun, and 'risks distribution of' is exactly the pattern the rule's own example ('a failure of the service occurred') forbids.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 52, "column": 77, "offset": 5268}, {"rule": "PSTE-G2", "quote": "That bundle was not evicted after the melt of the singleton.", "problem": "The sentence uses the passive voice to describe an action even though the actor ('we', the developers) is named in the very same paragraph one sentence earlier.", "fix": "Write \"We did not evict that bundle after the melt of the singleton.\"", "reason": "PSTE-G2 permits the passive in a description only when the actor is genuinely unknown, but the surrounding sentences ('We did not consider the case...', 'We made this update in place') show the actor is known and already active in the passage.", "confidence": "medium", "status": "confirmed", " ge": "description is 33 words, limit 25", "excerpt": "The chia_rs function called run_block_generator() contained a bug where if the byte cost e", "line": 15, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1098, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "The removal of the verification in the mempool code and the chia_rs bug combined allowed f", "line": 17, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1296, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 42 words, limit 25", "excerpt": "Chia monitored the mempool for these excessive CLVM cost mempool items and found that they", "line": 37, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2309, "token": "Chia"}], "html": "# unbound CLVM cost restriction on mempool\n\n## Issue Summary\n\nTransactions that are included in a block are aggregated from one or more spendbundles. Inside spendbundles coins are spent, with the reveal of the puzzle and their solution of the coins. The puzzles and solutions consist of CLVM code that is assigned a cost, based on bytes of the code, and usage of operands and conditions. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">Each</mark> node on the network runs the CLVM code with limitations on how much resources the execution can use up via restrictions on the CLVM cost.\n\nThe Chia default mempool code uses a CLVM cost <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction that consensus uses (what is allowed in a block). The consensus constant is &quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000\n\n\nVersion 1.7.1 of the mempool <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn\u2019t&#x27;\">doesn\u2019t</mark> include verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`\nThis code was present in previous versions.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> verification code was removed because it was assumed that running the MempoolItem as a block generator would perform this check already, making the code redundant.\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 33 words, limit 25\">The</mark> chia_rs function called run_block_generator() contained a bug where if the byte cost exceeded the limit (5.5 billion in this case), the u64 wraps around and effectively removes the cost limit.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 32 words, limit 25\">The</mark> removal of the verification in the mempool code and the chia_rs bug combined allowed for a MempoolItem to have an unbound CLVM cost when the byte cost exceeded the limit.\n\n## Timeline (all times PST)   04/23/2023 - 05/03/2023. All times approximations\n\n04/23/2023 - Mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5` were reported by a community member in keybase.\n\n05/03/2023 - Version 1.8.0 of the Chia blockchain was released with fixes for the mempool code and chia_rs.\n\n\n## Resolution and recovery\n\nThis issue was addressed in 1.8.0 by: \n\nReinstating the mempool verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n\nFixing the cost calculation in chia_rs when the byte cost exceeds the limit.\n\n\nThe issue was present in mainnet and manifested itself by transactions being added to the mempool that exceeded the CLVM cost threshold. These transactions were not added to blocks as consensus checks on CLVM cost disallowed that.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 42 words, limit 25\">Chia</mark> monitored the mempool for these excessive CLVM cost mempool items and found that they were limited in scope and barely exceeded the threshold limit, causing very limited impact on nodes on the network during the time that the mempool allowed them.\n\n\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 313, "findings": [{"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Puzzles and solutions are CLVM code, and each is assigned a cost based on the code's size ", "line": 5, "column": 142, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 191, "token": "Puzzles"}, {"rule": "PSTE-N5", "message": "multi-word noun 'block generator already performed' over 3 words", "excerpt": "It was removed on the assumption that running the MempoolItem as a block generator already", "line": 11, "column": 242, "excerpt_offset": 65, "severity": "MUST", "arbitrated": true, "offset": 913, "token": "a"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'were exceeding'", "excerpt": "**04/23/2023** \u2014 A community member reported on Keybase that mempool items were exceeding ", "line": 21, "column": 78, "excerpt_offset": 75, "severity": "MUST", "arbitrated": false, "offset": 1423, "token": "were"}], "html": "# Unbounded CLVM Cost in the Mempool\n\n## Summary\n\nBlocks contain transactions aggregated from one or more spendbundles. Spendbundles spend coins by revealing each coin&#x27;s puzzle and solution. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">Puzzles</mark> and solutions are CLVM code, and each is assigned a cost based on the code&#x27;s size in bytes and its use of operands and conditions. Every node on the network runs this CLVM code under a cost limit that caps how many resources execution can consume.\n\nChia&#x27;s default mempool applies a CLVM cost limit of 0.5 times the consensus limit (the amount allowed in a block). The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nTwo problems combined to create the issue:\n\n1. **Missing mempool check.** Mempool version 1.7.1 dropped the check that a MempoolItem&#x27;s CLVM cost must be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. Earlier versions had it. It was removed on the assumption that running the MempoolItem as <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;block generator already performed&#x27; over 3 words\">a</mark> block generator already performed the same check, making it redundant.\n\n2. **chia_rs bug.** In `run_block_generator()`, a byte cost above the limit (5.5 billion here) caused the u64 to wrap around, effectively removing the cost limit altogether.\n\nTogether, these allowed a MempoolItem to carry an unbounded CLVM cost whenever the byte cost exceeded the limit.\n\n## Timeline\n\nAll times PST and approximate. 04/23/2023 \u2013 05/03/2023.\n\n- **04/23/2023** \u2014 A community member reported on Keybase that mempool items <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;were exceeding&#x27;\">were</mark> exceeding a cost of `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- **05/03/2023** \u2014 Chia blockchain version 1.8.0 released, fixing both the mempool code and chia_rs.\n\n## Resolution and Recovery\n\nVersion 1.8.0 addressed the issue by:\n\n- Reinstating the mempool check that a MempoolItem&#x27;s CLVM cost must be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- Fixing the cost calculation in chia_rs for the case where byte cost exceeds the limit.\n\nThe issue was present on mainnet. It showed up as transactions entering the mempool above the CLVM cost threshold. Those transactions never made it into blocks, because consensus checks on CLVM cost rejected them.\n\nChia monitored the mempool for these excessive-cost items and found them limited in scope, barely over the threshold. Impact on network nodes during the period the mempool allowed them was very limited.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 364, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 3 conditions, the rewrite 1. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-G9", "quote": "Impact on network nodes during the period the mempool", "problem": "The sentence opens with the bare noun 'Impact' as its subject, with no article.", "fix": "Write 'The impact on network nodes during the period...'.", "reason": "PSTE-G9 requires an article or demonstrative before a noun where grammar permits one, and a sentence-initial abstract-noun subject like 'impact' takes 'the' in standard English.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 33, "column": 119, "offset": 2192}, {"rule": "PSTE-N4", "quote": "Chia blockchain version 1.8.0 released, fixing both the mempool code and chia_rs.", "problem": "The auxiliary verb \"was\" is missing before \"released\", leaving the sentence grammatically broken and readable as if the version itself performed the releasing.", "fix": "Write \"Chia blockchain version 1.8.0 was released, fixing both the mempool code and chia_rs.\"", "reason": "PSTE-N4 forbids omitting words, including the verb, to shorten a sentence, and the omitted auxiliary changes what a tired reader parses as the subject-verb relationship.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 22, "column": 20, "offset": 1506}, {"rule": "PSTE-S4", "quote": "a MempoolItem's CLVM cost must be", "problem": "The identifier 'MempoolItem' is inflected with a possessive 's, where the original avoided this by writing 'the CLVM cost of a MempoolItem'.", "fix": "Write 'the CLVM cost of a MempoolItem must be' to leave the identifier uninflected.", "reason": "PSTE-S4 states . The cost comes from the bytes of the code, and from the operands and conditions that the code uses. Every node on the network runs the CLVM code under a cost limit. The cost limit restricts how much resource the execution can use.\n\nThe default Chia mempool code uses a CLVM cost limit of 0.5 times the consensus limit. The consensus limit is what a block allows. The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nVersion 1.7.1 of the mempool does not include the check that the CLVM cost of a MempoolItem must be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`. Earlier versions included this check.\n\nA developer removed this check because of an assumption. The assumption was that the code already made this check when it ran the MempoolItem as a block generator, so the check was redundant.\n\nThe chia_rs function `run_block_generator()` held a bug. If the byte cost passed the limit, which is 5.5 billion here, the u64 wraps around. The wrap removes the cost limit.\n\nThe removed <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G8: phrasal verb &#x27;check in&#x27;; use &#x27;ask&#x27;\">check</mark> in the mempool and the chia_rs bug combined. Together they allowed a MempoolItem to have an unbound CLVM cost when the byte cost passed the limit.\n\n## Timeline\n\nAll times are PST, from 04/23/2023 to 05/03/2023. All times are approximations.\n\n1. 04/23/2023 \u2014 A community member reported mempool items with a cost above `constants.MAX_BLOCK_COST_CLVM * 0.5` in keybase.\n2. 05/03/2023 \u2014 Chia released version 1.8.0 of the blockchain with fixes for the mempool code and chia_rs.\n\n## Resolution and recovery\n\nVersion 1.8.0 addressed this issue in two ways:\n\n1. It reinstated the mempool check that the CLVM cost of a MempoolItem must be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. It fixed the cost calculation in chia_rs for the case where the byte cost passes the limit.\n\nThe issue was present in mainnet. It showed itself when the mempool accepted transactions above the CLVM cost threshold. Blocks did not include these transactions, because the consensus checks on CLVM cost disallowed that.\n\nChia monitored the mempool for these mempool items with excessive CLVM cost. Chia found that they were limited in scope and barely passed the threshold limit. They caused very limited impact on the nodes on the network during the time that the mempool allowed them.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 440, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "A developer removed this check because of an assumption.", "problem": "The rewrite invents a specific actor ('a developer') that the original text never names.", "fix": "Write \"This check was removed because of an assumption\" or otherwise avoid asserting who removed it, matching the original's unspecified actor.", "reason": "The original deliberately uses an actor-free construction ('This verification code was removed because...'); attributing the removal to 'a developer' asserts a fact not supported by the source and risks misattributing responsibility in an incident report.", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 13, "column": 1, "offset": 936}, {"rule": "PSTE-L4", "quote": "the CLVM cost of a MempoolItem must be <= `constants.MAX_BLOCK_COST_CLVM * 0.5`", "problem": "", "fix": "", "reason": "This condition is restated once in the Issue summary (what was removed) and once in Resolution (what was reinstated); it names the same recurring fact in two different narrative events rather than repeating it for emphasis, so it is not the kind of restatement PSTE-L4 forbids.", "confidence": "", "status": "rejected", "seenIn": 2, "of": 5, "agreement": 0.4, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-A1", "quote": "Chia released version 1.8.0 of the blockchain luster/configure-upgrade-etcd.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md", "author": "The Kubernetes Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 470, "findings": [{"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If any API servers are running in your cluster, you should not attempt to", "line": 3, "column": 53, "excerpt_offset": 52, "severity": "MUST", "arbitrated": false, "offset": 82, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "CODE                    ,  CODE    ) to ensure that they don't rely on some", "line": 11, "column": 59, "excerpt_offset": 57, "severity": "MUST", "arbitrated": false, "offset": 434, "token": "don't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 71, "excerpt_offset": 67, "severity": "MUST", "arbitrated": false, "offset": 1303, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'be restored'; name the actor", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 78, "excerpt_offset": 74, "severity": "MUST", "arbitrated": false, "offset": 1310, "token": "be"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If the access URLs of the restored cluster are changed from the previous\ncluster, the Kube", "line": 52, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2651, "token": "If"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If the majority of etcd members have permanently failed, the etcd cluster is\nconsidered fa", "line": 61, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3138, "token": "If"}], "html": "## Restoring an etcd cluster\n\nIf any API servers are running in your cluster, you <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not attempt to\nrestore instances of etcd. Instead, follow these steps to restore etcd:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`,\n`kube-controller-manager`, `kubelet`) to ensure that they <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on some\nstale data. In practice the restore takes a bit of time.  During the\nrestoration, critical components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.minor](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be present. It can\neither be a snapshot file from a previous backup operation, or from a remaining\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** since etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to utilize [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured accordingly. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> the majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan be scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance, please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 403, "findings": [{"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "The Kubernetes project also recommends restarting Kubernetes components ( CODE           ,", "line": 9, "column": 138, "excerpt_offset": 137, "severity": "MUST", "arbitrated": false, "offset": 386, "token": "don't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "To restore with [ CODE    ]( URL                                                          ", "line": 15, "column": 136, "excerpt_offset": 132, "severity": "MUST", "arbitrated": false, "offset": 1103, "token": "should"}], "html": "## Restoring an etcd cluster\n\nDo not restore etcd instances while any API servers are running in your cluster. Instead, follow these steps:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`, `kube-controller-manager`, `kubelet`) so they <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on stale data. The restore takes some time, and during it critical components will lose their leader lock and restart themselves.\n\netcd supports restoring from snapshots taken by an etcd process of the same [major.minor](https://semver.org/) version. Restoring from a different patch version of etcd also works. Use a restore operation to recover the data of a failed cluster.\n\nYou need a snapshot file before you start. It can come from a previous backup operation, or from a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   To restore with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use `--data-dir` to say where the cluster <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   Here `&lt;data-dir-location&gt;` is a directory that the restore process creates.\n\n\n   Using `etcdctl` to restore has been **deprecated** since etcd v3.5.x and is scheduled for removal in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   This example shows the restore operation with the `etcdctl` tool:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before you restore the cluster.\n   Otherwise, change the etcd configuration and restart the etcd process after the restore so it uses the new data directory. First, in `/etc/kubernetes/manifests/etcd.yaml`, set `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`. Then run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the restored cluster&#x27;s access URLs differ from the previous cluster&#x27;s, reconfigure the Kubernetes API server to match. Restart the Kubernetes API servers with the flag `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you might need to update the load balancer instead.\n\nIf the majority of etcd members fail permanently, the etcd cluster is considered failed. Kubernetes then cannot make any changes to its current state. Scheduled pods might keep running, but no new pods can be scheduled. To fix this, recover the etcd cluster and, if needed, reconfigure the Kubernetes API servers.\n\n\n## Upgrading etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.", "factLoss": false, "fidelity": {"source_words": 595, "rewrite_words": 530, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-D3", "quote": "stop *all* API server instances", "problem": "The three restore steps (stop API servers, restore etcd state, restart API servers) form a strict, order-dependent sequence but are shown as a bulleted list.", "fix": "Replace the bullets with a numbered list: 1. stop all API server instances, 2. restore state in all etcd instances, 3. rest
