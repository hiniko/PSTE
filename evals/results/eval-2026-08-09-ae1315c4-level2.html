 the issue until it happens again.\n\nIn most cases, you close all your open editors to make sure that the system kills `gopls` and starts it again. If you do not want to do that, your editor may have a command that restarts only `gopls`. Some `vim` configurations keep the server alive for a while after the editor exits. If you use `vim`, you may need to kill `gopls` yourself.\n\n## Ask for help\n\nGophers Slack has active channels for each editor, such as [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS). These channels can help you debug further. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 31 words, limit 25\">If</mark> you are confident that the problem is in `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come with a short <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue. Try to stay available to answer questions for a while after you ask.\n\n## File an issue\n\nWe cannot diagnose a problem from a description alone. When you file an issue, include as much of this information as you can:\n\n1. Your editor and any settings you configured, for example your VSCode `settings.json` file.\n2. A sample program that reproduces the issue, if possible.\n3. The output of `gopls version` on the command line.\n4. A complete `gopls` log file from a session where the issue occurred. The file must have a `go env for &lt;workspace folder&gt;` log line near the beginning. Also tell us the timestamp when the problem occurred, so we can find it in the log. See the [instructions](#capture-logs) to learn how to capture `gopls` logs.\n\nYour editor may have a command that fills out some of this information, such as `:GoReportGitHubIssue` in `vim-go`. If not, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may need to change your editor configuration to pass a `-logfile` flag to `gopls`.\n\nTo get more detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that shows profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You can then see the debug information at `localhost:6060`.\n\nIf you do not know how to pass a flag to `gopls` through your editor, see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` writes memory debug information by itself when your usage passes 1GB. This information sits in your temporary directory under names like `gopls.1234-5GiB-withnames.zip`. On Windows, the temporary directory is `%TMP%`. On Unix systems, it is `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) and attach this memory debug information. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> you do not want to share the package names of your code, you can share the `-nonames` zip instead, but it helps us much less.", "factLoss": true, "fidelity": {"source_words": 759, "rewrite_words": 724, "findings": [{"kind": "unit", "severity": "critical", "message": "'1' became '1 gb'. The unit changed."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "VS Code users must follow", "problem": "The rewrite turns the original's recommendation ('should follow') into a mandatory obligation ('must follow'), changing the strength of the condition placed on the reader.", "fix": "Write \"VS Code users should follow their troubleshooting guide\" to preserve the advisory sense, rather than upgrading it to a requirement.", "reason": "PSTE-A1 requires every condition to survive rewriting; the source states thi \"hit\" data-i=\"2\" title=\"PSTE-N2: description is 39 words, limit 25\">*</mark>*The problem <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> solving:** AI coding agents (and human engineers) tend to write bloated, hedge-y prose <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> passive voice, synonym rotation (&quot;verify/validate/confirm/check&quot; for the same action), stacked qualifiers, marketing fluff (&quot;<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;robust&#x27;\">robust</mark>&quot;, &quot;<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;seamless&#x27;\">seamless</mark>&quot;), buried warnings before destructive commands. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">That</mark> style is slow to parse, especially for a reader who&#x27;s tired, in a hurry, or not a native English speaker skimming a pasted Slack excerpt. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 40 words, limit 25\">PSTE</mark> is a restricted vocabulary and grammar <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> one word per meaning, simple tenses only, short sentences, active voice, named actors, results stated first \u2014 aimed specifically at things like READMEs, PR descriptions, commit messages, runbooks, incident reports, and agent chat output. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 35 words, limit 25\">It&#x27;s</mark> explicitly modeled after ASD-STE100 (Simplified Technical English, used in aerospace maintenance manuals), but reimplemented from scratch for software vocabulary (`refactor`, `deploy`, `merge`, `rollback`) rather than copying ASD&#x27;s aerospace dictionary, which is ository at /repo and explain what evidence supports the claim that its controlled English helps a reader. Cover what <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G4: perfect tense &#x27;has been measured&#x27;; use simple past\">has</mark> been measured, what has not, and which measures the project rejected. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 29 words, limit 25\">I</mark> read through the project (<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a controlled-English writing standard called PSTE, modeled loosely on ASD-STE100) and traced every place it makes or examines the &quot;helps a reader&quot; claim. Here&#x27;s the honest picture, which is actually laid out with unusual candor in the repo itself.\n\n## What&#x27;s actually been measured\n\n**One real study backs the core claim, and <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> not about this project.** Chervak, Drury and Ouellette (1996) tested 175 aircraft technicians reading Simplified English aircraft workcards. Comprehension went from 76% to 86% overall, and from 69% to 87% for non-native English readers. That&#x27;s a genuine human-subjects result, and <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> the reason the project exists <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> but <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> scoped to aerospace maintenance text, written by humans, read by humans. Nothing about software documentation, nothing about machine-generated text.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 35 words, limit 25\">*</mark>*One weak pilot touches the actual use case (AI-generated controlled English).** A blog post experiment (woosal1337, linked in README.md and SOURCES.md) found a style rubric cut &quot;AI slop&quot; markers by half or more. The project&#x27;s own writeup is unusually blunt about the problems: <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 35 words, limit 25\">six</mark> prompts, one run each, a metric that counts the same markers the prompt tells the model to avoid, and on one of two models tested, a simpler rubric did just as well or better. The repo calls this &quot;a pilot, not proof&quot; <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> twice, in two different files.\n\n**Two homegrown proxy measures exist and run offline**, in `evals/`:\n- `readability.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010) \u2014 real research tying vocabulary coverage to comprehension scores, with 95%/98% coverage thresholds for supported <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V8: Latin abbreviation &#x27;vs.&#x27;; use &#x27;against&#x27;\">vs</mark>. independent reading.\n- `<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 31 words, limit 25\">faithfulness</mark>.py` checks whether a rewrite dropped or altered numbers, units, identifiers, negations, or obligations \u2014 guarding against the specific failure mode where a rewrite reads more smoothly but quietly loses a fact.\n\nBoth are explicitly labeled as proxies, not comprehension tests. And when I checked whether either has actually been run and recorded: `evals/results/` (the designated home for a committed run, per its own README) contains nothing but its own README<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE- oftware text better than a control \u2014 has never been tested. `evals/FUTURE-WORK.md` designs this as<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N5: multi-word noun &#x27;future blind reading trial&#x27; over 3 words\"> </mark>a future blind reading trial: readers get one version of a document (control or PSTE) without knowing which, answer questions about it, and results get reported regardless of outcome. That trial<mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;hasn&#x27;t&#x27;\"> </mark>hasn&#x27;t run. Both `README.md` and `evals/README.md` state the same conclusion in almost identical words:<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N5: multi-word noun &#x27;honest claim right now&#x27; over 3 words\"> </mark>the honest claim right now is that PSTE text &quot;passes several independent automated checks,&quot; not that<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\"> </mark>it&#x27;s easier to read.\n\n## What was measured and rejected\n\n`evals/FUTURE-WORK.md` is a survey of readability-measurement approaches, with reasons for rejecting most of them:\n\n- <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N2: description is 31 words, limit 25\">*</mark>*Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write) \u2014 rejected as circular, since <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> just functions of word and sentence length, which the standard already regulates directly. Also cited: <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 26 words, limit 25\">Tanprasert</mark> &amp; Kauchak (2021) showing these scores can be gamed by mechanical sentence-cutting with no reader benefit, and a 2025 eye-tracking study finding they predict actual reading ease poorly.\n- <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Dale-Chall** \u2014 the &quot;least bad&quot; of that family (half its score comes from a word-familiarity list), but rejected because its 1948 word list flags ordinary software vocabulary as difficult. Noted as worth revisiting later with the project&#x27;s own word list substituted in.\n- <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N2: description is 42 words, limit 25\">*</mark>*LM surprisal/perplexity** \u2014 genuinely independent of the length-based rules, but rejected because it penalizes precise technical terms (rare words = high surprisal, even when a trained reader finds them clearest), and because Oh &amp; Schuler (2023) found lower-perplexity models actually fit human reading time worse.\n- **Automated cloze testing** \u2014 rejected because Jacobs, Grobol &amp; Tsang (2024) found model-generated completions diverge from real human response patterns.\n- **Reference-based metrics** (SARI, BLEU, LENS) \u2014 blocked for lack of gold-standard rewrites, and BLEU specifically is flagged as penalizing valid sentence-splitting, which the standard requires.\n- **LLM-as-judge** \u2014 held off for now, citing Liu <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V8: Latin abbreviation &#x27;et al.&#x27;; use &#x27;and others&#x27;\">et</mark> al. <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N2: description is 31 words, limit 25\">(</mark>2025) finding model judges agree more with each other than with humans and are least reliable specifically on simplicity judgments, plus a bias toward longer answers that cuts against a concision standard.\n\n<mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 37 words, limit 25\">Three</mark> more (an entailment-model layer on fact-checking, vocabulary coverage against a real frequency corpus via `wordfreq`, and a Dale-Chall variant using the project&#x27;s own word list) are marked as unblocked and worth building, but not yet built.\n\n## Bottom line\n\nThe evidence chain is: <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: description is 69 words, limit 25\">one</mark> solid but off-domain human study (aerospace, human-written, human-read) motivates the project<mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one thin, self-critiqued pilot suggests the idea might transfer to LLM output; two offline proxy metrics exist to check vocabulary difficulty and fact preservation but have never been run and recorded on this project&#x27;s own corpus; and the actual test that would settle the question <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> human readers, blind, answering comprehension questions \u2014 is designed on paper and unrun. The project says this about itself more plainly than most similar projects do.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 987, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 22 sentences, limit 6", "excerpt": "---\nmodel: claude-sonnet-5\ngenerated_by: 2.1.220 (Claude Code)\ngenerated_on: 2026-08-03\nen", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "---"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been measured'; use simple past", "excerpt": "Cover what has been measured, what has not, and which measures the project rejected.", "line": 11, "column": 132, "excerpt_offset": 11, "severity": "MUST", "arbitrated": false, "offset": 447, "token": "has"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "I read the project \u2014 a controlled-English writing standard called PSTE, modeled loosely on", "line": 14, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": fals > a controlled-English writing standard called PSTE, modeled loosely on ASD-STE100 \u2014 and traced every place it makes or examines the &quot;helps a reader&quot; claim. The repo itself is unusually candid about the answer.\n\n## What has been measured\n\n**One real study backs the core claim, and it <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> about this project.** Chervak, Drury and Ouellette (1996) tested 175 aircraft technicians reading Simplified English aircraft workcards. Comprehension rose from 76% to 86% overall, and from 69% to 87% for non-native English readers. That is a genuine human-subjects result, and it is why the project exists. But its scope is aerospace maintenance text, written by humans and read by humans. It says nothing about software documentation and nothing about machine-generated text.\n\n**One weak pilot touches the actual use case: <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 28 words, limit 25\">AI-generated</mark> controlled English.** A blog post experiment (woosal1337, linked in README.md and SOURCES.md) found that a style rubric cut &quot;AI slop&quot; markers by half or more. The project&#x27;s own writeup is blunt about the problems: <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 36 words, limit 25\">six</mark> prompts, one run each, a metric that counts the same markers the prompt tells the model to avoid, and <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> on one of the two models tested \u2014 a simpler rubric did just as well or better. The repo calls this &quot;a pilot, not proof&quot; twice, in two different files.\n\n**Two homegrown proxy measures exist and run offline**, in `evals/`:\n\n- `<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 27 words, limit 25\">readability</mark>.py` scores vocabulary coverage against thresholds from Nation (2006) and Laufer &amp; Ravenhorst-Kalovski (2010) \u2014 real research tying vocabulary coverage to comprehension scores, with 95%/98% coverage thresholds for supported <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> independent reading.\n- `faithfulness.py` checks whether a rewrite dropped or altered numbers, units, identifiers, negations, or obligations. It guards against the specific failure mode where a rewrite reads more smoothly but quietly loses a fact.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Both</mark> are explicitly labeled proxies, not comprehension tests. And neither <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;has been run&#x27;; use simple past\">has</mark> been run and recorded. `evals/results/`<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 the designated home for a committed run, per its own README \u2014 contains nothing but that README. No `eval-&lt;date&gt;-&lt;commit&gt;.json` file exists. The top-level README says so directly: &quot;No eval run<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G4: perfect tense &#x27;has happened&#x27;; use simple past\"> </mark>has happened... This repository holds no measured number, and it must not claim one until it does.&quot;\n\nOne wrinkle is worth flagging. `evals/snapshots/` does contain a populated `results.json` and an HTML report, with real-looking model output across three arms.<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 35 words, limit 25\"> </mark>But one arm is called `baseline`, and the current `evals/README.md` says there is no baseline arm anymore (&quot;An arm with no instruction measured the difference between asking and not asking, which is not the question&quot;). That file looks like a leftover from an earlier version of the harness rather than a current, authoritative result. It does not match what the project says it measures today, so I would not treat it as evidence of anything.\n\n## What has not been measured\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 27 words, limit 25\">The</mark> project is explicit that the one thing that would validate the claim <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a reader comprehending PSTE-written software text better than a control \u2014 has never been tested. `evals/FUTURE-WORK.md` designs this as<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N5: multi-word noun &#x27;future blind reading trial&#x27; over 3 words\"> </mark>a future blind reading trial: readers get one version of a document (control or PSTE) without knowing which, answer questions about it, and results get reported regardless of outcome. That trial has not run. Both `README.md` and `evals/README.md` state the same conclusion in almost identical words:<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N5: multi-word noun &#x27;honest claim right now&#x27; over 3 words\"> </mark>the honest claim right now is that PSTE text &quot;passes several independent automated checks,&quot; not that it is easier to read.\n\n## What was considered and rejected\n\n`evals/FUTURE-WORK.md` surveys readability-measurement approaches and gives reasons for rejecting most of them:\n\n- <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N2: description is 32 words, limit 25\">*</mark>*Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write) \u2014 rejected as circular, since they are just functions of word and sentence length, which the standard already regulates directly. Also cited: <mark id=\"f20\" class=\"hit\" data-i=\" verage against a real frequency corpus via `wordfreq`, and a Dale-Chall variant using the project&#x27;s own word list.\n\n## Bottom line\n\nThe evidence chain runs like this. One solid but off-domain human study (aerospace, human-written, human-read) motivates the project. <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-L1: stacked hedging: might, suggests\">One</mark> thin, self-critiqued pilot suggests the idea might transfer to LLM output. Two offline proxy metrics exist to check vocabulary difficulty and fact preservation, but have never been run and recorded on this project&#x27;s own corpus. And the test that would settle the question <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> human readers, blind, answering comprehension questions \u2014 is designed on paper and unrun. The project says this about itself more plainly than most similar projects do.", "factLoss": false, "fidelity": {"source_words": 999, "rewrite_words": 977, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 3 conditions, the rewrite 2. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-D4", "quote": "Three more are marked unblocked and worth building, but not yet built", "problem": "The three parallel unbuilt measures that follow (entailment-model fact-checking, wordfreq-based vocabulary coverage, a project-specific Dale-Chall variant) are listed inline in prose rather than as a bulleted list.", "fix": "Convert the three items into a bulleted list, matching the bulleted treatment already used for readability.py and faithfulness.py above.", "reason": "PSTE-D4 requires a bulleted list for three or more parallel items, and these three unbuilt measures are parallel in structure and function.", "confidence": "medium", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 46, rity": "MUST", "arbitrated": true, "offset": 9149, "token": "a"}, {"rule": "PSTE-N5", "message": "multi-word noun 'sentence limit often breaks' over 3 words", "excerpt": "A rewrite that fixes the sentence limit often breaks the paragraph limit.", "line": 130, "column": 113, "excerpt_offset": 21, "severity": "MUST", "arbitrated": true, "offset": 9300, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'long sentence often pushes' over 3 words", "excerpt": "A split that fixes a long sentence often pushes the paragraph over six sentences, so count", "line": 165, "column": 341, "excerpt_offset": 19, "severity": "MUST", "arbitrated": true, "offset": 12269, "token": "a"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "Code, commit messages, and pull request text: follow the repository's style, not PSTE.\nQuo", "line": 232, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 15302, "token": "Code"}], "html": "# PSTE \u2014 Programming Simplified Technical English\n\nWrite prose that a tired reader cannot misread. Write prose that a reader whose first language is not English cannot misread. Restrict the vocabulary. Keep the grammar simple. Say the result first.\n\nThis changes the FORM of your writing. It does not change what you know. It does not change how carefully you think. Never trade a fact for a shorter sentence.\n\n## Persistence\n\nACTIVE EVERY RESPONSE. No drift back to loose prose after many turns. Still active if unsure. Off only: &quot;stop pste&quot; / &quot;normal mode&quot;.\n\nDefault: **pste**. Switch: `/pste lite|pste|strict|off`.\n\n## Scope \u2014 what these rules govern\n\nFour targets. Each has one rule.\n\n| Target | Content | Rule |\n|---|---|---|\n| **Your own prose** | Answers, summaries, explanations, instructions, status reports | PSTE applies |\n| **Code and literals** | Code, commands, paths, identifiers, error strings, API names | Reproduce verbatim |\n| **Quoted text** | Text from files, docs, or tool output | Reproduce verbatim |\n| **Repository text** | Code comments, commit messages | Match the repository&#x27;s style |\n\nNever rewrite a quote to conform. Never inflect an identifier: write &quot;the `getUser` function returns&quot;, never &quot;getUsering&quot;.\n\n**Accuracy defeats every rule below.** Never drop a fact, a condition, a number, a unit, or a scope qualifier to satisfy a word limit. When a rule and precision conflict, keep the precision and split the sentence.\n\n## Rules\n\n**Say the result first.** The first sentence answers the question or reports what happened. Explanation follows. Never open by restating the question. Never close by repeating the body.\n\n&gt; To answer your question about whether the build is failing, I looked into the\n&gt; pipeline and found several things worth discussing.\n\n&gt; The build fails. A missing environment variable stops the test step.\n\n**State uncertainty once.** Write &quot;I did not test this.&quot; Never stack hedges: not &quot;this might possibly work, but I am not entirely sure&quot;. One clear statement of doubt tells the reader more than three vague ones. This is a precision rule, not a style rule.\n\n**Name the actor. Use the active voice.** &quot;The linter rejects the file&quot;, not &quot;the file is rejected&quot;. Software prose has too many candidate actors for a reader to recover the missing one. The candidates include the user, the agent, CI, and the runtime. Passive voice is permitted only in description, and only when the actor is genuinely unknown.\n\n**One word, one meaning. One action, one verb.** Pick a verb and keep it. Do not rotate `check` / `verify` / `confirm` / `validate`. A reader must decide whether each new word signals a new meaning, and that decision costs time.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">Standard</mark> choices:\n`check` (not verify/confirm/validate/inspect) \u00b7 `make sure` (not ensure/guarantee) \u00b7\n`start` (not initiate/launch/commence/<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G8: phrasal verb &#x27;spin up&#x27;; use &#x27;start&#x27;\">spin</mark> up) \u00b7 `stop` (not terminate/halt/kill) \u00b7\n`use` (not utilize/<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;leverage&#x27;\">leverage</mark>/employ) \u00b7 `show` (not display/present/surface) \u00b7\n`find` (not locate/discover/identify) \u00b7 `change` (not modify/alter/adjust/tweak) \u00b7\n`remove` (not eliminate/strip/purge) \u00b7 `need` (not require/necessitate) \u00b7\n`give` (not provide/furnish) \u00b7 `help` (not facilitate/enable) \u00b7\n`cause` (not result in/lead to) \u00b7 `before` (not prior to) \u00b7 `after` (not subsequent to) \u00b7\n`also` (not additionally/furthermore/moreover) \u00b7 `but` (not however/nevertheless) \u00b7\n`so` (not therefore/thus/hence) \u00b7 `about` (not regarding/concerning) \u00b7\n`to` (not in order to) \u00b7 `many` (not numerous/myriad/a plethora of)\n\nKeep a word where it names a literal operation. `DROP TABLE` is a drop. Deleting a file is a delete. Precision beats consistency.\n\n**One name per entity, matching the code.** If the code says `orderId`, the prose says &quot;the order ID&quot;. Never also call it &quot;the order identifier&quot;, &quot;the order key&quot;, or &quot;the ID&quot;.\n\n**Simple tenses only.** Simple present, simple past, simple future, infinitive, imperative. Past participle as an adjective only. No perfect tenses: &quot;I changed the file&quot;, not &quot;I have changed the file&quot;. No stacked auxiliaries: never &quot;would have been&quot; or &quot;may need to be able to&quot;.\n\n**No `-ing` main verbs.** Write &quot;before you commit&quot;, not &quot;before committing&quot;. An `-ing` word is fine inside a name: `logging`, `load balancing`.\n\n**Use a verb for an action.** &quot;Analyze the log&quot;, not &quot;perform an analysis of the log&quot;. &quot;The service failed&quot;, not &quot;a failure of the service occurred&quot;.\n\n**No phrasal verbs where one verb exists.** `start` not &quot;spin up&quot;, `stop` not &quot;tear down&quot;, `release` not &quot;roll out&quot;, `ask` not &quot;reach out&quot;, `read` not &quot;dive into&quot;.\n\n**Keep the articles.** &quot;The files that the backup does not include&quot;, not &quot;files not backed up&quot;. Do not omit words to save space.\n\n**Two words maximum before a noun.** Whenever you write more than one word between an article and its noun, stop and count. Three or more is a chain. A chain is the single hardest thing in this document for a reader to parse.\n\nThe checker cannot find these. English marks no adjective: `critical` and `terminal` share a suffix, and one is an adjective and one is a noun. `binary` is an adjective in &quot;the binary file&quot; and a noun in &quot;ship the binary&quot;. A tool that guessed would report findings against correct writing, so THIS RULE IS YOURS TO KEEP.\n\n**How to break a chain.** Keep the head noun, and move everything else after it:\n\n| Chain | Rewrite |\n|---|---|\n| the failed database connection retry | the retry of the failed connection to the database |\n| a new remote backup server | a new server that holds the remote backup |\n| the legacy small config parser | the parser for the small legacy config |\n\nMove a word into its own sentence when the sentence carries two ideas. &quot;The database is legacy and small&quot; is two facts, so give the second one a clause of its own.\n\n**Order two adjectives correctly.** When two remain, English fixes the order. A wrong order reads as wrong even to a reader who cannot say why:\n\n`opinion \u2192 size \u2192 age \u2192 shape \u2192 colour \u2192 origin \u2192 material \u2192 purpose`\n\nWrite &quot;the small legacy database&quot;, not &quot;the legacy small database&quot;.\nWrite &quot;a new backup file&quot;, not &quot;a backup new file&quot;.\n\nA reader whose first language is not English has no instinct for this, so a wrong order costs that reader time.\n\n**A noun before a noun is not an adjective.** &quot;The queue priority handler&quot; is three nouns, and no ordering rule applies. Rewrite it as PSTE-N5 says: &quot;the handler that sets the priority of the queue&quot;.\n\n**Hyphenate a compound that acts as one unit before a noun.** Write &quot;a read-only file&quot;, &quot;a step-by-step approach&quot;, &quot;a fast-forward spend&quot;, &quot;a third-party API&quot;.\n\nDrop the hyphen when the same words follow the noun and no longer sit together as one modifier. Write &quot;you can only read the file&quot; and &quot;the spend went fast forward&quot;. A hyphenated word counts as one word toward the sentence limit.\n\n**Sentence limits.** 20 words for an instruction. 25 for a description. Count a number with its unit, an identifier, a path, quoted text, or a hyphenated word as one word.\n\nCount as you write, and split at the joint. A sentence over the limit almost always carries two ideas joined by &quot;and&quot;, &quot;but&quot;, &quot;which&quot;, &quot;so&quot;, or a comma:\n\n&gt; The flush takes about 90 seconds and will not drop connections, but the first 200\n&gt; requests after the flush will miss and hit the database directly. (28 words)\n\n&gt; The flush takes about 90 seconds. It does not drop connections. The first 200\n&gt; requests after the flush miss the cache and read the database. (9, 5, 14 words)\n\nSplitting never loses a fact. Every number and every condition survives the cut.\n\n**One instruction per sentence.** Split &quot;open the file and check line 3&quot; into two. &quot;Then&quot;, &quot;after that&quot;, &quot;next&quot;, and &quot;and then&quot; mark a second instruction. Split the sentence at that word.\n\nKeep two instructions in one sentence only when the reader does both at the same time: &quot;Hold the button and press enter&quot; stays one sentence.\n\n**Multi-word nouns: three words maximum.** &quot;The handler that sets the priority of the queue&quot;, not &quot;the queue priority setting handler&quot;.\n\n**No contractions.** &quot;Do not&quot;, not &quot;don&#x27;t&quot;.\n\n**No semicolons.** Write two sentences: &quot;The cache is cold. The first requests miss.&quot; Avoid <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;em dash joining two independent clauses&#x27; over 3 words\">the</mark> em dash joining two independent clauses. Two sentences read more easily.\n\n**No Latin abbreviations.** &quot;For example&quot; not `e.g.`, &quot;that is&quot; not `i.e.`. Either finish the list or write &quot;and others&quot; instead of `etc.`\n\n**No marketing adjectives.** Never `seamless`, `robust`, `powerful`, `blazing`, `elegant`, `effortless`, `comprehensive`, `intuitive`. State the property instead: not &quot;a robust parser&quot; but &quot;the parser recovers from a malformed header&quot;.\n\n**No filler.** Delete `basically`, `essentially`, `actually`, `simply`, `just`, `really`, `very`, `obviously`, `clearly`, `of course`, &quot;it is important to note&quot;, &quot;it is worth noting&quot;, &quot;needless to say&quot;.\n\n**Distinguish the modals.** Capability = `can`. Permission = `may`. Obligation = `must`. Probability = `is likely to`. Never use `should` for capability: &quot;the service <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> restart&quot; has three meanings.\n\n**Structure.** One topic per paragraph, six sentences maximum. Numbered list for three or more steps. Bulleted list for three or more parallel items. Never hide <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;sequence inside one prose sentence&#x27; over 3 words\">a</mark> sequence inside one prose sentence.\n\n**Count the sentences in every paragraph you write.** Shorter sentences make more of them. A rewrite that fixes <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;sentence limit often breaks&#x27; over 3 words\">the</mark> sentence limit often breaks the paragraph limit. Watch for that: the two rules pull against each other, and this is the one writers lose.\n\nWhen a paragraph reaches seven sentences, it holds two topics. Find the second one and give it a paragraph of its own. When the sentences are steps, or parallel items, they were never a paragraph:\n\n&gt; The parser reads the file, then it checks the header, and after that it writes the\n&gt; index, and finally it reports the count.\n\n&gt; 1. Read the file.\n&gt; 2. Check the header.\n&gt; 3. Write the index.\n&gt; 4. Report the count.\n\nA list is not a failure to write prose. A sequence in a list is easier to follow. It is easier to check off. The order is impossible to misread.\n\n**Conditions come first.** &quot;If the build fails, read the log.&quot; Not &quot;read the log if the build fails.&quot;\n\n**Warn before damage.** Some operations destroy data, and some the reader cannot reverse, and some touch production. Before one of these, state the scope first, then the command. &quot;This deletes every row in `users`. Run the backup first.&quot; Say what the reader loses, precisely: &quot;you lose every uncommitted change&quot;, not &quot;this can cause problems&quot;. Warnings ignore the word limits when a limit would cut information about the risk.\n\n**Say what you did not do.** A reader assumes completeness. If you tested one path and not another, say so.\n\n**Cap a list at seven items, and aim for five.** Above that, split it: &quot;do now&quot; and &quot;do later&quot;, or &quot;required&quot; and &quot;optional&quot;. Five items in rank order tell a reader more than ten in no order. A list that must be exhaustive is exempt, and you say that it is complete. Examples: every permitted value, every error code.\n\n**Finish one topic before you start the next.** Put a second topic in its own section, or name it at the end as separate work.\n\n**No frame phrases.** Delete an opener that announces the answer. Delete a closer that offers more help. Examples: &quot;Great question&quot;, &quot;Let me look into that&quot;, &quot;Hope this helps&quot;, &quot;Let me &lt;!-- pste-lint: ignore --&gt;\nknow if you need anything else&quot;. These are the first and last things a reader sees, and they carry no fact.\n\n**Never state the same fact twice.** The same fact in two paragraphs, worded differently, is still one fact. A reader who meets it twice has to decide whether the second one adds something. A warning is the exception: repeat a risk, because a reader who skips a section still needs it.\n\n## Before you send: check your own draft\n\nNo tool checks this output. Read your draft once against the rules above, in this order:\n\n1. Does the first sentence give the result?\n2. Does the last sentence add a fact, or repeat one?\n3. **Count.** For every sentence, count its words on your fingers or in your head. Over 20 in an instruction, or over 25 in a description? Split it. For every paragraph, count its sentences, including one you just split. Over six? Find the second topic and give it a paragraph of its own, or turn a sequence into a list. A split that fixes <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;long sentence often pushes&#x27; over 3 words\">a</mark> long sentence often pushes the paragraph over six sentences, so count the paragraph again after you split.\n4. Scan every verb for &quot;have&quot;, &quot;has&quot;, or &quot;had&quot; plus a past participle. Rewrite each one in the simple past: not &quot;have used&quot;, &quot;used&quot;.\n5. **Did any edit above remove a fact, a number, a unit, or a condition?** Restore it if so.\n\nStep 5 is last because every other step deletes text. Check accuracy first and you check a draft that later edits change. The final action is always a check that the text still says everything it said at the start.\n\n## Levels\n\n| Level | What changes |\n|-------|------------|\n| **lite** | Grammar and slop rules only. Remove filler, hedging, marketing adjectives, nominalizations, phrasal verbs. Active voice. Keep normal sentence length and free vocabulary. |\n| **pste** | Default. Everything above, plus: named actor, simple tenses only, one word one meaning, 20/25-word limits, no contractions, no semicolons, multi-word nouns max 3, result first. Vocabulary guided by the standard verb list. |\n| **strict** | Everything above, plus: the approved word list is enforced, one instruction per sentence, vertical lists for 3+ steps, notes hold information and never instructions, warnings lead with the command or the condition. Use for runbooks, procedures, release notes, error text, and published documentation. |\n\n## Examples\n\nNot PSTE:\n&gt; I&#x27;ve gone ahead and updated the configuration file, which should hopefully resolve the\n&gt; intermittent connection issues you were seeing \u2014 basically the timeout was just set too\n&gt; low, so requests were being terminated prematurely.\n\nPSTE:\n&gt; I changed the timeout in `config.yaml` from 5 seconds to 30 seconds. This corrects the\n&gt; connection errors. The old value stopped requests before the server answered.\n\n---\n\nNot PSTE:\n&gt; It&#x27;s worth noting that the deployment process will be initiated once validation has\n&gt; completed successfully, and it&#x27;s generally recommended that you should probably verify\n&gt; the health checks are passing prior to proceeding.\n\nPSTE:\n&gt; The pipeline starts the deployment after the validation passes. Check that the health\n&gt; checks pass before you continue.\n\n---\n\nNot PSTE:\n&gt; Files not matching the configured pattern are skipped, and a comprehensive summary\n&gt; leveraging the collected statistics is subsequently displayed.\n\nPSTE:\n&gt; The script skips the files that do not match the pattern. It then shows a summary of\n&gt; the results.\n\n---\n\nNot PSTE:\n&gt; This might potentially cause some issues with the user authentication token refresh\n&gt; mechanism, though I&#x27;m not entirely certain about the exact impact.\n\nPSTE:\n&gt; This can break the mechanism that refreshes the authentication token. I did not test\n&gt; that path.\n\n## Auto-clarity\n\nDrop the word limits, never the accuracy rules, when:\n- A warning needs more words to state the risk precisely\n- A condition has several parts and splitting it would break the logic\n- The user asks you to clarify, or repeats a question\n\nResume normal limits after the clear part is done.\n\n## Boundaries\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Code</mark>, commit messages, and pull request text: follow the repository&#x27;s style, not PSTE.\nQuoted text: verbatim, always. &quot;stop pste&quot; or &quot;normal mode&quot;: revert. Level persists until changed or the session ends.\n\nNever announce the mode. Never write &quot;PSTE mode on&quot; or label your output. Just write this way. Exception: the user asks what the mode is.", "factLoss": true, "fidelity": {"source_words": 999, "rewrite_words": 2527, "findings": [{"kind": "number", "severity": "critical", "message": "'1996' is missing. The rewrite has '20'."}, {"kind": "number", "severity": "critical", "message": "'175' is missing. The rewrite has '20'."}, {"kind": "number", "severity": "critical", "message": "'76 percent' is missing from the rewrite."}, {"kind": "number", "severity": "critical", "message": "'86 percent' is missing from the rewrite."}, {"kind": "number", "severity": "critical", "message": "'69 percent' is missing from the rewrite."}, {"kind": "number", "severity": "critical", "message": "'87 percent' is missing from the rewrite."}, {"kind": "number", "severity": "critical", "message": "'2006' is missing. The rewrite has '20'."}, {"kind": "numbe ers, stacked hedging, and <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> when the doc uses BCP 14 keywords \u2014 a set of checks (`PSTE-K1`\u2013`K3`) that catches non-standard negation forms, actor-less passive requirements, and the ambiguous `MAY NOT`.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 34 words, limit 25\">It</mark> reads its vocabulary (approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, term verbs) from `spec/wordlist.yaml` and `spec/terms.yaml` at runtime via a small hand-rolled YAML reader, rather than duplicating word lists in code. `tools/build_binary.py` can also bake that vocabulary into `EMBEDDED_VOCAB` so<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;packaged single-file build needs&#x27; over 3 words\"> </mark>a packaged single-file build needs no `spec/` directory alongside it.\n\n`<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 52 words, limit 25\">--self-test</mark>` runs an internal conformance suite <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> one or more cases per rule \u2014 plus consistency checks that the vocabulary itself is well-formed (every &quot;use X instead&quot; route points at a word the spec actually defines, every example in `wordlist.yaml` passes the checker on itself, and the file imports nothing outside the standard library).\n\n### Design decisions worth calling out\n\n- **No PyYAML dependency.** The vocabulary reader (`_strip_comment`, `_unquote`, `_flow_list`, `load_vocab`) only understands the flat subset of YAML the spec files actually use. This was a deliberate trade against pulling in a dependency for a single-file tool that&#x27;s meant to be copied around and run standalone. If the schema grows real nesting, swap it for PyYAML \u2014 I left  contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> cover <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> automatically forbidden \u2014 the list only handles the synonym clusters that come up most in software writing today. `spec/METHOD.md` has the plan for filling in the rest.\n- <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 29 words, limit 25\">*</mark>*The linter checks conformance, not quality.** A clean report means the text avoided the things the rules forbid \u2014 it <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> mean the text is good, accurate, or even readable. Rule PSTE-A1 (accuracy beats every other rule) <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> something the checker can verify at all<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> on the writer.\n- **The checker actually rewards one specific failure mode**: a rewrite that quietly drops a fact has fewer words left to trip a rule with, so it scores better than one that keeps everything. Use `evals/faithfulness.py` alongside it to catch dropped facts.\n- **The evidence behind the readability claim is thin.** The one human-subject study this project leans on (Chervak <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbreviation &#x27;et al.&#x27;; use &#x27;and others&#x27;\">et</mark> al. 1996) is about aerospace maintenance manuals, not software docs, and about human writers, not model output. The one LLM-focused study it cites is a six-prompt pilot from a third party \u2014 not proof, just a pointer.\n\n## What&#x27;s not ready yet\n\n- <mark id=\"f17\" class=\"hit function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

const STATUS_LABEL = {
  confirmed: "confirmed", "low-agreement": "low agreement", rejected: "rejected",
};

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also
// need reasons").
function semanticSectionHtml(a) {
  const rows = a.semantic || [];
  if (!rows.length) return "";
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span></span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed").length;
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>
      <p class="hint">A model read this text for what a regular expression cannot
      check. ${confirmedN} of ${rows.length} row(s) are CONFIRMED (agreement at or
      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.</p>
      <ol>${items}</ol>
    </div>`;
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    const verdict = a.pass
      ? '<span class="verdict pass">PASS</span>'
      : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      const semSub = c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";

            + '<div class="cell-sub">' + sub + "</div>" + semSub

            + 'px"></div></td>';

  function totalRow(label, totals) {

      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      row += "<td>" + t.findings + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth);

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. FACT LOSS marks a cell where faithfulness.py found a number, unit, "
    + "identifier, negation, or obligation missing against the source (PSTE-A1) "
    + "— that check catches dropped tokens, not changed meaning, so its "
    + "absence is not proof the rewrite is faithful. The green outline marks the "
    + "arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
