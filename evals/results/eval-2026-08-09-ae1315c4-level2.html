aired; it does not repai", "line": 61, "column": 72, "excerpt_offset": 71, "severity": "MUST", "arbitrated": false, "offset": 1847, "token": ";"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "By default, repair operates on all token ranges replicated by the node on which repair is ", "line": 62, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1887, "token": "By"}, {"rule": "PSTE-N1", "message": "instruction is 28 words, limit 20", "excerpt": "Do a full cluster repair by running the  CODE                 command on each node in each", "line": 63, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2129, "token": "Do"}, {"rule": "PSTE-G1", "message": "passive voice 'are repaired'; name the actor", "excerpt": "Do a full cluster repair by running the  CODE                 command on each node in each", "line": 63, "column": 158, "excerpt_offset": 157, "severity": "MUST", "arbitrated": false, "offset": 2286, "token": "are"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "The specific frequency of repair that's right for your cluster, of\ncourse, depends on seve", "line": 65, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2302, "token": "The"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "However, if you're just starting out", "line": 66, "column": 49, "excerpt_offset": 12, "severity": "MUST", "arbitrated": false, "offset": 2417, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "you don't want to run incremental repairs, a full repair every 5 days is", "line": 69, "column": 5, "excerpt_offset": 4, "severity": "MUST", "arbitrated": false, "offset": 2589, "token": "don't"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "At a minimum, repair should be run often enough that the gc grace period\nnever expires on ", "line": 72, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2682, "token": "At"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "At a minimum, repair should be run often enough that the gc grace period", "line": 72, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": false, "offset": 2703, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With a default gc grace period of 10 days, repairing every", "line": 74, "column": 16, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "offset": 2834, "token": "a"}, {"rule": "PSTE-D2", "message": "paragraph has 22 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 80, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3025, "token": "-pr"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "data, but doesn't do any streaming.", "line": 93, "column": 13, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 3716, "token": "doesn't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "a full repair should be run.", "line": 95, "column": 17, "excerpt_offset": 14, "severity": "MUST", "arbitrated": false, "offset": 3849, "token": "should"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full repairs, and incremental repairs.\nFull repairs operate over all of the data in the token range being\nrepaired. Incremental repairs only repair data that&#x27;s been written since\nthe previous incremental repair.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">Incremental</mark> repairs are the default repair type, and if run regularly,\ncan significantly reduce the time and io cost of performing a repair.\nHowever, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> important to understand that once an incremental repair\nmarks data as repaired, it <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> try to repair it again. This is fine\nfor syncing up missed writes, but it <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> protect against things like\ndisk corruption, data loss by operator error, or bugs in Cassandra. For\nthis reason, full repairs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> still be run occasionally.\n\n== Automated Repair Scheduling\n\nSince repair can result in a lot of disk and network io, it has\ntraditionally not been run automatically by Cassandra.\n\nIn the latest version of Cassandra, a new feature called\nxref:managing/operating/auto_repair.adoc[auto repair] was introduced to\nallow Cassandra to submit and manage repairs automatically on a schedule.\n\nThe <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G7: nominalization &#x27;introduction of&#x27;; use a verb\">introduction</mark> of this feature does not interfere with existing repair\nfunctionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nRepairs can also be run by the operator via nodetool.\n\nIncremental repair is the default and is run with the following command:\n\n[source,none]\n----\nnodetool repair\n----\n\nA full repair can be run with the following command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nAdditionally, repair can be run on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr even on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node being repaired<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it does not repair the whole cluster.\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">By</mark> default, repair operates on all token ranges replicated by the node on which repair is run, causing duplicate work when running it on every node. Avoid duplicate work by using the `-pr` flag to repair only the &quot;primary&quot; ranges on a node. \n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N1: instruction is 28 words, limit 20\">Do</mark> a full cluster repair by running the `nodetool repair -pr` command on each node in each datacenter in the cluster, until all of the nodes and datacenters <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;are repaired&#x27;; name the actor\">are</mark> repaired. \n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">The</mark> specific frequency of repair that&#x27;s right for your cluster, of\ncourse, depends on several factors. However, if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out\nand looking for somewhere to start, running an incremental repair every\n1-3 days, and a full repair every 1-3 weeks is probably reasonable. If\nyou <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to run incremental repairs, a full repair every 5 days is\na good place to start.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">At</mark> a minimum, repair <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run often enough that the gc grace period\nnever expires on unrepaired data. Otherwise, deleted data could\nreappear. With <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">a</mark> default gc grace period of 10 days, repairing every\nnode in your cluster at least once every 7 days will prevent this, while\nproviding enough slack to allow for delays.\n\n== Other Options\n\n`<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 22 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being\n  repaired. A primary range is just a token range for which a node is\n  the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that would occur for the given\n  repair command. This builds the merkle trees, and prints the expected\n  streaming activity, but does not actually do any streaming. By\n  default, incremental repairs are estimated, add the `--full` flag to\n  estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Similar\n  to `--preview`, this builds and compares merkle trees of repaired\n  data, but <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> do any streaming. This is useful for\n  troubleshooting. If this shows that the repaired data is out of sync,\n  a full repair <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be run.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 494, "findings": [{"rule": "PSTE-N3", "message": "contraction 'won't'", "excerpt": "That works for syncing up missed writes, but it won't protect you from disk corruption, da", "line": 5, "column": 248, "excerpt_offset": 48, "severity": "MUST", "arbitrated": false, "offset": 485, "token": "won't"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "The latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.", "line": 11, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 760, "token": "The"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "The repair command repairs token ranges only on the node being repaired \u2014 not the whole cl", "line": 47, "column": 73, "excerpt_offset": 72, "severity": "SHOULD", "arbitrated": false, "offset": 1521, "token": "\u2014"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're just starting out, an incremental repair every 1-3 days and a full repair every ", "line": 49, "column": 77, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 1957, "token": "you're"}, {"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "At a minimum, repair often enough that the gc grace period never expires on unrepaired dat", "line": 51, "column": 40, "excerpt_offset": 39, "severity": "MUST", "arbitrated": true, "offset": 2221, "token": "the"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "At a minimum, repair often enough that the gc grace period never expires on unrepaired dat", "line": 51, "column": 93, "excerpt_offset": 92, "severity": "SHOULD", "arbitrated": false, "offset": 2274, "token": "\u2014"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With the default gc grace period of 10 days, repairing every node at least once every 7 da", "line": 51, "column": 139, "excerpt_offset": 5, "severity": "MUST", "arbitrated": true, "offset": 2320, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 55, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2478, "token": "-pr"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Incremental repairs are estimated by default; add the  CODE    flag to estimate a full rep", "line": 58, "column": 206, "excerpt_offset": 44, "severity": "MUST", "arbitrated": false, "offset": 2901, "token": ";"}], "html": "== Incremental and Full Repairs\n\nThere are two types of repair: full and incremental. A full repair covers all data in the token range being repaired. An incremental repair only covers data written since the previous incremental repair.\n\nIncremental repair is the default. Run regularly, it can cut the time and io cost of a repair significantly. But note: once an incremental repair marks data as repaired, it never revisits that data. That works for syncing up missed writes, but it <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> protect you from disk corruption, data loss through operator error, or Cassandra bugs. So still run a full repair occasionally.\n\n== Automated Repair Scheduling\n\nRepair can generate a lot of disk and network io, so Cassandra has traditionally not run it automatically.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 28 words, limit 25\">The</mark> latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.adoc[auto repair], which lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with existing repair functionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nOperators can also run repairs via nodetool.\n\nIncremental repair is the default:\n\n[source,none]\n----\nnodetool repair\n----\n\nFull repair:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nA single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nSpecific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs token ranges only on the node being repaired <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> not the whole cluster. By default it operates on every token range replicated by that node, so running it on every node duplicates work. Use the `-pr` flag to repair only a node&#x27;s &quot;primary&quot; ranges and avoid that duplication. To repair the whole cluster, run `nodetool repair -pr` on each node in each datacenter until every node and datacenter is repaired.\n\nHow often to repair depends on several factors specific to your cluster. If <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out, an incremental repair every 1-3 days and a full repair every 1-3 weeks is a reasonable starting point. If you&#x27;d rather skip incremental repairs, a full repair every 5 days is a good place to start.\n\nAt a minimum, repair often enough that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> otherwise deleted data could reappear. With <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">the</mark> default gc grace period of 10 days, repairing every node at least once every 7 days prevents this and leaves enough slack for delays.\n\n== Other Options\n\n`<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being repaired. A primary range is simply a token range for which the node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates how much streaming the given repair command would cause. It builds the merkle trees and prints the expected streaming activity, but streams nothing. Incremental repairs are estimated by default<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Like `--preview`, it builds and compares merkle trees of repaired data without streaming. This is useful for troubleshooting. If it shows the repaired data is out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": true, "fidelity": {"source_words": 628, "rewrite_words": 512, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 9 conditions, the rewrite 6. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 15 -> 14, some/most 2 -> 3)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "repairing every node at least once every 7 days prevents this", "problem": "The rewrite drops the scope qualifier \"in your cluster\" that the original attached to \"every node.\"", "fix": "Write \"repairing every node in your cluster at least once every 7 days prevents this.\"", "reason": "PSTE-A1 forbids dropping a scope qualifier, and this paragraph does not otherwise state that the nodes in question are the reader's own cluster.", "confidence": "medium", "status": "confirm it does not apply to it.", "confidence": "", "status": "rejected", "seenIn": 2, "of": 2, "agreement": 1.0, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-A1", "quote": "on each node in each datacenter until every node and datacenter is repaired", "problem": "", "fix": "", "reason": "The original stated cluster scope twice ('Do a full cluster repair... in each datacenter in the cluster'); the rewrite states it once, up front ('To repair the whole cluster'), so no scope fact is actually lost, only a redundant restatement is removed.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 2, "agreement": 0.5, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-D1", "quote": "-pr, --partitioner-range", "problem": "", "fix": "", "reason": "A line-based paragraph counter likely merged the three flag entries into one block because they lack blank lines between them, but each flag is already its own definition-list term with its own description, so each sub-topic is properly separated despite the missing blank lines.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 2, "agreement": 0.5, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-V6", "quote": "repair often enough", "problem": "", "fix": "", "reason": "'Repair' is used throughout as both noun and verb, but it is ordinary English vocabulary (not a term that only software can name), so PSTE-V6's restriction on term nouns/verbs does not apply to it.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 2, "agreement": 0.5, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-W3", "quote": "otherwise deleted data could reappear", "problem": "", "fix": "", "reason": "This reads like a risk statement but it is a general maintenance caveat about repair frequency, not an instruction preceding a destructive or irreversible command, so it does not need a formal warning/caution label.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 2, "agreement": 0.5, "located": false, "line": null, "column": null, "offset": null}], "semanticConfirmed": 9}, "pste": {"missing": false, "pass": false, "words": 593, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'new feature called xref' over 3 words", "excerpt": "The latest version of Cassandra adds a new feature called xref:managing/operating/auto_rep", "line": 11, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": true, "offset": 894, "token": "a"}, {"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "Run repair often enough that the gc grace period never expires on unrepaired data.", "line": 60, "column": 30, "excerpt_offset": 29, "severity": "MUST", "arbitrated": true, "offset": 2552, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 14 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node t", "line": 64, "column": 2, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2849, "token": "-pr"}], "html": "== Incremental and Full Repairs\n\nCassandra has 2 types of repair: full repair and incremental repair. A full repair works on all of the data in the token range that you repair. An incremental repair works only on the data that Cassandra wrote since the previous incremental repair.\n\nIncremental repair is the default type. If you run it regularly, it reduces the time and the io cost of a repair by a large amount. But once an incremental repair marks data as repaired, it does not repair that data again. This is fine when you sync missed writes. It does not protect against disk corruption, data loss from operator error, or bugs in Cassandra. For this reason, still run a full repair sometimes.\n\n== Automated Repair Scheduling\n\nRepair can cause a lot of disk io and network io. For this reason, Cassandra has traditionally not run repair automatically.\n\nThe latest version of Cassandra adds <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;new feature called xref&#x27; over 3 words\">a</mark> new feature called xref:managing/operating/auto_repair.adoc[auto repair]. This feature lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with the existing repair function that you start through nodetool.\n\n== Submitting Repairs Using Nodetool\n\nThe operator can also run a repair through nodetool.\n\nIncremental repair is the default. Run it with this command:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with this command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nYou can also run a repair on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs the token ranges only on the node that you repair. It does not repair the whole cluster.\n\nBy default, repair works on all token ranges that the node replicates. This causes duplicate work when you run repair on every node. To avoid the duplicate work, use the `-pr` flag. This flag repairs only the &quot;primary&quot; ranges on a node.\n\nTo repair the full cluster, run the `nodetool repair -pr` command on each node in each datacenter in the cluster. Continue until you repair all of the nodes and all of the datacenters.\n\nThe right frequency of repair for your cluster depends on several factors. If you start out and need a place to begin, these values are reasonable:\n\n* an incremental repair every 1-3 days\n* a full repair every 1-3 weeks\n\nIf you do not want to run incremental repairs, a full repair every 5 days is a good place to start.\n\nRun repair often enough that <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. If the period expires, deleted data can reappear. The default gc grace period is 10 days. Repair every node in your cluster at least once every 7 days to prevent this. This frequency also gives you enough slack for delays.\n\n== Other Options\n\n`<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 14 sentences, limit 6\">-pr</mark>, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node that you repair. A primary range is a token range for which the node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming for the given repair command. This option builds the merkle trees and prints the expected streaming activity. It does not stream any data. By default, this option estimates an incremental repair. Add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Checks that the repaired data is the same across all nodes. Like `--preview`, this option builds and compares merkle trees of the repaired data, but it does not stream any data. This option helps you troubleshoot. If it shows that the repaired data is out of sync, run a full repair.\n\n`nodetool repair docs &lt;nodetool_repair&gt;`", "factLoss": false, "fidelity": {"source_words": 628, "rewrite_words": 608, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "Run repair often enough that the gc grace period never expires", "problem": "The rewrite drops the original qualifier \"At a minimum,\" which told the reader this frequency is a floor requirement, not just a target.", "fix": "Write \"At a minimum, run repair often enough that the gc grace period never expires on unrepaired data.\"", "reason": "PSTE-A1 requires every scope qualifier to survive a rewrite, and \"at a minimum\" is a scope qualifier that chan 02, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": false, "offset": 4722, "token": "e"}], "html": "### Debugging Pods\n\nThe first step in debugging a Pod <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is taking&#x27;\">is</mark> taking a look at it. Check the current\nstate of the Pod and recent events with the following command:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`?\nHave there been recent restarts?\n\nContinue debugging depending on the state of the pods.\n\n#### My pod stays pending\n\nIf a Pod is stuck in `Pending` it means that it can not be scheduled onto a node.\nGenerally this is because there are insufficient resources of one type or another\nthat prevent scheduling. Look at the output of the `kubectl describe ...` command above.\nThere <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be messages from the scheduler about why it can not schedule your pod.\nReasons include:\n\n* **You <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have enough resources**: You may <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;have exhausted&#x27;; use simple past\">have</mark> exhausted the supply of CPU\n  or Memory in your cluster, in this case you need to delete Pods, adjust resource\n  requests, or add new nodes to your cluster. See [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/)\n  for more information.\n\n* **You <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: When you bind a Pod to a `hostPort` there are a\n  limited number of places that pod can be scheduled. In most cases, `hostPort`\n  is unnecessary, try using a Service object to expose your Pod.  If you do require\n  `hostPort` then you can only schedule as many Pods as there are nodes in your Kubernetes cluster.\n\n\n#### My pod stays waiting\n\nIf a Pod is stuck in the `Waiting` state, then it <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node, \nbut it <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run on that machine. Again, the information from `kubectl describe ...`\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be informative. The most common cause of `Waiting` pods is a failure to pull the image.\nThere are three things to check:\n\n* Make sure that you have the name of the image correct.\n* Have you pushed the image to the registry?\n* Try to manually pull the image to see if the image can be pulled. For example,\n  if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n\n#### My pod stays terminating\n\nIf a Pod is stuck in the `Terminating` state, it means that a deletion has been\nissued for the Pod, but the control plane is unable to delete the Pod object.\n\nThis typically happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/)\nand there is an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/)\ninstalled in the cluster that prevents the control plane from removing the\nfinalizer.\n\nTo identify this scenario, check if your cluster has any\nValidatingWebhookConfiguration or MutatingWebhookConfiguration that target\n`UPDATE` operations for `pods` resources.\n\nIf the webhook is provided by a third-party:\n- Make sure you <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the corresponding provider.\n\nIf you are the author of the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on\n  `UPDATE` operations. For example, changes to containers are usually not allowed.\n- For a validating webhook, make sure that your validation policies only apply\n  to new changes. In other words, you <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> allow Pods with existing violations\n  to pass validation. This allows Pods that were created before the validating\n  webhook was installed to continue running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled, the methods described in\n[Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/)\nare available for debugging.\n\n#### My pod is running but not doing what I told it to do\n\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> your pod is not behaving as you expected, it may be that there was an error in your\npod description (<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `mypod.yaml` file on your local machine), and that the error\nwas silently ignored when you created the pod.  Often a section of the pod description\nis nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.\nFor example, if you misspelled `command` as `commnd` then the pod will be created but\nwill not use <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended it&#x27; over 3 words\">the</mark> command line you intended it to use.\n\nThe first thing to do is to delete your pod and try creating it again with the `--validate` option.\nFor example, run `kubectl apply --validate -f mypod.yaml`.\nIf you misspelled `command` as `commnd` then will give an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&gt;\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">The</mark> next thing to check is whether the pod on the apiserver\nmatches the pod you meant to create (<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. in a yaml file on your local machine).\nFor example, run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml` and then\nmanually compare the original pod description, `mypod.yaml` with the one you got\nback from apiserver, `mypod-on-apiserver.yaml`. There will typically be some\nlines on the &quot;apiserver&quot; version that are not on the original version. This is\nexpected. However, if there are lines on the original that are not on the apiserver\nversion, then this may indicate a problem with your pod spec.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 541, "findings": [{"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "A Pod stuck in  CODE     can't be scheduled onto a node.", "line": 15, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": false, "offset": 345, "token": "can't"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Check the output of  CODE an only schedule as many Pods as you have nodes.\n\n#### My pod stays waiting\n\nA Pod stuck in `Waiting` <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> been scheduled to a worker node but <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run there. Again, `kubectl describe ...` <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> tell you why. The most common cause is a failed image pull. Check three things:\n\n* Is the image name correct?\n* Did you push the image to the registry?\n* Can you pull the image by hand? For example, with Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nA Pod stuck in `Terminating` <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G4: perfect tense &#x27;has been marked&#x27;; use simple past\">has</mark> been marked for deletion, but the control plane <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> delete the Pod object.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 32 words, limit 25\">This</mark> usually happens when the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) in the cluster stops the control plane from removing it.\n\nTo confirm, check whether your cluster has any ValidatingWebhookConfiguration or MutatingWebhookConfiguration targeting `UPDATE` operations on `pods` resources.\n\nIf a third party provides the webhook:\n- Use the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the provider.\n\nIf you wrote the webhook:\n- For a mutating webhook, never change immutable fields on `UPDATE` operations. Changes to containers, for example, are usually not allowed.\n- For a validating webhook, apply your validation policies only to new changes. Let Pods with existing violations pass, so Pods created before the webhook was installed keep running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your Pod is scheduled, use the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/).\n\n#### My pod is running but not doing what I told it to do\n\nIf your Pod <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> behaving as expected, your Pod description (<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. the `mypod.yaml` file on your machine) may contain an error that was silently ignored when you created the Pod. Often a section is nested wrongly, or a key name is misspelled and therefore ignored. For example, misspell `command` as `commnd` and the Pod is created but <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> use <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended&#x27; over 3 words\">the</mark> command line you intended.\n\nFirst, delete the Pod and create it again with the `--validate` option <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, `kubectl apply --validate -f mypod.yaml`. Misspelling `command` as `commnd` gives an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&  "excerpt_offset": 62, "severity": "MUST", "arbitrated": true, "offset": 4562, "token": "the"}], "html": "### Debugging Pods\n\nThe first step to debug a Pod is to look at it. Run this command to check the current state of the Pod and its recent events:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the Pod. Are they all `Running`? Did they restart recently?\n\nContinue to debug based on the state of the Pod.\n\n#### My pod stays pending\n\nA Pod that stays in `Pending` cannot be scheduled onto a node. Usually the cluster does not have enough resources of one type or another. Look at the output of the `kubectl describe ...` command above. The scheduler writes messages about why it cannot schedule your Pod. Reasons include:\n\n* **You do not have enough resources**: You may <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G4: perfect tense &#x27;have used&#x27;; use simple past\">have</mark> used all the CPU or memory in your cluster. In this case you must delete Pods, change the resource requests, or add new nodes to your cluster. See the [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/) for more information.\n\n* **You use `hostPort`**: When you bind a Pod to a `hostPort`, the scheduler has a limited number of places to put that Pod. In most cases you do not need `hostPort`. Use a Service object to expose your Pod instead. If you do need `hostPort`, then you can schedule only as many Pods as there are nodes in your Kubernetes cluster.\n\n#### My pod stays waiting\n\nA Pod that stays in the `Waiting` state is scheduled to a worker node, but it cannot run on that machine. Again, the information from `kubectl describe ...` tells you why. The most common cause is a failure to pull the image. Check three things:\n\n1. Make sure that the name of the image is correct.\n2. Check that you pushed the image to the registry.\n3. Pull the image by hand to see if the pull works. For example, if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nA Pod that stays in the `Terminating` state has a deletion request, but the control plane cannot delete the Pod object.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 34 words, limit 25\">This</mark> usually happens when the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and the cluster has an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) that stops the control plane from removing the finalizer.\n\nTo find this case, check if your cluster has any ValidatingWebhookConfiguration or MutatingWebhookConfiguration that targets `UPDATE` operations for `pods` resources.\n\nIf a third party gives the webhook:\n- Make sure you use the latest version.\n- <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;turn off&#x27;; use &#x27;disable&#x27;\">Turn</mark> off the webhook for `UPDATE` operations.\n- Report an issue to that provider.\n\nIf you wrote the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on `UPDATE` operations. For example, the cluster usually does not allow changes to containers.\n- For a validating webhook, make sure that your validation policies apply only to new changes. That is, you must let Pods with existing violations pass validation. This lets Pods that you created before you installed the validating webhook continue to run.\n\n#### My pod is crashing or otherwise unhealthy\n\nAfter the scheduler places your Pod, you can use the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/).\n\n#### My pod is running but not doing what I told it to do\n\nIf your Pod does not behave as you expected, your Pod description may hold an error. For example, the error may be in the `mypod.yaml` file on your local machine. The system ignored the error without a message when you created the Pod. Often a section of the Pod description is nested wrongly, or a key name is typed wrongly, so the system ignores the key. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">For</mark> example, if you spelled `command` as `commnd`, then the system creates the Pod, but the Pod does not use the command line that you wanted.\n\nFirst, delete your Pod and create it again with the `--validate` option. For example, run `kubectl apply --validate -f mypod.yaml`. If you spelled `command` as `commnd`, this gives an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 is merged, this advice may need to be updated --&gt;\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Next</mark>, check whether the Pod on the apiserver matches the Pod you meant to create. For example, the Pod you meant to create is in a yaml file on your local machine. Run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml`. Then compare the original Pod description, `mypod.yaml`, with <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;file you got back&#x27; over 3 words\">the</mark> file you got back from the apiserver, `mypod-on-apiserver.yaml`. The apiserver version usually has some lines that the original version does not have. This is expected. But if the original has lines that the apiserver version does not have, then your Pod spec may have a problem.", "factLoss": false, "fidelity": {"source_words": 881, "rewrite_words": 824, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 18 conditions, the rewrite 15. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": tru s tolerance ", "line": 1, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 0, "token": "---"}, {"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "Failures are common in a large deployment of machines.", "line": 7, "column": 32, "excerpt_offset": 31, "severity": "MUST", "arbitrated": true, "offset": 135, "token": "deployment"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Multiple kinds of failures can also happen at once; it is almost impossible to enumerate a", "line": 7, "column": 247, "excerpt_offset": 50, "severity": "MUST", "arbitrated": false, "offset": 350, "token": ";"}, {"rule": "PSTE-N5", "message": "multi-word noun 'five member etcd cluster' over 3 words", "excerpt": "For example, two follower failures will not affect a five member etcd cluster\u2019s operation.", "line": 13, "column": 187, "excerpt_offset": 51, "severity": "MUST", "arbitrated": true, "offset": 926, "token": "a"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Client libraries should hide these interruptions from users for read requests by automatic", "line": 13, "column": 307, "excerpt_offset": 17, "severity": "MUST", "arbitrated": false, "offset": 1046, "token": "should"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Operators should expect the system load on the other members to increase due to the reconn", "line": 13, "column": 426, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 1165, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster automatically elects' over 3 words", "excerpt": "When a leader fails, the etcd cluster automatically elects a new leader.", "line": 17, "column": 22, "excerpt_offset": 21, "severity": "MUST", "arbitrated": true, "offset": 1295, "token": "the"}, {"rule": "PSTE-V9", "message": "marketing adjective 'instantly'", "excerpt": "The election does not happen instantly once the leader fails.", "line": 17, "column": 103, "excerpt_offset": 29, "severity": "MUST", "arbitrated": false, "offset": 1376, "token": "instantly"}, {"rule": "PSTE-G1", "message": "passive voice 'are queued'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 107, "excerpt_offset": 40, "severity": "MUST", "arbitrated": false, "offset": 1625, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'is elected'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 152, "excerpt_offset": 85, "severity": "MUST", "arbitrated": false, "offset": 1670, "token": "is"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "A network partition divides the etcd cluster into two parts; one with a member majority an", "line": 35, "column": 141, "excerpt_offset": 59, "severity": "MUST", "arbitrated": false, "offset": 2941, "token": ";"}, {"rule": "PSTE-N5", "message": "multi-word noun 'minority side automatically recognizes' over 3 words", "excerpt": "Once the network partition clears, the minority side automatically recognizes the leader f", "line": 39, "column": 36, "excerpt_offset": 35, "severity": "MUST", "arbitrated": true, "offset": 3562, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'failed bootstrapped cluster like recovering' over 3 words", "excerpt": "Of course, it is possible to recover a failed bootstrapped cluster like recovering a runni", "line": 45, "column": 38, "excerpt_offset": 37, "severity": "MUST", "arbitrated": true, "offset": 3984, "token": "a"}], "html": "<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common in a large <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A machine fails when its hardware or software malfunctions. Multiple machines fail together when there are power failures or network issues. Multiple kinds of failures can also happen at once<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it is almost impossible to enumerate all possible failure cases.\n\nIn this section, we catalog kinds of failures and discuss how etcd is designed to tolerate these failures. Most users, if not all, can map a particular failure into one kind of failure. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, the etcd cluster can still accept requests and make progress without any major disruption. For example, two follower failures will not affect <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster\u2019s operation. However, clients will lose connectivity to the failed members. Client libraries <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users for read requests by automatically reconnecting to other members. Operators <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to increase due to the reconnections.\n\n## Leader failure\n\nWhen a leader fails, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster automatically elects&#x27; over 3 words\">the</mark> etcd cluster automatically elects a new leader. The election does not happen <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark> once the leader fails. It takes about an election timeout to elect a new leader since the failure detection model is timeout based.\n\nDuring the leader election the cluster cannot process any writes. Write requests sent during the election <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued for processing until a new leader <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\nWrites already sent to the old leader but not yet committed may be lost. The new leader has the power to rewrite any uncommitted entries from the previous leader. From the user perspective, some write requests might time out after a new leader election. However, no committed writes are ever lost.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before the granted TTL even if it was granted by the old leader.\n\n## Majority failure\n\nWhen the majority members of the cluster fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can only recover from a majority failure once the majority of members become available. If a majority of members cannot come back online, then the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires due to server side unavailability.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one with a member majority and the other with a member minority. The majority side becomes the available cluster and the minority side is unavailable. There is no \u201csplit-brain\u201d in etcd because cluster members are explicitly added/removed with each such change is approved by the current majority of members.\n\nIf the leader is on the majority side, then from the majority point of view the failure is a minority follower failure. If the leader is on the minority side, then it is a leader failure. The leader on the minority side steps down and the majority side elects a new leader.\n\nOnce the network partition clears, <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;minority side automatically recognizes&#x27; over 3 words\">the</mark> minority side automatically recognizes the leader from the majority side and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap is only successful if all required members successfully start. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nOf course, it is possible to recover <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N5: multi-word noun &#x27;failed bootstrapped cluster like recovering&#x27; over 3 words\">a</mark> failed bootstrapped cluster like recovering a running cluster. However, it almost always takes more time and resources to recover that cluster than bootstrapping a new one, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 609, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt  is almost impossible.\n\nThis section catalogs kinds of failures and explains how etcd is designed to tolerate them. Most users, if not all, can map <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;particular failure onto one&#x27; over 3 words\">a</mark> particular failure onto one of these kinds. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nIf fewer than half the followers fail, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without major disruption. For example, two follower failures will not affect <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster&#x27;s operation. Clients do lose connectivity to the failed members. For read requests, client libraries <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users by automatically reconnecting to other members. Operators <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to rise because of those reconnections.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not happen <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark>. Because failure detection is timeout based, electing a new leader takes about one election timeout.\n\nThe cluster cannot process writes during the election. Write requests sent while it runs <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued until a new leader <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">Writes</mark> already sent to the old leader but not yet committed may be lost, because the new leader can rewrite any uncommitted entries from the previous leader. So from the user&#x27;s point of view, some write requests might time out after a new leader election. But no committed writes are ever lost.\n\nThe new leader extends timeouts automatically for all leases. This ensures a lease will not expire before its granted TTL, even if <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N5: multi-word noun &#x27;old leader granted it&#x27; over 3 words\">the</mark> old leader granted it.\n\n## Majority failure\n\nIf the majority of cluster members fail, the etcd cluster fails and accepts no more writes.\n\nThe cluster can only recover once the majority of members become available again. If a majority cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This ensures no lease expires because of server side unavailability.\n\n## Network partition\n\nA network partition resembles either a minor followers failure or a leader failure. The partition splits the etcd cluster in two: one part with a majority of members, the other with a minority. The majority side becomes the available cluster<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the minority side is unavailable. etcd has no &quot;split-brain&quot;, because members are added and removed explicitly and each such change is approved by the current majority of members.\n\nIf the leader is on the majority side, the majority sees the event as a minority follower failure. If the leader is on the minority side, it is a leader failure: the leader on the minority side steps down, and the majority side elects a new leader.\n\nOnce the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap succeeds only if all required members start successfully. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nRecovering a failed bootstrapped cluster the way you would recover a running cluster is possible, of course. But it almost always takes more time and resources than bootstrapping a new one, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/", "factLoss": true, "fidelity": {"source_words": 664, "rewrite_words": 614, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 20 conditions, the rewrite 19. Check that no condition was dropped."}, {"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 13 -> 11, some/most 2 -> 3)."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "The election does not happen instantly.", "problem": "The rewrite drops the condition 'once the leader fails' that the original attached to this statement.", "fix": "Write \"The election does not happen instantly once the leader fails.\" to keep the stated condition.", "reason": "PSTE-A1 forbids removing any condition the source text states, and this condition is present in the original and absent in the rewrite.", "confidence": "medium", "status": "confirmed", ilures and etcd's tolerance ", "line": 3, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 64, "token": "---"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster still accepts' over 3 words", "excerpt": "When fewer than half of the followers fail, the etcd cluster still accepts requests and ma", "line": 15, "column": 45, "excerpt_offset": 44, "severity": "MUST", "arbitrated": true, "offset": 763, "token": "the"}, {"rule": "PSTE-G7", "message": "nominalization 'operation of'; use a verb", "excerpt": "For example, two follower failures do not affect the operation of a cluster with five memb", "line": 15, "column": 189, "excerpt_offset": 53, "severity": "MUST", "arbitrated": true, "offset": 907, "token": "operation"}, {"rule": "PSTE-V9", "message": "marketing adjective 'instantly'", "excerpt": "The election does not happen instantly.", "line": 21, "column": 103, "excerpt_offset": 29, "severity": "MUST", "arbitrated": false, "offset": 1354, "token": "instantly"}], "html": "The document is prose, not code \u2014 PSTE applies. Rewriting now.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">---</mark>\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nMachines fail often in a large deployment. A machine fails when its hardware or software malfunctions. Several machines fail together when the power fails or the network breaks. Several kinds of failure can also happen at once. Nobody can list every possible failure case.\n\nThis section lists kinds of failure. It also explains how etcd tolerates them. Most users can map a particular failure to one of these kinds. Always [back up][backup] the etcd cluster to prepare for rare or [unrecoverable failures][unrecoverable].\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress. Nothing disrupts it seriously. For example, two follower failures do not affect the <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;operation of&#x27;; use a verb\">operation</mark> of a cluster with five members.\n\nBut clients lose their connection to the failed members. For read requests, a client library must hide these interruptions from the user. It reconnects to other members automatically. Operators must expect the system load on the other members to rise, because of the reconnections.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not happen <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;instantly&#x27;\">instantly</mark>. The failure detection model uses timeouts, so the election takes about one election timeout.\n\nThe cluster cannot process any write during the leader election. The cluster queues the write requests that it receives during the election. It processes them after it elects a new leader.\n\nThe cluster can lose a write that reached the old leader but that the old leader did not commit. The new leader can rewrite any uncommitted entry from the previous leader. From the view of the user, some write requests can time out after a new leader election. But the cluster never loses a committed write.\n\nThe new leader extends the timeouts for all leases automatically. This mechanism makes sure that a lease does not expire before the granted TTL. The rule holds even for a lease that the old leader granted.\n\n## Majority failure\n\nWhen the majority of the members fail, the etcd cluster fails. It cannot accept more writes.\n\nThe etcd cluster recovers from a majority failure only after the majority of the members become available. If a majority of the members cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nAfter a majority of the members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends the timeouts for all leases automatically. This mechanism makes sure that no lease expires because the server was unavailable.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts. One part holds a majority of the members, and the other part holds a minority. The majority side becomes the available cluster, and the minority side is unavailable. etcd has no &quot;split-brain&quot;, because an operator adds and removes cluster members explicitly. The current majority of the members approves each such change.\n\nIf the leader is on the majority side, the majority side sees the failure as a minority follower failure. If the leader is on the minority side, the failure is a leader failure. The leader on the minority side steps down, and the majority side elects a new leader.\n\nAfter the network partition clears, the minority side recognizes the leader from the majority side automatically. It then recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap succeeds only if all the required members start. If any failure happens during the bootstrap, remove the data directories on all the members. Then bootstrap the cluster again with a new cluster token or a new discovery token.\n\nYou can recover a failed bootstrapped cluster in the same way that you recover a running cluster. But that recovery almost always takes more time and more resources than a new bootstrap, because there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: ../recovery/", "factLoss": true, "fidelity": {"source_words": 664, "rewrite_words": 687, "findings": [{"kind": "negation", "severity": "critical", "message": "the sour members negotiate with each other to determine the overall cluster version, which controls the reported version and the supported features.\n\n#### Limitations\n\nNote: If the cluster only has v3 data and no v2 data, it is not subject to this limitation.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 29 words, limit 25\">If</mark> the cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is serving&#x27;\">is</mark> serving a v2 data set larger than 50MB, each newly upgraded member may take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. In other words, it is safest to wait for 2 minutes between upgrading each member.\n\nFor <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more , this one-time process might take even more time. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 30 words, limit 25\">Administrators</mark> of very large etcd clusters of this magnitude can feel free to contact the [etcd team][etcd-contact] before upgrading, and <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;we&#x27;ll&#x27;\">we&#x27;ll</mark> be happy to provide advice on the procedure.\n\n#### Downgrade\n\nIf all members <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;have been upgraded&#x27;; use simple past\">have</mark> been upgraded to v3.5, the cluster will be upgraded to v3.5, and downgrade from this completed state is **not possible**. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 35 words, limit 25\">If</mark> any single member is still v3.4, however, the cluster and its operations remains &quot;v3.4&quot;, and it is possible from this mixed cluster state to return to using a v3.4 etcd binary on all members.\n\nPlease [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) to make downgrading the cluster possible even after it has been completely upgraded.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 355, "findings": [{"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "If the cluster serves a v2 data set larger than 50MB, each newly upgraded member may take ", "line": 23, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1346, "token": "If"}, {"rule": "PSTE-N5", "message": "multi-word noun 'much larger total data size' over 3 words", "excerpt": "For a much larger total data size \u2014 100MB or more \u2014 this one-time process may take even lo", "line": 25, "column": 5, "excerpt_offset": 4, "severity": "MUST", "arbitrated": true, "offset": 1639, "token": "a"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "For a much larger total data size \u2014 100MB or more \u2014 this one-time process may take even lo", "line": 25, "column": 35, "excerpt_offset": 34, "severity": "SHOULD", "arbitrated": false, "offset": 1669, "token": "\u2014"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "If you administer an etcd cluster of that size, feel free to contact the [etcd team][etcd-", "line": 25, "column": 97, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1731, "token": "If"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "If even one member is still v3.4, the cluster and its operations remain \"v3.4\", and from t", "line": 29, "column": 136, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2044, "token": "If"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an existing etcd deployment to 3.5, the er or later. This document rewrites the checklists in PSTE form.\n\n---\n\n### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an etcd deployment to 3.5, the running cluster must be 3.4 or later. If the cluster is older than 3.4, [upgrade to 3.4](../upgrade_3_3/) first.\n\nThe running cluster must also be healthy. A healthy cluster makes sure the rolling upgrade goes smoothly. Check the health of the cluster with the `etcdctl endpoint health` command before you continue.\n\n#### Preparation\n\nTest the services that depend on etcd in a staging environment first. Do this before you deploy the upgrade to the production environment.\n\n[Download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) before you start. If the upgrade goes wrong, you can use this backup to [downgrade](#downgrade) back to the existing etcd version. The `snapshot` command backs up the v3 data only. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nDuring the upgrade, an etcd cluster supports members that run different versions. The cluster operates with the protocol of the lowest common version. The cluster counts as upgraded only after every member runs version 3.5. The members negotiate with each other to set the overall cluster version. That version controls the reported version and the supported features.\n\n#### Limitations\n\nThis limitation does not apply to a cluster that holds v3 data only and no v2 data.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 28 words, limit 25\">If</mark> the cluster serves a v2 data set larger than 50MB, each newly upgraded member can take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. It is safest to wait 2 minutes between the upgrade of each member.\n\nFor <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more, this one-time process can take even longer. If you administer an etcd cluster of this size, you can contact the [etcd team][etcd-contact] before you upgrade. The team will give advice on the procedure.\n\n#### Downgrade\n\nAfter every member is upgraded to v3.5, the cluster is upgraded to v3.5. From this completed state, a downgrade is **not possible**.\n\nIf any single member still runs v3.4, the cluster and its operations remain &quot;v3.4&quot;. From this mixed state, you can return to a v3.4 etcd binary on all members.\n\n[Download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) to make a downgrade possible even after the cluster is completely upgraded.", "factLoss": true, "fidelity": {"source_words": 430, "rewrite_words": 426, "findings": [{"kind": "modal", "severity": "critical", "message": "an obligation weakened into a suggestion (must/shall 3 -> 2, should/may 4 -> 5)."}, {"kind": "condition", "severity": "warning", "message": "the source states 15 conditions, the rewrite 12. Check that no condition was dropped."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-W1", "quote": "From this completed state, a downgrade is **not possible**", "problem": "The fact that a full upgrade to 3.5 cannot be reversed appears only in the last section, after the reader has already read Preparation and started the upgrade in Mixed versions/Limitations.", "fix": "State the irreversibility as a labeled warning in Upgrade requirements or Preparation, before the reader begins the upgrade, in addition to the Downgrade section.", "reason": "PSTE-W1 requires a warning before an operation the reader cannot reverse, and this document's only structural warning appears after the point where the reader would act.", "confidence": "medium", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 33, "column": 74, "off 1. Check that your editor <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> showing any diagnostics that indicate a problem with your workspace. They may appear as diagnostics on a Go file&#x27;s package declaration, diagnostics in a go.mod file, or as a status or progress message. Problems in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date by following the [installation instructions](index.md#installation), then [restarting gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` has no persistent state, so restarting it will fix transient problems. This is good and bad: good, because you can keep working, and bad, because you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> be able to debug the issue until it recurs.\n\nIn most cases, closing all your open editors will guarantee that `gopls` is killed and restarted. If you <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to do that, there may be an editor command you can use to restart only `gopls`. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N1: instruction is 25 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> you may need to explicitly kill `gopls` if you use `vim`.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) that can help debug further. <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 42 words, limit 25\">If</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident the problem is with `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come prepared with a short <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to be available to answer questions for a while afterward.\n\n## File an issue\n\nWe <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> diagnose a problem from just a description. When filing an issue, please include as much as possible of the following information:\n\n1. Your editor and any settings you <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G4: perfect tense &#x27;have configured&#x27;; use simple past\">have</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> also helpful to tell us the timestamp the problem occurred, so we can find it the log. See the [instructions](#capture-logs) for information on how to capture gopls logs.\n\nYour editor may have a command that fills out some of the necessary information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that will allow you to see profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You will then be able to view debug information by navigating to `localhost:6060`.\n\nIf you are unsure of how to pass a flag to `gopls` through your editor, please see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` automatically writes out memory debug information when your usage exceeds 1GB. This information can be found in your temporary directory with names like `gopls.1234-5GiB-withnames.zip`. On Windows, your temporary directory will be located at `%TMP%`, and on Unixes, it will be `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) with this memory debug information attached. If you are uncomfortable sharing the package names of your code, you can share the `-nonames` zip instead, but <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 548, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'be crashing'", "excerpt": "If  CODE   seems to be crashing or misbehaving, work through the steps below.", "line": 5, "column": 21, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 61, "token": "be"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'is using'", "excerpt": "If  CODE   is using too much memory, skip to [Memory usage](#debug-memory-usage).", "lin
