": "you're"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go ahead'; use 'start'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 25, "excerpt_offset": 24, "severity": "MUST", "arbitrated": false, "offset": 4997, "token": "go"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If you are using caching provided by Django, you should consider clearing your\ncache after", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5081, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 5088, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward, you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. You must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django, you <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must t": "If a package doesn't support the latest Django", "line": 82, "column": 39, "excerpt_offset": 13, "severity": "MUST", "arbitrated": false, "offset": 3011, "token": "doesn't"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "With the new environment set up, :doc:`run your application's full test suite", "line": 103, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": false, "offset": 3543, "token": "set"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "in the test output \u2014 you can also use the flag when testing manually with", "line": 105, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 3694, "token": "\u2014"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are upgrading'", "excerpt": "If you are upgrading to an alpha, beta, or release candidate, see our guide on", "line": 116, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 3992, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Once you're confident your app works with the new version of Django, you can", "line": 123, "column": 6, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "offset": 4174, "token": "you're"}, {"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "If you use Django's caching, consider clearing your cache after upgrading.\nOtherwise you m", "line": 126, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4310, "token": "If"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Otherwise you may hit problems \u2014 for example, if you cache pickled objects,", "line": 127, "column": 32, "excerpt_offset": 31, "severity": "SHOULD", "arbitrated": false, "offset": 4416, "token": "\u2014"}], "html": "========================================\nUpgrading Django to a newer version\n========================================\n\nUpgrading Django to the latest version has several benefits:\n\n* You get new features and improvements.\n* Bugs are fixed.\n* You keep getting security updates \u2014 older versions of Django eventually stop\n  receiving them (see :ref:`supported-versions-policy`).\n* Your code base stays current, which makes future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere is what to consider to make your upgrade go smoothly.\n\nRead this first\n===============\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nNext, learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for every &#x27;final&#x27; release\n  from the one after your current version up to and including the version you\n  plan to upgrade to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nPay close attention to backwards incompatible changes, so you know what the\nupgrade will require.\n\nUpgrading through more than one feature version (say, 2.0 to 2.2)? Go one\nfeature release at a time (2.0 to 2.1 to 2.2) rather than making all the\nchanges at once. For each feature release, use the latest patch release <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for\n2.1, that&#x27;s 2.1.15.\n\nDo the same one-step-at-a-time upgrade when moving from one LTS to the next.\n\nDependencies\n============\n\nYou will usually need to upgrade your Django-related dependencies too. If the\nDjango version came out recently, or if some of your dependencies are not\nwell-maintained, they may not support the new Django version yet. When that\nhappens, you have to wait for new versions of those dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, fix any deprecation warnings your project raises on your\ncurrent version of Django. Doing this first tells you which parts of your code\nneed changing.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\ncommand line option or the :envvar:`PYTHONWARNINGS` environment variable. For\nexample, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use the Django test runner, also make sure console output <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark>\ncaptured, since that hides deprecation warnings. For example, with `pytest\n&lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue.\n\nWarnings from installed packages <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> necessarily mean something is wrong:\nthird party applications may use deprecated APIs so they can support several\nDjango versions at once. If a package <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest Django\nversion, consider raising an issue or sending a pull request.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. If you use a\n:mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, consider setting\nup a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run your application&#x27;s full test suite\n&lt;/topics/testing/overview&gt;`. Turn deprecation warnings on again so they appear\nin the test output <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can also use the flag when testing manually with\n``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures. While the release notes are fresh in your mind, this is also\na good time to use new Django features and refactor away any deprecation\nwarnings.\n\nIf you <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases` for tips on catching regressions and reporting\nbugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works with the new version of Django, you can\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded project.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">If</mark> you use Django&#x27;s caching, consider clearing your cache after upgrading.\nOtherwise you may hit problems <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, if you cache pickled objects,\nwhich are not guaranteed to be pickle-compatible across Django versions. One\npast incompatibility involved caching pickled\n:class:`~django.http ========\nHow to upgrade Django to a newer version\n========================================\n\nUpgrade Django to the latest version for these benefits:\n\n* You can use new features and improvements.\n* You get bug fixes.\n* Old Django versions stop getting security updates\n  (see :ref:`supported-versions-policy`).\n* An upgrade with each new release keeps your code base current. It also makes\n  future upgrades easier.\n\n.. admonition:: Tools that help with version upgrades\n\n    Django has a large ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page shows automated upgrade helpers.\n\nRead the points below to make your upgrade easier.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nAfter that, learn the changes in the new Django versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release. Start\n  with the release after your current Django version. Finish with the version\n  that you plan to upgrade to.\n* Read the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nGive close attention to the backwards incompatible changes. They show you what a\nsuccessful upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">If</mark> you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade through each feature release one at a time. Go from 2.0 to 2.1, then\n2.1 to 2.2. This is easier than all the changes for each feature release at\nonce. For each feature release, use the latest patch release. For 2.1, use\n2.1.15.\n\nUpgrade one release at a time when you go from one LTS to the next LTS.\n\nDependencies\n============\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to the\nlatest version. Some dependencies may not support the new Django version yet.\nThis happens when Django released the version recently. It also happens when\nnobody maintains the dependency well. In these cases you may have to wait for\nthe new versions of your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises on\nyour current version of Django. Fix these warnings first. They tell you which\nareas of the code you must change.\n\nPython silences deprecation warnings by default. You must turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. To show warnings while you run tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, make sure that nothing captures the\nconsole output. Captured output hides deprecation warnings. For example, if you\nuse `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django. Then\ncontinue the upgrade.\n\nA third party application may use deprecated APIs to support several versions of\nDjango. A deprecation warning in a package that you installed does not always\nmean a problem. If a package does not support the latest version of Django,\nraise an issue or send a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`. If\nyou use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up\na new environment with all the dependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings\nagain so the test output shows them. You can also use the flag when you test\nyour app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures after you run the tests. The release notes are fresh in your\nmind, so this is also a good time to use new features in Django. Refactor your\ncode to remove any deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, read our guide on\n:ref:`testing-pre-releases`. It gives more specific tips. The tips cover how to\ncatch regressions and how to report bugs.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">If</mark> you use the caching that Django gives you, clear your cache after the\nupgrade. A stale cache can cause problems. For example, pickled objects in the\ncache are not guaranteed to be pickle-compatible across Django versions. One\npast example was pickled :class:`~django.http.HttpResponse` objects in the\ncache. The code cached them directly, or through the\n:func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 791, "findings": [{"kind": "condition", "severity": "warning", "message": "the re of the Chia blockchain with different configurations and v", "line": 54, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4519, "token": "Due"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Version 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block ", "line": 56, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4732, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Version 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast F", "line": 58, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4999, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5290, "token": "When"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5460, "token": "When"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. Additionally, block production slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 763, "findings": [{"rule": "PSTE-N2", "message":  the latest version of the singleton, the mempool item is no", "line": 59, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4734, "token": "When"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "When spend bundles are ingested into the mempool, every fast-forward-eligible spend is val", "line": 60, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4897, "token": "When"}], "html": "# Slower Block Creation Caused by Mempool Bugs\n\n## Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 33 words, limit 25\">A</mark> farmer chosen to create the next block has roughly 28 seconds to build an unfinished block and propagate it across the network to a timelord, who infuses it to produce the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 27 words, limit 25\">Farmers</mark> pull transactions from the mempool, ordered by fee per cost, and pack them into the unfinished block so they collect the fees attached to those transactions.\n\nCNI observed that the mempool was completely full, yet transactions were not making it into blocks. Block production also slowed relative to the expected rate. The cause: farmers eligible to create blocks were not finishing their unfinished blocks in time, because of several bugs in the mempool&#x27;s fast forward spend logic.\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis is what allows offer files to reference singletons by coin ID even though the coin ID changes on every state update.\n\nFast forward spends are also used by vaults. A vault singleton authorizes every coin belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be far too restrictive. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 27 words, limit 25\">Fast</mark> forward lets several spends of the vault singleton sit in the mempool at once<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> farmers deduplicate and rebase them one after another as they build blocks.\n\nCNI traced the slowdown to three root causes:\n\n* 1. A fast forward spend does not become invalid simply because its coin was spent \u2014 it can be fast-forwarded onto the latest version of the singleton. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;Eviction of&#x27;; use a verb\">Eviction</mark> of these spends depends on other parts of the spend bundle (for example, that coin being spent by a block). We did not account for a bundle whose only spend was a fast forward spend: it would never be evicted after the singleton was melted.\n* 2. FF-spends enter the mempool even when their coin is already spent, on the assumption that block formation will fast-forward them onto the singleton&#x27;s latest version. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 27 words, limit 25\">But</mark> we never checked that the singleton still existed, so we accepted singleton spends into the mempool for singletons that <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer exist.\n* 3. During block formation, FF spends were updated to spend the singleton&#x27;s most recent coin. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 40 words, limit 25\">That</mark> update happened in place, mutating the mempool and propagating the fast-forwarded versions of the mempool item to the rest of the network \u2014 doubling the number of copies of the item every time a farmer attempted to form a block.\n\nTogether, these three bugs meant that anyone submitting a fast-forward-eligible singleton spend on its own, not bundled with any other spend, would see the following:\n\n* The spend is treated as valid, enters the mempool, and propagates across the network.\n* Every time a farmer made a block, the spend was multiplied and the new transactions spread through the network (bug 3).\n* Melting the singleton to halt the spread stopped the transactions from going through but did not evict the spends from the mempool (bug 2). In our case, the mempool was full of these spends when that happened. Every one of them failed during block creation, so farmers timed out before locating any valid transactions.\n* Farmers attempting to build a block from the affected mempool items hit performance problems and missed the cutoff for getting their block into the blockchain.\n\n## Timeline\n\nAll times PST, 02/13/2025 \u2013 02/19/2025. All times are approximate.\n\n02-13-2025 11:00 pm \u2014 Mempool spendbundle count begins climbing slowly.\n\n02-14-2025 11:30 am \u2014 Mempool cost reaches max cost.\n\n02-14-2025 1:10 pm \u2014 Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Chia blockchain netspace starts falling<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> timelord infused blocks per minute drops noticeably.\n\n02-14-2025 11:00 pm <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> CNI diagnoses the cause and prepares a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am \u2014 Build process for the hotfix release begins.\n\n02-15-2025 3:00 am \u2014 Hotfix deployment completes, shipping as version 2.5.1.\n\n02-19-2025 3:15 pm <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Version 2.5.2 released, containing the fixes for the Fast Forward issues described above.\n\n## Resolution and recovery\n\n<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">Because</mark> the Chia blockchain is decentralized, with many nodes running different configurations and versions, the majority of blockchain netspace was unaffected by the Fast Forward issues.\n\nVersion 2.5.1 shipped a workaround that caps the time spent creating an unfinished block, so the block reaches a timelord promptly. Netspace began recovering toward previous levels after that release.\n\nVersion 2.5.2 shipped the actual fixes. These invalidated the mempoolItems left over from the Fast Forward issues, and the mempool cleared of them as users adopted v2.5.2:\n\n* 1. Spend bundles submitted to the mempool that contain only fast forward spends are rejected.\n* 2. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> a spend is &quot;rebased&quot; onto the latest version of the singleton, the mempool item is no longer updated, so the new copy is not distributed to the network.\n* 3. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 28 words, limit 25\">When</mark> spend bundles are ingested into the mempool, every fast-forward-eligible spend is validated to confirm the latest version of that singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 857, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 11 conditions, the rewrite 9. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A3", "quote": "That update happened in place, mutating the mempool and", "problem": "This 40-word sentence chains three separate consequences (mutating, propagating, doubling) instead of splitting into shorter sentences that would each stay under the description limit.", "fix": "Write \"That update happened in place. It mutated the mempool ast-forward spend lets a singleton transaction apply to future versions of the singleton. This lets an offer file refer to a singleton by coin ID, even though the coin ID changes for every state update.\n\nVaults also use fast-forward spends. The vault singleton authorizes all coins that belong to it. One vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward lets several spends of the vault singleton sit in the mempool at the same time. Farmers deduplicate and rebase them in order as they create blocks.\n\nCNI found three root causes of the slow-down in block creation:\n\n1. A fast-forward spend does not become invalid when its coin is spent. The spend can move forward to the latest version of the singleton. A fast-forward spend relies on other parts of the spend bundle for eviction, for example a block that spends that coin. We did not consider a bundle whose only spend was a fast-forward spend. That bundle was not evicted after the melt of the singleton.\n2. A fast-forward spend enters the mempool even when its coin is already spent. At block formation, the spend moves forward on top of the latest version of the singleton. We did not check that the singleton still existed. We therefore accepted singleton spends into the mempool for singletons that were melted and no longer exist.\n3. At block formation, a fast-forward spend was updated to spend the most recent coin of a singleton. This update happened in place. The mempool changed, and it propagated the fast-forwarded versions of the mempool item to the rest of the network. The mempool item doubled in number every time a farmer tried to form a block.\n\nThese 3 bugs affected anyone who submitted a singleton spend that was eligible for fast forward without any other spend in the bundle:\n\n- The spend counted as valid. It entered the mempool and propagated across the network.\n- Every block that a farmer made multiplied the spend and propagated the new transactions across the network (3).\n- A melt of the singleton stopped the transactions from going through, but did not evict the spends from the mempool (2). In our case, the mempool was full of these spends when the melt happened. All of these spends failed during block creation. Farmers timed out before they found any valid transaction.\n- Farmers that tried to create a block with the affected mempool items hit performance problems. They missed the cutoff time for their block to enter the blockchain.\n\n## Timeline\n\nAll times are PST, from 02/13/2025 to 02/19/2025. All times are approximations.\n\n| Date and time | Event |\n|---|---|\n| 02-13-2025 11:00 pm | The count of spend bundles in the mempool started to increase slowly. |\n| 02-14-2025 11:30 am | The mempool cost hit the maximum cost. |\n| 02-14-2025 1:10 pm | The count of spend bundles in the mempool plateaued at about 6200. |\n| 02-14-2025 4:45 pm | The netspace of the Chia blockchain started to decrease. The blocks per minute that timelords infused dropped sharply. |\n| 02-14-2025 11:00 pm | CNI diagnosed the cause of the problems. CNI prepared a hotfix release of the Chia blockchain software. |\n| 02-15-2025 1:30 am | The build process for the hotfix release started. |\n| 02-15-2025 3:00 am | The deployment of the hotfix release completed as version 2.5.1. |\n| 02-19-2025 3:15 pm | Version 2.5.2 was released. It included the fixes for the fast-forward bugs in the issue summary. |\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized. Many nodes run different configurations and versions. The fast-forward bugs therefore did not affect the majority of the blockchain netspace.\n\nVersion 2.5.1 of the Chia blockchain contains a workaround. It caps the time to create an unfinished block, so the unfinished block reaches a timelord in time. The netspace started to recover towards previous levels after the release of v2.5.1.\n\nVersion 2.5.2 included fixes that invalidated the mempool items from the fast-forward bugs. The mempool cleared these items as the userbase took up v2.5.2. The fixes are:\n\n1. The mempool rejects a spend bundle that contains only fast-forward spends.\n2. When a spend is &quot;rebased&quot; on top of the latest version of the singleton, we do not update the item in the mempool. That update risked <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G7: nominalization &#x27;distribution of&#x27;; use a verb\">distribution</mark> of the new copy to the network.\n3. When spend bundles enter the mempool, we check every spend that is eligible for fast forward. The check makes sure the latest version of this singleton still exists, with the given puzzle hash.", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 911, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 11 conditions, the rewrite 9. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "Bugs in the mempool logic for fast-forward spends stopped farmers from creating", "problem": "The rewrite drops the fact that CNI was the one who detected the symptoms (mempool full while transactions were not entering blocks); the original attributes this specifically to CNI.", "fix": "State who found the problem, e.g. \"CNI found that transactions did not enter blocks while the mempool was full.\"", "reason": "PSTE-A1 requires every fact to survive a rewrite, and who detected the issue is a fact the original states explicitly ('CNI detected that...') that the rewrite turns into an unattributed observation.", "confidence": "medium", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 5, "column": 1, "offset": 63}, {"rule": "PSTE-G7", "quote": "That update risked distribution of the new copy to the network.", "problem": "The sentence nominalizes the action ('distribution of') instead of using a verb, exactly the pattern PSTE-G7 forbids.", "fix": "Write \"That update risked distributing the new copy to the network.\"", "reason": "PSTE-G7 requires a verb to describe an action, not a noun, and the rule's own example ('perform an analysis' vs. 'analyze') is structurally identical to 'distribution of' vs. 'distribute'.", "confidence": "high", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 52, "column": 119, "offset": 4969}, {"rule": "PSTE-V6", "quote": "A melt of the singleton stopped the transactions from going through", "problem": "The term verb 'melt' is used here as a noun ('a melt of'), while the rest of the document consistently uses 'melt' only as a verb.", "fix": "Write \"Melting the singleton stopped the transactions from going through.\"", "reason": "PSTE-V6 forbids using a term verb as a noun, and the same document uses 'was melted' / 'were melted' as a verb everywhere else, so this instance breaks the one-form consistency the rule protects.", "confidence": "high", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 25, "column": 3, "offset": 2730}, {"rule": "PSTE-D3", "quote": "The spend counted as valid. It entered the mempool and propagated across the network.", "problem": "", "fix": "", "reason": "Although these four bullets narrate events in rough time order, each is an independently notable consequence tied to a specific bug (as the parenthetical bug numbers show) rather than steps a reader must follow in sequence, so a bulleted list is defensible.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 2, "agreement": 0.5, "located": false, "line": null, "column": null, "offset": null}, {"rule": "PSTE-D3", "quote": "propagated the new transactions across the network (3)", "problem": "", "fix": "", "reason": "These bulleted consequences are cross-referenced back to specific numbered root causes rather than being steps for a reader to perform in sequence, so the parallel-item bullet format of PSTE-D4 fits better than a numbere was removed because it was assumed that running the MempoolItem as ", "line": 13, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 928, "token": "This"}, {"rule": "PSTE-N2", "message": "description is 33 words, limit 25", "excerpt": "The chia_rs function called run_block_generator() contained a bug where if the byte cost e", "line": 15, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1098, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "The removal of the verification in the mempool code and the chia_rs bug combined allowed f", "line": 17, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1296, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 42 words, limit 25", "excerpt": "Chia monitored the mempool for these excessive CLVM cost mempool items and found that they", "line": 37, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2309, "token": "Chia"}], "html": "# unbound CLVM cost restriction on mempool\n\n## Issue Summary\n\nTransactions that are included in a block are aggregated from one or more spendbundles. Inside spendbundles coins are spent, with the reveal of the puzzle and their solution of the coins. The puzzles and solutions consist of CLVM code that is assigned a cost, based on bytes of the code, and usage of operands and conditions. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">Each</mark> node on the network runs the CLVM code with limitations on how much resources the execution can use up via restrictions on the CLVM cost.\n\nThe Chia default mempool code uses a CLVM cost <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction that consensus uses (what is allowed in a block). The consensus constant is &quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000\n\n\nVersion 1.7.1 of the mempool <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;doesn\u2019t&#x27;\">doesn\u2019t</mark> include verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`\nThis code was present in previous versions.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> verification code was removed because it was assumed that running the MempoolItem as a block generator would perform this check already, making the code redundant.\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 33 words, limit 25\">The</mark> chia_rs function called run_block_generator() contained a bug where if the byte cost exceeded the limit (5.5 billion in this case), the u64 wraps around and effectively removes the cost limit.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 32 words, limit 25\">The</mark> removal of the verification in the mempool code and the chia_rs bug combined allowed for a MempoolItem to have an unbound CLVM cost when the byte cost exceeded the limit.\n\n## Timeline (all times PST)   04/23/2023 - 05/03/2023. All times approximations\n\n04/23/2023 - Mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5` were reported by a community member in keybase.\n\n05/03/2023 - Version 1.8.0 of the Chia blockchain was released with fixes for the mempool code and chia_rs.\n\n\n## Resolution and recovery\n\nThis issue was addressed in 1.8.0 by: \n\nReinstating the mempool verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n\nFixing the cost calculation in chia_rs when the byte cost exceeds the limit.\n\n\nThe issue was present in mainnet and manifested itself by transactions being added to the mempool that exceeded the CLVM cost threshold. These transactions were not added to blocks as consensus checks on CLVM cost disallowed that.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 42 words, limit 25\">Chia</mark> monitored the mempool for these excessive CLVM cost mempool items and found that they were limited in scope and barely exceeded the threshold limit, causing very limited impact on nodes on the network during the time that the mempool allowed them.\n\n\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 364, "findings": [{"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Puzzles and solutions consist of CLVM code, which is assigned a cost based on the bytes of", "line": 5, "column": 166, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 227, "token": "Puzzles"}, {"rule": "PSTE-G7", "message": "nominalization 'restriction of'; use a verb", "excerpt": "The Chia default mempool code uses a CLVM cost restriction of 0.5 times the restriction co", "line": 7, "column": 48, "excerpt_offset": 47, "severity": "MUST", "arbitrated": true, "offset": 564, "token": "restriction"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Together, the removed mempool verification and the chia_rs bug allowed a MempoolItem to ha", "line": 14, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1353, "token": "Together"}, {"rule": "PSTE-N5", "message": "multi-word noun 'mempool verification code requiring' over 3 words", "excerpt": "Reinstating the mempool verification code requiring the CLVM cost of a MempoolItem to be  ", "line": 27, "column": 16, "excerpt_offset": 12, "severity": "MUST", "arbitrated": true, "offset": 1925, "token": "the"}], "html": "# Unbound CLVM Cost Restriction on Mempool\n\n## Issue Summary\n\nTransactions included in a block are aggregated from one or more spendbundles. Inside spendbundles, coins are spent, revealing the puzzle and solution of the coins. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">Puzzles</mark> and solutions consist of CLVM code, which is assigned a cost based on the bytes of the code and the usage of operands and conditions. Every node on the network runs CLVM code under limits on how many resources the execution may use, enforced through restrictions on the CLVM cost.\n\nThe Chia default mempool code uses a CLVM cost <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction consensus uses (what is allowed in a block). The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nTwo problems combined to cause the issue:\n\n1. **Missing mempool check.** Version 1.7.1 of the mempool does not include verification code requiring the CLVM cost of a MempoolItem to be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. This code was present in previous versions. It was removed because it was assumed that running the MempoolItem as a block generator would already perform this check, making the code redundant.\n2. **chia_rs overflow bug.** The chia_rs function `run_block_generator()` contained a bug: when the byte cost exceeded the limit (5.5 billion in this case), the u64 wrapped around, effectively removing the cost limit.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 26 words, limit 25\">Together</mark>, the removed mempool verification and the chia_rs bug allowed a MempoolItem to have an unbound CLVM cost whenever the byte cost exceeded the limit.\n\n## Timeline\n\nAll times PST, 04/23/2023 \u2013 05/03/2023. All times are approximations.\n\n- **04/23/2023** \u2014 A community member reported mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5` in keybase.\n- **05/03/2023** \u2014 Version 1.8.0 of the Chia blockchain was released with fixes for the mempool code and chia_rs.\n\n## Resolution and Recovery\n\nVersion 1.8.0 addressed the issue by:\n\n1. Reinstating <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;mempool verification code requiring&#x27; over 3 words\">the</mark> mempool verification code requiring the CLVM cost of a MempoolItem to be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. Fixing the cost calculation in chia_rs for when the byte cost exceeds the limit.\n\nThe issue was present on mainnet. It manifested as transactions being added to the mempool that exceeded the CLVM cost threshold. These transactions were not added to blocks, because consensus checks on CLVM cost disallowed that.\n\nChia monitored the mempool for these excessive-cost mempool items and found they were limited in scope and barely exceeded the threshold limit. Impact on network nodes was very limited during the time the mempool allowed them.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 411, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "these excessive-cost mempool items and found they were limited", "problem": "The rewrite drops the qualifier that the excessive cost was specifically CLVM cost, generalizing it to 'excessive-cost'.", "fix": "Write \"excessive CLVM-cost mempool items\" to keep the scope qualifier from the original.", "reason": "The original names 'excessive CLVM cost mempool items'; PSTE-A1 forbids dropping a scope qualifier such as which kind of cost was excessive.", "confidence": "high", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 32, "column": 32, "offset": 2391}, {"rule": "PSTE-A3", "quote": "Every node on the network runs CLVM code under limits on how", "problem": "This sentence exceeds the 25-word description limit (flagged mechanically) with no fact that a split would remove.", "fix": "Split into two sen ine": null, "column": null, "offset": null}, {"rule": "PSTE-L4", "quote": "Reinstating the mempool verification code requiring the CLVM cost of a MempoolItem", "problem": "", "fix": "", "reason": "the threshold formula recurs across the background, the missing-check item, the timeline, and the fix because each section describes a different event (the rule, its absence, its report, its restoration), not a redundant restatement of one fact.", "confidence": "", "status": "rejected", "seenIn": 1, "of": 2, "agreement": 0.5, "located": false, "line": null, "column": null, "offset": null}], "semanticConfirmed": 3}, "pste": {"missing": false, "pass": false, "words": 392, "findings": [{"rule": "PSTE-G7", "message": "nominalization 'restriction of'; use a verb", "excerpt": "The default mempool code in Chia uses a CLVM cost restriction of 0.5 times the restriction", "line": 11, "column": 51, "excerpt_offset": 50, "severity": "MUST", "arbitrated": true, "offset": 805, "token": "restriction"}], "html": "# Unbound CLVM Cost Restriction on the Mempool\n\n## Issue Summary\n\nThe mempool in version 1.7.1 did not check the CLVM cost of a MempoolItem. A bug in `chia_rs` removed the cost limit when the byte cost exceeded it. Together these two faults let a MempoolItem have an unbound CLVM cost.\n\nA block aggregates one or more spendbundles. A spendbundle spends coins. Each spend reveals the puzzle of the coin and the solution of the coin. The puzzles and the solutions are CLVM code. Each piece of CLVM code has a cost. The cost comes from the bytes of the code, the operands that the code uses, and the conditions that the code uses.\n\nEvery node on the network runs the CLVM code. A restriction on the CLVM cost limits how much resource the execution can use.\n\nThe default mempool code in Chia uses a CLVM cost <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction that consensus uses. Consensus sets what a block allows. The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nVersion 1.7.1 of the mempool does not include the code that checks that the CLVM cost of a MempoolItem is `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. Earlier versions include this code.\n\nSomeone removed this check because they assumed that running the MempoolItem as a block generator already made this check. That assumption made the check look redundant.\n\nThe `chia_rs` function `run_block_generator()` held a bug. When the byte cost exceeded the limit of 5.5 billion, the u64 value wrapped around. The wrap removed the cost limit.\n\n## Timeline\n\nAll times are PST. All times are approximations. The range is 04/23/2023 to 05/03/2023.\n\n1. 04/23/2023 \u2014 A community member reported in keybase that mempool items exceeded a cost of `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. 05/03/2023 \u2014 Chia released version 1.8.0 of the blockchain. This version fixes the mempool code and `chia_rs`.\n\n## Resolution and Recovery\n\nVersion 1.8.0 fixes this issue in two ways:\n\n1. It reinstates the mempool check that the CLVM cost of a MempoolItem is `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. It fixes the cost calculation in `chia_rs` for the case where the byte cost exceeds the limit.\n\nThe issue was present in mainnet. It showed itself when the mempool accepted transactions that exceeded the CLVM cost threshold. Blocks did not include these transactions. The consensus checks on CLVM cost disallowed that.\n\nChia monitored the mempool for these mempool items with an excessive CLVM cost. Chia found that they were limited in scope and that they barely exceeded the threshold limit. They caused very limited impact on the nodes on the network during the time that the mempool allowed them.", "factLoss": false, "fidelity": {"source_words": 421, "rewrite_words": 447, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PST tribution": "Rewritten from \"Restoring, upgrading, and maintaining an etcd cluster\" by The Kubernetes Authors, used under CC-BY-4.0. Source: https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md", "author": "The Kubernetes Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 470, "findings": [{"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If any API servers are running in your cluster, you should not attempt to", "line": 3, "column": 53, "excerpt_offset": 52, "severity": "MUST", "arbitrated": false, "offset": 82, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "CODE                    ,  CODE    ) to ensure that they don't rely on some", "line": 11, "column": 59, "excerpt_offset": 57, "severity": "MUST", "arbitrated": false, "offset": 434, "token": "don't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 71, "excerpt_offset": 67, "severity": "MUST", "arbitrated": false, "offset": 1303, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'be restored'; name the actor", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 78, "excerpt_offset": 74, "severity": "MUST", "arbitrated": false, "offset": 1310, "token": "be"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If the access URLs of the restored cluster are changed from the previous\ncluster, the Kube", "line": 52, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2651, "token": "If"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If the majority of etcd members have permanently failed, the etcd cluster is\nconsidered fa", "line": 61, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3138, "token": "If"}], "html": "## Restoring an etcd cluster\n\nIf any API servers are running in your cluster, you <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not attempt to\nrestore instances of etcd. Instead, follow these steps to restore etcd:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`,\n`kube-controller-manager`, `kubelet`) to ensure that they <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on some\nstale data. In practice the restore takes a bit of time.  During the\nrestoration, critical components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.minor](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be present. It can\neither be a snapshot file from a previous backup operation, or from a remaining\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** since etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to utilize [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured accordingly. In this\ncase, restart Kubernetes API servers with the      option to say where the cluster should be restored:", "line": 24, "column": 61, "excerpt_offset": 60, "severity": "MUST", "arbitrated": false, "offset": 1010, "token": "be"}], "html": "## Restoring an etcd cluster\n\n**Do not restore etcd while any API server is running.** Restore in this order:\n\n1. Stop *all* API server instances.\n2. Restore state in all etcd instances.\n3. Restart all API server instances.\n\nThe Kubernetes project also recommends restarting `kube-scheduler`, `kube-controller-manager`, and `kubelet` so they <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use stale data.\n\nRestores take a little time. While one runs, critical components lose their leader lock and restart themselves.\n\n### What you can restore from\n\netcd can restore snapshots taken from an etcd process of the same [major.minor](https://semver.org/) version. Different patch versions also work. A restore recovers the data of a failed cluster.\n\nYou need a snapshot file before you start. It can come from either:\n\n- a previous backup operation, or\n- a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n### Restoring with `etcdutl` (recommended)\n\nUse the `--data-dir` option to say where the cluster <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n```shell\netcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\n`&lt;data-dir-location&gt;` is a directory that will be created during the restore.\n\nSee [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) for details.\n\n### Restoring with `etcdctl` (deprecated)\n\nUsing `etcdctl` to restore has been **deprecated** since etcd v3.5.x and is slated for removal in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n```shell\nexport ETCDCTL_API=3\netcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\n### Handling the data directory\n\n- **Reusing the old directory:** delete it and stop the etcd process before restoring.\n- **Using a new directory:** change the etcd configuration and restart etcd after the restore, so it picks up the new directory. First, in `/etc/kubernetes/manifests/etcd.yaml`, set `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`. Then run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\nFor more information and examples, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n### If the access URLs changed\n\nIf the restored cluster&#x27;s access URLs differ from the previous cluster&#x27;s, reconfigure the Kubernetes API server. Restart the API servers with `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`, replacing `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses.\n\nIf a load balancer sits in front of the etcd cluster, you might need to update the load balancer instead.\n\n### When a majority of members fail\n\nIf most etcd members have permanently failed, the etcd cluster counts as failed. Kubernetes then cannot change its current state: already-scheduled pods may keep running, but no new pods can be scheduled. To fix this, recover the etcd cluster and, if needed, reconfigure the Kubernetes API servers.\n\n## Upgrading etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor details, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.", "factLoss": true, "fidelity": {"source_words": 595, "rewrite_words": 513, "findings": [{"kind": "modal", "severity": "critical", "message": "an obligation weakened into a suggestion (must/shall 2 -> 0, should/may 6 -> 7)."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [{"rule": "PSTE-N6", "quote": "instead of `--etcd-servers=$OLD_ETCD_CLUSTER`, replacing `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses", "problem": "One sentence bundles two distinct instructions: restarting the API servers with a new flag, and substituting the placeholder names with real IP addresses.", "fix": "Split into two sentences: an instruction to restart with the new flag, followed by a separate instruction to replace the placeholders with the actual IP addresses (as the original did).", "reason": "PSTE-N6 requires one instruction per sentence unless the actions happen at the same time, and substituting variable values is a separate action from restarting the process.", "confidence": "high", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 52, "column": 178, "offset": 2469}, {"rule": "PSTE-W1", "quote": "delete it and stop the etcd process before restoring", "problem": "The instruction tells the reader to permanently delete the existing data directory with no warning beforehand.", "fix": "Add a warning before this step naming the risk, e.g. state that this permanently removes the existing etcd data.", "reason": "PSTE-W1 requires a warning before an operation that destroys data or that the reader cannot reverse, and deleting a directory meets both conditions.", "confidence": "medium", "status": "confirmed", "seenIn": 2, "of": 2, "agreement": 1.0, "located": true, "line": 45, "column": 34, "offset": 1684}, {"rule": "PSTE-A1", "quote": "Do not restore etcd while any API server is running.", "problem": "The rewrite drops the scope qualifier \"in your cluster\" that the original attached
