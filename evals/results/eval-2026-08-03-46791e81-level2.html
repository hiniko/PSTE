often enough that the gc grace period", "line": 72, "column": 29, "excerpt_offset": 28, "offset": 2710, "token": "be"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With a default gc grace period of 10 days, repairing every", "line": 74, "column": 16, "excerpt_offset": 5, "offset": 2834, "token": "a"}, {"rule": "PSTE-G1", "message": "passive voice 'are estimated'; name the actor", "excerpt": "default, incremental repairs are estimated, add the  CODE    flag to", "line": 88, "column": 32, "excerpt_offset": 29, "offset": 3478, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "data, but doesn't do any streaming.", "line": 93, "column": 13, "excerpt_offset": 10, "offset": 3716, "token": "doesn't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "a full repair should be run.", "line": 95, "column": 17, "excerpt_offset": 14, "offset": 3849, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'be run'; name the actor", "excerpt": "a full repair should be run.", "line": 95, "column": 24, "excerpt_offset": 21, "offset": 3856, "token": "be"}, {"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "Incremental repairs are the default repair type, and if run regularly,\ncan significantly r", "line": 97, "column": 2, "excerpt_offset": 0, "offset": 3866, "token": "nodetool"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "The specific frequency of repair that's right for your cluster, of\ncourse, depends on seve", "line": 97, "column": 2, "excerpt_offset": 0, "offset": 3866, "token": "nodetool"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "At a minimum, repair should be run often enough that the gc grace period\nnever expires on ", "line": 97, "column": 2, "excerpt_offset": 0, "offset": 3866, "token": "nodetool"}, {"rule": "PSTE-D2", "message": "paragraph has 22 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 97, "column": 2, "excerpt_offset": 0, "offset": 3866, "token": "nodetool"}], "html": "== Incremental and Full Repairs\n\nThere are 2 types of repairs: full repairs, and incremental repairs.\nFull repairs operate over all of the data in the token range being\nrepaired. Incremental repairs only repair data that&#x27;s <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;been written&#x27;; name the actor\">been</mark> written since\nthe previous incremental repair.\n\nIncremental repairs are the default repair type, and if run regularly,\ncan significantly reduce the time and io cost of performing a repair.\nHowever, <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> important to understand that once an incremental repair\nmarks data as repaired, it <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> try to repair it again. This is fine\nfor syncing up missed writes, but it <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> protect against things like\ndisk corruption, data loss by operator error, or bugs in Cassandra. For\nthis reason, full repairs <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> still <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;be run&#x27;; name the actor\">be</mark> run occasionally.\n\n== Automated Repair Scheduling\n\nSince repair can result in a lot of disk and network io, it has\ntraditionally not <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;been run&#x27;; name the actor\">been</mark> run automatically by Cassandra.\n\nIn the latest version of Cassandra, a new feature called\nxref:managing/operating/auto_repair.adoc[auto repair] <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;was introduced&#x27;; name the actor\">was</mark> introduced to\nallow Cassandra to submit and manage repairs automatically on a schedule.\n\nThe <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G7: nominalization &#x27;introduction of&#x27;; use a verb\">introduction</mark> of this feature does not interfere with existing repair\nfunctionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nRepairs can also <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;be run&#x27;; name the actor\">be</mark> run by the operator via nodetool.\n\nIncremental repair is the default and <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;is run&#x27;; name the actor\">is</mark> run with the following command:\n\n[source,none]\n----\nnodetool repair\n----\n\nA full repair can <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;be run&#x27;; name the actor\">be</mark> run with the following command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nAdditionally, repair can <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G1: passive voice &#x27;be run&#x27;; name the actor\">be</mark> run on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr even on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\n\nThe repair command repairs token ranges only on the node <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G1: passive voice &#x27;being repaired&#x27;; name the actor\">being</mark> repaired<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it does not repair the whole cluster.\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 26 words, limit 25\">By</mark> default, repair operates on all token ranges replicated by the node on which repair <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G1: passive voice &#x27;is run&#x27;; name the actor\">is</mark> run, causing duplicate work when running it on every node. Avoid duplicate work by using the `-pr` flag to repair only the &quot;primary&quot; ranges on a node. \n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N1: instruction is 28 words, limit 20\">Do</mark> a full cluster repair by running the `nodetool repair -pr` command on each node in each datacenter in the cluster, until all of the nodes and datacenters <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G1: passive voice &#x27;are repaired&#x27;; name the actor\">are</mark> repaired. \n\nThe specific frequency of repair that&#x27;s right for your cluster, of\ncourse, depends on several factors. However, if <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out\nand looking for somewhere to start, running an incremental repair every\n1-3 days, and a full repair every 1-3 weeks is probably reasonable. If\nyou <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to run incremental repairs, a full repair every 5 days is\na good place to start.\n\nAt a minimum, repair <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G1: passive voice &#x27;be run&#x27;; name the actor\">be</mark> run often enough that the gc grace period\nnever expires on unrepaired data. Otherwise, deleted data could\nreappear. With <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">a</mark> default gc grace period of 10 days, repairing every\nnode in your cluster at least once every 7 days will prevent this, while\nproviding enough slack to allow for delays.\n\n== Other Options\n\n`-pr, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node being\n  repaired. A primary range is just a token range for which a node is\n  the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming that would occur for the given\n  repair command. This builds the merkle trees, and prints the expected\n  streaming activity, but does not actually do any streaming. By\n  default, incremental repairs <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G1: passive voice &#x27;are estimated&#x27;; name the actor\">are</mark> estimated, add the `--full` flag to\n  estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Similar\n  to `--preview`, this builds and compares merkle trees of repaired\n  data, but <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> do any streaming. This is useful for\n  troubleshooting. If this shows that the repaired data is out of sync,\n  a full repair <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G1: passive voice &#x27;be run&#x27;; name the actor\">be</mark> run.\n\n`<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">nodetool</mark> repair docs &lt;nodetool_repair&gt;`\n"}, "control": {"missing": false, "pass": false, "words": 504, "findings": [{"rule": "PSTE-G1", "message": "passive voice 'being repaired'; name the actor", "excerpt": "A full repair covers all of the data in the token range being repaired.", "line": 3, "column": 125, "excerpt_offset": 56, "offset": 157, "token": "being"}, {"rule": "PSTE-N3", "message": "contraction 'won't'", "excerpt": "That's fine for syncing up missed writes, but it won't catch disk corruption, data loss fr", "line": 5, "column": 260, "excerpt_offset": 49, "offset": 519, "token": "won't"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "The latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.", "line": 11, "column": 1, "excerpt_offset": 0, "offset": 776, "token": "The"}, {"rule": "PSTE-G1", "message": "passive voice 'being repaired'; name the actor", "excerpt": "The repair command only repairs token ranges on the node being repaired \u2014 not the whole cl", "line": 47, "column": 58, "excerpt_offset": 57, "offset": 1548, "token": "being"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "The repair command only repairs token ranges on the node being repaired \u2014 not the whole cl", "line": 47, "column": 73, "excerpt_offset": 72, "offset": 1563, "token": "\u2014"}, {"rule": "PSTE-G1", "message": "passive voice 'is done'; name the actor", "excerpt": "To repair the full cluster, run  CODE                 on each node in each datacenter unti", "line": 47, "column": 422, "excerpt_offset": 118, "offset": 1912, "token": "is"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're just starting out, an incremental repair every 1-3 days plus a full repair every", "line": 49, "column": 76, "excerpt_offset": 3, "offset": 1997, "token": "you're"}, {"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "At a minimum, repair often enough that the gc grace period never expires on unrepaired dat", "line": 51, "column": 40, "excerpt_offset": 39, "offset": 2256, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'default gc grace period' over 3 words", "excerpt": "With the default gc grace period of 10 days, repairing every node at least once every 7 da", "line": 51, "column": 136, "excerpt_offset": 5, "offset": 2352, "token": "the"}, {"rule": "PSTE-G1", "message": "passive voice 'being repaired'; name the actor", "excerpt": "Restricts repair to the 'primary' token ranges of the node being repaired.", "line": 56, "column": 62, "excerpt_offset": 59, "offset": 2599, "token": "being"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "It estimates incremental repairs by default; add the  CODE    flag to estimate a full repa", "line": 58, "column": 212, "excerpt_offset": 43, "offset": 2939, "token": ";"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "CODE                     ::\n  Restricts repair to the 'primary' token ranges of the node b", "line": 62, "column": 2, "excerpt_offset": 0, "offset": 3271, "token": "nodetool"}], "html": "== Full and Incremental Repairs\n\nThere are 2 types of repairs: full repairs and incremental repairs. A full repair covers all of the data in the token range <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;being repaired&#x27;; name the actor\">being</mark> repaired. An incremental repair only covers data written since the previous incremental repair.\n\nIncremental repair is the default. Run regularly, it can significantly reduce the time and io cost of a repair. But be aware: once an incremental repair marks data as repaired, it never checks that data again. That&#x27;s fine for syncing up missed writes, but it <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> catch disk corruption, data loss from operator error, or Cassandra bugs. So still run full repairs occasionally.\n\n== Automated Repair Scheduling\n\nRepair can cause a lot of disk and network io, so Cassandra has traditionally not run it automatically.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 28 words, limit 25\">The</mark> latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.adoc[auto repair], which lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with existing repair functionality enabled via nodetool.\n\n== Submitting Repairs Using Nodetool\n\nOperators can also run repairs via nodetool.\n\nIncremental repair is the default:\n\n[source,none]\n----\nnodetool repair\n----\n\nFor a full repair:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nTo repair a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nTo repair specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command only repairs token ranges on the node <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;being repaired&#x27;; name the actor\">being</mark> repaired <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> not the whole cluster. By default it covers all token ranges replicated by that node, which duplicates work when you run it on every node. Use the `-pr` flag to repair only the node&#x27;s &quot;primary&quot; ranges and avoid that duplication. To repair the full cluster, run `nodetool repair -pr` on each node in each datacenter until every node and datacenter <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;is done&#x27;; name the actor\">is</mark> done.\n\nThe right repair frequency for your cluster depends on several factors. If <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> just starting out, an incremental repair every 1-3 days plus a full repair every 1-3 weeks is a reasonable baseline. If you&#x27;d rather skip incremental repairs, a full repair every 5 days is a good starting point.\n\nAt a minimum, repair often enough that <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. Otherwise deleted data can reappear. With <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N5: multi-word noun &#x27;default gc grace period&#x27; over 3 words\">the</mark> default gc grace period of 10 days, repairing every node at least once every 7 days prevents this and leaves enough slack for delays.\n\n== Other Options\n\n`-pr, --partitioner-range`::\n  Restricts repair to the &#x27;primary&#x27; token ranges of the node <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;being repaired&#x27;; name the actor\">being</mark> repaired. A primary range is simply a token range for which the node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates how much streaming a given repair command would cause. It builds the merkle trees and prints the expected streaming activity, but does no actual streaming. It estimates incremental repairs by default<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Verifies that the repaired data is the same across all nodes. Like `--preview`, it builds and compares merkle trees of repaired data but does no streaming. This is useful for troubleshooting. If it shows the repaired data is out of sync, run a full repair.\n\n`<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 12 sentences, limit 6\">nodetool</mark> repair docs &lt;nodetool_repair&gt;`"}, "pste": {"missing": false, "pass": false, "words": 572, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'gc grace period never expires' over 3 words", "excerpt": "Run repair often enough that the gc grace period never expires on unrepaired data.", "line": 53, "column": 30, "excerpt_offset": 29, "offset": 2449, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 14 sentences, limit 6", "excerpt": "CODE                     ::\n  Repairs only the 'primary' token ranges of the node that you", "line": 64, "column": 2, "excerpt_offset": 0, "offset": 3489, "token": "nodetool"}], "html": "== Incremental and Full Repairs\n\nCassandra has 2 repair types: full repairs and incremental repairs. A full repair repairs all of the data in the token range. An incremental repair repairs only the data that a client wrote after the previous incremental repair.\n\nIncremental repair is the default repair type. If you run it regularly, it cuts the time and io cost of a repair by a large amount. But once an incremental repair marks data as repaired, it does not repair that data again. This works for syncing missed writes. It does not protect against disk corruption, data loss by operator error, or bugs in Cassandra. So you must still run a full repair now and then.\n\n== Automated Repair Scheduling\n\nA repair can cause a lot of disk and network io. So Cassandra did not run repairs automatically in the past.\n\nThe latest version of Cassandra adds a feature called xref:managing/operating/auto_repair.adoc[auto repair]. This feature lets Cassandra submit and manage repairs automatically on a schedule.\n\nThis feature does not interfere with the existing repair functions that you start with nodetool.\n\n== Submitting Repairs Using Nodetool\n\nThe operator can also run a repair with nodetool.\n\nIncremental repair is the default. Run it with this command:\n\n[source,none]\n----\nnodetool repair\n----\n\nRun a full repair with this command:\n\n[source,none]\n----\nnodetool repair --full\n----\n\nYou can also run a repair on a single keyspace:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt;\n----\n\nOr on specific tables:\n\n[source,none]\n----\nnodetool repair [options] &lt;keyspace_name&gt; &lt;table1&gt; &lt;table2&gt;\n----\n\nThe repair command repairs the token ranges on the node that you repair. It does not repair the whole cluster. By default, repair covers all token ranges that the node replicates. This causes duplicate work when you run it on every node. Use the `-pr` flag to repair only the &quot;primary&quot; ranges on a node. This avoids the duplicate work.\n\nTo repair the full cluster, run the `nodetool repair -pr` command on each node in each datacenter. Continue until you repair all of the nodes and all of the datacenters.\n\nThe right repair frequency for your cluster depends on several factors. If you are just starting out and need a place to start, run an incremental repair every 1-3 days and a full repair every 1-3 weeks. If you do not want to run incremental repairs, a full repair every 5 days is a good place to start.\n\nRun repair often enough that <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;gc grace period never expires&#x27; over 3 words\">the</mark> gc grace period never expires on unrepaired data. If it expires, deleted data can reappear. The default gc grace period is 10 days. Repair every node in your cluster at least once every 7 days to prevent this. This also gives you enough slack for delays.\n\n== Other Options\n\n`-pr, --partitioner-range`::\n  Repairs only the &#x27;primary&#x27; token ranges of the node that you repair. A primary range is a token range for which the node is the first replica in the ring.\n`-prv, --preview`::\n  Estimates the amount of streaming for the given repair command. This builds the merkle trees and shows the expected streaming activity. It does not stream any data. By default, this estimates an incremental repair. Add the `--full` flag to estimate a full repair.\n`-vd, --validate`::\n  Checks that the repaired data is the same across all nodes. Like `--preview`, this builds and compares merkle trees of repaired data, but it does not stream any data. This helps you troubleshoot. If it shows that the repaired data is out of sync, run a full repair.\n\n`<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 14 sentences, limit 6\">nodetool</mark> repair docs &lt;nodetool_repair&gt;`"}}}, "howto-k8s-debug-pods": {"category": "documentation", "title": "Debug Pods", "prompt": "", "attribution": "Rewritten from \"Debug Pods\" by The Kubernetes Authors, used under CC-BY-4.0. Source: https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/debug/debug-application/debug-pods.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/debug/debug-application/debug-pods.md", "author": "The Kubernetes Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 766, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'is taking'", "excerpt": "The first step in debugging a Pod is taking a look at it.", "line": 3, "column": 35, "excerpt_offset": 34, "offset": 54, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'be scheduled'; name the actor", "excerpt": "If a Pod is stuck in  CODE     it means that it can not be scheduled onto a node.", "line": 17, "column": 57, "excerpt_offset": 56, "offset": 453, "token": "be"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "There should be messages from the scheduler about why it can not schedule your pod.", "line": 20, "column": 7, "excerpt_offset": 6, "offset": 656, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "**You don't have enough resources**:", "line": 23, "column": 9, "excerpt_offset": 6, "offset": 760, "token": "don't"}, {"rule": "PSTE-G4", "message": "perfect tense 'have exhausted'; use simple past", "excerpt": "You may have exhausted the supply of CPU", "line": 23, "column": 48, "excerpt_offset": 8, "offset": 799, "token": "have"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "**You are using  CODE     **:", "line": 28, "column": 9, "excerpt_offset": 6, "offset": 1086, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'be scheduled'; name the actor", "excerpt": "limited number of places that pod can be scheduled.", "line": 29, "column": 41, "excerpt_offset": 38, "offset": 1198, "token": "be"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "If a Pod is stuck in the  CODE     state, then it has been scheduled to a worker node,", "line": 36, "column": 51, "excerpt_offset": 50, "offset": 1501, "token": "has"}, {"rule": "PSTE-G1", "message": "passive voice 'been scheduled'; name the actor", "excerpt": "If a Pod is stuck in the  CODE     state, then it has been scheduled to a worker node,", "line": 36, "column": 55, "excerpt_offset": 54, "offset": 1505, "token": "been"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "but it can't run on that machine.", "line": 37, "column": 8, "excerpt_offset": 7, "offset": 1546, "token": "can't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "should be informative.", "line": 38, "column": 1, "excerpt_offset": 0, "offset": 1624, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'be pulled'; name the actor", "excerpt": "Try to manually pull the image to see if the image can be pulled.", "line": 43, "column": 58, "excerpt_offset": 55, "offset": 1912, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'is provided'; name the actor", "excerpt": "If the webhook is provided by a third-party:", "line": 61, "column": 16, "excerpt_offset": 15, "offset": 2680, "token": "is"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "Make sure you are using the latest version.", "line": 62, "column": 17, "excerpt_offset": 14, "offset": 2726, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "In other words, you should allow Pods with existing violations", "line": 70, "column": 39, "excerpt_offset": 20, "offset": 3166, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'were created'; name the actor", "excerpt": "This allows Pods that were created before the validating", "line": 71, "column": 45, "excerpt_offset": 22, "offset": 3253, "token": "were"}, {"rule": "PSTE-G1", "message": "passive voice 'was installed'; name the actor", "excerpt": "webhook was installed to continue running.", "line": 72, "column": 11, "excerpt_offset": 8, "offset": 3298, "token": "was"}, {"rule": "PSTE-G4", "message": "perfect tense 'has been scheduled'; use simple past", "excerpt": "Once your pod has been scheduled, the methods described in", "line": 76, "column": 15, "excerpt_offset": 14, "offset": 3396, "token": "has"}, {"rule": "PSTE-G1", "message": "passive voice 'been scheduled'; name the actor", "excerpt": "Once your pod has been scheduled, the methods described in", "line": 76, "column": 19, "excerpt_offset": 18, "offset": 3400, "token": "been"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "pod description (e.g.", "line": 83, "column": 18, "excerpt_offset": 17, "offset": 3711, "token": "e"}, {"rule": "PSTE-G1", "message": "passive voice 'is nested'; name the actor", "excerpt": "is nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.", "line": 85, "column": 1, "excerpt_offset": 0, "offset": 3864, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'is typed'; name the actor", "excerpt": "is nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.", "line": 85, "column": 38, "excerpt_offset": 37, "offset": 3901, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'is ignored'; name the actor", "excerpt": "is nested incorrectly, or a key name is typed incorrectly, and so the key is ignored.", "line": 85, "column": 75, "excerpt_offset": 74, "offset": 3938, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'be created'; name the actor", "excerpt": "For example, if you misspelled  CODE     as  CODE    then the pod will be created but", "line": 86, "column": 72, "excerpt_offset": 71, "offset": 4021, "token": "be"}, {"rule": "PSTE-N5", "message": "multi-word noun 'command line you intended it' over 3 words", "excerpt": "will not use the command line you intended it to use.", "line": 87, "column": 14, "excerpt_offset": 13, "offset": 4049, "token": "the"}, {"rule": "PSTE-G1", "message": "passive voice 'is merged'; name the actor", "excerpt": "Now that #11914 is merged, this advice may need to be updated -->", "line": 99, "column": 28, "excerpt_offset": 16, "offset": 4574, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'be updated'; name the actor", "excerpt": "Now that #11914 is merged, this advice may need to be updated -->", "line": 99, "column": 63, "excerpt_offset": 51, "offset": 4609, "token": "be"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "matches the pod you meant to create (e.g.", "line": 102, "column": 38, "excerpt_offset": 37, "offset": 4722, "token": "e"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If your pod is not behaving as you expected, it may be that there was an error in your\npod", "line": 108, "column": 1, "excerpt_offset": 0, "offset": 5172, "token": "version"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "The next thing to check is whether the pod on the apiserver\nmatches the pod you meant to c", "line": 108, "column": 1, "excerpt_offset": 0, "offset": 5172, "token": "version"}], "html": "### Debugging Pods\n\nThe first step in debugging a Pod <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is taking&#x27;\">is</mark> taking a look at it. Check the current\nstate of the Pod and recent events with the following command:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the pod. Are they all `Running`?\nHave there been recent restarts?\n\nContinue debugging depending on the state of the pods.\n\n#### My pod stays pending\n\nIf a Pod is stuck in `Pending` it means that it can not <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;be scheduled&#x27;; name the actor\">be</mark> scheduled onto a node.\nGenerally this is because there are insufficient resources of one type or another\nthat prevent scheduling. Look at the output of the `kubectl describe ...` command above.\nThere <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be messages from the scheduler about why it can not schedule your pod.\nReasons include:\n\n* **You <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have enough resources**: You may <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G4: perfect tense &#x27;have exhausted&#x27;; use simple past\">have</mark> exhausted the supply of CPU\n  or Memory in your cluster, in this case you need to delete Pods, adjust resource\n  requests, or add new nodes to your cluster. See [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/)\n  for more information.\n\n* **You <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: When you bind a Pod to a `hostPort` there are a\n  limited number of places that pod can <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;be scheduled&#x27;; name the actor\">be</mark> scheduled. In most cases, `hostPort`\n  is unnecessary, try using a Service object to expose your Pod.  If you do require\n  `hostPort` then you can only schedule as many Pods as there are nodes in your Kubernetes cluster.\n\n\n#### My pod stays waiting\n\nIf a Pod is stuck in the `Waiting` state, then it <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;been scheduled&#x27;; name the actor\">been</mark> scheduled to a worker node, \nbut it <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run on that machine. Again, the information from `kubectl describe ...`\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be informative. The most common cause of `Waiting` pods is a failure to pull the image.\nThere are three things to check:\n\n* Make sure that you have the name of the image correct.\n* Have you pushed the image to the registry?\n* Try to manually pull the image to see if the image can <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;be pulled&#x27;; name the actor\">be</mark> pulled. For example,\n  if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n\n#### My pod stays terminating\n\nIf a Pod is stuck in the `Terminating` state, it means that a deletion has been\nissued for the Pod, but the control plane is unable to delete the Pod object.\n\nThis typically happens if the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/)\nand there is an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/)\ninstalled in the cluster that prevents the control plane from removing the\nfinalizer.\n\nTo identify this scenario, check if your cluster has any\nValidatingWebhookConfiguration or MutatingWebhookConfiguration that target\n`UPDATE` operations for `pods` resources.\n\nIf the webhook <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G1: passive voice &#x27;is provided&#x27;; name the actor\">is</mark> provided by a third-party:\n- Make sure you <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the corresponding provider.\n\nIf you are the author of the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on\n  `UPDATE` operations. For example, changes to containers are usually not allowed.\n- For a validating webhook, make sure that your validation policies only apply\n  to new changes. In other words, you <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> allow Pods with existing violations\n  to pass validation. This allows Pods that <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G1: passive voice &#x27;were created&#x27;; name the actor\">were</mark> created before the validating\n  webhook <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G1: passive voice &#x27;was installed&#x27;; name the actor\">was</mark> installed to continue running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G1: passive voice &#x27;been scheduled&#x27;; name the actor\">been</mark> scheduled, the methods described in\n[Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/)\nare available for debugging.\n\n#### My pod is running but not doing what I told it to do\n\nIf your pod is not behaving as you expected, it may be that there was an error in your\npod description (<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `mypod.yaml` file on your local machine), and that the error\nwas silently ignored when you created the pod.  Often a section of the pod description\n<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G1: passive voice &#x27;is nested&#x27;; name the actor\">is</mark> nested incorrectly, or a key name <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-G1: passive voice &#x27;is typed&#x27;; name the actor\">is</mark> typed incorrectly, and so the key <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G1: passive voice &#x27;is ignored&#x27;; name the actor\">is</mark> ignored.\nFor example, if you misspelled `command` as `commnd` then the pod will <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-G1: passive voice &#x27;be created&#x27;; name the actor\">be</mark> created but\nwill not use <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended it&#x27; over 3 words\">the</mark> command line you intended it to use.\n\nThe first thing to do is to delete your pod and try creating it again with the `--validate` option.\nFor example, run `kubectl apply --validate -f mypod.yaml`.\nIf you misspelled `command` as `commnd` then will give an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G1: passive voice &#x27;is merged&#x27;; name the actor\">is</mark> merged, this advice may need to <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G1: passive voice &#x27;be updated&#x27;; name the actor\">be</mark> updated --&gt;\n\nThe next thing to check is whether the pod on the apiserver\nmatches the pod you meant to create (<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. in a yaml file on your local machine).\nFor example, run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml` and then\nmanually compare the original pod description, `mypod.yaml` with the one you got\nback from apiserver, `mypod-on-apiserver.yaml`. There will typically be some\nlines on the &quot;apiserver&quot; version that are not on the original version. This is\nexpected. However, if there are lines on the original that are not on the apiserver\n<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">version</mark>, then this may indicate a problem with your pod spec.\n"}, "control": {"missing": false, "pass": false, "words": 534, "findings": [{"rule": "PSTE-G1", "message": "passive voice 'be scheduled'; name the actor", "excerpt": "A Pod stuck in  CODE     cannot be scheduled onto a node.", "line": 15, "column": 33, "excerpt_offset": 32, "offset": 340, "token": "be"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "Usually this means there aren't enough resources of some kind.", "line": 15, "column": 84, "excerpt_offset": 25, "offset": 391, "token": "aren't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "The  CODE                  output above should include scheduler messages explaining why.", "line": 15, "column": 162, "excerpt_offset": 40, "offset": 469, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "**You are using  CODE     **:", "line": 19, "column": 9, "excerpt_offset": 6, "offset": 774, "token": "are"}, {" ere been recent restarts?\n\nWhere you go next depends on the pod&#x27;s state.\n\n#### My pod stays pending\n\nA Pod stuck in `Pending` cannot <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;be scheduled&#x27;; name the actor\">be</mark> scheduled onto a node. Usually this means there <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> enough resources of some kind. The `kubectl describe ...` output above <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> include scheduler messages explaining why. Common reasons:\n\n* **Not enough resources**: Your cluster may be out of CPU or Memory. Delete Pods, adjust resource requests, or add nodes. See the [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/) for more.\n\n* **You <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using `hostPort`**: Binding a Pod to a `hostPort` limits where it can <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;be scheduled&#x27;; name the actor\">be</mark> scheduled. `hostPort` is usually unnecessary \u2014 try a Service object to expose your Pod instead. If you do need `hostPort`, you can only schedule as many Pods as you have nodes in the cluster.\n\n#### My pod stays waiting\n\nA Pod stuck in `Waiting` <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has been scheduled&#x27;; use simple past\">has</mark> <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;been scheduled&#x27;; name the actor\">been</mark> scheduled to a worker node but <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> run there. Again, `kubectl describe ...` <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> tell you why. The most common cause is a failed image pull. Check three things:\n\n* Is the image name correct?\n* Did you push the image to the registry?\n* Can you pull the image manually? For example, with Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nA Pod stuck in `Terminating` <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G4: perfect tense &#x27;has been marked&#x27;; use simple past\">has</mark> <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;been marked&#x27;; name the actor\">been</mark> marked for deletion, but the control plane <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> delete the Pod object.\n\n<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 32 words, limit 25\">This</mark> usually happens when the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) in the cluster stops the control plane from removing it.\n\nTo confirm, check whether your cluster has any ValidatingWebhookConfiguration or MutatingWebhookConfiguration targeting `UPDATE` operations for `pods` resources.\n\nIf a third party provides the webhook:\n- Use the latest version.\n- Disable the webhook for `UPDATE` operations.\n- Report an issue with the provider.\n\nIf you wrote the webhook:\n- Mutating webhook: never change immutable fields on `UPDATE` operations. Changes to containers, for example, are usually not allowed.\n- Validating webhook: apply validation policies only to new changes. Let Pods with existing violations pass, so Pods created before the webhook <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G1: passive voice &#x27;was installed&#x27;; name the actor\">was</mark> installed keep running.\n\n#### My pod is crashing or otherwise unhealthy\n\nOnce your pod <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G1: passive voice &#x27;is scheduled&#x27;; name the actor\">is</mark> scheduled, use the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/).\n\n#### My pod is running but not doing what I told it to do\n\nIf your pod <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> behaving as expected, your pod description (<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. the `mypod.yaml` file on your local machine) may contain an error that was silently ignored at creation time. Often a section <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G1: passive voice &#x27;is nested&#x27;; name the actor\">is</mark> nested incorrectly, or a key name <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G1: passive voice &#x27;is misspelled&#x27;; name the actor\">is</mark> misspelled and therefore ignored. For example, misspelling `command` as `commnd` creates the pod, but it <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> use <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N5: multi-word noun &#x27;command line you intended&#x27; over 3 words\">the</mark> command line you intended.\n\nFirst, delete your pod and recreate it with the `--validate` option <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, `kubectl apply --validate -f mypod.yaml`. With `command` misspelled as `commnd`, <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> get an error like this:\n\n```shell\nI0805 10:43:25.12985 "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "Next, check that the Pod on the apiserver matches the Pod you meant to create. The Pod you", "line": 64, "column": 475, "excerpt_offset": 0, "offset": 4776, "token": "But"}], "html": "### Debugging Pods\n\nTo debug a Pod, first look at it. Run this command to check the current state of the Pod and its recent events:\n\n```shell\nkubectl describe pods ${POD_NAME}\n```\n\nLook at the state of the containers in the Pod. Are they all `Running`? Did any container restart recently?\n\nThen continue to debug based on the state of the Pod.\n\n#### My pod stays pending\n\nIf a Pod stays in `Pending`, <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;scheduler cannot place it&#x27; over 3 words\">the</mark> scheduler cannot place it on a node. Usually the cluster does not have enough resources of one kind or another. Look at the output of the `kubectl describe ...` command above. The scheduler writes messages there about why it cannot schedule your Pod. The reasons include:\n\n* **You do not have enough resources**: You may <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G4: perfect tense &#x27;have used&#x27;; use simple past\">have</mark> used all the CPU or memory in your cluster. In this case you need to delete Pods, change the resource requests, or add new nodes to your cluster. For more information, see the [Compute Resources document](/docs/concepts/configuration/manage-resources-containers/).\n\n* **You use `hostPort`**: When you bind a Pod to a `hostPort`, the scheduler has few places to put that Pod. In most cases you do not need `hostPort`. Use a Service object to expose your Pod instead. If you do need `hostPort`, then you can schedule only as many Pods as there are nodes in your Kubernetes cluster.\n\n#### My pod stays waiting\n\nIf a Pod stays in the `Waiting` state, the scheduler placed it on a worker node, but it cannot run on that machine. Again, the output of `kubectl describe ...` tells you more. The most common cause of a `Waiting` Pod is that the node cannot pull the image. Check three things:\n\n* Make sure that the image name is correct.\n* Check that you pushed the image to the registry.\n* Pull the image by hand to see if the pull works. For example, if you use Docker on your PC, run `docker pull &lt;image&gt;`.\n\n#### My pod stays terminating\n\nIf a Pod stays in the `Terminating` state, someone deleted the Pod, but the control plane cannot remove the Pod object.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 33 words, limit 25\">This</mark> normally happens when the Pod has a [finalizer](/docs/concepts/overview/working-with-objects/finalizers/) and an [admission webhook](/docs/reference/access-authn-authz/extensible-admission-controllers/) in the cluster stops the control plane from removing that finalizer.\n\nTo find this case, check if your cluster has a ValidatingWebhookConfiguration or a MutatingWebhookConfiguration that targets `UPDATE` operations for `pods` resources.\n\nIf a third party gives you the webhook:\n- Make sure that you use the latest version.\n- <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;turn off&#x27;; use &#x27;disable&#x27;\">Turn</mark> off the webhook for `UPDATE` operations.\n- Report an issue to that provider.\n\nIf you wrote the webhook:\n- For a mutating webhook, make sure it never changes immutable fields on `UPDATE` operations. For example, the API usually does not allow changes to containers.\n- For a validating webhook, make sure that your validation policies apply only to new changes. That is, you must let Pods with existing violations pass validation. Pods that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;were created&#x27;; name the actor\">were</mark> created before you installed the validating webhook then continue to run.\n\n#### My pod is crashing or otherwise unhealthy\n\nAfter the scheduler places your Pod, you can debug it with the methods in [Debug Running Pods](/docs/tasks/debug/debug-application/debug-running-pod/).\n\n#### My pod is running but not doing what I told it to do\n\nIf your Pod does not behave as you expected, your Pod description may hold an error. For example, the error may be in the `mypod.yaml` file on your local machine. Kubernetes can ignore such an error without a message when you create the Pod. Often one section of the Pod description <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;is nested&#x27;; name the actor\">is</mark> nested wrongly, or a key name <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;is typed&#x27;; name the actor\">is</mark> typed wrongly, so the API ignores the key. For example, if you type `command` as `commnd`, Kubernetes creates the Pod, but the Pod does not use the command line that you intended.\n\nFirst, delete your Pod and create it again with the `--validate` option. For example, run `kubectl apply --validate -f mypod.yaml`. If you typed `command` as `commnd`, this gives an error like this:\n\n```shell\nI0805 10:43:25.129850   46757 schema.go:126] unknown field: commnd\nI0805 10:43:25.129973   46757 schema.go:129] this may be a false alarm, see https://github.com/kubernetes/kubernetes/issues/6842\npods/mypod\n```\n\n&lt;!-- TODO: Now that #11914 <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;is merged&#x27;; name the actor\">is</mark> merged, this advice may need to <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;be updated&#x27;; name the actor\">be</mark> updated --&gt;\n\nNext, check that the Pod on the apiserver matches the Pod you meant to create. The Pod you meant to create is the one in the yaml file on your local machine. For example, run `kubectl get pods/mypod -o yaml &gt; mypod-on-apiserver.yaml`. Then compare the original Pod description, `mypod.yaml`, with <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N5: multi-word noun &#x27;one you got back&#x27; over 3 words\">the</mark> one you got back from the apiserver, `mypod-on-apiserver.yaml`. The &quot;apiserver&quot; version normally holds some lines that the original version does not hold. This <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;is expected&#x27;; name the actor\">is</mark> expected. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">But</mark> if the original holds lines that the apiserver version does not hold, then your Pod spec may hold a problem."}}}, "troubleshoot-etcd-failures": {"category": "documentation", "title": "etcd failure modes", "prompt": "", "attribution": "Rewritten from \"etcd failure modes\" by The etcd Authors, used under CC-BY-4.0. Source: https://raw.githubusercontent.com/etcd-io/website/main/content/en/docs/v3.5/op-guide/failures.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/etcd-io/website/main/content/en/docs/v3.5/op-guide/failures.md", "author": "The etcd Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 660, "findings": [{"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "Failures are common in a large deployment of machines.", "line": 7, "column": 32, "excerpt_offset": 31, "offset": 135, "token": "deployment"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Multiple kinds of failures can also happen at once; it is almost impossible to enumerate a", "line": 7, "column": 247, "excerpt_offset": 50, "offset": 350, "token": ";"}, {"rule": "PSTE-G1", "message": "passive voice 'is designed'; name the actor", "excerpt": "In this section, we catalog kinds of failures and discuss how etcd is designed to tolerate", "line": 9, "column": 68, "excerpt_offset": 67, "offset": 485, "token": "is"}, {"rule": "PSTE-N5", "message": "multi-word noun 'five member etcd cluster' over 3 words", "excerpt": "For example, two follower failures will not affect a five member etcd cluster\u2019s operation.", "line": 13, "column": 187, "excerpt_offset": 51, "offset": 926, "token": "a"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Client libraries should hide these interruptions from users for read requests by automatic", "line": 13, "column": 307, "excerpt_offset": 17, "offset": 1046, "token": "should"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "Operators should expect the system load on the other members to increase due to the reconn", "line": 13, "column": 426, "excerpt_offset": 10, "offset": 1165, "token": "should"}, {"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster automatically elects' over 3 words", "excerpt": "When a leader fails, the etcd cluster automatically elects a new leader.", "line": 17, "column": 22, "excerpt_offset": 21, "offset": 1295, "token": "the"}, {"rule": "PSTE-G1", "message": "passive voice 'are queued'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 107, "excerpt_offset": 40, "offset": 1625, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'is elected'; name the actor", "excerpt": "Write requests sent during the election are queued for processing until a new leader is el", "line": 19, "column": 152, "excerpt_offset": 85, "offset": 1670, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'be lost'; name the actor", "excerpt": "Writes already sent to the old leader but not yet committed may be lost.", "line": 21, "column": 65, "excerpt_offset": 64, "offset": 1747, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'was granted'; name the actor", "excerpt": "This mechanism ensures a lease will not expire before the granted TTL even if it was grant", "line": 23, "column": 144, "excerpt_offset": 81, "offset": 2125, "token": "was"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "A network partition divides the etcd cluster into two parts; one with a member majority an", "line": 35, "column": 141, "excerpt_offset": 59, "offset": 2941, "token": ";"}, {"rule": "PSTE-G1", "message": "passive voice 'is approved'; name the actor", "excerpt": "There is no \u201csplit-brain\u201d in etcd because cluster members are explicitly added/removed wit", "line": 35, "column": 403, "excerpt_offset": 109, "offset": 3203, "token": "is"}, {"rule": "PSTE-N5", "message": "multi-word noun 'minority side automatically recognizes' over 3 words", "excerpt": "Once the network partition clears, the minority side automatically recognizes the leader f", "line": 39, "column": 36, "excerpt_offset": 35, "offset": 3562, "token": "the"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd's tolerance ", "line": 48, "column": 18, "excerpt_offset": 0, "offset": 4254, "token": "."}], "html": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures are common in a large <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A machine fails when its hardware or software malfunctions. Multiple machines fail together when there are power failures or network issues. Multiple kinds of failures can also happen at once<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> it is almost impossible to enumerate all possible failure cases.\n\nIn this section, we catalog kinds of failures and discuss how etcd <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;is designed&#x27;; name the actor\">is</mark> designed to tolerate these failures. Most users, if not all, can map a particular failure into one kind of failure. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nWhen fewer than half of the followers fail, the etcd cluster can still accept requests and make progress without any major disruption. For example, two follower failures will not affect <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster\u2019s operation. However, clients will lose connectivity to the failed members. Client libraries <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users for read requests by automatically reconnecting to other members. Operators <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect the system load on the other members to increase due to the reconnections.\n\n## Leader failure\n\nWhen a leader fails, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster automatically elects&#x27; over 3 words\">the</mark> etcd cluster automatically elects a new leader. The election does not happen instantly once the leader fails. It takes about an election timeout to elect a new leader since the failure detection model is timeout based.\n\nDuring the leader election the cluster cannot process any writes. Write requests sent during the election <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued for processing until a new leader <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\nWrites already sent to the old leader but not yet committed may <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;be lost&#x27;; name the actor\">be</mark> lost. The new leader has the power to rewrite any uncommitted entries from the previous leader. From the user perspective, some write requests might time out after a new leader election. However, no committed writes are ever lost.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before the granted TTL even if it <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;was granted&#x27;; name the actor\">was</mark> granted by the old leader.\n\n## Majority failure\n\nWhen the majority members of the cluster fail, the etcd cluster fails and cannot accept more writes.\n\nThe etcd cluster can only recover from a majority failure once the majority of members become available. If a majority of members cannot come back online, then the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires due to server side unavailability.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one with a member majority and the other with a member minority. The majority side becomes the available cluster and the minority side is unavailable. There is no \u201csplit-brain\u201d in etcd because cluster members are explicitly added/removed with each such change <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G1: passive voice &#x27;is approved&#x27;; name the actor\">is</mark> approved by the current majority of members.\n\nIf the leader is on the majority side, then from the majority point of view the failure is a minority follower failure. If the leader is on the minority side, then it is a leader failure. The leader on the minority side steps down and the majority side elects a new leader.\n\nOnce the network partition clears, <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;minority side automatically recognizes&#x27; over 3 words\">the</mark> minority side automatically recognizes the leader from the majority side and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap is only successful if all required members successfully start. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nOf course, it is possible to recover a failed bootstrapped cluster like recovering a running cluster. However, it almost always takes more time and resources to recover that cluster than bootstrapping a new one, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">.</mark>./recovery/\n"}, "control": {"missing": false, "pass": false, "words": 625, "findings": [{"rule": "PSTE-G7", "message": "nominalization 'deployment of'; use a verb", "excerpt": "Failures happen all the time in a large deployment of machines.", "line": 7, "column": 41, "excerpt_offset": 40, "offset": 144, "token": "deployment"}, {"rule": "PSTE-G1", "message": "passive voice 'is designed'; name the actor", "excerpt": "This section catalogs kinds of failures and explains how etcd is  "excerpt_offset": 0, "offset": 4112, "token": "."}], "html": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nFailures happen all the time in a large <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of machines. A single machine fails when its hardware or software malfunctions. Several machines fail together during power outages or network issues. Different kinds of failures can also strike at once, so listing every possible failure case is nearly impossible.\n\nThis section catalogs kinds of failures and explains how etcd <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;is designed&#x27;; name the actor\">is</mark> designed to tolerate them. Most users, if not all, can map <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;particular failure onto one&#x27; over 3 words\">a</mark> particular failure onto one of these kinds. To prepare for rare or [unrecoverable failures][unrecoverable], always [back up][backup] the etcd cluster.\n\n## Minor followers failure\n\nIf fewer than half of the followers fail, <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without major disruption. For example, two follower failures will not affect <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;five member etcd cluster&#x27; over 3 words\">a</mark> five member etcd cluster&#x27;s operation. Clients do lose connectivity to the failed members. For read requests, client libraries <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> hide these interruptions from users by reconnecting to other members automatically. Operators <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> expect system load on the remaining members to rise because of those reconnections.\n\n## Leader failure\n\nWhen a leader fails, the etcd cluster elects a new leader automatically. The election does not start the instant the leader fails: because failure detection is timeout based, electing a new leader takes about one election timeout.\n\nThe cluster cannot process any writes during the leader election. Write requests sent during the election <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;are queued&#x27;; name the actor\">are</mark> queued until a new leader <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;is elected&#x27;; name the actor\">is</mark> elected.\n\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 30 words, limit 25\">Writes</mark> already sent to the old leader but not yet committed may <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;be lost&#x27;; name the actor\">be</mark> lost, because the new leader has the power to rewrite any uncommitted entries from the previous leader. From the user&#x27;s perspective, some write requests might time out after a new leader election. No committed writes are ever lost, however.\n\nThe new leader extends timeouts automatically for all leases. This mechanism ensures a lease will not expire before its granted TTL, even if <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;old leader granted it&#x27; over 3 words\">the</mark> old leader granted it.\n\n## Majority failure\n\nWhen the majority of the cluster&#x27;s members fail, the etcd cluster fails and stops accepting writes.\n\nThe etcd cluster can only recover from a majority failure once the majority of members become available again. If a majority cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nOnce a majority of members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends timeouts automatically for all leases. This mechanism ensures no lease expires because of server side unavailability.\n\n## Network partition\n\nA network partition resembles either a minor followers failure or a leader failure. The partition splits the etcd cluster into two parts: one holding a majority of members, the other a minority. The majority side becomes the available cluster<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the minority side is unavailable. etcd has no &quot;split-brain&quot;, because cluster members <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G1: passive voice &#x27;are added&#x27;; name the actor\">are</mark> added and removed explicitly and each such change <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G1: passive voice &#x27;is approved&#x27;; name the actor\">is</mark> approved by the current majority of members.\n\nIf the leader sits on the majority side, the majority sees the failure as a minority follower failure. If the leader sits on the minority side, it is a leader failure: the leader on the minority side steps down, and the majority side elects a new leader.\n\nOnce the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap succeeds only if all required members start successfully. If any failure happens during bootstrapping, remove the data directories on all members and re-bootstrap the cluster with a new cluster-token or new discovery token.\n\nA failed bootstrapped cluster can of course <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G1: passive voice &#x27;be recovered&#x27;; name the actor\">be</mark> recovered like a running one. But recovering it almost always takes more time and resources than bootstrapping a new cluster, since there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">.</mark>./recovery/"}, "pste": {"missing": false, "pass": false, "words": 667, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'etcd cluster still accepts' over 3 words", "excerpt": "If fewer than half of the followers fail, the etcd cluster still accepts requests and make", "line": 13, "column": 43, "excerpt_offset": 42, "offset": 705, "token": "the"}, {"rule": "PSTE-G7", "message": "nominalization 'operation of'; use a verb", "excerpt": "For example, two follower failures do not affect the operation of a five member etcd clust", "line": 13, "column": 181, "excerpt_offset": 53, "offset": 843, "token": "operation"}, {"rule": "PSTE-G7", "message": "nominalization 'election of'; use a verb", "excerpt": "The election of a new leader takes about one election timeout, because the failure detecti", "line": 17, "column": 133, "excerpt_offset": 4, "offset": 1322, "token": "election"}, {"rule": "PSTE-G7", "message": "nominalization 'election of'; use a verb", "excerpt": "From the point of view of the user, some write requests can time out after the election of", "line": 21, "column": 243, "excerpt_offset": 79, "offset": 1860, "token": "election"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd's tolerance ", "line": 48, "column": 18, "excerpt_offset": 0, "offset": 4224, "token": "."}], "html": "---\ntitle: Failure modes\nweight: 4250\ndescription: Kinds of failures and etcd&#x27;s tolerance for them\n---\n\nMachines fail often in a large deployment. A machine fails when its hardware or software malfunctions. Several machines fail together when a power failure or a network problem happens. Several kinds of failure can also happen at once. Nobody can list every possible failure case.\n\nThis section lists kinds of failure. It explains how etcd tolerates each kind. Most users can map a particular failure to one kind of failure. Always [back up][backup] the etcd cluster to prepare for rare or [unrecoverable failures][unrecoverable].\n\n## Minor followers failure\n\nIf fewer than half of the followers fail, <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;etcd cluster still accepts&#x27; over 3 words\">the</mark> etcd cluster still accepts requests and makes progress without major disruption. For example, two follower failures do not affect the <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G7: nominalization &#x27;operation of&#x27;; use a verb\">operation</mark> of a five member etcd cluster. But the clients lose their connection to the failed members. For read requests, the client library must hide these interruptions from the user and reconnect to other members automatically. Operators must expect the system load on the other members to rise because of the reconnections.\n\n## Leader failure\n\nIf a leader fails, the etcd cluster elects a new leader automatically. The election does not start the moment the leader fails. The <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;election of&#x27;; use a verb\">election</mark> of a new leader takes about one election timeout, because the failure detection model uses timeouts.\n\nThe cluster processes no writes during the leader election. The cluster queues the write requests that it receives during the election. It processes them after it elects a new leader.\n\nThe cluster can lose the writes that reached the old leader but that it did not commit. The new leader can rewrite any uncommitted entry from the previous leader. From the point of view of the user, some write requests can time out after the <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G7: nominalization &#x27;election of&#x27;; use a verb\">election</mark> of a new leader. But the cluster never loses a committed write.\n\nThe new leader extends the timeouts for all leases automatically. This mechanism makes sure that a lease does not expire before the granted TTL, even if the old leader granted the lease.\n\n## Majority failure\n\nIf the majority of the cluster members fail, the etcd cluster fails and accepts no more writes.\n\nThe etcd cluster recovers from a majority failure only after the majority of the members become available. If a majority of the members cannot come back online, the operator must start [disaster recovery][unrecoverable] to recover the cluster.\n\nAfter a majority of the members works, the etcd cluster elects a new leader automatically and returns to a healthy state. The new leader extends the timeouts for all leases automatically. This mechanism makes sure that no lease expires because the server side was unavailable.\n\n## Network partition\n\nA network partition is similar to a minor followers failure or a leader failure. A network partition divides the etcd cluster into two parts. One part holds a majority of the members. The other part holds a minority of the members. The majority side becomes the available cluster, and the minority side is unavailable. etcd has no &quot;split-brain&quot;, because an operator adds and removes cluster members explicitly, and the current majority of the members approves each such change.\n\nIf the leader is on the majority side, the majority side sees the failure as a minority follower failure. If the leader is on the minority side, the failure is a leader failure. The leader on the minority side steps down, and the majority side elects a new leader.\n\nAfter the network partition clears, the minority side recognizes the leader from the majority side automatically and recovers its state.\n\n## Failure during bootstrapping\n\nA cluster bootstrap succeeds only if all required members start. If any failure happens during bootstrapping, remove the data directories on all members. Then bootstrap the cluster again with a new cluster-token or a new discovery token.\n\nYou can recover a failed bootstrapped cluster in the same way that you recover a running cluster. But this recovery almost always takes more time and more resources than a new bootstrap, because there is no data to recover.\n\n[backup]: ../maintenance/#snapshot-backup\n[unrecoverable]: <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">.</mark>./recovery/"}}}, "migration-etcd-3-5": {"category": "migration guide", "title": "Upgrade etcd from 3.4 to 3.5", "prompt": "", "attribution": "Rewritten from \"Upgrade etcd from 3.4 to 3.5\" by The etcd Authors, used under CC-BY-4.0. Source: https://raw.githubusercontent.com/etcd-io/website/main/content/en/docs/v3.5/upgrades/upgrade_3_5.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/etcd-io/website/main/content/en/docs/v3.5/upgrades/upgrade_3_5.md", "author": "The etcd Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 389, "findings": [{"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If it's before 3.4, please [upgrade to 3.4](../upgrade_3_3/) before upgrading to 3.5.", "line": 5, "column": 95, "excerpt_offset": 3, "offset": 152, "token": "it's"}, {"rule": "PSTE-G1", "message": "passive voice 'are upgraded'; name the actor", "excerpt": "The cluster is only considered upgraded once all of its members are upgraded to version 3.", "line": 17, "column": 200, "excerpt_offset": 64, "offset": 1194, "token": "are"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "If the cluster is serving a
