message": "description is 35 words, limit 25", "excerpt": "If any single member is still v3.4, however, the cluster and its operations remains \"v3.4\"", "line": 29, "column": 143, "excerpt_offset": 0, "offset": 2243, "token": "If"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an existing etcd deployment to 3.5, the running cluster must be 3.4 or greater. If <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> before 3.4, please [upgrade to 3.4](../upgrade_3_3/) before upgrading to 3.5.\n\nAlso, to ensure a smooth rolling upgrade, the running cluster must be healthy. Check the health of the cluster by using the `etcdctl endpoint health` command before proceeding.\n\n#### Preparation\n\nBefore upgrading etcd, always test the services relying on etcd in a staging environment before deploying the upgrade to the production environment.\n\nBefore beginning, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). Should something go wrong with the upgrade, it is possible to use this backup to [downgrade](#downgrade) back to existing etcd version. Please note that the `snapshot` command only backs up the v3 data. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nWhile upgrading, an etcd cluster supports mixed versions of etcd members, and operates with the protocol of the lowest common version. The cluster is only considered upgraded once all of its members <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;are upgraded&#x27;; name the actor\">are</mark> upgraded to version 3.5. Internally, etcd members negotiate with each other to determine the overall cluster version, which controls the reported version and the supported features.\n\n#### Limitations\n\nNote: If the cluster only has v3 data and no v2 data, it is not subject to this limitation.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 29 words, limit 25\">If</mark> the cluster <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is serving&#x27;\">is</mark> serving a v2 data set larger than 50MB, each newly upgraded member may take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. In other words, it is safest to wait for 2 minutes between upgrading each member.\n\nFor <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more , this one-time process might take even more time. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 30 words, limit 25\">Administrators</mark> of very large etcd clusters of this magnitude can feel free to contact the [etcd team][etcd-contact] before upgrading, and <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;we&#x27;ll&#x27;\">we&#x27;ll</mark> be happy to provide advice on the procedure.\n\n#### Downgrade\n\nIf all members <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G4: perfect tense &#x27;have been upgraded&#x27;; use simple past\">have</mark> <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;been upgraded&#x27;; name the actor\">been</mark> upgraded to v3.5, the cluster will <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;be upgraded&#x27;; name the actor\">be</mark> upgraded to v3.5, and downgrade from this completed state is **not possible**. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 35 words, limit 25\">If</mark> any single member is still v3.4, however, the cluster and its operations remains &quot;v3.4&quot;, and it is possible from this mixed cluster state to return to using a v3.4 etcd binary on all members.\n\nPlease [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) to make downgrading the cluster possible even after it has been completely upgraded.\n"}, "control": {"missing": false, "pass": false, "words": 345, "findings": [{"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "If the cluster serves a v2 data set larger than 50MB, each newly upgraded member may take ", "line": 23, "column": 1, "excerpt_offset": 0, "offset": 1321, "token": "If"}, {"rule": "PSTE-N5", "message": "multi-word noun 'much larger total data size' over 3 words", "excerpt": "For a much larger total data size, 100MB or more, this one-time process may take even long", "line": 25, "column": 5, "excerpt_offset": 4, "offset": 1607, "token": "a"}, {"rule": "PSTE-N3", "message": "contraction 'we'll'", "excerpt": "Administrators of etcd clusters this large are welcome to contact the [etcd team][etcd-con", "line": 25, "column": 213, "excerpt_offset": 118, "offset": 1815, "token": "we'll"}, {"rule": "PSTE-G1", "message": "passive voice 'is upgraded'; name the actor", "excerpt": "Once all members are on v3.5, the cluster is upgraded to v3.5, and downgrading from that c", "line": 29, "column": 43, "excerpt_offset": 42, "offset": 1917, "token": "is"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "But if even one member is still v3.4, the cluster and its operations remain \"v3.4\", and fr", "line": 29, "column": 127, "excerpt_offset": 0, "offset": 2001, "token": "But"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an existing etcd deployment to 3.5, the running cluster must be 3.4 or greater. If it is older than 3.4, [upgrade to 3.4](../upgrade_3_3/) first.\n\nThe running cluster must also be healthy, so the rolling upgrade goes smoothly. Run `etcdctl endpoint health` to check cluster health before proceeding.\n\n#### Preparation\n\nAlways test the services that rely on etcd in a staging environment before deploying the upgrade to production.\n\nBefore starting, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). If the upgrade goes wrong, this backup lets you [downgrade](#downgrade) to the existing etcd version. Note that the `snapshot` command backs up only v3 data. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nDuring an upgrade, an etcd cluster supports members running mixed versions and operates with the protocol of the lowest common version. The cluster counts as upgraded only once every member is on version 3.5. Members negotiate with each other to determine the overall cluster version, which controls the reported version and the supported features.\n\n#### Limitations\n\nNote: a cluster with only v3 data and no v2 data is not subject to this limitation.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 28 words, limit 25\">If</mark> the cluster serves a v2 data set larger than 50MB, each newly upgraded member may take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. So it is safest to wait 2 minutes between upgrading each member.\n\nFor <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more, this one-time process may take even longer. Administrators of etcd clusters this large are welcome to contact the [etcd team][etcd-contact] before upgrading, and <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;we&#x27;ll&#x27;\">we&#x27;ll</mark> be happy to advise on the procedure.\n\n#### Downgrade\n\nOnce all members are on v3.5, the cluster <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;is upgraded&#x27;; name the actor\">is</mark> upgraded to v3.5, and downgrading from that completed state is **not possible**. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 31 words, limit 25\">But</mark> if even one member is still v3.4, the cluster and its operations remain &quot;v3.4&quot;, and from this mixed state you can return to a v3.4 etcd binary on all members.\n\n[Download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) so that downgrading stays possible even after the cluster is fully upgraded."}, "pste": {"missing": false, "pass": false, "words": 359, "findings": [{"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "If the cluster serves a v2 data set larger than 50MB, each newly upgraded member can take ", "line": 23, "column": 1, "excerpt_offset": 0, "offset": 1391, "token": "If"}, {"rule": "PSTE-N5", "message": "multi-word noun 'much larger total data size' over 3 words", "excerpt": "For a much larger total data size, 100MB or more, this one-time process can take even long", "line": 25, "column": 5, "excerpt_offset": 4, "offset": 1679, "token": "a"}, {"rule": "PSTE-G1", "message": "passive voice 'is upgraded'; name the actor", "excerpt": "After every member reaches v3.5, the cluster is upgraded to v3.5, and a downgrade from thi", "line": 29, "column": 46, "excerpt_offset": 45, "offset": 1989, "token": "is"}], "html": "### Server upgrade checklists\n\n#### Upgrade requirements\n\nTo upgrade an etcd deployment to 3.5, the running cluster must be 3.4 or later. If the cluster is before 3.4, [upgrade to 3.4](../upgrade_3_3/) first.\n\nThe running cluster must also be healthy for a smooth rolling upgrade. Run the `etcdctl endpoint health` command to check the health of the cluster before you continue.\n\n#### Preparation\n\nBefore you upgrade etcd, always test the services that depend on etcd in a staging environment. Then deploy the upgrade to the production environment.\n\nBefore you start, [download the snapshot backup](../../op-guide/maintenance/#snapshot-backup). If the upgrade goes wrong, you can use this backup to [downgrade](#downgrade) to the existing etcd version. The `snapshot` command backs up the v3 data only. For v2 data, see [backing up v2 datastore](/docs/v2.3/admin_guide#backing-up-the-datastore).\n\n#### Mixed versions\n\nDuring an upgrade, an etcd cluster supports members with mixed versions. The cluster operates with the protocol of the lowest common version. The cluster counts as upgraded only after every member reaches version 3.5. The members negotiate with each other to determine the overall cluster version. This version controls the reported version and the supported features.\n\n#### Limitations\n\nThis limitation does not apply to a cluster that holds v3 data only and no v2 data.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 28 words, limit 25\">If</mark> the cluster serves a v2 data set larger than 50MB, each newly upgraded member can take up to two minutes to catch up with the existing cluster. Check the size of a recent snapshot to estimate the total data size. It is safest to wait 2 minutes between the upgrade of each member.\n\nFor <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;much larger total data size&#x27; over 3 words\">a</mark> much larger total data size, 100MB or more, this one-time process can take even longer. If you administer an etcd cluster of this size, you may contact the [etcd team][etcd-contact] before you upgrade. The team will give advice on the procedure.\n\n#### Downgrade\n\nAfter every member reaches v3.5, the cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;is upgraded&#x27;; name the actor\">is</mark> upgraded to v3.5, and a downgrade from this state is **not possible**. If any single member is still v3.4, the cluster and its operations remain &quot;v3.4&quot;. From this mixed state, you can return to a v3.4 etcd binary on every member.\n\n[Download the snapshot backup](../../op-guide/maintenance/#snapshot-backup) to make a downgrade possible even after the cluster is completely upgraded."}}}, "troubleshoot-gopls": {"category": "documentation", "title": "Gopls: Troubleshooting", "prompt": "", "attribution": "Rewritten from \"Gopls: Troubleshooting\" by The Go Authors, used under BSD-3-Clause. Source: https://raw.githubusercontent.com/golang/tools/master/gopls/doc/troubleshooting.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/golang/tools/master/gopls/doc/troubleshooting.md", "author": "The Go Authors", "licence": "BSD-3-Clause", "licenceUrl": "https://opensource.org/licenses/BSD-3-Clause", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 647, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'is crashing'", "excerpt": "If you suspect that  CODE   is crashing or not working correctly, please follow the troubl", "line": 5, "column": 29, "excerpt_offset": 28, "offset": 69, "token": "is"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'is using'", "excerpt": "If  CODE   is using too much memory, please follow the steps under [Memory usage](#debug-m", "line": 7, "column": 12, "excerpt_offset": 11, "offset": 166, "token": "is"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "VS Code users should follow [their troubleshooting guide]( URL                            ", "line": 11, "column": 15, "excerpt_offset": 14, "offset": 284, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "Check that your editor isn't showing any diagnostics that indicate a problem with your wor", "line": 14, "column": 27, "excerpt_offset": 23, "offset": 757, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'won't'", "excerpt": "good, because you can keep working, and bad, because you won't be able to debug the issue ", "line": 21, "column": 159, "exc offset": 2581, "token": "can't"}, {"rule": "PSTE-G4", "message": "perfect tense 'have configured'; use simple past", "excerpt": "Your editor and any settings you have configured (for example, your VSCode  CODE          ", "line": 33, "column": 37, "excerpt_offset": 33, "offset": 2755, "token": "have"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "It should have a  CODE                           log line near the beginning.", "line": 36, "column": 74, "excerpt_offset": 3, "offset": 3007, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'It's'", "excerpt": "It's also helpful to tell us the timestamp the problem occurred, so we can find it the log", "line": 36, "column": 149, "excerpt_offset": 0, "offset": 3082, "token": "It's"}, {"rule": "PSTE-G1", "message": "passive voice 'be found'; name the actor", "excerpt": "This information can be found in your temporary directory with names like  CODE           ", "line": 50, "column": 109, "excerpt_offset": 21, "offset": 4193, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'be located'; name the actor", "excerpt": "On Windows, your temporary directory will be located at  CODE  , and on Unixes, it will be", "line": 50, "column": 237, "excerpt_offset": 42, "offset": 4321, "token": "be"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If you are uncomfortable sharing the package names of your code, you can share the  CODE  ", "line": 50, "column": 517, "excerpt_offset": 111, "offset": 4601, "token": "it's"}], "html": "---\ntitle: &quot;Gopls: Troubleshooting&quot;\n---\n\nIf you suspect that `gopls` <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is crashing&#x27;\">is</mark> crashing or not working correctly, please follow the troubleshooting steps below.\n\nIf `gopls` <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;is using&#x27;\">is</mark> using too much memory, please follow the steps under [Memory usage](#debug-memory-usage).\n\n## Steps\n\nVS Code users <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> follow [their troubleshooting guide](https://github.com/golang/vscode-go/blob/master/docs/troubleshooting.md), which has more a more specific version of these instructions.\n\n1. Verify that your project is in good shape by working with it outside of your editor. Running a command like `go build ./...` in the workspace directory will compile everything. For modules, `go mod tidy` is another good check, though it may modify your `go.mod`.\n1. Check that your editor <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> showing any diagnostics that indicate a problem with your workspace. They may appear as diagnostics on a Go file&#x27;s package declaration, diagnostics in a go.mod file, or as a status or progress message. Problems in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date by following the [installation instructions](index.md#installation), then [restarting gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` has no persistent state, so restarting it will fix transient problems. This is good and bad: good, because you can keep working, and bad, because you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> be able to debug the issue until it recurs.\n\nIn most cases, closing all your open editors will guarantee that `gopls` <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;is killed&#x27;; name the actor\">is</mark> killed and restarted. If you <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> want to do that, there may be an editor command you can use to restart only `gopls`. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N1: instruction is 25 words, limit 20\">Note</mark> that some `vim` configurations keep the server alive for a while after the editor exits<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> you may need to explicitly kill `gopls` if you use `vim`.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS) that can help debug further. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 42 words, limit 25\">If</mark> <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident the problem is with `gopls`, you can go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come prepared with a short <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to be available to answer questions for a while afterward.\n\n## File an issue\n\nWe <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> diagnose a problem from just a description. When filing an issue, please include as much as possible of the following information:\n\n1. Your editor and any settings you <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G4: perfect tense &#x27;have configured&#x27;; use simple past\">have</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;It&#x27;s&#x27;\">It&#x27;s</mark> also helpful to tell us the timestamp the problem occurred, so we can find it the log. See the [instructions](#capture-logs) for information on how to capture gopls logs.\n\nYour editor may have a command that fills out some of the necessary information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nTo increase the level of detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that will allow you to see profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You will then be able to view debug information by navigating to `localhost:6060`.\n\nIf you are unsure of how to pass a flag to `gopls` through your editor, please see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` automatically writes out memory debug information when your usage exceeds 1GB. This information can <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G1: passive voice &#x27;be found&#x27;; name the actor\">be</mark> found in your temporary directory with names like `gopls.1234-5GiB-withnames.zip`. On Windows, your temporary directory will <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G1: passive voice &#x27;be located&#x27;; name the actor\">be</mark> located at `%TMP%`, and on Unixes, it will be `$TMPDIR`, which is usually `/tmp`. Please [file an issue](#file-an-issue) with this memory debug information attached. If you are uncomfortable sharing the package names of your code, you can share the `-nonames` zip instead, but <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful.\n"}, "control": {"missing": false, "pass": false, "words": 544, "findings": [{"rule": "PSTE-G6", "message": "'-ing' main verb 'is crashing'", "excerpt": "If you think  CODE   is crashing or misbehaving, work through the steps below.", "line": 5, "column": 22, "excerpt_offset": 21, "offset": 62, "token": "is"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'is using'", "excerpt": "If  CODE   is using too much memory, skip to [Memory usage](#debug-memory-usage).", "line": 7, "column": 12, "excerpt_offset": 11, "offset": 132, "token": "is"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "VS Code users should follow [their troubleshooting guide]( URL                            ", "line": 11, "column": 15, "excerpt_offset": 14, "offset": 228, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'can't'", "excerpt": "you can keep working, but you can't debug the issue until it happens again.", "line": 21, "column": 127, "excerpt_offset": 30, "offset": 1315, "token": "can't"}, {"rule": "PSTE-N1", "message": "instruction is 23 words, limit 20", "excerpt": "Note that some       configurations keep the server alive for a while after the editor exi", "line": 23, "column": 150, "excerpt_offset": 0, "offset": 1511, "token": "Note"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Note that some       configurations keep the server alive for a while after the editor exi", "line": 23, "column": 242, "excerpt_of contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> sure the problem is with `gopls`, go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Bring a short <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue, and try to stay available to answer questions afterward.\n\n## File an issue\n\nWe <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> diagnose a problem from a description alone. When filing an issue, include as much of the following as you can:\n\n1. Your editor and any settings <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> configured (for example, your VSCode `settings.json` file).\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue occurred. It <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. Telling us the timestamp of the problem also helps us find it in the log. See the [instructions](#capture-logs) for how to capture gopls logs.\n\nYour editor may have a command that fills in some of this information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor&#x27;s configuration to pass a `-logfile` flag to gopls.\n\nFor more detail in your logs, start `gopls` with the `-rpc.trace` flag. To start <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;debug server showing profiles&#x27; over 3 words\">a</mark> debug server showing profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`, then view the debug information at `localhost:6060`.\n\nIf <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> unsure how to pass a flag to `gopls` through your editor, see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\nWhen usage exceeds 1GB, `gopls` automatically writes out memory debug information. Look in your temporary directory for files named like `gopls.1234-5GiB-withnames.zip`. On Windows the temporary directory is `%TMP%`<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> on Unixes <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> `$TMPDIR`, usually `/tmp`. Please [file an issue](#file-an-issue) with this memory debug information attached. If you&#x27;d rather not share the package names of your code, share the `-nonames` zip instead, but <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> much less useful."}, "pste": {"missing": false, "pass": false, "words": 621, "findings": [{"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "VS Code users should follow [their troubleshooting guide]( URL                            ", "line": 11, "column": 15, "excerpt_offset": 14, "offset": 251, "token": "should"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "These can appear as diagnostics on the package declaration of a Go file, as diagnostics in", "line": 14, "column": 93, "excerpt_offset": 0, "offset": 766, "token": "These"}, {"rule": "PSTE-G7", "message": "nominalization 'declaration of'; use a verb", "excerpt": "These can appear as diagnosti , but it can change your `go.mod`.\n1. Check that your editor shows no diagnostics that point to a problem with your workspace. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 27 words, limit 25\">These</mark> can appear as diagnostics on the package <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G7: nominalization &#x27;declaration of&#x27;; use a verb\">declaration</mark> of a Go file, as diagnostics in a go.mod file, or as a status or progress message. A problem in the workspace configuration can cause many different symptoms. See the [workspace setup instructions](workspace.md) for help.\n1. Make sure `gopls` is up to date. Follow the [installation instructions](index.md#installation), then [restart gopls](#restart-gopls).\n1. Optionally, [ask for help](#ask-for-help) on Gophers Slack.\n1. Finally, [report the issue](#file-an-issue) to the `gopls` developers.\n\n## Restart `gopls`\n\n`gopls` keeps no persistent state, so a restart fixes a transient problem. This is good and bad. It is good because you can keep working. It is bad because you cannot debug the issue until it happens again.\n\nIn most cases, closing all your open editors kills and restarts `gopls`. If you do not want to do that, your editor may have a command that restarts only `gopls`. Note that some `vim` configurations keep the server alive for a while after the editor exits. If you use `vim`, you may need to kill `gopls` yourself.\n\n## Ask for help\n\nGophers Slack has active editor-specific channels like [#emacs](https://gophers.slack.com/archives/C0HKHULEM), [#vim](https://gophers.slack.com/archives/C07GBR52P), and [#vscode](https://gophers.slack.com/archives/C2B4L99RS). They can help you debug further. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">If</mark> you are confident the problem is in `gopls`, go straight to [#gopls](https://gophers.slack.com/archives/CJZH85XCZ). Invites are [available to everyone](https://invite.slack.golangbridge.org). Come with a short <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;description of&#x27;; use a verb\">description</mark> of the issue. Try to stay available to answer questions for a while afterward.\n\n## File an issue\n\nWe cannot diagnose a problem from a description alone. When you file an issue, please include as much of the following information as possible:\n\n1. Your editor and any settings you configured. For example, your VSCode `settings.json` file.\n1. A sample program that reproduces the issue, if possible.\n1. The output of `gopls version` on the command line.\n1. A complete gopls log file from a session where the issue happened. It <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> have a `go env for &lt;workspace folder&gt;` log line near the beginning. It also helps to tell us the timestamp of the problem, so we can find it in the log. See the [instructions](#capture-logs) for how to capture gopls logs.\n\nYour editor may have a command that fills out some of this information, such as `:GoReportGitHubIssue` in `vim-go`. Otherwise, use the [Go issue tracker](https://github.com/golang/go/issues/new?title=x%2Ftools%2Fgopls%3A%20%3Cfill%20this%20in%3E).\n\n## Capture logs\n\nYou may have to change your editor configuration to pass a `-logfile` flag to gopls.\n\nTo get more detail in your logs, start `gopls` with the `-rpc.trace` flag. To start a debug server that shows you profiles and memory usage, start `gopls` with `serve --debug=localhost:6060`. You can then see the debug information at `localhost:6060`.\n\nIf you do not know how to pass a flag to `gopls` through your editor, see the [documentation for your editor](index.md#editors).\n\n## Debug memory usage\n\n`gopls` writes memory debug information automatically when your usage passes 1GB. You can find this information in your temporary di e=\"PSTE-G1: passive voice &#x27;is called&#x27;; name the actor\"> </mark>is called `baseline`. The current `evals/README.md` says there is no baseline arm anymore:<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N2: description is 35 words, limit 25\"> </mark>&quot;An arm with no instruction measured the difference between asking and not asking, which is not the question.&quot; That file looks like a leftover from an earlier version of the harness, not a current result. It does not match what the project says it measures today, so I would not treat it as evidence of anything.\n\n## What the project has not measured\n\nThe one test that would validate the claim has never run: a reader comprehending PSTE-written software text better than a control. The project says this outright. `evals/FUTURE-WORK.md` designs the test as a future blind reading trial. Readers get one version of a document, control or PSTE, without knowing which. They answer questions about it. The project reports the results whatever they show. That trial has not run.\n\nBoth `README.md` and `evals/README.md` state the same conclusion in nearly identical words. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 26 words, limit 25\">The</mark> honest claim right now is that PSTE text &quot;passes several independent automated checks.&quot; The honest claim is not that PSTE text is easier to read.\n\n## What the project rejected\n\n`evals/FUTURE-WORK.md` surveys ways to measure readability and gives a reason for rejecting most of them.\n\n- **Classical readability formulas** (Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI, LIX, RIX, Linsear Write). Rejected as circular. They are functions of word length and sentence length, which the standard already regulates directly. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 35 words, limit 25\">The</mark> file also cites Tanprasert &amp; Kauchak (2021), who showed these scores can <mark id=\"f ot yet built:\n\n1. An entailment-model layer on fact-checking.\n2. Vocabulary coverage against a real frequency corpus, via `wordfreq`.\n3. A Dale-Chall variant that uses the project&#x27;s own word list.\n\n## Bottom line\n\nThe evidence chain runs like this:\n\n1. One solid but off-domain human study motivates the project. It covers aerospace text, written by humans and read by humans.\n2. <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-L1: stacked hedging: might, suggests\">One</mark> thin, self-critiqued pilot suggests the idea might transfer to LLM output.\n3. Two offline proxy metrics exist to check vocabulary difficulty and fact preservation. Neither <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G4: perfect tense &#x27;has been run&#x27;; use simple past\">has</mark> <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G1: passive voice &#x27;been run&#x27;; name the actor\">been</mark> run and recorded on this project&#x27;s own corpus.\n4. The test that would settle the question \u2014 human readers, blind, answering comprehension questions \u2014 <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G1: passive voice &#x27;is designed&#x27;; name the actor\">is</mark> designed on paper and unrun.\n\n<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-D2: paragraph has 22 sentences, limit 6\">The</mark> project says this about itself more plainly than most similar projects do."}}}, "synth-pr-description": {"category": "review", "title": "Pull request description for the conformance checker", "prompt": "", "attribution": "", "url": "generated by evals/corpus_generate.py from this repository", "author": "claude-sonnet-5, answering a question about this repository", "licence": "CC0-1.0", "licenceUrl": "https://creativecommons.org/publicdomain/zero/1.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 892, "findings": [{"rule": "PSTE-N1", "message": "instruction is 24 words, limit 20" ta-i=\"3\" title=\"PSTE-G1: passive voice &#x27;be dropped&#x27;; name the actor\">be</mark> dropped into a pre-commit hook <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it exits 1 whenever there are findings.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 57 words, limit 25\">Coverage</mark> includes sentence/paragraph length limits, contractions, semicolons/em-dashes, passive voice, perfect tense, stacked auxiliaries, `-ing` main verbs, nominalizations, phrasal verbs, Latin abbreviations, marketing adjectives, modal ambiguity (`should`), multi-word noun clusters, stacked hedging, and <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> when the doc uses BCP 14 keywords \u2014 a set of checks (`PSTE-K1`\u2013`K3`) that catches non-standard negation forms, actor-less passive requirements, and the ambiguous `MAY NOT`.\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 34 words, limit 25\">It</mark> reads its vocabulary (approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, term verbs) from `spec/wordlist.yaml` and `spec/terms.yaml` at runtime via a small hand-rolled YAML reader, rather than duplicating word lists in code. `tools/build_binary.py` can also bake that vocabulary into `EMBEDDED_VOCAB` so<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N5: multi-word noun &#x27;packaged single-file build needs&#x27; over 3 words\"> </mark>a packaged single-file build needs no `spec/` directory alongside it.\n\n`<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 52 words, limit 25\">--self-test</mark>` runs an internal conformance suite <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> one or more cases per rule \u2014 plus consistency checks that the vocabulary itself is well-formed (every &quot;use X instead&quot; route points at a word the spec actually defines, every example in `wordlist.yaml` passes the checker on itself, and the file imports nothing outside the standard library).\n\n### Design decisions worth calling out\n\n- **No PyYAML dependency.** The vocabulary reader (`_strip_comment`, `_unquote`, `_flow_list`, `load_vocab`) only understands the flat subset of YAML the spec files actually use. This was a deliberate trade against pulling in a dependency for a single-file tool that&#x27;s meant to <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;be copied&#x27;; name the actor\">be</mark> copied around and run standalone. If the schema grows real nesting, swap it for PyYAML \u2014 I left a note in the code pointing at that tradeoff.\n- <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Tolerant vocabulary parsing.** `load_vocab` skips anything it <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> recognize instead of raising, so an unrelated edit to the spec YAML <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> break the linter at commit time. This favors availability over strictness \u2014 worth a second look if silent skipping ever masks a real vocabulary bug.\n- <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 30 words, limit 25\">*</mark>*Position-preserving text stripping.** `strip_non_prose` blanks out code fences, inline code, URLs, blockquotes, and quoted counter-examples by replacing them with spaces of the same length (keeping newlines), rather than removing them. That&#x27;s what lets every finding carry an accurate line/column back into the original file. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;It&#x2 olds approved words, banned synonyms, marketing adjectives, phrasal verbs, hedges, and term verbs. A small hand-rolled YAML reader loads these files, so the code does not duplicate the word lists. `tools/build_binary.py` can also bake the vocabulary into `EMBEDDED_VOCAB`. A packaged single-file build then needs no `spec/` directory beside it.\n\n`--self-test` runs an internal conformance suite with one or more cases per rule. It also runs consistency checks on the vocabulary itself. Every &quot;use X instead&quot; route must point at a word the spec defines. Every example in `wordlist.yaml` must pass the checker on itself. The file must import nothing outside the standard library.\n\n### Design decisions worth calling out\n\n- **No PyYAML dependency.** The vocabulary reader (`_strip_comment`, `_unquote`, `_flow_list`, `load_vocab`) only understands the flat subset of YAML that the spec files use. I made this trade on purpose. A single-file tool that people copy around and run standalone <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not pull in a dependency. If the schema grows real nesting, swap the reader for PyYAML. I left a note in the code that points at that trade.\n- **Tolerant vocabulary parsing.** `load_vocab` skips anything it does not recognize instead of raising an error. An unrelated edit to the spec YAML then cannot break the linter at commit time. This favours availability over strictness. Look at this again if <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N5: multi-word noun &#x27;silent skipping ever hides&#x27; over 3 words\">the</mark> silent skipping ever hides a real vocabulary bug.\n- **Position-preserving text stripping.** `strip_non_prose` blanks out code fences, inline code, URLs, blockquotes, and quoted counter-examples. It replaces them with spaces of the same length and keeps the newlines, instead of removing them. This is what lets every finding carry an accurate line and column back into the original file. The logic is fiddly. The `keep` marker logic in `_blank` exists so that word counts and sentence splits still line up after the stripping.\n- <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 32 words, limit 25\">*</mark>*Counter-example detection is heuristic.** The linter treats a quoted span right after &quot;not&quot;, &quot;never&quot;, or &quot;instead of&quot; as a deliberate example of what *not* to write, and exempts it (`QUOTED_SPAN_RE` and `NEGATION_BEFORE_RE`). This lets the spec demonstrate violations without tripping its own linter. But the code matches patterns in the phrasing. It does not parse the sentence. Unusual sentence shapes can produce false negatives and false positives.\n- **Stoplists resolve part-of-speech ambiguity, not a tagger.** Several checks use small hand-picked word lists instead of real part-of-speech tagging: nominalization against ordinary noun, `-ing` adjective against progressive verb, and interior plural that ends a noun run. Each one carries a `ponytail:` comment that marks it as a deliberate scope cut. These lists are the most likely source of missed findings and false findings on real-world text.\n- **Verdict, not a score.** `format_table` reports PASS or FAIL rather than a numeric grade. The JSON output carries a `disclaimer` field beside the counts. This is deliberate. A conformance count invites the reader to treat it as a quality score, which it is not. It says nothing about whether the text is true, useful, or readable. The self-test asserts the disclaimer text. It also asserts that no score-like token leaks into the table output.\n- **Dependency-free by contract, and enforced.** The self-test parses this file&#x27;s own AST and asserts that it imports nothing outside the standard library. The whole point is that a consumer can copy this one file and run it.\n\n### What a reviewer should look at closely\n\n1. **The regex- er holds none of them, so none can reach the model.\nconstrained: false\nquestion: |\n  Read the repository at /repo and write the release notes for version 0.1.0. Cover what a user gets, how to install it, the known limits, and what is not ready yet. Return the release notes as your reply. Do not create a file. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n\nI have what I need. Here are the release notes for PSTE 0.1.0:\n\n---\n\n# PSTE 0.1.0\n\nPSTE (Programming Simplified Technical English) is a controlled-English writing standard for software prose. The release also gives you a Claude Code skill and a standalone linter that enforce the standard. This is the first tagged release. The standard, the checker, the skill, and the persistence hooks all work.\n\n## What you get\n\n- **A written standard** (`spec/PSTE-1.md`) \u2014 an RFC-style document with numbered MUST/SHOULD/MAY rules. The rules cover sentence length, active voice, tense, banned constructs (contractions, semicolons, filler, marketing adjectives), and a required approved-vocabulary list at the strictest level.\n- **A vocabulary list** \u2014 about 270 word-list entries that cover roughly 1,160 words and their synonyms. The build generates `spec/appendix-*.md` from the source YAML files.\n- **A standalone linter** (`lib/pste_lint.py`) that checks any Markdown file against the rules. It prints PASS/FAIL with line-level findings. It has no dependencies, needs only Python 3.8+, and can also build into a single-file binary through `tools/build_binary.py`.\n- **A Claude Code skill** (`skill/SKILL.md`) with three enforcement levels (`lite`, `pste`, `strict`), commands (`/pste`, `/pste-lint`), and hooks. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 31 words, limit 25\">The</mark> hooks reload the ruleset on session start and re-inject it on every prompt, so the rules do not fade out over a long session or get lost to context compaction.\n- **A pre-commit hook** you can drop into any repository to lint markdown files automatically.\n- **Verification tooling** in `evals/` \u2014 vocabulary-coverage and fact-preservation scripts you can run for free, plus a paid model-based harness. The harness A/B-tests the skill against a plain &quot;make this simpler&quot; prompt.\n\n## Installing it\n\nYou need Python 3.8+ for the checker and Node (any <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;modern&#x27;\">modern</mark> version) for the Claude Code hooks.\n\n**Just the linter, as a standalone binary:**\n```\npython3 tools/build_binary.py --out ~/.local/bin/pste-lint\npste-lint --self-test\n```\n\n**Just the linter, from source (picks up live edits to the word list):**\n```\npython3 lib/pste_lint.py README.md\n```\n\n**As a pre-commit hook**, in this repository run `pip install pre-commit &amp;&amp; pre-commit install`. In another repository, add:\n```yaml\nrepos:\n  - repo: https://github.com/shermanrose/pste\n    rev: v0.1.0\n    hooks:\n      - id: pste-lint\n        args: [&quot;--level&quot;, &quot;2&quot;]\n```\n\n**As a Claude Code plugin:**\n```\nln -s &quot;$PWD&quot; ~/.claude/plugins/pste\n```\n`.claude-plugin/plugin.json` wires up the skill, the two slash commands, and the two hooks automatically.\n\n**Without the plugin system:** paste `skill/SKILL.md` into a system prompt or `CLAUDE.md`. The rules work standalone. You only lose the auto-persistence that the hooks give you.\n\nSet the default level through `PSTE_LEVEL`, per repository through `.pste.json`, or at runtime with `/pste lite|pste|strict|off`.\n\n## Known limits\n\n- **The vocabulary list is incomplete.** At the strictest level (3), the checker does not automatically forbid a word that the list does not cover. The list only handles the synonym clusters that come up most in software writing today. `spec/METHOD.md` has the plan for filling in the rest.\n- **The linter checks conformance, not quality.** A clean report means the text avoided the things the rules forbid. It does not mean the text is good, accurate, or even readable. The checker cannot verify rule PSTE-A1 (accuracy beats every other rule) at all. That rule is on the writer.\n- <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 33 words, limit 25\">*</mark>*The checker actually rewards one specific failure mode.** A rewrite that quietly drops a fact has fewer words left to trip a rule with, so it scores better than one that keeps everything. Use `evals/faithfulness.py` alongside it to catch dropped facts.\n- **The evidence behind the readability claim is thin.** The one human-subject study this project leans on (Chervak <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V8: Latin abbreviation &#x27;et al.&#x27;; use &#x27;and others&#x27;\">et</mark> al. 1996) covers aerospace maintenance manuals, not software docs, and human writers, not model output. The one LLM-focused study it cites is a six-prompt pilot from a third party. That is not proof, just a pointer.\n\n## What is not ready yet\n\n- <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 32 words, limit 25\">*</mark>*No comprehension trial <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;has run&#x27;; use simple past\">has</mark> run.** The project&#x27;s own honest claim, stated in its docs, is that PSTE text passes some automated checks \u2014 not that a person actually finds it easier to read. The design for <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N5: multi-word noun &#x27;real blind reading trial&#x27; over 3 words\">a</mark> real blind reading trial exists in `evals/FUTURE-WORK.md`, but nobody <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G4: perfect tense &#x27;has run&#x27;; use simple past\">has</mark> run it.\n- **The model-based eval harness has not produced a committed run.** `evals/run.py` exists and works, but `evals/results/` holds no run output yet. So there is no PSTE-versus-plain-prompt comparison you can point to.\n- **Only tested against one model.** Anything measured informally reflects that one model only. The project&#x27;s own notes say results <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are known&#x27;; name the actor\">are</mark> known to vary by model, and nobody <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G4: perfect tense &#x27;has checked&#x27;; use simple past\">has</mark> checked that here yet.\n- The release deliberately leaves out several proxy measures considered for judging readability (entailment checking, frequency-corpus vocabulary scoring, model-as-judge). `evals/FUTURE-WORK.md` scopes them as future work.<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-D2: paragraph has 24 sentences, limit 6\"> </mark>They do not ship."}}}}};
const pick = document.getElementById("pick");
const grid = document.getElementById("grid");
const meta = document.getElementById("meta");
const prov = document.getElementById("prov");
const ask = document.getElementById("ask");
const overviewPane = document.getElementById("overview");
const docpick = document.getElementById("docpick");
const tabOverview = document.getElementById("tab-overview");
const tabDocuments = document.getElementById("tab-documents");
const ids = Object.keys(DATA.results);

prov.textContent = DATA.git && DATA.git.short
  ? DATA.source + "  \u2014  commit " + DATA.git.short
      + " on " + (DATA.git.branch || "?")
  : DATA.source + "  \u2014  no provenance recorded";

for (const id of ids) {
  const o = document.createElement("option");
  o.value = id;
  o.textContent = id + "  (" + DATA.results[id].category + ")";
  pick.append(o);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    const verdict = a.pass
      ? '<span class="verdict pass">PASS</span>'
      : '<span class="verdict fail">FAIL</span>';
    const list = a.pass
      ? '<p class="none">Nothing to fix at this level.</p>'
      : "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>";
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

// ---- Overview -------------------------------------------------------------

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);
  bits.push("<b>passes</b>" + r.passes);
  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);
  bits.push("<b>level</b>" + DATA.level);
  if (r.sourceModels && r.sourceModels.length)
    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
  if (r.failures) bits.push('<b>failures</b><span class="cell-fail">'
      + r.failures + "</span>");

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      body += '<td class="' + (c.pass ? "cell-pass" : "cell-fail") + win + '">'
            + (c.pass ? "PASS" : c.findings)
            + '<div class="cell-sub">' + c.rules + " rule"
            + (c.rules === 1 ? "" : "s") + "</div>"
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  let foot = '<tr><td class="doc">TOTAL</td>';
  for (const a of arms) {
    const t = o.totals[a] || {pass:0,total:0,findings:0};
    foot += "<td>" + t.findings + '<div class="cell-sub">'
          + t.pass + "/" + t.total + " pass</div></td>";
  }
  foot += "</tr>";

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings at all, so '
    + "the count and the number of distinct rules say more than the verdict. "
    + "The green outline marks the arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
