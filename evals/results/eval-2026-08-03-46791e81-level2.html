 the Chia blockchain with different configurations and v", "line": 54, "column": 1, "excerpt_offset": 0, "offset": 4519, "token": "Due"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Version 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block ", "line": 56, "column": 1, "excerpt_offset": 0, "offset": 4732, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Version 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast F", "line": 58, "column": 1, "excerpt_offset": 0, "offset": 4999, "token": "Version"}, {"rule": "PSTE-G1", "message": "passive voice 'was cleared'; name the actor", "excerpt": "Version 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast F", "line": 58, "column": 121, "excerpt_offset": 120, "offset": 5119, "token": "was"}, {"rule": "PSTE-G1", "message": "passive voice 'are rejected'; name the actor", "excerpt": "SpendBundles submitted to the mempool that only contained fast-forward spends are rejected", "line": 59, "column": 84, "excerpt_offset": 78, "offset": 5271, "token": "are"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 6, "excerpt_offset": 0, "offset": 5290, "token": "When"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "offset": 5460, "token": "When"}, {"rule": "PSTE-G1", "message": "passive voice 'is validated'; name the actor", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 89, "excerpt_offset": 83, "offset": 5543, "token": "is"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;being included&#x27;; name the actor\">being</mark> included in blocks. Additionally, block production slowed down versus expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;was determined&#x27;; name the actor\">was</mark> determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;are used&#x27;; name the actor\">are</mark> used for vaults. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;is used&#x27;; name the actor\">is</mark> used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;being evicted&#x27;; name the actor\">being</mark> evicted  (<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G1: passive voice &#x27;be evicted&#x27;; name the actor\">be</mark> evicted after the singleton <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G1: passive voice &#x27;was melted&#x27;; name the actor\">was</mark> melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G1: passive voice &#x27;been melted&#x27;; name the actor\">been</mark> melted and no longer exist.\n* 3. When we formed a block, FF spends would <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G1: passive voice &#x27;be updated&#x27;; name the actor\">be</mark> updated to spend the most recent coin of a singleton. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-G1: passive voice &#x27;was done&#x27;; name the actor\">was</mark> done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G1: passive voice &#x27;Be considered&#x27;; name the actor\">Be</mark> considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G1: passive voice &#x27;be included&#x27;; name the actor\">be</mark> included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G1: passive voice &#x27;were diagnosed&#x27;; name the actor\">were</mark> diagnosed by CNI and a hotfix release of the chia blockchain software <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G1: passive voice &#x27;was prepared&#x27;; name the actor\">was</mark> prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-G1: passive voice &#x27;was initiated&#x27;; name the actor\">was</mark> initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-G1: passive voice &#x27;was released&#x27;; name the actor\">was</mark> released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-G1: passive voice &#x27;was cleared&#x27;; name the actor\">was</mark> cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-G1: passive voice &#x27;are rejected&#x27;; name the actor\">are</mark> rejected.\n* 2. <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-G1: passive voice &#x27;is validated&#x27;; name the actor\">is</mark> validated to ensure the latest version of this singleton still exists (with the given puzzle hash)."}, "control": {"missing": false, "pass": false, "words": 755, "findings": [{"rule": "PSTE-N2", "message": "description is 33 words, limit 25", "excerpt": "A farmer eligible to create the next block has roughly 28 seconds to build an unfinished b", "line": 5, "column": 1, "excerpt_offset": 0, "offset": 58, "token": "A"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "Farmers pull transactions from the mempool, ordered by fee per cost, and pack them into th", "line": 7, "column": 1, "excerpt_offset": 0, "offset": 253, "token": "Farmers"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Farmers pull transactions from the mempool, ordered by fee per cost, and pack them into th", "line": 7, "column": 110, "excerpt_offset": 109, "offset": 362, "token": "\u2014"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'were failing'", "excerpt": "farmers eligible to create blocks were failing to build unfinished blocks in time, due to ", "line": 9, "column": 206, "excerpt_offset": 34, "offset": 639, "token": "were"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Fast forward lets multiple spends of the vault singleton sit in the mempool at once; farme", "line": 15, "column": 267, "excerpt_offset": 83, "offset": 1235, "token": ";"}, {"rule": "PSTE-G7", "message": "nominalization 'Eviction of'; use a verb", "excerpt": "Eviction of fast-forward spends therefore depends on other parts of the spend bundle (for ", "line": 19, "column": 152, "excerpt_offset": 0, "offset": 1507, "token": "Eviction"}, {"rule": "PSTE-G1", "message": "passive voice 'be evicted'; name the actor", "excerpt": "it would never be evicted after the singleton was melted.", "line": 19, "column": 376, "excerpt_offset": 15, "offset": 1731, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'was melted'; name the actor", "excerpt": "it would never be evicted after the singleton was melted.", "line": 19, "column": 407, "excerpt_offset": 46, "offset": 1762, "token": "was"}, {"rule": "PSTE-G4", "message": "perfect tense 'had been melted'; use simple past", "excerpt": "But we never validated that the singleton still existed \u2014 so we accepted singleton spends ", "line": 20, "column": 276, "excerpt_offset": 110, "offset": 2049, "token": "had"}, {"rule": "PSTE-G1", "message": "passive voice 'been melted'; name the actor", "excerpt": "But we never validated that the singleton still existed \u2014 so we accepted singleton spends ", "line": 20, "column": 280, "excerpt_offset": 114, "offset": 2053, "token": "been"}, {"rule": "PSTE-G1", "message": "passive voice 'were updated'; name the actor", "excerpt": "During block formation, FF spends were updated to spend a singleton's most recent coin.", "line": 21, "column": 40, "excerpt_offset": 34, "offset": 2125, "token": "were"}, {"rule": "PSTE-G1", "message": "passive voice 'was treated'; name the actor", "excerpt": "The spend was treated as valid, entered the mempool, and propagated across the network.", "line": 25, "column": 13, "excerpt_offset": 10, "offset": 2584, "token": "was"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "Farmers attempting to build a block from the affected mempool items hit performance proble", "line": 28, "column": 3, "excerpt_offset": 0, "offset": 3093, "token": "Farmers"}, {"rule": "PSTE-G1", "message": "passive voice 'be included'; name the actor", "excerpt": "Farmers attempting to build a block from the affected mempool items hit performance proble", "line": 28, "column": 142, "excerpt_offset": 139, "offset": 3232, "token": "be"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-14-2025 4:45 pm \u2014 Chia blockchain netspace began decreasing; timelord infused blocks pe", "line": 40, "column": 20, "excerpt_offset": 19, "offset": 3559, "token": "\u2014"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "02-14-2025 4:45 pm \u2014 Chia blockchain netspace began decreasing; timelord infused blocks pe", "line": 40, "column": 63, "excerpt_offset": 62, "offset": 3602, "token": ";"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-14-2025 11:00 pm \u2014 CNI diagnosed the cause and prepared a hotfix release of the Chia bl", "line": 42, "column": 21, "excerpt_offset": 20, "offset": 3678, "token": "\u2014"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-19-2025 3:15 pm \u2014 Version 2.5.2 released, including the fixes for the fast forward issu", "line": 48, "column": 20, "excerpt_offset": 19, "offset": 3921, "token": "\u2014"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Because the Chia blockchain is decentralized, with many nodes running different configurat", "line": 52, "column": 1, "excerpt_offset": 0, "offset": 4041, "token": "Because"}, {"rule": "PSTE-G1", "message": "passive voice 'is decentralized'; name the actor", "excerpt": "Because the Chia blockchain is decentralized, with many nodes running different configurat", "line": 52, "column": 29, "excerpt_offset": 28, "offset": 4069, "token": "is"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Version 2.5.2 shipped fixes that invalidated the mempool items created by the fast forward", "line": 56, "column": 98, "excerpt_offset": 97, "offset": 4539, "token": ";"}, {"rule": "PSTE-G1", "message": "passive voice 'are rejected'; name the actor", "excerpt": "Spend bundles submitted to the mempool that contain only fast-forward spends are rejected.", "line": 58, "column": 83, "excerpt_offset": 77, "offset": 4688, "token": "are"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "When a spend is \"rebased\" onto the latest version of the singleton, we no longer update th", "line": 59, "column": 6, "excerpt_offset": 0, "offset": 4707, "token": "When"}, {"rule": "PSTE-G4", "message": "perfect tense 'had risked'; use simple past", "excerpt": "When a spend is \"rebased\" onto the latest version of the singleton, we no longer update th", "line": 59, "column": 125, "excerpt_offset": 119, "offset": 4826, "token": "had"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 60, "column": 6, "excerpt_offset": 0, "offset": 4884, "token": "When"}, {"rule": "PSTE-G1", "message": "passive voice 'is validated'; name the actor", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 60, "column": 89, "excerpt_offset": 83, "offset": 4967, "token": "is"}], "html": "# Slow Block Creation Caused by Mempool Bugs\n\n## Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 33 words, limit 25\">A</mark> farmer eligible to create the next block has roughly 28 seconds to build an unfinished block and propagate it across the network to a timelord, which infuses it to produce the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> pull transactions from the mempool, ordered by fee per cost, and pack them into the unfinished block <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the fees on those transactions go to the farmer who makes the block.\n\nCNI observed that the mempool was completely full, yet transactions were not making it into blocks. Block production also slowed relative to the expected rate. The cause: farmers eligible to create blocks <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;were failing&#x27;\">were</mark> failing to build unfinished blocks in time, due to several bugs in the mempool&#x27;s fast forward spend logic.\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis is what allows offer files to refer to singletons by coin ID even though the coin ID changes on every state update.\n\nFast forward spends are also used by vaults. A vault singleton authorizes every coin belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too restrictive. Fast forward lets multiple spends of the vault singleton sit in the mempool at once<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> farmers deduplicate and rebase them sequentially as they build blocks.\n\nCNI traced the slowdown to three root causes:\n\n* 1. A fast forward spend does not become invalid simply because its coin was spent \u2014 it can be fast-forwarded to the latest version of the singleton. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G7: nominalization &#x27;Eviction of&#x27;; use a verb\">Eviction</mark> of fast-forward spends therefore depends on other parts of the spend bundle (for example, that coin being spent by a block). We did not account for a bundle whose only spend was a fast-forward spend: it would never <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;be evicted&#x27;; name the actor\">be</mark> evicted after the singleton <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;was melted&#x27;; name the actor\">was</mark> melted.\n* 2. FF-spends enter the mempool even when their coin is already spent, because at block formation they get fast-forwarded onto the latest version of the singleton. But we never validated that the singleton still existed \u2014 so we accepted singleton spends for singletons that <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;been melted&#x27;; name the actor\">been</mark> melted and no longer exist.\n* 3. During block formation, FF spends <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;were updated&#x27;; name the actor\">were</mark> updated to spend a singleton&#x27;s most recent coin. That update happened in place, mutating the mempool and propagating the fast-forwarded versions of the mempool item to the rest of the network. Every time a farmer tried to form a block, the mempool item duplicated \u2014 doubling in number.\n\nTogether, these three bugs meant that anyone submitting a fast-forward-eligible singleton spend, unbundled with any other spend, would see the following:\n\n* The spend <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;was treated&#x27;; name the actor\">was</mark> treated as valid, entered the mempool, and propagated across the network.\n* Each time a farmer made a block, the spend multiplied, propagating the new transactions across the network (3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but did not evict the spends from the mempool (2). In our scenario, the mempool was full of these spends when this happened. All of them failed during block creation, so farmers timed out before finding any valid transactions.\n* <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 28 words, limit 25\">Farmers</mark> attempting to build a block from the affected mempool items hit performance problems and missed the cutoff time for their block to <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G1: passive voice &#x27;be included&#x27;; name the actor\">be</mark> included in the blockchain.\n\n## Timeline\n\nAll times PST, 02/13/2025 \u2013 02/19/2025. All times are approximations.\n\n02-13-2025 11:00 pm \u2014 Mempool spendbundle count began slowly increasing.\n\n02-14-2025 11:30 am \u2014 Mempool cost hit max cost.\n\n02-14-2025 1:10 pm \u2014 Mempool spendbundle count plateaued at ~6200.\n\n02-14-2025 4:45 pm <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Chia blockchain netspace began decreasing<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> timelord infused blocks per minute dropped markedly.\n\n02-14-2025 11:00 pm <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> CNI diagnosed the cause and prepared a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am \u2014 Build process for the hotfix release began.\n\n02-15-2025 3:00 am \u2014 Hotfix deployment completed as version 2.5.1.\n\n02-19-2025 3:15 pm <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Version 2.5.2 released, including the fixes for the fast forward issues described above.\n\n## Resolution and Recovery\n\n<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 27 words, limit 25\">Because</mark> the Chia blockchain <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G1: passive voice &#x27;is decentralized&#x27;; name the actor\">is</mark> decentralized, with many nodes running different configurations and versions, the majority of blockchain netspace was not affected by the fast forward issues.\n\nVersion 2.5.1 added a workaround that caps unfinished block creation time, ensuring the unfinished block reaches a timelord promptly. Netspace began recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 shipped fixes that invalidated the mempool items created by the fast forward issues<mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the mempool cleared of them as users adopted v2.5.2. The fixes:\n\n* 1. Spend bundles submitted to the mempool that contain only fast-forward spends <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-G1: passive voice &#x27;are rejected&#x27;; name the actor\">are</mark> rejected.\n* 2. <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> a spend is &quot;rebased&quot; onto the latest version of the singleton, we no longer update the item in the mempool, which <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-G4: perfect tense &#x27;had risked&#x27;; use simple past\">had</mark> risked distributing the new copy to the network.\n* 3. <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G1: passive voice &#x27;is validated&#x27;; name the actor\">is</mark> validated to confirm the latest version of that singleton still exists (with the given puzzle hash)."}, "pste": {"missing": false, "pass": false, "words": 836, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'mempool logic around fast forward spends' over 3 words", "excerpt": "Several bugs in the mempool logic around fast forward spends caused this delay.", "line": 9, "column": 267, "excerpt_offset": 16, "offset": 758, "token": "the"}, {"rule": "PSTE-N5", "message": "multi-word noun 'block creation slow down' over 3 words", "excerpt": "CNI found these three root causes of the block creation slow down:", "line": 17, "column": 38, "excerpt_offset": 37, "offset": 1397, "token": "the"}, {"rule": "PSTE-G1", "message": "passive voice 'be evicted'; name the actor", "excerpt": "That bundle would not be evicted after the singleton was melted.", "line": 19, "column": 367, "excerpt_offset": 22, "offset": 1794, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'was melted'; name the actor", "excerpt": "That bundle would not be evicted after the singleton was melted.", "line": 19, "column": 398, "excerpt_offset": 53, "offset": 1825, "token": "was"}, {"rule": "PSTE-G1", "message": "passive voice 'were melted'; name the actor", "excerpt": "That is, we accepted singleton spends into the mempool for singletons that were melted and", "line": 20, "column": 308, "excerpt_offset": 75, "offset": 2144, "token": "were"}, {"rule": "PSTE-N5", "message": "multi-word noun 'node updated fast forward spends' over 3 words", "excerpt": "When we formed a block, the node updated fast forward spends to spend the most recent coin", "line": 21, "column": 28, "excerpt_offset": 24, "offset": 2204, "token": "the"}, {"rule": "PSTE-G1", "message": "passive voice 'is decentralized'; name the actor", "excerpt": "The Chia blockchain is decentralized, and many nodes run different configurations and vers", "line": 50, "column": 21, "excerpt_offset": 20, "offset": 4289, "token": "is"}, {"rule": "PSTE-N5", "message": "multi-word noun 'unfinished block creation time' over 3 words", "excerpt": "It caps the unfinished block creation time, so that the unfinished block reaches a timelor", "line": 52, "column": 69, "excerpt_offset": 8, "offset": 4517, "token": "the"}], "html": "# Block creation impacted by mempool issues\n\n## Issue summary\n\nA farmer that is eligible to make the next block has about 28 seconds to make an unfinished block. The network must then propagate that block to a timelord. The timelord infuses the unfinished block to make the finished block.\n\nFarmers take transactions from the mempool, ordered by fee per cost. They add these transactions to the unfinished block. The farmer that makes the block gets the fees attached to those transactions.\n\nCNI found that the mempool was completely full, but blocks did not include the transactions. Block production also slowed down below the expected rate. CNI determined the cause: farmers eligible to make blocks did not make unfinished blocks in time. Several bugs in <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends caused this delay.\n\nA fast forward spend lets a singleton transaction apply to future versions of the singleton.\n\nFast forward spends let offer files refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nVaults also use fast forward spends. The vault singleton authorizes all coins that belong to it. One vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward lets several spends of the vault singleton sit in the mempool at the same time. Farmers deduplicate and rebase them in order as they make blocks.\n\nCNI found these three root causes of <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;block creation slow down&#x27; over 3 words\">the</mark> block creation slow down:\n\n1. A fast forward spend does not become invalid when its coin is spent. The node can fast-forward it to the latest version of the singleton. Fast forward spends depend on other parts of the spend bundle for eviction. For example, a block spends that coin. We did not consider the case where a fast forward spend was the only spend in a bundle. That bundle would not <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;be evicted&#x27;; name the actor\">be</mark> evicted after the singleton <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;was melted&#x27;; name the actor\">was</mark> melted.\n2. Fast forward spends enter the mempool even if their coin is already spent. When we form the block, the node fast-forwards them on top of the latest version of the singleton. But we did not check that the singleton still existed. That is, we accepted singleton spends into the mempool for singletons that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;were melted&#x27;; name the actor\">were</mark> melted and no longer exist.\n3. When we formed a block, <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N5: multi-word noun &#x27;node updated fast forward spends&#x27; over 3 words\">the</mark> node updated fast forward spends to spend the most recent coin of a singleton. The node made this update in place. This changed the mempool and propagated the fast-forwarded versions of the mempool item to the rest of the network. The mempool item then doubled in number every time a farmer tried to form a block.\n\nWith these 3 bugs, a person could submit a singleton spend that is eligible for fast forward, without bundling it with any other spend. The result:\n\n- The network considers the spend valid. The spend enters the mempool and propagates throughout the network.\n- Whenever a farmer makes a block, the node multiplies the spend and propagates the new transactions throughout the network (3).\n- Melting the singleton to stop the spread makes the transactions fail, but the node does not evict the spends from the mempool (2). In our scenario, the mempool was full of these spends when this happened. All of these spends failed during block creation. Farmers then timed out before they found any valid transactions.\n- Farmers that tried to make a block with the affected mempool items hit performance problems. They missed the cutoff time for their block to enter the blockchain.\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times are approximate\n\n02-13-2025 11:00 pm - The mempool spendbundle count started to increase slowly.\n\n02-14-2025 11:30 am - The mempool cost hit the maximum cost.\n\n02-14-2025 1:10 pm - The mempool spendbundle count reached a plateau at about 6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started to decrease. Timelord infused blocks per minute dropped sharply.\n\n02-14-2025 11:00 pm - CNI diagnosed the cause of the issues. CNI prepared a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am - The build process for the hotfix release started.\n\n02-15-2025 3:00 am - The hotfix release deployment finished as version 2.5.1.\n\n02-19-2025 3:15 pm - CNI released version 2.5.2. This version included the bug fixes for the fast forward issues in the issue summary.\n\n## Resolution and recovery\n\nThe Chia blockchain <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;is decentralized&#x27;; name the actor\">is</mark> decentralized, and many nodes run different configurations and versions. So the fast forward issues did not affect the majority of the blockchain netspace.\n\nVersion 2.5.1 of the Chia blockchain contains a workaround. It caps <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;unfinished block creation time&#x27; over 3 words\">the</mark> unfinished block creation time, so that the unfinished block reaches a timelord in time. The blockchain netspace started to recover towards previous levels after the v2.5.1 release.\n\nVersion 2.5.2 included fixes that invalidated the mempool items from the fast forward issues. The mempool cleared these items as the userbase took up v2.5.2. The fixes:\n\n1. The node rejects spend bundles submitted to the mempool that only contain fast forward spends.\n2. When the node rebases a spend on top of the latest version of the singleton, the node does not update the item in the mempool. This removes the risk of distributing the new copy to the network.\n3. When the node ingests spend bundles into the mempool, it checks every spend eligible for fast forward. The check makes sure the latest version of this singleton still exists, with the given puzzle hash."}}}, "postmortem-chia-clvm-cost": {"category": "incident report", "title": "Unbound CLVM cost restriction on mempool", "prompt": "", "attribution": "Rewritten from \"Unbound CLVM cost restriction on mempool\" by Chia Network Inc., used under Apache-2.0. Source: https://raw.githubusercontent.com/Chia-Network/post-mortem/main/2023-07/2023-07-21-unbound-CLVM-cost-restriction-on-mempool.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/Chia-Network/post-mortem/main/2023-07/2023-07-21-unbound-CLVM-cost-restriction-on-mempool.md", "author": "Chia Network Inc.", "licence": "Apache-2.0", "licenceUrl": "https://www.apache.org/licenses/LICENSE-2.0", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 376, "findings": [{"rule": "PSTE-G1", "message": "passive voice 'are included'; name the actor", "excerpt": "Transactions that are included in a block are aggregated from one or more spendbundles.", "line": 5, "column": 19, "excerpt_offset": 18, "offset": 80, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'are aggregated'; name the actor", "excerpt": "Transactions that are included in a block are aggregated from one or more spendbundles.", "line": 5, "column": 43, "excerpt_offset": 42, "offset": 104, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'is assigned'; name the actor", "excerpt": "The puzzles and solutions consist of CLVM code that is assigned a cost, based on bytes of ", "line": 5, "column": 241, "excerpt_offset": 52, "offset": 302, "token": "is"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Each node on the network runs the CLVM code with limitations on how much resources the exe", "line": 5, "column": 327, "excerpt_offset": 0, "offset": 388, "token": "Each"}, {"rule": "PSTE-G7", "message": "nominalization 'restriction of'; use a verb", "excerpt": "The Chia default mempool code uses a CLVM cost restriction of 0.5 times the restriction th", "line": 7, "column": 48, "excerpt_offset": 47, "offset": 579, "token": "restriction"}, {"rule": "PSTE-G1", "message": "passive voice 'is allowed'; name the actor", "excerpt": "The Chia default mempool code uses a CLVM cost restriction of 0.5 times the restriction th", "line": 7, "column": 115, "excerpt_offset": 114, "offset": 646, "token": "is"}, {"rule": "PSTE-N3", "message": "contraction 'doesn\u2019t'", "excerpt": "Version 1.7.1 of the mempool doesn\u2019t include verification code that the CLVM cost of a Mem", "line": 10, "column": 30, "excerpt_offset": 29, "offset": 762, "token": "doesn\u2019t"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "This verification code was removed because it was assumed that running the MempoolItem as ", "line": 13, "column": 1, "excerpt_offset": 0, "offset": 928, "token": "This"}, {"rule": "PSTE-G1", "message": "passive voice 'was removed'; name the actor", "excerpt": "This verification code was removed because it was assumed that running the MempoolItem as ", "line": 13, "column": 24, "excerpt_offset": 23, "offset": 951, "token": "was"}, {"rule": "PSTE-G1", "message": "passive voice 'was assumed'; name the actor", "excerpt": "This verification code was removed because it was assumed that running the MempoolItem as ", "line": 13, "column": 47, "excerpt_offset": 46, "offset": 974, "token": "was"}, {"rule": "PSTE-N2", "message": "description is 33 words, limit 25", "excerpt": "The chia_rs function called run_block_generator() contained a bug where if the byte cost e", "line": 15, "column": 1, "excerpt_offset": 0, "offset": 1098, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "The removal of the verification in the mempool code and the chia_rs bug combined allowed f", "line": 17, "column": 1, "excerpt_offset": 0, "offset": 1296, "token": "The"}, {"rule": "PSTE-G1", "message": "passive voice 'were reported'; name the actor", "excerpt": "04/23/2023 - Mempool items with a cost exceeding  CODE                                 wer", "line": 21, "column": 88, "excerpt_offset": 87, "offset": 1640, "token": "were"}, {"rule": "PSTE-G1", "message": "passive voice 'was released'; name the actor", "excerpt": "05/03/2023 - Version 1.8.0 of the Chia blockchain was released with fixes for the mempool ", "line": 23, "column": 51, "excerpt_offset": 50, "offset": 1739, "token": "was"}, {"rule": "PSTE-G1", "message": "passive voice 'was addressed'; name the actor", "excerpt": "This issue was addressed in 1.8.0 by:", "line": 28, "column": 12, "excerpt_offset": 11, "offset": 1838, "token": "was"}, {"rule": "PSTE-G1", "message": "passive voice 'being added'; name the actor", "excerpt": "The issue was present in mainnet and manifested itself by transactions being added to the ", "line": 35, "column": 72, "excerpt_offset": 71, "offset": 2148, "token": "being"}, {"rule": "PSTE-N2", "message": "description is 42 words, limit 25", "excerpt": "Chia monitored the mempool for these excessive CLVM cost mempool items and found that they", "line": 37, "column": 1, "excerpt_offset": 0, "offset": 2309, "token": "Chia"}, {"rule": "PSTE-G1", "message": "passive voice 'were limited'; name the actor", "excerpt": "Chia monitored the mempool for these excessive CLVM cost mempool items and found that they", "line": 37, "column": 92, "excerpt_offset": 91, "offset": 2400, "token": "were"}], "html": "# unbound CLVM cost restriction on mempool\n\n## Issue Summary\n\nTransactions that <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;are included&#x27;; name the actor\">are</mark> included in a block <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;are aggregated&#x27;; name the actor\">are</mark> aggregated from one or more spendbundles. Inside spendbundles coins are spent, with the reveal of the puzzle and their solution of the coins. The puzzles and solutions consist of CLVM code that <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;is assigned&#x27;; name the actor\">is</mark> assigned a cost, based on bytes of the code, and usage of operands and conditions. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">Each</mark> node on the network runs the CLVM code with limitations on how much resources the execution can use up via restrictions on the CLVM cost.\n\nThe Chia default mempool code uses a CLVM cost <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;restriction of&#x27;; use a verb\">restriction</mark> of 0.5 times the restriction that consensus uses (what <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;is allowed&#x27;; name the actor\">is</mark> allowed in a block). The consensus constant is &quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000\n\n\nVersion 1.7.1 of the mempool <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;doesn\u2019t&#x27;\">doesn\u2019t</mark> include verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`\nThis code was present in previous versions.\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> verification code <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;was removed&#x27;; name the actor\">was</mark> removed because it <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;was assumed&#x27;; name the actor\">was</mark> assumed that running the MempoolItem as a block generator would perform this check already, making the code redundant.\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 33 words, limit 25\">The</mark> chia_rs function called run_block_generator() contained a bug where if the byte cost exceeded the limit (5.5 billion in this case), the u64 wraps around and effectively removes the cost limit.\n\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 32 words, limit 25\">The</mark> removal of the verification in the mempool code and the chia_rs bug combined allowed for a MempoolItem to have an unbound CLVM cost when the byte cost exceeded the limit.\n\n## Timeline (all times PST)   04/23/2023 - 05/03/2023. All times approximations\n\n04/23/2023 - Mempool items with a cost exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5` <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G1: passive voice &#x27;were reported&#x27;; name the actor\">were</mark> reported by a community member in keybase.\n\n05/03/2023 - Version 1.8.0 of the Chia blockchain <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G1: passive voice &#x27;was released&#x27;; name the actor\">was</mark> released with fixes for the mempool code and chia_rs.\n\n\n## Resolution and recovery\n\nThis issue <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G1: passive voice &#x27;was addressed&#x27;; name the actor\">was</mark> addressed in 1.8.0 by: \n\nReinstating the mempool verification code that the CLVM cost of a MempoolItem has to be &lt;= `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n\nFixing the cost calculation in chia_rs when the byte cost exceeds the limit.\n\n\nThe issue was present in mainnet and manifested itself by transactions <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G1: passive voice &#x27;being added&#x27;; name the actor\">being</mark> added to the mempool that exceeded the CLVM cost threshold. These transactions were not added to blocks as consensus checks on CLVM cost disallowed that.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 42 words, limit 25\">Chia</mark> monitored the mempool for these excessive CLVM cost mempool items and found that they <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G1: passive voice &#x27;were limited&#x27;; name the actor\">were</mark> limited in scope and barely exceeded the threshold limit, causing very limited impact on nodes on the network during the time that the mempool allowed them.\n\n\n"}, "control": {"missing": false, "pass": false, "words": 337, "findings": [{"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "Those puzzles and solutions are CLVM code, and each is assigned a cost based on the byte s", "line": 5, "column": 142, "excerpt_offset": 0, "offset": 203, "token": "Those"}, {"rule": "PSTE-G1", "message": "passive voice 'is assigned'; name the actor", "excerpt": "Those puzzles and solutions are CLVM code, and each is assigned a cost based on the byte s", "line": 5, "column": 194, "excerpt_offset": 52, "offset": 255, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'was removed'; name the actor", "excerpt": "The verification was removed on the assumption that running the MempoolItem as a block gen", "line": 11, "column": 18, "excerpt_offset": 17, "offset": 893, "token": "was"}, {"rule": "PSTE-N5", "message": "multi-word noun 'block generator already performed' over 3 words", "excerpt": "The verification was removed on the assumption that running the MempoolItem as a block gen", "line": 11, "column": 80, "excerpt_offset": 79, "offset": 955, "token": "a"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Together, the missing mempool verification and the chia_rs bug allowed a MempoolItem to ha", "line": 15, "column": 1, "excerpt_offset": 0, "offset": 1237, "token": "Together"}, {"rule": "PSTE-G1", "message": "passive voice 'was released'; name the actor", "excerpt": "**05/03/2023** \u2014 Chia blockchain version 1.8.0 was released with fixes to the mempool code", "line": 22, "column": 50, "excerpt_offset": 47, "offset": 1660, "token": "was"}, {"rule": "PSTE-G1", "message": "passive voice 'being added'; name the actor", "excerpt": "The issue was present on mainnet, where it appeared as transactions being added to the mem", "line": 31, "column": 69, "excerpt_offset": 68, "offset": 2061, "token": "being"}, {"rule": "PSTE-N2", "message": "description is 36 words, limit 25", "excerpt": "Chia monitored the mempool for these excessive-cost items and found them limited in scope ", "line": 33, "column": 1, "excerpt_offset": 0, "offset": 2220, "token": "Chia"}], "html": "# Unbound CLVM Cost Restriction on Mempool\n\n## Issue Summary\n\nBlocks contain transactions aggregated from one or more spendbundles. A spendbundle spends coins, revealing each coin&#x27;s puzzle and solution. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 28 words, limit 25\">Those</mark> puzzles and solutions are CLVM code, and each <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;is assigned&#x27;; name the actor\">is</mark> assigned a cost based on the byte size of the code and its use of operands and conditions. Every node on the network runs this CLVM code under limits on how much resource the execution may consume, enforced through restrictions on CLVM cost.\n\nThe Chia default mempool code restricts CLVM cost to 0.5 times the restriction used by consensus (that is, what a block allows). The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nVersion 1.7.1 of the mempool is missing the verification code requiring that a MempoolItem&#x27;s CLVM cost be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. Earlier versions had this code.\n\nThe verification <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;was removed&#x27;; name the actor\">was</mark> removed on the assumption that running the MempoolItem as <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;block generator already performed&#x27; over 3 words\">a</mark> block generator already performed the check, making the code redundant.\n\nSeparately, the chia_rs function `run_block_generator()` had a bug: when the byte cost exceeded the limit (5.5 billion in this case), the u64 wrapped around, effectively removing the cost limit altogether.\n\n<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 26 words, limit 25\">Together</mark>, the missing mempool verification and the chia_rs bug allowed a MempoolItem to have an unbound CLVM cost once the byte cost exceeded the limit.\n\n## Timeline\n\nAll times PST, 04/23/2023 \u2013 05/03/2023. All times are approximations.\n\n- **04/23/2023** \u2014 A community member reported on keybase that mempool items had costs exceeding `constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- **05/03/2023** \u2014 Chia blockchain version 1.8.0 <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;was released&#x27;; name the actor\">was</mark> released with fixes to the mempool code and chia_rs.\n\n## Resolution and Recovery\n\nVersion 1.8.0 addressed the issue by:\n\n- Reinstating the mempool verification that a MempoolItem&#x27;s CLVM cost must be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n- Fixing the chia_rs cost calculation for cases where the byte cost exceeds the limit.\n\nThe issue was present on mainnet, where it appeared as transactions <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;being added&#x27;; name the actor\">being</mark> added to the mempool above the CLVM cost threshold. Those transactions were never added to blocks, because consensus checks on CLVM cost rejected them.\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 36 words, limit 25\">Chia</mark> monitored the mempool for these excessive-cost items and found them limited in scope and only barely over the threshold, so the impact on network nodes during the period the mempool allowed them was very limited."}, "pste": {"missing": false, "pass": false, "words": 370, "findings": [{"rule": "PSTE-G1", "message": "passive voice 'were limited'; name the actor", "excerpt": "Chia found that the items were limited in scope and only slightly above the threshold.", "line": 33, "column": 102, "excerpt_offset": 26, "offset": 2302, "token": "were"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "A block includes transactions that come from one or more spendbundles. A spendbundle spend", "line": 33, "column": 163, "excerpt_offset": 0, "offset": 2363, "token": "So"}], "html": "# Unbound CLVM cost restriction on the mempool\n\n## Issue summary\n\nA block includes transactions that come from one or more spendbundles. A spendbundle spends coins. For each coin it reveals the puzzle and the solution. Puzzles and solutions are CLVM code. The code has a cost. The cost comes from the bytes of the code, and from the operands and the conditions that the code uses. Every node on the network runs the CLVM code. A CLVM cost limit restricts how many resources the run can use.\n\nThe default Chia mempool code uses a CLVM cost limit of 0.5 times the consensus limit. The consensus limit is what a block allows. The consensus constant is `&quot;MAX_BLOCK_COST_CLVM&quot;: 11000000000`.\n\nVersion 1.7.1 of the mempool does not include the check that the CLVM cost of a MempoolItem must be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`. Earlier versions include this check.\n\nA developer removed this check. The developer assumed that running the MempoolItem as a block generator already made this check, so the code was redundant.\n\nThe chia_rs function `run_block_generator()` had a bug. If the byte cost passed the limit, which is 5.5 billion here, the u64 wrapped around. The wrap removed the cost limit.\n\nThe missing mempool check and the chia_rs bug combined. Together they allowed a MempoolItem to have an unbound CLVM cost when the byte cost passed the limit.\n\n## Timeline\n\nAll times are PST. All times are approximations. The range is 04/23/2023 to 05/03/2023.\n\n1. 04/23/2023 \u2014 A community member reported mempool items with a cost above `constants.MAX_BLOCK_COST_CLVM * 0.5` in keybase.\n2. 05/03/2023 \u2014 Chia released version 1.8.0 of the blockchain. This version fixes the mempool code and chia_rs.\n\n## Resolution and recovery\n\nVersion 1.8.0 fixes the issue in two ways:\n\n1. It restores the mempool check that the CLVM cost of a MempoolItem must be `&lt;= constants.MAX_BLOCK_COST_CLVM * 0.5`.\n2. It fixes the cost calculation in chia_rs for the case where the byte cost passes the limit.\n\nThe issue was present on mainnet. It showed itself when the mempool accepted transactions above the CLVM cost threshold. Blocks did not include these transactions. The consensus checks on CLVM cost blocked them.\n\nChia watched the mempool for these mempool items with excessive CLVM cost. Chia found that the items <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;were limited&#x27;; name the actor\">were</mark> limited in scope and only slightly above the threshold. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">So</mark> the impact on nodes on the network was very limited during the time that the mempool allowed them."}}}, "runbook-etcd-restore": {"category": "runbook", "title": "Restoring, upgrading, and maintaining an etcd cluster", "prompt": "", "attribution": "Rewritten from \"Restoring, upgrading, and maintaining an etcd cluster\" by The Kubernetes Authors, used under CC-BY-4.0. Source: https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/kubernetes/website/main/content/en/docs/tasks/administer-cluster/configure-upgrade-etcd.md", "author": "The Kubernetes Authors", "licence": "CC-BY-4.0", "licenceUrl": "https://creativecommons.org/licenses/by/4.0/", "derivedLicence": "MIT", "arms": {"source": {"missing": false, "pass": false, "words": 470, "findings": [{"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If any API servers are running in your cluster, you should not attempt to", "line": 3, "column": 53, "excerpt_offset": 52, "offset": 82, "token": "should"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "CODE                    ,  CODE    ) to ensure that they don't rely on some", "line": 11, "column": 59, "excerpt_offset": 57, "offset": 434, "token": "don't"}, {"rule": "PSTE-G1", "message": "passive voice 'are taken'; name the actor", "excerpt": "etcd supports restoring from snapshots that are taken from an etcd process of", "line": 15, "column": 45, "excerpt_offset": 44, "offset": 646, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 71, "excerpt_offset": 67, "offset": 1303, "token": "should"}, {"rule": "PSTE-G1", "message": "passive voice 'be restored'; name the actor", "excerpt": "use the  CODE        option to specify to which folder the cluster should be restored:", "line": 25, "column": 78, "excerpt_offset": 74, "offset": 1310, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'be created'; name the actor", "excerpt": "where  CODE                 is a directory that will be created during the restore process", "line": 30, "column": 57, "excerpt_offset": 53, "offset": 1470, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'is slated'; name the actor", "excerpt": "The usage of  CODE     for restoring has been **deprecated** since etcd v3.5.x and is slat", "line": 33, "column": 87, "excerpt_offset": 83, "offset": 1597, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'is recommended'; name the actor", "excerpt": "It is recommended to utilize [ CODE    ]( URL                                             ", "line": 34, "column": 7, "excerpt_offset": 3, "offset": 1641, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'are changed'; name the actor", "excerpt": "If the access URLs of the restored cluster are changed from the previous", "line": 52, "column": 44, "excerpt_offset": 43, "offset": 2694, "token": "are"}, {"rule": "PSTE-G1", "message": "passive voice 'be reconfigured'; name the actor", "excerpt": "cluster, the Kubernetes API server must be reconfigured accordingly.", "line": 53, "column": 41, "excerpt_offset": 40, "offset": 2764, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'be scheduled'; name the actor", "excerpt": "can be scheduled.", "line": 64, "column": 5, "excerpt_offset": 4, "offset": 3376, "token": "be"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If the access URLs of the restored cluster are changed from the previous\ncluster, the Kube", "line": 76, "column": 1, "excerpt_offset": 0, "offset": 3735, "token": "For"}, {"rule": "PSTE-D2", "message": "paragraph has 8 sentences, limit 6", "excerpt": "If the majority of etcd members have permanently failed, the etcd cluster is\nconsidered fa", "line": 76, "column": 1, "excerpt_offset": 0, "offset": 3735, "token": "For"}], "html": "## Restoring an etcd cluster\n\nIf any API servers are running in your cluster, you <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> not attempt to\nrestore instances of etcd. Instead, follow these steps to restore etcd:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`,\n`kube-controller-manager`, `kubelet`) to ensure that they <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> rely on some\nstale data. In practice the restore takes a bit of time.  During the\nrestoration, critical components will lose leader lock and restart themselves.\n\netcd supports restoring from snapshots that <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;are taken&#x27;; name the actor\">are</mark> taken from an etcd process of\nthe [major.minor](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be present. It can\neither be a snapshot file from a previous backup operation, or from a remaining\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;be created&#x27;; name the actor\">be</mark> created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** since etcd v3.5.x and <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G1: passive voice &#x27;is slated&#x27;; name the actor\">is</mark> slated for removal from etcd v3.6.\n   It <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G1: passive voice &#x27;is recommended&#x27;; name the actor\">is</mark> recommended to utilize [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the access URLs of the restored cluster <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G1: passive voice &#x27;are changed&#x27;; name the actor\">are</mark> changed from the previous\ncluster, the Kubernetes API server must <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G1: passive voice &#x27;be reconfigured&#x27;; name the actor\">be</mark> reconfigured accordingly. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\nIf the majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;be scheduled&#x27;; name the actor\">be</mark> scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">For</mark> more details on etcd maintenance, please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n"}, "control": {"missing": false, "pass": false, "words": 357, "findings": [{"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "The Kubernetes project also recommends restarting  CODE           ,  CODE                 ", "line": 9, "column": 118, "excerpt_offset": 117, "offset": 350, "token": "don't"}, {"rule": "PSTE-G1", "message": "passive voice 'be removed'; name the actor", "excerpt": "Restoring with  CODE     is **deprecated** as of etcd v3.5.x and will be removed in etcd v", "line": 23, "column": 74, "excerpt_offset": 70, "offset": 1245, "token": "be"}, {"rule": "PSTE-G1", "message": "passive voice 'is considered'; name the actor", "excerpt": "An etcd cluster is considered failed once a majority of its members have permanently faile", "line": 43, "column": 17, "excerpt_offset": 16, "offset": 2524, "token": "is"}, {"rule": "PSTE-G1", "message": "passive voice 'be scheduled'; name the actor", "excerpt": "already-scheduled pods may keep running, but no new pods can be scheduled.", "line": 43, "column": 213, "excerpt_offset": 61, "offset": 2720, "token": "be"}], "html": "## Restoring an etcd cluster\n\nDo not restore etcd instances while any API servers are running. Instead, follow these steps:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting `kube-scheduler`, `kube-controller-manager`, and `kubelet` so they <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use stale data. The restore takes some time, and during it critical components lose their leader lock and restart themselves.\n\netcd can restore from snapshots taken by an etcd process of the same [major.minor](https://semver.org/) version. A different patch version also works. Use a restore to recover the data of a failed cluster.\n\nYou need a snapshot file before you start. It can come from a previous backup, or from a leftover [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   With [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), the `--data-dir` option sets the folder to restore into:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   `&lt;data-dir-location&gt;` is a directory created during the restore.\n\n\n   Restoring with `etcdctl` is **deprecated** as of etcd v3.5.x and will <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;be removed&#x27;; name the actor\">be</mark> removed in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   Here is the `etcdctl` version of the restore:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring.\n   Otherwise, point etcd at the new data directory and restart it after the restore:\n   in `/etc/kubernetes/manifests/etcd.yaml`, set `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`,\n   then run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples, see the\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the restored cluster&#x27;s access URLs differ from the old ones, reconfigure the Kubernetes API server: restart it with `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`, replacing `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you might need to update the load balancer instead.\n\nAn etcd cluster <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G1: passive voice &#x27;is considered&#x27;; name the actor\">is</mark> considered failed once a majority of its members have permanently failed. Kubernetes can then make no changes to its current state: already-scheduled pods may keep running, but no new pods can <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G1: passive voice &#x27;be scheduled&#x27;; name the actor\">be</mark> scheduled. To fix this, recover the etcd cluster and, if needed, reconfigure the Kubernetes API servers.\n\n\n## Upgrading etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor details, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation."}, "pste": {"missing": false, "pass": false, "words": 427, "findings": [{"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "If it is a new folder, change the etcd configuration and restart the etcd process after th", "line": 33, "column": 4, "excerpt_offset": 0, "offset": 1801, "token": "If"}], "html": "## Restore an etcd cluster\n\nDo not restore etcd instances while any API server runs in your cluster. Follow these steps instead:\n\n1. Stop *all* API server instances.\n2. Restore state in all etcd instances.\n3. Restart all API server instances.\n\nThe Kubernetes project also recommends that you restart `kube-scheduler`, `kube-controller-manager`, and `kubelet`. This makes sure that they do not use stale data. The restore takes some time. During the restore, critical components lose the leader lock and restart themselves.\n\netcd can restore from a snapshot that an etcd process of the same [major.minor](https://semver.org/) version took. etcd can also restore from a different patch version. You use a restore operation to recover the data of a failed cluster.\n\nYou need a snapshot file before you start the restore operation. The file can come from a previous backup operation, or from a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When you restore the cluster with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use the `--data-dir` option to name the folder to restore into:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   The restore creates the directory `&lt;data-dir-location&gt;`.\n\n\n   `etcdctl` restore is **deprecated** since etcd v3.5.x. etcd v3.6 will remove it. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   This example shows the `etcdctl` tool in a restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete the folder and stop the etcd process before you restore the cluster.\n   <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 26 words, limit 25\">If</mark> it is a new folder, change the etcd configuration and restart the etcd process after the restore, so that etcd uses the new data directory. First change `volumes.hostPath.path` for `name: etcd-data` in `/etc/kubernetes/manifests/etcd.yaml` to `&lt;data-dir-location&gt;`. Then run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service`, or both.\n\n\nFor more information and examples about a restore from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the access URLs of the restored cluster differ from the previous cluster, you must reconfigure the Kubernetes API server. In this case, restart the Kubernetes API servers with the flag `--etcd-servers=$NEW_ETCD_CLUSTER` in place of the flag `--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of an etcd cluster, you may need to update the load balancer instead.\n\nIf most etcd members fail permanently, the etcd cluster counts as failed. Kubernetes then cannot change its current state. The scheduled pods can continue to run, but Kubernetes cannot schedule new pods. In such cases, recover the etcd cluster. You may also need to reconfigure the Kubernetes API servers to fix the problem.\n\n\n## Upgrade etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details about an etcd upgrade, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintain etcd clusters\n\nFor more details about etcd maintenance, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation."}}}, "runbook-cassandra-repair": {"categor
