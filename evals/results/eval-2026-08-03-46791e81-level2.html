e"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go ahead'; use 'start'", "excerpt": "Django, you're ready to go ahead and :doc:", "line": 134, "column": 25, "excerpt_offset": 24, "offset": 4997, "token": "go"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 8, "excerpt_offset": 7, "offset": 5088, "token": "are"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "offset": 5387, "token": "was"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "If you're upgrading through more than one feature version (e.g. 2.0 to 2.2),\nit's usually ", "line": 143, "column": 1, "excerpt_offset": 0, "offset": 5539, "token": "decorator"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "In most cases it will be necessary to upgrade to the latest version of your\nDjango-related", "line": 143, "column": 1, "excerpt_offset": 0, "offset": 5539, "token": "decorator"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If you are using caching provided by Django, you should consider clearing your\ncache after", "line": 143, "column": 1, "excerpt_offset": 0, "offset": 5539, "token": "decorator"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;are fixed&#x27;; name the actor\">are</mark> fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G1: passive voice &#x27;are automated&#x27;; name the actor\">are</mark> automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward, you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;were made&#x27;; name the actor\">were</mark> made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G1: passive voice &#x27;be needed&#x27;; name the actor\">be</mark> needed for a successful upgrade.\n\nIf <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G1: passive voice &#x27;is recommended&#x27;; name the actor\">is</mark> recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\nIn most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G1: passive voice &#x27;are released&#x27;; name the actor\">are</mark> released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G1: passive voice &#x27;are silenced&#x27;; name the actor\">are</mark> silenced by default. You must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;set&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-G1: passive voice &#x27;is set&#x27;; name the actor\">is</mark> <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;set&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\nIf you <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django, you <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not guaranteed to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly via the :func:`~django.views.decorators.cache.cache_page`\n<mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">decorator</mark>.\n"}, "control": {"missing": false, "pass": false, "words": 638, "findings": [{"rule": "PSTE-G1", "message": "passive voice 'are fixed'; name the actor", "excerpt": "Bugs are fixed.", "line": 8, "column": 8, "excerpt_offset": 5, "offset": 229, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're upgrading across more than one feature version (say, 2.0 to 2.2), it's", "line": 39, "column": 4, "excerpt_offset": 3, "offset": 1331, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "If you're upgrading across more than one feature version (say, 2.0 to 2.2), it's", "line": 39, "column": 77, "excerpt_offset": 76, "offset": 1404, "token": "it's"}, {"rule": "PSTE-N3", "message": "contraction 'You'll'", "excerpt": "You'll usually need to upgrade your Django-related dependencies as well.", "line": 49, "column": 1, "excerpt_offset": 0, "offset": 1698, "token": "You'll"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "Django version came out recently, or if some of your dependencies aren't", "line": 50, "column": 67, "excerpt_offset": 66, "offset": 1844, "token": "aren't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't", "line": 69, "column": 8, "excerpt_offset": 7, "offset": 2488, "token": "don't"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't", "line": 69, "column": 67, "excerpt_offset": 66, "offset": 2547, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "versions, so warnings from installed packages aren't necessarily a problem.", "line": 81, "column": 47, "excerpt_offset": 46, "offset": 2952, "token": "aren't"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "a package doesn't support the latest Django version, consider raising an issue", "line": 82, "column": 11, "excerpt_offset": 10, "offset": 2995, "token": "doesn't"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'set'", "excerpt": "With the new environment set up, :doc:`run your application's full test suite", "line": 103, "column": 26, "excerpt_offset": 25, "offset": 3527, "token": "set"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're upgrading to an alpha, beta, or release candidate, see our guide on", "line": 116, "column": 4, "excerpt_offset": 3, "offset": 3965, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Once you're confident your app works with the new version of Django, :doc:`deploy", "line": 122, "column": 6, "excerpt_offset": 5, "offset": 4150, "token": "you're"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Otherwise you may hit problems \u2014 for instance, if you cache pickled", "line": 126, "column": 43, "excerpt_offset": 31, "offset": 4394, "token": "\u2014"}, {"rule": "PSTE-N3", "message": "contraction 'aren't'", "excerpt": "objects, since those objects aren't guaranteed to be pickle-compatible across", "line": 127, "column": 30, "excerpt_offset": 29, "offset": 4460, "token": "aren't"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "One past example was caching pickled", "line": 128, "column": 35, "excerpt_offset": 17, "offset": 4543, "token": "was"}, {"rule": "PSTE-D2", "message": "paragraph has 10 sentences, limit 6", "excerpt": "If you use caching provided by Django, consider clearing your cache after\nupgrading. Other", "line": 130, "column": 12, "excerpt_offset": 0, "offset": 4652, "token": "~"}], "html": "========================================\nUpgrading Django to a newer version\n========================================\n\nUpgrading Django to the latest version has several benefits:\n\n* You get new features and improvements.\n* Bugs <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G1: passive voice &#x27;are fixed&#x27;; name the actor\">are</mark> fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release keeps your code base current and makes future\n  upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page highlights automated upgrade helpers.\n\nThe sections below cover what to consider for a smooth upgrade.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nNext, learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for every &#x27;final&#x27; release\n  from the one after your current version up to and including the version you\n  plan to upgrade to.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nLook closely at backwards incompatible changes, so you know what the upgrade\nwill require.\n\nIf <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading across more than one feature version (say, 2.0 to 2.2), <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark>\nusually easier to go one feature release at a time (2.0 to 2.1 to 2.2) than to\nmake all the changes at once. For each feature release, use the latest patch\nrelease (for 2.1, that&#x27;s 2.1.15).\n\nUpgrade one step at a time when moving from one LTS to the next, too.\n\nDependencies\n============\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;You&#x27;ll&#x27;\">You&#x27;ll</mark> usually need to upgrade your Django-related dependencies as well. If the\nDjango version came out recently, or if some of your dependencies <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark>\nwell-maintained, they may not support the new Django version yet. In that case\nyou may have to wait for new versions of those dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, clear any deprecation warnings your project raises on your\ncurrent version of Django. Fixing them first tells you which parts of your code\nneed to change.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\ncommand line option or the :envvar:`PYTHONWARNINGS` environment variable. For\nexample, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use the Django test runner, make sure console output <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark>\ncaptured, since that hides deprecation warnings. With `pytest\n&lt;https://docs.pytest.org/&gt;`__, for example:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue.\n\nThird party applications may use deprecated APIs to support multiple Django\nversions, so warnings from installed packages <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> necessarily a problem. If\na package <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest Django version, consider raising an issue\nor sending a pull request.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. If you use a\n:mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, consider setting\nup a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;set&#x27;\">set</mark> up, :doc:`run your application&#x27;s full test suite\n&lt;/topics/testing/overview&gt;`. Turn deprecation warnings on again so they appear\nin the test output (the flag also works if you test manually with ``manage.py\nrunserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures. While the release notes are fresh in your mind, this is also a\ngood time to use new Django features and refactor away any deprecation\nwarnings.\n\nIf <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases` for tips on catching regressions and reporting bugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works with the new version of Django, :doc:`deploy\n&lt;/howto/deployment/index&gt;` your upgraded project.\n\nIf you use caching provided by Django, consider clearing your cache after\nupgrading. Otherwise you may hit problems <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for instance, if you cache pickled\nobjects, since those objects <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> guaranteed to be pickle-compatible across\nDjango versions. One past example <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled\n:class:`~django.http.HttpResponse` objects, either directly or indirectly via\nthe :func:`<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-D2: paragraph has 10 sentences, limit 6\">~</mark>django.views.decorators.cache.cache_page` decorator."}, "pste": {"missing": false, "pass": false, "words": 695, "findings": [{"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'set'", "excerpt": "set up a new environment with all the dependencies.", "line": 91, "column": 1, "excerpt_offset": 0, "offset": 3451, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'set'", "excerpt": "After you set up the new environment, :doc:`run the full test suite", "line": 104, "column": 11, "excerpt_offset": 10, "offset": 3688, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'turn on'; use 'enable'", "excerpt": "Turn on deprecation warnings", "line": 105, "column": 51, "excerpt_offset": 0, "offset": 3796, "token": "Turn"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "If you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade thro", "line": 133, "column": 1, "excerpt_offset": 0, "offset": 4958, "token": "decorator"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "In most cases you must also upgrade your Django-related dependencies to their\nlatest versi", "line": 133, "column": 1, "excerpt_offset": 0, "offset": 4958, "token": "decorator"}, {"rule": "PSTE-D2", "message": "paragraph has 12 sentences, limit 6", "excerpt": "If you use caching from Django, consider clearing your cache after the upgrade.\nAn old cac", "line": 133, "column": 1, "excerpt_offset": 0, "offset": 4958, "token": "decorator"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrade Django to the latest version for these reasons:\n\n* You get new features and improvements.\n* Django fixes bugs.\n* Old Django versions stop getting security updates\n  (see :ref:`supported-versions-policy`).\n* Each upgrade keeps your code base current. Later upgrades then cost less\n  work.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a large ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page shows automated upgrade helpers.\n\nRead the points below before you upgrade.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nThen learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release.\n  Start with the release after your current Django version. Stop at the version\n  that you plan to upgrade to. Include that version.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nRead the backwards incompatible changes with care. They show you what a\nsuccessful upgrade needs.\n\nIf you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade through each feature release one step at a time. Go from 2.0 to 2.1,\nthen 2.1 to 2.2. This is usually easier than making all the changes at once.\nFor each feature release, use the latest patch release. For 2.1, use 2.1.15.\n\nUse the same step-by-step method when you upgrade from one LTS to the next.\n\nDependencies\n============\n\nIn most cases you must also upgrade your Django-related dependencies to their\nlatest versions. Some dependencies may not support the new Django version yet.\nThis happens when Django released the version recently, or when nobody\nmaintains the dependency well. In these cases you may have to wait for new\nversions of your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises\non your current version of Django. Fix these warnings first. You then know\nwhich parts of the code you must change.\n\nPython hides deprecation warnings by default. Turn them on with the ``-Wa``\nPython command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while you run tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, also make sure that nothing captures\nthe console output. Captured output hides deprecation warnings. For example, if\nyou use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue the upgrade.\n\nThird party applications may use deprecated APIs to support several versions of\nDjango. A deprecation warning in a package that you installed does not always\nmean a problem. If a package does not support the latest version of Django,\nconsider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`. If\nyou use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, first\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;set&#x27;\">set</mark> up a new environment with all the dependencies.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;set&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings\nagain so the test output shows them. You can also use the flag if you test your\napp by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures after you run the tests. The release notes are fresh in your\nmind now. This is also a good time to use new features in Django. Refactor your\ncode to remove any deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more specific tips. The tips help you\ncatch regressions and report bugs.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\nIf you use caching from Django, consider clearing your cache after the upgrade.\nAn old cache can cause problems. For example, pickled objects are not\nguaranteed to be pickle-compatible across Django versions. One past\nincompatibility was the cache of pickled\n:class:`~django.http.HttpResponse` objects. This happened directly, and also\nindirectly through the :func:`~django.views.decorators.cache.cache_page`\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">decorator</mark>."}}}, "postmortem-chia-mempool-fastforward": {"category": "incident report", "title": "Block creation impacted due to mempool issues", "prompt": "", "attribution": "Rewritten from \"Block creation impacted due to mempool issues\" by Chia Network Inc., used under Apache-2.0. Source: https://raw.githubusercontent.com/Chia-Network/post-mortem/main/2025-02/2025-02-25-block_production_impact_due_FastForward_mempool_issues.md. This text is a modification of the original.", "url": "https://raw.githubusercontent.com/Chia-Network/post-mortem/main/2025-02/2025-02-25-block_production_impact_due_FastForward_mempool_issues.md", "author": "Chia Network Inc.", "licence": "Apac
