aring your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward, you <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. You must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django, you <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not guaranteed to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly via the :func:`~django.views.decorators.cache.cache_page`\ndecorator.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 657, "findings": [{"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're upgrading across more than one feature version (for example, 2.0 to", "line": 39, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 1365, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'it's'", "excerpt": "2.2), it's usually easier to go one feature release at a time (2.0 to 2.1 to", "line": 40, "column": 7, "excerpt_offset": 6, "severity": "MUST", "arbitrated": false, "offset": 1446, "token": "it's"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Some may not support the new Django version yet \u2014 this happens", "line": 50, "column": 66, "excerpt_offset": 48, "severity": "SHOULD", "arbitrated": false, "offset": 1877, "token": "\u2014"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "when the Django version is new or when a dependency isn't well-maintained.", "line": 51, "column": 53, "excerpt_offset": 52, "severity": "MUST", "arbitrated": false, "offset": 1944, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't", "line": 69, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 2546, "token": "don't"}, {"rule": "PSTE-N3", "message": "contraction 'isn't'", "excerpt": "If you don't use the Django test runner, make sure console output isn't", "line": 69, "column": 67, "excerpt_offset": 66, "severity": "MUST", "arbitrated": false, "offset": 2605, "token": "isn't"}, {"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "versions, so warnings from installed packages don't always mean something is", "line": 81, "column": 47, "excerpt_offset": 46, "severity": "MUST", "arbitrated": false, "offset": 3004, "token": "don't"}, {"rule": "PSTE-N3", "message": "contraction 'doesn't'", "excerpt": "If a package doesn't support the latest version of Django, consider", "line": 82, "column": 21, "excerpt_offset": 13, "severity": "MUST", "arbitrated": false, "offset": 3055, "token": "doesn't"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "With the new environment set up, :doc:`run the full test suite", "line": 103, "column": 26, "excerpt_offset": 25, "severity": "MUST", "arbitrated": false, "offset": 3590, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'turn on'; use 'enable'", "excerpt": "Turn on deprecation warnings", "line": 104, "column": 51, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3678, "token": "Turn"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are upgrading'", "excerpt": "If you are upgrading to an alpha, beta, or release candidate, see our guide on", "line": 116, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 4073, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Once you're confident your app works with the new version of Django, you're", "line": 123, "column": 6, "excerpt_offset": 5, "severity": "MUST", "arbitrated": false, "offset": 4255, "token": "you're"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "Once you're confident your app works with the new version of Django, you're", "line": 123, "column": 70, "excerpt_offset": 69, "severity": "MUST", "arbitrated": false, "offset": 4319, "token": "you're"}, {"rule": "PSTE-D2", "message": "paragraph has 10 sentences, limit 6", "excerpt": "If you use caching provided by Django, consider clearing your cache after\nupgrading. Other", "line": 126, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4399, "token": "If"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "Otherwise you may run into problems \u2014 for example, if you cache", "line": 127, "column": 48, "excerpt_offset": 36, "severity": "SHOULD", "arbitrated": false, "offset": 4520, "token": "\u2014"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release keeps your code base current and makes\n  future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page highlights automated upgrade helpers.\n\nHere is what to consider to make your upgrade go smoothly.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nNext, learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for every &#x27;final&#x27; release,\n  starting with the one after your current Django version and ending with the\n  version you plan to upgrade to.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nPay close attention to backwards incompatible changes, so you know what the\nupgrade will require.\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading across more than one feature version (for example, 2.0 to\n2.2), <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to go one feature release at a time (2.0 to 2.1 to\n2.2) than to make all the changes at once. For each feature release, use the\nlatest patch release (for 2.1, use 2.1.15).\n\nUpgrade one step at a time when moving from one LTS to the next, too.\n\nDependencies\n============\n\nUsually you also need to upgrade your Django-related dependencies to their\nlatest versions. Some may not support the new Django version yet <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> this happens\nwhen the Django version is new or when a dependency <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> well-maintained. In\nthat case, wait until new versions of those dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, resolve any deprecation warnings your project raises on your\ncurrent version of Django. Fixing them first tells you which parts of your code\nneed changing.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\nPython command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use the Django test runner, make sure console output <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark>\ncaptured, since that would hide the warnings. For example, with `pytest\n&lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before\nmoving on.\n\nThird party applications may use deprecated APIs to support multiple Django\nversions, so warnings from installed packages <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> always mean something is\nwrong. If a package <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version of Django, consider\nraising an issue or sending a pull request.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. If you use a\n:mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, consider setting\nup a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on deprecation warnings\nagain so they appear in the test output (you can also use the flag when testing\nyour app manually with ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any test failures. While the release notes are fresh in your mind, this is\nalso a good time to use new Django features and refactor your code to eliminate\ndeprecation warnings.\n\nIf you <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases` for tips on catching regressions and reporting\nbugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works with the new version of Django, <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark>\nready to :doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded project.\n\n<mark id=\"f 5, "agreement": 0.2, "located": true, "line": 80, "column": 1, "offset": 2882}], "semanticConfirmed": 1}, "pste": {"missing": false, "pass": false, "words": 733, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "If you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade thro", "line": 39, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1380, "token": "If"}, {"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "In most cases you must also upgrade your Django-related dependencies to the\nlatest version", "line": 50, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1809, "token": "In"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "set up a new environment with all the dependencies.", "line": 92, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3563, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'set up'; use 'install'", "excerpt": "After you set up the new environment, :doc:`run the full test suite", "line": 106, "column": 11, "excerpt_offset": 10, "severity": "MUST", "arbitrated": false, "offset": 3808, "token": "set"}, {"rule": "PSTE-G8", "message": "phrasal verb 'turn on'; use 'enable'", "excerpt": "Turn on the deprecation", "line": 107, "column": 51, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3916, "token": "Turn"}, {"rule": "PSTE-D2", "message": "paragraph has 13 sentences, limit 6", "excerpt": "If you use the caching that Django gives, clear your cache after the upgrade.\nIf you do no", "line": 129, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4683, "token": "If"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nAn upgrade to the latest version of Django gives you these benefits:\n\n* You get new features and improvements.\n* Bugs are fixed.\n* Old versions of Django stop receiving security updates in the end\n  (see :ref:`supported-versions-policy`).\n* An upgrade with each new release keeps your code base current. It also makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a large ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page shows automated upgrade helpers.\n\nRead the points below to make your upgrade smooth.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nAfter that, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release. Start\n  with the release after your current Django version. Finish with the version\n  that you plan to upgrade to.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nGive particular attention to the backwards incompatible changes. They show you\nwhat a successful upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">If</mark> you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade through each feature release one at a time. Go from 2.0 to 2.1, then\n2.1 to 2.2. This is usually easier than all the changes for each feature\nrelease at once. For each feature release, use the latest patch release. For\n2.1, use 2.1.15.\n\nUse the same step by step approach when you upgrade from one LTS to the next.\n\nDependencies\n============\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to the\nlatest version. Some of your dependencies may not yet support the new Django\nversion. This happens when Django released the version recently. It also\nhappens when someone does not maintain a dependency well. In these cases you\nmay have to wait for the new versions of your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises\non your current version of Django. This tells you which areas of the code you\nmust change.\n\nPython silences deprecation warnings by default. You must turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show the warnings while you run the tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, you may also need to make sure that\nnothing captures the console output. Captured output hides the deprecation\nwarnings. For example, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue the upgrade.\n\nThird party applications may use deprecated APIs to support several versions of\nDjango. A deprecation warning in a package that you installed does not\nnecessarily show a problem. If a package does not support the latest version of\nDjango, raise an issue or send a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`. If\nyou use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, first\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">Turn</mark> on the deprecation\nwarnings again so that the test output shows them. You can also use the flag\nwhen you test your app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you run the tests, fix every failure. The release notes are fresh in your\nmind, so this is also a good time to use the new features in Django. Refactor\nyour code to remove any deprecation warnings.\n\nIf you upgrade to an alpha, a beta, or a release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more specific tips about how to catch\nregressions and report bugs.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django,\n:doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 13 sentences, limit 6\">If</mark> you use the caching that Django gives, clear your cache after the upgrade.\nIf you do not clear it, you may hit problems. For example, you may cache pickled\nobjects. Django does not guarantee that these objects stay pickle-compatible\nacross Django versions. One past incompatibility was the cache of pickled\n:class:`~django.http.HttpResponse` objects. This happened directly, and also\nindirectly through the :func:`~django.views.decorators.cache.cache_page`\ndecorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 806, "findings": [{"kind": "identifier", "severity": erity": "MUST", "arbitrated": false, "offset": 2326, "token": "have"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "This update was done in place, causing the mempool to change and propagate the fast-forwar", "line": 22, "column": 103, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2466, "token": "This"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go through'; use 'read'", "excerpt": "Trying to stop the spread by melting the singleton makes the transactions not go through, ", "line": 27, "column": 81, "excerpt_offset": 78, "severity": "MUST", "arbitrated": false, "offset": 3157, "token": "go"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "Farmers trying to create a block with the affected mempool items would experience performa", "line": 28, "column": 3, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3412, "token": "Farmers"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "Due to the decentralized nature of the Chia blockchain with different configurations and v", "line": 54, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4519, "token": "Due"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Version 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block ", "line": 56, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4732, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Version 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast F", "line": 58, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4999, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5290, "token": "When"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5460, "token": "When"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. Additionally, block production slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "pass": false, "words": 757, "findings": [{"rule": "PSTE-N2", "message": "description is 36 words, limit 25", "excerpt": "A farmer eligible to create the next block has a limited time \u2014 roughly 28 seconds \u2014 to bu", "line": 5, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 70, "token": "A"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "A farmer eligible to create the next block has a limited time \u2014 roughly 28 seconds \u2014 to bu", "line": 5, "column": 63, "excerpt_offset": 62, "severity": "SHOULD", "arbitrated": false, "offset": 132, "token": "\u2014"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "Farmers pull transactions from the mempool ordered by fee per cost and add them to the unf", "line": 7, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 279, "token": "Farmers"}, {"rule": "PSTE-X1", "message": "semicolon; writ nfinished block and get it, via network propagation, to a timelord that will infuse it into a finished block.\n\n<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 32 words, limit 25\">Farmers</mark> pull transactions from the mempool ordered by fee per cost and add them to the unfinished block, so the fees attached to those transactions go to the farmer making the block.\n\nCNI observed that the mempool was completely full, yet transactions were not making it into blocks. Block production also slowed relative to the expected rate. The cause: farmers eligible to create blocks were not finishing their unfinished blocks in time, because of several bugs in the mempool&#x27;s fast forward spend logic.\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis is what allows offer files to refer to singletons by coin ID even though the coin ID changes on every state update.\n\nFast forward spends are also used for vaults. The vault singleton authorizes every coin belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward lets multiple spends of the vault singleton sit in the mempool at once<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> farmers deduplicate and rebase them sequentially as they build blocks.\n\nCNI traced the slowdown to three root causes:\n\n* 1. A fast forward spend does not become invalid simply because its coin is spent \u2014 it can be fast-forwarded to the latest version of the singleton. <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G7: nominalization &#x27;Eviction of&#x27;; use a verb\">Eviction</mark> of fast-forward spends therefore depends on other parts of the spend bundle (for example, that coin being spent by a block). We did not consider the case where a bundle&#x27;s only spend was a fast-forward spend: it would not be evicted after the singleton was melted.\n* 2. FF-spends enter the mempool even when their coin is already spent, on the assumption that block formation will fast-forward them onto the singleton&#x27;s latest version. But we never validated that the singleton still existed, so we accepted singleton spends for singletons that <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer existed.\n* 3. During block formation, FF spends were updated to spend the singleton&#x27;s most recent coin. That update happened in place, changing the mempool and propagating the fast-forwarded versions of the item to the rest of the network. Every time a farmer tried to form a block, the mempool item duplicated \u2014 doubling in number.\n\nTogether, these three bugs meant that anyone submitting a fast-forward-eligible singleton spend that was not bundled with any other spend would see the following:\n\n* The spend was considered valid, entered the mempool, and propagated across the network.\n* Every time a farmer made a block, the spend multiplied, propagating new transactions across the network (bug 3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but did not evict the spends from the mempool (bug 2). In our case, the mempool was full of these spends when this happened. All of them failed during block creation, so farmers timed out before finding any valid transactions.\n* Farmers attempting to build a block from the affected mempool items hit performance problems and missed the cutoff for getting their block into the blockchain.\n\n## Timeline\n\nAll times PST, 02/13/2025 \u2013 02/19/2025. All times are approximations.\n\n02-13-2025 11:00 pm \u2014 Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am \u2014 Mempool cost hit max cost.\n\n02-14-2025 1:10 pm \u2014 Mempool spendbundle count plateaued at ~6200.\n\n02-14-2025 4:45 pm <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Chia blockchain netspace started decreasing<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> timelord infused blocks per minute dropped markedly.\n\n02-14-2025 11:00 pm <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> CNI diagnosed the cause and prepared a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am \u2014 Build process for the hotfix release started.\n\n02-15-2025 3:00 am \u2014 Hotfix deployment completed as version 2.5.1.\n\n02-19-2025 3:15 pm <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Version 2.5.2 released, including the fixes for the fast forward issues described above.\n\n## Resolution and Recovery\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 26 words, limit 25\">Because</mark> the Chia blockchain is decentralized, with many nodes running different configurations and versions, most of the blockchain netspace was unaffected by the fast forward issues.\n\nVersion 2.5.1 added a workaround that caps unfinished block creation time, ensuring the unfinished block reaches a timelord promptly. Netspace began recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 shipped fixes that invalidated the mempool items created by the fast forward issues<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> the mempool cleared of them as users adopted v2.5.2. The fixes were:\n\n* 1. Spend bundles submitted to the mempool that contain only fast-forward spends are rejected.\n* 2. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> a spend is &quot;rebased&quot; onto the latest version of the singleton, we no longer update the item in the mempool, which <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G4: perfect tense &#x27;had risked&#x27;; use simple past\">had</mark> risked distributing the new copy to the network.\n* 3. <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 27 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any fast-forward-eligible spend is validated to confirm the latest version of that singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 858, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 11 conditions, the rewrite 8. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-G7", "quote": "Eviction of fast-forward spends therefore depends on other parts", "problem": "The sentence nominalizes 'evict' into 'Eviction of' as the subject instead of using the verb to describe the action.", "fix": "Write 'We evict fast-forward spends based on other parts of the spend bundle' instead.", "reason": "PSTE-G7 requires a verb, not a noun, to describe an action; turning 'evict' into 'eviction' is the same fault as the rule's own example ('a failure of the service occurred').", "confidence": "high", "status": "confirmed", "seenIn": 5, "of": 5, "agreement": 1.0, "located": true, "line": 19, "column": 151, "offset": 1542}, {"rule": "PSTE-X3", "quote": "Fast forward spends are also used for vaults", "problem": "'Fast forward' modifies the noun 'spends' as one unit but is left unhyphenated, while the same document correctly hyphenates the identical compound elsewhere ('fast-forward spends', 'fast-forward-eligible').", "fix": "Write \"Fast-forward spends are also used for vaults.\"", "reason": "PSTE-X3 requires a hyphen connecting words acting as one unit before a noun, and the document's own correctly hyphenated instances confi function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also

function semanticSectionHtml(a) {
  const rows = a.semantic || [];
  if (!rows.length) return "";
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span></span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed").length;
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>

      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.</p>
      <ol>${items}</ol>
    </div>`;
}

    const verdict = a.pass
      ? '<span class="verdict pass">PASS</span>'
      : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

// ---- Overview -------------------------------------------------------------

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);
  bits.push("<b>passes</b>" + r.passes);
  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);
  bits.push("<b>level</b>" + DATA.level);
  if (r.sourceModels && r.sourceModels.length)
    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
  if (r.failures) bits.push('<b>failures</b><span class="cell-fail">'
      + r.failures + "</span>");

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      // Every pass, and the share of them that conform. One draw cannot separate a
      // real change from ordinary variance, so the runs are shown beside the count.
      let sub = c.rules + " rule" + (c.rules === 1 ? "" : "s");
      if (c.of > 1) {
        sub += ' <span class="rate">' + c.passed + "/" + c.of + " pass "
             + c.rate + "%</span>"
             + '<div class="runs">' + c.runs.join(" \u00b7 ") + "</div>";
      }
      // Fact loss reads apart from the conformance count: a clean-but-lossy
      // cell (0 findings, factLoss true) must not look like a plain PASS, and
      // a lossy-and-non-conforming cell must show both, not just one number.
      const factTag = c.factLoss
        ? ' <span class="verdict factloss" title="faithfulness.py: a fact from '
          + 'the source is missing. Detects dropped tokens, not changed '
          + 'meaning.">FACT LOSS</span>'
        : "";
      // A CONFIRMED judge finding (semantic_lint.py) fails the verdict the same
      // way fact loss does. Low-agreement and rejected rows never do — they are
      // audit material, visible only on the document view.
      const semTag = c.semanticConfirmed
        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      const semSub = c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";
      body += '<td class="' + (c.pass ? "cell-pass" : "cell-fail") + win + '">'
            + (c.pass ? "PASS" : c.findings) + factTag + semTag
            + '<div class="cell-sub">' + sub + "</div>" + semSub
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  // Real documents and synthetic ones are totalled separately, and both stay
  // visible. Real is the headline: it is what generalises to writing this
  // project did not itself produce. Synthetic is secondary, not hidden.
  function totalRow(label, totals) {
    let row = '<tr><td class="doc">' + esc(label) + "</td>";
    for (const a of arms) {
      const t = totals[a] || {pass:0,total:0,findings:0,runPass:0,runTotal:0,factLoss:0,semanticConfirmed:0};
      if (!t.total) { row += "<td>-</td>"; continue; }
      let f = t.pass + "/" + t.total + " docs";
      if (t.runTotal > t.total) {
        f += '<div class="rate">' + t.runPass + "/" + t.runTotal + " runs "
           + Math.round(t.runPass * 100 / t.runTotal) + "%</div>";
      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      row += "<td>" + t.findings + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth);

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. FACT LOSS marks a cell where faithfulness.py found a number, unit, "
    + "identifier, negation, or obligation missing against the source (PSTE-A1) "
    + "— that check catches dropped tokens, not changed meaning, so its "
    + "absence is not proof the rewrite is faithful. The green outline marks the "
    + "arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
