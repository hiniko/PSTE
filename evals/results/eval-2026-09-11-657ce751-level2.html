he after", "line": 137, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5081, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are using'", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 5088, "token": "are"}, {"rule": "PSTE-P1", "message": "'you should' is not the imperative form; write the instruction as a command", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 44, "excerpt_offset": 43, "severity": "MUST", "arbitrated": false, "offset": 5124, "token": ","}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you\n<mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are caching&#x27;\">are</mark> caching pickled objects as these objects are not guaranteed to be\npickle-compatible across Django versions. A past instance of incompatibility\n<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled :class:`~django.http.HttpResponse` objects, either directly\nor indirectly via the :func:`~django.views.decorators.cache.cache_page`\ndecorator.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 726, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "If you're upgrading across more than one feature version (e.g. 2.0 to 2.2),\nit's usually e", "line": 40, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1388, "token": "If"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "If you're upgrading across more than one feature version (e.g.", "line": 40, "column": 4, "excerpt_offset": 3, "severity": "MUST", "arbitrated": false, "offset": 1391, "token": "you're"}, {"rule": "PSTE-V8", "message": "Latin abbreviat r guide on", "line": 121, "column": 8, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 4392, "token": "are"}, {"rule": "PSTE-N3", "message": "contraction 'you're'", "excerpt": "you're ready to :doc:", "line": 129, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4653, "token": "you're"}, {"rule": "PSTE-D2", "message": "paragraph has 11 sentences, limit 6", "excerpt": "If you use caching provided by Django, consider clearing your cache after\nupgrading. Other", "line": 132, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4740, "token": "If"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "One past case of this was caching pickled", "line": 135, "column": 47, "excerpt_offset": 22, "severity": "MUST", "arbitrated": false, "offset": 5008, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version gives you several benefits:\n\n* You get new features and improvements.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release keeps your code base current and makes\n  future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. You can find automated upgrade helpers\n    on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nThe steps below will help make your upgrade as smooth as possible.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;` first.\n\nNext, learn what changed in the new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release,\n  starting from the one after your current Django version and ending with the\n  version you plan to upgrade to.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes. They show you what\nwork the upgrade will need.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading across more than one feature version (<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade one feature release at a time (2.0 to 2.1 to\n2.2) rather than making all the changes at once. For each feature release, use\nthe latest patch release (<mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. for 2.1, use 2.1.15).\n\nThe same one-step-at-a-time approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases you will also need to upgrade your Django-related dependencies\nto their latest versions. If the Django version was released recently, or if\nsome of your dependencies are not well-maintained, some of them may not yet\nsupport the new Django version. In that case you may have to wait until new\nversions of those dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to fix any deprecation warnings your project\nraises with your current version of Django. Fixing them first tells you which\nparts of your code need to change.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\nPython command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may also need to make sure\nconsole output is not captured, since that would hide the deprecation\nwarnings. For example, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nFix all deprecation warnings with your current version of Django before you\ncontinue the upgrade.\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Third</mark> party applications may use deprecated APIs on purpose so they can\nsupport multiple versions of Django. So deprecation warnings from packages\n<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> necessarily mean there is a problem. If a package\n<mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version of Django, consider raising an issue or\nsending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\nIf you <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using a :mod:`virtual environment &lt;venv&gt;` and this is a major\nupgrade, you might want to <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies\nfirst.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nOnce the new environment is <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings so they appear in the test output (you can also use\nthe flag if you test your app manually with ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter running the tests, fix any failures. While the release notes are still\nfresh in your mind, this is also a good time to take advantage of new Django\nfeatures by refactoring your code to remove any deprecation warnings.\n\nIf you <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate, see our guide on\n:ref:`testing-pre-releases` for specific tips on catching regressions and\nreporting bugs.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django,\n<mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to :doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django\nproject.\n\n<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you use caching provided by Django, consider clearing your cache after\nupgrading. Otherwise you may run into problems. For example, if you cache\npickled objects, those objects are not guaranteed to be pickle-compatible\nacross Django versions. One past case of this <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled\n:class:`~django.http.HttpResponse` objects, either directly or indirectly via\nthe :func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 806, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 26. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "you are confident that your app works with the new version", "problem": "The rewrite drops the degree qualifier \"sufficiently\" from \"sufficiently confident,\" turning a stated confidence threshold into plain confidence.", "fix": "Write \"When you are sufficiently confident your app works with the new version of Django...\" to keep the threshold qualifier.", "reason": "PSTE-A1 forbids dropping any scope qualifier, and \"sufficiently\" qualifies how much confidence is needed before deploying.", "confidence": "high", "status": "confirmed", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 128, "column": 6, "offset": 4583}, {"rule": "PSTE-X3", "quote": "Pay particular attention to backwards incompatible changes.", "problem": "\"backwards incompatible\" functions as one compound modifier before the noun \"changes\" but is not hyphenated.", "fix": "Write \"backwards-incompatible changes\".", "reason": "PSTE-X3 requires a hyphen connecting words that act as one u o problems.", "problem": "No warning precedes the caching guidance even though skipping the cache-clear step can serve broken or incompatible data from a production system.", "fix": "Add an explicit warning before the caching advice, stating the production risk of not clearing the cache.", "reason": "PSTE-W1 requires a warning before an operation (or omission) that affects a shared or production system, and stale incompatible cache entries fit that description.", "confidence": "medium", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 133, "column": 12, "offset": 4825}, {"rule": "PSTE-W2", "quote": "consider clearing your cache after upgrading", "problem": "The command to clear the cache is given before the scope of the effect of not doing so is explained, the exact anti-pattern the rule names.", "fix": "State the effect first, e.g. \"Stale pickled cache objects can be incompatible across Django versions. Clear your cache after upgrading if you use Django's caching.\"", "reason": "PSTE-W2 requires the scope of the effect to be stated before the command, and this text states the command, then the effect.", "confidence": "high", "status": "low-agreement", "seenIn": 1, "of": 3, "agreement": 0.33, "located": true, "line": 132, "column": 40, "offset": 4779}], "semanticConfirmed": 4}, "pste": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 734, "findings": [{"rule": "PSTE-D2", "message": "paragraph has 9 sentences, limit 6", "excerpt": "You may upgrade through more than one feature version, for example 2.0 to\n2.2. In that cas", "line": 39, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1448, "token": "You"}, {"rule": "PSTE-D2", "message": "paragraph has 7 sentences, limit 6", "excerpt": "In most cases you must also upgrade your Django-related dependencies to their\nlatest versi", "line": 51, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1898, "token": "In"}, {"rule": "PSTE-G8", "message": "phrasal verb 'turn on'; use 'enable'", "excerpt": "Again, turn on deprecation", "line": 107, "column": 58, "excerpt_offset": 7, "severity": "MUST", "arbitrated": false, "offset": 3979, "token": "turn"}, {"rule": "PSTE-D2", "message": "paragraph has 14 sentences, limit 6", "excerpt": "If you use the cache that Django provides, consider a cache clear after the\nupgrade. Other", "line": 129, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4730, "token": "If"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nAn upgrade of Django to the latest version gives several benefits:\n\n* New features and improvements become available.\n* The new version fixes bugs.\n* Older versions of Django stop receiving security updates at some point\n  (see :ref:`supported-versions-policy`).\n* An upgrade at each new release keeps your code base current. It also makes\n  future upgrades easier.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has an active ecosystem. The `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page lists automated upgrade helpers.\n\nThe sections below help you make the upgrade as smooth as possible.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nAfter that, learn the changes in the new Django version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release.\n  Start with the release after your current Django version. Stop at the\n  version that you plan to upgrade to, and include that version.\n* Read the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to the changes that are not backwards compatible.\nThey show you what a successful upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">You</mark> may upgrade through more than one feature version, for example 2.0 to\n2.2. In that case, upgrade through each feature release in turn: 2.0 to 2.1\nto 2.2. This is usually easier than to make all the changes for every feature\nrelease at once. For each feature release, use the latest patch release (for\nexample, for 2.1, use 2.1.15).\n\nWe recommend the same step-by-step approach for an upgrade from one LTS to\nthe next.\n\nDependencies\n============\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to their\nlatest versions. Some dependencies may not yet support the new Django version.\nThis happens when the Django version is new, or when a dependency is not well\nmaintained. In these cases you may need to wait for new releases of the\ndependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, fix the deprecation warnings that your project raises with\nyour current version of Django. When you fix these warnings first, you learn\nwhich areas of the code need changes.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\nPython command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, this command shows warnings while the tests run:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, you may also need to make sure that\nnothing captures the console output. Captured output hides deprecation\nwarnings. For example, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nFix every deprecation warning with your current version of Django before you\ncontinue the upgrade.\n\nThird-party applications might use deprecated APIs so that they support\nseveral versions of Django. So a deprecation warning in a package that you\ninstalled does not always mean a problem. If a package does not support the\nlatest version of Django, consider an issue or a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`.\nIf you use a :mod:`virtual environment &lt;venv&gt;` and the upgrade is major,\nconsider a new environment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is ready, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">turn</mark> on deprecation\nwarnings so that the test output shows them. You can also use the flag when\nyou test your app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter the tests run, fix any failures. While the release notes are fresh in\nyour mind, this is also a good time to refactor your code. Use the new\nfeatures in Django to remove the deprecation warnings.\n\nIf you upgrade to an alpha, beta, or release candidate, read our guide on\n:ref:`testing-pre-releases`. It gives specific tips on how to catch\nregressions and report bugs.\n\nDeployment\n==========\n\nWhen you are confident enough that your app works with the new version of\nDjango, :doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 14 sentences, limit 6\">If</mark> you use the cache that Django provides, consider a cache clear after the\nupgrade. Otherwise you may have problems. For example, you may cache pickled\nobjects. Django does not guarantee that pickled objects stay pickle-compatible\nacross Django versions. One past case of this incompatibility was the cache of\npickled :class:`~django.http.HttpResponse` objects. That happened directly, or\nindirectly through the :func:`~django.views.decorators.cache.cache_page`\ndecorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 802, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 24. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-N4", "quote": "consider an issue or a pull request for it", "problem": "The verbs 'raising' and 'sending' were dropped, leaving 'consider an issue' and 'a pull request' with no verb saying what to do with them.", "fix": "Write \"consider raising an issue or sending a pull request for it\" to restore the missing verbs.", "reason": "PSTE-N4 forbids omitting words, including verbs, to shorten a sentence, and the omission makes 'consider an issue' read as an incomplete instruction rather than telling the reader to file one.", "confidence": "high", "status": "confirmed", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 86, "column": 27, "offset": 3400}, {"rule": "PSTE-V2", "quote": "consider a cache clear after the upgrade", "problem": "\"clear\" is used as a noun (object of \"consider\"), but Appendix A approves \"clear\" only as an adjective meaning \"easy to understand\", and its own note says the verb/noun sense \"to clear a cache\" is not covered by that entry.", "fix": "Write \"consider clearing the cache after the upgrade\" instead of nominalizing \"clear\".", "reason": "spec/appendix-a.md (line 45) and wordlist.yaml restrict \"clear\" to the adjective meaning and explicitly exclude the cache-clearing sense, so using it as a d to authorize all coins belonging to it, it would be to", "line": 16, "column": 55, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1181, "token": "Because"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Fast forward allows multiple spends of the vault singleton to be in the mempool concurrent", "line": 16, "column": 219, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1345, "token": "Fast"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "Fast forward spends don\u2019t become invalid just because their coin is spent.", "line": 20, "column": 26, "excerpt_offset": 20, "severity": "MUST", "arbitrated": false, "offset": 1631, "token": "don\u2019t"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'e.g.'; use 'for example'", "excerpt": "Fast-forward spends rely on other parts of the spend bundle for being evicted  (e.g.", "line": 20, "column": 228, "excerpt_offset": 80, "severity": "MUST", "arbitrated": false, "offset": 1833, "token": "e"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "We failed to consider the case where the only spend in a bundle was a fast-forward spend, ", "line": 20, "column": 265, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1870, "token": "We"}, {"rule": "PSTE-V8", "message": "Latin abbreviation 'i.e.'; use 'that is'", "excerpt": "I.e.", "line": 21, "column": 234, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2250, "token": "I"}, {"rule": "PSTE-G4", "message": "perfect tense 'have been melted'; use simple past", "excerpt": "we would accept singleton spends into the mempool for singletons which have been melted an", "line": 21, "column": 310, "excerpt_offset": 71, "severity": "MUST", "arbitrated": false, "offset": 2326, "token": "have"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "This update was done in place, causing the mempool to change and propagate the fast-forwar", "line": 22, "column": 103, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 2466, "token": "This"}, {"rule": "PSTE-G8", "message": "phrasal verb 'go through'; use 'read'", "excerpt": "Trying to stop the spread by melting the singleton makes the transactions not go through, ", "line": 27, "column": 81, "excerpt_offset": 78, "severity": "MUST", "arbitrated": false, "offset": 3157, "token": "go"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "Farmers trying to create a block with the affected mempool items would experience performa", "line": 28, "column": 3, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3412, "token": "Farmers"}, {"rule": "PSTE-N2", "message": "description is 32 words, limit 25", "excerpt": "Due to the decentralized nature of the Chia blockchain with different configurations and v", "line": 54, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4519, "token": "Due"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "Version 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block ", "line": 56, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4732, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "Version 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast F", "line": 58, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4999, "token": "Version"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5290, "token": "When"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5460, "token": "When"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. Additionally, block production slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": false, "sampledOut": false, "pass": false, "words": 786, "findings": [{"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "A farmer who is eligible to create the next block has a limited time (about 28 seconds) to", "line": 5, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 61, "token": "A"}, {"rule": "PSTE-N5", "message": "multi-word noun 'mempool logic around fast forward spends' over 3 words", "excerpt": "eligible farmers were not creating unfinished blocks in time, due to several bugs in the m", "line": 9, "column": 255, "excerpt_offset": 85, "severity": "MUST", "arbitrated": true, "offset": 728, "token": "the"}, {"rule": "PSTE-N2", "message": "description is 30 words, limit 25", "excerpt": "**Fast forward spends enter the mempool even if their coin is already spent.** When a bloc", "line": 25, "column": 4, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1872, "token": "*"}, {"rule": "PSTE-G4", "message": "perfect tense 'had been melted'; use simple past", "excerpt": "We accepted singleton spends into the mempool for singletons that had been melted and no l", "line": 25, "column": 299, "excerpt_offset": 66, "severity": "MUST", "arbitrated": false, "offset": 2167, "token": "had"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "Cause performance problems for farmers trying to create a block from the affected mempool ", "line": 36, "column": 3, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3225, "token": "Cause"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "When spend bundles are ingested into the mempool, every spend eligible for fast forward is", "line": 59, "column": 4, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5081, "token": "When"}], "html": "# Block creation slowed by mempool issues\n\n## Issue summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 30 words, limit 25\">A</mark> farmer who is eligible to create the next block has a limited time (about 28 seconds) to build an unfinished block and get it, via network propagation, to a timelord. The timelord infuses the unfinished block to produce the finished block.\n\nFarmers fill the unfinished block with transactions from the mempool, ordered by fee per cost. Fees attached to those transactions go to the farmer who makes the block.\n\nCNI noticed that while the mempool was completely full, transactions were not being included in blocks. Block production also slowed below the expected rate. The cause: eligible farmers were not creating unfinished blocks in time, due to several bugs in <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\n### What fast forward spends are\n\nA fast forward spend lets a singleton transaction apply to future versions of the singleton.\n\nFast forward spends let offer files refer to singletons by coin ID, even though the coin ID changes with every state update.\n\nThey are also used for vaults. The vault singleton authorizes all coins belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward lets multiple spends of the vault singleton sit in the mempool at the same time. Farmers deduplicate them and rebase them one after another as they create blocks.\n\n### Root causes\n\nCNI found three bugs behind the block creation slowdown:\n\n1. **Fast forward spends are not invalidated when their coin is spent.** They can be fast-forwarded to the latest version of the singleton. They rely on other parts of the spend bundle to get evicted (for example, another coin in the bundle being spent by a block). We did not consider the case where the only spend in a bundle is a fast forward spend. Such a bundle would not be evicted after the singleton was melted.\n\n2. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N2: description is 30 words, limit 25\">*</mark>*Fast forward spends enter the mempool even if their coin is already spent.** When a block is formed, they are fast-forwarded on top of the latest version of the singleton. But we did not check that the singleton still existed. We accepted singleton spends into the mempool for singletons that <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer existed.\n\n3. **Fast-forwarded spends were updated in place.** When forming a block, fast forward spends were updated to spend the most recent coin of the singleton. This update changed the mempool item itself, so the fast-forwarded version was propagated to the rest of the network. The mempool item doubled in number every time a farmer tried to form a block.\n\n### How the bugs combined\n\nWith these three bugs, submitting a singleton spend that is eligible for fast forward, on its own with no other spend in the bundle, would:\n\n* Be treated as valid, enter the mempool, and propagate across the network.\n* Multiply every time a farmer made a block, with the new transactions propagating across the network (bug 3).\n* Not be stopped by melting the singleton. Melting made the transactions fail, but the spends were not evicted from the mempool (bug 2). In our case, the mempool was full of these spends when this happened. All of them failed during block creation, so farmers timed out before finding any valid transactions.\n* <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N2: description is 29 words, limit 25\">Cause</mark> performance problems for farmers trying to create a block from the affected mempool items, making them miss the cutoff for their block to be included in the blockchain.\n\n## Timeline (all times PST, 02/13/2025 \u2013 02/19/2025, all times approximate)\n\n* **02-13-2025 11:00 pm** \u2014 Mempool spend bundle count starts slowly increasing.\n* **02-14-2025 11:30 am** \u2014 Mempool cost hits max cost.\n* **02-14-2025 1:10 pm** \u2014 Mempool spend bundle count plateaus at ~6200.\n* **02-14-2025 4:45 pm** \u2014 Chia blockchain netspace starts decreasing. Timelord-infused blocks per minute drop noticeably.\n* **02-14-2025 11:00 pm** \u2014 CNI diagnoses the cause and prepares a hotfix release of the Chia blockchain software.\n* **02-15-2025 1:30 am** \u2014 Hotfix release build process starts.\n* **02-15-2025 3:00 am** \u2014 Hotfix release deployment completes as version 2.5.1.\n* **02-19-2025 3:15 pm** \u2014 Version 2.5.2 released, including the bug fixes for the fast forward issues described above.\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized, with many nodes running different configurations and versions. Because of this, most of the blockchain netspace was not affected by the fast forward issues.\n\nVersion 2.5.1 contains a workaround that caps unfinished block creation time, so the unfinished block reaches a timelord in time. Netspace started recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 includes the fixes below. These invalidated the mempool items created by the fast forward issues, and the mempool was cleared of them as users upgraded to v2.5.2.\n\n1. Spend bundles submitted to the mempool that contain only fast forward spends are rejected.\n2. When a spend is &quot;rebased&quot; on top of the latest version of the singleton, the item in the mempool is not updated. This avoids the risk of distributing the new copy to the network.\n3. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> spend bundles are ingested into the mempool, every spend eligible for fast forward is checked to ensure the latest version of the singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 893, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [{"rule": "PSTE-G3", "quote": "transactions were not being included in blocks", "problem": "This uses the past continuous passive form \"were ... being included,\" which is not one of the verb forms PSTE-G3 permits.", "fix": "Write \"transactions were not included in blocks\" using the simple past.", "reason": "PSTE-G3 restricts a writer to the infinitive, imperative, simple present, simple past, simple future, and past participle as adjective, and excludes continuous forms.", "confidence": "high", "status": "confirmed", "seenIn": 3, "of": 3, "agreement": 1.0, "located": true, "line": 9, "column": 57, "offset": 530}, {"rule": "PSTE-A3", "quote": "has a limited time (about 28 seconds) to build an unfinished block", "problem": "This 31-word description sentence was not split even though the time limit and the build/propagate actions can be stated as two sentences without losing any fact.", "fix": "Split into two sentences, e.g. \"A farmer who is eligible to create the next block has about 28 seconds to build an unfinished block. The farm for the slow block creation:\n\n1. A fast-forward spend does not become invalid only because its coin is spent. The farmer can fast-forward the spend to the latest version of the singleton. The mempool relies on other spends in the same bundle to evict the bundle, for example when a block spends one of those coins. We did not consider a bundle whose only spend is a fast-forward spend. The mempool did not evict such a bundle after the singleton melted.\n2. A fast-forward spend enters the mempool even when its coin is already spent. When the farmer forms a block, the farmer fast-forwards the spend on top of the latest version of the singleton. But we did not check that the singleton still existed. That is, the mempool accepted spends for singletons that were melted and no longer exist.\n3. When the farmer formed a block, the farmer updated each fast-forward spend to spend the most recent coin of the singleton. This update was made in place. So the mempool changed, and the node propagated the fast-forwarded version of the mempool item to the rest of the network. This doubled the number of copies of the mempool item every time a farmer tried to form a block.\n\nWith these three bugs, a person could submit a singleton spend that is eligible for fast forward, with no other spend in the bundle. The result:\n\n* The mempool treats the spend as valid. The spend enters the mempool and propagates through the network.\n* Every time a farmer makes a block, the farmer multiplies the spend and propagates the new transactions through the network (bug 3).\n* If someone melts the singleton to stop the spread, the transactions no longer <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through. But the mempool does not evict the spends (bug 2). In our case, the mempool was full of these spends when this happened. All of these spends failed during block creation. So farmers timed out before they found any v const pick = document.getElementById("pick");
const grid = document.getElementById("grid");
const meta = document.getElementById("meta");
const prov = document.getElementById("prov");
const ask = document.getElementById("ask");
const overviewPane = document.getElementById("overview");
const docpick = document.getElementById("docpick");
const tabOverview = document.getElementById("tab-overview");
const tabDocuments = document.getElementById("tab-documents");
const ids = Object.keys(DATA.results);

prov.textContent = DATA.git && DATA.git.short
  ? DATA.source + "  \u2014  commit " + DATA.git.short
      + " on " + (DATA.git.branch || "?")
  : DATA.source + "  \u2014  no provenance recorded";

for (const id of ids) {
  const o = document.createElement("option");
  o.value = id;
  o.textContent = id + "  (" + DATA.results[id].category + ")";
  pick.append(o);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A rewrite of a share-alike document carries that licence, and not the licence of
// this repository. Mark the column, so nobody reuses the text under the wrong terms.
function licenceTag(entry, arm) {
  const lic = arm === "source" ? entry.licence : entry.derivedLicence;
  if (!lic) return "";
  const share = /-SA-/.test(lic);
  return ' <span class="lic' + (share ? " share" : "") + '">' + esc(lic) + "</span>";
}

const STATUS_LABEL = {
  confirmed: "confirmed", "low-agreement": "low agreement", rejected: "rejected",
};

// The LLM judge (semantic_lint.py) is a different checker from pste_lint.py: it
// reads for MEANING, not a pattern, and it disagrees with itself between runs.
// Its section is styled apart from "Offenders" — a different accent colour and
// its own heading — so a reader never mistakes a judge row for a mechanical one.
// Every row shows: rule, quote, the judge's reason, and its agreement (n/N).
// Only "confirmed" rows fail the verdict; "low-agreement" and "rejected" are
// shown too, unfiltered, because they are the evidence the judge is working
// (semantic_lint.py: "report all of this so us humans understand... we also
// need reasons").
function semanticSectionHtml(a) {
  if (a.unjudged) {
    return `<div class="offenders semantic unjudged"><h3>Judge findings (semantic_lint.py)</h3>
        <p class="hint unjudged-note">UNJUDGED. The judge call for this cell failed and
        returned no result — an API limit is the usual cause. This is not "no
        findings": 52 of the standard's 77 rules need a judge, and none of them
        were checked here. Re-run the judge for this cell before treating it as
        clean.</p>
      </div>`;
  }
  const rows = a.semantic || [];
  if (!rows.length) return "";
  const items = rows.map(s => {
    const agree = (s.of != null) ? `${s.seenIn}/${s.of}` : "";
    const label = s.problem || s.reason || "";
    const quoteFlag = s.quote && !s.located
      ? '<span class="notfound" title="the judge\'s quote was not found in the '
        + 'text — this row may be invented">not found in text</span>' : "";
    return `<li class="sem sem-${esc(s.status)}">
        <span class="where">${agree}</span>
        <span class="rule">${esc(s.rule)} <span class="stat stat-${esc(s.status)}">`
        + `${esc(STATUS_LABEL[s.status] || s.status)}</span></span>
        <span class="msg">${esc(label)}
          ${s.fix ? '<br><i>fix:</i> ' + esc(s.fix) : ""}
          ${s.reason && s.problem ? '<br><i>because:</i> ' + esc(s.reason) : ""}
          ${quoteFlag}
        </span>
      </li>`;
  }).join("");
  const confirmedN = rows.filter(s => s.status === "confirmed").length;
  return `<div class="offenders semantic"><h3>Judge findings (semantic_lint.py)</h3>
      <p class="hint">A model read this text for what a regular expression cannot
      check. ${confirmedN} of ${rows.length} row(s) are CONFIRMED (agreement at or
      above the gate) and count toward the verdict above; the rest are
      low-agreement or a rule the judge actively considered and rejected — shown
      so a person can audit the judge, not to score the text. Never a
      measurement: two runs disagree.</p>
      <ol>${items}</ol>
    </div>`;
}

function draw(id) {
  const entry = DATA.results[id];
  grid.style.setProperty("--cols", DATA.arms.length);
  meta.textContent = "level " + DATA.level + " \u2014 " + entry.category
    + " \u2014 " + ids.length + (ids.length === 1 ? " document" : " documents");
  // The provenance of the source travels with the text it covers. A reader must be
  // able to reach the original, see who wrote it, and see the licence that permits
  // the rewrite. For CC-BY the notice must also say the rewrite is a modification.
  const bits = [];
  if (entry.title) {
    bits.push(entry.url
      ? '<b><a href="' + esc(entry.url) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.title) + "</a></b>"
      : "<b>" + esc(entry.title) + "</b>");
  }
  if (entry.author) bits.push(esc(entry.author));
  if (entry.licence) {
    bits.push(entry.licenceUrl
      ? '<a href="' + esc(entry.licenceUrl) + '" rel="noopener noreferrer" '
        + 'target="_blank">' + esc(entry.licence) + "</a>"
      : esc(entry.licence));
  }
  let bar = bits.join(" \u00b7 ");
  if (entry.attribution) {
    bar += '<div class="notice">' + esc(entry.attribution) + "</div>";
  }
  if (!bar && entry.prompt) bar = "<b>Asked:</b> " + esc(entry.prompt);
  ask.innerHTML = bar;
  grid.innerHTML = DATA.arms.map(arm => {
    const a = entry.arms[arm] || { missing: true };
    if (a.missing) {
      return `<section><div class="arm-head"><div class="arm-name">${esc(arm)}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")}</div></div>
        <div class="body"><p class="none">No output. The run failed for this arm.</p>
        </div></section>`;
    }
    // UNJUDGED is its own verdict, not a FAIL among others: the judging call
    // for this cell failed outright (an API limit, most often), so 52 of the
    // standard's 77 rules were never checked. It must never look like PASS
    // (a document the judge read and found clean) or an ordinary FAIL (one
    // the judge did check and objected to).
    const verdict = a.unjudged
      ? '<span class="verdict unjudged" title="the judge call for this cell '
        + 'failed and never returned a result. Mechanical and fact-loss checks '
        + 'still ran, but 52 of the standard’s 77 rules need a judge and '
        + 'were never checked. This is not a pass.">UNJUDGED</span>'
      : a.pass
        ? '<span class="verdict pass">PASS</span>'
        : '<span class="verdict fail">FAIL</span>';
    // Fact loss is its own indicator, apart from PASS/FAIL: PSTE-C6 fails the
    // verdict on fact loss alone, but the owner wants a clean-but-lossy arm to
    // read differently from a lossy-and-non-conforming one, not collapse into
    // one FAIL. faithfulness.py finds DROPPED tokens (numbers, units,
    // negations, obligations), not changed meaning, so this is "fact loss
    // detected", never a guarantee that a passing arm is faithful.
    const fidelity = a.factLoss
      ? '<span class="verdict factloss" title="faithfulness.py: a number, unit, '
        + 'identifier, negation, or obligation from the source is missing. '
        + 'This detects dropped tokens, not changed meaning.">FACT LOSS</span>'
      : "";
    // A CONFIRMED judge finding fails the verdict the same as fact loss does.
    // See the "Judge findings" section below for every row, including the
    // low-agreement and rejected ones that never affect PASS/FAIL.
    const semBadge = a.semanticConfirmed
      ? `<span class="verdict semanticbad" title="the LLM judge (semantic_lint.py) `
        + `confirmed ${a.semanticConfirmed} finding(s) at or above the agreement `
        + `gate. A model judging prose is not a measurement — see the Judge `
        + `findings section.">JUDGE ×${a.semanticConfirmed}</span>`
      : "";
    const list = a.findings.length
      ? "<ol>" + a.findings.map((f, i) =>
          `<li data-arm="${esc(arm)}" data-i="${i}">
             <span class="where">${f.line}:${f.column}</span>
             <span class="rule">${esc(f.rule)}</span>
             <span class="msg">${esc(f.message)}</span>
           </li>`).join("") + "</ol>"
      : '<p class="none">Nothing to fix at this level.</p>';
    const fidelityList = a.factLoss
      ? "<ol>" + a.fidelity.findings.filter(f => f.severity === "critical").map((f, i) =>
          `<li><span class="rule">${esc(f.kind)}</span>
             <span class="msg">${esc(f.message)}</span></li>`).join("") + "</ol>"
      : "";
    const fidelitySection = a.fidelity
      ? `<div class="offenders"><h3>Fact loss (PSTE-A1)</h3>
          <p class="hint">What faithfulness.py found dropped against the source. It
          catches missing numbers, units, identifiers, negations, and obligations.
          It does not read for changed meaning, so a clean result here is not proof
          the rewrite is faithful.</p>
          ${a.factLoss ? fidelityList : '<p class="none">No dropped number, unit, identifier, negation, or obligation.</p>'}
        </div>`
      : "";
    const semanticSection = semanticSectionHtml(a);
    return `<section data-arm="${esc(arm)}">
      <div class="arm-head">
        <div class="arm-name">${esc(arm)} &nbsp; ${verdict} ${fidelity} ${semBadge}</div>
        <div class="arm-note">${esc(DATA.armNote[arm] || "")} &nbsp;
          ${a.words} words${licenceTag(entry, arm)}</div>
      </div>
      <div class="body">
        <pre class="text">${a.html}</pre>
        <div class="offenders"><h3>Offenders</h3>${list}</div>
        ${fidelitySection}
        ${semanticSection}
      </div></section>`;
  }).join("");
}

function highlight(section, index) {
  section.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  const m = section.querySelector('mark[data-i="' + index + '"]');
  const li = section.querySelector('li[data-i="' + index + '"]');
  if (li) li.classList.add("on");
  if (m) {
    m.classList.add("on");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

grid.addEventListener("click", ev => {
  const hit = ev.target.closest("li[data-i], mark[data-i]");
  if (!hit) return;
  highlight(hit.closest("section"), hit.dataset.i);
});

function drawOverview() {
  const o = DATA.overview, r = DATA.run, arms = DATA.arms;
  const bits = [];
  if (r.commit) bits.push("<b>commit</b>" + esc(r.commit)
      + (r.branch ? " on " + esc(r.branch) : ""));
  if (r.committed) bits.push("<b>dated</b>" + esc(r.committed));
  bits.push("<b>documents</b>" + r.documents);
  bits.push("<b>passes</b>" + r.passes);
  if (r.jobs) bits.push("<b>jobs</b>" + r.jobs);
  bits.push("<b>level</b>" + DATA.level);
  if (r.sourceModels && r.sourceModels.length)
    bits.push("<b>synthetic by</b>" + esc(r.sourceModels.join(", ")));
  if (r.failures) bits.push('<b>failures</b><span class="cell-fail">'
      + r.failures + "</span>");
  // PER-STAGE METERING (run.py PART 1): which half of the run burned the
  // budget. Absent on a result written before this existed.
  if (r.stages && r.stages.generation) bits.push("<b>generation</b>"
      + r.stages.generation.calls + " calls, " + r.stages.generation.seconds + "s");
  if (r.stages && r.stages.judging) bits.push("<b>judging</b>"
      + r.stages.judging.calls + " calls, " + r.stages.judging.seconds + "s");
  // JUDGE SAMPLING (run.py PART 2): which documents were judged this run.
  // Absent on a result written before sampling existed, or `judge_all`.
  const js = DATA.judgeSample || {};
  if (js.judge_all) {
    bits.push("<b>judged</b>all documents (--judge-all)");
  } else if (js.anchor_docs && js.anchor_docs.length) {
    bits.push("<b>anchors</b>" + esc(js.anchor_docs.join(", ")));
    bits.push("<b>rotating</b>" + esc((js.rotating_docs || []).join(", "))
      + " (offset " + js.rotation_offset + ")");
  }

  // The matrix. One row per document, one column per arm.
  const worst = Math.max(1, ...o.rows.flatMap(row =>
    arms.map(a => (row.cells[a] || {}).findings || 0)));

  let head = '<tr><th class="doc">document</th>';
  for (const a of arms) head += "<th>" + esc(a) + "</th>";
  head += "</tr>";

  let body = "";
  for (const row of o.rows) {
    // Mark the arm with the fewest findings, so the eye lands on the winner.
    const counts = arms.map(a => (row.cells[a] || {}).findings);
    const best = Math.min(...counts.filter(n => typeof n === "number"));
    // ANCHOR/ROTATING (run.py PART 2): which documents the judge looked at
    // this run, and why. An anchor is judged every run, for loop-over-loop
    // comparability; a rotating document is this run's coverage slice. A row
    // with neither badge was sampled out — its cells below say so.
    const sampleBadge = row.anchor
      ? ' <span class="verdict anchor" title="judged every run, for '
        + 'loop-over-loop comparability">ANCHOR</span>'
      : row.rotating
      ? ' <span class="verdict rotating" title="this run’s rotating '
        + 'coverage slice">ROTATING</span>'
      : "";
    body += '<tr><td class="doc" title="' + esc(row.type) + '">'
          + esc(row.id) + sampleBadge + "</td>";
    for (const a of arms) {
      const c = row.cells[a];
      if (!c) { body += "<td>-</td>"; continue; }
      const win = c.findings === best && arms.length > 1 ? " best" : "";
      // Every pass, and the share of them that conform. One draw cannot separate a
      // real change from ordinary variance, so the runs are shown beside the count.
      let sub = c.rules + " rule" + (c.rules === 1 ? "" : "s");
      if (c.of > 1) {
        sub += ' <span class="rate">' + c.passed + "/" + c.of + " pass "
             + c.rate + "%</span>"
             + '<div class="runs">' + c.runs.join(" \u00b7 ") + "</div>";
      }
      // Fact loss reads apart from the conformance count: a clean-but-lossy
      // cell (0 findings, factLoss true) must not look like a plain PASS, and
      // a lossy-and-non-conforming cell must show both, not just one number.
      const factTag = c.factLoss
        ? ' <span class="verdict factloss" title="faithfulness.py: a fact from '
          + 'the source is missing. Detects dropped tokens, not changed '
          + 'meaning.">FACT LOSS</span>'
        : "";
      // A CONFIRMED judge finding (semantic_lint.py) fails the verdict the same
      // way fact loss does. Low-agreement and rejected rows never do — they are
      // audit material, visible only on the document view.
      const semTag = c.semanticConfirmed
        ? ' <span class="verdict semanticbad" title="the LLM judge confirmed '
          + c.semanticConfirmed + ' finding(s), agreement at or above the gate. '
          + 'See the document view for the reason behind each.">JUDGE ×'
          + c.semanticConfirmed + '</span>'
        : "";
      // SAMPLED_OUT vs UNJUDGED: not selected by design reads differently
      // from a judge call that was made and failed. Both still force
      // pass=False (build_entry) — neither has actually been checked — but
      // conflating "we chose not to ask" with "we asked and got nothing" is
      // exactly the confusion this cell must not create.
      const semSub = c.sampledOut
        ? '<div class="cell-sub sampled-out-note">not judged this run — sampled out</div>'
        : c.unjudged
        ? '<div class="cell-sub unjudged-note">judge call failed — not checked</div>'
        : c.semantic
        ? '<div class="cell-sub">judge: ' + c.semantic + ' row'
          + (c.semantic === 1 ? '' : 's') + (c.semanticConfirmed
            ? ', ' + c.semanticConfirmed + ' confirmed' : '') + '</div>'
        : "";
      // UNJUDGED gets its own cell class and label: it must never look like a
      // FAIL (the judge ran and objected) or a PASS (the judge ran and found
      // nothing). `c.pass` is already False for these (build_entry forces it),
      // this only controls how the cell reads visually. SAMPLED_OUT reuses
      // the same class (it is still not a pass and not a fail) but its own
      // label and tooltip, so "excluded by design" reads apart from
      // "the judge tried and failed" at a glance.
      const cellClass = c.unjudged ? "cell-unjudged" : (c.pass ? "cell-pass" : "cell-fail");
      const cellLabel = c.sampledOut ? "NOT JUDGED"
        : c.unjudged ? "UNJUDGED" : (c.pass ? "PASS" : c.findings);
      const cellTitle = c.sampledOut
        ? "not selected for judging this run (rotate-and-anchor sampling). "
          + "Not a failure — a deliberate coverage decision. Not a pass either: "
          + "this text was never checked against the semantic rules."
        : c.unjudged
        ? "the judge call for this cell failed and returned no result. Not a "
          + "pass — it was never checked."
        : "";
      body += '<td class="' + cellClass + win + '" title="' + cellTitle + '">'
            + cellLabel + factTag + semTag
            + '<div class="cell-sub">' + sub + "</div>" + semSub
            + '<div class="bar" style="width:' + (c.findings / worst * 46)
            + 'px"></div></td>';
    }
    body += "</tr>";
  }

  // Real documents and synthetic ones are totalled separately, and both stay
  // visible. Real is the headline: it is what generalises to writing this
  // project did not itself produce. Synthetic is secondary, not hidden.
  function totalRow(label, totals) {
    let row = '<tr><td class="doc">' + esc(label) + "</td>";
    for (const a of arms) {
      const t = totals[a] || {pass:0,total:0,findings:0,runPass:0,runTotal:0,factLoss:0,semanticConfirmed:0,unjudged:0,sampledOut:0};
      if (!t.total) { row += "<td>-</td>"; continue; }
      let f = t.pass + "/" + t.total + " docs";
      if (t.runTotal > t.total) {
        f += '<div class="rate">' + t.runPass + "/" + t.runTotal + " runs "
           + Math.round(t.runPass * 100 / t.runTotal) + "%</div>";
      }
      // Fact loss stays a separate line, not folded into `findings`: it is a
      // different failure mode (PSTE-A1) from conformance rule counts.
      if (t.factLoss) {
        f += '<div class="verdict factloss" title="documents with a fact '
           + 'faithfulness.py found dropped against the source">'
           + t.factLoss + " fact loss</div>";
      }
      if (t.semanticConfirmed) {
        f += '<div class="verdict semanticbad" title="confirmed findings from '
           + 'the LLM judge (semantic_lint.py), agreement at or above the '
           + 'gate">' + t.semanticConfirmed + " judge-confirmed</div>";
      }
      if (t.sampledOut) {
        f += '<div class="verdict sampled-out" title="not selected for '
           + 'judging this run (rotate-and-anchor sampling). A deliberate '
           + 'coverage decision, not a failure — and not a pass either.">'
           + t.sampledOut + " not judged</div>";
      }
      // A cell whose judge call actually failed, separate from one sampled
      // out by design: this count excludes the sampled-out cells above.
      const failedJudge = t.unjudged - t.sampledOut;
      if (failedJudge > 0) {
        f += '<div class="verdict unjudged" title="the judge call failed for '
           + 'these cells and never returned a result. Not passes — they were '
           + 'never checked.">' + failedJudge + " unjudged</div>";
      }
      row += "<td>" + t.findings + '<div class="cell-sub">' + f + "</div></td>";
    }
    return row + "</tr>";
  }
  const foot = totalRow("TOTAL (real)", o.totals)
             + totalRow("TOTAL (synthetic)", o.totalsSynth)
             // ANCHOR/ROTATING (run.py PART 2), independent of real/synthetic
             // — see overview()'s docstring. This is the row that shows
             // overfitting directly: if the anchor total's judge-confirmed
             // count improves run over run while the rotating total does not,
             // the skill is being tuned to the two documents graded every
             // time and not to the standard in general.
             + (Object.keys(o.totalsAnchor).length
                 ? totalRow("TOTAL (judged: anchor)", o.totalsAnchor) : "")
             + (Object.keys(o.totalsRotating).length
                 ? totalRow("TOTAL (judged: rotating)", o.totalsRotating) : "");

  // The work list: which rules the arm under test still breaks.
  let rules = "";
  if (o.rules.length) {
    rules = '<h2>What the <code>' + esc(o.target)
          + "</code> arm still breaks</h2>"
          + '<p class="hint">Ranked by how often the arm under test breaks each '
          + "rule. The rule at the top is where the next edit to the skill "
          + "belongs. This is a work list, and not a score.</p>"
          + '<table class="matrix"><tr><th class="doc">rule</th>'
          + arms.map(a => "<th>" + esc(a) + "</th>").join("")
          + '<th class="doc">message</th></tr>';
    for (const rule of o.rules) {
      rules += '<tr><td class="doc">' + esc(rule.rule) + "</td>"
             + arms.map(a => "<td>" + (rule.counts[a] || 0) + "</td>").join("")
             + '<td class="doc">' + esc(rule.message) + "</td></tr>";
    }
    rules += "</table>";
  }

  overviewPane.innerHTML =
      '<div class="runbar">' + bits.join("") + "</div>"
    + "<h2>Findings per document</h2>"
    + '<p class="hint">A document passes only when it has no findings and no fact '
    + "loss, so the count and the number of distinct rules say more than the "
    + "verdict. FACT LOSS marks a cell where faithfulness.py found a number, unit, "
    + "identifier, negation, or obligation missing against the source (PSTE-A1) "
    + "— that check catches dropped tokens, not changed meaning, so its "
    + "absence is not proof the rewrite is faithful. The green outline marks the "
    + "arm with the fewest findings.</p>"
    + '<table class="matrix">' + head + body
    + "<tfoot>" + foot + "</tfoot></table>"
    + rules;
}

// ---- Tabs -----------------------------------------------------------------

function show(which) {
  const isOverview = which === "overview";
  overviewPane.hidden = !isOverview;
  grid.hidden = isOverview;
  ask.hidden = isOverview;
  docpick.hidden = isOverview;
  tabOverview.classList.toggle("on", isOverview);
  tabDocuments.classList.toggle("on", !isOverview);
  meta.textContent = isOverview
    ? DATA.overview.rows.length + " documents, level " + DATA.level
    : meta.textContent;
  if (!isOverview) draw(pick.value);
}

tabOverview.addEventListener("click", () => show("overview"));
tabDocuments.addEventListener("click", () => show("documents"));

pick.addEventListener("change", () => draw(pick.value));
drawOverview();
draw(ids[0]);
show("overview");
</script>
</body>
</html>
