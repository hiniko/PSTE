tream page for this topic is mounted at /grounding/synth-prometheus-query-basics.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# PromQL Basics\n\nPromQL (Prometheus Query Language) is the language Prometheus uses to read data back out of its time series database. You use it everywhere: in the expression browser, in Grafana panels, in alerting rules, and in recording rules. <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 34 words, limit 25\">This</mark> page covers the core concepts you need before writing your own queries <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> what a query returns, how time series are selected and filtered, and a handful of syntax details that trip people up.\n\n## Instant queries vs. range queries\n\nEvery PromQL expression can be evaluated in two ways:\n\n- **<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at a single point in time, producing one value per matching series. This is what powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start and end time, producing a series of points you can plot. This powers the &quot;Graph&quot; view.\n\nThe language itself <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> change between the two modes <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a range query is just an <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run over and over at different timestamps. Anything other than the built-in UI (dashboards, scripts, custom tooling) typically fetches these results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression (or any sub-expression) always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, no labels attached |\n| **String** | A string value (rarely used in practice today) |\n\nNot every context accepts every type. <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N2: description is 34 words, limit 25\">Instant</mark> queries will accept any of the four as a final result<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> range queries only accept scalars and instant vectors as the top-level result <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> graph a range vector or a string directly.\n\n<mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">Samples</mark> themselves come in two flavors: ordinary **float** samples (a plain number) and **native histogram** samples (a full histogram with count, sum, and bucket data bundled into one sample). A single vector can contain a mix of both kinds. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 32 words, limit 25\">Native</mark> histograms know whether <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> a counter or a gauge, so Prometheus can warn you if you apply the wrong kind of function to them (<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., `rate()` on a gauge histogram). <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 26 words, limit 25\">Ordinary</mark> float samples <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> carry that flavor information <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Prometheus <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> stop you from calling `rate()` on a float gauge, even though the result will be meaningless. This is why counter metrics conventionally end in `_total`: <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a naming convention to help humans (and dashboards) avoid that mistake, not something PromQL enforces.\n\nOne more terminology note: a &quot;classic histogram&quot; <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is just three ordinary float series to PromQL. There&#x27;s no such thing as a &quot;classic histogram sample&quot;<mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> only native histograms produce histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> possible query is just a metric name:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> returns one sample per series carrying that metric name <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> specifically, the most recent sample at or before the query&#x27;s evaluation time (subject to the staleness rules described below).\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` scoped to a `job` label of `prometheus` and a `group` label of `canary` returns only series matching both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches in PromQL are always fully anchored <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA subtlety worth knowing: <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N2: description is 28 words, limit 25\">a</mark> matcher against an empty string on a label matches series that have that label explicitly set to empty *and* series that <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> have the label at all. <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 38 words, limit 25\">You</mark> can also repeat a matcher on the same label name <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> all of them have to pass for the series to be selected (<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g., excluding one specific value while regex-matching a broader pattern on the same label).\n\n<mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-N2: description is 37 words, limit 25\">Because</mark> a selector made up of only regex matchers could otherwise match every series in the database, Prometheus requires that a selector contain a metric name or at least one matcher that <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> match an empty value. <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> selector with nothing but a wildcard-style regex on a single label is rejected<mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character in that regex makes it valid.\n\n<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N2: description is 47 words, limit 25\">Under</mark> the hood, the metric name is really just a label called `__name__`, so writing the metric name bare is equivalent to matching `__name__` directly <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> and you can use non-`=` operators against it too, which lets you match every metric whose name starts with a given prefix. One quirk from this: <mark id=\"f38\" class=\"hit\" data-i=\"38\" title=\"PSTE-N2: description is 30 words, limit 25\">a</mark> few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you <mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N3: contraction &#x27;can&#x27;t&#x27;\">can&#x27;t</mark> use them bare as a metric name<mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> matching them via `__name__` explicitly is the workaround.\n\n### Range vector selectors\n\nAppend a duration in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not just the latest one. The window is left-open, right-closed <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> a sample sitting exactly on the start boundary is excluded, one sitting exactly on the end boundary is included. Range vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` rather than displayed directly.\n\n## Durations\n\nTime durations are written as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nUnits can be chained as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.<mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-N2: description is 34 words, limit 25\"> </mark>Under the hood a duration is really just a float literal in seconds<mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 `1s` is `1`, `1ms` is `0.001` \u2014 but you can only suffix a *decimal integer*, so `1.5h` and hex numbers with unit suffixes<mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\"> </mark>aren&#x27;t valid.\n\n<mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">You</mark> can also build a duration with arithmetic, anywhere a duration is expected (range vector brackets, `offset`): multiplying `5m` by `2` gives a 10-minute window<mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence. Note that `offset` needs the expression wrapped in parentheses, or only the first term gets used. There are also a few helper functions usable inside duration expressions: <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-N2: description is 26 words, limit 25\">`</mark>step()` (the range-query step width, `0s` for<mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\"> </mark>instant queries), `range()` (end minus start of a range query, `0s` for instant queries), and `min_of()`/`max_of()` for clamping<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014<mark id=\"f50\" class=\"hit\" data-i=\"50\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\"> </mark>e.g. `max_of(step(), 5s)` never lets the duration drop below 5 seconds. Duration expression<mark id=\"f51\" class=\"hit\" data-i=\"51\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">s</mark> aren&#x27;t allowed inside the `@` modifier, though.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago. <mark id=\"f52\" class=\"hit\" data-i=\"52\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines naturally with functions <mark id=\"f53\" class=\"hit\" data-i=\"53\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset, <mark id=\"f54\" class=\"hit\" data-i=\"54\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `http_requests_total @ 1609746000`.<mark id=\"f55\" class=\"hit\" data-i=\"55\" title=\"PSTE-N2: description is 36 words, limit 25\"> </mark>`start()` and `end()` are handy special values her<mark id=\"f56\" class=\"hit\" data-i=\"56\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">e</mark> \u2014 fo<mark id=\"f57\" class=\"hit\" data-i=\"57\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">r</mark> a range query they resolve to the query&#x27;s start/end and stay fixed across every st<mark id=\"f58\" class=\"hit\" data-i=\"58\" title=\"PSTE-X1: semicolon; write two sentences\">ep</mark>; for a<mark id=\"f59\" class=\"hit\" data-i=\"59\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">n</mark> instant query both just resolve to the evaluation time.\n\nThe one rule to remember for both modifiers: they bind to the selector immediately to their left, not to the whole enclosing expression. <mark id=\"f60\" class=\"hit\" data-i=\"60\" title=\"PSTE-N2: description is 29 words, limit 25\">Wrapping</mark> the bare selector (with its `offset` or `@` attached) inside an aggregation like `sum(...)` is correct<mark id=\"f61\" class=\"hit\" data-i=\"61\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order <mark id=\"f62\" class=\"hit\" data-i=\"62\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> matter <mark id=\"f63\" class=\"hit\" data-i=\"63\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\n<mark id=\"f64\" class=\"hit\" data-i=\"64\" title=\"PSTE-N2: description is 46 words, limit 25\">A</mark> subquery lets you run what is effectively an <mark id=\"f65\" class=\"hit\" data-i=\"65\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector <mark id=\"f66\" class=\"hit\" data-i=\"66\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> useful when you want to apply a range-vector function (like `max_over_time`) on top of something that&#x27;s already a rate or other computed expression, <mark id=\"f67\" class=\"hit\" data-i=\"67\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. wrapping `rate(metric[5m])` in a further `[30m:1m]` window to get the max of that rate over the last 30 minutes at 1-minute resolution. The resolution part is optional and defaults to the global evaluation interval if omitted.\n\n## Everything else, briefly\n\n- <mark id=\"f68\" class=\"hit\" data-i=\"68\" title=\"PSTE-N2: description is 27 words, limit 25\">*</mark>*Operators** (`+`, `and`, `on`, `group_left`, <mark id=\"f69\" class=\"hit\" data-i=\"69\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) are where most of PromQL&#x27;s actual power lives \u2014 worth a dedicated read once <mark id=\"f71\" class=\"hit\" data-i=\"71\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. <mark id=\"f72\" class=\"hit\" data-i=\"72\" title=\"PSTE-N2: description is 27 words, limit 25\">Single</mark>/double-quoted strings follow Go&#x27;s escaping rules (backslash escapes plus octal/hex escapes)<mark id=\"f73\" class=\"hit\" data-i=\"73\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> backtick strings are raw \u2014 no escape processing, and newlines inside them are preserved as-is.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators for readability (<mark id=\"f74\" class=\"hit\" data-i=\"74\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `1_000_000`).\n\n## Two gotchas worth knowing up front\n\n<mark id=\"f75\" class=\"hit\" data-i=\"75\" title=\"PSTE-N2: description is 55 words, limit 25\">*</mark>*Staleness.** Because a query samples at fixed timestamps that <mark id=\"f76\" class=\"hit\" data-i=\"76\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> necessarily <mark id=\"f77\" class=\"hit\" data-i=\"77\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with when data was actually scraped, Prometheus has to decide what value to report at each timestamp <mark id=\"f78\" class=\"hit\" data-i=\"78\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> it uses the newest sample that&#x27;s less than the *lookback period* old (5 minutes by default, tunable via the `--query.lookback-delta` flag or a per-query `lookback_delta` parameter). <mark id=\"f79\" class=\"hit\" data-i=\"79\" title=\"PSTE-N2: description is 44 words, limit 25\">If</mark> a target stops being scraped or disappears, its series gets marked stale, and once a query&#x27;s evaluation timestamp is past that staleness point, the series simply stops appearing in results <mark id=\"f80\" class=\"hit\" data-i=\"80\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> which is why a graph line will visibly end rather than flatline forever.\n\n<mark id=\"f81\" class=\"hit\" data-i=\"81\" title=\"PSTE-N2: description is 59 words, limit 25\">*</mark>*Performance.** A bare metric name selector can silently expand into thousands of series if the metric is high-cardinality, and any aggregation over that many series costs real work on the server even if the final output is a single number <mark id=\"f82\" class=\"hit\" data-i=\"82\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> much like summing a huge column in a SQL database <mark id=\"f83\" class=\"hit\" data-i=\"83\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> free just because the result is one row. <mark id=\"f84\" class=\"hit\" data-i=\"84\" title=\"PSTE-N2: description is 35 words, limit 25\">When</mark> <mark id=\"f85\" class=\"hit\" data-i=\"85\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> exploring an unfamiliar metric, check it in the tabular view first, narrow it down with label matchers or aggregation until the result set is reasonably sized, and only then switch to graphing it. If a query is inherently expensive even after narrowing, that&#x27;s what recording rules are for <mark id=\"f86\" class=\"hit\" data-i=\"86\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> pre-compute it once, query the cheap result repeatedly.\n\n---\n\nA couple of notes on the process: <mark id=\"f87\" class=\"hit\" data-i=\"87\" title=\"PSTE-N2: description is 63 words, limit 25\">I</mark> <mark id=\"f88\" class=\"hit\" data-i=\"88\" title=\"PSTE-N3: contraction &#x27;wasn&#x27;t&#x27;\">wasn&#x27;t</mark> able to save this as a file in this session <mark id=\"f89\" class=\"hit\" data-i=\"89\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the file-write tool <mark id=\"f90\" class=\"hit\" data-i=\"90\" title=\"PSTE-N3: contraction &#x27;wasn&#x27;t&#x27;\">wasn&#x27;t</mark> enabled, and shell redirectio hubusercontent.com/prometheus/prometheus/main/docs/querying/basics.md\ngrounding_licence: Apache-2.0\nquestion: |\n  Write a documentation page for the basics of its query language, PromQL in Prometheus. A copy of an upstream page for this topic is mounted at /grounding/synth-prometheus-query-basics.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, organised and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# PromQL Basics\n\nPromQL (Prometheus Query Language) is how Prometheus reads data back out of its time series database. You use it in the expression browser, in Grafana panels, in alerting rules, and in recording rules.\n\nThis page covers the core ideas you need before writing queries: what a query returns, how to select and filter time series, and a few syntax details that catch people out.\n\n## Instant queries vs. range queries\n\nYou can evaluate every PromQL expression in two ways:\n\n- **<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query** \u2014 evaluated at a single point in time. Produces one value per matching series. This powers the &quot;Table&quot; view in the Prometheus UI.\n- **Range query** \u2014 <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N5: multi-word noun &#x27;same expression evaluated repeatedly&#x27; over 3 words\">the</mark> same expression evaluated repeatedly at fixed steps between a start and end time. Produces a series of points you can plot. This powers the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is just an <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query run over and over at different timestamps.\n\nAnything other than the built-in UI <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dashboards, scripts, custom tooling \u2014 usually fetches these results over Prometheus&#x27;s HTTP API.\n\n## What a query evaluates to\n\nAn expression, or any sub-expression, always produces one of four types:\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series, each with exactly one sample, all at the same timestamp |\n| **Range vector** | A set of series, each with a window of samples over time |\n| **Scalar** | A single floating-point number, no labels attached |\n| **String** | A string value (rarely used in practice today) |\n\nNot every context accepts every type:\n\n- <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> queries accept any of the four as a final result.\n- Range queries accept only scalars and <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vectors as the top-level result. You cannot graph a range vector or a string directly.\n\n### Float samples and native histogram samples\n\nSamples come in two kinds:\n\n- **Float samples** \u2014 a plain number.\n- **Native histogram samples** \u2014 a full histogram with count, sum, and bucket data bundled into one sample.\n\nA single vector can contain a mix of both.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 33 words, limit 25\">Native</mark> histograms know whether they are a counter or a gauge, so Prometheus can warn you if you apply the wrong kind of function to them <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> for example, `rate()` on a gauge histogram.\n\nFloat samples carry no such flavor information. Prometheus cannot stop you calling `rate()` on a float gauge, even though the result is meaningless. This is why counter metrics conventionally end in `_total`: a naming convention to help humans and dashboards avoid that mistake, not something PromQL enforces.\n\nOne terminology note: a &quot;classic histogram&quot; <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the `_bucket`/`_count`/`_sum` trio of plain metrics \u2014 is just three ordinary float series to PromQL. There is no such thing as a &quot;classic histogram sample&quot;. Only native histograms produce histogram-typed samples.\n\n## Selecting time series\n\n### Instant vector selectors\n\nThe <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a metric name on its own:\n\n```\nhttp_requests_total\n```\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 29 words, limit 25\">This</mark> returns one sample per series carrying that metric name <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> specifically, the most recent sample at or before the query&#x27;s evaluation time, subject to the staleness rules described below.\n\nTo narrow that down, add label matchers in curly braces after the metric name. A query for `http_requests_total` scoped to a `job` label of `prometheus` and a `group` label of `canary` returns only series matching both.\n\nFour matcher operators are available:\n\n| Operator | Meaning |\n|---|---|\n| `=` | label equals this string |\n| `!=` | label does not equal this string |\n| `=~` | label matches this regex |\n| `!~` | label does not match this regex |\n\nRegex matches are always fully anchored. A `=~` match against `foo` behaves as an anchored `^foo$`, not as a substring search. The regex flavor is RE2.\n\nA few subtleties:\n\n- <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> matcher against an empty string matches series that have that label explicitly set to empty **and** series that do not have the label at all.\n- You can repeat a matcher on the same label name. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 27 words, limit 25\">All</mark> of them have to pass for the series to be selected \u2014 for example, excluding one specific value while regex-matching a broader pattern on the same label.\n- <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 36 words, limit 25\">A</mark> selector made of only regex matchers could otherwise match every series in the database, so Prometheus requires that a selector contain a metric name or at least one matcher that cannot match an empty value. <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 26 words, limit 25\">A</mark> selector with nothing but a wildcard-style regex on a single label is rejected<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> requiring at least one non-empty character in that regex makes it valid.\n\nUnder the hood, the metric name is just a label called `__name__`. <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 33 words, limit 25\">Writing</mark> the metric name bare is equivalent to matching `__name__` directly, and you can use non-`=` operators against it too <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> which lets you match every metric whose name starts with a given prefix.\n\nOne quirk follows from this: a few words (`bool`, `on`, `ignoring`, `group_left`, `group_right`) are reserved as operator keywords, so you cannot use them bare as a metric name. Matching them via `__name__` explicitly is the workaround.\n\n### Range vector selectors\n\nAppend a duration in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis is a **range vector**: for every matching series you get all the samples from the last 5 minutes, not just the latest one.\n\nThe window is left-open, right-closed. A sample sitting exactly on the start boundary is excluded<mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> one sitting exactly on the end boundary is included.\n\nRange vectors are mostly consumed by functions like `rate()`, `increase()`, and `avg_over_time()` rather than displayed directly.\n\n## Durations\n\nWrite a duration as a number followed by a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n\nChain units as long as they go from largest to smallest and each appears once: `1h30m`, `12h34m56s`.\n\nUnder the hood a duration is just a float literal in seconds <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> `1s` is `1`, `1ms` is `0.001`. But you can only suffix a *decimal integer*, so `1.5h` and hex numbers with unit suffixes are not valid.\n\n### Duration arithmetic\n\nYou can build a duration with arithmetic anywhere a duration is expected <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> range vector brackets, `offset`. Multiplying `5m` by `2` gives a 10-minute window<mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> dividing `1h` by `2` gives a 30-minute offset. The usual `+ - * / % ^` operators all work with normal precedence.\n\nNote that `offset` needs the expression wrapped in parentheses, or only the first term gets used.\n\nA few helper functions work inside duration expressions:\n\n- `step()` \u2014 the range-query step width<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> `0s` for <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> queries.\n- `range()` \u2014 end minus start of a range query<mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> `0s` for <mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> queries.\n- `min_of()` / `max_of()` \u2014 clamping. For example, `max_of(step(), 5s)` never lets the duration drop below 5 seconds.\n\nDuration expressions are not allowed inside the `@` modifier.\n\n## Shifting time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the query&#x27;s evaluation time. Appending `offset 5m` to a selector returns what the value was 5 minutes ago.\n\n<mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-N2: description is 32 words, limit 25\">It</mark> works on range vectors too, and combines naturally with functions <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you can ask for this week&#x27;s 5-minute rate as it looked a week ago by combining a `[5m]` range with `offset 1w`. A negative offset looks forward instead of back, which is occasionally useful for comparisons against &quot;the future&quot; relative to some earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset:\n\n```\nhttp_requests_total @ 1609746000\n```\n\n`start()` and `end()` are handy special values here. <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-N2: description is 28 words, limit 25\">For</mark> <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">a</mark> range query they resolve to the query&#x27;s start and end and stay fixed across every step<mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> for an <mark id=\"f32\" class=\"hit\" data-i=\"32\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query both resolve to the evaluation time.\n\nThe one rule to remember for both modifiers: <mark id=\"f33\" class=\"hit\" data-i=\"33\" title=\"PSTE-N2: description is 31 words, limit 25\">*</mark>*they bind to the selector immediately to their left, not to the whole enclosing expression.** Wrapping the bare selector, with its `offset` or `@` attached, inside an aggregation like `sum(...)` is correct. Putting the modifier after the closing parenthesis of `sum(...)` is a syntax error.\n\n`offset` and `@` can be combined on the same selector, and order does not matter <mark id=\"f34\" class=\"hit\" data-i=\"34\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the offset is always applied relative to the `@` time.\n\n## Subqueries\n\nA subquery runs what is effectively an <mark id=\"f35\" class=\"hit\" data-i=\"35\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression repeatedly over a range, turning it into a range vector.\n\n<mark id=\"f36\" class=\"hit\" data-i=\"36\" title=\"PSTE-N2: description is 27 words, limit 25\">This</mark> is useful when you want to apply a range-vector function, such as `max_over_time`, on top of something that is already a rate or other computed expression. For example, wrapping `rate(metric[5m])` in a further `[30m:1m]` window gives you the max of that rate over the last 30 minutes at 1-minute resolution.\n\nThe resolution part is optional. Omit it and it defaults to the global evaluation interval.\n\n## Everything else, briefly\n\n- **Operators** (`+`, `and`, `on`, `group_left`, <mark id=\"f37\" class=\"hit\" data-i=\"37\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>.) and **functions** (`rate`, `sum`, `histogram_quantile`, and dozens more) are where most of PromQL&#x27;s actual power lives. Worth a dedicated read once you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. Single- and double-quoted strings follow Go&#x27;s escaping rules \u2014 backslash escapes plus octal/hex escapes. Backtick strings are raw: no escape processing, and newlines inside them are preserved as-is.\n- **Numeric literals** accept integers, decimals, scientific notation, hex, `Inf`/`NaN`, and underscores as digit separators for readability, such as `1_000_000`.\n\n## Two gotchas worth knowing up front\n\n### Staleness\n\n<mark id=\"f39\" class=\"hit\" data-i=\"39\" title=\"PSTE-N2: description is 30 words, limit 25\">A</mark> query samples at fixed timestamps that do not necessarily <mark id=\"f40\" class=\"hit\" data-i=\"40\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with when data was actually scraped, so Prometheus has to decide what value to report at each timestamp. <mark id=\"f41\" class=\"hit\" data-i=\"41\" title=\"PSTE-N2: description is 26 words, limit 25\">It</mark> uses the newest sample that is less than the *lookback period* old <mark id=\"f42\" class=\"hit\" data-i=\"42\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> 5 minutes by default, tunable via the `--query.lookback-delta` flag or a per-query `lookback_delta` parameter.\n\nIf a target stops being scraped or disappears, its series gets marked stale. Once a query&#x27;s evaluation timestamp is past that staleness point, the series stops appearing in results. This is why <mark id=\"f43\" class=\"hit\" data-i=\"43\" title=\"PSTE-N5: multi-word noun &#x27;graph line visibly ends&#x27; over 3 words\">a</mark> graph line visibly ends rather than flatlining forever.\n\n### Performance\n\nA bare metric name selector can silently expand into thousands of series if the metric is high-cardinality. <mark id=\"f44\" class=\"hit\" data-i=\"44\" title=\"PSTE-N2: description is 41 words, limit 25\">Any</mark> aggregation over that many series costs real work on the server, even if the final output is a single number <mark id=\"f45\" class=\"hit\" data-i=\"45\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> much like summing a huge column in a SQL database is not free just because the result is one row.\n\nWhen exploring an unfamiliar metric:\n\n1. Check it in the tabular view first.\n2. Narrow it down with label matchers or aggregation until the result set is a reasonable size.\n3. Only then switch to graphing it.\n\nIf a query is inherently expensive even after narrowing, that is what recording rules are for: pre-compute it once, query the cheap result repeatedly.\n\n---\n\nA couple of notes on the process. <mark id=\"f46\" class=\"hit\" data-i=\"46\" title=\"PSTE-N2: description is 27 words, limit 25\">I</mark> could not save this as a file in this session <mark id=\"f47\" class=\"hit\" data-i=\"47\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the file-write tool was not enabled, and shell redirection to files was blocked by sandbox policy. <mark id=\"f48\" class=\"hit\" data-i=\"48\" title=\"PSTE-N2: description is 34 words, limit 25\">That</mark> policy also specifically flags `{...}`-style curly-brace label matchers as suspicious shell syntax, which is why a couple of the examples above are described in prose rather than shown as literal `{job=&quot;...&quot;}` snippets.\n\n<mark id=\"f49\" class=\"hit\" data-i=\"49\" title=\"PSTE-N2: description is 33 words, limit 25\">If</mark> you would like this as an actual `.md` file, you can copy the text above, or let me know if there is a different way you would like me to attempt saving it.", "factLoss": true, "fidelity": {"source_words": 1880, "rewrite_words": 1837, "findings": [{"kind": "identifier", "severity": "critical", "message": "`http_requests_total @ 1609746000` is missing from the rewrite."}, {"kind": "condition", "severity": "warning", "message": "the source states 22 conditions, the rewrite 21. Check that no condition was dropped."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "A matcher against an empty string matches series that have that label", "problem": "The original said \"a matcher against an empty string on a label\"; the rewrite dropped \"on a label\", so \"that label\" now has no antecedent.", "fix": "Write \"A matcher against an empty string on a label matches series that have that label explicitly set to empty, and series that do not have the label at all.\"", "reason": "PSTE-A1 forbids removing a scope qualifier, and the removed phrase is what identifies which label the matcher tests.", "confidence": "medium", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 90, "column": 3, "offset": 4737}, {"rule": "PSTE-D4", "quote": "in the expression browser, in Grafana panels, in alerting rules", "problem": "Four parallel places where the reader uses PromQL are hidden in one prose sentence instead of a bulleted list.", "fix": "Write \"You use it in these places:\" and follow it with four bullets.", "reason": "PSTE-D4 requires a bulleted list for three or more parallel items, and PSTE-D5 forbids hiding a set inside one prose sentence.", "confidence": "medium", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 17, "column": 114, "offset": 1118}, {"rule": "PSTE-G2", "quote": "wildcard-style regex on a single label is rejected", "problem": "The passive clause hides the actor, although the previous sentence names Prometheus as the actor that applies this requirement.", "fix": "Write \"Promet a single point in time. The query gives one value per matching series. This mode drives the &quot;Table&quot; view in the Prometheus UI.\n- **Range query.** Prometheus evaluates the same expression again and again, at fixed steps between a start time and an end time. The query gives a series of points that you can plot. This mode drives the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is an <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query that runs many times at different timestamps.\n\nAny tool outside the built-in UI reads these results over the HTTP API of Prometheus. This includes dashboards, scripts, and custom tools.\n\n## What a query evaluates to\n\nAn expression always gives one of four types. A sub-expression also gives one of these four types.\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series. Each series holds exactly one sample. All the samples share one timestamp. |\n| **Range vector** | A set of series. Each series holds a window of samples over time. |\n| **Scalar** | A single floating-point number with no labels. |\n| **String** | A string value. Queries rarely use this type today. |\n\nNot every context accepts every type. An <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query accepts any of the four types as a final result. A range query accepts only a scalar or an <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vector as the top-level result. You cannot graph a range vector directly, and you cannot graph a string directly.\n\n### Float samples and native histogram samples\n\nA sample comes in one of two kinds. A **float** sample holds a plain number. A **native histogram** sample holds a full histogram in one sample, with a count, a sum, and bucket data. One vector can hold a mix of both kinds.\n\nA native histogram knows whether it is a counter or a gauge. Prometheus can therefore warn you when you apply the wrong kind of function to it. For example, it warns you when you call `rate()` on a gauge histogram.\n\nA float sample does not carry this information. Prometheus cannot stop you when you call `rate()` on a float gauge, but the result means nothing. This is the reason that a counter metric normally ends in `_total`. The name is a convention that helps people and dashboards avoid the mistake. PromQL does not enforce it.\n\nOne note about terms: a &quot;classic histogram&quot; is the set of three plain metrics `_bucket`, `_count`, and `_sum`. PromQL sees three ordinary float series. There is no &quot;classic histogram sample&quot;. Only a native histogram gives a sample of the histogram type.\n\n## Select time series\n\n### Instant vector selectors\n\nThe <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V9: marketing adjective &#x27;simplest&#x27;\">simplest</mark> query is a metric name:\n\n```\nhttp_requests_total\n```\n\nThis query gives one sample per series that carries that metric name. The sample is the most recent one at or before the evaluation time of the query. The staleness rules below also apply.\n\nTo narrow the result, add label matchers in curly braces after the metric name. A query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary` gives only the series that match both labels.\n\nPromQL has four matcher operators:\n\n| Operator | Meaning |\n|---|---|\n| `=` | The label equals this string. |\n| `!=` | The label does not equal this string. |\n| `=~` | The label matches this regular expression. |\n| `!~` | The label does not match this regular expression. |\n\nA regular expression in PromQL is always fully anchored. A `=~` match against `foo` acts as an anchored `^foo$`. It does not search for a substring. PromQL uses the RE2 flavour of regular expressions.\n\n#### Two subtleties\n\nA matcher against an empty string matches two groups of series. It matches the series that set that label to an empty value. It also matches the series that do not hold that label at all.\n\nYou can also repeat a matcher on the same label name. Every matcher must pass before Prometheus selects the series. For example, you can exclude one specific value and match a broader pattern on the same label.\n\n#### The non-empty matcher rule\n\nA selector that holds only regular expression matchers could match every series in the database. Prometheus therefore needs a selector to hold a metric name, or at least one matcher that cannot match an empty value.\n\nPrometheus rejects a selector that holds nothing but a wildcard-style regular expression on a single label. The selector becomes valid when the regular expression needs at least one character.\n\n#### The `__name__` label\n\nThe metric name is really a label called `__name__`. A bare metric name is therefore the same as a direct match on `__name__`. You can also use an operator other than `=` against `__name__`. This lets you match every metric whose name starts with a given prefix.\n\nThis creates one quirk. PromQL reserves five words as operator keywords: `bool`, `on`, `ignoring`, `group_left`, and `group_right`. You cannot use them bare as a metric name. Instead, match them through `__name__` explicitly.\n\n### Range vector selectors\n\nAdd a duration in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis query gives a **range vector**. For every matching series you get every sample from the last 5 minutes, not only the latest one.\n\nThe window is left-open and right-closed. Prometheus excludes a sample that sits exactly on the start boundary. It includes a sample that sits exactly on the end boundary.\n\nFunctions consume most range vectors. Examples are `rate()`, `increase()`, and `avg_over_time()`. You rarely show a range vector directly.\n\n## Durations\n\nYou write a duration as a number and then a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n| \n\nYou can chain units under two conditions. The units must run from the largest to the smallest, and each unit must appear once. `1h30m` and `12h34m56s` are both valid.\n\nA duration is really a float literal in seconds. `1s` is `1`, and `1ms` is `0.001`. But you can only add a unit suffix to a decimal integer. `1.5h` is not valid, and a hex number with a unit suffix is not valid.\n\n### Duration expressions\n\nYou can also build a duration with arithmetic. This works anywhere that PromQL expects a duration, such as range vector brackets and `offset`. `5m` multiplied by `2` gives a window of 10 minutes. `1h` divided by `2` gives an offset of 30 minutes. The operators `+ - * / % ^` all work with normal precedence.\n\n`offset` needs the expression in parentheses. Without them, `offset` uses only the first term.\n\nThree helper functions work inside a duration expression:\n\n- `step()` gives the step width of the range query. It gives `0s` for an <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query.\n- `range()` gives the end time minus the start time of a range query. It gives `0s` for an <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query.\n- `min_of()` and `max_of()` clamp a value. For example, `max_of(step(), 5s)` never lets the duration drop below 5 seconds.\n\nPromQL does not allow a duration expression inside the `@` modifier.\n\n## Shift time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the evaluation time of the query. Add `offset 5m` to a selector, and it gives the value from 5 minutes ago.\n\n`offset` also works on a range vector, and it combines with functions. Combine a `[5m]` range with `offset 1w`, and you get this week&#x27;s 5-minute rate as it looked a week ago. A negative offset looks forward instead of back. This helps you compare against &quot;the future&quot; relative to an earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset. For example: `http_requests_total @ 1609746000`.\n\n`start()` and `end()` are useful special values here. In <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">a</mark> range query they resolve to the start time and the end time of the query, and they stay fixed across every step. In an <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query both resolve to the evaluation time.\n\n### One rule for both modifiers\n\nEach modifier binds to the selector immediately to its left. It does not bind to the whole enclosing expression.\n\nWrap the bare selector, with its `offset` or `@` attached, inside an aggregation such as `sum(...)`. That is correct. Put the modifier after the closing parenthesis of `sum(...)`, and you get a syntax error.\n\nYou can combine `offset` and `@` on the same selector, and the order does not matter. Prometheus always applies the offset relative to the `@` time.\n\n## Subqueries\n\nA subquery runs an <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant-query</mark> expression again and again over a range. This turns the expression into a range vector.\n\nA subquery helps when you want to apply a range-vector function on top of something that PromQL already computed, such as a rate. `max_over_time` is one such function. For example, wrap `rate(metric[5m])` in a further `[30m:1m]` window. This gives the maximum of that rate over the last 30 minutes at a<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-G7: nominalization &#x27;resolution of&#x27;; use a verb\"> </mark>resolution of 1 minute.\n\nThe resolution part is optional. Without it, the subquery uses the global evaluation interval.\n\n## Everything else, briefly\n\n- **Operators** and **functions** hold most of the power of PromQL. The operators include `+`, `and`, `on`, and `group_left`. The functions include `rate`, `sum`, `histogram_quantile`, and dozens more. Read about them once you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. A single-quoted string and a double-quoted string follow the escaping rules of Go. These rules cover backslash escapes and octal and hex escapes. A backtick string is raw. PromQL processes no escape in it, and <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N5: multi-word noun &#x27;newline inside it stays&#x27; over 3 words\">a</mark> newline inside it stays as it is.\n- **Numeric literals** accept an integer, a decimal, scientific notation, a hex number, `Inf`, and `NaN`. They also accept underscores as digit separators, which helps you read a large number. For example: `1_000_000`.\n\n## Two problems to know about early\n\n### Staleness\n\nA query samples at fixed timestamps. These timestamps do not necessarily <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G8: phrasal verb &#x27;line up&#x27;; use &#x27;set&#x27;\">line</mark> up with the times that Prometheus scraped the data. Prometheus must therefore decide which value to report at each timestamp. It uses the newest sample that is less than the *lookback period* old. The default lookback period is 5 minutes. You can tune it with the `--query.lookback-delta` flag, or with a `lookback_delta` parameter on a single query.\n\nA target can stop being scraped, or it can disappear. Prometheus then marks its series as stale. Once the evaluation timestamp of a query passes that staleness point, the series stops appearing in the results. This is the reason that a line on a graph visibly ends instead of running flat forever.\n\n### Performance\n\nA bare metric name selector can quietly expand into thousands of series when the metric has high cardinality. Any aggregation over that many series costs real work on the server, even when the final output is a single number. A sum over a huge column in an SQL database is not free either, and the result there is also one row.\n\nWhen you explore an unfamiliar metric, follow three steps:\n\n1. Check the metric in the tabular view first.\n2. Narrow it down with label matchers or aggregation until the result set is a reasonable size.\n3. Only then switch to a graph.\n\nA query can stay expensive even after you narrow it. Recording rules solve that case. Prometheus computes the result once, and you then query <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N5: multi-word noun &#x27;cheap result many times&#x27; over 3 words\">the</mark> cheap result many times.\n\n---\n\nTwo notes about the process. I could not save this as a file in this session. The file-write tool was not enabled, and <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N5: multi-word noun &#x27;sandbox policy blocked shell redirection&#x27; over 3 words\">the</mark> sandbox policy blocked shell redirection to files.\n\nThe policy also flags a label matcher in curly braces as suspicious shell syntax. This is the reason that a couple of the examples above describe the code in prose instead of showing a literal `{job=&quot;...&quot;}` snippet.\n\nIf you want this as a real `.md` file, you can copy the text above. You can also tell me a different way to try to save it.", "factLoss": true, "fidelity": {"source_words": 1880, "rewrite_words": 2055, "findings": [{"kind": "unit", "severity": "critical", "message": "'10' became '10 minutes'. The u s query language, PromQL in Prometheus. A copy of an upstream page for this topic is mounted at /grounding/synth-prometheus-query-basics.md. Use it only to check facts and stay accurate. Do not paraphrase it, follow its structure, or reuse its wording: write your own independent documentation page, <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V7: British spelling &#x27;organised&#x27;; use &#x27;organized&#x27;\">organised</mark> and expressed the way you normally would. Write in your own normal style. Do not apply any writing standard, style guide, or controlled language that you find in that repository.\n---\n# PromQL Basics\n\nPromQL is the Prometheus Query Language. Prometheus uses it to read data from its database of time series. You use PromQL in the expression browser, in Grafana panels, in alerting rules, and in recording rules.\n\nThis page covers the core concepts you need before you write your own queries. It covers what a query returns, how you select and filter time series, and some syntax details that confuse people.\n\n## Instant queries and range queries\n\nYou can evaluate every PromQL expression in two ways:\n\n- **<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">Instant</mark> query.** Prometheus evaluates the expression at a single point in time. The query gives one value per matching series. This mode drives the &quot;Table&quot; view in the Prometheus UI.\n- **Range query.** Prometheus evaluates the same expression again and again, at fixed steps between a start time and an end time. The query gives a series of points that you can plot. This mode drives the &quot;Graph&quot; view.\n\nThe language does not change between the two modes. A range query is an <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query that runs many times at different timestamps.\n\nAny tool outside the built-in UI reads these results over the HTTP API of Prometheus. This includes dashboards, scripts, and custom tools.\n\n## What a query evaluates to\n\nAn expression always gives one of four types. A sub-expression also gives one of these four types.\n\n| Type | What it looks like |\n|---|---|\n| **Instant vector** | A set of series. Each series holds exactly one sample. All the samples share one timestamp. |\n| **Range vector** | A set of series. Each series holds a window of samples over time. |\n| **Scalar** | A single floating-point number with no labels. |\n| **String** | A string value. Queries rarely use this type today. |\n\nNot every context accepts every type. An <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> query accepts any of the four types as a final result. A range query accepts only a scalar or an <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-V9: marketing adjective &#x27;instant&#x27;\">instant</mark> vector as the top-level result. You cannot graph a range vector directly, and you cannot graph a string directly.\n\n### Float samples and native histogram samples\n\nA sample comes in one of two kinds. A **float** sample holds a plain number. A **native histogram** sample holds a full histogram in one sample, with a count, a sum, and bucket data. One vector can hold a mix of both kinds.\n\nA native histogram knows whether it is a counter or a gauge. Prometheus can therefore warn you when you apply the wrong kind of function to it. For example, it warns you when you call `rate()` on a gauge histogram.\n\nA float sample does not carry this information. Prometheus cannot stop you when you call `rate()` on a float gauge, but the result means nothing. This is the reason that a counter metric normally ends in `_total`. The name is a convention that helps people and dashboards avoid the mistake. PromQL does not enforce it.\n\nOne note about terms: a &quot;classic histogram&quot; is the set of three plain metrics `_bucket`, `_count`, and `_sum`. PromQL sees three ordinary float series. There is no &quot;classic histogram sample&quot;. Only a native histogram gives a sample of the histogram type.\n\n## Select time series\n\n### Instant vector selectors\n\nThe shortest query is a metric name:\n\n```\nhttp_requests_total\n```\n\nThis query gives one sample per series that carries that metric name. The sample is the most recent one at or before the evaluation time of the query. The staleness rules below also apply.\n\nTo narrow the result, add label matchers in curly braces after the metric name. A query for `http_requests_total` with a `job` label of `prometheus` and a `group` label of `canary` gives only the series that match both labels.\n\nPromQL has four matcher operators:\n\n| Operator | Meaning |\n|---|---|\n| `=` | The label equals this string. |\n| `!=` | The label does not equal this string. |\n| `=~` | The label matches this regular expression. |\n| `!~` | The label does not match this regular expression. |\n\nA regular expression in PromQL is always fully anchored. A `=~` match against `foo` acts as an anchored `^foo$`. It does not search for a substring. PromQL uses the RE2 flavour of regular expressions.\n\n#### Two subtleties\n\nA matcher against an empty string matches two groups of series. It matches the series that set that label to an empty value. It also matches the series that do not hold that label at all.\n\nYou can also repeat a matcher on the same label name. Every matcher must pass before Prometheus selects the series. For example, you can exclude one specific value and match a broader pattern on the same label.\n\n#### The non-empty matcher rule\n\nA selector that holds only regular expression matchers could match every series in the database. Prometheus therefore needs a selector to hold a metric name, or at least one matcher that cannot match an empty value.\n\nPrometheus rejects a selector that holds nothing but a wildcard-style regular expression on a single label. The selector becomes valid when the regular expression needs at least one character.\n\n#### The `__name__` label\n\nThe metric name is really a label called `__name__`. A bare metric name is therefore the same as a direct match on `__name__`. You can also use an operator other than `=` against `__name__`. This lets you match every metric whose name starts with a given prefix.\n\nThis creates one quirk. PromQL reserves five words as operator keywords: `bool`, `on`, `ignoring`, `group_left`, and `group_right`. You cannot use them bare as a metric name. Instead, match them through `__name__` explicitly.\n\n### Range vector selectors\n\nAdd a duration in square brackets to pull a window of history instead of a single point:\n\n```\nhttp_requests_total{job=&quot;prometheus&quot;}[5m]\n```\n\nThis query gives a **range vector**. For every matching series you get every sample from the last 5 minutes, not only the latest one.\n\nThe window is left-open and right-closed. Prometheus excludes a sample that sits exactly on the start boundary. It includes a sample that sits exactly on the end boundary.\n\nFunctions consume most range vectors. Examples are `rate()`, `increase()`, and `avg_over_time()`. You rarely show a range vector directly.\n\n## Durations\n\nYou write a duration as a number and then a unit:\n\n| Unit | Meaning |\n|---|---|\n| `ms` | milliseconds |\n| `s` | seconds |\n| `m` | minutes |\n| `h` | hours |\n| `d` | days (24h, DST ignored) |\n| `w` | weeks (7d) |\n| `y` | years (365d, leap days ignored) |\n| \n\nYou can chain units under two conditions. The units must run from the largest to the smallest, and each unit must appear once. `1h30m` and `12h34m56s` are both valid.\n\nA duration is really a float literal in seconds. `1s` is `1`, and `1ms` is `0.001`. But you can only add a unit suffix to a decimal integer. `1.5h` is not valid, and a hex number with a unit suffix is not valid.\n\n### Duration expressions\n\nYou can also build a duration with arithmetic. This works anywhere that PromQL expects a duration, such as range vector brackets and `offset`. `5m` multiplied by `2` gives a window of 10 minutes. `1h` divided by `2` gives an offset of 30 minutes. The operators `+ - * / % ^` all work with normal precedence.\n\n`offset` needs the expression in parentheses. Without them, `offset` uses only the first term.\n\nThree helper functions work inside a duration expression:\n\n- `step()` gives the step width of the range query. It gives `0s` when the query evaluates at a single point in time.\n- `range()` gives the end time minus the start time of a range query. It gives `0s` when the query evaluates at a single point in time.\n- `min_of()` and `max_of()` clamp a value. For example, `max_of(step(), 5s)` never lets the duration drop below 5 seconds.\n\nPromQL does not allow a duration expression inside the `@` modifier.\n\n## Shift time: `offset` and `@`\n\n**`offset`** shifts where a selector looks, relative to the evaluation time of the query. Add `offset 5m` to a selector, and it gives the value from 5 minutes ago.\n\n`offset` also works on a range vector, and it combines with functions. Combine a `[5m]` range with `offset 1w`, and you get this week&#x27;s 5-minute rate as it looked a week ago. A negative offset looks forward instead of back. This helps you compare against &quot;the future&quot; relative to an earlier evaluation point.\n\n**`@`** pins a selector to an absolute Unix timestamp instead of a relative offset. For example: `http_requests_total @ 1609746000`.\n\n`start()` and `end()` are useful special values here. In <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N5: multi-word noun &#x27;range query they resolve&#x27; over 3 words\">a</mark> range query they resolve to the start time of the query and the end time of the query. They stay fixed across every step. When the query evaluates at a single point in time, both resolve to the evaluation time.\n\n### One rule for both modifiers\n\nEach modifier binds to the selector immediately to its left. It does not bind to the whole enclosing expression.\n\nWrap the bare selector, with its `offset` or `@` attached, inside an aggregation such as `sum(...)`. That is correct. Put the modifier after the closing parenthesis of `sum(...)`, and you get a syntax error.\n\nYou can combine `offset` and `@` on the same selector, and the order does not matter. Prometheus always applies the offset relative to the `@` time.\n\n## Subqueries\n\nA subquery takes an expression that evaluates at a single point in time. It runs that expression again and again over a range. This turns the expression into a range vector.\n\nA subquery helps when you want to apply a range-vector function on top of something that PromQL already computed, such as a rate. `max_over_time` is one such function. For example, wrap `rate(metric[5m])` in a further `[30m:1m]` window. This gives the maximum of that rate over the last 30 minutes, and it resolves the rate every 1 minute.\n\nThe resolution part is optional. Without it, the subquery uses the global evaluation interval.\n\n## Everything else, briefly\n\n- **Operators** and **functions** hold most of the power of PromQL. The operators include `+`, `and`, `on`, and `group_left`. The functions include `rate`, `sum`, `histogram_quantile`, and dozens more. Read about them once you are comfortable with selectors.\n- **Comments** start with `#` and run to the end of the line.\n- **String literals** use single quotes, double quotes, or backticks. A single-quoted string and a double-quoted string follow the escaping rules of Go. These rules cover backslash escapes and octal and hex escapes. A backtick string is raw. PromQL processes no escape in it, and it keeps a newline inside it as it is.\n- **Numeric literals** accept an integer, a decimal, scientific notation, a hex number, `Inf`, and `NaN`. They also accept underscores as digit separators, which helps you read a large number. For example: `1_000_000`.\n\n## Two problems to know about early\n\n### Staleness\n\nA query samples at fixed timestamps. These timestamps do not necessarily match the times that Prometheus scraped the data. Prometheus must therefore decide which value to report at each timestamp. It uses the newest sample that is less than the *lookback period* old. The default lookback period is 5 minutes. You can tune it with the `--query.lookback-delta` flag, or with a `lookback_delta` parameter on a single query.\n\nA target can stop being scraped, or it can disappear. Prometheus then marks its series as stale. Once the evaluation timestamp of a query passes that staleness point, the series stops appearing in the results. This is the reason that a line on a graph visibly ends instead of running flat forever.\n\n### Performance\n\nA bare metric name selector can quietly expand into thousands of series when the metric has high cardinality. Any aggregation over that many series costs real work on the server, even when the final output is a single number. A sum over a huge column in an SQL database is not free either, and the result there is also one row.\n\nWhen you explore an unfamiliar metric, follow three steps:\n\n1. Check the metric in the tabular view first.\n2. Narrow it down with label matchers or aggregation until the result set is a reasonable size.\n3. Only then switch to a graph.\n\nA query can stay expensive even after you narrow it. Recording rules solve that case. Prometheus computes the result once. You then query that cheap result many times.\n\n---\n\nTwo notes about the process. I could not save this as a file in this session. The file-write tool was not enabled. The sandbox policy also blocked shell redirection to files.\n\nThe policy also flags a label matcher in curly braces as suspicious shell syntax. This is the reason that a couple of the examples above describe the code in prose instead of showing a literal `{job=&quot;...&quot;}` snippet.\n\nIf you want this as a real `.md 0, signals are <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V9: marketing adjective &#x27;first-class&#x27;\">first-class</mark> values (the `Signal` type), so you can pass them around, store them in variables, and connect to them directly instead of juggling string names.\n\n## The basic idea\n\n1. An object **emits** a signal \u2014 think of it as broadcasting an event.\n2. Any number of other objects can **connect** a callback (a method) to that signal beforehand.\n3. When the signal fires, Godot calls every connected callback, passing along whatever arguments the signal carries.\n\nA connection is a one-directional link: `A.some_signal \u2192 B.some_method`. Node A never references node B directly to make this happen<mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\"> </mark>\u2014 the connection lives on the signal itself.\n\n## Connecting through the editor\n\nFor nodes already in your scene tree, the quickest way to wire things up is the **Node dock \u2192 Signals tab**. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N1: instruction is 26 words, limit 20\">Select</mark> a node, and <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> see every signal it can emit (built-in ones like `pressed` on a `Button`, plus any custom signals defined in its script).\n\nDouble-click a signal and Godot opens a connection dialog. Point it at the target node, and:\n\n- If the target has a script attached, Godot can auto-generate a stub callback method for you.\n- By convention, generated callbacks are named `_on_&lt;node_name&gt;_&lt;signal_name&gt;` (GDScript) or `On&lt;NodeName&gt;&lt;SignalName&gt;` (C#) \u2014 <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. `_on_button_pressed`.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 36 words, limit 25\">There&#x27;s</mark> also an &quot;Advanced&quot; mode in that dialog that lets you connect to *any* method on *any* node (not just ones with attached scripts), pass extra bound arguments, and set connection flags like one-shot or deferred.\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 34 words, limit 25\">The</mark> editor-made connection is stored in the scene file, and a little icon appears in the script&#x27;s gutter next to the callback so you can click it later to inspect or remove the connection.\n\nOne caveat: <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 29 words, limit 25\">if</mark> you write your scripts in an external editor, Godot&#x27;s auto-stub-generation on connect <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;won&#x27;t&#x27;\">won&#x27;t</mark> kick in <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N3: contraction &#x27;you&#x27;ll&#x27;\">you&#x27;ll</mark> just need to write the method yourself, or connect via code instead.\n\n## Connecting from code\n\nEditor connections only work for nodes that already exist in a saved scene. Anything you spawn or instantiate at runtime <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> dynamically created enemies, procedurally added UI, <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-V8: Latin abbreviation &#x27;etc.&#x27;; use &#x27;and others&#x27;\">etc</mark>. \u2014 has to be connected in code.\n\nThe pattern is: get a reference to the signal-emitting object, then call `.connect()` on the signal, passing the callback.\n\n```gdscript\nfunc _ready():\n    var timer = get_node(&quot;Timer&quot;)\n    timer.timeout.connect(_on_timer_timeout)\n\nfunc _on_timer_t ta-i=\"27\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. waiting for an animation or a delay without setting up a separate callback method.\n\n## Defining your own signals\n\nSignals <mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> just for built-in nodes <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> you declare custom ones in any script with the `signal` keyword:\n\n```gdscript\nextends Node2D\n\nsignal health_depleted\n\nvar health = 10\n```\n\n```csharp\npublic partial class Player : Node2D\n{\n    [Signal]\n    public delegate void HealthDepletedEventHandler();\n\n    private int _health = 10;\n}\n```\n\nA couple of naming notes: <mark id=\"f30\" class=\"hit\" data-i=\"30\" title=\"PSTE-N2: description is 31 words, limit 25\">custom</mark> signals show up in the Signals dock exactly like built-in ones, and by convention <mark id=\"f31\" class=\"hit\" data-i=\"31\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> named as past-tense events (`health_depleted`, not `deplete_health`) since a signal represents something that *already happened*.\n\nTo fire one, call `emit()`:\n\n```gdscript\nfunc take_damage(amount):\n    health -= amount\n    if health &lt;= 0:\n        health_depleted.emit()\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    _health -= amount;\n    if (_health &lt;= 0)\n        EmitSignal(SignalName.HealthDepleted);\n}\n```\n\n### Passing data with a signal\n\nSignals can carry arguments, declared in the signal definition itself:\n\n```gdscript\nsignal health_changed(old_value, new_value)\n```\n\n```csharp\n[Signal]\npublic delegate void HealthChangedEventHandler(int oldValue, int newValue);\n```\n\nThese declared parameter names are mostly for documentation and editor tooling <mark id=\"f32\" class=\"hit\" data-i=\"3 atching callback signature for you. Godot does not enforce them at emit time, so passing the right values and the right count is up to you:\n\n```gdscript\nfunc take_damage(amount):\n    var old_health = health\n    health -= amount\n    health_changed.emit(old_health, health)\n```\n\n```csharp\npublic void TakeDamage(int amount)\n{\n    int oldHealth = _health;\n    _health -= amount;\n    EmitSignal(SignalName.HealthChanged, oldHealth, _health);\n}\n```\n\nA connected callback needs only matching parameters:\n\n```gdscript\nfunc _on_health_changed(old_value, new_value):\n    health_bar.value = new_value\n```\n\n## Where you&#x27;ll run into signals\n\nThey appear throughout Godot&#x27;s built-in nodes, not only in UI:\n\n- `Area2D.body_entered` \u2014 something physical entered a detection zone. Good for pickups, triggers, hazards.\n- `Timer.timeout` \u2014 a countdown finished.\n- `Button.pressed`, and similar UI signals for value changes, focus, resizing, and more.\n- `Node.tree_entered` / `tree_exited` \u2014 lifecycle events as nodes enter or leave the scene tree.\n\n<mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 30 words, limit 25\">Whenever</mark> you want object A to call a method on object B directly just because something happened in A, ask whether a signal would keep them more loosely coupled instead.\n\n---\n\n<mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 38 words, limit 25\">Let</mark> me know if you&#x27;d like this saved to a specific file once a write-capable path is available, or if you want a version aimed at a different audience <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> more editor-workflow-focused for beginners, or code-only for experienced devs.", "factLoss": true, "fidelity": {"source_words": 1101, "rewrite_words": 1039, "findings": [{"kind": "unit", "severity": "critical", "message": "'1' became '1 seco
