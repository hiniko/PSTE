set": 43, "severity": "MUST", "arbitrated": false, "offset": 5124, "token": ","}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "If you are using caching provided by Django, you should consider clearing your", "line": 137, "column": 50, "excerpt_offset": 49, "severity": "MUST", "arbitrated": false, "offset": 5130, "token": "should"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'are caching'", "excerpt": "are caching pickled objects as these objects are not guaranteed to be", "line": 139, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5240, "token": "are"}, {"rule": "PSTE-G6", "message": "'-ing' main verb 'was caching'", "excerpt": "was caching pickled :class:", "line": 141, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5387, "token": "was"}], "html": "========================================\nHow to upgrade Django to a newer version\n========================================\n\nUpgrading Django to the latest version offers several benefits:\n\n* New features and improvements become available.\n* Bugs are fixed.\n* Older versions of Django eventually stop receiving security updates\n  (see :ref:`supported-versions-policy`).\n* Upgrading with each new release helps keep your code base current and makes\n  future upgrades smoother.\n\n.. admonition:: Tools to help with version upgrades\n\n    Django has a vibrant ecosystem. There are automated upgrade helpers\n    highlighted on the `Community Ecosystem\n    &lt;https://www.djangoproject.com/community/ecosystem/#upgrade-utilities&gt;`__\n    page.\n\nHere are some things to consider to help make your upgrade process as smooth as\npossible.\n\nRequired Reading\n================\n\nIf <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> your first time doing an upgrade, it is useful to read the :doc:`guide\non the different release processes &lt;/internals/release-process&gt;`.\n\nAfterward<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> familiarize yourself with the changes that were made in\nthe new Django version(s):\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release from\n  the one after your current Django version, up to and including the version to\n  which you plan to upgrade.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for the\n  relevant versions.\n\nPay particular attention to backwards incompatible changes to get a clear idea\nof what will be needed for a successful upgrade.\n\n<mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">If</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> upgrading through more than one feature version (<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. 2.0 to 2.2),\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> usually easier to upgrade through each feature release incrementally\n(2.0 to 2.1 to 2.2) rather than to make all the changes for each feature\nrelease at once. For each feature release, use the latest patch release (<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g.\nfor 2.1, use 2.1.15).\n\nThe same incremental upgrade approach is recommended when upgrading from one\nLTS to the next.\n\nDependencies\n============\n\n<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases it will be necessary to upgrade to the latest version of your\nDjango-related dependencies as well. If the Django version was recently\nreleased or if some of your dependencies are not well-maintained, some of your\ndependencies may not yet support the new Django version. In these cases you may\nhave to wait until new versions of your dependencies are released.\n\nResolving deprecation warnings\n==============================\n\nBefore upgrading, <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> a good idea to resolve any deprecation warnings raised\nby your project while using your current version of Django. Fixing these\nwarnings before upgrading ensures that <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> informed about areas of the code\nthat need altering.\n\nIn Python, deprecation warnings are silenced by default. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must turn them on\nusing the ``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS`\nenvironment variable. For example, to show warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> not using the Django test runner, you may need to also ensure that\nany console output is not captured which would hide deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve any deprecation warnings with your current version of Django before\ncontinuing the upgrade process.\n\nThird party applications might use deprecated APIs in order to support multiple\nversions of Django, so deprecation warnings in packages <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N3: contraction &#x27;you&#x27;ve&#x27;\">you&#x27;ve</mark> installed <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark>\nnecessarily indicate a problem. If a package <mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest version\nof Django, consider raising an issue or sending a pull request for it.\n\nInstallation\n============\n\nOnce <mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready, it is time to :doc:`install the new Django version\n&lt;/topics/install&gt;`. If you are using a :mod:`virtual environment &lt;venv&gt;` and it\nis a major upgrade, you might want to <mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the\ndependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U``\nflag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWhen the new environment is <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;it&#x27;s&#x27;\">it&#x27;s</mark> useful to turn\non deprecation warnings on so <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N3: contraction &#x27;they&#x27;re&#x27;\">they&#x27;re</mark> shown in the test output (you can also\nuse the flag if you test your app manually using ``manage.py runserver``):\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you <mark id=\"f21\" class=\"hit\" data-i=\"21\" title=\"PSTE-G4: perfect tense &#x27;have run&#x27;; use simple past\">have</mark> run the tests, fix any failures. While you have the release\nnotes fresh in your mind, it may also be a good time to take advantage of new\nfeatures in Django by refactoring your code to eliminate any deprecation\nwarnings.\n\nIf you <mark id=\"f22\" class=\"hit\" data-i=\"22\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are upgrading&#x27;\">are</mark> upgrading to an alpha, beta, or release candidate<mark id=\"f23\" class=\"hit\" data-i=\"23\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please see our\nguide on :ref:`testing-pre-releases` for more specific tips about catching\nregressions and reporting bugs.\n\nDeployment\n==========\n\nWhen you are sufficiently confident your app works with the new version of\nDjango, <mark id=\"f24\" class=\"hit\" data-i=\"24\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> ready to <mark id=\"f25\" class=\"hit\" data-i=\"25\" title=\"PSTE-G8: phrasal verb &#x27;go ahead&#x27;; use &#x27;start&#x27;\">go</mark> ahead and :doc:`deploy &lt;/howto/deployment/index&gt;`\nyour upgraded Django project.\n\n<mark id=\"f26\" class=\"hit\" data-i=\"26\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you <mark id=\"f27\" class=\"hit\" data-i=\"27\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;are using&#x27;\">are</mark> using caching provided by Django<mark id=\"f28\" class=\"hit\" data-i=\"28\" title=\"PSTE-P1: &#x27;you should&#x27; is not the imperative form; write the instruction as a command\">,</mark> you <mark id=\"f29\" class=\"hit\" data-i=\"29\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> consider clearing your\ncache after upgrading. Otherwise you may run into problems, for example, if you lt;/releases/index&gt;` for every &#x27;final&#x27; release\n  from the one after your current version up to and including your target\n  version.\n* Check the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for those\n  versions.\n\nFocus on the backwards incompatible changes. They tell you what the upgrade\nwill actually require.\n\nCrossing more than one feature version (say, 2.0 to 2.2)? Go one feature\nrelease at a time <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> 2.0 to 2.1, then 2.1 to 2.2 \u2014 rather than making all the\nchanges for every release at once. Use the latest patch release of each\nfeature version (for 2.1, use 2.1.15).\n\nDo the same thing, one step at a time, when moving from one LTS to the next.\n\nDependencies\n============\n\nYou will usually need to upgrade your Django-related dependencies too. When\nthe Django version is new, or a dependency is not well-maintained, that\ndependency may not support the new Django version yet. Then you have to wait\nfor a new release of it.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, clear any deprecation warnings your project raises on your\n*current* Django version. Fixing them first tells you which parts of your code\nneed changing.\n\nPython silences deprecation warnings by default. Turn them on with the ``-Wa``\ncommand line option or the :envvar:`PYTHONWARNINGS` environment variable. To\nshow warnings while running tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nNot using the Django test runner? Make sure console output <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N3: contraction &#x27;isn&#x27;t&#x27;\">isn&#x27;t</mark> captured, or\nthe warnings will be hidden. With `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current Django version before you\ngo further.\n\nWarnings from installed packages <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-N3: contraction &#x27;aren&#x27;t&#x27;\">aren&#x27;t</mark> necessarily a problem: third party\napplications may use deprecated APIs on purpose, to support several Django\nversions at once. If a package <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N3: contraction &#x27;doesn&#x27;t&#x27;\">doesn&#x27;t</mark> support the latest Django, consider\nraising an issue or sending a pull request for it.\n\nInstallation\n============\n\nNow :doc:`install the new Django version &lt;/topics/install&gt;`. For a major\nupgrade in a :mod:`virtual environment &lt;venv&gt;`, consider building a fresh\nenvironment with all the dependencies first.\n\nIf you installed Django with pip_, use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nWith the new environment in place, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Turn deprecation warnings on\nagain so they appear in the test output <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> the flag also works if you test\nmanually with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nFix any failures. The release notes are still fresh in your mind, so this is\nalso a good moment to refactor your code, take advantage of new Django\nfeatures, and eliminate any deprecation warnings.\n\nUpgrading to an alpha, beta, or release candidate? See our guide on\n:ref:`testing-pre-releases` for tips on catching regressions and reporting\nbugs.\n\nDeployment\n==========\n\nOnce <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N3: contraction &#x27;you&#x27;re&#x27;\">you&#x27;re</mark> confident your app works on the new Django version, :doc:`deploy\n&lt;/howto/deployment/index&gt;` the upgraded project.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">If</mark> you use Django&#x27;s caching, consider clearing the cache after upgrading.\nCached pickled objects are not guaranteed to be pickle-compatible across\nDjango versions, so leaving them in place can cause problems. One past example\nof this incompatibility <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-G6: &#x27;-ing&#x27; main verb &#x27;was caching&#x27;\">was</mark> caching pickled\n:class:`~django.http.HttpResponse` objects, either directly or indirectly via\nthe :func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": true, "fidelity": {"source_words": 862, "rewrite_words": 695, "findings": [{"kind": "negation", "severity": "critical", "message": "the source negates 6 times, the rewrite 5. A lost negation reverses the meaning."}, {"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 14. Check that no condition was dropped."}], "critical": 1, "warnings": 1, "faithful": false}, "semantic": [{"rule": "PSTE-A1", "quote": "You will usually need to upgrade your Django-related dependencies too.", "problem": "The original says to upgrade dependencies \"to the latest version\", and the rewrite drops the target version.", "fix": "Write \"You will usually need to upgrade your Django-related dependencies to their latest versions too.\"", "reason": "A scope qualifier that tells the reader which version to install disappeared from the source sentence.", "confidence": "high", "status": "confirmed", "seenIn": 1, "of": 1, "agreement": 1.0, "located": true, "line": 50, "column": 1, "offset": 1708}, {"rule": "PSTE-D4", "quote": "refactor your code, take advantage of new Django features, and eliminate", "problem": "Three parallel actions are packed into one prose sentence instead of a bulleted list.", "fix": "Put the three actions in a bulleted list under one lead sent gt;`__\n    page shows automatic helpers for an upgrade.\n\nConsider the points below to make your upgrade easier.\n\nRequired Reading\n================\n\nIf this is your first upgrade, read the :doc:`guide on the different release\nprocesses &lt;/internals/release-process&gt;`.\n\nThen learn the changes that Django made in the new version or versions:\n\n* Read the :doc:`release notes &lt;/releases/index&gt;` for each &#x27;final&#x27; release. Start\n  with the release after your current Django version. End with the version that\n  you plan to upgrade to.\n* Look at the :doc:`deprecation timeline&lt;/internals/deprecation&gt;` for these\n  versions.\n\nGive close attention to the backwards incompatible changes. They show you what a\nsuccessful upgrade needs.\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-D2: paragraph has 9 sentences, limit 6\">If</mark> you upgrade through more than one feature version, for example 2.0 to 2.2,\nupgrade through each feature release one at a time. Go from 2.0 to 2.1, then 2.1\nto 2.2. This is usually easier than all the changes for each feature release at\nonce. For each feature release, use the latest patch release. For 2.1, use\n2.1.15.\n\nUse the same one-at-a-time approach when you upgrade from one LTS to the next.\n\nDependencies\n============\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-D2: paragraph has 7 sentences, limit 6\">In</mark> most cases you must also upgrade your Django-related dependencies to their\nlatest version. Some dependencies may not yet support the new Django version.\nThis happens when Django released the version recently, or when somebody does\nnot maintain a dependency well. In these cases you may need to wait for the new\nversions of your dependencies.\n\nResolving deprecation warnings\n==============================\n\nBefore you upgrade, resolve the deprecation warnings that your project raises on\nyour current version of Django. If you fix these warnings first, you learn which\nparts of the code need a change.\n\nPython silences deprecation warnings by default. <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-P1: &#x27;You must&#x27; is not the imperative form; write the instruction as a command\">You</mark> must turn them on with the\n``-Wa`` Python command line option or the :envvar:`PYTHONWARNINGS` environment\nvariable. For example, to show warnings while you run the tests:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nIf you do not use the Django test runner, you may also need to make sure that\nnothing captures the console output. Capture hides the deprecation warnings. For\nexample, if you use `pytest &lt;https://docs.pytest.org/&gt;`__:\n\n.. code-block:: console\n\n    $ PYTHONWARNINGS=always pytest tests --capture=no\n\nResolve every deprecation warning on your current version of Django before you\ncontinue the upgrade.\n\nA third party application may use a deprecated API to support several versions of\nDjango. A deprecation warning in a package that you installed does not always\nmean a problem. If a package does not support the latest version of Django,\nconsider an issue or a pull request for it.\n\nInstallation\n============\n\nWhen you are ready, :doc:`install the new Django version &lt;/topics/install&gt;`. If\nyou use a :mod:`virtual environment &lt;venv&gt;` and this is a major upgrade, you may\nwant to <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up a new environment with all the dependencies first.\n\nIf you installed Django with pip_, you can use the ``--upgrade`` or ``-U`` flag:\n\n.. console::\n\n   $ python -m pip install -U Django\n\n.. _pip: https://pip.pypa.io/\n\nTesting\n=======\n\nAfter you <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G8: phrasal verb &#x27;set up&#x27;; use &#x27;install&#x27;\">set</mark> up the new environment, :doc:`run the full test suite\n&lt;/topics/testing/overview&gt;` for your application. Again, <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-G8: phrasal verb &#x27;turn on&#x27;; use &#x27;enable&#x27;\">turn</mark> on the deprecation\nwarnings so the test output shows them. You can also use the flag if you test\nyour app by hand with ``manage.py runserver``:\n\n.. console::\n\n    $ python -Wa manage.py test\n\nAfter you run the tests, fix every failure. The release notes are fresh in your\nmind, so this is also a good time to use the new features in Django. Refactor\nyour code to remove the deprecation warnings.\n\nIf you upgrade to an alpha, a beta, or a release candidate, see our guide on\n:ref:`testing-pre-releases`. It gives more exact tips to catch a regression and\nto report a bug.\n\nDeployment\n==========\n\nWhen you are confident that your app works with the new version of Django, you\ncan :doc:`deploy &lt;/howto/deployment/index&gt;` your upgraded Django project.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> you use the cache that Django gives, consider a clear of your cache after the\nupgrade. If you do not clear it, you may meet problems. For example, you may\ncache pickled objects, and Django does not guarantee that these objects stay\npickle-compatible across Django versions. One past example of this problem was a\ncache of pickled :class:`~django.http.HttpResponse` objects, either directly or\nthrough the :func:`~django.views.decorators.cache.cache_page` decorator.", "factLoss": false, "fidelity": {"source_words": 862, "rewrite_words": 821, "findings": [{"kind": "condition", "severity": "warning", "message": "the source states 28 conditions, the rewrite 26. Check that no condition was dropped."}], "critical": 0, "warnings": 1, "faithful": true}, "semantic": [{"rule": "PSTE-A1", "quote": "The release notes are fresh in your mind, so this is also", "problem": "The original states this as a condition, \"While you have the release notes fresh , "token": "When"}, {"rule": "PSTE-N3", "message": "contraction 'don\u2019t'", "excerpt": "When a spend is \u201crebased\u201d on top of the latest version of the singleton, we don\u2019t update t", "line": 60, "column": 82, "excerpt_offset": 76, "severity": "MUST", "arbitrated": false, "offset": 5366, "token": "don\u2019t"}, {"rule": "PSTE-N2", "message": "description is 29 words, limit 25", "excerpt": "When ingesting spend bundles into the mempool, any spend eligible for fast-forward is vali", "line": 61, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 5460, "token": "When"}], "html": "\n# Block creation impacted due to mempool issues.\n\n## Issue Summary\n\n<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N2: description is 40 words, limit 25\">Farmers</mark> that are eligible to create the next block have a limited time (approximately 28 seconds) to create an unfinished block and via network propagation get this to a timelord that will infuse the unfinished block to construct the finished block.\n\n<mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 37 words, limit 25\">Farmers</mark> will take transactions from the mempool ordered by fee per cost, and add them into the unfinished block as a way to benefit from fees attached to transactions that go to the farmer making the block.\n\nCNI detected that while the mempool was completely full, transactions were not being included in blocks. Additionally, block production slowed down <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-V8: Latin abbreviation &#x27;versus&#x27;; use &#x27;compared with&#x27;\">versus</mark> expected production rate. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 28 words, limit 25\">It</mark> was determined that farmers eligible to create blocks were not creating unfinished blocks in time due to several bugs in <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nFast forward spends are a way for a singleton transaction to be able to apply to future versions of the singleton.\n\nFast forward spends enable offer files to refer to singletons by coin ID, even though the coin ID changes for every state update.\n\nIn addition, fast forward spends are used for vaults. <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 31 words, limit 25\">Because</mark> the vault singleton is used to authorize all coins belonging to it, it would be too limiting to only be able to have one vault spend \u201cin-flight\u201d at a time. <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-N2: description is 26 words, limit 25\">Fast</mark> forward allows multiple spends of the vault singleton to be in the mempool concurrently, and farmers deduplicate and rebase them sequentially as they create blocks.\n\n\nCNI determined the following issues were the root cause of the block creation slow down:\n* 1. Fast forward spends <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> become invalid just because their coin is spent. They can be fast-forwarded to the latest version of the singleton. Fast-forward spends rely on other parts of the spend bundle for being evicted  (<mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-V8: Latin abbreviation &#x27;e.g.&#x27;; use &#x27;for example&#x27;\">e</mark>.g. that coin is spent by a block). <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-N2: description is 27 words, limit 25\">We</mark> failed to consider the case where the only spend in a bundle was a fast-forward spend, it would not be evicted after the singleton was melted. \n* 2. FF-Spends enter the mempool even if their coin is already spent. When we form the block they will be fast-forwarded on top of the latest version of the singleton. However, we failed to validate that the singleton still existed. <mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-V8: Latin abbreviation &#x27;i.e.&#x27;; use &#x27;that is&#x27;\">I</mark>.e. we would accept singleton spends into the mempool for singletons which <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-G4: perfect tense &#x27;have been melted&#x27;; use simple past\">have</mark> been melted and no longer exist.\n* 3. When we formed a block, FF spends would be updated to spend the most recent coin of a singleton. <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-N2: description is 26 words, limit 25\">This</mark> update was done in place, causing the mempool to change and propagate the fast-forwarded versions of the mempool item to the rest of the network. This would cause the mempool item to duplicate (double in numbers) every time a farmer tried to form a block.\n\nWith these 3 bugs, someone submitting a singleton spend that\u2019s eligible for fast forward, without bundling it with any other spend would:\n* Be considered valid and enter the mempool and propagate throughout the network.\n* Whenever a farmer would make a block, it would multiply the spend, propagating the new transactions throughout the network (3)\n* Trying to stop the spread by melting the singleton makes the transactions not <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-G8: phrasal verb &#x27;go through&#x27;; use &#x27;read&#x27;\">go</mark> through, but the spends were not evicted from the mempool (2). In our scenario, mempool was full of these spends when this happened. All of these spends failed during block creation, causing farmers to time-out before finding any valid transactions.\n* <mark id=\"f14\" class=\"hit\" data-i=\"14\" title=\"PSTE-N2: description is 31 words, limit 25\">Farmers</mark> trying to create a block with the affected mempool items would experience performance issues leading them to miss the cutoff time for their block to be included in the blockchain.\n\n\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm - Mempool spendbundle count started slowly increasing.\n\n02-14-2025 11:30 am - Mempool cost hits max cost.\n\n02-14-2025 1:10 pm - Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm - The Chia blockchain netspace started decreasing and timelord infused blocks per minute had a marked drop.\n\n02-14-2025 11:00 pm - The cause of the issues were diagnosed by CNI and a hotfix release of the chia blockchain software was prepared.\n\n02-15-2025 1:30 am - The hotfix release of the Chia blockchain software build process was initiated.\n\n02-15-2025 3:00 am - The hotfix release of the Chia blockchain software deployment completed as version 2.5.1\n\n02-19-2025 3:15 pm - Version 2.5.2 was released that included the bug fixes for the Fast Forward issues detailed in the Issue Summary.\n\n\n\n## Resolution and recovery\n\n<mark id=\"f15\" class=\"hit\" data-i=\"15\" title=\"PSTE-N2: description is 32 words, limit 25\">Due</mark> to the decentralized nature of the Chia blockchain with different configurations and versions distributed over many nodes, the majority of the blockchain netspace was not impacted by the Fast Forward issues.\n\n<mark id=\"f16\" class=\"hit\" data-i=\"16\" title=\"PSTE-N2: description is 27 words, limit 25\">Version</mark> 2.5.1 of the Chia blockchain contains a workaround that caps the unfinished block creation time, to ensure the unfinished block reaches a timelord in a timely manner. The blockchain netspace started recovery towards previous levels after the v2.5.1 release.\n\n<mark id=\"f17\" class=\"hit\" data-i=\"17\" title=\"PSTE-N2: description is 30 words, limit 25\">Version</mark> 2.5.2 included fixes that as a result invalidated the mempoolItems from the Fast Forward issues and the mempool was cleared of these items along with the userbase uptake of v2.5.2.\n* 1. SpendBundles submitted to the mempool that only contained fast-forward spends are rejected.\n* 2. <mark id=\"f18\" class=\"hit\" data-i=\"18\" title=\"PSTE-N2: description is 30 words, limit 25\">When</mark> a spend is \u201crebased\u201d on top of the latest version of the singleton, we <mark id=\"f19\" class=\"hit\" data-i=\"19\" title=\"PSTE-N3: contraction &#x27;don\u2019t&#x27;\">don\u2019t</mark> update the item in the mempool, risking distributing this new copy to the network.\n* 3. <mark id=\"f20\" class=\"hit\" data-i=\"20\" title=\"PSTE-N2: description is 29 words, limit 25\">When</mark> ingesting spend bundles into the mempool, any spend eligible for fast-forward is validated to ensure the latest version of this singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 757, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'mempool logic around fast forward spends' over 3 words", "excerpt": "farmers eligible to create blocks were not building unfinished blocks in time, because of ", "line": 9, "column": 267, "excerpt_offset": 106, "severity": "MUST", "arbitrated": true, "offset": 695, "token": "the"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "Fast forward lets several spends of the vault singleton sit in the mempool at once; farmer", "line": 15, "column": 184, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1138, "token": "Fast"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "Fast forward lets several spends of the vault singleton sit in the mempool at once; farmer", "line": 15, "column": 266, "excerpt_offset": 82, "severity": "MUST", "arbitrated": false, "offset": 1220, "token": ";"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "FF-spends enter the mempool even when their coin is already spent, because at block-formin", "line": 20, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 1787, "token": "FF-spends"}, {"rule": "PSTE-G4", "message": "perfect tense 'had been melted'; use simple past", "excerpt": "So we accepted singleton spends into the mempool for singletons that had been melted and n", "line": 20, "column": 297, "excerpt_offset": 69, "severity": "MUST", "arbitrated": false, "offset": 2078, "token": "had"}, {"rule": "PSTE-N2", "message": "description is 26 words, limit 25", "excerpt": "Farmers trying to build a block from the affected mempool items hit performance problems, ", "line": 28, "column": 3, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 3131, "token": "Farmers"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-14-2025 4:45 pm \u2014 Chia blockchain netspace starts decreasing; timelord infused blocks p", "line": 38, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 3585, "token": "\u2014"}, {"rule": "PSTE-X1", "message": "semicolon; write two sentences", "excerpt": "02-14-2025 4:45 pm \u2014 Chia blockchain netspace starts decreasing; timelord infused blocks p", "line": 38, "column": 64, "excerpt_offset": 63, "severity": "MUST", "arbitrated": false, "offset": 3629, "token": ";"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-14-2025 11:00 pm \u2014 CNI diagnoses the cause and prepares a hotfix release of the Chia bl", "line": 40, "column": 21, "excerpt_offset": 20, "severity": "SHOULD", "arbitrated": false, "offset": 3705, "token": "\u2014"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-19-2025 3:15 pm \u2014 Version 2.5.2 released, containing the bug fixes for the Fast Forward", "line": 46, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 3958, "token": "\u2014"}, {"rule": "PSTE-N2", "message": "description is 27 words, limit 25", "excerpt": "The Chia blockchain is decentralized, with many nodes running different configurations and", "line": 50, "column": 1, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4098, "token": "The"}, {"rule": "PSTE-N2", "message": "description is 31 words, limit 25", "excerpt": "When a spend is \"rebased\" onto the latest version of the singleton, we no longer update th", "line": 57, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4748, "token": "When"}, {"rule": "PSTE-G4", "message": "perfect tense 'had risked'; use simple past", "excerpt": "When a spend is \"rebased\" onto the latest version of the singleton, we no longer update th", "line": 57, "column": 125, "excerpt_offset": 119, "severity": "MUST", "arbitrated": false, "offset": 4867, "token": "had"}, {"rule": "PSTE-N2", "message": "description is 28 words, limit 25", "excerpt": "When spend bundles are ingested into the mempool, every fast-forward-eligible spend is che", "line": 58, "column": 6, "excerpt_offset": 0, "severity": "MUST", "arbitrated": false, "offset": 4925, "token": "When"}], "html": "# Block Creation Slowed by Mempool Bugs\n\n## Issue Summary\n\nA farmer eligible to create the next block has about 28 seconds to build an unfinished block and get it, via network propagation, to a timelord. The timelord then infuses it to make the finished block.\n\nFarmers pull transactions from the mempool in fee-per-cost order and put them in the unfinished block. This earns the farmer the fees attached to those transactions.\n\nCNI found that the mempool was completely full, yet transactions were not getting into blocks. Block production also slowed below the expected rate. The cause: farmers eligible to create blocks were not building unfinished blocks in time, because of several bugs in <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N5: multi-word noun &#x27;mempool logic around fast forward spends&#x27; over 3 words\">the</mark> mempool logic around fast forward spends.\n\nA fast forward spend lets a singleton transaction apply to future versions of that singleton.\n\nThis is what lets offer files refer to singletons by coin ID, even though the coin ID changes on every state update.\n\nFast forward spends are also used for vaults. The vault singleton authorizes every coin belonging to it, so allowing only one vault spend &quot;in-flight&quot; at a time would be too limiting. <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-N2: description is 28 words, limit 25\">Fast</mark> forward lets several spends of the vault singleton sit in the mempool at once<mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> farmers then deduplicate and rebase them one after another as they build blocks.\n\nCNI traced the block creation slowdown to three root causes:\n\n* 1. A fast forward spend does not become invalid when its coin is spent \u2014 it can be fast-forwarded to the latest version of the singleton. Instead, fast forward spends depend on other parts of the spend bundle to get evicted (for example, that coin being spent by a block). We did not consider the case where a bundle&#x27;s only spend was a fast forward spend: it would never be evicted after the singleton was melted.\n* 2. <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-N2: description is 26 words, limit 25\">FF-spends</mark> enter the mempool even when their coin is already spent, because at block-forming time they will be fast-forwarded onto the latest version of the singleton. But we never checked that the singleton still existed. So we accepted singleton spends into the mempool for singletons that <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G4: perfect tense &#x27;had been melted&#x27;; use simple past\">had</mark> been melted and no longer existed.\n* 3. While forming a block, FF spends were updated to spend the singleton&#x27;s most recent coin. That update happened in place, which changed the mempool and propagated the fast-forwarded versions of the mempool item to the rest of the network. The mempool item therefore duplicated \u2014 doubled in number \u2014 every time a farmer tried to form a block.\n\nTogether, these three bugs meant that anyone submitting a fast-forward-eligible singleton spend, not bundled with any other spend, would see this:\n\n* The spend is considered valid, enters the mempool, and propagates across the network.\n* Every time a farmer made a block, the spend multiplied, and the new transactions propagated across the network (3).\n* Melting the singleton to stop the spread stopped the transactions going through, but did not evict the spends from the mempool (2). In our case, the mempool was full of these spends when this happened. Every one of them failed during block creation, so farmers timed out before finding any valid transactions.\n* <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-N2: description is 26 words, limit 25\">Farmers</mark> trying to build a block from the affected mempool items hit performance problems, and missed the cutoff time for getting their block into the blockchain.\n\n## Timeline (all times PST) 02/13/2025 - 02/19/2025. All times approximations\n\n02-13-2025 11:00 pm \u2014 Mempool spendbundle count begins slowly increasing.\n\n02-14-2025 11:30 am \u2014 Mempool cost hits max cost.\n\n02-14-2025 1:10 pm \u2014 Mempool spendbundle count plateaus at ~6200.\n\n02-14-2025 4:45 pm <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Chia blockchain netspace starts decreasing<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-X1: semicolon; write two sentences\">;</mark> timelord infused blocks per minute drops noticeably.\n\n02-14-2025 11:00 pm <mark id=\"f8\" class=\"hit\" data-i=\"8\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> CNI diagnoses the cause and prepares a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am \u2014 Build process for the hotfix release starts.\n\n02-15-2025 3:00 am \u2014 Hotfix release deployment completes, as version 2.5.1.\n\n02-19-2025 3:15 pm <mark id=\"f9\" class=\"hit\" data-i=\"9\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> Version 2.5.2 released, containing the bug fixes for the Fast Forward issues described in the Issue Summary.\n\n## Resolution and recovery\n\n<mark id=\"f10\" class=\"hit\" data-i=\"10\" title=\"PSTE-N2: description is 27 words, limit 25\">The</mark> Chia blockchain is decentralized, with many nodes running different configurations and versions, so most of the blockchain netspace was not affected by the Fast Forward issues.\n\nVersion 2.5.1 contains a workaround that caps unfinished block creation time, so the unfinished block reaches a timelord promptly. Netspace began recovering toward previous levels after the v2.5.1 release.\n\nVersion 2.5.2 contains fixes that invalidated the mempoolItems created by the Fast Forward issues. As users took up v2.5.2, the mempool cleared of those items.\n\n* 1. SpendBundles submitted to the mempool that contain only fast-forward spends are rejected.\n* 2. <mark id=\"f11\" class=\"hit\" data-i=\"11\" title=\"PSTE-N2: description is 31 words, limit 25\">When</mark> a spend is &quot;rebased&quot; onto the latest version of the singleton, we no longer update the item in the mempool, which <mark id=\"f12\" class=\"hit\" data-i=\"12\" title=\"PSTE-G4: perfect tense &#x27;had risked&#x27;; use simple past\">had</mark> risked distributing the new copy to the network.\n* 3. <mark id=\"f13\" class=\"hit\" data-i=\"13\" title=\"PSTE-N2: description is 28 words, limit 25\">When</mark> spend bundles are ingested into the mempool, every fast-forward-eligible spend is checked to confirm the latest version of that singleton still exists (with the given puzzle hash).", "factLoss": false, "fidelity": {"source_words": 966, "rewrite_words": 862, "findings": [], "critical": 0, "warnings": 0, "faithful": true}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 854, "findings": [{"rule": "PSTE-N5", "message": "multi-word noun 'mempool logic around fast-forward spends' over 3 words", "excerpt": "Several bugs in the mempool logic around fast-forward spends caused this.", "line": 9, "column": 257, "excerpt_offset": 16, "severity": "MUST", "arbitrated": true, "offset": 781, "token": "the"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-13-2025 11:00 pm \u2014 The count of spend bundles in the mempool started to increase slowly", "line": 34, "column": 21, "excerpt_offset": 20, "severity": "SHOULD", "arbitrated": false, "offset": 3549, "token": "\u2014"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-14-2025 1:10 pm \u2014 The count of spend bundles in the mempool plateaus at about 6200.", "line": 38, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 3704, "token": "\u2014"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-14-2025 4:45 pm \u2014 The netspace of the Chia blockchain started to decrease.", "line": 40, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 3792, "token": "\u2014"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-15-2025 1:30 am \u2014 The build process for the hotfix release started.", "line": 44, "column": 20, "excerpt_offset": 19, "severity": "SHOULD", "arbitrated": false, "offset": 4067, "token": "\u2014"}, {"rule": "PSTE-X5", "message": "em dash joining clauses; write two sentences", "excerpt": "02-15-2025 3:00 am \u2014 The deployment of e update.\n\nVaults also use fast-forward spends. The vault singleton authorizes all coins that belong to it. One vault spend &quot;in-flight&quot; at a time would be too limiting. Fast forward allows several spends of the vault singleton in the mempool at the same time. Farmers deduplicate the spends and rebase them one after another as they create blocks.\n\nCNI determined that these three issues were the root cause of the slow down in block creation:\n\n1. A fast-forward spend does not become invalid when its coin is spent. The spend can fast-forward to the latest version of the singleton. A fast-forward spend relies on other parts of the spend bundle for eviction. For example, a block spends that coin. We did not consider the case where a fast-forward spend is the only spend in a bundle. That bundle is not evicted after the singleton is melted.\n2. A fast-forward spend enters the mempool even if its coin is already spent. When we form the block, the spend fast-forwards on top of the latest version of the singleton. But we did not check that the singleton still existed. That is, we accepted singleton spends into the mempool for singletons that were melted and no longer exist.\n3. When we formed a block, a fast-forward spend was updated to spend the most recent coin of a singleton. This update happened in place. The update changed the mempool and propagated the fast-forwarded versions of the mempool item to the rest of the network. The mempool item then doubled in number every time a farmer tried to form a block.\n\nWith these 3 bugs, somebody could submit a singleton spend that is eligible for fast forward, and bundle it with no other spend. The following then happened:\n\n* The spend was considered valid. It entered the mempool and propagated throughout the network.\n* Whenever a farmer made a block, the spend multiplied. The new transactions propagated throughout the network (3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but the mempool did not evict the spends (2). In our scenario, the mempool was full of these spends when this happened. All of these spends failed during block creation. Farmers then timed out before they found any valid transaction.\n* Farmers that tried to create a block with the affected mempool items met performance problems. They missed the cutoff time for their block to enter the blockchain.\n\n## Timeline\n\nAll times are PST, from 02/13/2025 to 02/19/2025. All times are approximations.\n\n02-13-2025 11:00 pm <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> The count of spend bundles in the mempool started to increase slowly.\n\n02-14-2025 11:30 am \u2014 The mempool cost hits the maximum cost.\n\n02-14-2025 1:10 pm <mark id=\"f2\" class=\"hit\" data-i=\"2\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> The count of spend bundles in the mempool plateaus at about 6200.\n\n02-14-2025 4:45 pm <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> The netspace of the Chia blockchain started to decrease. The count of blocks that timelords infused per minute dropped sharply.\n\n02-14-2025 11:00 pm \u2014 CNI diagnosed the cause of the issues. CNI prepared a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> The build process for the hotfix release started.\n\n02-15-2025 3:00 am <mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-X5: em dash joining clauses; write two sentences\">\u2014</mark> The <mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-G7: nominalization &#x27;deployment of&#x27;; use a verb\">deployment</mark> of the hotfix release completed as version 2.5.1.\n\n02-19-2025 3:15 pm \u2014 Version 2.5.2 was released. It included the bug fixes for the fast-forward issues that the issue summary describes.\n\n## Resolution and recovery\n\nThe Chia blockchain is decentralized. Many nodes run different configurations and versions. So the fast-forward issues did not affect the majority of the blockchain netspace.\n\nVersion 2.5.1 of the Chia blockchain contains a workaround. The workaround caps the time to create an unfinished block. This makes sure the unfinished block reaches a timelord in time. The blockchain netspace started to recover towards previous levels after the v2.5.1 release.\n\nVersion 2.5.2 included fixes that invalidated the mempool items from the fast-forward issues. The mempool was cleared of these items as the userbase took up v2.5.2. The fixes are:\n\n1. The mempool rejects a spend bundle that contains only fast-forward spends.\n2. When a spend is &quot;rebased&quot; on top of the latest version of the singleton, we do not update the item in the mempool. The old <mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-V7: British spelling &#x27;behaviour&#x27;; use &#x27;behavior&#x27;\">behaviour</mark> risked distributing this new copy to the network.\n3. When the mempool ingests spend bundles, it checks every spend that is eligible for fast forward. The check makes sure the latest version of this singleton still exists, with the given puzzle hash.", "factLoss": true, "fidelity": {"source_words": 966, "rewrite_words": 957, "findings": [{"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 9 -> 8, some/most 3 -> 4)."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [], "semanticConfirmed": 0}, "pste_fixed": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 856, "findings": [], "html": "# Block creation slowed down by mempool problems\n\n## Issue summary\n\nA farmer that is eligible to create the next block has about 28 seconds to do the work. The farmer must create an un epted singleton spends into the mempool for singletons that were melted and no longer exist.\n3. When we formed a block, a fast-forward spend was updated to spend the most recent coin of a singleton. This update happened in place. The update changed the mempool and propagated the fast-forwarded versions of the mempool item to the rest of the network. The mempool item then doubled in number every time a farmer tried to form a block.\n\nWith these 3 bugs, somebody could submit a singleton spend that is eligible for fast forward, and bundle it with no other spend. The following then happened:\n\n* The spend was considered valid. It entered the mempool and propagated throughout the network.\n* Whenever a farmer made a block, the spend multiplied. The new transactions propagated throughout the network (3).\n* Melting the singleton to stop the spread stopped the transactions from going through, but the mempool did not evict the spends (2). In our scenario, the mempool was full of these spends when this happened. All of these spends failed during block creation. Farmers then timed out before they found any valid transaction.\n* Farmers that tried to create a block with the affected mempool items met performance problems. They missed the cutoff time for their block to enter the blockchain.\n\n## Timeline\n\nAll times are PST, from 02/13/2025 to 02/19/2025. All times are approximations.\n\n02-13-2025 11:00 pm. The count of spend bundles in the mempool started to increase slowly.\n\n02-14-2025 11:30 am \u2014 The mempool cost hits the maximum cost.\n\n02-14-2025 1:10 pm. The count of spend bundles in the mempool plateaus at about 6200.\n\n02-14-2025 4:45 pm. The netspace of the Chia blockchain started to decrease. The count of blocks that timelords infused per minute dropped sharply.\n\n02-14-2025 11:00 pm \u2014 CNI diagnosed the cause of the issues. CNI prepared a hotfix release of the Chia blockchain software.\n\n02-15-2025 1:30 am. The build process for the hotfix release mselves.\n\netcd supports restoring from snapshots that are taken from an etcd process of\nthe [major.minor](https://semver.org/) version. Restoring a version from a\ndifferent patch version of etcd is also supported. A restore operation is\nemployed to recover the data of a failed cluster.\n\nBefore starting the restore operation, a snapshot file must be present. It can\neither be a snapshot file from a previous backup operation, or from a remaining\n[data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring the cluster using [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md),\n   use the `--data-dir` option to specify to which folder the cluster <mark id=\"f3\" class=\"hit\" data-i=\"3\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> <mark id=\"f4\" class=\"hit\" data-i=\"4\" title=\"PSTE-G1: passive voice &#x27;be restored&#x27;; name the actor\">be</mark> restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   where `&lt;data-dir-location&gt;` is a directory that will be created during the restore process.\n\n\n   The usage of `etcdctl` for restoring has been **deprecated** since etcd v3.5.x and is slated for removal from etcd v3.6.\n   It is recommended to utilize [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   The below example depicts the usage of the `etcdctl` tool for the restore operation:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before restoring the cluster. \n   Otherwise, change etcd configuration and restart the etcd process after restoration to have it use the new data directory:\n   first change  `/etc/kubernetes/manifests/etcd.yaml`&#x27;s `volumes.hostPath.path` for `name: etcd-data`  to `&lt;data-dir-location&gt;`,\n   then execute `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see\n[etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\n<mark id=\"f5\" class=\"hit\" data-i=\"5\" title=\"PSTE-D2: paragraph has 11 sentences, limit 6\">If</mark> the access URLs of the restored cluster are changed from the previous\ncluster, the Kubernetes API server must be reconfigured accordingly. In this\ncase, restart Kubernetes API servers with the flag\n`--etcd-servers=$NEW_ETCD_CLUSTER` instead of the flag\n`--etcd-servers=$OLD_ETCD_CLUSTER`. Replace `$NEW_ETCD_CLUSTER` and\n`$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer is\nused in front of an etcd cluster, you might need to update the load balancer\ninstead.\n\n<mark id=\"f6\" class=\"hit\" data-i=\"6\" title=\"PSTE-D2: paragraph has 8 sentences, limit 6\">If</mark> the majority of etcd members have permanently failed, the etcd cluster is\nconsidered failed. In this scenario, Kubernetes cannot make any changes to its\ncurrent state. Although the scheduled pods might continue to run, no new pods\ncan be scheduled. In such cases, recover the etcd cluster and potentially\nreconfigure Kubernetes API servers to fix the issue.\n\n\n## Upgrading etcd clusters\n\nBefore you start an upgrade, back up your etcd cluster first.\n\nFor details on etcd upgrade, refer to the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor more details on etcd maintenance<mark id=\"f7\" class=\"hit\" data-i=\"7\" title=\"PSTE-P1: &#x27;please&#x27; is not the imperative form; write the instruction as a command\">,</mark> please refer to the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.\n", "factLoss": false, "fidelity": null, "semantic": [], "semanticConfirmed": 0}, "control": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 371, "findings": [{"rule": "PSTE-N3", "message": "contraction 'don't'", "excerpt": "The Kubernetes project also recommends restarting Kubernetes components ( CODE           ,", "line": 9, "column": 138, "excerpt_offset": 137, "severity": "MUST", "arbitrated": false, "offset": 340, "token": "don't"}, {"rule": "PSTE-V10", "message": "'should' is ambiguous; use can/may/must/is likely to", "excerpt": "When restoring with [ CODE    ]( URL                                                      ", "line": 15, "column": 140, "excerpt_offset": 136, "severity": "MUST", "arbitrated": false, "offset": 1017, "token": "should"}], "html": "## Restoring an etcd cluster\n\nDo not restore etcd while any API servers are running. Instead:\n\n- stop *all* API server instances\n- restore state in all etcd instances\n- restart all API server instances\n\nThe Kubernetes project also recommends restarting Kubernetes components (`kube-scheduler`, `kube-controller-manager`, `kubelet`) so they <mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-N3: contraction &#x27;don&#x27;t&#x27;\">don&#x27;t</mark> use stale data. The restore takes some time, and during it critical components lose their leader lock and restart themselves.\n\netcd can restore from snapshots taken by an etcd process of the same [major.minor](https://semver.org/) version. Restoring from a different patch version also works. Use a restore to recover the data of a failed cluster.\n\nYou need a snapshot file before you start. It can come from a previous backup, or from a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\n   When restoring with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use `--data-dir` to say where the cluster <mark id=\"f1\" class=\"hit\" data-i=\"1\" title=\"PSTE-V10: &#x27;should&#x27; is ambiguous; use can/may/must/is likely to\">should</mark> be restored:\n\n   ```shell\n   etcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n   `&lt;data-dir-location&gt;` is a directory that the restore process creates.\n\n\n   Using `etcdctl` to restore is **deprecated** as of etcd v3.5.x and will be removed in etcd v3.6. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\n   Here is the `etcdctl` version of the restore:\n\n   ```shell\n   export ETCDCTL_API=3\n   etcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n   ```\n\n   If `&lt;data-dir-location&gt;` is the same folder as before, delete it and stop the etcd process before you restore. Otherwise, point etcd at the new data directory and restart it after the restore: first set `volumes.hostPath.path` for `name: etcd-data` in `/etc/kubernetes/manifests/etcd.yaml` to `&lt;data-dir-location&gt;`, then run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;` or `systemctl restart kubelet.service` (or both).\n\n\nFor more information and examples on restoring a cluster from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the restored cluster&#x27;s access URLs differ from the old ones, reconfigure the Kubernetes API server to match. Restart the API servers with `--etcd-servers=$NEW_ETCD_CLUSTER` instead of `--etcd-servers=$OLD_ETCD_CLUSTER`, replacing `$NEW_ETCD_CLUSTER` and `$OLD_ETCD_CLUSTER` with the respective IP addresses. If a load balancer sits in front of the etcd cluster, you may need to update the load balancer instead.\n\nThe etcd cluster is considered failed once most of its members have permanently failed. Kubernetes then cannot change its current state: already-scheduled pods may keep running, but no new pods can be scheduled. To fix this, recover the etcd cluster and, if needed, reconfigure the Kubernetes API servers.\n\n\n## Upgrading etcd clusters\n\nBack up your etcd cluster before you start an upgrade.\n\nFor details, see the [etcd upgrades](https://etcd.io/docs/latest/upgrades/) documentation.\n\n## Maintaining etcd clusters\n\nFor details, see the [etcd maintenance](https://etcd.io/docs/latest/op-guide/maintenance/) documentation.", "factLoss": true, "fidelity": {"source_words": 595, "rewrite_words": 498, "findings": [{"kind": "scope", "severity": "critical", "message": "a statement about all cases became one about some cases (every/all 5 -> 4, some/most 1 -> 2)."}], "critical": 1, "warnings": 0, "faithful": false}, "semantic": [], "semanticConfirmed": 0}, "pste": {"missing": false, "unjudged": true, "sampledOut": true, "pass": false, "words": 456, "findings": [{"rule": "PSTE-P1", "message": "'you must' is not the imperative form; write the instruction as a command", "excerpt": "If the access URLs of the restored cluster differ from the URLs of the previous cluster, y", "line": 41, "column": 88, "excerpt_offset": 87, "severity": "MUST", "arbitrated": false, "offset": 2586, "token": ","}], "html": "## Restoring an etcd cluster\n\nDo not restore an etcd instance while any API server runs in the cluster. Follow these steps instead:\n\n1. Stop **all** API server instances.\n2. Restore the state in all etcd instances.\n3. Restart all API server instances.\n\nThe Kubernetes project also recommends that you restart `kube-scheduler`, `kube-controller-manager`, and `kubelet`. The restart makes sure that these components do not use stale data. The restore takes some time. During the restore, critical components lose the leader lock and restart themselves.\n\netcd can restore from a snapshot that an etcd process of the same [major.minor](https://semver.org/) version took. etcd can also restore from a snapshot that a different patch version took. You use a restore operation to recover the data of a failed cluster.\n\nYou need a snapshot file before you start the restore operation. The file comes from a previous backup operation, or from a remaining [data directory](https://etcd.io/docs/current/op-guide/configuration/#--data-dir).\n\nWhen you restore the cluster with [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md), use the `--data-dir` option to name the folder that receives the restored cluster:\n\n```shell\netcdutl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nHere `&lt;data-dir-location&gt;` is a directory that the restore process creates.\n\n`etcdctl` for a restore is **deprecated** since etcd v3.5.x, and etcd v3.6 is planned to remove it. Use [`etcdutl`](https://github.com/etcd-io/etcd/blob/main/etcdutl/README.md) instead.\n\nThis example shows the `etcdctl` tool for the restore operation:\n\n```shell\nexport ETCDCTL_API=3\netcdctl --data-dir &lt;data-dir-location&gt; snapshot restore snapshot.db\n```\n\nIf `&lt;data-dir-location&gt;` is the same folder as before, delete that folder and stop the etcd process before you restore the cluster. Deleting the folder loses every file in it.\n\nOtherwise, change the etcd configuration and restart the etcd process after the restore, so that it uses the new data directory. Follow these steps:\n\n1. In `/etc/kubernetes/manifests/etcd.yaml`, change `volumes.hostPath.path` for `name: etcd-data` to `&lt;data-dir-location&gt;`.\n2. Run `kubectl -n kube-system delete pod &lt;name-of-etcd-pod&gt;`, or run `systemctl restart kubelet.service`, or run both.\n\nFor more information and examples about a restore from a snapshot file, see the [etcd disaster recovery documentation](https://etcd.io/docs/current/op-guide/recovery/#restoring-a-cluster).\n\nIf the access URLs of the restored cluster differ from the URLs of the previous cluster<mark id=\"f0\" class=\"hit\" data-i=\"0\" title=\"PSTE-P1: &#x27;you must&#x27; is not the imperative form; write the instruction as a command\">,</mark> you must reconfigure the Kubernete
