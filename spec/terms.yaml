# PSTE-1 Appendix B source of truth.
#
# Terms are words OUTSIDE the approved list that a writer MAY use because they name
# something in software that plain English cannot name accurately. PSTE-V5 constrains
# them: if an approved word says it accurately, use the approved word.
#
# The example lists are illustrative, not exhaustive. A word belongs to a category if
# it fits the category description, whether or not the example list names it.

meta:
  spec: PSTE-1
  version: 0.1.0

# Common domain nouns.
#
# NOT a permission list, and NOT exhaustive. A word absent from here is not thereby
# forbidden: PSTE-V1 leaves the judgement to the writer, because no list reaches the
# tail. `mempool`, `clvm`, and `gopls` are real vocabulary in their projects and will
# never appear here.
#
# This exists so a tool has a lookup for the vocabulary that EVERY programmer shares.
# Its only job is to stop a checker reporting `cache` or `latency` as unusual.
# Growing it toward one project's words is the failure mode: stop at the common core.
