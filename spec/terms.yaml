term_verbs:
  # PSTE-V6: a term verb MUST NOT be used as a noun. Write "I deployed the service"
  # or "I made a deployment", never "I did a deploy".

  - id: BV1
    name: Version control and delivery
    verbs: [commit, branch, clone, merge, rebase, cherry-pick, revert, tag, release,
            deploy, roll back, promote, ship, deprecate, backport]

  - id: BV2
    name: Program construction
    verbs: [compile, build, link, refactor, rename, extract, inline, instantiate,
            override, implement, subclass, serialize, deserialize, parse, encode,
            decode, validate, sanitize, escape]

  - id: BV3
    name: Runtime operations
    verbs: [run, execute, boot, reboot, restart, install, uninstall, upgrade, migrate,
            provision, scale, throttle, retry, timeout, cache, invalidate, flush,
            queue, poll, subscribe, publish]

  - id: BV4
    name: Data operations
    verbs: [query, insert, update, delete, drop, truncate, index, join, filter, sort,
            aggregate, backup, restore, replicate, shard]

  - id: BV5
    name: Testing and diagnosis
    verbs: [test, assert, mock, stub, profile, trace, debug, reproduce, bisect, lint,
            benchmark]

  - id: BV6
    name: Interface operations
    description: Actions a user performs on a user interface.
    verbs: [click, tap, swipe, type, enter, press, select, deselect, drag, drop, scroll,
            zoom, copy, cut, paste, save, open, close, render]

  - id: BV7
    name: Security operations
    verbs: [authenticate, authorize, encrypt, decrypt, sign, verify, hash, rotate,
            revoke, grant, audit]
    note: >
      `verify` is approved here ONLY in its cryptographic sense, such as verifying a
      signature. For ordinary inspection use the approved word `check`. See PSTE-V2.
