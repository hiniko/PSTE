hedges:
  # PSTE-L1. Permitted once per claim, never stacked.
  - might
  - may
  - could
  - possibly
  - perhaps
  - probably
  - likely
  - seems
  - appears
  - suggests
  - I think
  - I believe
  - it is possible that
  - to some extent
  - more or less
  - it would seem
  - one might argue
  - in some cases
  - generally speaking
  - as far as I know
  - to a degree
  - somewhat likely
  - in a sense

response_frames:
  # PSTE-L5. A frame announces or closes a response and states no fact. Delete it.
  # Position matters: these are findings at the start or the end of a text, not
  # everywhere. `pste_lint.py` applies that restriction; the list is only the phrases.
  #
  # openers
  - great question
  - good question
  - excellent question
  - that is a great question
  - let me look into that
  - let me start by
  - let me explain
  - let me help
  - i will start by
  - i would be happy to
  - happy to help
  - to answer your question
  - as an ai
  - sure thing
  - certainly
  - of course
  - absolutely
  - looking at your
  # closers
  - let me know if you need anything else
  - let me know if you have any questions
  - let me know if that helps
  - hope this helps
  - hope that helps
  - i hope this helps
  - feel free to ask
  - feel free to reach out
  - do not hesitate to ask
  - happy to clarify
  - anything else
  - is there anything else
