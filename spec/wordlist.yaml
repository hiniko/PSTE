american_british:
  # PSTE-V7. British spelling -> American spelling. Covers the common pairs: -ise/
  # -ize, -isation/-ization, -our/-or, -re/-er, -ce/-se, -ogue/-og, doubled-l.
  # A literal list, the same shape as latin_abbreviations above, because a suffix
  # rule would also rewrite a word that is not a British/American pair at all
  # (e.g. "centre" and "centre stage" share -re but "acre" is not a spelling
  # variant of anything).
  organise: organize
  organised: organized
  organises: organizes
  organising: organizing
  organisation: organization
  organisations: organizations
  recognise: recognize
  recognised: recognized
  recognises: recognizes
  recognising: recognizing
  realise: realize
  realised: realized
  realises: realizes
  realising: realizing
  optimise: optimize
  optimised: optimized
  optimises: optimizes
  optimising: optimizing
  customise: customize
  customised: customized
  customises: customizes
  customising: customizing
  initialise: initialize
  initialised: initialized
  initialises: initializes
  initialising: initializing
  serialise: serialize
  serialised: serialized
  serialises: serializes
  serialising: serializing
  authorise: authorize
  authorised: authorized
  authorises: authorizes
  authorising: authorizing
  minimise: minimize
  minimised: minimized
  minimises: minimizes
  minimising: minimizing
  maximise: maximize
  maximised: maximized
  maximises: maximizes
  maximising: maximizing
  standardise: standardize
  standardised: standardized
  standardises: standardizes
  standardising: standardizing
  synchronise: synchronize
  synchronised: synchronized
  synchronises: synchronizes
  synchronising: synchronizing
  colour: color
  colours: colors
  coloured: colored
  colouring: coloring
  behaviour: behavior
  behaviours: behaviors
  behavioural: behavioral
  favour: favor
  favours: favors
  favoured: favored
  favourite: favorite
  neighbour: neighbor
  neighbours: neighbors
  labour: labor
  labours: labors
  laboured: labored
  centre: center
  centres: centers
  centred: centered
  metre: meter
  metres: meters
  fibre: fiber
  fibres: fibers
  litre: liter
  litres: liters
  theatre: theater
  theatres: theaters
  licence: license
  licences: licenses
